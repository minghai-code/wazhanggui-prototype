<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大唐袜业产业数字化综合服务平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Microsoft YaHei','PingFang SC','Helvetica Neue',Arial,sans-serif;
  background:#0F0F1A;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}
/* Animated background */
.bg-wrapper{position:fixed;inset:0;z-index:0;overflow:hidden}
.bg-wrapper::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,#1A1A2E 0%,#16213E 40%,#0F3460 100%);
}
.bg-wrapper::after{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,77,45,0.08) 0%,transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(15,52,96,0.15) 0%,transparent 50%),
    radial-gradient(circle at 50% 50%,rgba(255,77,45,0.03) 0%,transparent 70%);
}
.bg-grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);
  background-size:60px 60px;
}
.bg-orb{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:0.15;
  animation:float 20s ease-in-out infinite;
}
.bg-orb-1{width:400px;height:400px;background:#FF4D2D;top:-100px;left:-100px}
.bg-orb-2{width:350px;height:350px;background:#0F3460;bottom:-80px;right:-80px;animation-delay:-10s}
@keyframes float{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(30px,-30px)}
}

/* Main container */
.container{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:40px 24px 60px}

/* Header */
.header{text-align:center;margin-bottom:48px;animation:fadeInDown 0.8s ease}
.header .logo{
  display:inline-flex;align-items:center;gap:12px;margin-bottom:16px;
}
.header .logo-icon{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(135deg,#FF4D2D 0%,#FF8E53 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;color:#fff;
  box-shadow:0 8px 32px rgba(255,77,45,0.3);
}
.header h1{
  font-size:32px;font-weight:700;
  background:linear-gradient(135deg,#fff 0%,#FF8E53 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  letter-spacing:2px;
}
.header .subtitle{
  font-size:14px;color:rgba(255,255,255,0.5);margin-top:8px;
  letter-spacing:3px;text-transform:uppercase;
}
.header .badge{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:16px;padding:6px 16px;
  background:rgba(255,77,45,0.1);border:1px solid rgba(255,77,45,0.3);
  border-radius:20px;font-size:12px;color:#FF8E53;
}
.header .badge i{font-size:8px;color:#FF4D2D;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* Portal grid */
.portal-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:20px;
  animation:fadeInUp 0.8s ease 0.2s both;
}

/* Portal card */
.portal-card{
  position:relative;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
  backdrop-filter:blur(10px);
}
.portal-card:hover{
  transform:translateY(-6px);
  border-color:rgba(255,77,45,0.3);
  box-shadow:0 20px 40px rgba(0,0,0,0.3),0 0 0 1px rgba(255,77,45,0.1);
  background:rgba(255,255,255,0.06);
}
.portal-card .card-top{
  padding:24px 24px 16px;
  position:relative;
}
.portal-card .card-number{
  position:absolute;top:16px;right:20px;
  font-size:48px;font-weight:900;
  color:rgba(255,255,255,0.05);
  line-height:1;
}
.portal-card .card-icon{
  width:52px;height:52px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:#fff;
  margin-bottom:16px;
}
.portal-card .card-title{
  font-size:17px;font-weight:700;color:#fff;margin-bottom:4px;
}
.portal-card .card-subtitle{
  font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;
  letter-spacing:1px;
}
.portal-card .card-desc{
  font-size:13px;color:rgba(255,255,255,0.55);line-height:1.7;
  padding:0 24px 20px;
}
.portal-card .card-footer{
  padding:12px 24px;
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:space-between;
}
.portal-card .card-status{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;padding:3px 10px;border-radius:10px;
}
.status-dev{background:rgba(76,175,80,0.12);color:#4CAF50;border:1px solid rgba(76,175,80,0.2)}
.status-undev{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.08)}
.portal-card .card-arrow{
  width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:rgba(255,255,255,0.4);
  transition:all 0.3s;
}
.portal-card:hover .card-arrow{
  background:rgba(255,77,45,0.15);color:#FF4D2D;
  transform:translateX(4px);
}

/* Gradient themes for icons */
.theme-1{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
.theme-2{background:linear-gradient(135deg,#FF4D2D 0%,#FF8E53 100%)}
.theme-3{background:linear-gradient(135deg,#11998e 0%,#38ef7d 100%)}
.theme-4{background:linear-gradient(135deg,#7F00FF 0%,#E100FF 100%)}
.theme-5{background:linear-gradient(135deg,#00B4DB 0%,#0083B0 100%)}
.theme-6{background:linear-gradient(135deg,#f093fb 0%,#f5576c 100%)}
.theme-7{background:linear-gradient(135deg,#4facfe 0%,#00f2fe 100%)}
.theme-8{background:linear-gradient(135deg,#FFA800 0%,#FF6B00 100%)}
.theme-9{background:linear-gradient(135deg,#FF4D2D 0%,#764ba2 100%)}

/* Architecture Modal */
.arch-modal-box{
  background:linear-gradient(145deg,#1e1e36 0%,#171729 100%);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  width:1040px;max-width:95vw;max-height:88vh;
  display:flex;flex-direction:column;
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
  transform:scale(0.9);transition:transform 0.3s ease;overflow:hidden;
}
.modal-overlay.show .arch-modal-box{transform:scale(1)}
/* Full-screen architecture view (no centered modal, to use full screen space) */
.arch-fullscreen{padding:0;align-items:stretch;justify-content:flex-start}
.arch-fs-box{width:100vw;height:100vh;max-width:none;max-height:none;border-radius:0;border:none}
.arch-fullscreen .arch-modal-box{transform:none}
.arch-fs-box .arch-content{flex:1;min-height:0}
.arch-fs-box .arch-header{padding-right:56px}
.arch-header{display:flex;align-items:center;gap:14px;padding:22px 26px;border-bottom:1px solid rgba(255,255,255,0.07);justify-content:space-between}
.arch-icon{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#FF4D2D,#FF8E53);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.arch-title{font-size:18px;font-weight:700;color:#fff}
.arch-sub{font-size:12px;color:rgba(255,255,255,0.4);margin-top:2px}
.arch-content{padding:18px 26px 26px;overflow:auto}
.arch-loading{color:rgba(255,255,255,0.5);font-size:13px;padding:20px;text-align:center}
.arch-error{color:#f44336;font-size:13px;padding:12px;line-height:1.8;background:rgba(244,67,54,0.06);border-radius:8px}

/* Toggle group (mind map / list) */
.arch-head-left{display:flex;align-items:center;gap:14px}
.arch-toggle-group{display:flex;background:rgba(255,255,255,0.06);border-radius:10px;padding:4px;gap:4px;flex-shrink:0}
.arch-tab{border:none;background:transparent;color:rgba(255,255,255,0.55);font-size:13px;padding:7px 14px;border-radius:7px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.arch-tab:hover{color:rgba(255,255,255,0.85)}
.arch-tab.active{background:linear-gradient(135deg,#FF4D2D,#FF8E53);color:#fff;box-shadow:0 4px 12px rgba(255,77,45,0.3)}
.arch-tab i{font-size:12px}

/* Back to portal button (top-left, like other systems) */
.arch-back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:7px 12px;color:rgba(255,255,255,0.85);font-size:13px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.arch-back:hover{background:rgba(255,77,45,0.12);color:#FF8E53;border-color:rgba(255,142,83,0.3)}

/* Search box in architecture header */
.arch-search{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 11px;min-width:210px}
.arch-search i{color:rgba(255,255,255,0.4);font-size:12px;flex-shrink:0}
.arch-search input{border:none;background:transparent;color:#fff;font-size:13px;outline:none;width:150px}
.arch-search input::placeholder{color:rgba(255,255,255,0.35)}
.arch-search-count{color:#FF8E53;font-size:12px;white-space:nowrap;min-width:34px;text-align:right}
/* Search highlight (mind map) */
.mm-card.mm-hit{outline:2px solid #FFD166;box-shadow:0 0 0 3px rgba(255,209,102,0.35);z-index:2}
.mm-card.mm-dim{opacity:0.28}
.mm-card.mm-flash{animation:mmflash 0.6s ease}
@keyframes mmflash{0%{box-shadow:0 0 0 7px rgba(255,209,102,0.6)}100%{box-shadow:0 0 0 3px rgba(255,209,102,0.35)}}
/* Search highlight (table) */
.arch-table td.td-hit{background:rgba(255,209,102,0.22);color:#FFE9B0 !important}

/* ===== Mind-map style (XMind-like: cards + bezier links) ===== */
.mm-canvas{position:relative;min-width:100%;display:inline-block;padding:8px}
.mm-node{display:flex;flex-direction:row;align-items:center}
.mm-children{display:flex;flex-direction:column;justify-content:center;gap:12px;padding-left:36px}
.mm-card{position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,0.25);cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid rgba(255,255,255,0.12);user-select:none}
.mm-card:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,0.35)}
.mm-lv0{background:linear-gradient(135deg,#FF4D2D,#FF8E53);font-size:15px;font-weight:800}
.mm-lv1{background:linear-gradient(135deg,#FF7A45,#FFB066)}
.mm-lv2{background:linear-gradient(135deg,#3B82F6,#60A5FA)}
.mm-lv3{background:linear-gradient(135deg,#10B981,#34D399)}
.mm-lv4{background:linear-gradient(135deg,#8B5CF6,#A78BFA)}
.mm-lv5{background:linear-gradient(135deg,#64748B,#94A3B8)}
.mm-text{line-height:1.3}
.mm-toggle{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,0.28);font-size:12px;line-height:1;margin-left:2px;flex-shrink:0;font-weight:700}
.mm-links{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}
.mm-link{fill:none;stroke:rgba(255,255,255,0.28);stroke-width:1.5}

/* ===== List (Excel table) style ===== */
.arch-table{width:100%;border-collapse:collapse;font-size:13px;background:rgba(255,255,255,0.02);border-radius:8px;overflow:hidden}
.arch-table th,.arch-table td{border:1px solid rgba(255,255,255,0.08)}
.arch-table thead th{position:sticky;top:0;background:#2a2a44;color:#FF8E53;font-weight:700;text-align:left;padding:9px 12px;border-bottom:2px solid rgba(255,142,83,0.4);white-space:nowrap;z-index:1}
.arch-table tbody td{padding:7px 12px;color:rgba(255,255,255,0.85);vertical-align:top}
.arch-table tbody tr:nth-child(even){background:rgba(255,255,255,0.02)}
.arch-table tbody tr:hover{background:rgba(255,142,83,0.08)}
.arch-table .col-idx{color:rgba(255,255,255,0.4);font-family:consolas,monospace;width:44px;text-align:right}
.arch-table td[rowspan]{vertical-align:middle}

/* Login Modal */
.modal-overlay{
  position:fixed;inset:0;z-index:9999;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.3s ease;
}
.modal-overlay.show{display:flex;opacity:1}
.modal-box{
  background:linear-gradient(145deg,#1e1e36 0%,#171729 100%);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  padding:40px;width:400px;max-width:90vw;
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
  transform:scale(0.9);transition:transform 0.3s ease;
  position:relative;
}
.modal-overlay.show .modal-box{transform:scale(1)}
.modal-close{
  position:absolute;top:16px;right:16px;
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,0.06);border:none;color:rgba(255,255,255,0.5);
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.modal-close:hover{background:rgba(255,77,45,0.15);color:#FF4D2D}
.modal-header{text-align:center;margin-bottom:28px}
.modal-header .modal-icon{
  width:60px;height:60px;border-radius:16px;
  background:linear-gradient(135deg,#FF4D2D 0%,#FF8E53 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;margin:0 auto 16px;
  box-shadow:0 8px 24px rgba(255,77,45,0.3);
}
.modal-header h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.modal-header p{font-size:13px;color:rgba(255,255,255,0.4)}
.modal-target{
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;margin-bottom:20px;
  background:rgba(255,77,45,0.08);border:1px solid rgba(255,77,45,0.15);
  border-radius:10px;font-size:13px;color:#FF8E53;
}
.form-group{margin-bottom:18px}
.form-group label{
  display:block;font-size:13px;color:rgba(255,255,255,0.6);
  margin-bottom:6px;font-weight:500;
}
.form-group .input-wrap{
  position:relative;
}
.form-group .input-wrap i{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  color:rgba(255,255,255,0.3);font-size:14px;
}
.form-group input{
  width:100%;padding:12px 14px 12px 40px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;color:#fff;font-size:14px;
  transition:all 0.3s;outline:none;
}
.form-group input::placeholder{color:rgba(255,255,255,0.25)}
.form-group input:focus{
  border-color:rgba(255,77,45,0.4);
  background:rgba(255,77,45,0.04);
  box-shadow:0 0 0 3px rgba(255,77,45,0.08);
}
.form-error{
  display:none;align-items:center;gap:6px;
  padding:10px 14px;margin-bottom:16px;
  background:rgba(244,67,54,0.08);border:1px solid rgba(244,67,54,0.2);
  border-radius:8px;font-size:13px;color:#f44336;
}
.form-error.show{display:flex}
.btn-login{
  width:100%;padding:13px;
  background:linear-gradient(135deg,#FF4D2D 0%,#FF6B47 100%);
  border:none;border-radius:10px;color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;
  transition:all 0.3s;letter-spacing:1px;
  box-shadow:0 4px 16px rgba(255,77,45,0.3);
}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(255,77,45,0.4)}
.btn-login:active{transform:translateY(0)}
.btn-login:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.modal-footer{
  text-align:center;margin-top:18px;
  font-size:12px;color:rgba(255,255,255,0.3);
}

/* Undeveloped modal */
.undev-modal-box{
  background:linear-gradient(145deg,#1e1e36 0%,#171729 100%);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;
  padding:40px;width:380px;max-width:90vw;text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
  transform:scale(0.9);transition:transform 0.3s ease;
}
.modal-overlay.show .undev-modal-box{transform:scale(1)}
.undev-icon{
  width:72px;height:72px;border-radius:50%;
  background:rgba(255,193,7,0.1);
  border:2px solid rgba(255,193,7,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;color:#FFC107;margin:0 auto 20px;
}
.undev-modal-box h2{font-size:18px;font-weight:700;color:#fff;margin-bottom:8px}
.undev-modal-box p{font-size:14px;color:rgba(255,255,255,0.5);line-height:1.7;margin-bottom:24px}
.btn-close-undev{
  padding:10px 32px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:8px;color:rgba(255,255,255,0.7);
  font-size:14px;cursor:pointer;transition:all 0.2s;
}
.btn-close-undev:hover{background:rgba(255,255,255,0.1);color:#fff}

/* Footer */
.footer{
  text-align:center;padding:32px 0 0;
  border-top:1px solid rgba(255,255,255,0.06);
  margin-top:48px;
}
.footer p{font-size:12px;color:rgba(255,255,255,0.3);line-height:1.8}
.footer p:first-child{color:rgba(255,255,255,0.45)}

/* Animations */
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Loading spinner */
.spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,0.2);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin 0.6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-wrapper">
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
</div>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-industry"></i></div>
    </div>
    <h1>大唐袜业产业数字化综合服务平台</h1>
    <div class="subtitle">DATANG HOSIERY INDUSTRY DIGITAL PLATFORM</div>
    <div class="badge">
      <i class="fas fa-circle"></i>
      <span>演示版本 V1.1 · 8个功能入口</span>
    </div>
  </div>

  <!-- Portal Grid -->
  <div class="portal-grid" id="portalGrid"></div>

  <!-- Footer -->
  <div class="footer">
    <p>大唐袜业产业数字化综合服务平台 · 袜掌柜</p>
    <p>技术支持：华苑科技 © 2026 All Rights Reserved</p>
  </div>
</div>

<!-- Login Modal -->
<div class="modal-overlay" id="loginModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('loginModal')"><i class="fas fa-times"></i></button>
    <div class="modal-header">
      <div class="modal-icon"><i class="fas fa-lock"></i></div>
      <h2>系统登录</h2>
      <p>请输入演示账号登录系统</p>
    </div>
    <div class="modal-target" id="loginTarget">
      <i class="fas fa-arrow-right-long"></i>
      <span></span>
    </div>
    <div class="form-error" id="loginError">
      <i class="fas fa-circle-exclamation"></i>
      <span>用户名或密码错误，请重试</span>
    </div>
    <div class="form-group">
      <label>登录账号</label>
      <div class="input-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="loginUser" placeholder="请输入登录账号" autocomplete="off">
      </div>
    </div>
    <div class="form-group">
      <label>登录密码</label>

// ---------- Mind-map (XMind-like: cards + bezier links) ----------
function renderMindMap(root, container) {
  var canvas = document.createElement('div');
  canvas.className = 'mm-canvas';
  var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'mm-links');
  canvas.appendChild(svg);
  var tree = document.createElement('div');
  tree.className = 'mm-tree';
  canvas.appendChild(tree);

  var rn = (root.children && root.children.length === 1)
    ? root.children[0]
    : { title: '系统功能架构', children: root.children };

  tree.appendChild(buildMindNode(rn, 0));
  container.appendChild(canvas);
  _mmCanvas = canvas; _mmSvg = svg;

  if (!_resizeBound) {
    _resizeBound = true;
    window.addEventListener('resize', function() {
      if (_archMode === 'mind' && _mmCanvas) drawMindMapLinks();
    });
  }
  requestAnimationFrame(function() { drawMindMapLinks(); });
}

function buildMindNode(node, depth) {
  node._depth = depth;
  var wrap = document.createElement('div');
  wrap.className = 'mm-node';
  var card = document.createElement('div');
  card.className = 'mm-card mm-lv' + Math.min(depth, 5);
  var txt = document.createElement('span');
  txt.className = 'mm-text';
  txt.textContent = node.title;
  card.appendChild(txt);
  wrap.appendChild(card);

  var hasKids = node.children && node.children.length;
  if (hasKids) {
    var tog = document.createElement('span');
    tog.className = 'mm-toggle';
    tog.textContent = '−';
    card.appendChild(tog);
    var kids = document.createElement('div');
    kids.className = 'mm-children';
    node.children.forEach(function(ch) { kids.appendChild(buildMindNode(ch, depth + 1)); });
    wrap.appendChild(kids);
    node._card = card;
    node._childrenBox = kids;
    node._collapsed = depth >= 3;
    if (node._collapsed) { kids.style.display = 'none'; tog.textContent = '+'; }
    tog.addEventListener('click', function(e) { e.stopPropagation(); toggleMindNode(node); });
    card.addEventListener('click', function() { toggleMindNode(node); });
  } else {
    node._card = card;
    node._childrenBox = null;
  }
  _allNodes.push(node);
  return wrap;
}

function toggleMindNode(node) {
  if (!node._childrenBox) return;
  node._collapsed = !node._collapsed;
  node._childrenBox.style.display = node._collapsed ? 'none' : 'flex';
  var tog = node._card.querySelector('.mm-toggle');
  if (tog) tog.textContent = node._collapsed ? '+' : '−';
  requestAnimationFrame(function() { drawMindMapLinks(); });
}

function drawMindMapLinks() {
  if (!_mmSvg || !_mmCanvas) return;
  while (_mmSvg.firstChild) _mmSvg.removeChild(_mmSvg.firstChild);
  var base = _mmCanvas.getBoundingClientRect();
  var W = _mmCanvas.offsetWidth, H = _mmCanvas.offsetHeight;
  _mmSvg.setAttribute('width', W);
  _mmSvg.setAttribute('height', H);
  _mmSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  _allNodes.forEach(function(n) {
    if (!n._childrenBox || n._collapsed) return;
    var pr = n._card.getBoundingClientRect();
    var x1 = pr.right - base.left;
    var y1 = (pr.top + pr.bottom) / 2 - base.top;
    n.children.forEach(function(c) {
      if (!c._card) return;
      var cr = c._card.getBoundingClientRect();
      var x2 = cr.left - base.left;
      var y2 = (cr.top + cr.bottom) / 2 - base.top;
      var dx = Math.max(30, (x2 - x1) / 2);
      var d = 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2;
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'mm-link');
      _mmSvg.appendChild(path);
    });
  });
}

function clearSearchHits() {
  document.querySelectorAll('.mm-card.mm-hit').forEach(function(e) { e.classList.remove('mm-hit'); });
  document.querySelectorAll('.mm-card.mm-dim').forEach(function(e) { e.classList.remove('mm-dim'); });
  document.querySelectorAll('.mm-card.mm-flash').forEach(function(e) { e.classList.remove('mm-flash'); });
  document.querySelectorAll('.arch-table td.td-hit').forEach(function(e) { e.classList.remove('td-hit'); });

function applySearch(term) {
  _searchTerm = (term || '').trim();
  clearSearchHits();
  var cnt = document.getElementById('archSearchCount');
  if (!_searchTerm) {
    if (cnt) cnt.textContent = '';
    _hits = []; _hitIndex = 0;
    // 退出搜索时仅清除高亮/淡出，不收起节点、不改变滚动位置，停留在当前查看处
    return;
  }
  if (_archMode === 'mind') expandAllMind();
  var q = _searchTerm.toLowerCase();
  _hits = [];
  if (_archMode === 'mind') {
    document.querySelectorAll('.mm-card').forEach(function(card) {
      var tEl = card.querySelector('.mm-text');
      var t = (tEl ? tEl.textContent : card.textContent).toLowerCase();
      if (t.indexOf(q) >= 0) { card.classList.add('mm-hit'); _hits.push(card); }
      else { card.classList.add('mm-dim'); }
    });
  } else {
    document.querySelectorAll('.arch-table tbody td').forEach(function(td) {
      if (td.textContent.toLowerCase().indexOf(q) >= 0) { td.classList.add('td-hit'); _hits.push(td); }
    });
  }
  if (cnt) cnt.textContent = _hits.length ? ('1/' + _hits.length) : '无匹配';
  _hitIndex = 0;
  if (_hits.length) highlightHit(_hits[0]);
  requestAnimationFrame(function() { if (_archMode === 'mind') drawMindMapLinks(); });
}

function highlightHit(el) {
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  el.classList.remove('mm-flash');
  void el.offsetWidth;
  el.classList.add('mm-flash');
}

function archSearchNext() {
  if (!_hits.length) return;
  _hitIndex = (_hitIndex + 1) % _hits.length;
  var cnt = document.getElementById('archSearchCount');
  if (cnt) cnt.textContent = (_hitIndex + 1) + '/' + _hits.length;
  highlightHit(_hits[_hitIndex]);
}

// ---------- List (Excel table) ----------
function renderTable(root, container) {
  // 以「端」为表格起点（忽略最顶层的平台名，避免每行列都相同）
  var rn = (root.children && root.children.length === 1)
    ? root.children[0]
    : { title: '系统功能架构', children: root.children };

  var rows = [];
  (rn.children || []).forEach(function(top) { walk(top, []); });
  function walk(node, ancestors) {
    rows.push(ancestors.concat([node.title]));
    (node.children || []).forEach(function(c) { walk(c, ancestors.concat([node.title])); });
  }

  var nCols = 0;
  rows.forEach(function(r) { if (r.length > nCols) nCols = r.length; });

  // 列标题：端口 -> 一级功能 -> 二级功能 -> 三级功能 -> ...
  var labels = ['端口', '一级功能', '二级功能', '三级功能', '四级功能', '五级功能', '六级功能', '七级功能'];
  function labelFor(j) { return labels[j] || ((j + 1) + '级功能'); }

  // 合并：同列、且到该列为止的前缀都相同的连续单元格合并（rowspan）
  var skip = [], spanG = [];
  for (var i = 0; i < rows.length; i++) { skip[i] = []; spanG[i] = []; }
  function prefixEq(a, b, j) {
    for (var t = 0; t <= j; t++) { if ((a[t] || '') !== (b[t] || '')) return false; }
    return true;
  }
  for (var j = 0; j < nCols; j++) {
    var i = 0;
    while (i < rows.length) {
      var k = i + 1;
      while (k < rows.length && prefixEq(rows[k], rows[i], j)) k++;
      var span = k - i;
      if (span > 1) {
        spanG[i][j] = span;
        for (var r = i + 1; r < k; r++) skip[r][j] = true;
      }
      i = k;
    }
  }

  var table = document.createElement('table');
  table.className = 'arch-table';
  var thead = document.createElement('thead');
  var htr = document.createElement('tr');
  htr.appendChild(mkTh('序号'));
  for (var j = 0; j < nCols; j++) htr.appendChild(mkTh(labelFor(j)));
  thead.appendChild(htr);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  rows.forEach(function(r, idx) {
    var tr = document.createElement('tr');
    var idxTd = document.createElement('td');
    idxTd.className = 'col-idx';
    idxTd.textContent = String(idx + 1);
    tr.appendChild(idxTd);
    for (var j = 0; j < nCols; j++) {
      if (skip[idx][j]) continue;
      var td = document.createElement('td');
      td.textContent = r[j] || '';
      td.className = 'lv' + Math.min(j + 1, 5);
      if (spanG[idx][j] > 1) td.setAttribute('rowspan', spanG[idx][j]);
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  container.appendChild(table);

  function mkTh(t) { var e = document.createElement('th'); e.textContent = t; return e; }
}

function parseMd(text) {
  var lines = text.split(/\r?\n/);
  var root = { children: [] };
  // stack holds {node, level}; root level = 0
  var stack = [{ node: root, level: 0 }];
  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i];
    if (!raw.trim()) continue;
    var tm = raw.match(/^(#+)\s+(.*)$/);
    if (tm) {
      var lvl = tm[1].length;
      var node = { title: tm[2].trim(), children: [] };
      while (stack.length > 1 && stack[stack.length - 1].level >= lvl) stack.pop();
      stack[stack.length - 1].node.children.push(node);
      stack.push({ node: node, level: lvl });
      continue;
    }
    var lm = raw.match(/^(\t*)[-]\s+(.*)$/);
    if (lm) {
      var tabs = lm[1].length;
      var target = 4 + tabs; // list hangs under ### (lvl3) -> first list at lvl4
      var n = { title: lm[2].trim(), children: [] };
      while (stack.length > 1 && stack[stack.length - 1].level >= target) stack.pop();
      stack[stack.length - 1].node.children.push(n);
      stack.push({ node: n, level: target });
    }
  }
  return root;
}

async function loadArchContent() {
  var box = document.getElementById('archTree');
  var text = null;
  // Prefer embedded base64 data (works under file:// too)
  if (window.__ARCH_B64__) {
    try {
      var bin = atob(window.__ARCH_B64__);
      var arr = Uint8Array.from(bin, function(c) { return c.charCodeAt(0); });
      text = new TextDecoder('utf-8').decode(arr);
    } catch (e) { text = null; }
  }
  // Fallback to fetch (needs http server)
  if (!text) {
    try {
      var resp = await fetch('./system-architecture.md', { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      text = await resp.text();
    } catch (e) {
      box.innerHTML = '<div class="arch-error">架构文件加载失败：' + e.message +
        '<br><br>请确认 arch-data.js 与本页面在同一目录，或通过本地 HTTP 服务访问（如 <code>python -m http.server 8080</code>）。</div>';
      return;
    }
  }
  try {
    _archTree = parseMd(text);
    renderArchView();
  } catch (e) {
    box.innerHTML = '<div class="arch-error">架构解析失败：' + e.message + '</div>';
  }
}
</script>
