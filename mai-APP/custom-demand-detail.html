.spec span:last-child{color:#2A2F3A;font-weight:600}

.q.win{border-color:#FF4D2D;box-shadow:0 6px 18px rgba(255,77,45,.12)}

.t-noded{color:#9A3412;background:#FFEDD5}
.price{font-size:19px;font-weight:900;color:#FF4D2D;line-height:1}
.price small{font-size:10px;font-weight:600}
.mask{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:200}
.mask.on{display:flex}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);background:rgba(0,0,0,.82);color:#fff;font-size:12px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:78%;text-align:center;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  if(q.sample==='free')return '<span class="tag t-free">样品免费</span>';
  if(q.sample==='ded')return '<span class="tag t-ded">样品 ¥'+q.fee+'，可抵</span>';
  return '<span class="tag t-noded">样品 ¥'+q.fee+'，不可抵</span>';
}

    h+='<div class="px-3 mt-2.5" id="qlist">'+renderQuotes()+'</div>';
  }else{
    h+='<div class="px-3 mt-3"><div class="card rounded-2xl p-6 text-center">'
      +'<i class="fas fa-hourglass-half text-[24px] text-gray-200"></i>'
      +'<p class="text-[12px] text-gray-400 mt-2.5">还没有商户报价</p>'
      +'<p class="text-[10px] text-gray-400 mt-1">需求已推送给匹配商户，截止前会持续收到报价</p>'
      +'</div></div>';
  }

  $('page').innerHTML=h;
  renderBar();
}

function renderQuotes(){
  var list=D.quotes.slice();
  if(sortBy==='price')list.sort(function(a,b){return a.price-b.price});
  if(sortBy==='deliver')list.sort(function(a,b){return a.deliver-b.deliver});
  return list.map(function(q){
    var idx=D.quotes.indexOf(q);
    var cls=q.win?' win':(q.lose?' lose':'');
    var flag=q.win?'<span class="tag t-free" style="color:#C2410C;background:#FFEDD5">已中标</span>':(q.lose?'<span class="tag" style="color:#6B7280;background:#F1F2F5">未中标</span>':'');
    return '<div class="q'+cls+'">'
      +'<div class="flex items-center gap-2">'
      +'<div class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-[11px]" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)"><i class="fas fa-store"></i></div>'
      +'<p class="text-[12.5px] font-bold text-gray-800 flex-1 truncate">'+q.shop+'</p>'
      +flag
      +'<span class="text-[9px] text-gray-400">'+q.v+'</span>'
      +'</div>'
      +'<div class="flex items-end justify-between mt-2">'
      +'<div><p class="price">¥'+q.price.toFixed(2)+'<small> /双</small></p>'
      +'<p class="text-[9.5px] text-gray-400 mt-1">'+q.ladder+'</p></div>'
      +'<div class="text-right"><p class="text-[10px] text-gray-500">交期 <b class="text-gray-800">'+q.deliver+' 天</b></p>'
      +'<p class="text-[10px] text-gray-500 mt-0.5">评分 '+q.score+' · 成交 '+q.sold+'</p></div>'
      +'</div>'
      +'<div class="flex items-center gap-1.5 mt-2">'+sampleTag(q)
      +(q.moq?'<span class="tag" style="color:#0E7490;background:#ECFEFF">大货 MOQ '+q.moq+' 双</span>':'')+'</div>'
      +((q.sample==='free'&&q.freeCond)?'<p class="text-[9.5px] text-emerald-600 mt-1 leading-relaxed">免费条件：'+q.freeCond+'</p>':'')
      +'<p class="text-[10px] text-gray-500 mt-1.5 leading-relaxed">'+q.note+'</p>'
      +(D.status==='quote'?'<div class="flex gap-2 mt-2.5"><button class="flex-1 py-2 rounded-xl bg-gray-100 text-[11.5px] font-bold text-gray-600" onclick="toast(\'已发起沟通（原型演示）\')">联系商户</button><button class="flex-1 py-2 rounded-xl text-white text-[11.5px] font-bold" style="background:linear-gradient(135deg,#FB7185,#EC4899)" onclick="openWin('+idx+')">选此商户</button></div>':'')
      +'</div>';
  }).join('');
}
function setSort(k){sortBy=k;render()}

function openWin(i){
  var q=D.quotes[i];
  /* 商户 MOQ 与本次采购数量校验：数量不足不能选标 */
  var need=parseInt(String(D.qty).replace(/[^\d]/g,''),10)||0;
  if(q.moq&&need&&need<q.moq){toast('采购数量 '+need+' 双低于该商户 MOQ '+q.moq+' 双，无法选标');return;}
  winIdx=i;
  $('winShop').textContent=q.shop;
  $('winPrice').textContent='¥'+q.price.toFixed(2)+'/双 · 交期 '+q.deliver+' 天';
  $('winSample').textContent=q.sample==='free'?'样品费：免费':(q.sample==='ded'?'样品费：¥'+q.fee+'/件，可抵大货款':'样品费：¥'+q.fee+'/件，不可抵');
  if(D.method==='仅打样'){
    $('winTip').innerHTML='选中后其余报价将自动落选，<br>商户将先寄样，确认后再决定是否大货';
  }else{
    $('winTip').innerHTML='选中后其余报价将自动落选，<br>需在 48 小时内支付，超时需求自动关闭';
  }
  $('winMask').classList.add('on');
}
function closeWin(){$('winMask').classList.remove('on')}
function doWin(){
  D.quotes.forEach(function(q,i){if(i===winIdx){q.win=true;delete q.lose}else{q.lose=true;delete q.win}});
  D.status='selected';
  D.payLeft='48 小时';
  closeWin();
  toast('已选定商户，请在 48 小时内支付');
  render();
}

function renderBar(){
  var h='';
  if(D.status==='quote'){
    h='<div class="flex gap-2">'
      +'<button class="flex-1 py-2.5 rounded-xl bg-gray-100 text-[12px] font-bold text-gray-600" onclick="cancelDemand()">撤销需求</button>'
      +'<button class="flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#FB7185,#EC4899)" onclick="toast(\'已提醒商户报价（原型演示）\')">催报价</button>'
      +'</div>';
  }else if(D.status==='selected'){
    h='<div class="flex gap-2">'
      +'<button class="flex-1 py-2.5 rounded-xl bg-gray-100 text-[12px] font-bold text-gray-600" onclick="cancelDemand()">放弃</button>'
      +'<button class="flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#FB7185,#EC4899)" onclick="pay()">去支付订金</button>'
      +'</div>';
  }else if(D.status==='deal'){
    h='<a href="order-detail.html?type=custom&id='+D.orderNo+'" class="block w-full py-2.5 rounded-xl text-white text-[12px] font-bold text-center" style="background:linear-gradient(135deg,#FB7185,#EC4899)">查看定制单</a>';
  }else{
    h='<a href="custom-design.html" class="block w-full py-2.5 rounded-xl text-white text-[12px] font-bold text-center" style="background:linear-gradient(135deg,#FB7185,#EC4899)">按此方案重新发起</a>';
  }
  $('bar').innerHTML=h;
}
/* 支付订金 → 生成定制单：单号由需求号推导，保证与订单详情同源 */
function pay(){
  D.orderNo='CZ'+D.no.slice(2);
  D.status='deal';
  toast('支付成功，已生成定制单 '+D.orderNo);
  render();
}
function cancelDemand(){
  var old=document.getElementById('cancelMask');
  if(old)old.remove();
  var m=document.createElement('div');
  m.className='mask';
  m.id='cancelMask';
  m.innerHTML='<div class="bg-white rounded-3xl p-5 text-center" style="width:300px">'
    +'<p class="text-[15px] font-bold text-gray-800">确认撤销该需求？</p>'
    +'<p class="text-[11px] text-gray-500 mt-1.5 leading-relaxed">撤销后商户无法继续报价，需求不可恢复</p>'
    +'<div class="flex gap-2 mt-4">'
    +'<button class="flex-1 py-2.5 rounded-xl bg-gray-100 text-[12px] font-bold text-gray-600" onclick="closeCancel()">再看看</button>'
    +'<button class="flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#FB7185,#EC4899)" onclick="doCancelDemand()">确认撤销</button>'
    +'</div></div>';
  document.body.appendChild(m);
  m.classList.add('on');
}
function closeCancel(){
  var m=document.getElementById('cancelMask');
  if(m)m.classList.remove('on');
  setTimeout(function(){if(m&&m.parentNode)m.parentNode.removeChild(m)},150);
}
function doCancelDemand(){
  closeCancel();
  D.status='closed';D.closeReason='你已撤销该需求';
  toast('需求已撤销');
  render();
}
render();
</script>
