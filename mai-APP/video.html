<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF6F3}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.no-bar::-webkit-scrollbar{display:none}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.sec-title{font-size:17px;font-weight:800;letter-spacing:.3px;color:#1F2430}
.sec-more{font-size:11px;color:#9aa0ac}
.text-grad{background:linear-gradient(90deg,#FF4D2D,#FF2D78);-webkit-background-clip:text;background-clip:text;color:transparent}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.video-card{border-radius:14px;overflow:hidden;position:relative;cursor:pointer;transition:transform .16s}
.video-card:active{transform:scale(.97)}
.video-card img{width:100%;height:120px;object-fit:cover}
.video-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.video-goods-tag{position:absolute;left:6px;bottom:6px;background:rgba(255,77,45,.94);color:#fff;font-size:9px;font-weight:600;padding:2px 6px;border-radius:6px;display:flex;align-items:center;gap:3px}
.video-none-tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px;display:flex;align-items:center;gap:3px}
.video-pick{position:absolute;left:6px;top:6px;background:linear-gradient(135deg,#FFB020,#FF7A00);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px}

/* 筛选条 */
.flt-wrap{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,#FFF6F3 72%,rgba(255,246,243,0));padding:10px 12px 6px}
.flt-row{display:flex;gap:7px;align-items:center}
.flt-search{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 12px;box-shadow:0 2px 12px rgba(20,20,40,.06)}
.flt-search input{flex:1;border:0;outline:none;font-size:12px;background:transparent;color:#2A2F3A;min-width:0}
.flt-search i{font-size:12px;color:#B4BAC6}
.flt-sort{background:#fff;border:0;border-radius:999px;padding:8px 10px;font-size:11.5px;font-weight:600;color:#5A6270;box-shadow:0 2px 12px rgba(20,20,40,.06);outline:none;max-width:104px}
.flt-chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.flt-chips::-webkit-scrollbar{display:none}
.flt-chip{flex-shrink:0;font-size:11px;padding:5px 11px;border-radius:999px;background:#fff;color:#6B7280;border:1px solid #F1E7E2;cursor:pointer}
.flt-chip.on{background:linear-gradient(135deg,#FF6B35,#FF4D2D);color:#fff;border-color:transparent;font-weight:700}
.flt-chip.pick.on{background:linear-gradient(135deg,#FFB020,#FF7A00)}
.flt-count{font-size:10px;color:#9aa0ac;margin-top:7px;padding-left:2px}
.grid-foot{text-align:center;font-size:11px;color:#B4BAC6;padding:16px 0 4px}

/* ===== 沉浸式视频播放流（抖音式） ===== */
.fd-mask{position:fixed;left:0;top:0;width:393px;height:100vh;height:100dvh;background:#000;z-index:9999;display:none}
.fd-mask.on{display:block}
.fd-scroll{height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none}
.fd-scroll::-webkit-scrollbar{display:none}
.fd-item{position:relative;height:100vh;min-height:100vh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
.fd-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fd-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,0) 24%,rgba(0,0,0,0) 42%,rgba(0,0,0,.78) 100%)}
.fd-tap{position:absolute;inset:0;z-index:1}
.fd-pause{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2;display:none;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.42);backdrop-filter:blur(6px);align-items:center;justify-content:center}
.fd-pause.on{display:flex}
.fd-top{position:absolute;left:0;right:0;top:0;padding:48px 12px 8px;z-index:4;display:flex;align-items:center;gap:10px}
.fd-top .fd-back{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;color:#fff}
.fd-tabbar{display:flex;align-items:center;gap:16px;flex:1;justify-content:center;padding-right:32px}
.fd-tab{color:rgba(255,255,255,.65);font-size:14px;font-weight:600;position:relative;padding-bottom:4px}
.fd-tab.on{color:#fff;font-size:15px;font-weight:800}
.fd-tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:16px;height:2.5px;border-radius:2px;background:#fff}
.fd-rail{position:absolute;right:8px;bottom:128px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:15px}
.fd-avatar{width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;position:relative;margin-bottom:8px}
.fd-follow{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);width:19px;height:19px;border-radius:50%;background:#FF2D55;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:2px solid #000}
.fd-follow.off{display:none}
.fd-act{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;font-size:10px;font-weight:600;cursor:pointer}
.fd-act i{font-size:23px;text-shadow:0 2px 8px rgba(0,0,0,.45);transition:transform .16s}
.fd-act:active i{transform:scale(.86)}
.fd-act.liked i{color:#FF2D55}
.fd-act.faved i{color:#FFD60A}
.fd-info{position:absolute;left:12px;right:66px;bottom:16px;z-index:3;color:#fff}
.fd-shop{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.fd-shop .fd-verified{color:#4FC3F7;font-size:12px}
.fd-desc{font-size:12px;line-height:1.55;margin-top:5px;color:rgba(255,255,255,.94);text-shadow:0 1px 6px rgba(0,0,0,.5);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fd-music{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:10.5px;color:rgba(255,255,255,.9)}
.fd-music i{animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fd-goods{display:flex;align-items:center;gap:8px;margin-top:10px;background:rgba(255,255,255,.96);border-radius:12px;padding:7px 8px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fd-goods:active{transform:scale(.98)}
.fd-goods img{width:44px;height:44px;border-radius:9px;object-fit:cover;flex-shrink:0}
.fd-goods .fd-g-main{flex:1;min-width:0}
.fd-goods .fd-g-name{font-size:11.5px;font-weight:700;color:#1F2430;line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.fd-goods .fd-g-price{display:flex;align-items:baseline;gap:3px;margin-top:3px}
.fd-goods .fd-g-price b{font-size:14px;color:#FF4D2D;font-weight:800}
.fd-goods .fd-g-price i{font-size:9.5px;color:#9aa0ac;font-style:normal}
.fd-goods .fd-g-btn{flex-shrink:0;font-size:11px;font-weight:700;color:#fff;padding:6px 11px;border-radius:999px;background:linear-gradient(135deg,#FF6B35,#FF4D2D);display:flex;align-items:center;gap:4px}
.fd-goods-empty{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;background:rgba(255,255,255,.9);border-radius:12px;padding:9px 10px;cursor:pointer}
.fd-goods-empty .fd-ge-t{font-size:11px;color:#5A6270;line-height:1.4}
.fd-goods-empty .fd-ge-btn{flex-shrink:0;font-size:11px;font-weight:700;color:#FF4D2D;border:1px solid #FFD4C5;background:#FFF6F3;padding:5px 10px;border-radius:999px}
.fd-heart{position:absolute;left:50%;top:50%;font-size:86px;color:#FF2D55;pointer-events:none;z-index:5;animation:heartPop .8s ease-out forwards;text-shadow:0 6px 24px rgba(0,0,0,.35)}
@keyframes heartPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.12)}70%{opacity:.9}100%{opacity:0;transform:translate(-50%,-105%) scale(.85)}}

/* toast */
.fd-toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.8);color:#fff;font-size:12px;padding:9px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:78%;text-align:center;line-height:1.5}
.fd-toast.on{opacity:1}
</style>

/* 本期不做视频评论（风控要求），故无评论数据源 */

/* 品类筛选：唯一来源 = 视频关联商品的「商品分类」（商品侧维护，本页不建类目）
   改动商品分类 → 视频的分类随之变化；无关联商品的视频不参与品类筛选（只在「全部」出现） */
function itemCat(v){return v.goods&&v.goods.cat?v.goods.cat:'';}
function filterCats(){
  var out=[];
  FEED.forEach(function(v){var c=itemCat(v);if(c&&out.indexOf(c)<0)out.push(c);});
  return out;
}

var PAGE_SIZE=8;
var VIEW=[];          /* 当前筛选+排序后的完整列表 */
var shown=0;          /* 已渲染条数（分页游标） */
var flt={kw:'',cat:'',sort:'composite',pick:false};
var cur=0,built=false,paused=false,toastTimer=null,loading=false,seq=0;
var FLIST=[];        /* 播放流当前列表：推荐=当前筛选结果 / 关注=已关注商家的视频 */
var feedTab=0;       /* 0 推荐 1 关注 */
/* 关注关系统一走 shop-follow.js（与「我的收藏 → 关注店铺」共用同一份数据） */
var favSaved=(function(){   /* 已收藏视频（含展示快照）：与 favorites.html「收藏视频」Tab 共用 localStorage */
  try{var a=JSON.parse(localStorage.getItem('sh_fav_videos')||'null');if(a&&a.length)return a;}catch(e){}
  return [];
})();
function saveFavs(){try{localStorage.setItem('sh_fav_videos',JSON.stringify(favSaved));}catch(e){}}
function snapVideo(v){return {id:v.id,title:v.title,shop:v.shop,img:v.img,plays:v.plays};}
FEED.forEach(function(v,i){v.id='v'+(i+1);});

function fmt(n){return n>=10000?(n/10000).toFixed(1)+'万':String(n);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* 综合分（简单可解释，后台同口径）：播放×1 + 收藏×20 + 点赞×5 + 精选5000 + 新鲜度加成 */
function score(v){
  var fresh=v.days<=7?2000:(v.days<=15?1200:(v.days<=30?600:0));
  return v.plays + v.favs*20 + v.likes*5 + (v.pick?5000:0) + fresh;
}

function match(v){
  if(flt.pick&&!v.pick)return false;
  if(flt.cat&&itemCat(v)!==flt.cat)return false;
  if(flt.kw){
    var k=flt.kw.toLowerCase();
    var hay=(v.title+' '+(v.goods?v.goods.name:'')+' '+v.shop).toLowerCase();
    if(hay.indexOf(k)<0)return false;
  }
  return true;
}

function sortList(a,b){
  if(flt.sort==='new')return a.days-b.days;
  if(flt.sort==='plays')return b.plays-a.plays;
  if(flt.sort==='favs')return b.favs-a.favs;
  var d=score(b)-score(a);
  return d!==0?d:a.days-b.days;
}

/* ---------- 列表 ---------- */
function renderChips(){
  var html='<span class="flt-chip'+(flt.cat===''?' on':'')+'" onclick="setCat(\'\')">全部</span>';
  html+=filterCats().map(function(c){
    return '<span class="flt-chip'+(flt.cat===c?' on':'')+'" onclick="setCat(\''+c+'\')">'+c+'</span>';
  }).join('');
  html+='<span class="flt-chip pick'+(flt.pick?' on':'')+'" onclick="togglePick()"><i class="fas fa-thumbs-up" style="font-size:9px;margin-right:3px"></i>精选推荐</span>';
  document.getElementById('fltChips').innerHTML=html;
}

function setCat(c){flt.cat=c;onFilter();}
function togglePick(){flt.pick=!flt.pick;onFilter();}
function clearKw(){document.getElementById('fltKw').value='';onFilter();}
function resetFlt(){
  flt={kw:'',cat:'',sort:'composite',pick:false};
  document.getElementById('fltKw').value='';
  document.getElementById('fltSort').value='composite';
  onFilter();
}

function onFilter(){
  flt.kw=(document.getElementById('fltKw').value||'').trim();
  flt.sort=document.getElementById('fltSort').value;
  document.getElementById('fltClear').style.display=flt.kw?'block':'none';
  renderChips();
  VIEW=FEED.filter(match).sort(sortList);
  shown=0;
  loading=false;
  seq++;                       /* 作废上一次筛选遗留的分页回调，避免旧数据回填 */
  document.getElementById('videoGrid').innerHTML='';
  document.getElementById('gridFoot').textContent='';
  updateCount();
  loadMore();
}

function updateCount(){
  document.getElementById('fltCount').textContent='共 '+VIEW.length+' 条视频'+(flt.pick?'（仅精选）':'')+(flt.cat?' · '+flt.cat:'');
}

function cardHTML(v,i){
  var tag=v.goods
    ? '<span class="video-goods-tag"><i class="fas fa-bag-shopping" style="font-size:8px"></i>可下单</span>'
    : '<span class="video-none-tag"><i class="fas fa-video" style="font-size:8px"></i>纯内容</span>';
  var pick=v.pick?'<span class="video-pick">精选</span>':'';
  return '<div class="video-card shadow-soft bg-white fade-up" onclick="openFeed('+i+')">'
    + '<div class="relative"><img src="'+v.img+'">'
    + '<div class="video-play"><i class="fas fa-play text-white text-sm" style="margin-left:2px"></i></div>'
    + '<span class="absolute bottom-1.5 right-1.5 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded">'+v.dur+'</span>'
    + tag + pick + '</div>'
    + '<div class="p-2"><p class="text-[11px] text-gray-800 font-medium leading-tight line-clamp-1">'+esc(v.title)+'</p>'
    + '<div class="flex items-center gap-1 mt-1"><span class="text-[9px] text-gray-400 line-clamp-1" onclick="event.stopPropagation();location.href=\'shop-detail.html?shop='+encodeURIComponent(v.shop)+'\'">'+esc(v.shop)+'</span><span class="text-[9px] text-gray-400 ml-auto shrink-0">'+fmt(v.plays)+'播放</span></div>'
    + '<div class="flex items-center gap-1 mt-0.5"><span class="text-[9px]" style="color:'+(itemCat(v)?'#FF4D2D':'#9aa0ac')+'">'+(itemCat(v)||'平台内容')+'</span><span class="text-[9px] text-gray-400 ml-auto">收藏 '+fmt(v.favs)+'</span></div>'
    + '</div></div>';
}

function loadMore(){
  if(loading)return;
  var grid=document.getElementById('videoGrid'),foot=document.getElementById('gridFoot');
  if(!VIEW.length){
    grid.innerHTML='<div class="col-span-2 bg-white rounded-2xl py-12 text-center shadow-soft"><i class="fas fa-video-slash text-gray-300 text-2xl"></i><p class="text-[12px] text-gray-400 mt-2">没有符合条件的视频</p><p class="text-[10px] text-gray-300 mt-1">试试清空搜索词或切回「全部」</p><span onclick="resetFlt()" style="display:inline-block;margin-top:12px;font-size:11px;font-weight:700;color:#fff;padding:6px 14px;border-radius:999px;background:linear-gradient(135deg,#FF6B35,#FF4D2D);cursor:pointer">清空筛选条件</span></div>';
    foot.textContent='';
    return;
  }
  if(shown>=VIEW.length){foot.textContent='没有更多了 · 共 '+VIEW.length+' 条';return;}
  loading=true;
  var mySeq=seq;
  foot.innerHTML='<i class="fas fa-spinner fa-spin" style="margin-right:5px"></i>加载中…';
  setTimeout(function(){
    if(mySeq!==seq)return;     /* 期间筛选已变，丢弃本次结果 */
    var start=shown;
    var next=VIEW.slice(start,start+PAGE_SIZE);
    shown+=next.length;
    grid.insertAdjacentHTML('beforeend',next.map(function(v,k){return cardHTML(v,start+k);}).join(''));
    foot.textContent=shown>=VIEW.length?('没有更多了 · 共 '+VIEW.length+' 条'):'上滑加载更多';
    loading=false;
  },160);
}

function onWinScroll(){
  if(document.getElementById('fdMask').classList.contains('on'))return;
  var st=window.scrollY||document.documentElement.scrollTop;
  if(st+window.innerHeight>=document.documentElement.scrollHeight-260)loadMore();
}

/* ---------- 播放流（跟随当前筛选结果顺序） ---------- */
function coverHTML(v,i){
  return v.goods
    ? '<div class="fd-goods" onclick="event.stopPropagation();goGoods('+i+')">'
      + '<img src="'+v.goods.img+'">'
      + '<div class="fd-g-main"><p class="fd-g-name">'+esc(v.goods.name)+'</p>'
      + '<div class="fd-g-price"><b>¥'+v.goods.price+'</b><i>/'+v.goods.unit+' · '+esc(v.goods.spec)+'</i></div></div>'
      + '<span class="fd-g-btn"><i class="fas fa-bag-shopping" style="font-size:10px"></i>去下单</span></div>'
    : '<div class="fd-goods-empty" onclick="event.stopPropagation();goFallback('+i+')">'
      + '<span class="fd-ge-t">'+esc(v.fallback.label)+'</span>'
      + '<span class="fd-ge-btn">'+esc(v.fallback.btn)+'</span></div>';
}

function itemHTML(v,i){
  return '<div class="fd-item" data-i="'+i+'">'
    + '<img class="fd-cover" src="'+v.img+'" alt="">'
    + '<div class="fd-shade"></div>'
    + '<div class="fd-tap" onclick="togglePause('+i+')" ondblclick="dblLike('+i+',event)"></div>'
    + '<div class="fd-pause" id="fdPause'+i+'"><i class="fas fa-play" style="color:#fff;font-size:22px;margin-left:4px"></i></div>'
    + '<div class="fd-rail">'
    +   '<div class="fd-avatar" style="background:'+v.color+'" onclick="event.stopPropagation();goShop('+i+')">'+esc(v.shop.charAt(0))+'<span class="fd-follow" id="fdFollow'+i+'" onclick="event.stopPropagation();follow('+i+')">+</span></div>'
    +   '<div class="fd-act" id="fdLike'+i+'" onclick="event.stopPropagation();like('+i+')"><i class="fas fa-heart"></i><span>'+fmt(v.likes)+'</span></div>'

    +   '<div class="fd-act" id="fdFav'+i+'" onclick="event.stopPropagation();fav('+i+')"><i class="fas fa-star"></i><span>'+fmt(v.favs)+'</span></div>'
    +   '<div class="fd-act" onclick="event.stopPropagation();share('+i+')"><i class="fas fa-share"></i><span>'+fmt(v.shares)+'</span></div>'
    + '</div>'
    + '<div class="fd-info">'
    +   '<div class="fd-shop" onclick="event.stopPropagation();goShop('+i+')">@'+esc(v.shop)+(v.verified?'<i class="fas fa-circle-check fd-verified"></i>':'')+'<i class="fas fa-chevron-right" style="font-size:9px;opacity:.7;margin-left:2px"></i></div>'
    +   '<p class="fd-desc">'+esc(v.desc)+'</p>'
    +   '<div class="fd-music"><i class="fas fa-compact-disc"></i><span>原声 · '+esc(v.shop)+'</span><span style="opacity:.7">· '+v.dur+'</span></div>'
    +   coverHTML(v,i)
    + '</div>'
    + '</div>';
}

function build(){
  if(built)return;built=true;
  var sc=document.getElementById('fdScroll');
  sc.innerHTML='<div id="fdItems"></div>';
  sc.addEventListener('scroll',onScroll);
}

function openFeed(i){
  if(!VIEW.length)return;
  build();
  feedTab=0;
  FLIST=VIEW.slice();
  document.getElementById('fdMask').classList.add('on');
  document.body.style.overflow='hidden';
  renderFeed(i||0);
}

/* 渲染播放流并定位到第 i 条 */
function renderFeed(i){
  var sc=document.getElementById('fdScroll');
  document.getElementById('fdItems').innerHTML=FLIST.map(itemHTML).join('');
  var empty=document.getElementById('fdEmpty');
  empty.style.display=FLIST.length?'none':'flex';
  document.getElementById('fdTabRec').classList.toggle('on',feedTab===0);
  document.getElementById('fdTabFollow').classList.toggle('on',feedTab===1);
  document.getElementById('fdTabFollowN').textContent=' '+FOLLOW_SHOPS.count();
  cur=Math.max(0,Math.min(i||0,Math.max(FLIST.length-1,0)));
  requestAnimationFrame(function(){sc.scrollTop=cur*sc.clientHeight;updateProgress();resetPause();});
}

/* 顶部 Tab：推荐 / 关注（关注流=已关注商家的视频，按发布时间倒序） */
function setFeedTab(t){
  feedTab=t;
  FLIST=t===1?FEED.filter(function(v){return FOLLOW_SHOPS.has(v.shop);}).sort(function(a,b){return a.days-b.days;}):VIEW.slice();
  renderFeed(0);
  if(t===1&&!FLIST.length)fdToast('还没有关注店铺，点头像旁「+」即可关注');
}

function closeFeed(){
  document.getElementById('fdMask').classList.remove('on');
  document.body.style.overflow='';
}

function updateProgress(){
  document.getElementById('fdProgress').textContent=FLIST.length?(cur+1)+' / '+FLIST.length:'0 / 0';
}

function onScroll(){
  var sc=document.getElementById('fdScroll');
  var i=Math.round(sc.scrollTop/(sc.clientHeight||1));
  if(i<0)i=0;if(i>FLIST.length-1)i=FLIST.length-1;
  if(i!==cur){cur=i;updateProgress();resetPause();}
}

function resetPause(){
  paused=false;
  FLIST.forEach(function(_,i){var el=document.getElementById('fdPause'+i);if(el)el.classList.remove('on');});
}

function togglePause(i){
  if(i!==cur)return;
  paused=!paused;
  document.getElementById('fdPause'+i).classList.toggle('on',paused);
  if(paused)fdToast('已暂停 · 再次点击继续播放');
}

function like(i){
  var el=document.getElementById('fdLike'+i),v=FLIST[i];
  var on=el.classList.toggle('liked');
  v.likes+=on?1:-1;
  el.querySelector('span').textContent=fmt(v.likes);
  if(on)popHeart(i);
}

function dblLike(i,ev){
  ev.stopPropagation();
  var el=document.getElementById('fdLike'+i);
  if(!el.classList.contains('liked'))like(i);else popHeart(i);
}

function popHeart(i){
  var item=document.querySelector('#fdItems .fd-item[data-i="'+i+'"]');
  if(!item)return;
  var h=document.createElement('i');
  h.className='fas fa-heart fd-heart';
  item.appendChild(h);
  setTimeout(function(){h.remove();},820);
}

function fav(i){
  var el=document.getElementById('fdFav'+i),v=FLIST[i];
  var on=el.classList.toggle('faved');
  v.favs+=on?1:-1;
  el.querySelector('span').textContent=fmt(v.favs);
  if(on){
    var has=false;favSaved.forEach(function(x){if(x.id===v.id)has=true;});
    if(!has)favSaved.push(snapVideo(v));
    fdToast('已收藏 · 可在「我的收藏 → 收藏视频」查看');
  }else{
    favSaved=favSaved.filter(function(x){return x.id!==v.id;});
    fdToast('已取消收藏');
  }
  saveFavs();
}

function follow(i){
  var v=FLIST[i];
  document.getElementById('fdFollow'+i).classList.add('off');
  FOLLOW_SHOPS.add(v.shop);
  document.getElementById('fdTabFollowN').textContent=' '+FOLLOW_SHOPS.count();
  fdToast('已关注 '+v.shop+' · 可在「我的收藏 → 关注店铺」查看');
}

function share(i){
  var v=FLIST[i];
  var url=location.href.split('?')[0]+'?v='+v.id;
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url);
      fdToast('链接已复制：'+url);
      return;
    }
  }catch(e){}
  fdToast('链接：'+url+'（长按复制）');
}

function goShop(i){
  location.href='shop-detail.html?shop='+encodeURIComponent(FLIST[i].shop);
}

function goGoods(i){
  var g=FLIST[i].goods;
  if(!g||!g.to){fdToast('商品已下架');return;}
  location.href=g.to+(g.to.indexOf('?')<0?'?':'&')+'from=video&v='+(i+1);
}

function goFallback(i){
  var f=FLIST[i].fallback;
  if(!f||!f.to){fdToast('暂无可跳转页面');return;}
  location.href=f.to;
}

/* 说明：本期不做评论（风控要求，2026-11-04 业务确认），相关入口与抽屉已移除 */

function fdToast(msg){
  var t=document.getElementById('fdToast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on');},1700);
}

window.addEventListener('scroll',onWinScroll);
onFilter();

/* 深链：从「我的收藏-收藏视频」或分享链接进入，定位到该条视频 */
(function(){
  var id=new URLSearchParams(location.search).get('v');
  if(!id)return;
  var idx=-1;
  VIEW.forEach(function(x,i){if(x.id===id)idx=i;});
  if(idx>=0)setTimeout(function(){openFeed(idx);},80);
})();
</script>
