:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4}

body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}

.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease}.card:active{transform:scale(.965)}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:120px;justify-content:center}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:150;opacity:0;pointer-events:none;transition:.3s}
.overlay.on{opacity:1;pointer-events:auto}
.panel{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.12);z-index:200;transform:translateY(100%);transition:transform .3s ease;width:393px;max-height:80vh;overflow-y:auto}

.tag-sel{font-size:11px;color:#6b7080;background:#f5f5f5;border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s;font-weight:500}
.tag-sel.on{background:#FF4D2D;color:#fff;font-weight:600}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.img-loading{background:linear-gradient(90deg,#f5f5f5 25%,#ececec 50%,#f5f5f5 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

function img(prompt,size){
  return 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt='+encodeURIComponent(prompt)+'&image_size='+(size||'landscape_16_9');
}

var actImgs={
  act1:'Outdoor cultural festival celebration stage colorful sock theme decorations crowd daytime event performance',
  act2:'Trade show exhibition hall sock displays professional product launch event indoor industry expo',
  act3:'Children DIY sock making workshop colorful creative crafts activities kids learning indoor',
  act4:'National day cultural week celebration festive red decorations exhibition booths outdoor event',
  act5:'International sock industry expo large exhibition hall trade show booths professional event',
  act6:'Traditional Chinese stone rubbing experience workshop cultural activity ancient art craft',
  act7:'Christmas themed creative night market festive lights colorful stalls outdoor holiday market'
};

var urlParams=new URLSearchParams(window.location.search);
var id=urlParams.get('id')||'act2';
var actKey='act'+id.replace('act','');
var d=activities[actKey]||activities['act2'];

var coverImg=document.getElementById('coverImg');
var coverBg=document.getElementById('coverBg');
if(actImgs[actKey]){
  coverImg.src=img(actImgs[actKey],'landscape_16_9');
  coverImg.onload=function(){coverImg.style.display='';coverBg.style.display='none'};
}else{
  coverBg.style.background=d.coverBg;
}

var gal1=document.getElementById('galImg1');
var gal2=document.getElementById('galImg2');
if(actImgs[actKey]){
  gal1.src=img(actImgs[actKey]+' closeup detail view','square');
  gal2.src=img(d.title+' sock industry cultural activity scene','square');
  gal1.onload=function(){gal1.parentElement.classList.remove('img-loading')};
  gal2.onload=function(){gal2.parentElement.classList.remove('img-loading')};
}
document.getElementById('coverInfo').innerHTML='<span class="status-badge text-[10px] font-bold px-2 py-0.5 rounded" style="background:'+d.statusBg+';color:'+d.statusColor+'">'+d.status+'</span><h1 class="text-[18px] font-extrabold mt-1.5" style="text-shadow:0 2px 8px rgba(0,0,0,.3)">'+d.title+'</h1><p class="text-[11px] text-white/80 mt-0.5">'+d.date+'</p>';
document.getElementById('actTitle').textContent=d.title;
document.getElementById('actDate').textContent=d.date;
document.getElementById('statusBadge').textContent=d.status;
document.getElementById('statusBadge').style.background=d.statusBg;
document.getElementById('statusBadge').style.color=d.statusColor;
document.getElementById('actLocation').textContent=d.location;
document.getElementById('actTime').textContent=d.time;
document.getElementById('actParticipants').textContent=d.participants;
document.getElementById('actFee').textContent=d.fee;
document.getElementById('actDesc').textContent=d.desc;
document.getElementById('actOrganizer').textContent=d.organizer;

var schHtml='';
d.schedule.forEach(function(s){
  schHtml+='<div class="flex items-start gap-2"><div class="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style="background:#FF4D2D"></div><div><p class="text-[10px] font-bold text-gray-700">'+s.t+'</p><p class="text-[10px] text-gray-400">'+s.n+'</p></div></div>';
});
document.getElementById('actSchedule').innerHTML=schHtml;

var notesHtml='';
d.notes.forEach(function(n){
  notesHtml+='<div class="flex items-start gap-1.5"><i class="fas fa-check text-[9px] mt-0.5" style="color:#10B981"></i><span class="text-[10px] text-gray-500 leading-relaxed">'+n+'</span></div>';
});
document.getElementById('actNotes').innerHTML=notesHtml;

var actionBtn=document.getElementById('actionBtn');
if(d.status==='已结束'){actionBtn.textContent='活动已结束';actionBtn.style.background='#E5E7EB';actionBtn.style.color='#9CA3AF';actionBtn.onclick=function(){toast('该活动已结束')};}
else if(d.status==='报名中'){actionBtn.textContent='立即报名';actionBtn.onclick=openSignup;}
else{actionBtn.textContent='查看详情';actionBtn.style.background='linear-gradient(135deg,#FBBF24,#F59E0B)';actionBtn.onclick=function(){toast('活动即将开放报名，请关注后续通知')};}

document.getElementById('signupActName').textContent=d.title;
document.getElementById('signupActInfo').textContent=d.date+' · '+d.location;
document.getElementById('signupTitle').textContent=d.title;
document.getElementById('signupDate').textContent=d.date;

var signupCount=1;
function changeCount(delta){signupCount=Math.max(1,signupCount+delta);document.getElementById('signupCount').textContent=signupCount}

function openSignup(){
  document.getElementById('signupPanel').classList.add('on');
  document.getElementById('signupOverlay').classList.add('on');
}
function closeSignup(){document.getElementById('signupPanel').classList.remove('on');document.getElementById('signupOverlay').classList.remove('on')}

function submitSignup(){
  var name=document.getElementById('signupName').value.trim();
  if(!name){toast('请填写姓名');return;}
  var no='BM'+new Date().toISOString().slice(0,10).replace(/-/g,'')+String(Math.floor(Math.random()*900+100));
  document.getElementById('signupNo').textContent=no;
  closeSignup();
  setTimeout(function(){
    document.getElementById('successPanel').classList.add('on');
    document.getElementById('successOverlay').classList.add('on');
  },200);
}
function closeSuccess(){document.getElementById('successPanel').classList.remove('on');document.getElementById('successOverlay').classList.remove('on')}

function shareActivity(){toast('分享链接已复制')}
</script>
