<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>设置 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D'}}}}</script>
<style>
:root{--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden;color:#1F2430}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.card{transition:transform .16s ease, box-shadow .16s ease}
.card:active{transform:scale(.965)}
.fade-up{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* iOS风格开关 */
.toggle{position:relative;width:46px;height:28px;border-radius:14px;background:#E5E7EB;transition:background .25s ease;cursor:pointer;flex-shrink:0}
.toggle.on{background:#34C759}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .25s ease}
.toggle.on::after{transform:translateX(18px)}
/* 设置行 */
.row-item{display:flex;align-items:center;padding:13px 14px;min-height:52px}
</style>
</head>
<body>

<!-- ===== 顶部渐变头部 ===== -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <!-- 流动光斑 -->
  <div class="absolute -top-10 -left-10 w-40 h-40 rounded-full blur-3xl opacity-40" style="background:#FF8A4C"></div>
  <div class="absolute -top-4 right-[-30px] w-44 h-44 rounded-full blur-3xl opacity-30" style="background:#FF2D78"></div>

  <!-- iOS状态栏 -->
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5">
      <i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i>
    </div>
  </div>

  <!-- 导航栏 -->
  <div class="relative flex items-center gap-2.5 mt-1">
    <a href="mine.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white">
      <i class="fas fa-chevron-left text-sm"></i>
    </a>
    <span class="text-white font-extrabold text-[20px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">设置</span>
  </div>
</div>

<!-- ===== 内容区 ===== -->
<div class="px-3 -mt-2 relative z-10 pb-28">

  <!-- 分组1: 账号信息 -->
  <div class="fade-up">
    <p class="text-[12px] font-bold text-gray-400 uppercase tracking-wide px-2 mb-1.5 mt-2">账号信息</p>
    <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
      <!-- 修改头像 -->
      <a href="javascript:;" class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D)">
          <i class="fas fa-user-circle text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">修改头像</span>
        <div class="w-9 h-9 rounded-full overflow-hidden bg-gray-100 mr-2 flex items-center justify-center">
          <i class="fas fa-user text-gray-300 text-lg"></i>
        </div>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
      <!-- 昵称 -->
      <a href="javascript:;" class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#38BDF8,#3B82F6)">
          <i class="fas fa-signature text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">昵称</span>
        <span class="text-[13px] text-gray-400 mr-2">李老板</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
      <!-- 手机号 -->
      <a href="javascript:;" class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#34D399,#10B981)">
          <i class="fas fa-mobile-screen text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">手机号</span>
        <span class="text-[13px] text-gray-400 mr-2">138****8888</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
      <!-- 密码 -->
      <a href="javascript:;" class="card row-item">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)">
          <i class="fas fa-lock text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">修改密码</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
    </div>
  </div>

  <!-- 分组2: 通知设置 -->
  <div class="fade-up" style="animation-delay:.05s">
    <p class="text-[12px] font-bold text-gray-400 uppercase tracking-wide px-2 mb-1.5 mt-4">通知设置</p>
    <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
      <!-- 订单通知 -->
      <div class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D)">
          <i class="fas fa-file-invoice text-sm"></i>
        </div>
        <div class="flex-1">
          <p class="text-[14px] text-gray-800 font-medium">订单通知</p>
          <p class="text-[10px] text-gray-400 mt-0.5">订单状态变更提醒</p>
        </div>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <!-- 询价通知 -->
      <div class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#38BDF8,#3B82F6)">
          <i class="fas fa-comments text-sm"></i>
        </div>
        <div class="flex-1">
          <p class="text-[14px] text-gray-800 font-medium">询价通知</p>
          <p class="text-[10px] text-gray-400 mt-0.5">收到报价 · 询盘回复</p>
        </div>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <!-- 物流通知 -->
      <div class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#2DD4BF,#14B8A6)">
          <i class="fas fa-truck text-sm"></i>
        </div>
        <div class="flex-1">
          <p class="text-[14px] text-gray-800 font-medium">物流通知</p>
          <p class="text-[10px] text-gray-400 mt-0.5">发货 · 到货 · 签收提醒</p>
        </div>
        <div class="toggle on" onclick="this.classList.toggle('on')"></div>
      </div>
      <!-- 活动通知 -->
      <div class="card row-item">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#FB7185,#EF4444)">
          <i class="fas fa-bullhorn text-sm"></i>
        </div>
        <div class="flex-1">
          <p class="text-[14px] text-gray-800 font-medium">活动通知</p>
          <p class="text-[10px] text-gray-400 mt-0.5">促销 · 展会 · 优惠活动</p>
        </div>
        <div class="toggle" onclick="this.classList.toggle('on')"></div>
      </div>
    </div>
  </div>

  <!-- 分组3: 隐私安全 -->
  <div class="fade-up" style="animation-delay:.1s">
    <p class="text-[12px] font-bold text-gray-400 uppercase tracking-wide px-2 mb-1.5 mt-4">隐私安全</p>
    <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
      <!-- 实名认证 -->
      <a href="javascript:;" class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#34D399,#10B981)">
          <i class="fas fa-id-card text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">实名认证</span>
        <span class="text-[11px] text-green-500 font-medium mr-2 flex items-center gap-1">
          <i class="fas fa-circle-check text-[10px]"></i>已认证
        </span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
      <!-- 隐私协议 -->
      <a href="javascript:;" class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#9CA3AF,#6B7280)">
          <i class="fas fa-shield-halved text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">隐私协议</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
      <!-- 用户协议 -->
      <a href="javascript:;" class="card row-item">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)">
          <i class="fas fa-file-contract text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">用户协议</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
    </div>
  </div>

  <!-- 分组4: 其他 -->
  <div class="fade-up" style="animation-delay:.15s">
    <p class="text-[12px] font-bold text-gray-400 uppercase tracking-wide px-2 mb-1.5 mt-4">其他</p>
    <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
      <!-- 清除缓存 -->
      <a href="javascript:;" class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#38BDF8,#3B82F6)">
          <i class="fas fa-broom text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">清除缓存</span>
        <span class="text-[13px] text-gray-400 mr-2">23.5MB</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
      <!-- 检查更新 -->
      <a href="javascript:;" class="card row-item border-b border-gray-50">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#34D399,#10B981)">
          <i class="fas fa-arrow-up-from-bracket text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">检查更新</span>
        <span class="text-[13px] text-gray-400 mr-2">当前版本 v1.0.0</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
      <!-- 关于我们 -->
      <a href="javascript:;" class="card row-item">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center mr-3 text-white shadow-soft" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D)">
          <i class="fas fa-circle-info text-sm"></i>
        </div>
        <span class="flex-1 text-[14px] text-gray-800 font-medium">关于我们</span>
        <i class="fas fa-chevron-right text-gray-300 text-[11px]"></i>
      </a>
    </div>
  </div>

  <!-- 退出登录 -->
  <div class="fade-up mt-5" style="animation-delay:.2s">
    <a href="mine.html" class="card block bg-white rounded-2xl shadow-soft text-center py-3.5">
      <span class="text-[15px] font-bold text-red-500">退出登录</span>
    </a>
  </div>

  <!-- 底部版本号 -->
  <div class="text-center mt-5 mb-2">
    <p class="text-[10px] text-gray-300">袜掌柜买家版 v1.0.0</p>
  </div>
</div>

<!-- ===== 底部Tab栏 5Tab ===== -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:100;width:393px">
  <div class="flex justify-around items-center h-full" style="padding-bottom:10px">
    <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-house text-[18px]"></i><span class="text-[9px]">首页</span></a>
    <a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
    <a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
    <a href="mine.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-user text-[18px]"></i><span class="text-[9px] font-semibold">我的</span></a>
  </div>
</div>
<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none">
  <div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div>
</div>

</body>
</html>
