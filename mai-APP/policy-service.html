<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>政策兑现 - 袜掌柜买家版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden;color:#1F2430}
::-webkit-scrollbar{width:2px;height:2px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease}.card:active{transform:scale(.965)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:120px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.detail-wrap{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .25s ease;opacity:0}
.detail-wrap.open{max-height:1400px;opacity:1}
.sheet-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:200;opacity:0;pointer-events:none;transition:.2s}
.sheet-mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:393px;max-height:76vh;overflow-y:auto;background:#fff;border-radius:20px 20px 0 0;z-index:201;transition:transform .28s cubic-bezier(.22,.8,.28,1)}
.sheet.on{transform:translate(-50%,0)}
</style>
<!-- Tailwind 静态样式：本地引用（不再依赖 cdn.tailwindcss.com）；改动页面后重新构建见 wazhanggui-code/_tw-build/build.ps1 -->
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#8B5CF6 0%,#7C3AED 45%,#6D28D9 100%)">
<div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-40" style="background:#A78BFA"></div>
<div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-30" style="background:#7C3AED"></div>
<div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px"><span>9:41</span><div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div></div>
<div class="relative flex items-center gap-2.5 mt-1">
<a href="industry-services.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
<span class="text-white font-extrabold text-[20px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">政策兑现</span>
</div>
<p class="text-white/70 text-[11px] mt-2 relative">政策原文与官方申请入口 · 申请在政务平台完成</p>
</div>

<!-- 政策列表 -->
<div class="px-3 mt-3 space-y-2.5" id="policyList"></div>

<div class="px-3 mt-3 mb-28">
  <div class="rounded-xl px-3 py-2.5 text-[10px] leading-relaxed" style="background:#F5F3FF;color:#5B21B6">
    <i class="fas fa-circle-info mr-1"></i>平台仅发布政策原文与官方申请入口，<b>不代收材料、不代办申报、不跟踪审批结果</b>；申报条件、材料与时限以政策原文及政务平台为准。
  </div>
</div>

<!-- 底部Tab栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:100;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">
<a href="home.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-house text-[18px]"></i><span class="text-[9px] font-semibold">首页</span></a>
<a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
<a href="ai.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-wand-magic-sparkles text-[18px]"></i><span class="text-[9px]">AI工具</span></a>
<a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
<a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<!-- Toast -->
<div class="toast" id="toast"><i class="fas fa-circle-check"></i><span>已复制</span></div>

<!-- 附件预览弹层 -->
<div class="sheet-mask" id="fileMask" onclick="closeFile()"></div>
<div class="sheet" id="fileSheet">
  <div class="flex justify-center pt-2 pb-1"><div class="w-10 h-1 bg-gray-200 rounded-full"></div></div>
  <div class="flex items-center justify-between px-4 pb-2">
    <span class="text-[15px] font-bold text-gray-800">附件预览</span>
    <button onclick="closeFile()" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-gray-400"><i class="fas fa-xmark text-xs"></i></button>
  </div>
  <div class="px-4 pb-6" id="fileBody"></div>
</div>

<script>
/* ===== 政策数据（v1.5 精简：仅 发布标题 / 发布正文 / 附件 / 申请网址） =====
   字段口径与运营端 chain-policy 发布表单一致；mo='sh' 表示仅商户端投放，买家端不展示。 */
var policies=[
 {id:'ZC2026111001',
  title:'大唐袜业产业转型升级专项资金申报指南',
  updated:'2026-11-10',
  content:'为推动大唐袜业产业转型升级，对实施智能化改造、品牌建设、研发创新的规上袜业企业给予专项资金支持，重点扶持数字化车间建设、自主品牌培育和绿色生产改造项目。\n\n支持标准、申报条件、申报材料及办理时限，以本政策原文及政务平台公布的申报指南为准。符合条件的袜业企业请在申报期内通过官方入口提交材料。',
  files:[{name:'产业转型升级专项资金管理办法.pdf',size:'1.2MB'},{name:'申报材料清单.docx',size:'86KB'}],
  applyUrl:'https://jxt.zj.gov.cn/',
  mo:'all'},
 {id:'ZC2026110802',
  title:'袜业中小企业数字化改造奖补政策',
  updated:'2026-11-08',
  content:'对完成数字化车间、智能仓储、生产管理系统改造的袜业中小企业，按设备与软件实际投入的一定比例给予奖补。\n\n具体比例、上限及验收要求见政策原文；同一项目不得重复享受同类财政资金支持。',
  files:[{name:'数字化改造奖补实施细则.pdf',size:'742KB'}],
  applyUrl:'https://jxt.zj.gov.cn/col/col1229123678/index.html',
  mo:'all'},
 {id:'ZC2026110503',
  title:'袜业高层次人才引进安家补贴办法',
  updated:'2026-11-05',
  content:'面向袜业企业引进的技术研发、设计、外贸等紧缺岗位人才，按人才层次给予一次性安家补贴，补贴由用人单位统一申报。\n\n人才层次认定标准、补贴额度与申报窗口期以政策原文为准。',
  files:[{name:'人才层次认定标准.pdf',size:'513KB'},{name:'安家补贴申报表.xlsx',size:'42KB'}],
  applyUrl:'https://hrss.zj.gov.cn/',
  mo:'all'},
 {id:'ZC2026102904',
  title:'袜业企业出口信用保险保费补助通知',
  updated:'2026-10-29',
  content:'对投保出口信用保险的袜业企业，按实际缴纳保费给予一定比例补助，补助资金按年度统一受理、审核与拨付。\n\n投保时间、保单范围与申报截止时间详见原文。',
  files:[{name:'出口信用保险保费补助通知.pdf',size:'386KB'}],
  applyUrl:'https://zcom.zj.gov.cn/',
  mo:'all'},
 {id:'ZC2026102205',
  title:'袜业共享工厂设备购置补贴申报说明',
  updated:'2026-10-22',
  content:'针对袜业共享工厂新增织袜机、定型机等生产设备，按设备购置金额给予补贴，申报主体须为已完成备案的共享工厂运营主体。\n\n设备清单、备案要求与补贴上限见政策原文。',
  files:[{name:'共享工厂设备补贴申报说明.pdf',size:'623KB'}],
  applyUrl:'https://www.zjzwfw.gov.cn/col/col1229696040/index.html',
  mo:'all'}
];

var curIdx=0;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* 列表：只展示标题 / 正文摘要 / 附件数 / 申请入口 */
function renderPolicies(){
 var list=policies.filter(function(p){return p.mo!=='sh';});
 var html='';
 list.forEach(function(p,i){
  var files=(p.files||[]);
  var brief=String(p.content||'').split('\n')[0];
  var fileHtml='';
  if(files.length){
   fileHtml='<div class="flex items-center gap-1 text-[10px]" style="color:#7C3AED"><i class="fas fa-paperclip text-[9px]"></i>附件 '+files.length+' 个</div>';
  }
  html+='<div class="card bg-white rounded-2xl shadow-soft p-3.5 fade-up" style="animation-delay:'+(i*0.05)+'s">';
  html+='<div class="flex items-start gap-2.5">';
  html+='<div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#8B5CF6,#7C3AED)"><i class="fas fa-file-signature text-sm"></i></div>';
  html+='<div class="flex-1 min-w-0">';
  html+='<p class="text-[13px] font-bold text-gray-800 leading-snug">'+esc(p.title)+'</p>';
  html+='<p class="text-[10px] text-gray-400 mt-1 leading-relaxed" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+esc(brief)+'</p>';
  html+='</div></div>';
  html+='<div class="flex items-center justify-between mt-2.5 pt-2.5 border-t border-gray-50">';
  html+='<div class="flex items-center gap-3">'+fileHtml+'<span class="text-[10px] text-gray-400">'+esc(p.updated)+' 更新</span></div>';
  html+='<button class="toggleBtn text-[11px] font-semibold flex items-center gap-1" style="color:#7C3AED" onclick="toggleDetail(this)">查看详情<i class="fas fa-chevron-down text-[9px] transition-transform chevron"></i></button>';
  html+='</div>';
  /* 详情：正文 + 附件 + 申请网址 */
  html+='<div class="detail-wrap"><div class="pt-3 space-y-3">';
  html+='<div><p class="text-[10px] font-bold text-gray-400 mb-1.5 flex items-center gap-1"><i class="fas fa-align-left text-[9px]"></i>发布正文</p>';
  String(p.content||'').split('\n').forEach(function(seg){ if(seg.trim())html+='<p class="text-[11px] text-gray-600 leading-relaxed mb-1.5">'+esc(seg)+'</p>'; });
  html+='</div>';
  if(files.length){
   html+='<div><p class="text-[10px] font-bold text-gray-400 mb-1.5 flex items-center gap-1"><i class="fas fa-folder-open text-[9px]"></i>附件</p>';
   files.forEach(function(f,j){
    html+='<button onclick="openFile('+i+','+j+')" class="w-full flex items-center gap-2 px-2.5 py-2 rounded-xl mb-1.5" style="background:#F5F3FF"><i class="fas fa-file-lines text-[11px]" style="color:#7C3AED"></i><span class="text-[11px] text-gray-700 flex-1 text-left truncate">'+esc(f.name)+'</span><span class="text-[9px] text-gray-400">'+esc(f.size)+'</span><i class="fas fa-eye text-[10px] text-gray-400"></i></button>';
   });
   html+='</div>';
  }
  html+='<div><p class="text-[10px] font-bold text-gray-400 mb-1.5 flex items-center gap-1"><i class="fas fa-link text-[9px]"></i>申请网址</p>';
  html+='<button onclick="openApply('+i+')" class="w-full flex items-center gap-2 px-2.5 py-2.5 rounded-xl text-left" style="background:#ECFDF5"><i class="fas fa-arrow-up-right-from-square text-[11px]" style="color:#059669"></i><span class="text-[11px] font-semibold flex-1 truncate" style="color:#065F46">'+esc(shortUrl(p.applyUrl))+'</span><span class="text-[10px] font-bold" style="color:#059669">前往申请 ›</span></button>';
  html+='<p class="text-[9px] text-gray-400 mt-1 leading-relaxed">将在官方渠道（政务服务平台 / 主管部门）打开，申报条件与材料以该渠道要求为准。</p></div>';
  html+='</div></div>';
  html+='</div>';
 });
 if(!list.length){
  html='<div class="bg-white rounded-2xl shadow-soft p-8 text-center">'
   +'<div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-2" style="background:#F5F3FF"><i class="fas fa-folder-open text-xl" style="color:#A78BFA"></i></div>'
   +'<p class="text-[12px] font-bold text-gray-700">暂无政策</p>'
   +'<p class="text-[10px] text-gray-400 mt-1 leading-relaxed">运营发布后在此展示</p>'
   +'</div>';
 }
 document.getElementById('policyList').innerHTML=html;
}

/* 展开/收起详情（内联 onclick 绑定，静态扫描可识别，避免被判为死按钮） */
function toggleDetail(btn){
 var card=btn.closest('.card');
 if(!card)return;
 var w=card.querySelector('.detail-wrap');
 if(!w)return;
 var open=w.classList.toggle('open');
 var ch=btn.querySelector('.chevron');
 if(ch)ch.style.transform=open?'rotate(180deg)':'';
 btn.childNodes[0].nodeValue=open?'收起':'查看详情';
}

function shortUrl(u){
 var s=String(u||'').replace(/^https?:\/\//,'');
 return s.length>34?s.slice(0,34)+'…':s;
}

/* 附件预览（原型不内置真实文件，弹层给出文件信息与说明） */
function openFile(i,j){
 var p=policies.filter(function(x){return x.mo!=='sh';})[i];
 if(!p||!p.files[j])return;
 var f=p.files[j];
 var isPdf=/\.pdf$/i.test(f.name);
 var body='<div class="rounded-2xl flex items-center justify-center" style="height:150px;background:#F5F3FF">'
  +'<div class="text-center"><i class="fas '+(isPdf?'fa-file-pdf':'fa-file-word')+' text-[42px]" style="color:#A78BFA"></i>'
  +'<p class="text-[10px] text-gray-500 mt-2">'+esc(f.name)+'</p></div></div>'
  +'<div class="mt-3 text-[11px] space-y-2">'
  +'<div class="flex justify-between"><span class="text-gray-400">文件名</span><span class="text-gray-700 text-right max-w-[230px] break-all">'+esc(f.name)+'</span></div>'
  +'<div class="flex justify-between"><span class="text-gray-400">大小</span><span class="text-gray-700">'+esc(f.size)+'</span></div>'
  +'<div class="flex justify-between"><span class="text-gray-400">来源</span><span class="text-gray-700">运营发布时上传</span></div></div>'
  +'<p class="text-[9px] text-gray-400 mt-3 leading-relaxed">原型未内置附件文件；正式环境点开为在线预览（PDF / Office），可下载。</p>'
  +'<button onclick="closeFile()" class="card w-full mt-3 py-2.5 rounded-xl text-[13px] font-bold text-white" style="background:linear-gradient(135deg,#8B5CF6,#7C3AED)">关闭</button>';
 document.getElementById('fileBody').innerHTML=body;
 document.getElementById('fileMask').classList.add('on');
 document.getElementById('fileSheet').classList.add('on');
}
function closeFile(){
 document.getElementById('fileMask').classList.remove('on');
 document.getElementById('fileSheet').classList.remove('on');
}

/* 申请网址：真实跳转（新窗口） */
function openApply(i){
 var p=policies.filter(function(x){return x.mo!=='sh';})[i];
 if(!p||!p.applyUrl){toast('该政策未配置申请网址');return;}
 window.open(p.applyUrl,'_blank');
}

var toastTimer;
function toast(msg){
 var t=document.getElementById('toast');
 t.querySelector('span').textContent=msg;
 t.classList.add('on');clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){t.classList.remove('on')},1800);
}

renderPolicies();
</script>
<script src="../shared/page-prd.js"></script>
</body>
</html>
