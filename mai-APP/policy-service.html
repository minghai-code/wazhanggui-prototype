  btn.addEventListener('click',function(){
   var wrap=btn.nextElementSibling;
   var chev=btn.querySelector('.chevron');
   var open=wrap.classList.toggle('open');
   if(open){chev.style.transform='rotate(180deg)';btn.innerHTML='收起详情<i class="fas fa-chevron-up text-[9px]"></i>';}
   else{chev.style.transform='rotate(0)';btn.innerHTML='查看详情<i class="fas fa-chevron-down text-[9px]"></i>';}
  });
 });
 document.querySelectorAll('.applyBtn').forEach(function(btn){
  btn.addEventListener('click',function(){
   var t=document.getElementById('toast');
   t.classList.add('on');
   setTimeout(function(){t.classList.remove('on');},1800);
  });
 });
}

document.querySelectorAll('#catTabBar .tab-item').forEach(function(tab){
 tab.addEventListener('click',function(){
  document.querySelectorAll('#catTabBar .tab-item').forEach(function(t){
   t.classList.remove('on');
   t.style.background='#fff';
   t.style.color='#6B7280';
   t.classList.remove('shadow-soft');
  });
  tab.classList.add('on');
  tab.style.background='linear-gradient(135deg,#8B5CF6,#7C3AED)';
  tab.style.color='#fff';
  tab.classList.add('shadow-soft');
  currentCat=tab.dataset.cat;
  renderPolicies(currentCat);
 });
});

renderPolicies('全部');
</script>
</body>
</html>
