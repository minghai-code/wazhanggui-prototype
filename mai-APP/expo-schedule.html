<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>展会日程 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="backend-config.js"></script>
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.shadow-card{box-shadow:0 8px 24px rgba(236,72,153,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease}.card:active{transform:scale(.965)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{font-size:15px;font-weight:800;letter-spacing:.3px;color:#1F2430}
.day-tab{cursor:pointer;transition:.15s}
.day-tab.on{color:#fff;background:linear-gradient(135deg,#FB7185,#EC4899);box-shadow:0 4px 12px rgba(236,72,153,.25)}
.day-tab:not(.on){color:#9aa0ac;background:#fff}
.session-card{position:relative;padding-left:28px;padding-bottom:16px}
.session-card:last-child{padding-bottom:0}
.session-card::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:#FCE7F3}
.session-card:last-child::before{display:none}
.session-dot{position:absolute;left:4px;top:2px;width:12px;height:12px;border-radius:50%;border:3px solid #EC4899;background:#fff;z-index:2}
.type-tag{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:bold}
</style>
</head>
<body>

<!-- 顶部渐变区 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#FB7185 0%,#EC4899 40%,#7C3AED 100%)">
<div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FB7185"></div>
<div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#EC4899"></div>
<div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
<span>9:41</span>
<div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
</div>
<div class="relative flex items-center gap-2.5 mt-1">
<a href="expo.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
<div>
<h1 class="text-white font-extrabold text-[18px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)"><i class="fas fa-calendar-check text-[15px] mr-1"></i>展会日程</h1>
<p class="text-white/70 text-[10px] mt-0.5">2026.10.18-10.20 · 大唐袜业城</p>
</div>
</div>
</div>

<!-- Day Tab -->
<div class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-gray-100 px-3 py-2.5">
<div class="flex gap-2">
<div class="day-tab on flex-1 text-center py-2.5 rounded-xl text-[12px] font-bold" onclick="switchDay(1,this)">
<div>Day 1</div><div class="text-[9px] mt-0.5 opacity-80">10.18 开幕日</div>
</div>
<div class="day-tab flex-1 text-center py-2.5 rounded-xl text-[12px] font-bold" onclick="switchDay(2,this)">
<div>Day 2</div><div class="text-[9px] mt-0.5 opacity-80">10.19 专业日</div>
</div>
<div class="day-tab flex-1 text-center py-2.5 rounded-xl text-[12px] font-bold" onclick="switchDay(3,this)">
<div>Day 3</div><div class="text-[9px] mt-0.5 opacity-80">10.20 公众日</div>
</div>
<div class="day-tab flex-1 text-center py-2.5 rounded-xl text-[12px] font-bold" onclick="switchMine(this)">
<div>我的日程</div><div class="text-[9px] mt-0.5 opacity-80" id="mineCount">0 场</div>
</div>
</div>
</div>

<!-- 内容区 -->
<div class="px-3 mt-3" id="scheduleArea"></div>

<div class="h-16"></div>

<!-- 底部 -->
<div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-gray-100 flex items-center justify-between px-4" style="height:55px;z-index:100;width:393px;padding-bottom:8px">
<span class="text-[10px] text-gray-400"><i class="fas fa-clock mr-1" style="color:#EC4899"></i>时间均为北京时间</span>
<a href="expo-visitor-apply.html" class="text-[11px] text-white px-3 py-1.5 rounded-full font-bold" style="background:linear-gradient(135deg,#FB7185,#EC4899)">参观报名</a>
</div>
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:2px"></div></div>

<div class="toast" id="toast"><i class="fas fa-circle-check" style="color:#4ADE80"></i><span id="toastTxt">操作成功</span></div>

<script>
function toast(msg){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2000)}

/* ===== 我的日程：localStorage 持久化（后台日程发布/变更通知的用户侧记录） ===== */
var MY_SCHEDULE_KEY='expoMySchedule';
var curView='day',curDay=1;
function getMySchedule(){try{return JSON.parse(localStorage.getItem(MY_SCHEDULE_KEY)||'[]')}catch(e){return []}}
function saveMySchedule(a){try{localStorage.setItem(MY_SCHEDULE_KEY,JSON.stringify(a))}catch(e){}}
function inMySchedule(id){return getMySchedule().indexOf(id)>-1}
function toggleMySchedule(id){
 var a=getMySchedule();
 var i=a.indexOf(id);
 if(i>-1){a.splice(i,1);toast('已取消：'+(EXPO_SESSIONS[id]?EXPO_SESSIONS[id].title:id))}
 else{a.push(id);toast('已加入我的日程')}
 saveMySchedule(a);
 refreshMineCount();
 if(curView==='mine')renderMine();else renderSchedule(curDay);
}

/* 以下旧数据已废弃，议程统一读取 backend-config.js 的 EXPO_SESSIONS（全局唯一 ID） */
var schedules__DEPRECATED__use_EXPO_SESSIONS={
 1:[
  {time:'08:30-09:00',title:'嘉宾签到入场',loc:'主会场·签到处',type:'签到',typeBg:'#D1FAE5',typeColor:'#059669',speaker:''},
  {time:'09:00-09:30',title:'开幕仪式',loc:'主会场·A馆舞台',type:'仪式',typeBg:'#FCE7F3',typeColor:'#EC4899',speaker:'诸暨市领导/行业协会代表'},
  {time:'09:30-10:00',title:'展馆正式开放',loc:'全馆开放',type:'展览',typeBg:'#DBEAFE',typeColor:'#2563EB',speaker:''},
  {time:'10:00-11:30',title:'袜业高质量发展论坛',loc:'论坛区·会议厅A',type:'论坛',typeBg:'#FEF3C7',typeColor:'#D97706',speaker:'中国纺织工业联合会领导/行业专家'},
  {time:'11:30-12:00',title:'2026中国袜业白皮书发布',loc:'论坛区·会议厅A',type:'发布',typeBg:'#EDE9FE',typeColor:'#7C3AED',speaker:'中国针织工业协会秘书长'},
  {time:'13:30-15:00',title:'智能袜机技术交流会',loc:'技术区·会议厅B',type:'交流',typeBg:'#DBEAFE',typeColor:'#2563EB',speaker:'意大利罗纳地/日本岛精代表'},
  {time:'15:00-17:00',title:'品牌展商新品路演',loc:'路演区·中央舞台',type:'路演',typeBg:'#FCE7F3',typeColor:'#EC4899',speaker:'8家头部品牌依次路演'},
  {time:'17:30-19:00',title:'欢迎晚宴（凭邀请函）',loc:'大唐·袜业宴会厅',type:'社交',typeBg:'#D1FAE5',typeColor:'#059669',speaker:''}
 ],
 2:[
  {time:'09:00-12:00',title:'供需精准对接会',loc:'对接区·洽谈厅A-D',type:'对接',typeBg:'#FEF3C7',typeColor:'#D97706',speaker:'200+采购商与展商一对一洽谈'},
  {time:'09:30-10:30',title:'跨境出海峰会',loc:'论坛区·会议厅A',type:'论坛',typeBg:'#FCE7F3',typeColor:'#EC4899',speaker:'亚马逊/Temu/TikTok官方代表'},
  {time:'10:30-12:00',title:'新材料·新工艺发布会',loc:'路演区·中央舞台',type:'发布',typeBg:'#EDE9FE',typeColor:'#7C3AED',speaker:'杜邦/兰精/巴斯夫等原料商'},
  {time:'14:00-15:30',title:'30+品牌新品发布会',loc:'路演区·中央舞台',type:'发布',typeBg:'#DBEAFE',typeColor:'#2563EB',speaker:'各品牌设计总监'},
  {time:'14:00-16:00',title:'跨境电商选品大会',loc:'对接区·洽谈厅E',type:'对接',typeBg:'#D1FAE5',typeColor:'#059669',speaker:'电商平台官方选品团队'},
  {time:'16:00-17:30',title:'袜业设计大赛决赛',loc:'主会场·A馆舞台',type:'赛事',typeBg:'#FCE7F3',typeColor:'#EC4899',speaker:'评委团/入围设计师'},
  {time:'18:00-20:00',title:'行业交流酒会',loc:'大唐·袜业宴会厅',type:'社交',typeBg:'#D1FAE5',typeColor:'#059669',speaker:''}
 ],
 3:[
  {time:'09:00-12:00',title:'公众开放日',loc:'全馆开放',type:'展览',typeBg:'#DBEAFE',typeColor:'#2563EB',speaker:''},
  {time:'09:30-10:30',title:'网红达人探馆直播',loc:'全馆巡馆',type:'直播',typeBg:'#FCE7F3',typeColor:'#EC4899',speaker:'10+头部达人'},
  {time:'10:30-11:30',title:'消费者互动体验活动',loc:'互动区·中央广场',type:'活动',typeBg:'#D1FAE5',typeColor:'#059669',speaker:''},
  {time:'13:00-14:00',title:'采购商抽奖活动',loc:'主会场·A馆舞台',type:'活动',typeBg:'#FEF3C7',typeColor:'#D97706',speaker:'凭采购证件参与'},
  {time:'14:00-15:00',title:'颁奖典礼暨闭幕仪式',loc:'主会场·A馆舞台',type:'仪式',typeBg:'#FCE7F3',typeColor:'#EC4899',speaker:'组委会/获奖企业代表'},
  {time:'15:00-16:00',title:'展馆闭幕撤展',loc:'全馆',type:'展览',typeBg:'#E5E7EB',typeColor:'#6B7280',speaker:''}
 ]
};

function switchDay(day,el){
 document.querySelectorAll('.day-tab').forEach(function(t){t.classList.remove('on')});
 el.classList.add('on');
 curView='day';curDay=day;
 renderSchedule(day);
}

function switchMine(el){
 document.querySelectorAll('.day-tab').forEach(function(t){t.classList.remove('on')});
 el.classList.add('on');
 curView='mine';
 renderMine();
}

function renderSchedule(day){
 var list=expoSessionsByDay(day);
 var html='';
 list.forEach(function(it){
  var s=it.s,id=it.id;
  var mine=inMySchedule(id);
  html+='<div class="session-card fade-up">';
  html+='<div class="session-dot" style="border-color:'+s.typeColor+'"></div>';
  html+='<div class="flex items-center gap-1.5 mb-1">';
  html+='<span class="text-[11px] font-bold text-gray-800">'+s.time+'</span>';
  html+='<span class="type-tag" style="background:'+s.typeBg+';color:'+s.typeColor+'">'+s.type+'</span>';
  html+='</div>';
  html+='<a href="expo-session-detail.html?id='+id+'" class="block">';
  html+='<p class="text-[12px] font-bold text-gray-800">'+s.title+'</p>';
  html+='<p class="text-[10px] text-gray-400 mt-0.5"><i class="fas fa-location-dot mr-0.5"></i>'+s.loc+'</p>';
  if(s.speaker)html+='<p class="text-[10px] text-gray-500 mt-0.5"><i class="fas fa-microphone mr-0.5"></i>'+s.speaker+'</p>';
  html+='<p class="text-[8px] text-gray-300 mt-1 font-mono">议程ID '+id+'</p>';
  html+='</a>';
  html+='<div class="flex items-center gap-2 mt-2">';
  html+='<a href="expo-session-detail.html?id='+id+'" class="text-[10px] text-gray-500 px-2.5 py-1 rounded-full bg-gray-100 font-bold">查看详情</a>';
  html+='<button onclick="toggleMySchedule(\''+id+'\')" class="text-[10px] font-bold px-2.5 py-1 rounded-full" style="'+(mine?'background:#FCE7F3;color:#EC4899':'background:#F0FDF4;color:#059669')+'"><i class="fas '+(mine?'fa-bookmark-slash':'fa-bookmark')+' mr-0.5"></i>'+(mine?'已加入':'加入日程')+'</button>';
  html+='</div>';
  html+='</div>';
 });
 if(!list.length)html='<p class="text-[11px] text-gray-400 text-center py-6">当日暂无议程</p>';
 document.getElementById('scheduleArea').innerHTML=html;
}

function renderMine(){
 var ids=getMySchedule();
 var html='';
 if(!ids.length){
  html='<div class="text-center py-10"><div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-2"><i class="fas fa-calendar-plus text-gray-300 text-xl"></i></div><p class="text-[11px] text-gray-400">还没有加入任何议程</p><p class="text-[9px] text-gray-300 mt-1">在日程列表或议程详情点击「加入日程」</p></div>';
 }else{
  var dayName={1:'Day1 · 10.18',2:'Day2 · 10.19',3:'Day3 · 10.20'};
  ids.forEach(function(id){
   var s=EXPO_SESSIONS[id];
   if(!s)return;
   html+='<div class="bg-white/85 backdrop-blur-xl rounded-2xl shadow-soft p-3 border border-white mb-2.5 fade-up">';
   html+='<div class="flex items-start gap-2.5">';
   html+='<span class="text-[8px] font-bold text-white px-1.5 py-0.5 rounded flex-shrink-0 mt-0.5" style="background:'+s.typeColor+'">'+s.type+'</span>';
   html+='<a href="expo-session-detail.html?id='+id+'" class="flex-1 min-w-0"><p class="text-[12px] font-bold text-gray-800">'+s.title+'</p>';
   html+='<p class="text-[9px] text-gray-400 mt-0.5">'+dayName[s.day]+' · '+s.time+' · '+s.loc+'</p>';
   html+='<p class="text-[8px] text-gray-300 mt-0.5 font-mono">'+id+'</p></a>';
   html+='<button onclick="toggleMySchedule(\''+id+'\')" class="text-[9px] text-gray-400 px-2 py-1 rounded-full bg-gray-100 flex-shrink-0">取消</button>';
   html+='</div></div>';
  });
 }
 document.getElementById('scheduleArea').innerHTML=html;
}

function refreshMineCount(){
 var el=document.getElementById('mineCount');
 if(el)el.textContent=getMySchedule().length+' 场';
}

renderSchedule(1);
refreshMineCount();
</script>
</body>
</html>
