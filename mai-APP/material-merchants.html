var curCat='all',curSort='default',curShop=null;

function getList(){
  var kw=(document.getElementById('shopSearch').value||'').trim().toLowerCase();
  var list=shops.filter(function(s){
    var okC=(curCat==='all'||s.key===curCat);
    var okK=(!kw||s.name.toLowerCase().indexOf(kw)>-1||s.id.toLowerCase().indexOf(kw)>-1||s.main.toLowerCase().indexOf(kw)>-1||s.cat.indexOf(kw)>-1);
    return okC&&okK;
  });
  if(curSort==='rating')list.sort(function(a,b){return b.rating-a.rating});
  else if(curSort==='sku')list.sort(function(a,b){return b.sku-a.sku});
  else if(curSort==='dist')list.sort(function(a,b){return a.dist-b.dist});
  return list;
}

function cardHTML(s,i){
  return '<a href="material-shop-detail.html?id='+s.id+'" class="card block bg-white rounded-2xl shadow-soft p-2.5 mb-2 fade-up" style="animation-delay:'+(i*.04)+'s">'
    +'<div class="flex items-center gap-2.5">'
    +'<div class="w-11 h-11 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,'+s.color+','+s.color+'CC)"><i class="fas '+s.icon+' text-sm"></i></div>'
    +'<div class="flex-1 min-w-0">'
    +'<div class="flex items-center gap-1.5"><p class="text-[12px] font-bold text-gray-800 truncate">'+s.name+'</p><span class="text-[8px] px-1.5 py-0.5 rounded flex-shrink-0" style="background:#ECFDF5;color:#059669">'+s.cat+'</span></div>'
    +'<p class="text-[9px] text-gray-400 mt-0.5">'+s.id+' · '+s.loc+' · ★'+s.rating+' · '+s.years+'年店 · '+s.sku+'个商品</p>'
    +'<p class="text-[9px] text-gray-500 mt-0.5 truncate">主营：'+s.main+'</p>'
    +'<div class="flex flex-wrap gap-1 mt-1">'+s.tags.slice(0,2).map(function(t){return '<span class="text-[8px] px-1.5 py-0.5 rounded" style="background:#F4F6F8;color:#6b7080">'+t+'</span>'}).join('')+'</div>'
    +'</div>'
    +'<div class="flex flex-col items-end gap-1 flex-shrink-0">'
    +'<span onclick="event.preventDefault();event.stopPropagation();callById(\''+s.id+'\')" class="w-8 h-8 rounded-full flex items-center justify-center" style="background:#ECFDF5;color:#059669"><i class="fas fa-phone text-[11px]"></i></span>'
    +'<span class="text-[8px] text-gray-400">'+s.dist+'km</span>'
    +'</div></div></a>';
}

function renderAll(){
  var list=getList();
  /* 地图点位 */
  var mh='';
  shops.forEach(function(s){
    var dim=(list.indexOf(s)<0)?' dim':'';
    mh+='<div class="m-pin'+dim+'" style="left:'+s.x+'%;top:'+s.y+'%" onclick="openShop(\''+s.id+'\')">'
      +'<div class="pin-dot" style="background:'+s.color+'"><i class="fas '+s.icon+'"></i></div>'
      +'<span class="pin-name">'+s.name+'</span></div>';
  });
  document.getElementById('bigMap').innerHTML=mh;

  var html='';
  if(list.length===0){
    html='<div class="bg-white rounded-2xl shadow-soft py-10 text-center"><i class="fas fa-box-open text-gray-300 text-2xl mb-2"></i><p class="text-[11px] text-gray-400">没有找到匹配的商户</p><p class="text-[10px] text-gray-300 mt-1">试试更换品类或清空搜索词</p></div>';
  }else{
    list.forEach(function(s,i){html+=cardHTML(s,i)});
  }
  document.getElementById('shopList').innerHTML=html;
  document.getElementById('shopList2').innerHTML=html;
  document.getElementById('resultTip').textContent='共 '+list.length+' 家';
  document.getElementById('resultTip2').textContent='共 '+list.length+' 家';
}

function filterCat(cat,el){
  curCat=cat;
  document.querySelectorAll('#catFilter .tag-opt').forEach(function(i){i.classList.remove('on')});
  el.classList.add('on');
  renderAll();
}
function sortBy(k,el){
  curSort=k;
  document.querySelectorAll('#sortBar .sort-item').forEach(function(i){i.classList.remove('on')});
  el.classList.add('on');
  renderAll();
}
function switchMode(m){
  var mv=document.getElementById('mapView'),lv=document.getElementById('listView');
  var vm=document.getElementById('vtMap'),vl=document.getElementById('vtList');
  if(m==='map'){mv.style.display='';lv.style.display='none';vm.className='vt on';vl.className='vt'}
  else{mv.style.display='none';lv.style.display='';vm.className='vt';vl.className='vt on'}
}

function findShop(id){
  var r=null;shops.forEach(function(s){if(s.id===id)r=s});
  return r;
}
function openShop(id){
  var s=findShop(id);if(!s)return;
  curShop=s;
  var av=document.getElementById('mpAvatar');
  av.style.background='linear-gradient(135deg,'+s.color+','+s.color+'CC)';
  av.innerHTML='<i class="fas '+s.icon+' text-sm"></i>';
  document.getElementById('mpName').textContent=s.name;
  document.getElementById('mpMeta').textContent=s.id+' · '+s.loc+' · ★'+s.rating+' · '+s.years+'年店 · '+s.sku+'个商品';
  document.getElementById('mpMain').textContent=s.main;
  document.getElementById('mpDesc').textContent=s.desc;
  document.getElementById('mpLoc').textContent=s.loc;
  document.getElementById('mpTel').textContent=s.tel;
  var th='';
  s.tags.forEach(function(t){th+='<span class="text-[9px] px-2 py-1 rounded-lg font-medium" style="background:#ECFDF5;color:#059669">'+t+'</span>'});
  th+='<span class="text-[9px] px-2 py-1 rounded-lg font-medium" style="background:#F4F6F8;color:#6b7080">'+s.cat+'</span>';
  document.getElementById('mpTags').innerHTML=th;
  var gh='';
  s.goods.slice(0,4).forEach(function(g){gh+='<img src="images/'+g.img+'" class="w-[56px] h-[56px] rounded-lg object-cover flex-shrink-0">'});
  document.getElementById('mpGoods').innerHTML=gh;
  document.getElementById('mPanel').style.transform='translateY(0)';
  document.getElementById('mOverlay').style.opacity='1';
  document.getElementById('mOverlay').style.pointerEvents='auto';
}
function closeShop(){
  document.getElementById('mPanel').style.transform='translateY(100%)';
  document.getElementById('mOverlay').style.opacity='0';
  document.getElementById('mOverlay').style.pointerEvents='none';
}
function callById(id){
  var s=findShop(id);if(!s)return;
  toast('正在呼叫 '+s.name+' '+s.tel);
}
function callShop(){if(curShop)toast('正在呼叫 '+curShop.name+' '+curShop.tel)}
function gotoShop(){if(curShop)window.location.href='material-shop-detail.html?id='+curShop.id}

/* URL 参数支持：?cat=yarn */
(function(){
  var m=location.search.match(/cat=([^&]*)/);
  if(m){
    var key=m[1];
    var el=document.querySelector('#catFilter .tag-opt[onclick*="\''+key+'\'"]');
    if(el){curCat=key;document.querySelectorAll('#catFilter .tag-opt').forEach(function(i){i.classList.remove('on')});el.classList.add('on')}
  }
  renderAll();
})();
</script>
