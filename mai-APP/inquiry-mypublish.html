<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4;--v1:#7C3AED;--v2:#FF2D78}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
.card{transition:transform .16s ease;cursor:pointer}
.card:active{transform:scale(.965)}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info-lbl{font-size:11px;color:#6b7080;background:rgba(248,249,250,.9);border-radius:8px;padding:5px 9px;white-space:nowrap}
.badge-rank{font-size:9px;font-weight:700;color:#fff;padding:2px 6px;border-radius:8px}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:140px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<!-- ===== 顶部：渐变 ===== -->
<div class="relative px-4 pt-2 pb-6 overflow-hidden" style="background:linear-gradient(135deg,#FF8A4C 0%,#FF4D2D 40%,#E63E20 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FF8A4C"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FF2D78"></div>
  <div class="absolute -bottom-10 left-12 w-44 h-44 rounded-full blur-3xl opacity-35" style="background:#FF7849"></div>

  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <div class="relative flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="inquiry.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white flex-shrink-0"><i class="fas fa-chevron-left text-sm"></i></a>
      <span class="text-white font-extrabold text-[18px] tracking-wide" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">我的发布</span>
    </div>
    <span class="text-white/85 text-[11px]"><i class="fas fa-share-nodes mr-1"></i>分享</span>
  </div>
</div>

<div class="px-3 -mt-3 relative z-10">

<!-- 我的需求卡片 -->
<div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-soft p-3.5 fade-up border border-white">
<div class="flex items-center justify-between mb-2">
  <span class="text-[11px] text-gray-400" id="pubTime">2小时前发布</span>
  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full" id="statusPill" style="background:#FFF0E8;color:#FF6B35"><i class="fas fa-clock"></i> 报价中</span>
</div>
<p class="text-[15px] font-bold text-gray-900" id="dTitle">男士精梳棉商务袜 透气防臭</p>
<div class="flex gap-1.5 mt-2 flex-wrap" id="dChips"></div>
<p class="text-[11px] text-gray-500 mt-2 leading-relaxed" id="dDesc">常备两色，罗口适中，交期7天内，支持打样含运费。</p>
</div>

<!-- 报价统计条 -->
<div class="mt-3 rounded-3xl p-3 flex items-center justify-between fade-up" style="background:linear-gradient(135deg,#FF6B35,#FF2D78);box-shadow:0 8px 20px rgba(255,45,120,.25)">
<div class="text-white text-center flex-1"><p class="text-[20px] font-extrabold" id="statCount">8</p><p class="text-[9px] text-white/85 mt-0.5">商家报价</p></div>
<div class="w-px h-8 bg-white/30"></div>
<div class="text-white text-center flex-1"><p class="text-[20px] font-extrabold" id="statLow">¥3.1</p><p class="text-[9px] text-white/85 mt-0.5">最低报价</p></div>
<div class="w-px h-8 bg-white/30"></div>
<div class="text-white text-center flex-1"><p class="text-[20px] font-extrabold" id="statAvg">¥3.4</p><p class="text-[9px] text-white/85 mt-0.5">平均报价</p></div>
</div>

<!-- 报价列表标题 -->
<div class="mt-4 flex items-center justify-between mb-2.5">
<div class="flex items-center gap-1.5"><div class="w-1.5 h-3.5 rounded-full" style="background:#FF4D2D"></div><span class="sec-title" style="font-size:15px">全部商家报价</span></div>
<div class="flex items-center gap-1.5">
<button class="px-2.5 py-1 rounded-lg text-[10px] font-semibold" style="background:#FF4D2D;color:#fff" onclick="toast('已按价格从低到高排序')">价格最低</button>
<button class="px-2.5 py-1 rounded-lg text-[10px] bg-white shadow-soft text-gray-500" onclick="toast('已按综合评分排序')">综合最优</button>
</div>
</div>

<!-- 报价卡片列表，由JS渲染 -->
<div id="quoteList" class="space-y-2"></div>

<div class="mt-4 rounded-2xl p-3 text-center text-[10px] text-gray-400" style="background:#fff;box-shadow:0 1px 6px rgba(20,20,40,.04)">
<i class="fas fa-lock mr-1" style="color:#10B981"></i>你已授权「选标成交」，选定后其他报价方将收到结果通知
</div>
</div>

<div class="h-24"></div>

<!-- 底部Tab栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:150;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">
<a href="home.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-house text-[18px]"></i><span class="text-[9px] font-semibold">首页</span></a>
<a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
<a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
<a href="property.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-building text-[18px]"></i><span class="text-[9px]">物业</span></a>
<a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
</div>
</div>
<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:151;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<!-- 消息提示 -->
<div class="toast" id="toast"><i class="fas fa-circle-check text-[#4ADE80]"></i><span id="toastTxt">操作成功</span></div>

<!-- 选标确认弹层 -->
<div class="absolute inset-0" id="bgMask" style="display:none;background:rgba(0,0,0,.4);z-index:130"></div>
<div class="fixed bottom-0 left-0 right-0 rounded-t-3xl bg-white" id="dealSheet" style="display:none;z-index:140;width:393px;padding-bottom:40px">
<div class="px-4 pt-3 pb-4">
<div class="w-10 h-1 rounded-full bg-gray-200 mx-auto"></div>
<div class="w-14 h-14 mx-auto mt-4 rounded-full flex items-center justify-center text-white shadow-card" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)"><i class="fas fa-gavel text-xl"></i></div>
<p class="text-[16px] font-bold text-gray-900 text-center mt-3">确认与该商家成交？</p>
<p class="text-[11px] text-gray-500 text-center mt-1.5">选定后你将与该商家达成交易，其他报价方将收到结果通知</p>
<div class="mt-3 rounded-2xl p-3" style="background:#FFF7F4;border:1px solid #ffede5">
<div class="flex items-center gap-2">
<div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-[13px] font-bold" id="dealAvatar" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D)">丰</div>
<div class="flex-1"><p class="text-[12px] font-bold text-gray-800" id="dealName">丰棉织造</p><p class="text-[9px] text-gray-400 mt-0.5">源头工厂 · 3年店</p></div>
</div>
<div class="flex items-end justify-between mt-2.5">
<span class="text-[11px] text-gray-500">成交单价 <span class="text-grad font-bold text-[20px]" id="dealPrice">¥3.10</span><span class="text-[9px] text-gray-400">/双</span></span>
<span class="text-[11px] text-gray-500" id="dealQty">数量 1000双</span>
</div>
</div>
<div class="flex gap-2 mt-4">
<button class="flex-1 py-3 rounded-2xl text-[13px] font-medium text-gray-500" style="background:#F3F4F6" onclick="closeDeal()">再考虑</button>
<button class="flex-1 py-3 rounded-2xl text-white text-[13px] font-bold grad-h shadow-card" onclick="confirmDeal()"><i class="fas fa-check mr-1 text-xs"></i>确认成交</button>
</div>
</div>
</div>

<script>
var P={
 7:{title:'男士精梳棉商务袜 透气防臭',cat:'男袜',qty:'1000双',price:'期望 ¥3.5/双',desc:'常备两色，罗口适中，交期7天内，支持打样含运费。',time:'2小时前发布',pill:'<i class="fas fa-clock"></i> 报价中',pillbg:'#FFF0E8',pillc:'#FF6B35',count:8,
  quotes:[
   {rank:1,supplier:'丰棉织造',tag:'源头工厂',score:'4.9分',initial:'丰',c:'linear-gradient(135deg,#FF8A4C,#FF4D2D)',price:'3.10',qty:'1000双',delivery:'3天内',sample:'支持打样',note:'源头直供，精梳棉现货，含运费可开票。',time:'10分钟前'},
   {rank:2,supplier:'大唐自有品牌旗舰店',tag:'实力商家',score:'4.9分',initial:'唐',c:'linear-gradient(135deg,#3B82F6,#6366F1)',price:'3.20',qty:'1000双',delivery:'7天内',sample:'支持打样',note:'成熟机台产能充足，附检测报告。',time:'25分钟前'},
   {rank:3,supplier:'大唐百人袜业',tag:'企业认证',score:'4.7分',initial:'百',c:'linear-gradient(135deg,#10B981,#059669)',price:'3.30',qty:'1000双',delivery:'7天内',sample:'付费打样',note:'常规款可快速配送。',time:'40分钟前'},
   {rank:4,supplier:'恒力针纺',tag:'企业认证',score:'4.6分',initial:'恒',c:'linear-gradient(135deg,#F59E0B,#D97706)',price:'3.45',qty:'800双',delivery:'10天内',sample:'支持打样',note:'产能可调动，分批交付。',time:'1小时前'},
   {rank:5,supplier:'一枝春袜业',tag:'新晋商家',score:'4.5分',initial:'一',c:'linear-gradient(135deg,#EC4899,#F43F5E)',price:'3.60',qty:'1000双',delivery:'15天内',sample:'支持打样',note:'新店冲量，价格可谈。',time:'1小时前'}
  ]},
 8:{title:'男士刺绣薄袜 莱卡棉',cat:'男袜',qty:'200双',price:'期望 ¥3.0/双',desc:'莱卡棉薄款，Logo刺绣，整盒包装。',time:'1天前发布',pill:'<i class="fas fa-clock"></i> 报价中',pillbg:'#FFF0E8',pillc:'#FF6B35',count:3,
  quotes:[
   {rank:1,supplier:'大唐自有品牌旗舰店',tag:'实力商家',score:'4.9分',initial:'唐',c:'linear-gradient(135deg,#3B82F6,#6366F1)',price:'2.85',qty:'200双',delivery:'5天内',sample:'支持打样',note:'刺绣工艺成熟，含设计费。',time:'3小时前'},
   {rank:2,supplier:'织梦工艺坊',tag:'企业认证',score:'4.4分',initial:'织',c:'linear-gradient(135deg,#8B5CF6,#7C3AED)',price:'2.95',qty:'200双',delivery:'10天内',sample:'付费打样',note:'需确认刺绣图案。',time:'5小时前'},
   {rank:3,supplier:'恒力针纺',tag:'企业认证',score:'4.6分',initial:'恒',c:'linear-gradient(135deg,#F59E0B,#D97706)',price:'3.10',qty:'200双',delivery:'7天内',sample:'支持打样',note:'常规款，起订量低至100双。',time:'8小时前'}
  ]}
};
var currentDeal=null,toastTimer;
function toast(msg){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1600)}
function get(id){return P[id]||P[7];}
function quoteCard(q,idx){
  var r=q.rank;var rankColor=r===1?'linear-gradient(135deg,#F59E0B,#FBBF24)':r===2?'linear-gradient(135deg,#9CA3AF,#D1D5DB)':r===3?'linear-gradient(135deg,#D97706,#B45309)':'linear-gradient(135deg,#E5E7EB,#E5E7EB)';
  var badge=r<=3?'<span class="badge-rank" style="background:'+rankColor+'">'+r+'</span>':'';
  return '<div class="bg-white rounded-2xl shadow-soft p-3 fade-up" >'
   +'<div class="flex items-center justify-between">'
   +'<div class="flex items-center gap-2"><span class="w-5 h-5 rounded flex items-center justify-center text-[9px] font-bold text-white" style="background:'+rankColor+'">'+r+'</span><span class="text-[10px] text-gray-400">'+q.time+'</span></div>'
   +'<button class="text-[11px] font-semibold px-2 py-0.5 rounded-full" style="background:#F5F6F8;color:#6b7080" onclick="toast(\'已收藏该商家\')"><i class="fas fa-star mr-0.5 text-[9px]" style="color:#F59E0B"></i>关注</button></div>'
   +'<div class="flex items-center gap-2.5 mt-2.5">'
   +'<div class="w-11 h-11 rounded-xl flex items-center justify-center text-white text-[15px] font-bold" style="background:'+q.c+'">'+q.initial+'</div>'
   +'<div class="flex-1 min-w-0"><div class="flex items-center gap-1.5"><p class="text-[13px] font-bold text-gray-800 truncate">'+q.supplier+'</p><span class="text-[8px] px-1.5 py-0.5 rounded" style="background:#FFF0E8;color:#FF6B35">'+q.tag+'</span></div>'
   +'<div class="flex items-center gap-2 mt-1"><span class="text-[10px] text-gray-400"><i class="fas fa-star text-[9px]" style="color:#F59E0B"></i> '+q.score+'</span><span class="text-[10px] text-gray-300">·</span><span class="text-[10px] text-gray-400"><i class="fas fa-truck-fast text-[9px]"></i> 交期'+q.delivery+'</span></div></div></div>'
   +'<div class="mt-2.5 rounded-xl p-2.5" style="background:#FFF7F4;border:1px solid #ffede5">'
   +'<div class="flex items-end justify-between"><span class="text-[11px] text-gray-500">报价 <span class="text-grad font-bold text-[19px]">¥'+q.price+'</span><span class="text-[9px] text-gray-400">/双</span></span><span class="text-[11px] text-gray-500">数量 '+q.qty+'</span></div>'
   +'<p class="text-[10px] text-gray-500 leading-relaxed mt-1.5">'+q.note+'</p></div>'
   +'<div class="flex gap-2 mt-2.5">'
   +'<button class="card flex-1 py-2.5 rounded-xl text-[12px] font-semibold text-gray-500" style="background:#F5F6F8" onclick="toast(\'已打开与该商家的会话\')"><i class="fas fa-comment-dots mr-1 text-xs"></i>洽谈</button>'
   +'<button class="card flex-1 py-2.5 rounded-xl text-[12px] font-bold text-white" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D);box-shadow:0 4px 10px rgba(255,77,45,.25)" onclick="openDeal('+idx+')"><i class="fas fa-gavel mr-1 text-xs"></i>选标成交</button></div></div>';
}
function init(){
  var id=new URLSearchParams(location.search).get('id')||'7';var d=get(id);
  document.getElementById('pubTime').textContent=d.time;
  var pill=document.getElementById('statusPill');pill.innerHTML=d.pill;pill.style.background=d.pillbg;pill.style.color=d.pillc;
  document.getElementById('dTitle').textContent=d.title;
  document.getElementById('dChips').innerHTML='<span class="info-lbl"><i class="fas fa-shapes mr-1 text-gray-300"></i>'+d.cat+'</span><span class="info-lbl"><i class="fas fa-boxes-stacked mr-1 text-gray-300"></i>'+d.qty+'</span><span class="info-lbl"><i class="fas fa-tags mr-1" style="color:#FF4D2D"></i>'+d.price+'</span>';
  document.getElementById('dDesc').textContent=d.desc;
  document.getElementById('statCount').textContent=d.count;
  document.getElementById('statLow').textContent='¥'+d.quotes[0].price;
  var sum=d.quotes.reduce(function(a,b){return a+parseFloat(b.price)},0);
  document.getElementById('statAvg').textContent='¥'+(sum/d.quotes.length).toFixed(2);
  document.getElementById('quoteList').innerHTML=d.quotes.map(function(q,i){return quoteCard(q,i)}).join('');
}
function openDeal(idx){
  var d=get(new URLSearchParams(location.search).get('id')||'7');
  currentDeal=d.quotes[idx];
  document.getElementById('dealAvatar').style.background=currentDeal.c;
  document.getElementById('dealAvatar').textContent=currentDeal.initial;
  document.getElementById('dealName').textContent=currentDeal.supplier;
  document.getElementById('dealPrice').textContent='¥'+currentDeal.price;
  document.getElementById('dealQty').textContent='数量 '+currentDeal.qty;
  document.getElementById('bgMask').style.display='block';document.getElementById('dealSheet').style.display='block';
}
function closeDeal(){document.getElementById('bgMask').style.display='none';document.getElementById('dealSheet').style.display='none'}
function confirmDeal(){
  closeDeal();
  document.getElementById('toast').querySelector('i').className='fas fa-gavel';
  toast('已与「'+currentDeal.supplier+'」成交！');
  setTimeout(function(){location.href='inquiry.html'},1400);
}
init();
</script>
</body>
</html>
