    : (d.done?'<button class="card flex-1 py-2.5 rounded-xl text-[12px] font-semibold text-gray-400" style="background:#F3F4F6" disabled>未中选</button>'
      : '<button class="card flex-1 py-2.5 rounded-xl text-[12px] font-semibold text-gray-500" style="background:#F5F6F8" onclick="toast(\'已打开与该商家的会话\')"><i class="fas fa-comment-dots mr-1 text-xs"></i>洽谈</button><button class="card flex-1 py-2.5 rounded-xl text-[12px] font-bold text-white" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D);box-shadow:0 4px 10px rgba(255,77,45,.25)" onclick="openDeal('+idx+')"><i class="fas fa-gavel mr-1 text-xs"></i>选标成交</button>');
  return '<div class="bg-white rounded-2xl shadow-soft p-3 fade-up">'
   +'<div class="flex items-center justify-between">'
   +'<div class="flex items-center gap-2"><span class="w-5 h-5 rounded flex items-center justify-center text-[9px] font-bold text-white" style="background:'+rankColor+'">'+r+'</span><span class="text-[10px] text-gray-400">'+q.time+'</span></div>'
   +selectedTag+'</div>'
   +'<div class="flex items-center gap-2.5 mt-2.5" onclick="openSupplier(\''+q.supplier+'\')">'
   +'<div class="w-11 h-11 rounded-xl flex items-center justify-center text-white text-[15px] font-bold" style="background:'+q.c+'">'+q.initial+'</div>'
   +'<div class="flex-1 min-w-0"><div class="flex items-center gap-1.5"><p class="text-[13px] font-bold text-gray-800 truncate">'+q.supplier+'</p><span class="text-[8px] px-1.5 py-0.5 rounded" style="background:#FFF0E8;color:#FF6B35">'+q.tag+'</span></div>'
   +'<div class="flex items-center gap-2 mt-1"><span class="text-[10px] text-gray-400"><i class="fas fa-star text-[9px]" style="color:#F59E0B"></i> '+q.score+'</span><span class="text-[10px] text-gray-300">·</span><span class="text-[10px] text-gray-400"><i class="fas fa-truck-fast text-[9px]"></i> 交期'+q.delivery+'</span></div></div>'
   +'<i class="fas fa-chevron-right text-gray-300 text-[12px]"></i></div>'
   +'<div class="mt-2.5 rounded-xl p-2.5" style="background:#FFF7F4;border:1px solid #ffede5">'
   +'<div class="flex items-end justify-between"><span class="text-[11px] text-gray-500">报价 <span class="text-grad font-bold text-[19px]" style="color:#FF4D2D">¥'+q.price+'</span><span class="text-[9px] text-gray-400">/双</span></span><span class="text-[11px] text-gray-500">供货 '+q.qty+'</span></div>'
   +'<div class="flex flex-wrap gap-1.5 mt-2">'+shipTag+feeTag+supTag+'</div>'
   +'<p class="text-[10px] text-gray-500 leading-relaxed mt-1.5">'+q.note+'</p></div>'
   +sampleNote
   +'<div class="flex gap-2 mt-2.5">'+btns+'</div></div>';
}
function openSupplier(name){
  var s=SUP[name];if(!s)return;
  document.getElementById('supHead').innerHTML='<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white text-[18px] font-bold" style="background:'+s.c+'">'+s.initial+'</div><div class="flex-1"><p class="text-[15px] font-bold text-gray-900">'+name+'</p><p class="text-[10px] text-gray-400 mt-0.5">'+s.years+' · '+s.loc+'</p></div><span class="pill" style="background:#FFF0E8;color:#FF6B35;font-size:10px">'+s.main.split(' / ')[0]+'</span>';
  document.getElementById('supIntro').textContent=s.intro;
  document.getElementById('supMeta').innerHTML=['<div><p class="text-[14px] font-extrabold text-gray-800">'+s.years+'</p><p class="text-[9px] text-gray-400">经营时长</p></div>','<div><p class="text-[14px] font-extrabold text-gray-800">'+s.cap.replace('月产','')+'</p><p class="text-[9px] text-gray-400">产能</p></div>','<div><p class="text-[14px] font-extrabold text-gray-800">'+s.score+'</p><p class="text-[9px] text-gray-400">综合评分</p></div>'].join('');
  document.getElementById('supRevN').textContent='('+s.reviews.length+')';
  document.getElementById('supReviews').innerHTML=s.reviews.map(function(r){return '<div class="rounded-xl p-2.5" style="background:#F8FAFF;border:1px solid #EEF2F6"><div class="flex items-center justify-between"><p class="text-[11px] font-medium text-gray-700">'+r.u+'</p><span class="text-[10px]">'+'<span style="color:#F59E0B">'+'★'.repeat(r.r)+'</span>'+'<span style="color:#d1d5db">'+'★'.repeat(5-r)+'</span>'+'</span></div><p class="text-[10px] text-gray-500 mt-1 leading-relaxed">'+r.t+'</p><p class="text-[9px] text-gray-300 mt-1">'+r.time+'</p></div>'}).join('');
  document.getElementById('supMask').style.display='block';document.getElementById('supSheet').style.display='block';
}
function closeSupplier(){document.getElementById('supMask').style.display='none';document.getElementById('supSheet').style.display='none'}
function init(){
  curId=new URLSearchParams(location.search).get('id')||'7';var d=get(curId);
  document.getElementById('pubTime').textContent=d.time;
  var pill=document.getElementById('statusPill');pill.innerHTML=d.pill;pill.style.background=d.pillbg;pill.style.color=d.pillc;
  document.getElementById('dTitle').textContent=d.title;
  document.getElementById('dChips').innerHTML='<span class="info-lbl"><i class="fas fa-shapes mr-1 text-gray-300"></i>'+d.cat+'</span><span class="info-lbl"><i class="fas fa-boxes-stacked mr-1 text-gray-300"></i>'+d.qty+'</span><span class="info-lbl"><i class="fas fa-tags mr-1" style="color:#FF4D2D"></i>'+d.price+'</span>';
  document.getElementById('dDesc').textContent=d.desc;
  document.getElementById('statCount').textContent=d.count;
  document.getElementById('statLow').textContent='¥'+d.quotes[0].price;
  var sum=d.quotes.reduce(function(a,b){return a+parseFloat(b.price)},0);
  document.getElementById('statAvg').textContent='¥'+(sum/d.quotes.length).toFixed(2);
  var sb=document.getElementById('sampleNeedBox');
  if(d.needSample){sb.style.display='';sb.style.background='linear-gradient(135deg,#EEF2FF,#E0E7FF)';sb.style.border='1px solid #c7d2fe';sb.innerHTML='<div class="flex items-center gap-2"><i class="fas fa-gift text-[#4338CA]"></i><p class="text-[12px] font-bold text-[#4338CA]">本需求需定制样品</p></div><p class="text-[10px] text-gray-500 mt-1 leading-relaxed">发布时已勾选「需定制样品」：选标成交后，由<b>中选卖家默认寄送定制样品</b>供您确认品质，无需逐个申请寄样。</p>';}
  else{sb.style.display='';sb.style.background='#fff';sb.style.border='1px solid #f0f0f0';sb.innerHTML='<div class="flex items-center gap-2"><i class="fas fa-gift text-gray-400"></i><p class="text-[12px] font-bold text-gray-700">本需求无需样品</p></div><p class="text-[10px] text-gray-400 mt-1">按报价直接成交，不要求寄送样品。</p>';}
  document.getElementById('quoteList').innerHTML=d.quotes.map(function(q,i){return quoteCard(q,i)}).join('');
}
function openDeal(idx){
  var d=get(curId);currentDeal=d.quotes[idx];
  document.getElementById('dealAvatar').style.background=currentDeal.c;
  document.getElementById('dealAvatar').textContent=currentDeal.initial;
  document.getElementById('dealName').textContent=currentDeal.supplier;
  document.getElementById('dealMeta').textContent=currentDeal.tag+' · '+currentDeal.score+'分';
  document.getElementById('dealPrice').textContent='¥'+currentDeal.price;
  document.getElementById('dealQty').textContent='数量 '+currentDeal.qty;
  document.getElementById('dealSample').style.display=d.needSample?'block':'none';
  document.getElementById('bgMask').style.display='block';document.getElementById('dealSheet').style.display='block';
}
function closeDeal(){document.getElementById('bgMask').style.display='none';document.getElementById('dealSheet').style.display='none'}
function confirmDeal(){
  closeDeal();
  var d=get(curId);
  d.quotes.forEach(function(q){q.selected=false});
  currentDeal.selected=true;d.done=true;
  d.pill='<i class="fas fa-circle-check"></i> 已成交';d.pillbg='#E8F8EF';d.pillc='#10B981';
  document.getElementById('statusPill').innerHTML=d.pill;document.getElementById('statusPill').style.background=d.pillbg;document.getElementById('statusPill').style.color=d.pillc;
  document.getElementById('quoteList').innerHTML=d.quotes.map(function(q,i){return quoteCard(q,i)}).join('');
  toast('已与「'+currentDeal.supplier+'」选标成交，可在「已中选」卡片查看订单');
}
init();
</script>
</body>
</html>
