<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>产业链服务 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D'}}}}</script>
<style>
:root{--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden;color:#1F2430}
::-webkit-scrollbar{width:2px;height:2px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease}.card:active{transform:scale(.965)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#6366F1 0%,#4F46E5 40%,#4338CA 100%)">
<div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-40" style="background:#818CF8"></div>
<div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-30" style="background:#6366F1"></div>
<div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px"><span>9:41</span><div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div></div>
<div class="relative flex items-center gap-2.5 mt-1">
<a href="home.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
<span class="text-white font-extrabold text-[20px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">产业链服务</span>
</div>
<p class="text-white/70 text-[11px] mt-2 relative">七大产业赋能服务，助力袜业企业全链路发展</p>
</div>

<!-- 服务概览 -->
<div class="px-3 -mt-3 relative z-10">
<div class="bg-white rounded-2xl shadow-soft p-3.5 fade-up border border-white grid grid-cols-3 gap-2 text-center">
<div class="border-r border-gray-100"><p class="text-[18px] font-black" style="color:#6366F1">7</p><p class="text-[9px] text-gray-400 mt-0.5">服务模块</p></div>
<div class="border-r border-gray-100"><p class="text-[18px] font-black" style="color:#10B981">36</p><p class="text-[9px] text-gray-400 mt-0.5">合作机构</p></div>
<div><p class="text-[18px] font-black" style="color:#F59E0B">1280+</p><p class="text-[9px] text-gray-400 mt-0.5">服务企业</p></div>
</div>
</div>

<!-- 服务列表 -->
<div class="px-3 mt-3 space-y-2.5 mb-28" id="serviceList"></div>

<!-- 底部Tab栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:100;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">
<a href="home.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-house text-[18px]"></i><span class="text-[9px] font-semibold">首页</span></a>
<a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
<a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
<a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<script>
var services=[
 {link:'cross-border.html',icon:'fa-globe',title:'外贸服务',desc:'跨境选品·独立站建站·在线教程',features:['跨境选品','独立站','在线教程'],color:'#818CF8',bg:'#EEF2FF'},
 {link:'finance-service.html',icon:'fa-hand-holding-dollar',title:'金融服务撮合',desc:'企业贷款·融资租赁·应收账款融资',features:['企业贷款','融资租赁','应收账款'],color:'#10B981',bg:'#D1FAE5'},
 {link:'recruit-service.html',icon:'fa-user-tie',title:'人才招聘服务',desc:'发布招聘·筛选简历·在线对接',features:['发布招聘','简历筛选','人才对接'],color:'#EC4899',bg:'#FCE7F3'},
 {link:'ip-service.html',icon:'fa-lightbulb',title:'知识产权网',desc:'专利查询·商标注册·版权登记',features:['专利查询','商标注册','版权登记'],color:'#F59E0B',bg:'#FEF3C7'},
 {link:'tech-service.html',icon:'fa-flask',title:'技术共享',desc:'技术成果·创新案例·专家资源',features:['技术成果','创新案例','专家对接'],color:'#3B82F6',bg:'#DBEAFE'},
 {link:'policy-service.html',icon:'fa-file-signature',title:'政策兑现',desc:'政策查询·申报条件·兑现流程',features:['政策查询','申报指南','兑现流程'],color:'#8B5CF6',bg:'#EDE9FE'},
 {link:'agency-service.html',icon:'fa-briefcase',title:'中介服务',desc:'财务·法律·咨询·认证',features:['财务服务','法律咨询','专业认证'],color:'#F97316',bg:'#FFEDD5'}
];
var html='';
services.forEach(function(s,i){
 var tags=s.features.map(function(f){return '<span class="text-[8px] px-1.5 py-0.5 rounded-full" style="background:'+s.bg+';color:'+s.color+'">'+f+'</span>'}).join('');
 html+='<a href="'+s.link+'" class="card bg-white rounded-2xl shadow-soft p-3 flex items-center gap-3 fade-up block" style="animation-delay:'+(i*0.05)+'s">';
 html+='<div class="w-12 h-12 rounded-2xl flex items-center justify-center text-white shadow-soft flex-shrink-0" style="background:linear-gradient(135deg,'+s.color+','+s.color+'DD)"><i class="fas '+s.icon+' text-lg"></i></div>';
 html+='<div class="flex-1 min-w-0">';
 html+='<p class="text-[14px] font-bold text-gray-800">'+s.title+'</p>';
 html+='<p class="text-[10px] text-gray-400 mt-0.5">'+s.desc+'</p>';
 html+='<div class="flex gap-1 mt-1.5">'+tags+'</div>';
 html+='</div>';
 html+='<i class="fas fa-chevron-right text-gray-300 text-[10px] flex-shrink-0"></i>';
 html+='</a>';
});
document.getElementById('serviceList').innerHTML=html;
</script>
</body>
</html>
