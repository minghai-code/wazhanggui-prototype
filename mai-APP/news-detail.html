<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>资讯详情 - 袜掌柜买家版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden;color:#1F2430}
::-webkit-scrollbar{width:2px;height:2px}
.no-bar::-webkit-scrollbar{display:none}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease}
.card:active{transform:scale(.965)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.text-grad{background:linear-gradient(90deg,#FF4D2D,#FF2D78);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FF8A4C"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FF2D78"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center justify-between mt-1">
    <div class="flex items-center gap-2.5">
      <a href="home.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
      <span class="text-white font-extrabold text-[20px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">资讯详情</span>
    </div>
    <button onclick="toast('已收藏')" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="far fa-star text-sm"></i></button>
  </div>
</div>

<!-- 封面 -->
<div class="px-3 -mt-2 relative z-10">
  <div class="rounded-3xl overflow-hidden shadow-soft bg-white">
    <img id="cover" src="images/scene_05.jpg" class="w-full h-[170px] object-cover">
  </div>
</div>

<!-- 内容 -->
<div class="px-3 mt-3">
  <span id="catTag" class="text-[9px] text-white px-2 py-0.5 rounded-full font-medium" style="background:linear-gradient(90deg,#FF4D2D,#FF7849)">产业资讯</span>
  <h1 id="ntitle" class="text-[19px] font-extrabold text-gray-800 leading-snug mt-2">标题</h1>
  <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-400">
    <span><i class="fas fa-user-edit mr-1"></i><span id="nsrc">来源</span></span>
    <span><i class="far fa-clock mr-1"></i><span id="ntime">时间</span></span>
    <span><i class="far fa-eye mr-1"></i><span id="nview">1280</span> 阅读</span>
  </div>
  <div class="h-px bg-gray-100 my-3"></div>
  <div id="ncontent" class="text-[13px] text-gray-600 leading-relaxed space-y-3"></div>

  <!-- 相关推荐 -->
  <div class="mt-5 mb-2 flex items-center gap-1.5"><div class="w-1 h-3.5 rounded-full" style="background:#FF4D2D"></div><span class="text-[14px] font-bold text-gray-800">相关推荐</span></div>
  <div id="related" class="space-y-2"></div>
</div>

<div class="h-28"></div>

<!-- 底部Tab栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:100;width:393px">
  <div class="flex justify-around items-center h-full" style="padding-bottom:10px">
    <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-house text-[18px]"></i><span class="text-[9px]">首页</span></a>
    <a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
    <a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
    <a href="mine.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-user text-[18px]"></i><span class="text-[9px] font-semibold">我的</span></a>
  </div>
</div>
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<div class="toast" id="toast"><i class="fas fa-circle-check" style="color:#4ADE80"></i><span id="toastTxt">操作成功</span></div>

<script>
var NEWS=[
  {id:1,cat:'产业资讯',src:'大唐袜业协会',time:'2026-03-01 09:30',view:1280,cover:'images/scene_05.jpg',title:'大唐袜业2026年出口额同比增长15%',
    summary:'据协会统计，2026年第一季度大唐袜业出口额达12.8亿美元，同比增长15%，其中运动袜与功能袜品类增长显著。',
    content:['据大唐袜业协会最新统计，2026年第一季度大唐袜业出口额达12.8亿美元，同比增长15%，延续了去年以来的稳健增长态势。','从品类看，运动压缩袜、功能抗菌袜等中高端品类出口增速领先，部分企业订单已排至三季度。业内人士表示，跨境电商与自主品牌出海成为重要增量来源。','协会秘书长指出，今年将重点支持企业参与国际展会、建设海外仓，进一步推动"大唐袜业"区域品牌全球化布局。']},
  {id:2,cat:'技术创新',src:'袜业智能制造中心',time:'2026-02-25 14:10',view:860,cover:'images/scene_08.jpg',title:'智能制造赋能袜业转型升级',
    summary:'多家会员企业引入智能袜机，人均产能提升3倍，次品率降低至1%以下。',
    content:['近年来，大唐袜业加速推进智能制造升级。多家会员企业引入智能一体袜机与自动缝头设备，人均产能较传统产线提升约3倍，产品次品率由5%降至1%以下。','某动力袜业工厂负责人介绍，数字化车间可实时采集设备状态与产量数据，订单交付周期缩短近40%。','专家指出，智能制造不仅是降本增效，更是袜业从"制造"向"智造"跃迁、迈向高质量发展的关键路径。']},
  {id:3,cat:'政策解读',src:'诸暨市商务局',time:'2026-02-18 10:00',view:1530,cover:'images/scene_11.jpg',title:'外贸稳增长若干政策落地袜业',
    summary:'市级外贸稳增长专项政策出台，涵盖出口信保补贴、展位补贴与跨境电商扶持。',
    content:['诸暨市商务局近日发布外贸稳增长专项政策，明确对袜业等重点产业给予出口信用保险保费补贴、境外展会摊位补贴及跨境电商运营扶持。','政策还鼓励企业通过"独立站+海外仓"模式拓展市场，对符合条件的企业给予最高50万元的一次性奖励。','相关负责人表示，政策旨在帮助企业稳订单、拓市场，全年预计惠及袜业企业超300家。']},
  {id:4,cat:'市场动态',src:'袜掌柜研究院',time:'2026-02-10 16:20',view:980,cover:'images/sock_12.jpg',title:'2026春季袜品流行趋势发布',
    summary:'本季流行聚焦"轻运动、新中式、环保可持续"三大主题，色彩更趋自然柔和。',
    content:['袜掌柜研究院发布2026春季袜品流行趋势，归纳出"轻运动、新中式、环保可持续"三大主题。','轻运动延续瑜伽、跑步场景的压缩与透气需求；新中式将盘扣、云纹等元素融入袜面设计；环保可持续则主打再生涤纶与植物染。','色彩方面，低饱和的燕麦色、雾霾蓝与豆沙绿成为主流，取代上季的高饱和撞色。']},
  {id:5,cat:'产业资讯',src:'大唐袜业城',time:'2026-02-05 11:00',view:2100,cover:'images/scene_04.jpg',title:'第18届中国国际袜业博览会招商启动',
    summary:'第18届袜博会将于下半年在诸暨举办，展位申请通道已开启，设智能馆、面料馆与设备馆。',
    content:['第18届中国国际袜业博览会招商工作正式启动，展会设于诸暨大唐袜业城，规划展览面积5万㎡，展位超2000个。','本届设智能馆、面料馆与设备馆三大展区，新增"买家自选展位"模式，参展商可在线上直接选取展位。','组委会表示，将同步举办流行趋势发布、供应链对接与跨境电商峰会，打造全产业链一站式平台。']},
  {id:6,cat:'市场动态',src:'袜掌柜研究院',time:'2026-01-28 15:40',view:720,cover:'images/scene_01.jpg',title:'棉价回落带动袜品成本下降',
    summary:'受原料供应宽松影响，棉花价格较年内高点回落约12%，袜品出厂价有望下探。',
    content:['近期棉花期货价格较年内高点回落约12%，带动棉袜等主要品类原料成本下降。','分析师认为，成本下行将改善中小袜企毛利空间，但终端价格受渠道与品牌溢价影响，传导相对滞后。','建议采购商把握窗口期，合理锁定中长期订单价格，降低波动风险。']}
];
function getParam(name){var r=new RegExp('[?&]'+name+'=([^&]*)').exec(location.search);return r?decodeURIComponent(r[1]):null;}
var cur=NEWS.filter(function(n){return String(n.id)===getParam('id')})[0]||NEWS[0];
document.getElementById('cover').src=cur.cover;
document.getElementById('catTag').textContent=cur.cat;
document.getElementById('ntitle').textContent=cur.title;
document.getElementById('nsrc').textContent=cur.src;
document.getElementById('ntime').textContent=cur.time;
document.getElementById('nview').textContent=cur.view;
document.getElementById('ncontent').innerHTML=cur.content.map(function(p){return '<p>'+p+'</p>'}).join('');
var related=NEWS.filter(function(n){return n.id!==cur.id}).slice(0,3);
document.getElementById('related').innerHTML=related.map(function(n){
  return '<a href="news-detail.html?id='+n.id+'" class="card block bg-white rounded-2xl shadow-soft p-2.5 fade-up">'
    +'<div class="flex gap-2.5"><img src="'+n.cover+'" class="w-[80px] h-[80px] rounded-xl object-cover">'
    +'<div class="flex-1 min-w-0"><p class="text-[12px] font-bold text-gray-800 leading-tight line-clamp-2">'+n.title+'</p>'
    +'<p class="text-[10px] text-gray-500 mt-1 leading-relaxed line-clamp-2">'+n.summary+'</p>'
    +'<div class="flex items-center gap-2 mt-1"><span class="text-[9px] text-gray-400">'+n.time.split(' ')[0]+'</span><span class="text-[9px] text-primary">'+n.cat+'</span></div></div></div></a>';
}).join('');
function toast(msg){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2000)}
</script>
</body>
</html>
