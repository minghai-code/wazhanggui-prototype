<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>采购询价 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4;--v1:#7C3AED;--v2:#FF2D78}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.no-bar::-webkit-scrollbar{display:none}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease, box-shadow .16s ease}
.card:active{transform:scale(.965)}
.sec-title{font-size:16px;font-weight:800;letter-spacing:.3px;color:#1F2430}
.text-grad{background:linear-gradient(90deg,#FF4D2D,#FF2D78);-webkit-background-clip:text;background-clip:text;color:transparent}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* 顶部三Tab */
.tabbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid #f3f0ec}
.tabs{display:flex;padding:10px 12px 0;gap:6px}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:12px;font-size:13px;color:#7a7f8a;font-weight:500;transition:.2s;cursor:pointer}
.tab.on{color:#fff;font-weight:700;background:linear-gradient(135deg,#FF6B35,#FF4D2D);box-shadow:0 4px 12px rgba(255,77,45,.28)}
.tabbar .counttip{font-size:10px;margin-left:3px;padding:1px 5px;border-radius:8px;background:#fff0e8;color:#FF6B35}
.tabbar .tab.on .counttip{background:rgba(255,255,255,.25);color:#fff}
/* 卡片 */
.dcard{background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(20,20,40,.05);padding:12px;margin-bottom:10px;transition:transform .16s ease,box-shadow .16s ease}
.dcard:active{transform:scale(.968)}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:8px}
.pill-open{background:#FFF0E8;color:#FF6B35}
.pill-quoting{background:#EFF6FF;color:#2563EB}
.pill-done{background:#E8F8EF;color:#10B981}
.pill-over{background:#F3F4F6;color:#9aa0ac}
.info-lbl{font-size:11px;color:#6b7080;background:rgba(248,249,250,.9);border-radius:8px;padding:4px 8px;white-space:nowrap}
/* 悬浮发布 */
.fab{position:fixed;right:14px;bottom:82px;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#FF6B35,#FF2D78);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;box-shadow:0 8px 22px rgba(255,45,120,.4);z-index:120;cursor:pointer;transition:.18s}
.fab:active{transform:scale(.9)}
.fab::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,77,45,.35);animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(.85);opacity:.8}70%{transform:scale(1.25);opacity:0}100%{opacity:0}}
.fab span{font-size:10px;position:absolute;right:0;bottom:6px;left:0;text-align:center;font-weight:700}
.tiprow{display:flex;align-items:center;gap:6px;font-size:11px;color:#9aa0ac;background:#fff;border-radius:12px;padding:8px 10px;box-shadow:0 1px 6px rgba(20,20,40,.04)}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:130px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<!-- ===== 顶部 ===== -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#FF8A4C 0%,#FF4D2D 40%,#E63E20 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FF8A4C"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FF4D2D"></div>
  <div class="absolute -bottom-10 left-12 w-44 h-44 rounded-full blur-3xl opacity-35" style="background:#FF7849"></div>

  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <div class="relative flex items-center gap-3">
    <a href="home.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white flex-shrink-0"><i class="fas fa-chevron-left text-sm"></i></a>
    <div>
      <span class="text-white font-extrabold text-[20px] tracking-wide block" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">采购询价</span>
      <p class="text-white/85 text-[11px] mt-0.5"><i class="fas fa-handshake text-[9px] mr-1"></i>发布需求 · 商家竞价报价 · 选标成交</p>
    </div>
  </div>
</div>

<!-- ===== 采购商实名认证卡（前置卡点） ===== -->
<div class="px-3 -mt-2 relative z-10" id="certCard"></div>

<!-- ===== 顶部三Tab ===== -->
<div class="tabbar">
  <div class="tabs">
    <div class="tab on" id="tabMypub" onclick="switchTab('mypub')"><i class="fas fa-bullhorn mr-1"></i>我的发布<span class="counttip" id="cntMypub">2</span></div>
    <div class="tab" id="tabPlaza" onclick="switchTab('plaza')"><i class="fas fa-store mr-1"></i>公开需求</div>
  </div>
</div>

<!-- ===== Tab1 我的发布 ===== -->
<div id="viewMypub" class="px-3 pt-3 pb-36">
  <div class="flex items-center justify-between mb-2.5">
    <div class="flex items-center gap-1.5"><div class="w-1.5 h-3.5 rounded-full" style="background:#FF4D2D"></div><span class="sec-title">我发布的采购需求</span></div>
    <span class="text-[11px] text-gray-400">共 <span id="cntMypub2">2</span> 条</span>
  </div>
  <div id="mypubList" class="space-y-2.5"></div>
</div>

<!-- ===== Tab2 公开需求（只读浏览） ===== -->
<div id="viewPlaza" class="px-3 pt-3 pb-36" style="display:none">
  <div class="flex items-center justify-end mb-2.5">
    <div class="flex items-center gap-1 text-[11px] text-gray-400"><i class="fas fa-fire text-primary"></i><span class="text-primary font-medium">今日新增 24 条</span></div>
  </div>
  <div id="plazaList" class="space-y-2.5"></div>
  <p class="text-center text-[10px] text-gray-300 mt-3"><i class="fas fa-circle-info"></i> 公开需求为其他采购方发布的明确需求，仅供浏览参考；竞价由卖家在卖家端参与，买家端不公开任何报价明细</p>
</div>

<!-- 悬浮发布按钮 -->
<a href="inquiry-publish.html" class="fab"><i class="fas fa-plus"></i><span class="text-[9px] font-bold">发布</span></a>

<!-- 底部Tab栏 4Tab -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:150;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">
<a href="home.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-house text-[18px]"></i><span class="text-[9px] font-semibold">首页</span></a>
<a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
<a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
<a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
</div>
</div>
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:151;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<div class="toast" id="toast"><i class="fas fa-circle-check text-[#4ADE80]"></i><span id="toastTxt">操作成功</span></div>

<script>
/* 采购商实名认证前置卡点（演示可切换） */
var certified=true;
function renderCert(){
  var c=document.getElementById('certCard');
  if(certified){
    c.innerHTML='<div class="bg-white/80 backdrop-blur-xl rounded-2xl shadow-soft px-3.5 py-2.5 flex items-center gap-2.5 border border-white">'
      +'<div class="w-8 h-8 rounded-full flex items-center justify-center text-white" style="background:linear-gradient(135deg,#10B981,#059669)"><i class="fas fa-badge-check text-sm"></i></div>'
      +'<div class="flex-1"><p class="text-[12px] font-bold text-gray-800">采购商实名已认证</p><p class="text-[9px] text-gray-400 mt-0.5">已实名，可发布需求、查看公开需求详情</p></div>'
      +'<a onclick="toggleCert()" class="text-[10px] text-gray-400 underline">模拟未认证</a></div>';
  }else{
    c.innerHTML='<div class="rounded-2xl px-3.5 py-2.5 flex items-center gap-2.5 shadow-soft" style="background:linear-gradient(135deg,#FEF3C7,#FDE68A)">'
      +'<i class="fas fa-lock text-amber-600 text-sm"></i>'
      +'<div class="flex-1"><p class="text-[12px] font-bold text-amber-700">未完成采购商实名认证</p><p class="text-[9px] text-amber-600/90 mt-0.5">完成实名认证后方可发布需求、查看需求详情</p></div>'
      +'<a onclick="toast(\'跳转采购商实名认证（演示）\')" class="text-[11px] font-bold text-white px-3 py-1.5 rounded-lg" style="background:linear-gradient(135deg,#F59E0B,#D97706)">去认证</a></div>';
  }
}
function toggleCert(){certified=!certified;renderCert();toast(certified?'已恢复为「已认证」（演示）':'已切换为「未认证」（演示）')}

/* 数据 */
var MYPUB=[
  {id:7,title:'男士精梳棉商务袜 透气防臭',cat:'男袜',qty:'1000双',price:'最高 ¥3.5/双',quoteN:8,low:'¥3.1',status:'报价中',done:false},
  {id:8,title:'男士刺绣薄袜 莱卡棉',cat:'男袜',qty:'200双',price:'最高 ¥3.0/双',quoteN:3,low:'¥2.85',status:'已成交',order:'QJ20260920-007',done:true}
];
var PLAZA=[
  {id:1,trader:'杭州酷袜商贸',verified:'企业认证',title:'精梳棉商务男袜 透气防臭',cat:'男袜',qty:'1000双',price:'最高 ¥3.5/双',quoteN:8,time:'2小时前'},
  {id:2,trader:'上海织语电商',verified:'企业认证',title:'竹纤维隐形船袜 防滑不掉跟',cat:'女袜',qty:'500双',price:'最高 ¥1.8/双',quoteN:12,time:'5小时前'},
  {id:3,trader:'广东劲步体育',verified:'企业认证',title:'运动压缩跑步袜 减震防滑',cat:'运动袜',qty:'300双',price:'最高 ¥5.8/双',quoteN:4,time:'1天前'},
  {id:4,trader:'义乌服饰采购',verified:'个人认证',title:'女士碎花短袜 纯棉透气',cat:'女袜',qty:'2000双',price:'最高 ¥2.8/双',quoteN:2,time:'1天前'},
  {id:5,trader:'青岛暖意家纺',verified:'企业认证',title:'棉氨毛巾袜 加厚磨毛',cat:'功能袜',qty:'800双',price:'最高 ¥6.0/双',quoteN:6,time:'2天前'}
];
function mypubCard(d){
  var pill=d.done?'<span class="pill pill-done"><i class="fas fa-circle-check"></i> 已成交</span>':'<span class="pill pill-quoting"><i class="fas fa-clock"></i> 报价中 · '+d.quoteN+'家报价</span>';
  var tail=d.done
    ? '<div class="flex items-center justify-between mt-3 pt-2.5 border-t border-gray-50"><span class="text-[10px] text-gray-400"><i class="fas fa-circle-check mr-0.5" style="color:#10B981"></i>已选标成交</span><a href="orders.html" class="text-[10px] font-medium" style="color:#2563EB" onclick="event.stopPropagation()">查看订单 <i class="fas fa-chevron-right text-[8px]"></i></a></div>'
    : '<div class="flex items-center justify-between mt-3 pt-2.5 border-t border-gray-50"><span class="text-[10px] text-gray-400"><i class="fas fa-comment-dollar mr-0.5" style="color:#10B981"></i>'+d.quoteN+'家报价 · 最低'+d.low+'/双</span><span class="text-[10px] font-medium" style="color:#2563EB">查看报价 <i class="fas fa-chevron-right text-[8px]"></i></span></div>';
  return '<div class="dcard block fade-up" onclick="goMypub('+d.id+')">'
    +'<div class="flex items-center justify-between">'+pill+'<span class="text-[10px] text-gray-400">'+(d.done?'已成交':'2小时前发布')+'</span></div>'
    +'<p class="text-[14px] font-semibold text-gray-900 mt-2">'+d.title+'</p>'
    +'<div class="flex gap-1.5 mt-2 flex-wrap"><span class="info-lbl"><i class="fas fa-shapes mr-1 text-gray-300"></i>'+d.cat+'</span><span class="info-lbl"><i class="fas fa-boxes-stacked mr-1 text-gray-300"></i>'+d.qty+'</span><span class="info-lbl"><i class="fas fa-tags mr-1" style="color:#FF4D2D"></i>'+d.price+'</span></div>'
    +tail+'</div>';
}
function goMypub(id){location.href='inquiry-mypublish.html?id='+id;}
function plazaCard(d){
  return '<a href="inquiry-demand.html?id='+d.id+'" class="dcard block fade-up">'
    +'<div class="flex items-center justify-between"><div class="flex items-center gap-1.5"><div class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[11px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#6366F1)">'+d.trader.charAt(0)+'</div><div><p class="text-[12px] font-bold text-gray-800 leading-none">'+d.trader+'</p><p class="text-[9px] text-gray-400 mt-0.5">'+d.verified+' · '+d.time+'</p></div></div><span class="pill pill-open"><i class="fas fa-bolt"></i>竞价中</span></div>'
    +'<p class="text-[14px] font-semibold text-gray-900 mt-2.5">'+d.title+'</p>'
    +'<div class="flex gap-1.5 mt-2.5 flex-wrap"><span class="info-lbl"><i class="fas fa-shapes mr-1 text-gray-300"></i>'+d.cat+'</span><span class="info-lbl"><i class="fas fa-boxes-stacked mr-1 text-gray-300"></i>'+d.qty+'</span><span class="info-lbl"><i class="fas fa-tags mr-1" style="color:#FF4D2D"></i>'+d.price+'</span></div>'
    +'<div class="flex items-center justify-between mt-3 pt-2.5 border-t border-gray-50"><span class="text-[10px] text-gray-400"><i class="fas fa-eye mr-0.5"></i>'+(120+d.quoteN*17)+'人浏览</span><span class="text-[10px] font-medium" style="color:#2563EB">查看详情 <i class="fas fa-chevron-right text-[8px]"></i></span></div></a>';
}
function render(){
  document.getElementById('mypubList').innerHTML=MYPUB.map(mypubCard).join('');
  document.getElementById('plazaList').innerHTML=PLAZA.map(plazaCard).join('');
  document.getElementById('cntMypub').textContent=MYPUB.length;
  document.getElementById('cntMypub2').textContent=MYPUB.length;
}
var tabMap={mypub:['tabMypub','viewMypub'],plaza:['tabPlaza','viewPlaza']};
function switchTab(k){
  Object.keys(tabMap).forEach(function(t){var o=tabMap[t];document.getElementById(o[0]).className='tab'+(t===k?' on':'');document.getElementById(o[1]).style.display=(t===k?'':'none');});
  window.scrollTo(0,0);
}
var toastTimer;
function toast(msg,icon){
  var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;
  if(icon)t.querySelector('i').className='fas '+icon;else t.querySelector('i').className='fas fa-circle-check';
  t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1600);
}
renderCert();render();
</script>
</body>
</html>
