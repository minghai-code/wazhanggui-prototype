}

if(s.related){
  s.related.forEach(function(rid,i){
    var rs=sessions[rid];
    if(!rs)return;
    relHtml+='<a href="expo-session-detail.html?day='+rid.split('-')[0]+'&session='+rid.split('-')[1]+'" class="card block bg-white rounded-xl shadow-soft p-3 border border-gray-50 flex items-center gap-2.5 fade-up" style="animation-delay:'+(i*0.05)+'s">';
    relHtml+='<span class="text-[8px] font-bold text-white px-1.5 py-0.5 rounded flex-shrink-0" style="background:'+rs.typeColor+'">'+rs.type+'</span>';
    relHtml+='<div class="flex-1 min-w-0"><p class="text-[11px] font-semibold text-gray-800 truncate">'+rs.title+'</p><p class="text-[9px] text-gray-400">'+rs.time+' · '+rs.loc+'</p></div>';
    relHtml+='<i class="fas fa-chevron-right text-gray-300 text-[10px]"></i></a>';
  });
}
document.getElementById('relatedArea').innerHTML=relHtml||'<p class="text-[10px] text-gray-400 text-center py-2">暂无其他活动</p>';

function addToCalendar(){toast('已加入我的日程')}
</script>
</body>
