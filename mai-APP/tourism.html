<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}

.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:120px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.h-scroll{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;scroll-snap-type:x proximity;padding-bottom:3px;width:100%;max-width:100%;cursor:grab;position:relative}
.h-scroll.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
.h-scroll::-webkit-scrollbar{height:3px}
.h-scroll::-webkit-scrollbar-track{background:transparent}
.h-scroll::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
.h-scroll>*{scroll-snap-align:start;flex:0 0 auto;min-width:0}

.timeline-dot{width:12px;height:12px;border-radius:50%;border:2.5px solid #FF4D2D;background:#fff;flex-shrink:0;margin-top:3px;z-index:2;position:relative}
.timeline-dot.passed{border-color:#D1D5DB}
.timeline-line{position:absolute;left:5.5px;top:0;bottom:0;width:2.5px;background:#FFD4C5}
.status-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:6px}
.img-ph{background:linear-gradient(135deg,#f0f0f0,#e0e0e0);display:flex;align-items:center;justify-content:center}
.img-loading{background:linear-gradient(90deg,#f5f5f5 25%,#ececec 50%,#f5f5f5 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.month-pill{font-size:11px;padding:6px 14px;border-radius:20px;cursor:pointer;transition:.15s;font-weight:600;white-space:nowrap}
.month-pill.on{background:linear-gradient(135deg,#FF6B35,#FF4D2D);color:#fff;box-shadow:0 4px 12px rgba(255,77,45,.25)}
.month-pill:not(.on){color:#9aa0ac;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}

<body>

/* ===== 渲染活动时间轴 ===== */
function renderActivities(month){
  var actHtml='';
  activities.forEach(function(a,i){
    if(month!=='all'&&a.month!==month)return;
    var dotClass=a.status==='已结束'?'timeline-dot passed':'timeline-dot';
    var signupTag=a.canSignup?'<span class="ml-auto text-[9px] text-white px-2 py-0.5 rounded font-bold" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)">去报名 ›</span>':'';
    actHtml+='<div class="relative mb-3" data-month="'+a.month+'">'
      +'<div class="'+dotClass+' absolute -left-4 top-3"></div>'
      +'<div class="card bg-white rounded-2xl shadow-soft overflow-hidden fade-up" style="animation-delay:'+(i*0.04)+'s;'+(a.canSignup?'border:1.5px solid #FFD4C5':'')+'" onclick="openActivity('+a.id+')">'
      +'<div class="flex">'
      +'<div class="w-20 h-20 flex-shrink-0 overflow-hidden img-loading">'
      +'<img src="'+img(a.img,'square')+'" class="w-full h-full object-cover" onload="this.classList.remove(\'img-loading\')" onerror="this.style.display=\'none\';this.parentElement.classList.add(\'img-ph\')">'
      +'</div>'
      +'<div class="flex-1 p-2.5">'
      +'<div class="flex items-center justify-between mb-1">'
      +'<span class="text-[10px] font-bold" style="color:'+a.dateColor+'">'+a.date+'</span>'
      +'<span class="status-badge" style="background:'+a.statusBg+';color:'+a.statusColor+'">'+a.status+'</span>'
      +'</div>'
      +'<p class="text-[12px] font-bold text-gray-800 mb-0.5">'+a.title+'</p>'
      +'<p class="text-[9px] text-gray-400 leading-relaxed mb-1">'+a.desc+'</p>'
      +'<div class="flex items-center gap-2">'
      +'<span class="text-[8px] text-gray-400"><i class="fas fa-location-dot mr-0.5"></i>'+a.loc+'</span>'
      +'<span class="text-[8px]" style="color:'+(a.canSignup?'#FF4D2D':'#9aa0ac')+'"><i class="'+a.extraIcon+' mr-0.5"></i>'+a.extra+'</span>'
      +signupTag

}
renderActivities('all');

/* ===== 月份筛选 ===== */
function filterMonth(el,month){
  document.querySelectorAll('.month-pill').forEach(function(p){
    p.classList.remove('on');
  });
  el.classList.add('on');
  renderActivities(month);
}

/* ===== 打开活动详情 ===== */
function openActivity(id){
  window.location.href='tourism-detail.html?id=act'+id;
}

/* ===== 鼠标拖拽滚动 ===== */
function initDragScroll(){
  document.querySelectorAll('.h-scroll').forEach(function(container){
    var isDown=false,startX,scrollLeft,moved=false;
    container.addEventListener('mousedown',function(e){
      isDown=true;moved=false;
      startX=e.pageX-container.offsetLeft;
      scrollLeft=container.scrollLeft;
    });
    container.addEventListener('mouseleave',function(){
      isDown=false;container.classList.remove('dragging');
    });
    container.addEventListener('mouseup',function(e){
      isDown=false;container.classList.remove('dragging');
    });
    container.addEventListener('mousemove',function(e){
      if(!isDown)return;
      e.preventDefault();
      var x=e.pageX-container.offsetLeft;
      var walk=(x-startX)*1.5;
      if(Math.abs(walk)>3){moved=true;container.classList.add('dragging')}
      container.scrollLeft=scrollLeft-walk;
    });
    container.querySelectorAll('a').forEach(function(link){
      link.addEventListener('click',function(e){
        if(moved){e.preventDefault()}
      });
    });
  });
}
initDragScroll();
</script>
