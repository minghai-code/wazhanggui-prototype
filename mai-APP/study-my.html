<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>研学报名详情 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.shadow-card{box-shadow:0 8px 24px rgba(5,150,105,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease}.card:active{transform:scale(.965)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{font-size:15px;font-weight:800;letter-spacing:.3px;color:#1F2430}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:120px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;opacity:0;pointer-events:none;transition:.2s}
.overlay.on{opacity:1;pointer-events:auto}
#signCanvas{touch-action:none;cursor:crosshair;background:#fff;border-radius:12px;display:block}
.step-done{color:#10B981}
.step-current{color:#F59E0B}
.step-pending{color:#D1D5DB}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F3F4F6}
.info-row:last-child{border-bottom:none}
.info-label{font-size:11px;color:#9CA3AF}
.info-value{font-size:12px;font-weight:600;color:#1F2430}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:300px;background:#fff;border-radius:18px;z-index:400;padding:18px;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.modal-title{font-size:14px;font-weight:800;color:#1F2430;text-align:center}
.modal-body{font-size:11px;color:#6B7280;line-height:1.7;margin-top:8px;text-align:center}
.modal-btns{display:flex;gap:10px;margin-top:16px}
.modal-btns button{flex:1;padding:10px 0;border-radius:999px;font-size:12px;font-weight:700}
.star{font-size:28px;color:#D1D5DB;cursor:pointer;transition:.15s;padding:0 3px}
.star.on{color:#FBBF24}
.review-input{width:100%;border:1.5px solid #E5E7EB;border-radius:12px;padding:10px 12px;font-size:12px;color:#1F2430;outline:none;resize:none}
.review-input:focus{border-color:#34D399}
.act-link{display:block;width:100%;text-align:center;font-size:11px;color:#9CA3AF;padding:10px 0}
.demo-link{font-size:9px;color:#C0C6CF;text-decoration:underline}
</style>
</head>
<body>

<!-- 顶部渐变区 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" id="topBg">
<div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#34D399"></div>
<div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#2DD4BF"></div>
<div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
<span>9:41</span>
<div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
</div>
<div class="relative flex items-center gap-2.5 mt-1">
<a href="study-tour.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
<div>
<h1 class="text-white font-extrabold text-[18px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)"><i class="fas fa-file-contract text-[15px] mr-1"></i>研学报名详情</h1>
<p class="text-white/70 text-[10px] mt-0.5" id="subTitle">查看报名信息 · 签署责任书</p>
</div>
</div>
</div>

<!-- 我的报名 快捷列表 -->
<div class="px-3 -mt-2 relative z-10">
  <div class="bg-white/90 backdrop-blur-xl rounded-2xl shadow-soft p-3 border border-white fade-up">
    <div class="flex items-center gap-1.5 mb-2">
      <div class="w-6 h-6 rounded-lg flex items-center justify-center text-white shadow-soft" style="background:linear-gradient(135deg,#F59E0B,#D97706)"><i class="fas fa-list-check text-[10px]"></i></div>
      <span class="sec-title">我的报名</span>
    </div>
    <div class="space-y-2" id="myRegList"></div>
  </div>
</div>

<!-- 报名信息卡片 -->
<div class="px-3 -mt-2 relative z-10">
<div class="card bg-white/90 backdrop-blur-xl rounded-2xl shadow-soft p-3.5 border border-white fade-up" id="regCard">
<div class="flex items-start justify-between mb-2">
<div class="flex-1">
<p class="text-[14px] font-bold text-gray-800" id="regTitle"></p>
<p class="text-[10px] text-gray-400 mt-0.5" id="regDate"></p>
</div>
<span id="statusBadge"></span>
</div>
<div class="grid grid-cols-2 gap-x-3" id="regInfo"></div>
</div>
</div>

<!-- 报名进度 -->
<div class="px-3 mt-3">
<div class="flex items-center gap-1.5 mb-2.5">
<div class="w-6 h-6 rounded-lg flex items-center justify-center text-white shadow-soft" style="background:linear-gradient(135deg,#34D399,#10B981)"><i class="fas fa-list-check text-[10px]"></i></div>
<span class="sec-title">报名进度</span>
</div>
<div class="bg-white/85 backdrop-blur-xl rounded-2xl shadow-soft p-3.5 border border-white">
<div class="flex items-center justify-between">
<div class="flex flex-col items-center" style="width:60px">
<div class="w-9 h-9 rounded-full flex items-center justify-center text-white" style="background:#10B981"><i class="fas fa-check text-sm"></i></div>
<span class="text-[9px] mt-1.5 step-done font-semibold">提交申请</span>
</div>
<div class="flex-1 h-1 mx-1 rounded" style="background:#10B981"></div>
<div class="flex flex-col items-center" style="width:60px">
<div class="w-9 h-9 rounded-full flex items-center justify-center text-white" style="background:#10B981"><i class="fas fa-check text-sm"></i></div>
<span class="text-[9px] mt-1.5 step-done font-semibold">审核通过</span>
</div>
<div class="flex-1 h-1 mx-1 rounded" id="progress2"></div>
<div class="flex flex-col items-center" style="width:60px">
<div class="w-9 h-9 rounded-full flex items-center justify-center text-white" id="progress3Bg"><i class="fas fa-pen-nib text-sm" id="progress3Icon"></i></div>
<span class="text-[9px] mt-1.5 font-semibold" id="progress3Text">签署责任书</span>
</div>
<div class="flex-1 h-1 mx-1 rounded" id="progress3"></div>
<div class="flex flex-col items-center" style="width:60px">
<div class="w-9 h-9 rounded-full flex items-center justify-center" id="progress4Bg" style="background:#E5E7EB"><i class="fas fa-person-walking text-sm" id="progress4Icon" style="color:#9CA3AF"></i></div>
<span class="text-[9px] mt-1.5 font-semibold step-pending" id="progress4Text">线下研学</span>
</div>
</div>
</div>
</div>

<!-- 内容区（签署/已签署） -->
<div id="contentArea"></div>

<div class="h-20"></div>

<!-- 底部 -->
<div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-xl border-t border-gray-100 flex items-center justify-between px-3" style="height:55px;z-index:100;width:393px;padding-bottom:8px">
<a href="study-tour.html" class="text-[11px] text-gray-500 px-3 py-1.5 rounded-full bg-gray-100">返回研学</a>
<span class="text-[10px] text-gray-400" id="bottomTip"><i class="fas fa-headset mr-1" style="color:#10B981"></i>咨询热线 0575-8742xxxx</span>
</div>
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:2px"></div></div>

<div class="toast" id="toast"><i class="fas fa-circle-check" style="color:#4ADE80"></i><span id="toastTxt">操作成功</span></div>
<div class="overlay" id="overlay"></div>
<div class="modal" id="modal"></div>

<script>
function toast(msg){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2000)}

var urlParams=new URLSearchParams(window.location.search);
var id=parseInt(urlParams.get('id'))||1;
var signed=id===1;

var data={
  1:{type:'personal',title:'智能制造工厂参观',date:'2026年9月15日（周六）· 半天',school:'大唐镇中心小学',people:'1人',contact:'王小明',phone:'138****6688',no:'YX20260915001',stuName:'王小明',stuAge:'10岁',stuGrade:'小学4年级',parentName:'王先生',parentRel:'父亲',startAt:'2026-09-15T09:00:00',endAt:'2026-09-15T12:00:00'},
  2:{type:'group',title:'袜业博物馆文化游',date:'2026年10月12日（周六）· 2小时',school:'诸暨海亮小学',people:'48人',contact:'赵老师',phone:'139****2266',no:'YX20261012002',leader:'赵老师',leaderRole:'带队负责人',startAt:'2026-10-12T09:00:00',endAt:'2026-10-12T11:00:00'}
};
var d=data[id]||data[1];

/* ===== 报名单状态（对应后台状态机 14a-5.1） =====
   unsigned  已通过（待签署）
   signed    已签署（待出行）
   checkedin 已签到
   completed 已完成（已评价）
   cancelled 已取消
*/
var state={status:signed?'signed':'unsigned',checkedInAt:'',over:false,review:null};
var STORE_KEY='studyRegState_'+id;
try{
  var raw=localStorage.getItem(STORE_KEY);
  if(raw){var sv=JSON.parse(raw);if(sv&&sv.status)state=sv;}
}catch(e){}
function saveState(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){}}

/* 渲染报名信息 */
document.getElementById('regTitle').textContent=d.title;
document.getElementById('regDate').textContent=d.date;
var typeBadge=d.type==='personal'?'<span class="text-[8px] px-1.5 py-0.5 rounded font-bold ml-1" style="background:#DBEAFE;color:#2563EB">个人</span>':'<span class="text-[8px] px-1.5 py-0.5 rounded font-bold ml-1" style="background:#EDE9FE;color:#7C3AED">团体</span>';
document.getElementById('regTitle').insertAdjacentHTML('beforeend',typeBadge);

var infoHtml='';
function infoRow(label,val){return '<div class="info-row"><span class="info-label">'+label+'</span><span class="info-value">'+val+'</span></div>'}
if(d.type==='personal'){
  infoHtml+=infoRow('学校',d.school);
  infoHtml+=infoRow('学生',d.stuName+' ('+d.stuAge+')');
  infoHtml+=infoRow('年级',d.stuGrade);
  infoHtml+=infoRow('家长',d.parentName+' ('+d.parentRel+')');
  infoHtml+=infoRow('联系电话',d.phone);
  infoHtml+=infoRow('申请编号',d.no);
  infoHtml+=infoRow('审核状态','<span id="auditStatusRow"><span style="color:#059669">审核通过</span></span>');
}else{
  infoHtml+=infoRow('学校',d.school);
  infoHtml+=infoRow('人数',d.people);
  infoHtml+=infoRow('负责人',d.contact);
  infoHtml+=infoRow('联系电话',d.phone);
  infoHtml+=infoRow('申请编号',d.no);
  infoHtml+=infoRow('审核状态','<span id="auditStatusRow"><span style="color:#059669">审核通过</span></span>');
}
document.getElementById('regInfo').innerHTML=infoHtml;

/* ===== 状态驱动渲染 ===== */
function renderPage(){
  var st=state.status;

  /* 顶部主色与副标题 */
  var themes={
    unsigned:{bg:'linear-gradient(135deg,#FBBF24 0%,#F59E0B 40%,#D97706 100%)',sub:'审核已通过 · 请签署安全责任书',tip:'<i class="fas fa-pen-to-square mr-1" style="color:#F59E0B"></i>请签署责任书后完成报名'},
    signed:{bg:'linear-gradient(135deg,#34D399 0%,#10B981 40%,#059669 100%)',sub:'责任书已签署 · 等待出行',tip:'<i class="fas fa-headset mr-1" style="color:#10B981"></i>咨询热线 0575-8742xxxx'},
    checkedin:{bg:'linear-gradient(135deg,#38BDF8 0%,#3B82F6 40%,#2563EB 100%)',sub:'已签到 · 研学中',tip:'<i class="fas fa-headset mr-1" style="color:#3B82F6"></i>咨询热线 0575-8742xxxx'},
    completed:{bg:'linear-gradient(135deg,#A78BFA 0%,#8B5CF6 40%,#7C3AED 100%)',sub:'研学已完成 · 感谢参与',tip:'<i class="fas fa-headset mr-1" style="color:#8B5CF6"></i>咨询热线 0575-8742xxxx'},
    cancelled:{bg:'linear-gradient(135deg,#9CA3AF 0%,#6B7280 40%,#4B5563 100%)',sub:'报名已取消 · 名额已释放',tip:'<i class="fas fa-headset mr-1" style="color:#6B7280"></i>如需重新报名请咨询 0575-8742xxxx'}
  };
  var th=themes[st]||themes.unsigned;
  document.getElementById('topBg').style.background=th.bg;
  document.getElementById('subTitle').textContent=th.sub;
  document.getElementById('bottomTip').innerHTML=th.tip;

  /* 状态徽标 */
  var badges={
    unsigned:'<span class="text-[9px] px-2 py-0.5 rounded-full font-bold" style="background:#FEF3C7;color:#D97706">待签署</span>',
    signed:'<span class="text-[9px] px-2 py-0.5 rounded-full font-bold" style="background:#D1FAE5;color:#059669">已签署</span>',
    checkedin:'<span class="text-[9px] px-2 py-0.5 rounded-full font-bold" style="background:#DBEAFE;color:#2563EB">已签到</span>',
    completed:'<span class="text-[9px] px-2 py-0.5 rounded-full font-bold" style="background:#EDE9FE;color:#7C3AED">已完成</span>',
    cancelled:'<span class="text-[9px] px-2 py-0.5 rounded-full font-bold" style="background:#F3F4F6;color:#6B7280">已取消</span>'
  };
  document.getElementById('statusBadge').innerHTML=badges[st]||badges.unsigned;

  /* 审核状态行 */
  var auditEl=document.getElementById('auditStatusRow');
  if(auditEl){
    var audit=st==='cancelled'?'<span style="color:#6B7280">已取消</span>':'<span style="color:#059669">审核通过</span>';
    auditEl.innerHTML='<span class="info-value">'+audit+'</span>';
  }

  /* 进度条第 3 段（签署） */
  var step3Done=(st==='signed'||st==='checkedin'||st==='completed');
  document.getElementById('progress2').style.background=step3Done?'#10B981':'#FDE68A';
  document.getElementById('progress3Bg').style.background=step3Done?'#10B981':'#F59E0B';
  document.getElementById('progress3Icon').className=step3Done?'fas fa-check text-sm':'fas fa-pen-nib text-sm';
  document.getElementById('progress3Text').className='text-[9px] mt-1.5 font-semibold '+(step3Done?'step-done':'step-current');
  document.getElementById('progress3Text').textContent=step3Done?'已签署':'签署责任书';

  /* 进度条第 4 节点（线下研学 / 已签到 / 已完成） */
  var p4={
    unsigned:{bg:'#E5E7EB',icon:'fas fa-person-walking text-sm',color:'#9CA3AF',cls:'step-pending',text:'线下研学'},
    signed:{bg:'#FEF3C7',icon:'fas fa-person-walking text-sm',color:'#D97706',cls:'step-current',text:'待出行'},
    checkedin:{bg:'#3B82F6',icon:'fas fa-check text-sm',color:'#fff',cls:'step-done',text:'已签到'},
    completed:{bg:'#8B5CF6',icon:'fas fa-check text-sm',color:'#fff',cls:'step-done',text:'已完成'},
    cancelled:{bg:'#E5E7EB',icon:'fas fa-ban text-sm',color:'#9CA3AF',cls:'step-pending',text:'已取消'}
  }[st]||{};
  document.getElementById('progress4Bg').style.background=p4.bg;
  document.getElementById('progress4Icon').className=p4.icon;
  document.getElementById('progress4Icon').style.color=p4.color;
  document.getElementById('progress4Text').className='text-[9px] mt-1.5 font-semibold '+p4.cls;
  document.getElementById('progress4Text').textContent=p4.text;
  document.getElementById('progress3').style.background=(st==='checkedin'||st==='completed')?'#10B981':(step3Done?'#E5E7EB':'#E5E7EB');

  /* 内容区 */
  if(st==='unsigned')renderUnsigned();
  else if(st==='cancelled')renderCancelled();
  else renderSigned();
}

/* 距离出发还有多少小时 */
function hoursToStart(){
  var t=new Date(d.startAt).getTime();
  return (t-Date.now())/3600000;
}
/* 是否已过活动结束时间（或演示中手动标记结束） */
function isOver(){
  if(state.over)return true;
  return Date.now()>new Date(d.endAt).getTime();
}
/* 是否允许自助取消（出行前 24 小时） */
function canCancel(){
  return (state.status==='unsigned'||state.status==='signed') && hoursToStart()>24;
}

/* ===== 取消报名 ===== */
function askCancel(){
  if(!canCancel()){
    showModal({
      title:'暂不支持自助取消',
      body:'出行前 24 小时内不可自助取消，如需取消请联系研学顾问 0575-8742xxxx。',
      okText:'我知道了',
      hideCancel:true
    });
    return;
  }
  showModal({
    title:'确认取消报名？',
    body:'取消后名额将立即释放，不可恢复。<br>取消规则：出行前 24 小时可自助取消。',
    okText:'确认取消',
    danger:true,
    onOk:function(){
      state.status='cancelled';
      saveState();
      renderPage();
      toast('报名已取消，名额已释放');
    }
  });
}

function renderCancelled(){
  var again=d.type==='personal'?'study-personal.html':'study-apply.html';
  var html='<div class="px-3 mt-3">';
  html+='<div class="bg-white/85 backdrop-blur-xl rounded-2xl shadow-soft p-5 border border-white text-center">';
  html+='<div class="w-16 h-16 rounded-full flex items-center justify-center text-white mx-auto mb-2" style="background:#9CA3AF"><i class="fas fa-ban text-2xl"></i></div>';
  html+='<p class="text-[14px] font-bold text-gray-800 mb-1">该报名已取消</p>';
  html+='<p class="text-[10px] text-gray-400 leading-relaxed mb-3">申请编号 '+d.no+' 的名额已释放。<br>如仍需参加研学，可重新提交报名。</p>';
  html+='<a href="'+again+'" class="inline-block text-[12px] text-white px-5 py-2.5 rounded-full font-bold" style="background:linear-gradient(135deg,#34D399,#059669)">重新报名</a> ';
  html+='<a href="study-tour.html" class="inline-block text-[12px] text-gray-500 px-5 py-2.5 rounded-full font-bold bg-gray-100">返回研学</a>';
  html+='</div></div>';
  document.getElementById('contentArea').innerHTML=html;
}

/* ===== 现场扫码签到（模拟） ===== */
function doCheckin(){
  showModal({
    title:'扫码签到',
    body:'请在集合地点扫描现场签到二维码。<br>（演示）点击下方按钮模拟签到成功。',
    okText:'模拟签到成功',
    onOk:function(){
      state.status='checkedin';
      state.checkedInAt=fmtNow();
      saveState();
      renderPage();
      toast('签到成功');
    }
  });
}

/* ===== 评价 ===== */
function markOver(){
  state.over=true;
  saveState();
  renderPage();
  toast('研学已结束，可提交评价');
}

function openReview(){
  var html='<div class="text-center"><p class="text-[12px] font-bold text-gray-800">本次研学体验如何？</p>';
  html+='<div class="flex justify-center gap-1 mt-3" id="starBox">';
  for(var i=1;i<=5;i++)html+='<i class="far fa-star star" data-v="'+i+'" onclick="setStar('+i+')"></i>';
  html+='</div>';
  html+='<p class="text-[10px] text-gray-400 mt-2" id="starLabel">请选择星级</p>';
  html+='<textarea class="review-input mt-3" rows="4" id="reviewText" placeholder="说说本次研学的收获与建议（选填）"></textarea>';
  html+='<p class="text-[9px] text-gray-400 mt-2 text-left">评价提交后需平台审核，精选后将展示在路线页「精选留言」。</p></div>';
  showModal({
    title:'研学评价',
    body:html,
    okText:'提交评价',
    onOk:function(){
      if(!curStar){toast('请先选择星级');return false}
      var txt=(document.getElementById('reviewText')||{}).value||'';
      state.review={star:curStar,text:txt.trim(),time:fmtNow()};
      state.status='completed';
      saveState();
      renderPage();
      toast('评价提交成功，待审核');
      return true;
    }
  });
}

var curStar=0;
function setStar(v){
  curStar=v;
  var stars=document.querySelectorAll('#starBox .star');
  for(var i=0;i<stars.length;i++){
    var sv=parseInt(stars[i].dataset.v,10);
    if(sv<=v){stars[i].className='fas fa-star star on'}else{stars[i].className='far fa-star star'}
  }
  var labels=['','很不满意','不太满意','一般','满意','非常满意'];
  var lb=document.getElementById('starLabel');
  if(lb)lb.textContent=v+' 星 · '+labels[v];
}

function fmtNow(){
  var n=new Date();
  function p(x){return x<10?'0'+x:''+x}
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate())+' '+p(n.getHours())+':'+p(n.getMinutes());
}

/* ===== 签名画布 ===== */
var canvas,ctx,drawing=false,lastX=0,lastY=0,hasDrawn=false;

function initCanvas(){
  canvas=document.getElementById('signCanvas');
  if(!canvas)return;
  ctx=canvas.getContext('2d');
  ctx.strokeStyle='#1F2430';
  ctx.lineWidth=2.5;
  ctx.lineCap='round';
  ctx.lineJoin='round';

  canvas.addEventListener('mousedown',function(e){
    drawing=true;hasDrawn=true;
    var rect=canvas.getBoundingClientRect();
    lastX=e.clientX-rect.left;
    lastY=e.clientY-rect.top;
  });
  canvas.addEventListener('mousemove',function(e){
    if(!drawing)return;
    e.preventDefault();
    var rect=canvas.getBoundingClientRect();
    var x=e.clientX-rect.left;
    var y=e.clientY-rect.top;
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    lastX=x;lastY=y;
  });
  canvas.addEventListener('mouseup',function(){drawing=false});
  canvas.addEventListener('mouseleave',function(){drawing=false});

  /* 触摸支持 */
  canvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    drawing=true;hasDrawn=true;
    var rect=canvas.getBoundingClientRect();
    var t=e.touches[0];
    lastX=t.clientX-rect.left;
    lastY=t.clientY-rect.top;
  });
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    if(!drawing)return;
    var rect=canvas.getBoundingClientRect();
    var t=e.touches[0];
    var x=t.clientX-rect.left;
    var y=t.clientY-rect.top;
    ctx.beginPath();
    ctx.moveTo(lastX,lastY);
    ctx.lineTo(x,y);
    ctx.stroke();
    lastX=x;lastY=y;
  });
  canvas.addEventListener('touchend',function(){drawing=false});
}

function clearSign(){
  if(!canvas)return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  hasDrawn=false;
}

function submitSign(){
  if(!hasDrawn){
    toast('请先手写签名');
    return;
  }
  var overlay=document.getElementById('overlay');
  overlay.classList.add('on');
  toast('责任书签署成功');
  setTimeout(function(){
    overlay.classList.remove('on');
    signed=true;
    state.status='signed';
    saveState();
    renderPage();
  },1500);
}
</script>
</body>
</html>
