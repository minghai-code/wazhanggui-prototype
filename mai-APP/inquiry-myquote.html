<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的报价详情 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4;--v1:#7C3AED;--v2:#FF2D78}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
.card{transition:transform .16s ease}
.card:active{transform:scale(.965)}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info-lbl{font-size:11px;color:#6b7080;background:rgba(248,249,250,.9);border-radius:8px;padding:5px 9px;white-space:nowrap}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:140px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<!-- ===== 顶部：渐变 ===== -->
<div class="relative px-4 pt-2 pb-6 overflow-hidden" style="background:linear-gradient(135deg,#FF8A4C 0%,#FF4D2D 40%,#E63E20 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FF8A4C"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FF2D78"></div>
  <div class="absolute -bottom-10 left-12 w-44 h-44 rounded-full blur-3xl opacity-35" style="background:#FF7849"></div>

  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <div class="relative flex items-center gap-3">
    <a href="inquiry.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white flex-shrink-0"><i class="fas fa-chevron-left text-sm"></i></a>
    <span class="text-white font-extrabold text-[18px] tracking-wide" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">我的报价详情</span>
  </div>
</div>

<!-- 报价状态横幅 -->
<div class="px-3 -mt-3 relative z-10" id="statusBanner"></div>

<div class="px-3 mt-3 relative z-10">

<!-- 需求卡片 -->
<div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-soft p-3.5 fade-up border border-white">
<div class="flex items-center gap-2 mb-2">
<div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-[14px] font-bold" id="pubAvatar" style="background:linear-gradient(135deg,#10B981,#059669)">上</div>
<div><p class="text-[13px] font-bold text-gray-800" id="pubName">上海织语电商 发布</p><p class="text-[9px] text-gray-400 mt-0.5" id="pubVerified">企业认证 · 5小时前</p></div>
</div>
<p class="text-[15px] font-bold text-gray-900" id="dTitle">竹纤维隐形船袜 防滑不掉跟</p>
<p class="text-[11px] text-gray-500 mt-1 leading-relaxed" id="dDesc">竹纤维材质，女士款，浅口隐形，跟部加硅胶防滑</p>
<div class="flex gap-1.5 mt-2.5 flex-wrap" id="dChips"></div>
</div>

<!-- 我的报价明细 -->
<div class="mt-3 bg-white/70 backdrop-blur-xl rounded-3xl shadow-soft p-3.5 fade-up border border-white" style="animation-delay:.05s">
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-2"><div class="w-7 h-7 rounded-xl flex items-center justify-center text-white shadow-soft" style="background:linear-gradient(135deg,#2563EB,#3B82F6)"><i class="fas fa-file-invoice-dollar text-xs"></i></div><p class="text-[13px] font-bold text-gray-800">我的报价单</p></div>
<span class="text-[10px] text-gray-400" id="dealtime"></span>
</div>
<div class="rounded-2xl p-3" id="quotePanel">
  <div class="flex items-end justify-between pb-2.5 border-b border-dashed" style="border-color:rgba(0,0,0,.06)">
    <div><p class="text-[10px] text-gray-400">报价单价</p><p class="text-[22px] font-extrabold mt-0.5 text-grad2" id="qPrice">¥1.75</p></div>
    <div class="text-right"><p class="text-[10px] text-gray-400">供货数量</p><p class="text-[15px] font-bold mt-0.5 text-gray-800" id="qQty">500双</p></div>
  </div>
  <div class="grid grid-cols-2 gap-2 mt-2.5">
    <div><p class="text-[10px] text-gray-400">交期</p><p class="text-[12px] font-medium text-gray-700 mt-0.5" id="qDelivery">7天内</p></div>
    <div><p class="text-[10px] text-gray-400">样品支持</p><p class="text-[12px] font-medium text-gray-700 mt-0.5" id="qSample">支持打样</p></div>
  </div>
  <div class="mt-2.5 pt-2.5 border-t" style="border-color:rgba(0,0,0,.06)"><p class="text-[10px] text-gray-400">报价说明</p><p class="text-[12px] text-gray-600 leading-relaxed mt-1" id="qNote">源头上游工厂、爆款现货、可含运费，支持打样。</p></div>
</div>
</div>

<!-- 底部操作 -->
<div class="mt-3 flex gap-2" id="actions"></div>
</div>

<div class="h-24"></div>

<!-- 底部Tab栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:150;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">
<a href="home.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-house text-[18px]"></i><span class="text-[9px] font-semibold">首页</span></a>
<a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
<a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
<a href="property.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-building text-[18px]"></i><span class="text-[9px]">物业</span></a>
<a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
</div>
</div>
<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:151;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<!-- 消息提示 -->
<div class="toast" id="toast"><i class="fas fa-circle-check text-[#4ADE80]"></i><span id="toastTxt">操作成功</span></div>

<!-- 取消报价确认弹层 -->
<div class="absolute inset-0" id="bgMask" style="display:none;background:rgba(0,0,0,.4);z-index:130"></div>
<div class="fixed bottom-0 left-0 right-0 rounded-t-3xl bg-white" id="cancelSheet" style="display:none;z-index:140;width:393px;padding-bottom:40px">
<div class="px-4 pt-3 pb-4 text-center">
<div class="w-10 h-1 rounded-full bg-gray-200 mx-auto"></div>
<div class="w-14 h-14 mx-auto mt-4 rounded-full flex items-center justify-center" style="background:#FFF0E8"><i class="fas fa-rotate-left text-xl" style="color:#FF6B35"></i></div>
<p class="text-[15px] font-bold text-gray-900 mt-3">撤回这条报价？</p>
<p class="text-[11px] text-gray-500 mt-1.5">撤回报价后，该需求不再显示你的报价，可再次报价。</p>
<div class="flex gap-2 mt-4">
<button class="flex-1 py-3 rounded-2xl text-[13px] font-medium text-gray-500" style="background:#F3F4F6" onclick="document.getElementById('bgMask').style.display='none';document.getElementById('cancelSheet').style.display='none'">再想想</button>
<button class="flex-1 py-3 rounded-2xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)" onclick="doCancel()">确认撤回</button>
</div>
</div>
</div>

<script>
var D={
 2:{name:'竹纤维隐形船袜 防滑不掉跟',desc:'竹纤维材质，女士款，浅口隐形，跟部加硅胶防滑',cat:'女袜',qty:'500双',price:'期望 ¥1.8/双',trader:'上海织语电商',initial:'上',color:'linear-gradient(135deg,#10B981,#059669)',verified:'企业认证 · 5小时前',quote:'¥1.75',qqty:'500双',delivery:'7天内',sample:'支持打样',note:'源头上游工厂、爆款现货、可含运费，支持打样。',dealtime:'',done:false},
 3:{name:'运动压缩跑步袜 减震防滑',desc:'中帮压缩，足底加厚减震，透气网孔，男女通用',cat:'运动袜',qty:'300双',price:'期望 ¥5.8/双',trader:'广东劲步体育',initial:'广',color:'linear-gradient(135deg,#F59E0B,#D97706)',verified:'企业认证 · 1天前',quote:'¥5.90',qqty:'300双',delivery:'15天内',sample:'付费打样',note:'压缩工艺成熟，附检测报告，含运费。',dealtime:'已于 3天前 成交',done:true},
 4:{name:'女士碎花短袜 纯棉透气',desc:'纯棉材抖，碎花图案，春夏款，可分码分色',cat:'女袜',qty:'2000双',price:'期望 ¥2.8/双',trader:'义乌服饰采购',initial:'义',color:'linear-gradient(135deg,#EC4899,#F43F5E)',verified:'个人认证 · 1天前',quote:'¥2.75',qqty:'2000双',delivery:'15天内',sample:'支持打样',note:'可分码分色，可分批交付，含运费。',dealtime:'',done:false}
};
var toastTimer;
function toast(msg){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1600)}
function get(id){return D[id]||D[2];}
function setPanel(d,panelBg,border){
  var p=document.getElementById('quotePanel');p.style.background=panelBg;p.style.border='1px solid '+border;
}
function init(){
  var id=new URLSearchParams(location.search).get('id')||'2';var d=get(id);
  document.getElementById('pubAvatar').style.background=d.color;document.getElementById('pubAvatar').textContent=d.initial;
  document.getElementById('pubName').textContent=d.trader+' 发布';
  document.getElementById('pubVerified').textContent=d.verified;
  document.getElementById('dTitle').textContent=d.name;
  document.getElementById('dDesc').textContent=d.desc;
  document.getElementById('dChips').innerHTML='<span class="info-lbl"><i class="fas fa-shapes mr-1 text-gray-300"></i>'+d.cat+'</span><span class="info-lbl"><i class="fas fa-boxes-stacked mr-1 text-gray-300"></i>'+d.qty+'</span><span class="info-lbl"><i class="fas fa-tags mr-1" style="color:#FF4D2D"></i>'+d.price+'</span>';
  document.getElementById('qPrice').textContent=d.quote;
  document.getElementById('qQty').textContent=d.qqty;
  document.getElementById('qDelivery').textContent=d.delivery;
  document.getElementById('qSample').textContent=d.sample;
  document.getElementById('qNote').textContent=d.note;
  document.getElementById('dealtime').textContent=d.dealtime;
  var banner=document.getElementById('statusBanner');
  var acts=document.getElementById('actions');
  if(d.done){
    banner.innerHTML='<div class="rounded-2xl p-3 flex items-center gap-2.5 fade-up" style="background:linear-gradient(135deg,#10B981,#059669);box-shadow:0 8px 20px rgba(16,185,129,.28)"><div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-circle-check text-white text-lg"></i></div><div class="text-white"><p class="text-[13px] font-bold">报价已成交</p><p class="text-[10px] text-white/85 mt-0.5">已达成交易，点击这里查看订单</p></div><i class="fas fa-chevron-right text-white/80 ml-auto"></i></div>';
    banner.style.cursor='pointer';banner.onclick=function(){toast('跳转成交订单')};
    setPanel(d,'#F0FDF4','#d1fae5');
    document.querySelector('.text-grad2').style.color='#10B981';
    acts.innerHTML='<a href="purchase-order.html" class="card grad-h flex-1 py-3 rounded-2xl text-white text-center text-[13px] font-bold shadow-card"><i class="fas fa-clipboard-list mr-1 text-xs"></i>查看进货单</a>';
  }else{
    banner.innerHTML='<div class="rounded-2xl p-3 flex items-center gap-2.5 fade-up" style="background:linear-gradient(135deg,#2563EB,#3B82F6);box-shadow:0 8px 20px rgba(59,130,246,.28)"><div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center"><i class="fas fa-hourglass-half text-white text-lg"></i></div><div class="text-white"><p class="text-[13px] font-bold">报价待买家确认</p><p class="text-[10px] text-white/85 mt-0.5">2家商家报价中 · 买家尚未选标</p></div></div>';
    setPanel(d,'#FFF7F4','#ffede5');
    document.querySelector('.text-grad2').style.color='#2563EB';
    acts.innerHTML='<button class="card flex-1 py-3 rounded-2xl text-[13px] font-bold text-white shadow-soft" style="background:linear-gradient(135deg,#F59E0B,#D97706)" onclick="showCancel()"><i class="fas fa-rotate-left mr-1 text-xs"></i>撤回报价</button><button class="card flex-1 py-3 rounded-2xl text-[13px] font-bold text-white" style="background:linear-gradient(135deg,#34D399,#10B981)" onclick="toast(\'已发送消息给采购方\')"><i class="fas fa-comment-dots mr-1 text-xs"></i>联系买家</button>';
  }
}
function showCancel(){document.getElementById('bgMask').style.display='block';document.getElementById('cancelSheet').style.display='block'}
function doCancel(){document.getElementById('bgMask').style.display='none';document.getElementById('cancelSheet').style.display='none';toast('报价已撤回');setTimeout(function(){location.href='inquiry.html'},1200)}
init();
</script>
</body>
</html>
