:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4}

body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.shadow-card{box-shadow:0 8px 24px rgba(5,150,105,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.card{transition:transform .16s ease}.card:active{transform:scale(.965)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-title{font-size:15px;font-weight:800;letter-spacing:.3px;color:#1F2430}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:120px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sub-tab{font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;transition:.15s;font-weight:600;white-space:nowrap}
.sub-tab.on{background:linear-gradient(135deg,#34D399,#059669);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,.25)}
.sub-tab:not(.on){color:#9aa0ac;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.timeline-dot{width:10px;height:10px;border-radius:50%;border:2.5px solid #10B981;background:#fff;flex-shrink:0;margin-top:3px;z-index:2;position:relative}
.timeline-line{position:absolute;left:4px;top:0;bottom:0;width:2px;background:#D1FAE5}
.itinerary-item{position:relative;padding-left:24px;padding-bottom:16px}
.itinerary-item:last-child{padding-bottom:0}
.itinerary-item::before{content:'';position:absolute;left:4px;top:3px;width:10px;height:10px;border-radius:50%;border:2.5px solid #10B981;background:#fff;z-index:2}
.itinerary-item::after{content:'';position:absolute;left:8px;top:14px;bottom:0;width:2px;background:#D1FAE5}
.itinerary-item:last-child::after{display:none}
.star-active{color:#FBBF24}
.img-loading{background:linear-gradient(90deg,#f5f5f5 25%,#ececec 50%,#f5f5f5 75%);background-size:200% 100%;animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        html+='<button class="text-[11px] text-gray-400 px-3 py-1.5 rounded-full bg-gray-100" disabled>已满</button>';
      }else{
        html+='<button onclick="goApplyDate('+i+')" class="text-[11px] text-white px-3 py-1.5 rounded-full font-bold" style="background:linear-gradient(135deg,#34D399,#059669)">个人报名</button>';
      }
      html+='</div>';
    });
    html+='<div class="bg-emerald-50 rounded-xl p-3 mt-2 border border-emerald-100"><p class="text-[10px] text-emerald-700 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>个人报名：选择日期点击「个人报名」，家长需在线签署安全责任书。团体研学请使用<a href="study-apply.html" class="font-bold underline">团体研学申请</a>。</p></div>';
    html+='</div>';
  }else if(tab==='history'){
    /* 历史风采 */
    html+='<div class="fade-up">';
    html+='<div class="flex items-center gap-1.5 mb-2"><div class="w-6 h-6 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#34D399,#059669)"><i class="fas fa-camera text-[10px]"></i></div><span class="sec-title">历史活动风采</span></div>';
    html+='<div class="grid grid-cols-2 gap-2.5">';
    r.history.forEach(function(h){
      html+='<div class="card relative rounded-2xl overflow-hidden shadow-soft fade-up" style="height:130px">';
      html+='<div class="w-full h-full img-loading"><img src="'+h.img+'" class="w-full h-full object-cover" onload="this.parentElement.classList.remove(\'img-loading\')" onerror="this.style.display=\'none\'"></div>';
      html+='<div class="absolute inset-0" style="background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.75) 100%)"></div>';
      html+='<div class="absolute bottom-0 left-0 right-0 p-2"><p class="text-white text-[11px] font-bold">'+h.title+'</p><div class="flex items-center gap-1.5 mt-0.5"><span class="text-white/70 text-[8px]">'+h.date+'</span><span class="text-white/70 text-[8px]">·</span><span class="text-white/70 text-[8px]">'+h.count+'</span></div></div>';
      html+='</div>';
    });
    html+='</div>';
    var totalPeople=r.history.reduce(function(s,h){return s+parseInt(h.count)},0);
    html+='<div class="bg-white/85 backdrop-blur-xl rounded-xl shadow-soft p-3 border border-white mt-3 flex items-center justify-around">';
    html+='<div class="text-center"><p class="text-[18px] font-extrabold" style="color:#059669">'+r.history.length+'</p><p class="text-[9px] text-gray-400 mt-0.5">已开展场次</p></div>';
    html+='<div class="w-px h-8 bg-gray-200"></div>';
    html+='<div class="text-center"><p class="text-[18px] font-extrabold" style="color:#059669">'+totalPeople+'</p><p class="text-[9px] text-gray-400 mt-0.5">累计参与人数</p></div>';
    html+='<div class="w-px h-8 bg-gray-200"></div>';
    html+='<div class="text-center"><p class="text-[18px] font-extrabold" style="color:#059669">'+r.rating+'</p><p class="text-[9px] text-gray-400 mt-0.5">综合评分</p></div>';
    html+='</div></div>';
  }else if(tab==='comments'){
    /* 精选留言 */
    html+='<div class="fade-up">';
    html+='<div class="flex items-center gap-1.5 mb-2"><div class="w-6 h-6 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#34D399,#059669)"><i class="fas fa-comments text-[10px]"></i></div><span class="sec-title">精选留言</span></div>';
    var routeComments=comments.filter(function(c){return c.route===rid});
    routeComments.forEach(function(c){
      var stars='';
      for(var i=0;i<5;i++){stars+='<i class="fas fa-star text-[8px] '+(i<c.rating?'star-active':'text-gray-300')+'"></i>'}
      html+='<div class="bg-white/85 backdrop-blur-xl rounded-2xl shadow-soft p-3 border border-white mb-2.5">';
      html+='<div class="flex items-start gap-2.5">';
      html+='<div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-[13px] flex-shrink-0" style="background:'+c.avatarBg+'">'+c.avatar+'</div>';
      html+='<div class="flex-1"><div class="flex items-center justify-between mb-0.5"><p class="text-[12px] font-bold text-gray-800">'+c.name+'</p><div class="flex items-center gap-0.5">'+stars+'</div></div>';
      html+='<p class="text-[10px] text-gray-400 mb-1.5">'+c.school+' · '+c.date+'</p>';
      html+='<p class="text-[11px] text-gray-600 leading-relaxed">'+c.content+'</p></div></div></div>';
    });
    html+='</div>';
  }
  document.getElementById('contentArea').innerHTML=html;
}

renderContent('intro');

function goApply(){
  window.location.href='study-personal.html?id='+rid;
}
function goApplyDate(idx){
  window.location.href='study-personal.html?id='+rid+'&date='+idx;
}
</script>
</body>
</html>
