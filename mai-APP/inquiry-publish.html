<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>发布采购询价 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4;--v1:#7C3AED;--v2:#FF2D78}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
.card{transition:transform .16s ease}
.card:active{transform:scale(.965)}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.inp{width:100%;background:rgba(248,249,250,.8);border:1px solid rgba(240,240,240,.8);border-radius:12px;padding:11px 13px;font-size:13px;color:#1F2430;outline:none;transition:border-color .16s ease,background .16s ease}
.inp::placeholder{color:#C0C0C0}
.inp:focus{border-color:#FF4D2D;background:#fff}
.lbl{font-size:11px;color:#6b7080;font-weight:500;display:block;margin-bottom:6px}
.lbl b{color:#FF4D2D}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:140px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.progress{position:relative;z-index:5;display:flex;align-items:center}
.progress .dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700}
.progress .line{flex:1;height:2px;margin:0 4px;border-radius:2px}
.progress .lbl2{font-size:10px;color:#9aa0ac;text-align:center;margin-top:4px}
.tag-opt{font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:10px;padding:6px 12px;cursor:pointer;transition:.15s;font-weight:500}
.tag-opt.on{border-color:#FF4D2D;color:#FF4D2D;background:#FFF0E8;font-weight:600}
</style>
</head>
<body>

<!-- ===== 顶部：渐变 ===== -->
<div class="relative px-4 pt-2 pb-6 overflow-hidden" style="background:linear-gradient(135deg,#FF8A4C 0%,#FF4D2D 40%,#E63E20 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FF8A4C"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FF2D78"></div>
  <div class="absolute -bottom-10 left-12 w-44 h-44 rounded-full blur-3xl opacity-35" style="background:#FF7849"></div>

  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <div class="relative flex items-center gap-3">
    <a href="inquiry.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white flex-shrink-0"><i class="fas fa-chevron-left text-sm"></i></a>
    <span class="text-white font-extrabold text-[20px] tracking-wide" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">发布采购询价</span>
  </div>

  <!-- 发布步骤 -->
  <div class="relative mt-4 px-1">
    <div class="progress">
      <div style="flex-direction:column;width:52px">
        <div class="dot" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D);box-shadow:0 2px 6px rgba(255,77,45,.4)"><i class="fas fa-pen text-[9px]"></i></div>
        <div class="lbl2" style="color:#fff;font-weight:600">填写需求</div>
      </div>
      <div class="line" style="background:linear-gradient(90deg,#fff,#fff)"></div>
      <div style="flex-direction:column;width:52px">
        <div class="dot" style="background:rgba(255,255,255,.35)"><i class="fas fa-store text-[9px]"></i></div>
        <div class="lbl2" style="color:#fff">商家报价</div>
      </div>
      <div class="line" style="background:rgba(255,255,255,.35)"></div>
      <div style="flex-direction:column;width:52px">
        <div class="dot" style="background:rgba(255,255,255,.35)"><i class="fas fa-handshake text-[9px]"></i></div>
        <div class="lbl2" style="color:#fff">选标成交</div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 发布表单 ===== -->
<div class="px-3 -mt-3 relative z-10">
<div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-soft p-3.5 fade-up border border-white">

<div class="flex items-center gap-2 mb-3">
<div class="w-7 h-7 rounded-xl flex items-center justify-center text-white shadow-soft" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D)"><i class="fas fa-box-open text-xs"></i></div>
<p class="text-[13px] font-bold text-gray-800">采购需求信息</p>
</div>

<div class="mb-2.5">
<label class="lbl">商品名称 <b>*</b></label>
<input type="text" class="inp" id="fName" placeholder="如：精梳棉商务男袜">
</div>

<div class="grid grid-cols-2 gap-2 mb-2.5">
<div>
<label class="lbl">品类 <b>*</b></label>
<select class="inp" style="appearance:none;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22 viewBox=%220 0 10 10%22%3E%3Cpath fill=%22%23999%22 d=%22M2 4l3 3 3-3z%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:right 10px center;padding-right:28px">
<option>男袜</option><option>女袜</option><option>童袜</option><option>运动袜</option><option>功能袜</option>
</select>
</div>
<div>
<label class="lbl">采购数量(双) <b>*</b></label>
<input type="number" class="inp" id="fQty" placeholder="如：1000">
</div>
</div>

<div class="grid grid-cols-2 gap-2 mb-2.5">
<div>
<label class="lbl">期望价格(元/双)</label>
<input type="text" class="inp" id="fPrice" placeholder="如：3.50">
</div>
<div>
<label class="lbl">期望交期(天)</label>
<select class="inp" style="appearance:none;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22 viewBox=%220 0 10 10%22%3E%3Cpath fill=%22%23999%22 d=%22M2 4l3 3 3-3z%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:right 10px center;padding-right:28px">
<option>7天内</option><option>7-15天</option><option>15-30天</option><option>可商议</option>
</select>
</div>
</div>

<div class="mb-2.5">
<label class="lbl">补充说明</label>
<textarea class="inp" id="fDesc" rows="2" placeholder="材质、规格、颜色、包装等要求…" style="resize:none"></textarea>
</div>

<!-- 参数标签快速选择 -->
<div class="mb-2.5">
<label class="lbl">需求标签（可多选）</label>
<div class="flex flex-wrap gap-1.5" id="tagBox">
<span class="tag-opt on" data-t="现货采购">现货采购</span>
<span class="tag-opt" data-t="源头工厂">源头工厂</span>
<span class="tag-opt" data-t="支持打样">支持打样</span>
<span class="tag-opt" data-t="定制Logo">定制Logo</span>
<span class="tag-opt" data-t="可开发票">可开发票</span>
</div>
</div>

<!-- 上传图片 -->
<div class="mb-3">
<label class="lbl">参考图片(选填)</label>
<div class="flex gap-2">
<div class="w-16 h-16 rounded-2xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center gap-1 card" style="background:rgba(248,249,250,.8)" onclick="toast('选择图片源')">
<i class="fas fa-camera text-gray-300 text-base"></i><span class="text-[8px] text-gray-400">拍照</span>
</div>
<div class="w-16 h-16 rounded-2xl border-2 border-dashed border-gray-200 flex flex-col items-center justify-center gap-1 card" style="background:rgba(248,249,250,.8)" onclick="toast('选择图片源')">
<i class="fas fa-images text-gray-300 text-base"></i><span class="text-[8px] text-gray-400">相册</span>
</div>
</div>
</div>

<!-- 发布方式 -->
<div class="mb-3">
<label class="lbl">发布方式</label>
<div class="grid grid-cols-2 gap-2">
<button class="card flex items-center gap-2 p-2.5 rounded-xl border" style="border-color:#FF4D2D;background:#FFF7F4">
<div class="w-8 h-8 rounded-lg text-white flex items-center justify-center" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D)"><i class="fas fa-bullhorn text-xs"></i></div>
<div><p class="text-[12px] font-semibold text-gray-800">公开广场</p><p class="text-[9px] text-gray-400">所有商家可见</p></div>
</button>
<button class="card flex items-center gap-2 p-2.5 rounded-xl border border-gray-100 bg-white" onclick="toast('公开广场方式')">
<div class="w-8 h-8 rounded-lg text-white flex items-center justify-center" style="background:linear-gradient(135deg,#2DD4BF,#14B8A6)"><i class="fas fa-lock text-xs"></i></div>
<div><p class="text-[12px] font-medium text-gray-700">定向邀请</p><p class="text-[9px] text-gray-400">指定商家报价</p></div>
</button>
</div>
</div>

<!-- 提交按钮 -->
<button class="grad-h w-full py-3 rounded-full text-white text-[15px] font-bold shadow-card" onclick="publish()">
<i class="fas fa-paper-plane text-xs mr-1"></i>立即发布
</button>
<p class="text-center text-[10px] text-gray-400 mt-2"><i class="fas fa-shield-halved mr-1" style="color:#10B981"></i>发布后可获得多家商家报价，择优成交</p>
</div>
</div>

<div class="h-16"></div>

<!-- 底部Tab栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:150;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">
<a href="home.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-house text-[18px]"></i><span class="text-[9px] font-semibold">首页</span></a>
<a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
<a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
<a href="property.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-building text-[18px]"></i><span class="text-[9px]">物业</span></a>
<a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
</div>
</div>
<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:151;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<!-- 消息提示 -->
<div class="toast" id="toast"><i class="fas fa-circle-check text-[#4ADE80]"></i><span id="toastTxt">操作成功</span></div>

<script>
var tagEls=document.querySelectorAll('.tag-opt');
tagEls.forEach(function(el){el.addEventListener('click',function(){el.classList.toggle('on')})});
var toastTimer;
function toast(msg){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1600)}
function publish(){
  var n=document.getElementById('fName').value,q=document.getElementById('fQty').value;
  if(!n||!q){toast('请填写商品名称和采购数量');return}
  document.getElementById('toast').querySelector('i').className='fas fa-circle-check text-[#4ADE80]';
  document.getElementById('toastTxt').textContent='需求已发布！等待商家报价';
  document.getElementById('toast').classList.add('on');
  var b=document.querySelector('.grad-h');
  b.innerHTML='<i class="fas fa-check"></i> 已发布，3s后返回';b.style.pointerEvents='none';
  setTimeout(function(){location.href='inquiry.html'},1500);
}
</script>
</body>
</html>
