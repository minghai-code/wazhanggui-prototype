<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>拼单详情 - 袜掌柜买家版</title>
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:#FFF7F4;width:393px;overflow-x:hidden}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
.card:active{transform:scale(.985)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.shadow-card{box-shadow:0 8px 24px rgba(5,150,105,.18)}
.progress-bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:rgba(255,255,255,.95);border-radius:4px}
.spec-tag{font-size:11px;color:#6b7080;background:#fff;border:1.5px solid #eceef0;border-radius:10px;padding:6px 12px;cursor:pointer;font-weight:500}
.spec-tag.on{border-color:#059669;color:#059669;background:#ECFDF5;font-weight:600}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none}
.sheet-mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:210;max-height:80vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;width:393px}
.sheet.on{transform:translateY(0)}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:12px 18px;border-radius:12px;font-size:12.5px;z-index:400;opacity:0;pointer-events:none;transition:.2s;text-align:center;line-height:1.5;max-width:80%}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px}
.b-going{color:#065F46;background:#D1FAE5}
.b-deal{color:#1D4ED8;background:#DBEAFE}
.b-fail{color:#9A3412;background:#FFEDD5}
.b-closed{color:#6B7280;background:#F1F2F5}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:center;justify-content:center}
.mask.on{display:flex}
</style>
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2" style="background:linear-gradient(135deg,#2DD4BF 0%,#059669 50%,#047857 100%);padding-bottom:14px">
  <div class="flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="flex items-center gap-3 mt-1">
    <a href="group-buy.html" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div class="flex-1">
      <p class="text-white font-extrabold text-[20px]">拼单详情</p>
      <p class="text-white/75 text-[10px] mt-0.5" id="gbNo">拼单号 T20261110001</p>
    </div>
    <button onclick="toast('分享拼单给好友')" class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-white"><i class="fas fa-share-nodes text-[13px]"></i></button>
  </div>
</div>

<div style="padding-bottom:110px">
  <!-- 商品 -->
  <div class="px-3 pt-3">
    <div class="bg-white rounded-2xl shadow-soft p-3.5">
      <div class="flex gap-2.5">
        <img id="pImg" src="images/sock_03.jpg" class="w-[88px] h-[88px] rounded-xl object-cover flex-shrink-0">
        <div class="flex-1 min-w-0">
          <p id="pTitle" class="text-[12px] text-gray-800 font-medium leading-tight line-clamp-2">精梳棉商务男袜 透气防臭 10双装</p>
          <p id="pMerchant" class="text-[9px] text-gray-400 mt-0.5">起批 100 双 · 大唐袜业旗舰</p>
          <div id="pPrice" class="flex items-baseline gap-1.5 mt-1"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态 / 进度 -->
  <div class="px-3 mt-3" id="statusBox"></div>

  <!-- 档位说明 -->
  <div class="px-3 mt-3" id="tierBox"></div>

  <!-- 参与者 -->
  <div class="px-3 mt-3" id="peopleBox"></div>

  <!-- 规则 -->
  <div class="px-3 mt-3">
    <div class="bg-white rounded-2xl shadow-soft p-3.5">
      <p class="text-[12px] font-bold text-gray-800 mb-2.5"><i class="fas fa-circle-info text-gray-400 text-[11px] mr-1"></i>拼单规则</p>
      <div class="space-y-1.5 text-[10px] text-gray-500 leading-relaxed" id="rules"></div>
    </div>
  </div>
</div>

<!-- 底部 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex items-center gap-2" style="height:60px;z-index:100;width:393px;padding:0 12px" id="bar"></div>
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:2px"></div></div>

<!-- 参团面板 -->
<div class="sheet-mask" id="joinMask" onclick="closeJoin()"></div>
<div class="sheet" id="joinSheet">
  <div class="flex justify-center pt-2 pb-1 sticky top-0 bg-white"><div class="w-10 h-1 bg-gray-200 rounded-full"></div></div>
  <div class="flex items-center justify-between px-4 pb-2">
    <span class="text-[15px] font-bold text-gray-800">选择规格</span>
    <button onclick="closeJoin()" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-gray-400"><i class="fas fa-xmark text-xs"></i></button>
  </div>
  <div class="px-4 pb-6">
    <div class="flex gap-3 pb-3 border-b border-gray-50 mb-3">
      <img id="sImg" src="images/sock_03.jpg" class="w-20 h-20 rounded-xl object-cover flex-shrink-0">
      <div class="flex-1">
        <p class="text-[10px] text-gray-400">按团长目标档锁价</p>
        <p class="text-[13px] font-bold text-gray-800 mt-0.5" id="sTitle">精梳棉商务男袜 透气防臭</p>
        <p class="text-[10px] text-gray-500 mt-1" id="joinSpecSummary">请选择：颜色 · 尺码</p>
      </div>
    </div>

    <div class="rounded-xl p-2.5 mb-3 flex items-start gap-2" style="background:#ECFDF5">
      <i class="fas fa-layer-group text-[10px] mt-0.5" style="color:#059669"></i>
      <span class="text-[10px] text-gray-600 leading-relaxed" id="tierTip">本团目标档 500 双，目标档价 ¥2.90/双（预付价 = 锁档结算价）；成团后按该价结算，超档不升价。</span>
    </div>

    <p class="text-[12px] font-medium text-gray-700 mb-2">颜色</p>
    <div class="flex flex-wrap gap-2 mb-3" id="colorList"></div>

    <p class="text-[12px] font-medium text-gray-700 mb-2">尺码</p>
    <div class="flex flex-wrap gap-2 mb-3" id="sizeList"></div>

    <div class="flex items-center justify-between mb-2">
      <p class="text-[12px] font-medium text-gray-700">参拼数量</p>
      <div class="flex items-center gap-2">
        <button onclick="stepJoin(-1)" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 text-[14px]">-</button>
        <input type="text" id="joinQty" value="20" readonly class="w-14 text-center text-[13px] font-medium outline-none">
        <button onclick="stepJoin(1)" class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 text-[14px]">+</button>
      </div>
    </div>
    <p class="text-[9px] text-amber-500 mb-3" id="minTip">参团不得少于 100 双（目标档 500 双的 20%），每次递增 10 双</p>

    <button onclick="toCheckout()" class="w-full py-3 rounded-xl text-[14px] font-bold text-white shadow-card" style="background:linear-gradient(135deg,#2DD4BF,#059669)">去结算</button>
    <p class="text-[9.5px] text-gray-400 text-center mt-2">下一步填写收货地址并支付，成团后按档位价备货</p>
  </div>
</div>

<!-- 取消拼单确认 -->
<div class="mask" id="cancelMask">
  <div class="bg-white rounded-2xl p-5 text-center" style="width:290px">
    <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center" style="background:#FFEDD5"><i class="fas fa-triangle-exclamation text-orange-500"></i></div>
    <p class="text-[15px] font-bold text-gray-800 mt-3">取消本团拼单？</p>
    <p class="text-[11px] text-gray-500 mt-1.5 leading-relaxed">取消后本团立即关闭，已参拼成员的款项<br>将原路全额退回，且不可恢复</p>
    <div class="flex gap-2 mt-4">
      <button class="flex-1 py-2.5 rounded-xl bg-gray-100 text-[12px] font-bold text-gray-600" onclick="closeCancel()">再想想</button>
      <button class="flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:#DC2626" onclick="doCancel()">确认取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* 团 4 态（10b v2.1 §2.0.13 ⑥，逐字一致）：进行中 / 已成团 / 已失效 / 已取消 */
/* 拼单团数据（10b v2.1 §2.0.13 目标档口径；8 团与运营端 mall-group-manage.html、商户端 #72 同源）
   tierQty   = 该规格阶梯最小档起始数量（仅作起批量展示，不参与下限计算）
   targetQty = 团长发起时选定的目标档起始数量 = 成团阈值 = 下限计算基数
   targetPrice = 目标档单价（预付价 = 锁档结算价，超档不升价）
   groupMin  = max(10, ceil(targetQty×20%))，对齐 10 的倍数（10b v2.1 §2.0.13 ④ 2026-11-11 裁决） */
var GB={
  'T20261110001':{no:'T20261110001',status:'going',title:'秋季加厚羊毛袜',img:'images/sock_06.jpg',merchant:'大唐袜业旗舰店',tierQty:100,targetQty:500,targetPrice:2.90,cum:320,people:3,owner:true,cd:'54:00:00',colors:['本白','麻灰','咖色','藏青'],sizes:['均码(35-40)','M(39-42)','L(43-46)'],parts:[['张',120,'2 天前 09:12','团长'],['李',100,'1 天前 10:30',''],['王',100,'今天 08:40','']]},
  'T20261110008':{no:'T20261110008',status:'going',title:'抗菌防臭商务袜',img:'images/sock_03.jpg',merchant:'金华EE贸易',tierQty:100,targetQty:300,targetPrice:3.50,cum:180,people:2,owner:false,cd:'06:00:00',colors:['藏青','黑色'],sizes:['均码(38-43)','M(39-42)'],parts:[['王',100,'1 天前 12:30','团长'],['施',80,'昨天 18:10','']]},
  'T20261108002':{no:'T20261108002',status:'deal',title:'纯棉商务袜（5 双装）',img:'images/sock_03.jpg',merchant:'宁波纯棉针织',tierQty:200,targetQty:200,targetPrice:4.50,cum:520,people:6,owner:false,orderNo:'GB20261108011',parts:[['周',80,'11-08 16:40','团长'],['吴',120,'11-08 18:20',''],['郑',100,'11-09 09:10',''],['孙',80,'11-09 11:05',''],['钱',80,'11-09 12:40',''],['冯',60,'11-09 14:20','']]},
  'T20261106005':{no:'T20261106005',status:'deal',title:'竹纤维抗菌男袜',img:'images/sock_04.jpg',merchant:'义乌竹纤维针织',tierQty:300,targetQty:300,targetPrice:3.90,cum:330,people:4,owner:false,orderNo:'GB20261106041',parts:[['孙',150,'11-06 11:00','团长'],['马',60,'11-07 09:30',''],['朱',60,'11-08 14:00',''],['胡',60,'11-09 08:50','']]},
  'T20261105003':{no:'T20261105003',status:'fail',title:'儿童卡通棉袜（3 双装）',img:'images/sock_05.jpg',merchant:'绍兴童袜工厂',tierQty:100,targetQty:300,targetPrice:3.30,cum:260,people:3,owner:false,refund:'¥858.00',parts:[['何',120,'11-05 10:20','团长'],['罗',80,'11-06 15:10',''],['高',60,'11-07 09:40','']]},
  'T20261109006':{no:'T20261109006',status:'fail',title:'加厚滑雪袜（户外款）',img:'images/sock_02.jpg',merchant:'杭州CC户外',tierQty:200,targetQty:200,targetPrice:6.20,cum:140,people:3,owner:false,refund:'¥868.00',parts:[['郑',60,'11-09 08:30','团长'],['罗',40,'11-09 20:10',''],['冯',40,'11-10 12:00','']]},
  'T20261102007':{no:'T20261102007',status:'fail',title:'精梳棉长筒商务袜',img:'images/sock_01.jpg',merchant:'诸暨DD工厂',tierQty:100,targetQty:1000,targetPrice:2.40,cum:780,people:8,owner:false,refund:'¥1,872.00'},
  'T20261103004':{no:'T20261103004',status:'closed',title:'运动船袜（纯色 10 双装）',img:'images/sock_06.jpg',merchant:'杭州AA跨境',tierQty:500,targetQty:500,targetPrice:2.80,cum:450,people:4,owner:true,reason:'商户申请取消本团（原因：无法供货），运营审核通过后本团关闭，4 人款项已原路全额退回。'}
};
function groupMinOf(g){return Math.max(10,Math.ceil((g.targetQty||100)*0.2/10)*10);}
var Q=(location.search.match(/gb=([A-Za-z0-9]+)/)||[])[1];
/* 团号查不到 → 空态拦截，禁止静默回落到别的团（C12） */
var G=(Q&&GB[Q])?GB[Q]:null;
function showMissing(){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;inset:0;background:#F5F6FA;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 32px;text-align:center';
  d.innerHTML='<div style="width:64px;height:64px;border-radius:50%;background:#F1F5F9;display:flex;align-items:center;justify-content:center;margin-bottom:14px"><i class="fas fa-link-slash" style="color:#94A3B8;font-size:22px"></i></div>'
    +'<p style="font-size:15px;font-weight:700;color:#1F2430;margin-bottom:6px">该拼单不存在或已下线</p>'
    +'<p style="font-size:12px;color:#64748B;line-height:1.7">团号 '+(Q||'—')+' 未找到，可能已被删除、取消或关闭。</p>'
    +'<a href="group-buy.html" style="margin-top:18px;padding:9px 24px;border-radius:999px;background:#059669;color:#fff;font-size:13px;font-weight:700;text-decoration:none">去拼单列表看看</a>';
  document.body.appendChild(d);
}
if(!G){showMissing();G={no:(Q||'—'),status:'missing',title:'',img:'',merchant:'',tierQty:100,targetQty:0,targetPrice:0,cum:0,people:0,parts:[]};}
var curColor=G.colors?G.colors[0]:'',curSize=G.sizes?G.sizes[0]:'';

function $(id){return document.getElementById(id)}
var tt;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},1600)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function tick(){
  if(G.status!=='going')return;
  var el=$('cd');if(!el)return;
  var p=el.textContent.split(':').map(Number),t=p[0]*3600+p[1]*60+p[2]-1;
  if(t<=0){
    /* 归零 = 到期未达目标档 → 置「已失效」，隐藏参团按钮（B3） */
    G.status='fail';G.refund=G.refund||('¥'+(G.cum*G.targetPrice).toFixed(2));
    render();
    toast('拼单已到期且未达目标档，已置为「已失效」，款项将原路全额退回');
    return;
  }
  el.textContent=[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(function(n){return String(n).padStart(2,'0')}).join(':');
}

function render(){
  var gm=groupMinOf(G);
  $('gbNo').textContent='拼单号 '+G.no;
  $('pImg').src=G.img;$('pTitle').textContent=G.title;
  $('pMerchant').textContent='阶梯起订 '+G.tierQty+' 双 · '+G.merchant;
  $('sImg').src=G.img;$('sTitle').textContent=G.title.replace(/ \d+双装/,'');

  var priceHtml='';
  if(G.status==='deal'){
    priceHtml='<span class="font-bold text-[20px]" style="color:#059669">¥'+G.targetPrice.toFixed(2)+'</span><span class="text-[10px] text-gray-400">/双（目标档价 · 已锁档）</span>';
  }else if(G.status==='fail'||G.status==='closed'){
    priceHtml='<span class="text-[11px] text-gray-400">本团未成团，目标档价不生效</span>';
  }else{
    priceHtml='<span class="font-bold text-[20px]" style="color:#059669">¥'+G.targetPrice.toFixed(2)+'</span><span class="text-[10px] text-gray-400">/双（目标档价 · 预付=结算价）</span>';
  }
  $('pPrice').innerHTML=priceHtml;

  /* 状态区 */
  var sb='';
  if(G.status==='going'){
    var pct=Math.min(100,Math.round(G.cum/G.targetQty*100));
    sb='<div class="rounded-2xl p-4 text-white shadow-card" style="background:linear-gradient(135deg,#2DD4BF 0%,#059669 100%)">'
      +'<div class="flex items-center justify-between mb-2">'
      +'<div class="flex items-center gap-1.5"><i class="fas fa-bolt text-[14px]"></i><span class="text-[14px] font-bold">集采拼单</span><span class="badge b-going" style="background:rgba(255,255,255,.25);color:#fff">进行中</span></div>'
      +'<div class="flex items-center gap-1 bg-white/20 px-2 py-1 rounded-full"><i class="fas fa-clock text-[10px]"></i><span class="text-[12px] font-semibold" id="cd">'+G.cd+'</span></div></div>'
      +'<div class="flex items-center justify-between text-[11px] mb-1.5"><span>已拼 <span class="font-bold text-[15px]">'+G.cum+'</span> 双 <span class="text-white/70">/ 目标档 '+G.targetQty+' 双</span></span>'
      +'<span class="text-white/85">还差 '+(G.targetQty-G.cum)+' 双</span></div>'
      +'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
      +'<div class="flex items-center gap-2 mt-2.5 text-[10px] text-white/80"><i class="fas fa-users"></i><span>'+G.people+' 人参团</span><span class="mx-1">|</span><i class="fas fa-tag"></i><span>参团每人 ≥'+gm+' 双</span></div>'
      +'<p class="text-[9.5px] text-white/70 mt-1.5">达目标档即按 ¥'+G.targetPrice.toFixed(2)+'/双 锁档结算，超档不升价</p>'
      +'</div>';
  }else if(G.status==='deal'){
    sb='<div class="rounded-2xl p-4 text-white shadow-card" style="background:linear-gradient(135deg,#3B82F6,#1D4ED8)">'
      +'<div class="flex items-center gap-2"><i class="fas fa-circle-check"></i><span class="text-[14px] font-bold">已成团</span><span class="badge b-deal" style="background:rgba(255,255,255,.25);color:#fff">锁目标档 ¥'+G.targetPrice.toFixed(2)+'/双</span></div>'
      +'<p class="text-[11px] text-white/85 mt-2 leading-relaxed">累计 '+G.cum+' 双，已达目标档 '+G.targetQty+' 双，全团按 ¥'+G.targetPrice.toFixed(2)+'/双 统一锁档（超档不升价）。</p>'
      +'<p class="text-[10px] text-white/75 mt-1.5">本团已生成 '+G.people+' 笔订单 · 参团人可在「我的拼单」查看自己的发货进度</p>'
      +'</div>';
  }else if(G.status==='fail'){
    sb='<div class="rounded-2xl p-4" style="background:#FFF1E7;border:1px solid #FED7AA">'
      +'<div class="flex items-center gap-2"><i class="fas fa-rotate-left text-orange-500"></i><span class="text-[14px] font-bold text-gray-800">拼单失败，已全额退款</span></div>'
      +'<p class="text-[11px] text-gray-600 mt-2 leading-relaxed">到期仅拼到 '+G.cum+'/'+G.targetQty+' 双，未达目标档（即便已过第一档 '+G.tierQty+' 双也不算成团），'+G.people+' 人款项已原路退回。</p>'
      +'<p class="text-[10px] text-gray-500 mt-1.5">退款金额 '+G.refund+' · 预计 1-3 个工作日到账</p>'
      +'</div>';
  }else{
    sb='<div class="rounded-2xl p-4" style="background:#F4F5F7">'
      +'<div class="flex items-center gap-2"><i class="fas fa-circle-xmark text-gray-400"></i><span class="text-[14px] font-bold text-gray-700">拼单已取消</span><span class="badge" style="background:#E2E8F0;color:#475569">已退款</span></div>'
      +'<p class="text-[11px] text-gray-500 mt-2 leading-relaxed">'+G.reason+'</p>'
      +'</div>';
  }
  $('statusBox').innerHTML=sb;

  /* 档位 */
  if(G.status==='going'){
    $('tierBox').innerHTML='<div class="bg-white rounded-2xl shadow-soft p-3.5"><p class="text-[12px] font-bold text-gray-800 mb-2">目标档与参团下限</p>'
      +'<div class="flex items-center justify-between text-[11px] text-gray-500"><span>目标档（成团阈值）<b class="text-gray-800">'+G.targetQty+' 双</b></span><span>目标档价 <b class="text-gray-800">¥'+G.targetPrice.toFixed(2)+'/双</b></span></div>'
      +'<div class="mt-2 h-1.5 rounded-full bg-gray-100 overflow-hidden"><div style="width:'+Math.min(100,Math.round(G.cum/G.targetQty*100))+'%;height:100%;background:linear-gradient(90deg,#2DD4BF,#059669)"></div></div>'
      +'<p class="text-[9.5px] text-gray-400 mt-2">累计 '+G.cum+'/'+G.targetQty+' 双 · 还差 '+(G.targetQty-G.cum)+' 双；参团每人 ≥ '+gm+' 双（目标档 '+G.targetQty+' 双 × 20%）</p>'
      +'<p class="text-[9.5px] text-gray-400 mt-1">超目标档仍按 ¥'+G.targetPrice.toFixed(2)+'/双 结算，不升档也不降价；团发起后档位锁定不可改</p></div>';
  }else{$('tierBox').innerHTML='';}

  /* 参与者 */
  var joins=G.parts||[];
  $('peopleBox').innerHTML='<div class="bg-white rounded-2xl shadow-soft p-3.5"><div class="flex items-center justify-between mb-2.5">'
    +'<p class="text-[12px] font-bold text-gray-800">参与记录 ('+G.people+' 人 · 合计 '+G.cum+' 双)</p>'
    +(G.status==='going'?'<button onclick="toast(\'查看全部参与者\')" class="text-[10px] text-gray-400">查看全部 ›</button>':'')
    +'</div><div class="space-y-2.5">'+(joins.length?joins.map(function(j){
      return '<div class="flex items-center gap-2.5"><div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style="background:linear-gradient(135deg,#2DD4BF,#14B8A6)">'+j[0]+'</div>'
        +'<div class="flex-1"><p class="text-[11px] text-gray-700 font-medium">'+j[0]+'**</p><p class="text-[9px] text-gray-400">'+j[1]+' 双 · '+j[2]+'</p></div>'
        +(j[3]?'<span class="text-[9px] text-white px-2 py-0.5 rounded-full" style="background:#059669">'+j[3]+'</span>':'<span class="text-[9px] text-gray-400">已参拼</span>')
        +'</div>';
    }).join(''):'<p class="text-[11px] text-gray-400">暂无参与明细</p>')+'</div></div>';

  /* 规则 */
  var rules=[
    '团长在商品详情选规格、选定**目标档**（200/300/500/1000 双）并支付，团进入「进行中」。',
    '累计数量 ≥ 目标档即成团（本团目标档 '+G.targetQty+' 双），全团按目标档价 ¥'+G.targetPrice.toFixed(2)+'/双 锁档结算，不再改价。',
    '超目标档不升价也不降价（例：目标档 200 双 ¥4.50，拼到 520 双仍按 ¥4.50）。',
    '参团每人 ≥ '+gm+' 双（目标档 '+G.targetQty+' 双 × 20%，不足 10 双按 10 双），参团即按目标档价预付，参团后不可单独撤回。',
    '到期未达目标档 → 拼单失败，全员全额退款；**即便已过第一档也不算成团**。',
    '团长可取消拼单；商户申请取消需运营审核。取消后本团关闭，全员款项原路全额退回且不可恢复。',
    '成团后按锁档价统一备货发货；成团后不支持退换货，质量问题请联系商家售后。'
  ];
  $('rules').innerHTML=rules.map(function(r,i){return '<p><span class="text-primary font-bold">'+(i+1)+'.</span> '+r+'</p>'}).join('');

  renderBar();
  renderSheet();
  tick();
}

function renderBar(){
  if(G.status==='going'){
    $('bar').innerHTML='<button onclick="toast(\'分享拼单给好友\')" class="flex flex-col items-center justify-center px-3 py-1.5 rounded-xl text-gray-500" style="border:1px solid #eceef0"><i class="fas fa-share-nodes text-[14px]"></i><span class="text-[8px] mt-0.5">分享</span></button>'
      +'<button onclick="toast(\'联系商户\')" class="flex flex-col items-center justify-center px-3 py-1.5 rounded-xl text-gray-500" style="border:1px solid #eceef0"><i class="fas fa-comment text-[14px]"></i><span class="text-[8px] mt-0.5">联系商户</span></button>'
      +(G.owner?'<button onclick="openCancel()" class="px-3 py-2.5 rounded-full text-[11.5px] font-bold text-gray-500 bg-gray-100">取消拼单</button>':'')
      +'<button onclick="openJoin()" class="flex-1 py-2.5 rounded-full text-[13px] font-bold text-white shadow-card" style="background:linear-gradient(135deg,#2DD4BF,#059669)">参与拼单</button>';
  }else if(G.status==='deal'){
    $('bar').innerHTML='<a href="group-buy.html" class="flex-1 py-2.5 rounded-full text-[12.5px] font-bold text-gray-600 bg-gray-100 text-center">逛其他拼单</a>'
      +'<a href="group-records.html" class="flex-1 py-2.5 rounded-full text-[12.5px] font-bold text-white text-center shadow-card" style="background:linear-gradient(135deg,#2DD4BF,#059669)">查看我的拼单</a>';
  }else{
    $('bar').innerHTML='<a href="group-records.html" class="flex-1 py-2.5 rounded-full text-[12.5px] font-bold text-gray-600 bg-gray-100 text-center">查看我的拼单</a>'
      +'<a href="group-buy.html" class="flex-1 py-2.5 rounded-full text-[12.5px] font-bold text-white text-center shadow-card" style="background:linear-gradient(135deg,#2DD4BF,#059669)">去看看其他拼单</a>';
  }
}

function renderSheet(){
  $('colorList').innerHTML=(G.colors||[]).map(function(c){
    return '<span class="spec-tag'+(c===curColor?' on':'')+'" onclick="pickSpec(this,\''+c+'\',\'color\')">'+c+'</span>';
  }).join('');
  $('sizeList').innerHTML=(G.sizes||[]).map(function(s){
    return '<span class="spec-tag'+(s===curSize?' on':'')+'" onclick="pickSpec(this,\''+s+'\',\'size\')">'+s+'</span>';
  }).join('');
  var gm=groupMinOf(G);
  $('minTip').textContent='参团不得少于 '+gm+' 双（目标档 '+G.targetQty+' 双 × 20%），每次递增 10 双';
  $('tierTip').textContent='本团目标档 '+G.targetQty+' 双，目标档价 ¥'+G.targetPrice.toFixed(2)+'/双（预付价 = 锁档结算价）；成团后按该价结算，超档不升价。';
  $('joinQty').value=gm;
  $('joinSpecSummary').textContent=curColor+' · '+curSize+' · '+gm+' 双';
}

function pickSpec(el,val,group){
  el.parentElement.querySelectorAll('.spec-tag').forEach(function(i){i.classList.remove('on')});
  el.classList.add('on');
  if(group==='color')curColor=val;else curSize=val;
  $('joinSpecSummary').textContent=curColor+' · '+curSize+' · '+$('joinQty').value+' 双';
}
function stepJoin(d){
  var gm=groupMinOf(G);
  var i=$('joinQty'),v=Math.max(gm,(parseInt(i.value)||gm)+d*10);
  i.value=v;$('joinSpecSummary').textContent=curColor+' · '+curSize+' · '+v+' 双';
}
function openJoin(){$('joinMask').classList.add('on');$('joinSheet').classList.add('on')}
function closeJoin(){$('joinSheet').classList.remove('on');$('joinMask').classList.remove('on')}

/* 去结算：拼单不在此处定价，金额在结算页按成团档位计算 */
function toCheckout(){
  var gm=groupMinOf(G);
  var qty=parseInt($('joinQty').value)||0;
  if(qty<gm){toast('参团不得少于 '+gm+' 双');return;}
  if(qty%10!==0){toast('数量需为 10 的整数倍');return;}
  window.location.href='order-checkout.html?type=group&gb='+G.no+'&qty='+qty+'&tier='+G.targetQty+'&spec='+encodeURIComponent(curColor+'/'+curSize);
}

function openCancel(){$('cancelMask').classList.add('on')}
function closeCancel(){$('cancelMask').classList.remove('on')}
function doCancel(){
  G.status='closed';G.reason='团长已取消本团拼单，成员款项已全额退回';
  closeCancel();toast('拼单已取消，成员款项将全额退回');
  render();
}

render();
setInterval(tick,1000);
</script>

</body>
