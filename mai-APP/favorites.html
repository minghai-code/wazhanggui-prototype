<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<script src="https://cdn.tailwindcss.com"></script>

<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}

<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4;--v1:#7C3AED;--v2:#FF2D78}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:#FFF7F4;width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.no-bar::-webkit-scrollbar{display:none}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.tag-hot{background:linear-gradient(90deg,#FF4D2D,#FF7849)}
.card{transition:transform .16s ease, box-shadow .16s ease}
.card:active{transform:scale(.965)}
.sec-title{font-size:17px;font-weight:800;letter-spacing:.3px;color:#1F2430}
.text-grad{background:linear-gradient(90deg,#FF4D2D,#FF2D78);-webkit-background-clip:text;background-clip:text;color:transparent}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Tab样式 */
.tab-bar{display:flex;gap:8px;padding:0 12px}
.tab-item{flex:1;text-align:center;padding:9px 0;border-radius:14px;font-size:13px;font-weight:600;color:#9aa0ac;background:#fff;box-shadow:0 2px 12px rgba(20,20,40,.05);transition:.25s;border:1px solid rgba(0,0,0,.03)}
.tab-item .tab-count{font-size:10px;font-weight:500;opacity:.7;margin-left:2px}
.tab-item.on{background:linear-gradient(135deg,#FF6B35,#FF4D2D 55%,#FF2D78);color:#fff;box-shadow:0 6px 16px rgba(255,77,45,.3);border-color:transparent}
.tab-item.on .tab-count{opacity:.85}
/* 排序按钮 */
.sort-btn{display:flex;align-items:center;gap:3px;font-size:11px;color:#6b7280;background:#fff;border:1px solid #eee;padding:5px 10px;border-radius:20px;transition:.2s}
.sort-btn:active{transform:scale(.95)}
.sort-btn.on{color:#FF4D2D;border-color:#FFD0C4;background:#FFF0EC}
/* toast */
.toast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.85);background:rgba(15,18,26,.92);color:#fff;padding:13px 22px;border-radius:14px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.25s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:130px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
/* 收藏心跳动画 */
.heart-btn{transition:transform .15s ease}
.heart-btn:active{transform:scale(1.3)}
.heart-pop{animation:heartPop .4s ease}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(.85)}100%{transform:scale(1)}}
/* 面板切换 */
.panel{display:none}
.panel.on{display:block;animation:fadeUp .35s ease both}
/* 店铺Logo渐变 */
.shop-logo{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
/* 商品图加载占位 */
.prod-img-wrap{background:linear-gradient(135deg,#fff3ee,#ffe9e4);position:relative;overflow:hidden}
.prod-img-wrap img{transition:opacity .3s}
</style>
</head>
<body>

<!-- ===== 顶部渐变头部 + 流动光斑 ===== -->
<div class="relative px-4 pt-2 pb-3 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FF8A4C"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FF2D78"></div>

  <!-- iOS状态栏 -->

    </div>
  </div>

  <!-- 导航栏：玻璃返回键 + 标题 -->
  <div class="relative flex items-center justify-between">

    <a href="mine.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-ellipsis text-sm"></i></a>

</div>

<!-- ===== Tab栏 ===== -->
<div class="px-3 -mt-1 relative z-10">
  <div class="tab-bar">
    <div class="tab-item on" id="tab1" onclick="switchTab(1)">
      <i class="fas fa-heart text-[12px] mr-1"></i>收藏商品<span class="tab-count">12</span>
    </div>
    <div class="tab-item" id="tab2" onclick="switchTab(2)">
      <i class="fas fa-store text-[12px] mr-1"></i>关注店铺<span class="tab-count">3</span>

  </div>
</div>

<!-- ===== 排序工具栏 ===== -->
<div class="px-4 mt-3 flex items-center justify-between" id="sortBar">
  <span class="text-[11px] text-gray-400"><i class="fas fa-clock-rotate-left text-[10px] mr-1"></i>最近收藏的商品</span>
  <div class="flex items-center gap-2">
    <div class="sort-btn on" id="sortLatest" onclick="setSort('latest')">

</div>

<!-- ===== 面板1：收藏商品 ===== -->
<div class="panel on" id="panel1">
  <div class="px-3 pt-3 pb-2">
    <div class="grid grid-cols-2 gap-2.5" id="prodGrid">
      <!-- JS动态渲染 -->
    </div>
  </div>
  <!-- 空状态(隐藏) -->
  <div class="hidden text-center py-16 px-8" id="emptyProd">
    <div class="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-4">
      <i class="far fa-heart text-3xl text-gray-300"></i>
    </div>
    <p class="text-[14px] text-gray-400 font-medium">还没有收藏的商品</p>
    <p class="text-[11px] text-gray-300 mt-1">去逛逛心仪的袜子吧～</p>

<div class="panel" id="panel2">

<div class="mt-6 mb-28 text-center">

</div>

<!-- ===== 底部Tab栏 5Tab ===== -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:100;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">

<a href="mine.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-user text-[18px]"></i><span class="text-[9px] font-semibold">我的</span></a>

<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<div class="toast" id="toast"><i class="fas fa-circle-check"></i><span id="toastMsg">操作成功</span></div>

<script>
// ===== 商品数据 =====
var products = [
  {id:1,name:'白色纯棉商务袜 10双装',price:'3.50',oldPrice:'4.80',sold:3260,shop:'袜语工坊',prompt:'白色纯棉商务袜产品图,简约折叠摆放,白色背景,高清产品摄影',fav:true,time:1},
  {id:2,name:'冰丝凉感透气袜 夏季款',price:'5.80',oldPrice:'7.50',sold:5820,shop:'冰丝世家',prompt:'冰丝凉感透气袜子,浅蓝色,夏季薄款,产品摄影,白色背景',fav:true,time:2},
  {id:3,name:'运动压缩长筒袜 防滑',price:'8.90',oldPrice:'12.00',sold:2140,shop:'运动达人袜业',prompt:'运动压缩长筒袜,黑色专业运动袜,产品摄影,白色背景',fav:true,time:3},
  {id:4,name:'竹纤维抗菌防臭袜 5双',price:'4.20',oldPrice:'6.00',sold:4380,shop:'袜语工坊',prompt:'竹纤维抗菌袜子,浅绿色,环保材质,产品摄影,白色背景',fav:true,time:4},
  {id:5,name:'精梳棉提花花纹袜',price:'6.50',oldPrice:'9.90',sold:1670,shop:'花色织造坊',prompt:'精梳棉提花花纹袜子,几何图案,彩色,产品摄影,白色背景',fav:true,time:5},
  {id:6,name:'隐形船袜女士浅口款',price:'2.80',oldPrice:'4.50',sold:8900,shop:'冰丝世家',prompt:'女士隐形船袜,浅口设计,肤色,产品摄影,白色背景',fav:true,time:6},
  {id:7,name:'毛巾底运动袜 加厚',price:'7.20',oldPrice:'10.00',sold:3450,shop:'运动达人袜业',prompt:'毛巾底加厚运动袜,灰色,专业运动,产品摄影,白色背景',fav:true,time:7},
  {id:8,name:'美利奴羊毛保暖冬袜',price:'12.80',oldPrice:'18.00',sold:980,shop:'暖绒工坊',prompt:'美利奴羊毛保暖袜子,深灰色,冬季款,产品摄影,白色背景',fav:true,time:8},
  {id:9,name:'渐变彩虹棉袜 潮流款',price:'4.90',oldPrice:'7.80',sold:6230,shop:'花色织造坊',prompt:'渐变彩虹色棉袜,彩色渐变,潮流设计,产品摄影,白色背景',fav:true,time:9},
  {id:10,name:'卡通图案儿童袜 5双装',price:'3.80',oldPrice:'5.50',sold:4560,shop:'童趣袜业',prompt:'卡通图案儿童袜子,可爱动物图案,彩色,产品摄影,白色背景',fav:true,time:10},
  {id:11,name:'防滑瑜伽袜 五趾分开款',price:'9.50',oldPrice:'13.00',sold:1280,shop:'运动达人袜业',prompt:'防滑瑜伽五趾袜,粉色,专业瑜伽,产品摄影,白色背景',fav:true,time:11},
  {id:12,name:'商务暗纹绅士袜 礼盒装',price:'15.80',oldPrice:'22.00',sold:760,shop:'袜语工坊',prompt:'商务暗纹绅士袜子,深蓝色,高端礼盒装,产品摄影,白色背景',fav:true,time:12}
];

// ===== 店铺数据 =====
var shops = [
  {id:1,name:'袜语工坊',cat:'主营:纯棉袜·商务袜',rating:'4.9',fans:'12.6万',goods:168,grad:'linear-gradient(135deg,#FF6B35,#FF4D2D)',icon:'fa-socks',followed:true},
  {id:2,name:'冰丝世家',cat:'主营:冰丝袜·夏季凉感袜',rating:'4.8',fans:'8.9万',goods:96,grad:'linear-gradient(135deg,#38BDF8,#3B82F6)',icon:'fa-snowflake',followed:true},
  {id:3,name:'运动达人袜业',cat:'主营:运动袜·压缩袜',rating:'4.9',fans:'15.2万',goods:203,grad:'linear-gradient(135deg,#34D399,#10B981)',icon:'fa-person-running',followed:true}
];

var currentSort = 'latest';

// ===== 渲染商品 =====
function renderProducts(){
  var list = products.filter(function(p){return p.fav;});
  // 排序
  if(currentSort==='price'){
    list.sort(function(a,b){return parseFloat(a.price)-parseFloat(b.price);});
  } else {
    list.sort(function(a,b){return a.time-b.time;});
  }
  var grid = document.getElementById('prodGrid');
  if(list.length===0){
    grid.innerHTML='';
    document.getElementById('emptyProd').classList.remove('hidden');
    document.getElementById('sortBar').style.display='none';
    return;
  }
  document.getElementById('emptyProd').classList.add('hidden');
  document.getElementById('sortBar').style.display='flex';
  var html='';
  list.forEach(function(p){
    var imgUrl = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=' + encodeURIComponent(p.prompt) + '&image_size=square';
    html += '<a href="product-detail.html" class="card bg-white rounded-2xl overflow-hidden shadow-soft fade-up" style="animation-delay:'+(p.time*0.03)+'s">';
    html += '<div class="prod-img-wrap relative" style="height:155px">';
    html += '<img src="'+imgUrl+'" class="w-full h-full object-cover" loading="lazy" onerror="this.style.display=\'none\'">';
    html += '<div class="absolute top-1.5 right-1.5">';
    html += '<button class="heart-btn w-7 h-7 rounded-full bg-white/85 backdrop-blur flex items-center justify-center shadow-sm" onclick="toggleFav('+p.id+',event)">';
    html += '<i class="fas fa-heart text-[13px]" style="color:#FF4D2D" id="heart-'+p.id+'"></i>';
    html += '</button>';
    html += '</div>';
    if(p.oldPrice){
      html += '<div class="absolute bottom-1.5 left-1.5 tag-hot text-white text-[9px] px-1.5 py-0.5 rounded-full font-bold">省¥'+(parseFloat(p.oldPrice)-parseFloat(p.price)).toFixed(2)+'</div>';
    }
    html += '</div>';
    html += '<div class="p-2">';
    html += '<p class="text-[12px] text-gray-800 font-medium leading-tight line-clamp-2" style="min-height:32px">'+p.name+'</p>';
    html += '<div class="flex items-baseline gap-1 mt-1">';
    html += '<span class="text-grad font-bold text-[16px]">¥'+p.price+'</span>';
    if(p.oldPrice) html += '<span class="text-[10px] text-gray-300 line-through">¥'+p.oldPrice+'</span>';
    html += '</div>';
    html += '<div class="flex items-center justify-between mt-1.5">';
    html += '<span class="text-[9px] text-gray-400">已售'+formatSold(p.sold)+'</span>';
    html += '<span class="text-[9px] text-gray-400 truncate ml-1"><i class="fas fa-store text-[8px] mr-0.5"></i>'+p.shop+'</span>';
    html += '</div>';
    html += '</div>';
    html += '</a>';
  });
  grid.innerHTML=html;
}

// ===== 渲染店铺 =====
function renderShops(){
  var list = shops.filter(function(s){return s.followed;});
  var container = document.getElementById('shopList');
  if(list.length===0){
    container.innerHTML='';
    document.getElementById('emptyShop').classList.remove('hidden');
    return;
  }
  document.getElementById('emptyShop').classList.add('hidden');
  var html='';
  list.forEach(function(s,idx){
    html += '<a href="shop-detail.html" class="card bg-white rounded-2xl overflow-hidden shadow-soft fade-up block" style="animation-delay:'+(idx*0.05)+'s">';
    html += '<div class="flex items-center gap-3 p-3">';
    html += '<div class="shop-logo w-14 h-14 rounded-2xl flex-shrink-0" style="background:'+s.grad+'">';
    html += '<i class="fas '+s.icon+' text-lg"></i>';
    html += '</div>';
    html += '<div class="flex-1 min-w-0">';
    html += '<div class="flex items-center gap-1.5">';
    html += '<span class="text-[14px] font-bold text-gray-800 truncate">'+s.name+'</span>';
    html += '<i class="fas fa-circle-check text-[10px]" style="color:#FF4D2D"></i>';
    html += '</div>';
    html += '<p class="text-[10px] text-gray-400 mt-0.5">'+s.cat+'</p>';
    html += '<div class="flex items-center gap-2 mt-1.5">';
    html += '<span class="flex items-center gap-0.5 text-[10px] text-gray-500"><i class="fas fa-star text-[9px]" style="color:#FBBF24"></i>'+s.rating+'</span>';
    html += '<span class="text-[10px] text-gray-300">|</span>';
    html += '<span class="text-[10px] text-gray-500">'+s.fans+'粉丝</span>';
    html += '<span class="text-[10px] text-gray-300">|</span>';
    html += '<span class="text-[10px] text-gray-500">'+s.goods+'件商品</span>';
    html += '</div>';
    html += '</div>';
    html += '<button class="flex-shrink-0 text-white text-[11px] font-semibold px-3.5 py-1.5 rounded-full shadow-soft" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)" onclick="event.preventDefault();event.stopPropagation();location.href=\'shop-detail.html\'">进店</button>';
    html += '</div>';
    html += '</a>';
  });
  container.innerHTML=html;
}

// ===== Tab切换 =====
function switchTab(n){
  document.getElementById('tab1').classList.remove('on');
  document.getElementById('tab2').classList.remove('on');
  document.getElementById('panel1').classList.remove('on');
  document.getElementById('panel2').classList.remove('on');
  document.getElementById('tab'+n).classList.add('on');
  document.getElementById('panel'+n).classList.add('on');
  // 排序栏仅商品Tab显示
  document.getElementById('sortBar').style.display = n===1 ? 'flex' : 'none';
}

// ===== 排序 =====
function setSort(type){
  currentSort = type;
  document.getElementById('sortLatest').classList.remove('on');
  document.getElementById('sortPrice').classList.remove('on');
  if(type==='latest'){
    document.getElementById('sortLatest').classList.add('on');
    document.querySelector('#sortBar span').innerHTML = '<i class="fas fa-clock-rotate-left text-[10px] mr-1"></i>最近收藏的商品';
  } else {
    document.getElementById('sortPrice').classList.add('on');
    document.querySelector('#sortBar span').innerHTML = '<i class="fas fa-arrow-down-wide-short text-[10px] mr-1"></i>按价格从低到高';
  }
  renderProducts();
}

// ===== 收藏切换 =====
function toggleFav(id,e){
  e.preventDefault();
  e.stopPropagation();
  var p = products.find(function(x){return x.id===id;});
  if(!p) return;
  var heart = document.getElementById('heart-'+id);
  if(p.fav){
    p.fav = false;
    heart.classList.remove('fas','heart-pop');
    heart.classList.add('far');
    heart.style.color = '#9aa0ac';
    showToast('已取消收藏', 'fa-heart-crack');
    // 延迟移除卡片
    setTimeout(function(){
      renderProducts();
      updateTabCount();
    }, 350);
  } else {
    p.fav = true;
    heart.classList.remove('far');
    heart.classList.add('fas','heart-pop');
    heart.style.color = '#FF4D2D';
    showToast('已加入收藏', 'fa-heart');
  }
}

// ===== 更新Tab计数 =====
function updateTabCount(){
  var prodCount = products.filter(function(p){return p.fav;}).length;
  var shopCount = shops.filter(function(s){return s.followed;}).length;
  document.getElementById('tab1').innerHTML = '<i class="fas fa-heart text-[12px] mr-1"></i>收藏商品<span class="tab-count">'+prodCount+'</span>';
  document.getElementById('tab2').innerHTML = '<i class="fas fa-store text-[12px] mr-1"></i>关注店铺<span class="tab-count">'+shopCount+'</span>';
}

// ===== Toast =====
var toastTimer;
function showToast(msg, icon){
  var t = document.getElementById('toast');
  var ic = t.querySelector('i');
  ic.className = 'fas '+(icon||'fa-circle-check');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){t.classList.remove('on');}, 1600);
}

// ===== 工具函数 =====
function formatSold(n){
  if(n>=10000) return (n/10000).toFixed(1)+'万';
  return n;
}

// ===== 初始化 =====
renderProducts();
renderShops();
</script>
