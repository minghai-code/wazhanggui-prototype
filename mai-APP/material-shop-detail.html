<style>
:root{--bg:#FFF7F4}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.no-bar::-webkit-scrollbar{display:none}
.card{transition:transform .16s ease}.card:active{transform:scale(.965)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:400;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:150px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.stab{flex:1;text-align:center;padding:9px 0;font-size:12px;color:#9aa0ac;cursor:pointer;position:relative;transition:.18s}
.stab.on{color:#1F2430;font-weight:800}
.stab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:2px;background:linear-gradient(90deg,#34D399,#059669)}
.h-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}
.h-scroll::-webkit-scrollbar{display:none}
.h-scroll>*{flex:0 0 auto}
.text-grad{background:linear-gradient(90deg,#FF4D2D,#FF2D78);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>

<!-- ===== 店铺头图 ===== -->
<div class="relative overflow-hidden" style="height:180px">

    </div>
  </div>
  <div class="absolute left-4 right-4 bottom-3 flex items-end gap-3">

    <div class="flex-1 min-w-0 pb-0.5">

</div>

<!-- 商户数据卡 -->
<div class="px-3 -mt-2 relative z-10">

      <div><p class="text-[15px] font-bold text-gray-700" id="dOrders">1.2万</p><p class="text-[9px] text-gray-400 mt-0.5">累计成交</p></div>
    </div>
    <div class="flex flex-wrap gap-1.5 mt-3 pt-3 border-t border-gray-50" id="dTags"></div>
  </div>
</div>

<!-- Tab -->
<div class="px-3 mt-2.5">
  <div class="bg-white rounded-2xl shadow-soft flex">
    <div class="stab on" id="tabHome" onclick="switchTab('home')">店铺首页</div>
    <div class="stab" id="tabGoods" onclick="switchTab('goods')">全部商品</div>
    <div class="stab" id="tabIntro" onclick="switchTab('intro')">商户介绍</div>
  </div>
</div>

<!-- ===== 店铺首页 ===== -->
<div id="homeView">

    </div>
  </div>

  <!-- 主营业务 -->

    document.getElementById('goodsBlock').style.display='none';
    document.getElementById('emptyBlock').style.display='';
  }else{
    document.getElementById('goodsBlock').style.display='';
    document.getElementById('emptyBlock').style.display='none';

    cur.goods.slice(0,6).forEach(function(g){
      hh+='<a href="product-detail.html" class="card w-[110px] bg-white rounded-2xl shadow-soft overflow-hidden">'

    sh+='<a href="material-shop-detail.html?id='+s.id+'" class="card w-[130px] bg-white rounded-2xl shadow-soft p-2.5">'
      +'<div class="flex items-center gap-1.5"><div class="w-8 h-8 rounded-lg flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,'+s.color+','+s.color+'CC)"><i class="fas '+s.icon+' text-[10px]"></i></div>'

  });

  document.getElementById('iBiz').innerHTML=
     '<div class="flex justify-between"><span class="text-gray-400">商户名称</span><span class="text-gray-700">诸暨市'+cur.name+'</span></div>'

    +'<div class="flex justify-between"><span class="text-gray-400">入驻时间</span><span class="text-gray-700">'+(2025-cur.years)+' 年</span></div>'

  document.getElementById('iClients').innerHTML=cl;

function renderGoods(){
  if(!cur)return;
  var kw=(document.getElementById('gSearch').value||'').trim().toLowerCase();
  var list=cur.goods.filter(function(g){return !kw||g.n.toLowerCase().indexOf(kw)>-1});
  var html='';
  list.forEach(function(g,i){
    html+='<a href="product-detail.html" class="card bg-white rounded-2xl overflow-hidden shadow-soft fade-up" style="animation-delay:'+(i*.04)+'s">'
      +'<div class="relative"><img src="images/'+g.img+'" class="w-full h-[130px] object-cover">'
      +'<span class="absolute top-1.5 left-1.5 text-white text-[8px] font-bold px-1.5 py-0.5 rounded" style="background:linear-gradient(90deg,#059669,#34D399)">'+cur.cat+'</span></div>'
      +'<div class="p-2">'
      +'<p class="text-[11px] text-gray-800 font-medium leading-tight line-clamp-2" style="height:30px">'+g.n+'</p>'
      +'<div class="flex items-baseline gap-1 mt-1"><span class="text-grad font-bold text-[15px]">¥'+g.p+'</span><span class="text-[9px] text-gray-400">'+g.u+'</span></div>'
      +'<div class="flex items-center justify-between mt-0.5"><span class="text-[9px] text-gray-400">'+g.moq+'</span><span class="text-[9px] text-gray-400">'+g.sold+'</span></div>'
      +'<div class="flex items-center gap-1 mt-1.5 pt-1.5 border-t border-gray-50"><div class="w-3.5 h-3.5 rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,'+cur.color+','+cur.color+'CC)"><i class="fas '+cur.icon+' text-white text-[6px]"></i></div><span class="text-[9px] text-gray-500">'+cur.name+'</span></div>'
      +'</div></a>';
  });
  if(list.length===0)html='<div class="col-span-2 bg-white rounded-2xl shadow-soft py-10 text-center"><i class="fas fa-magnifying-glass text-gray-300 text-xl mb-2"></i><p class="text-[11px] text-gray-400">本店暂无匹配商品</p></div>';
  document.getElementById('gGrid').innerHTML=html;
  document.getElementById('gCount').textContent=list.length;
}

function switchTab(t){
  var h=document.getElementById('homeView'),g=document.getElementById('goodsView'),i=document.getElementById('introView');
  var th=document.getElementById('tabHome'),tg=document.getElementById('tabGoods'),ti=document.getElementById('tabIntro');
  h.style.display='none';g.style.display='none';i.style.display='none';
  th.classList.remove('on');tg.classList.remove('on');ti.classList.remove('on');
  if(t==='home'){h.style.display='';th.classList.add('on')}
  else if(t==='goods'){g.style.display='';tg.classList.add('on')}
  else{i.style.display='';ti.classList.add('on')}
  window.scrollTo(0,0);
}

function callShop(){if(cur)toast('正在呼叫 '+cur.name+' '+cur.tel)}

function toggleFav(){
  faved=!faved;
  document.getElementById('favIcon').className=faved?'fas fa-heart text-sm':'far fa-heart text-sm';
  document.getElementById('favIcon').style.color=faved?'#FF4D2D':'';
  document.getElementById('favIcon2').className=faved?'fas fa-heart text-[14px]':'far fa-heart text-[14px]';
  document.getElementById('favIcon2').style.color=faved?'#FF4D2D':'';
  document.getElementById('favTxt').textContent=faved?'已收藏':'收藏';
  toast(faved?'已收藏该商户，可在「我的-收藏」查看':'已取消收藏');
}
