<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>采购需求详情 - 袜掌柜买家版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
:root{--p:#FF4D2D;--pl:#FF7849;--bg:#FFF7F4;--v1:#7C3AED;--v2:#FF2D78}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
.card{transition:transform .16s ease;cursor:pointer}
.card:active{transform:scale(.965)}
.grad-h{background:linear-gradient(135deg,#FF6B35 0%,#FF4D2D 45%,#FF2D78 100%)}
.shadow-card{box-shadow:0 8px 24px rgba(255,77,45,.14)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.inp{width:100%;background:rgba(248,249,250,.8);border:1px solid rgba(240,240,240,.8);border-radius:12px;padding:11px 13px;font-size:13px;color:#1F2430;outline:none;transition:border-color .16s ease,background .16s ease}
.inp::placeholder{color:#C0C0C0}
.inp:focus{border-color:#FF4D2D;background:#fff}
.lbl{font-size:11px;color:#6b7080;font-weight:500;display:block;margin-bottom:6px}
.lbl b{color:#FF4D2D}
.info-lbl{font-size:11px;color:#6b7080;background:rgba(248,249,250,.9);border-radius:8px;padding:5px 9px;white-space:nowrap}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);min-width:140px;justify-content:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>

<!-- ===== 顶部：渐变 ===== -->
<div class="relative px-4 pt-2 pb-6 overflow-hidden" style="background:linear-gradient(135deg,#FF8A4C 0%,#FF4D2D 40%,#E63E20 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FF8A4C"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FF2D78"></div>
  <div class="absolute -bottom-10 left-12 w-44 h-44 rounded-full blur-3xl opacity-35" style="background:#FF7849"></div>

  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <div class="relative flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="inquiry.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white flex-shrink-0"><i class="fas fa-chevron-left text-sm"></i></a>
      <span class="text-white font-extrabold text-[18px] tracking-wide" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">采购需求详情</span>
    </div>
    <button class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white" onclick="toast('已收藏该需求');this.innerHTML='<i class=\'fas fa-bookmark text-white\'></i>'"><i class="fas fa-bookmark text-sm"></i></button>
  </div>
</div>

<!-- ===== 采购需求内容（顶部） ===== -->
<div class="px-3 -mt-3 relative z-10">
<div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-soft p-3.5 fade-up border border-white">

  <!-- 发布者信息 -->
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2" id="publisherBox"></div>
    <span class="pill" id="statusPill" style="font-size:10px;font-weight:600;padding:3px 8px;border-radius:8px;background:#FFF0E8;color:#FF6B35"><i class="fas fa-clock"></i> 报价中</span>
  </div>

  <!-- 需求标题 -->
  <p class="text-[16px] font-bold text-gray-900 leading-snug" id="dTitle">精梳棉商务男袜 透气防臭</p>
  <p class="text-[12px] text-gray-500 mt-1.5 leading-relaxed" id="dDesc">需16针200针精梳棉，罗口适中，常备两色，交期7天内</p>

  <!-- 需求参数 -->
  <div class="flex gap-1.5 mt-3 flex-wrap" id="dChips"></div>

  <!-- 参考图片（演示） -->
  <div class="mt-3">
    <p class="lbl">需求参考图</p>
    <div class="flex gap-2">
      <div class="w-20 h-20 rounded-xl overflow-hidden card" style="background:linear-gradient(135deg,#FFB88C,#FF8A4C);display:flex;align-items:center;justify-content:center" onclick="toast('查看参考图')"><i class="fas fa-expand text-white text-lg"></i></div>
      <div class="w-20 h-20 rounded-xl overflow-hidden card" style="background:linear-gradient(135deg,#A78BFA,#7C3AED);display:flex;align-items:center;justify-content:center" onclick="toast('查看参考图')"><i class="fas fa-layer-group text-white text-lg"></i></div>
    </div>
  </div>

  <!-- 需求附加信息 -->
  <div class="grid grid-cols-3 gap-2 mt-3">
    <div class="text-center rounded-xl py-2.5" style="background:rgba(248,249,250,.9)"><p class="text-[13px] font-bold text-primary">2小时前</p><p class="text-[9px] text-gray-400 mt-0.5">发布时间</p></div>
    <div class="text-center rounded-xl py-2.5" style="background:rgba(248,249,250,.9)"><p class="text-[13px] font-bold" style="color:#2563EB" id="dNew">8家新</p><p class="text-[9px] text-gray-400 mt-0.5">已有报价</p></div>
    <div class="text-center rounded-xl py-2.5" style="background:rgba(248,249,250,.9)"><p class="text-[13px] font-bold" style="color:#FF2D78">3天</p><p class="text-[9px] text-gray-400 mt-0.5">报价截止</p></div>
  </div>

  <!-- 发布者说明 -->
  <div class="mt-3 rounded-xl p-2.5" style="background:#FFF7F4;border:1px solid #ffede5">
    <p class="text-[11px] font-semibold text-gray-700 mb-1"><i class="fas fa-file-lines mr-1" style="color:#FF6B35"></i>采购方备注</p>
    <p class="text-[11px] text-gray-500 leading-relaxed" id="dNote">本需求量较大，优先考虑源头工厂直供，需支持提供样品打样，报价请包含运费。</p>
  </div>
</div>

<!-- ===== 我的报价单（底部） ===== -->
<div class="px-3 mt-3 relative z-10">
<div class="bg-white/70 backdrop-blur-xl rounded-3xl shadow-soft p-3.5 fade-up border border-white" style="animation-delay:.05s">

<div class="flex items-center gap-2 mb-1">
<div class="w-7 h-7 rounded-xl flex items-center justify-center text-white shadow-soft" style="background:linear-gradient(135deg,#FF8A4C,#FF4D2D)"><i class="fas fa-hand-holding-dollar text-xs"></i></div>
<div>
<p class="text-[13px] font-bold text-gray-800">填写我的报价单</p>
<p class="text-[10px] text-gray-400 mt-0.5" id="quoteHint">为「杭州酷袜商贸」的需求报价，提交后等待确认</p>
</div>
</div>

<div class="grid grid-cols-2 gap-2 mt-2 mb-2.5">
<div>
<label class="lbl">报价单价(元/双) <b>*</b></label>
<input type="text" class="inp" id="fPrice" placeholder="如：3.20">
</div>
<div>
<label class="lbl">供货数量(双) <b>*</b></label>
<input type="number" class="inp" id="fQty" placeholder="如：1000">
</div>
</div>

<div class="grid grid-cols-2 gap-2 mb-2.5">
<div>
<label class="lbl">交期(天)</label>
<select class="inp" style="appearance:none;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22 viewBox=%220 0 10 10%22%3E%3Cpath fill=%22%23999%22 d=%22M2 4l3 3 3-3z%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:right 10px center;padding-right:28px">
<option>3天内</option><option>7天内</option><option>7-15天</option><option>可商议</option>
</select>
</div>
<div>
<label class="lbl">样品支持</label>
<select class="inp" style="appearance:none;background-image:url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2210%22 height=%2210%22 viewBox=%220 0 10 10%22%3E%3Cpath fill=%22%23999%22 d=%22M2 4l3 3 3-3z%22/%3E%3C/svg%3E');background-repeat:no-repeat;background-position:right 10px center;padding-right:28px">
<option>支持打样</option><option>付费打样</option><option>不支持</option>
</select>
</div>
</div>

<div class="mb-3">
<label class="lbl">报价说明</label>
<textarea class="inp" id="fNote" rows="2" placeholder="介绍你的优势：材质、产能、价格说明、是否含运费…" style="resize:none"></textarea>
</div>

<!-- 提交报价按钮 -->
<button class="grad-h w-full py-3 rounded-full text-white text-[15px] font-bold shadow-card" id="submitBtn" onclick="submitQuote()">
<i class="fas fa-paper-plane text-xs mr-1"></i>提交报价
</button>
<p class="text-center text-[10px] text-gray-400 mt-2"><i class="fas fa-shield-halved mr-1" style="color:#10B981"></i>报价将仅采购方可见，成交后会通知你</p>
</div>
</div>

<div class="h-20"></div>

<!-- 底部Tab栏 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:150;width:393px">
<div class="flex justify-around items-center h-full" style="padding-bottom:10px">
<a href="home.html" class="flex flex-col items-center gap-0.5" style="color:#FF4D2D"><i class="fas fa-house text-[18px]"></i><span class="text-[9px] font-semibold">首页</span></a>
<a href="video.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-video text-[18px]"></i><span class="text-[9px]">视频看货</span></a>
<a href="purchase-order.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">进货单</span><span class="absolute top-0 right-1 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">3</span></a>
<a href="property.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-building text-[18px]"></i><span class="text-[9px]">物业</span></a>
<a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
</div>
</div>
<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:151;width:393px;pointer-events:none"><div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div></div>

<!-- 消息提示 -->
<div class="toast" id="toast"><i class="fas fa-circle-check text-[#4ADE80]"></i><span id="toastTxt">操作成功</span></div>

<script>
var DATA={
 1:{name:'精梳棉商务男袜 透气防臭',desc:'需16针200针精梳棉，罗口适中，常备两色，交期7天内',cat:'男袜',qty:'1000双',price:'期望 ¥3.5/双',trader:'杭州酷袜商贸',initial:'杭',color:'linear-gradient(135deg,#3B82F6,#6366F1)',verified:'企业认证 · 2小时前',newc:'8家',note:'本需求量较大，优先考虑源头工厂直供，需支持提供样品打样，报价请包含运费。'},
 2:{name:'竹纤维隐形船袜 防滑不掉跟',desc:'竹纤维材质，女士款，浅口隐形，跟部加硅胶防滑',cat:'女袜',qty:'500双',price:'期望 ¥1.8/双',trader:'上海织语电商',initial:'上',color:'linear-gradient(135deg,#10B981,#059669)',verified:'企业认证 · 5小时前',newc:'12家',note:'常规花色即可，需提供色卡确认，可分批交付。'},
 3:{name:'运动压缩跑步袜 减震防滑',desc:'中帮压缩，足底加厚减震，透气网孔，男女通用',cat:'运动袜',qty:'300双',price:'期望 ¥5.8/双',trader:'广东劲步体育',initial:'广',color:'linear-gradient(135deg,#F59E0B,#D97706)',verified:'企业认证 · 1天前',newc:'4家',note:'优先压缩工艺成熟工厂，需附检测报告。'},
 4:{name:'女士碎花短袜 纯棉透气',desc:'纯棉材抖，碎花图案，春夏款，可分码分色',cat:'女袜',qty:'2000双',price:'期望 ¥2.8/双',trader:'义乌服饰采购',initial:'义',color:'linear-gradient(135deg,#EC4899,#F43F5E)',verified:'个人认证 · 1天前',newc:'2家',note:'量大，需分两个码，可接受分批交付与定金。'},
 5:{name:'棉氨毛巾袜 加厚磨毛',desc:'秋冬保暖，加厚毛巾圈，磨毛处理，居家袜',cat:'功能袜',qty:'800双',price:'期望 ¥6.0/双',trader:'青岛暖意家纺',initial:'青',color:'linear-gradient(135deg,#8B5CF6,#7C3AED)',verified:'企业认证 · 2天前',newc:'6家',note:'深浅两色各半，需耐磨不起球。'}
};
function get(id){return DATA[id]||DATA[1];}
function init(){
  var params=new URLSearchParams(location.search);var id=params.get('id')||'1';var d=get(id);
  document.querySelector('#publisherBox').innerHTML='<div class="w-9 h-9 rounded-full flex items-center justify-center text-white text-[14px] font-bold" style="background:'+d.color+'">'+d.initial+'</div><div><p class="text-[13px] font-bold text-gray-800">'+d.trader+'</p><p class="text-[9px] text-gray-400 mt-0.5">'+d.verified+'</p></div>';
  document.querySelector('#dTitle').textContent=d.name;
  document.querySelector('#dDesc').textContent=d.desc;
  document.querySelector('#dChips').innerHTML='<span class="info-lbl"><i class="fas fa-shapes mr-1 text-gray-300"></i>'+d.cat+'</span><span class="info-lbl"><i class="fas fa-boxes-stacked mr-1 text-gray-300"></i>'+d.qty+'</span><span class="info-lbl"><i class="fas fa-tags mr-1" style="color:#FF4D2D"></i>'+d.price+'</span>';
  document.querySelector('#dNew').textContent=d.newc+'报价';
  document.querySelector('#dNote').textContent=d.note;
  document.querySelector('#quoteHint').textContent='为「'+d.trader+'」的需求报价，提交后等待确认';
}
var toastTimer;
function toast(msg){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=msg;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1600)}
function submitQuote(){
  var p=document.getElementById('fPrice').value,q=document.getElementById('fQty').value;
  if(!p||!q){toast('请填写报价单价与供货数量');return}
  var btn=document.getElementById('submitBtn');
  btn.innerHTML='<i class="fas fa-check text-xs mr-1"></i>报价已提交';btn.style.pointerEvents='none';
  btn.style.background='linear-gradient(135deg,#34D399,#10B981)';
  document.getElementById('toast').querySelector('i').className='fas fa-circle-check text-[#4ADE80]';
  toast('报价提交成功！已通知采购方');
  setTimeout(function(){location.href='inquiry.html'},1500);
}
init();
</script>
</body>
</html>
