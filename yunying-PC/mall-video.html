function goodsInvalid(v){var g=v.goodsId?goodsOf(v.goodsId):null;return !!(g&&g.state!=='在售');}
function pending(v){return v.state==='已上架'&&goodsInvalid(v);}
function fmt(n){return n>=10000?(n/10000).toFixed(1)+'万':n;}

var STATE_STYLE={

  '已驳回':'background:#FEE2E2;color:#B91C1C',
  '已下架':'background:#F1F5F9;color:#94A3B8'
};
function stateTag(s){return '<span class="status-badge" style="'+STATE_STYLE[s]+'">'+s+'</span>';}

function tabs(){
  var all=VIDEOS.length,wait=VIDEOS.filter(function(v){return v.state==='待审核';}).length,
      bad=VIDEOS.filter(pending).length,on=VIDEOS.filter(function(v){return v.state==='已上架';}).length,
      rej=VIDEOS.filter(function(v){return v.state==='已驳回';}).length,
      off=VIDEOS.filter(function(v){return v.state==='已下架';}).length;
  return [['全部',all],['待审核',wait],['待处理',bad],['已上架',on],['已驳回',rej],['已下架',off]];
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=tabs().map(function(t){
    var on=curTab===t[0]?' on':'';
    var red=(t[0]==='待处理'&&t[1]>0)?' style="color:#B91C1C"':'';
    return '<span class="stab'+on+'"'+red+' onclick="pickTab(\''+t[0]+'\')">'+t[0]+' <span class="text-[11px] opacity-70">'+t[1]+'</span></span>';
  }).join('');
}
function pickTab(t){curTab=t;render();}

function filtered(){
  var kw=document.getElementById('f-kw').value.trim().toLowerCase();
  var shop=document.getElementById('f-shop').value,src=document.getElementById('f-source').value,pk=document.getElementById('f-pick').value;
  return VIDEOS.filter(function(v){
    var g=v.goodsId?goodsOf(v.goodsId):null;
    var okTab=curTab==='全部'||(curTab==='待处理'?pending(v):v.state===curTab);
    var okKw=!kw||v.title.toLowerCase().indexOf(kw)>-1||v.shop.toLowerCase().indexOf(kw)>-1||(g&&g.name.toLowerCase().indexOf(kw)>-1);
    var okShop=!shop||v.shop===shop;
    var okSrc=!src||v.source===src;
    var okPick=pk===''||(pk==='1'?!!v.pick:!v.pick);
    return okTab&&okKw&&okShop&&okSrc&&okPick;
  });
}

function goodsCell(v){
  if(!v.goodsId)return '<span class="status-badge" style="background:#F1F5F9;color:#94A3B8">纯内容（未关联商品）</span><div class="text-[10px] text-gray-400 mt-0.5">买家端显示兜底卡</div>';
  var g=goodsOf(v.goodsId);
  if(!g)return '<span class="status-badge" style="background:#FEE2E2;color:#B91C1C">商品已删除</span>';
  var bad=g.state!=='在售';
  return '<div class="text-[12px] font-medium '+(bad?'text-gray-400 line-through':'text-gray-700')+'">'+esc(g.name)+'</div>'
    +'<div class="text-[10px] mt-0.5 '+(bad?'text-red-500':'text-gray-400')+'">¥'+g.price+'/'+g.unit+' · '+esc(g.spec)+(bad?' · <b>商品已下架，需换品</b>':'')+'</div>';

function stateCell(v){
  var h=stateTag(v.state);
  if(pending(v))h+='<div class="text-[10px] mt-0.5" style="color:#B91C1C">待处理：关联商品已失效</div>';
  else if(v.state==='已驳回')h+='<div class="text-[10px] mt-0.5 text-red-500 max-w-[150px] truncate" title="'+esc(v.reject||'')+'">驳回：'+esc(v.reject||'')+'</div>';

  document.getElementById('st-bad').textContent=VIDEOS.filter(pending).length;

function ops(v){
  var a='<span class="lk" onclick="openPreview(\''+v.id+'\')">预览</span>';
  if(v.state==='待审核')return a+' · <span class="lk" onclick="openReview(\''+v.id+'\')">审核</span>';
  if(v.state==='已上架'){

  if(pass){
    if(v.goodsId&&goodsInvalid(v)){toast('关联商品已下架，请先让商户换品或驳回');return;}
    v.state='已上架';v.date='2026-11-04 11:00';
    v.auditBy='admin';v.auditAt='2026-11-04 11:00';v.reject='';
    toast('已通过并上架，买家端可见');
  }else{

    v.auditBy='admin';v.auditAt='2026-11-04 11:00';

      +'<span class="cover" style="background:'+COVERS[v.cover]+';width:96px;height:60px"><i class="fas fa-video"></i><span class="dur">'+v.dur+'</span></span>'
      +'<div class="flex flex-col gap-1.5">'
      +'<label class="text-[12px] text-gray-500 border border-dashed border-gray-300 rounded-lg px-3 py-2 hover:border-primary hover:text-primary cursor-pointer w-fit"><i class="fas fa-cloud-arrow-up mr-1"></i>上传 / 替换视频'
      +'<input type="file" accept="video/*" class="hidden" onchange="pickVideo(this)"></label>'
      +'<button class="text-[11px] text-gray-500 border border-dashed border-gray-300 rounded-lg px-3 py-1.5 hover:border-primary hover:text-primary w-fit" onclick="pickCover()"><i class="fas fa-image mr-1"></i>更换封面</button>'
      +'</div></div>'
      +'<p class="text-[11px] text-gray-400 mt-1.5">mp4 / mov，≤200MB，时长 ≤3 分钟；上传后系统自动转码，<b>转码完成才可提交审核</b>；封面默认取首帧、可自传替换（建议 9:16）；时长自动读取</p></div>'
    +'<div class="mb-4"><label class="fl"><i>*</i>视频标题</label><input id="e-title" class="fi" maxlength="30" value="'+esc(v.title)+'" placeholder="≤30 字，如：防臭透气商务男袜工厂直供"></div>'
    +'<div class="mb-4"><label class="fl">视频描述</label><textarea id="e-desc" rows="3" class="fi" maxlength="100" placeholder="≤100 字，买家端展示 2 行">'+esc(v.desc)+'</textarea></div>'
    +'<div class="mb-4"><label class="fl"><i>*</i>归属店铺</label>'
      +'<select id="e-shop" class="fi" onchange="onShopChange()">'+SHOPS.map(function(s){var cl=shopClosed(s);return '<option value="'+s+'"'+(s===v.shop?' selected':'')+(cl?' disabled':'')+'>'+s+(cl?'（已关闭，不可选）':'')+'</option>';}).join('')+'</select>'
      +'<p class="text-[11px] text-gray-400 mt-1.5">商户账号登录时锁定为本店；店铺关闭后其视频由系统自动下架（不删除）</p></div>'
    +'<div class="mb-4"><label class="fl">关联商品<span class="text-[11px] text-gray-400 font-normal">　一条视频最多 1 个</span></label>'
      +'<div class="flex items-center gap-2">'
      +'<input id="e-goods" class="fi flex-1" readonly style="cursor:pointer;background:#F8FAFC" value="'+(pickGoodsId?esc((goodsOf(pickGoodsId)||{}).name||''):'未关联（纯内容）')+'" onclick="openGoods()">'
      +'<button class="btn btn-ghost" onclick="clearGoods()">清空</button></div>'
      +'<p class="text-[11px] text-gray-400 mt-1.5" id="e-goods-hint">只列所选店铺的在售商品；商户上传必填，平台代发可不填（纯内容走买家端兜底卡）</p></div>'
    +'<div class="mb-4"><label class="fl">品类<span class="text-[11px] text-gray-400 font-normal">　随关联商品自动带入，不可单独修改</span></label>'
      +'<div class="rounded-lg border border-gray-200 px-3 py-2 text-[12px]" style="background:#F8FAFC;color:#64748B" id="e-cat">'+(pickGoodsId?catOf({goodsId:pickGoodsId}):'—（未关联商品，无品类）')+'</div></div>'
    +recordBlock(v)
    +(v.state==='已驳回'&&v.reject?'<div class="rounded-xl border p-3 mt-3" style="border-color:#FECACA;background:#FEF2F2"><p class="text-[11.5px]" style="color:#B91C1C"><i class="fas fa-circle-exclamation mr-1"></i>驳回原因：'+esc(v.reject)+'</p></div>':'')
    +(forGoods?'<div class="rounded-xl border p-3 mt-3" style="border-color:#FDB4A3;background:#FFF6F3"><p class="text-[11.5px]" style="color:#E63E20"><i class="fas fa-arrows-rotate mr-1"></i>换品模式：重新选择在售商品后，视频将回到「待审核」重新过审</p></div>':'');
  var draftLabel=(isNew||v.state==='草稿')?'保存草稿':'保存修改（需重新审核）';
  document.getElementById('drawer-foot').innerHTML=
    '<button class="btn btn-ghost" onclick="closeAll()">取消</button>'
    +'<button class="btn btn-ghost" onclick="saveVideo(0)">'+draftLabel+'</button>'
    +'<button class="btn btn-primary" onclick="saveVideo(1)">提交审核</button>';
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function pickVideo(input){
  if(!input.files[0])return;
  toast('视频已选择：'+input.files[0].name+'（原型不实际上传；真实系统需转码完成后才可提交审核）');
}
function pickCover(){
  toast('选择封面图（建议 9:16 竖版）；不选则默认取视频首帧');
}
/* 操作记录（提交 / 审核 / 下架）：解决"谁审的、为什么下架查不到" */
function recordBlock(v){
  if(!v.submitBy&&!v.auditBy&&!v.offBy)return '';
  var rows=[];
  if(v.submitBy){rows.push(['提交人',esc(v.submitBy)]);rows.push(['提交时间',v.submitAt||'—']);}
  if(v.auditBy){rows.push(['审核人',esc(v.auditBy)]);rows.push(['审核时间',v.auditAt||'—']);}
  if(v.offBy){rows.push(['下架操作',esc(v.offBy)+' · '+(v.offAt||'—')]);}
  return '<div class="mt-3 rounded-xl border border-gray-200 p-3"><p class="text-[11px] text-gray-400 mb-1.5">操作记录（只读）</p>'
    +'<div class="grid grid-cols-2 gap-y-1 text-[11.5px] text-gray-600">'
    +rows.map(function(r){return '<span class="text-gray-400">'+r[0]+'</span><span>'+r[1]+'</span>';}).join('')
    +'</div>'+(v.offReason?'<p class="text-[11px] text-gray-500 mt-1.5">下架原因：'+esc(v.offReason)+'</p>':'')+'</div>';
}
function onShopChange(){
  var s=document.getElementById('e-shop').value;
  pickGoodsShop=s;
  if(pickGoodsId){
    var g=goodsOf(pickGoodsId);
    if(g&&g.shop!==s){pickGoodsId=null;document.getElementById('e-goods').value='未关联（纯内容）';document.getElementById('e-cat').textContent='—（未关联商品，无品类）';toast('归属店铺已变更，原关联商品已清空，请重新选择');}
  }
}
function clearGoods(){
  pickGoodsId=null;
  document.getElementById('e-goods').value='未关联（纯内容）';
  document.getElementById('e-cat').textContent='—（未关联商品，无品类）';
}
function openGoods(){
  var shop=document.getElementById('e-shop').value;
  pickGoodsShop=shop;
  var list=GOODS.filter(function(g){return g.shop===shop&&g.state==='在售';});
  var h='<div class="bg-white rounded-xl w-[520px] max-h-[80vh] overflow-hidden flex flex-col" onclick="stopBubble(event)">'
    +'<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100"><div><h3 class="text-[14px] font-bold text-[#1F2430]">选择关联商品</h3>'
    +'<p class="text-[11px] text-gray-400 mt-0.5">'+esc(shop)+' · 只列在售商品（共 '+list.length+' 个）</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeGoods()"><i class="fas fa-xmark"></i></button></div>'
    +'<div class="flex-1 overflow-y-auto py-2">';
  if(!list.length){h+='<div class="px-5 py-10 text-center text-[12px] text-gray-400">该店铺暂无在售商品，请先到「商品列表」上架商品</div>';}
  list.forEach(function(g){
    h+='<div class="px-5 py-2.5 hover:bg-gray-50 cursor-pointer flex items-center gap-3'+(g.id===pickGoodsId?' bg-orange-50':'')+'" onclick="chooseGoods(\''+g.id+'\')">'
      +'<div class="goods-thumb"><i class="fas fa-image"></i></div>'
      +'<div class="flex-1 min-w-0"><div class="text-[12.5px] text-gray-800 truncate">'+esc(g.name)+'</div>'
      +'<div class="text-[10px] text-gray-400 mt-0.5">'+g.id+' · ¥'+g.price+'/'+g.unit+' · '+esc(g.spec)+' · 品类 '+g.cat+'</div></div>'
      +(g.id===pickGoodsId?'<i class="fas fa-check text-primary text-[12px]"></i>':'')+'</div>';
  });
  h+='</div><div class="px-5 py-3 border-t border-gray-100 flex justify-end"><button class="btn btn-ghost" onclick="closeGoods()">取消</button></div></div>';
  var m=document.getElementById('gmodal');m.innerHTML=h;m.classList.add('on');
}
function chooseGoods(gid){
  pickGoodsId=gid;
  var g=goodsOf(gid);
  document.getElementById('e-goods').value=g.name;
  document.getElementById('e-cat').textContent=g.cat;
  closeGoods();
}
function closeGoods(e){if(e&&e.target&&e.target.id!=='gmodal')return;document.getElementById('gmodal').classList.remove('on');}
function stopBubble(e){if(e&&e.stopPropagation)e.stopPropagation();}

function saveVideo(submit){
  var title=document.getElementById('e-title').value.trim();
  var desc=document.getElementById('e-desc').value.trim();
  var shop=document.getElementById('e-shop').value;
  if(!title){toast('请填写视频标题');return;}
  var isNew=editId==='new';
  var v=isNew?null:VIDEOS.filter(function(x){return x.id===editId;})[0];
  var src=isNew?'平台代发':v.source;
  if(shopClosed(shop)){toast('该店铺已关闭，不能新增或编辑其视频');return;}
  if(submit&&src==='商户上传'&&!pickGoodsId){toast('商户上传的视频必须关联 1 个本店在售商品');return;}
  if(pickGoodsId){
    var g=goodsOf(pickGoodsId);
    if(!g||g.state!=='在售'){toast('关联商品不在售，请重新选择');return;}
    if(g.shop!==shop){toast('关联商品不属于所选店铺，请重新选择');return;}
  }
  if(isNew){
    var n=VIDEOS.length+1;
    VIDEOS.unshift({id:'VD-'+String(n).padStart(4,'0'),title:title,desc:desc,dur:'00:00',shop:shop,source:'平台代发',goodsId:pickGoodsId,pick:false,
      state:submit?'待审核':'草稿',date:submit?'2026-11-04 11:20':'—',
      submitBy:submit?'运营（admin，平台代发）':'',submitAt:submit?'2026-11-04 11:20':'',
      plays:0,likes:0,favs:0,shares:0,cover:'a'});
    toast(submit?'已创建并提交审核（来源：平台代发）':'已保存草稿');
  }else{
    var wasBad=v.goodsId&&goodsInvalid(v);
    v.title=title;v.desc=desc;v.shop=shop;v.goodsId=pickGoodsId;
    if(submit||v.state==='已上架'){
      /* 已上架视频一旦被修改（含换品），必须重新审核：先下架回待审核，避免未审核内容外露 */
      var reopen=v.state==='已上架';
      v.state='待审核';v.date='2026-11-04 11:20';v.pick=false;v.reject='';v.offReason='';v.offBy='';v.offAt='';
      v.submitBy=v.source==='平台代发'?'运营（admin，平台代发）':('商户（'+v.shop+'）');
      v.submitAt='2026-11-04 11:20';
      toast(reopen?'已上架视频修改后需重新审核，已转「待审核」（买家端暂时不可见）':(wasBad&&pickGoodsId?'已换品并重新提交审核':'已提交审核，待平台审核'));
    }else{
      toast('已保存草稿');
    }
  }
  closeAll();render();
}

function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('pv').classList.remove('on');
  closeGoods();
}

/* 店铺关闭联动：店铺列表里状态为「已关闭」的店铺，其视频由系统自动下架（不删除、留原因）
   恢复路径：店铺重新开启后，由运营逐条「重新上架」（需复审） */
(function closedShopOffShelf(){
  var hit=[];
  VIDEOS.forEach(function(v){
    if(shopClosed(v.shop)&&v.state==='已上架'){
      v.state='已下架';v.pick=false;
      v.offReason='店铺已关闭，系统自动下架';
      v.offBy='系统';v.offAt='2026-11-04 08:00';
      hit.push(v.id);
    }
  });
  window.__closedHit=hit.length;
})();

render();
if(window.__closedHit){
  setTimeout(function(){toast(window.__closedHit+' 条视频因所属店铺已关闭，已自动下架（恢复需店铺重新开启并逐条复审上架）');},700);
}
</script>
