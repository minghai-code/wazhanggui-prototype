function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function p2(n){return (n<10?'0':'')+n;}
function fmtDate(d){return d.slice(5).replace('-','/');}
function days(signStart,signEnd){

  var a=new Date(signStart+'T00:00:00'),b=new Date(signEnd+'T00:00:00');
  var n=Math.min(7,Math.max(1,Math.round((b-a)/86400000)+1));
  var out=[];
  for(var i=0;i<n;i++){var d=new Date(a.getTime()+i*86400000);out.push(p2(d.getMonth()+1)+'/'+p2(d.getDate()));}
  return out;
}
/* 演示用趋势：按报名期天数生成，峰值落在前半段 */
function trend(a){
  var n=Math.min(7,Math.max(1,Math.round((new Date(a.signEnd)-new Date(a.signStart))/86400000)+1));
  var total=a.pending+a.passed;
  var w=[],s=0;
  for(var i=0;i<n;i++){var v=Math.max(1,Math.round(Math.sin((i+1)/(n+1)*Math.PI)*10)+1);w.push(v);s+=v;}
  var out=w.map(function(x){return Math.round(total*x/s);});
  return out;
}

    +'</div></div>';

  /* 状态提示条（只在与常规流程不同时出现） */
  if(isPending){h+='<div class="note mb-3" style="background:#FFFBEB;border:1px solid #FDE68A;color:#B45309"><i class="fas fa-clock mr-1"></i>该活动待运营审批，<b>审批通过前商户端不可见、不可报名</b>。</div>';}
  if(isRejected){h+='<div class="note mb-3" style="background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C"><i class="fas fa-circle-xmark mr-1"></i><b>已驳回</b>：'+esc(a.rejectReason)+'<br>商户修改后重新提交，编号不变、版本 +1。</div>';}
  if(isCanceled){h+='<div class="note mb-3" style="background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C"><i class="fas fa-ban mr-1"></i>'+esc(a.cancelReason)+'</div>';}
  if(isOffline){h+='<div class="note mb-3" style="background:#FFFBEB;border:1px solid #FDE68A;color:#B45309"><i class="fas fa-eye-slash mr-1"></i>'+esc(a.offlineReason)+'</div>';}
  if(isDraft){h+='<div class="note mb-3" style="background:#F8FAFC;border:1px solid #E2E8F0;color:#64748B"><i class="fas fa-pen-to-square mr-1"></i>草稿状态：尚未发布，无报名与统计。</div>';}

  /* 指标卡：按状态给不同四张，避免"未开始却显示签到率 0%"这类误读 */
  var cards=[];
  if(isBefore||isSigning||isDraft){
    cards=[['详情曝光',hasStat?(a.pv+' PV'):'—','#7C3AED'],
           ['已占位',hasStat?hold:'—','#E63E20'],
           ['余量',hasStat?Math.max(0,a.quota-hold):'—','#15803D'],
           ['报名进度',hasStat?(a.quota?Math.round(hold/a.quota*100)+'%':'—'):'—','#0891B2']];
  }else if(isRunning||isEnd){
    cards=[['应到（已通过）',a.passed,'#15803D'],
           ['已签到',a.checked,'#1D4ED8'],
           ['签到率',signRate,'#0891B2'],
           [isEnd?'爽约':'未签到',isEnd?miss:notChecked,isEnd?'#991B1B':'#B45309']];
  }else{
    cards=[['报名人数',hold,'#E63E20'],['已取消',a.canceled,'#94A3B8'],['已驳回',a.rejected,'#B91C1C'],['详情曝光',a.pv+' PV','#7C3AED']];
  }
  h+='<div class="grid grid-cols-4 gap-3 mb-3">'+cards.map(function(c){
    return '<div class="bg-white rounded-xl border border-gray-100 p-3.5"><p class="text-[11px] text-gray-400">'+c[0]+'</p><p class="text-[19px] font-bold mt-1" style="color:'+c[2]+'">'+c[1]+'</p></div>';
  }).join('')+'</div>';

  h+='<div class="grid grid-cols-3 gap-4">';
  h+='<div class="col-span-2">';

  /* 基本信息 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-circle-info text-[#2563EB]"></i>基本信息</div>'
    +'<div class="grid grid-cols-2">'
    +'<div class="kv"><span class="k">活动类型</span><span>'+a.type+'</span></div>'
    +'<div class="kv"><span class="k">主办方</span><span>'+(a.owner==='商户'?esc(a.merchant):'平台自办')+'</span></div>'
    +'<div class="kv"><span class="k">报名时间</span><span>'+a.signStart+' ~ '+a.signEnd+'</span></div>'
    +'<div class="kv"><span class="k">活动时间</span><span>'+a.start+' ~ '+a.end+'</span></div>'
    +'<div class="kv"><span class="k">活动地点</span><span>'+esc(a.place)+'</span></div>'
    +'<div class="kv"><span class="k">名额</span><span>'+a.quota+'（已占位 '+hold+'，余 '+Math.max(0,a.quota-hold)+'）</span></div>'
    +'<div class="kv"><span class="k">报名审核</span><span>'+(a.needAudit?'需要审核':'免审核（提交即通过）')+'</span></div>'
    +'<div class="kv"><span class="k">签到窗</span><span>'+a.ckWindow+'</span></div>'
    +'</div></div>';

  /* 报名漏斗：口径一次说清（占位 / 不占位分开） */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-filter text-[#E63E20]"></i>报名漏斗<span class="r">已占位 = 待审核 + 已通过</span></div>';
  h+='<div class="funnel">'
    +'<div class="fstep"><span class="fl">详情曝光</span><span class="fv">'+a.pv+'</span><span class="fs">PV</span></div>'
    +'<div class="farrow">↓ 报名转化率 '+(a.pv?(hold/a.pv*100).toFixed(1):'0.0')+'%</div>'
    +'<div class="fstep"><span class="fl">已占位</span><span class="fv" style="color:#E63E20">'+hold+'</span><span class="fs">待审核 '+a.pending+'　已通过 '+a.passed+'</span></div>';
  if(isRunning||isEnd){
    h+='<div class="farrow">↓ 签到率 '+(isEnd?signRate+'（已结算）':signRate+'（进行中）')+'</div>'
      +'<div class="fstep"><span class="fl">已签到</span><span class="fv" style="color:#1D4ED8">'+a.checked+'</span><span class="fs">'+(isEnd?'爽约 '+miss+'（已结算）':'未签到 '+notChecked)+'</span></div>';
  }
  h+='</div>'
    +'<div class="text-[11px] text-[#94A3B8] mt-2.5">'
    +'<i class="fas fa-circle-info mr-1"></i>已取消 <b class="text-gray-600">'+a.canceled+'</b> 条、已驳回 <b class="text-gray-600">'+a.rejected+'</b> 条<b>不占名额</b>，故不计入已占位；'
    +(isEnd?'爽约已在活动结束后 24h 结算，可手工修正。':'活动未开始时不计签到率与爽约。')
    +'</div></div>';

  /* 报名与签到记录（最近 5 条摘要 + 全量入口，解决"独立菜单不知道看哪一场"） */
  var rs=SIGN.filter(function(x){return x.actId===a.id;});
  var rsSign=rs.slice(0,5);
  var rsCk=rs.filter(function(x){return x.ck==='已签到';}).slice(0,5);
  var AUD={'待审核':'background:#FEF3C7;color:#B45309','已通过':'background:#DCFCE7;color:#15803D','已驳回':'background:#FEE2E2;color:#B91C1C','已取消':'background:#F1F5F9;color:#64748B'};
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-clipboard-user text-[#15803D]"></i>报名与签到记录<span class="r">各自仅显示最近 5 条</span></div>';
  /* 报名 */
  h+='<div class="text-[11.5px] text-[#64748B] mb-1.5"><b>报名</b>　已占位 '+hold+' 条（待审核 '+a.pending+' / 已通过 '+a.passed+'）</div>';
  if(!rsSign.length){
    h+='<div class="text-[11.5px] text-[#94A3B8] py-3">'+(isDraft||isPending||isBefore?'活动未上架或未开始报名，暂无记录':'暂无报名记录')+'</div>';
  }else{
    h+='<table class="w-full text-[12px]"><thead><tr class="text-[10.5px] text-gray-400"><th class="text-left py-1 font-normal">姓名</th><th class="text-left py-1 font-normal">商户</th><th class="text-center py-1 font-normal">同行</th><th class="text-left py-1 font-normal">来源</th><th class="text-left py-1 font-normal">审核</th><th class="text-right py-1 font-normal">提交时间</th></tr></thead><tbody>';
    rsSign.forEach(function(x){
      h+='<tr class="border-t border-gray-50"><td class="py-1.5 font-medium text-gray-700">'+esc(x.name)+'</td>'
        +'<td class="py-1.5 text-gray-600">'+esc(x.org)+'</td>'
        +'<td class="py-1.5 text-center text-gray-500">'+(x.comp?'+'+x.comp:'—')+'</td>'
        +'<td class="py-1.5"><span class="st" style="'+(x.src==='现场'?'background:#EDE9FE;color:#6D28D9':'background:#F1F5F9;color:#64748B')+'">'+x.src+'</span></td>'
        +'<td class="py-1.5"><span class="st" style="'+AUD[x.audit]+'">'+x.audit+'</span></td>'
        +'<td class="py-1.5 text-right text-gray-400 text-[11px]">'+x.at+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  /* 签到 */
  h+='<div class="text-[11.5px] text-[#64748B] mt-3 mb-1.5"><b>签到</b>　已签到 '+a.checked+' 人'+(isRunning?'（进行中，未签到 '+notChecked+'）':isEnd?'（爽约 '+miss+'）':'')+'</div>';
  if(!rsCk.length){
    h+='<div class="text-[11.5px] text-[#94A3B8] py-3">'+(isRunning||isEnd?'暂无签到记录':'活动开始后才产生签到记录')+'</div>';
  }else{
    h+='<table class="w-full text-[12px]"><thead><tr class="text-[10.5px] text-gray-400"><th class="text-left py-1 font-normal">姓名</th><th class="text-left py-1 font-normal">商户</th><th class="text-left py-1 font-normal">签到时间</th><th class="text-left py-1 font-normal">方式</th></tr></thead><tbody>';
    rsCk.forEach(function(x){
      h+='<tr class="border-t border-gray-50"><td class="py-1.5 font-medium text-gray-700">'+esc(x.name)+'</td>'
        +'<td class="py-1.5 text-gray-600">'+esc(x.org)+'</td>'
        +'<td class="py-1.5 text-gray-500">'+x.ckAt+'</td>'
        +'<td class="py-1.5"><span class="st" style="'+(x.way==='手工'?'background:#FEF3C7;color:#B45309':'background:#DBEAFE;color:#1D4ED8')+'">'+x.way+'</span></td></tr>';
    });
    h+='</tbody></table>';
  }
  /* 全量入口 */
  h+='<div class="flex gap-2 mt-3 pt-3 border-t border-gray-50">'
    +'<button class="btn btn-ghost" onclick="location.href=\'activity-signup.html?id='+a.id+'\'">查看全部报名（'+hold+'）<i class="fas fa-chevron-right text-[9px] ml-1"></i></button>'
    +(isRunning||isEnd?'<button class="btn btn-ghost" onclick="location.href=\'activity-checkin.html?id='+a.id+'\'">进入签到台（'+a.checked+'/'+a.passed+'）<i class="fas fa-chevron-right text-[9px] ml-1"></i></button>':'')
    +'</div></div>';

  /* 趋势 */
  var tr=trend(a),labels=days(a.signStart,a.signEnd),mx=Math.max.apply(null,tr)||1;
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-chart-column text-[#FF4D2D]"></i>报名趋势<span class="r">'+a.signStart+' 起，按日</span></div>'
    +'<div class="bar">'+tr.map(function(v,i){
        return '<div><span class="text-[10px] text-gray-400">'+v+'</span><i style="height:'+Math.max(3,v/mx*70)+'px"></i><span class="text-[10px] text-gray-300">'+(labels[i]||'')+'</span></div>';
      }).join('')+'</div></div>';

  /* 正文 + 须知（让详情页"看得到商户端看到的东西"） */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-align-left text-[#7C3AED]"></i>活动详情（对外展示）</div>'
    +'<p class="text-[12.5px] font-medium text-gray-700 mb-2">'+esc(a.brief)+'</p>'
    +'<div class="text-[12px] text-gray-600" style="white-space:pre-wrap;line-height:1.95">'+esc(a.detail)+'</div>'
    +'<div class="mt-3 pt-3 border-t border-gray-50"><p class="text-[11px] text-gray-400 mb-1">报名须知</p><p class="text-[12px] text-gray-600" style="white-space:pre-wrap">'+esc(a.notice)+'</p></div>'
    +'</div>';
  h+='</div>';

  /* 右栏 */
  h+='<div>';
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-route text-[#0891B2]"></i>当前阶段</div>'
    +'<div class="kv"><span class="k">状态</span><span><span class="st" style="'+ST[s]+'">'+s+'</span></span></div>'
    +'<div class="kv"><span class="k">下一步</span><span>'+nextStep(s,a)+'</span></div>'
    +'<div class="kv"><span class="k">展示位置</span><span>商户端 · 物业服务 → 活动参与</span></div>'
    +'<div class="kv"><span class="k">买家端</span><span class="text-gray-400">不展示（文旅归 14）</span></div></div>';

  h+='<div class="blk"><div class="blk-t"><i class="fas fa-clock-rotate-left text-[#7C3AED]"></i>操作日志</div>'
    +'<div class="tl">'+logs(a).map(function(l){
        return '<div class="tli"><div class="text-[10.5px] text-gray-400">'+l.t+'</div><div>'+esc(l.txt)+'</div></div>';
      }).join('')+'</div></div>';
  h+='</div></div>';

  root.innerHTML=h;
}

function nextStep(s,a){
  var m={'草稿':'编辑完成后提交发布','待审批':'运营审批（通过后商户端可见）','已驳回':'商户修改后重提',
    '未开始':'等到 '+a.signStart+' 开放报名','报名中':a.signEnd+' 截止报名','待开始':'等到 '+a.start+' 开始活动',
    '进行中':'现场核销签到','已结束':'已结束（统计固化，可复制新建）','已取消':'已取消（可复制新建）','已下架':'运营上架后恢复可见'};
  return m[s]||'—';
}
function logs(a){
  var s=a.status,out=[];
  if(s!=='草稿'){out.push({t:a.signStart+' 00:00',txt:'活动发布并上架'});}
  if(s==='报名中'||s==='待开始'||s==='进行中'||s==='已结束'){
    out.push({t:a.signStart+' 09:00',txt:'报名开始，商户端「活动参与」可见'});
  }
  if(s==='进行中'||s==='已结束'){out.push({t:a.start+' 00:00',txt:'活动开始，签到窗开放'});}
  if(s==='已结束'){
    out.push({t:a.end+' 00:00',txt:'活动结束，签到窗关闭'});
    out.push({t:'结束 +24h',txt:'爽约结算：未签到 '+(a.passed-a.checked)+' 人置「爽约」'});
  }
  if(s==='已取消'){out.push({t:'—',txt:'运营取消活动，已通知 '+a.passed+' 名已报名商户'});}
  if(s==='已驳回'){out.push({t:'—',txt:'运营驳回：'+a.rejectReason});}
  if(s==='已下架'){out.push({t:'—',txt:'系统下架：'+a.offlineReason});}
  if(!out.length){out.push({t:'—',txt:'暂无操作记录'});}
  return out;
}

render();
</script>
</body>
</html>
