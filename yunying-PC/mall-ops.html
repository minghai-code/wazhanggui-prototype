<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城运营 - 商品管理</title>
<!-- Tailwind 静态样式：本地引用（不再依赖 cdn.tailwindcss.com）；改动页面后重新构建见 wazhanggui-code/_tw-build/README.md -->
<link rel="stylesheet" href="tailwind.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f1f5f9}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.tab-active{color:#FF4D2D;border-bottom:2px solid #FF4D2D;font-weight:600}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
button{cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<div class="p-6">

  <!-- 页面标题 -->
  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[18px] font-bold text-gray-800">商品管理</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">10 商城运营 · 商品管理</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-0.5">外采商品管理菜单（商品分类 / 品牌 / 商品分组 / 评价 / 服务 / 批量操作 / 库存管理 / 商品询价…）均以外采为准；本次改造 <b>「新增商品」</b> 与 <b>「商品自动审核」</b> 两处</p>
    </div>
    <div class="flex items-center gap-2">
      <a href="mall-product-audit.html" class="px-3 py-2 rounded-lg text-[12px] font-semibold text-[#E63E20] bg-white border" style="border-color:#FDB4A3"><i class="fas fa-shield-halved mr-1"></i>商品审核中心（本次新增）</a>
      <a href="mall-product-add.html" class="px-4 py-2 rounded-lg text-[12px] font-semibold text-white" style="background:linear-gradient(135deg,#FF7849,#FF4D2D)"><i class="fas fa-plus mr-1"></i>新增商品（本次修改点）</a>
    </div>
  </div>

  <!-- 统计卡片（审核段为本次新增改造） -->
  <div class="grid grid-cols-5 gap-3 mb-5">
    <div class="bg-white rounded-lg border border-gray-100 p-3.5">
      <p class="text-[11px] text-gray-400">待机审</p>
      <p class="text-xl font-bold text-sky-600 mt-1">1</p>
    </div>
    <div class="bg-white rounded-lg border border-gray-100 p-3.5">
      <p class="text-[11px] text-gray-400">待人审<span class="text-[10px] text-red-500 ml-1">超时 1</span></p>
      <p class="text-xl font-bold text-primary mt-1">3</p>
    </div>
    <div class="bg-white rounded-lg border border-gray-100 p-3.5">
      <p class="text-[11px] text-gray-400">机审拦截</p>
      <p class="text-xl font-bold text-red-500 mt-1">1</p>
    </div>
    <div class="bg-white rounded-lg border border-gray-100 p-3.5">
      <p class="text-[11px] text-gray-400">本月通过</p>
      <p class="text-xl font-bold text-green-500 mt-1">156</p>
    </div>
    <div class="bg-white rounded-lg border border-gray-100 p-3.5">
      <p class="text-[11px] text-gray-400">本月驳回</p>
      <p class="text-xl font-bold text-gray-500 mt-1">17</p>
    </div>
  </div>

  <!-- 筛选栏 -->
  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <div class="relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input id="kw" type="text" placeholder="商品编号 / 商品名称 / 商户" class="w-56 pl-8 pr-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary focus:bg-white transition">
      </div>
      <select id="cat" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部品类</option>
        <option>男袜</option>
        <option>女袜</option>
        <option>童袜</option>
        <option>运动袜</option>
        <option>原料</option>
        <option>袜机</option>
      </select>
      <select id="st" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部审核状态</option>
        <option value="pending_machine">待机审</option>
        <option value="machine_blocked">机审拦截</option>
        <option value="pending_manual">待人审</option>
        <option value="passed">已通过</option>
        <option value="rejected">已驳回</option>
        <option value="needfix">需修改</option>
      </select>
      <input type="date" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
      <span class="text-gray-300 text-xs">至</span>
      <input type="date" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
      <button class="px-4 py-1.5 text-[13px] text-white rounded-lg" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)" onclick="doSearch()">查询</button>
      <button class="px-4 py-1.5 text-[13px] text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition" onclick="resetSearch()">重置</button>
    </div>
  </div>

  <!-- 表格 -->
  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center gap-2 flex-wrap">
      <button class="px-3 py-1.5 text-[12px] text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition" onclick="toast('已导出当前列表（原型）')"><i class="fas fa-download text-[10px] mr-1"></i>导出</button>
      <button class="px-3 py-1.5 text-[12px] text-white rounded-lg transition" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)" onclick="goAuditPage('rule')"><i class="fas fa-shield-halved text-[10px] mr-1"></i>审核规则与词库</button>
      <span class="text-[11px] text-gray-400"><i class="fas fa-circle-info mr-1"></i>审核链路为本次新增：机器初筛（敏感词 + 敏感图）→ 人工判定；外采商品字段不变</span>
    </div>
    <table class="w-full text-[13px]">
      <thead>
        <tr class="bg-gray-50 text-gray-500 text-[12px]">
          <th class="px-4 py-3 text-left font-medium">商品编号</th>
          <th class="px-4 py-3 text-left font-medium">商品名称</th>
          <th class="px-4 py-3 text-left font-medium">提交商户</th>
          <th class="px-4 py-3 text-left font-medium">品类</th>
          <th class="px-4 py-3 text-left font-medium">提交时间</th>
          <th class="px-4 py-3 text-left font-medium">机审结论（新增）</th>
          <th class="px-4 py-3 text-left font-medium">审核状态</th>
          <th class="px-4 py-3 text-center font-medium">操作</th>
        </tr>
      </thead>
      <tbody id="tb" class="divide-y divide-gray-50"></tbody>
    </table>
    <!-- 分页 -->
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <span class="text-[12px] text-gray-400" id="pageInfo">共 86 条记录，第 1-8 条</span>
      <div class="flex items-center gap-1">
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="toast('已是第一页')"><i class="fas fa-chevron-left text-[10px]"></i></button>
        <button class="w-7 h-7 flex items-center justify-center text-white text-[12px] rounded" style="background:#FF4D2D" onclick="pageGo(1)">1</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-600 text-[12px] rounded hover:bg-gray-100" onclick="pageGo(2)">2</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-600 text-[12px] rounded hover:bg-gray-100" onclick="pageGo(3)">3</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="pageGo(2)"><i class="fas fa-chevron-right text-[10px]"></i></button>
      </div>
    </div>
  </div>

</div>

<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[70]"></div>

<script>
/* ================= 列表数据（原型态 mock） ================= */
var ROWS=[
  {id:'SP20261109021',name:'冰丝无痕男士平角袜（10双装）',shop:'大唐袜业旗舰',cat:'男袜',time:'2026-11-09 09:12',state:'pending_manual',m:{r:'pass',s:8,n:0}},
  {id:'SP20261109018',name:'暖足坊加厚羊毛袜（东北特供）',shop:'暖足坊袜业有限公司',cat:'男袜',time:'2026-11-08 08:40',state:'pending_manual',m:{r:'warn',s:62,n:3}},
  {id:'SP20261109015',name:'花间舞隐形船袜（裸感冰丝）',shop:'花间舞袜业',cat:'女袜',time:'2026-11-09 08:05',state:'pending_manual',m:{r:'warn',s:71,n:1}},
  {id:'SP20261109009',name:'极速运动压缩袜（马拉松款）',shop:'极速运动袜业',cat:'运动袜',time:'2026-11-09 09:26',state:'pending_machine',m:{r:'wait',s:0,n:0}},
  {id:'SP20261109006',name:'仿真枪型袜类礼盒（创意装）',shop:'某商贸有限公司',cat:'男袜',time:'2026-11-09 07:48',state:'machine_blocked',m:{r:'block',s:96,n:2}},
  {id:'SP20261108011',name:'绿源竹纤维抗菌童袜（A 类）',shop:'绿源纤维科技有限公司',cat:'童袜',time:'2026-11-08 10:20',state:'passed',m:{r:'pass',s:6,n:0}},
  {id:'SP20261108007',name:'某品牌同款运动袜（无授权）',shop:'某商贸有限公司',cat:'运动袜',time:'2026-11-08 09:02',state:'rejected',m:{r:'warn',s:74,n:2}},
  {id:'SP20260711003',name:'极速运动压缩袜',shop:'极速运动袜业',cat:'运动袜',time:'2026-07-11 14:20',state:'needfix',m:{r:'pass',s:9,n:0}},
  {id:'SP20260710004',name:'大唐旗舰精梳棉男袜',shop:'大唐袜业旗舰',cat:'男袜',time:'2026-07-10 11:08',state:'passed',m:{r:'pass',s:6,n:0}}
];
var ICONS=[
  {bg:'linear-gradient(135deg,#FBBF24,#F59E0B)',ic:'fa-snowflake'},
  {bg:'linear-gradient(135deg,#FB7185,#EC4899)',ic:'fa-socks'},
  {bg:'linear-gradient(135deg,#38BDF8,#3B82F6)',ic:'fa-bolt'},
  {bg:'linear-gradient(135deg,#FF8A4C,#FF4D2D)',ic:'fa-crown'},
  {bg:'linear-gradient(135deg,#2DD4BF,#14B8A6)',ic:'fa-leaf'},
  {bg:'linear-gradient(135deg,#9CA3AF,#6B7280)',ic:'fa-box'},
  {bg:'linear-gradient(135deg,#A78BFA,#7C3AED)',ic:'fa-gears'},
  {bg:'linear-gradient(135deg,#34D399,#10B981)',ic:'fa-seedling'},
  {bg:'linear-gradient(135deg,#F43F5E,#BE123C)',ic:'fa-gift'}
];
/* 审核状态 / 机审结论（本次新增改造，取值与 mall-product-audit.html 一致） */
var ST={
  pending_machine:{t:'待机审',bg:'background:#E0F2FE;color:#0369A1'},
  machine_blocked:{t:'机审拦截',bg:'background:#FEE2E2;color:#B91C1C'},
  pending_manual:{t:'待人审',bg:'background:#FEF3C7;color:#B45309'},
  passed:{t:'已通过',bg:'background:#DCFCE7;color:#15803D'},
  rejected:{t:'已驳回',bg:'background:#FEE2E2;color:#B91C1C'},
  needfix:{t:'需修改',bg:'background:#DBEAFE;color:#2563EB'}
};
var MR={wait:{t:'机审中',bg:'background:#E0F2FE;color:#0369A1'},pass:{t:'通过',bg:'background:#DCFCE7;color:#15803D'},warn:{t:'警示·转人工',bg:'background:#FEF3C7;color:#B45309'},block:{t:'拦截',bg:'background:#FEE2E2;color:#B91C1C'}};
function scoreColor(s){return s>=80?'#B91C1C':(s>=50?'#B45309':'#15803D');}
function goAuditPage(kind,id){
  location.href=kind==='rule'?'mall-product-audit.html?tab=rule':('mall-product-audit.html'+(id?'?aid='+encodeURIComponent(id):''));
}
/* 详情 / 编辑统一进商品页（阶梯价与拼单开关在此维护）；?id= 进入编辑态 */
function goEdit(id){ location.href='mall-product-add.html?id='+encodeURIComponent(id); }
/* 审核结论回写（B2）：mall-product-audit.html 人审通过/驳回后写 sh_mall_goods_state_v1，
   本页加载时合并到同一批商品，保证「审核通过 → 列表状态变已通过」可演示 */
function syncAuditState(){
  try{
    var m=JSON.parse(localStorage.getItem('sh_mall_goods_state_v1')||'{}');
    ROWS.forEach(function(r){
      var s=m[r.id]; if(!s) return;
      r.state=s;
      if(s==='passed'){ r.m={r:'pass',s:(r.m&&r.m.s)||0,n:0}; }
    });
  }catch(e){}
}
syncAuditState();
var curRows=ROWS.slice();
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},2200);}

function render(){
  document.getElementById('tb').innerHTML=curRows.map(function(r,i){
    var ic=ICONS[ROWS.indexOf(r)]||ICONS[0];
    var st=ST[r.state]||ST.needfix,mr=MR[r.m.r]||MR.wait;
    var ops='<button class="text-gray-400 text-[12px] hover:text-gray-600" onclick="goEdit(\''+r.id+'\')">详情</button>';
    if(r.state==='pending_manual'){ops='<button class="text-primary text-[12px] hover:underline mr-2" onclick="goAuditPage(\'audit\',\''+r.id+'\')">审核</button>'+ops;}
    else if(r.state==='machine_blocked'){ops='<button class="text-red-500 text-[12px] hover:underline mr-2" onclick="goAuditPage(\'audit\',\''+r.id+'\')">复核</button>'+ops;}
    else if(r.state==='pending_machine'){ops='<button class="text-sky-600 text-[12px] hover:underline mr-2" onclick="goAuditPage(\'audit\',\''+r.id+'\')">查看机审</button>'+ops;}
    else if(r.state==='rejected'){ops='<button class="text-gray-500 text-[12px] hover:underline mr-2" onclick="toast(\'查看驳回原因：'+r.id+'（人工判定结果，见审核留痕）\')">驳回原因</button>'+ops;}
    else if(r.state==='needfix'){ops='<button class="text-gray-500 text-[12px] hover:underline mr-2" onclick="toast(\'商户修改中：'+r.id+'\')">查看</button>'+ops;}
    ops='<button class="text-[12px] text-[#475569] hover:underline mr-2" onclick="goEdit(\''+r.id+'\')" title="维护阶梯价与拼单开关（运营纠错）">编辑</button>'+ops;
    return '<tr class="hover:bg-gray-50 transition">'
      +'<td class="px-4 py-3 text-gray-600">'+r.id+'</td>'
      +'<td class="px-4 py-3"><div class="flex items-center gap-2">'
      +'<div class="w-7 h-7 rounded-lg flex items-center justify-center text-white text-[10px]" style="background:'+ic.bg+'"><i class="fas '+ic.ic+'"></i></div>'
      +'<span class="font-medium text-gray-800">'+r.name+'</span></div></td>'
      +'<td class="px-4 py-3 text-gray-600">'+r.shop+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+r.cat+'</td>'
      +'<td class="px-4 py-3 text-gray-400">'+r.time+'</td>'
      +'<td class="px-4 py-3"><div class="flex items-center gap-1.5"><span class="status-badge" style="'+mr.bg+'">'+mr.t+'</span>'
        +(r.m.r==='wait'?'':'<span class="text-[11px] font-semibold" style="color:'+scoreColor(r.m.s)+'">'+r.m.s+'</span>')
        +(r.m.n?'<span class="text-[10px] text-gray-400">'+r.m.n+' 项命中</span>':'')+'</div></td>'
      +'<td class="px-4 py-3"><span class="status-badge" style="'+st.bg+'">'+st.t+'</span></td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'+ops+'</td></tr>';
  }).join('')||'<tr><td colspan="8" class="px-4 py-14 text-center text-gray-300 text-[12px]">暂无数据</td></tr>';
  document.getElementById('pageInfo').textContent='共 '+curRows.length+' 条记录，第 1-'+curRows.length+' 条';
}
function doSearch(){
  var kw=document.getElementById('kw').value.trim(),cat=document.getElementById('cat').value,st=document.getElementById('st').value;
  curRows=ROWS.filter(function(r){
    return (!kw||r.name.indexOf(kw)>-1||r.id.indexOf(kw)>-1||r.shop.indexOf(kw)>-1)&&(!cat||r.cat===cat)&&(!st||r.state===st);
  });
  render();toast('已按条件查询，共 '+curRows.length+' 条');
}
function resetSearch(){
  document.getElementById('kw').value='';document.getElementById('cat').value='';document.getElementById('st').value='';
  curRows=ROWS.slice();render();toast('已重置筛选条件');
}
function pageGo(n){toast(n===1?'当前第 1 页（原型）':'已切换到第 '+n+' 页（原型）');}

render();

</script>
<script src="../shared/page-prd.js"></script>
</body>
</html>
