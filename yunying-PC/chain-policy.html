<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产业链服务 - 政策发布（政策兑现）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}.lk-gray:hover{color:#1F2430;text-decoration:underline}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:760px;max-width:97vw;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:70;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:760px;max-width:95vw;max-height:86vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:.22s;z-index:70}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.blk{border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px}
.blk-t{font-size:12.5px;font-weight:700;color:#1F2430;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kv{display:flex;gap:8px;font-size:12px;line-height:1.9}
.kv .k{width:112px;flex-shrink:0}
.fi{width:100%;padding:6px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none;background:#fff}
.fi:focus{border-color:#FF4D2D}
.fl{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.sel{width:100%;padding:6px 8px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none}
button{cursor:pointer}
textarea.fi{font-family:inherit;line-height:1.8;resize:vertical}
.fileitem{display:flex;align-items:center;gap:8px;font-size:12px;color:#334155;padding:6px 10px;background:#F8FAFC;border-radius:8px;margin-top:6px}
</style>
<!-- Tailwind 静态样式：本地引用（不再依赖 cdn.tailwindcss.com）；改动页面后重新构建见 wazhanggui-code/_tw-build/build.ps1 -->
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="p-6">

  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">政策发布</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">13 产业链服务</span>
        <span class="tag" style="background:#EDE9FE;color:#6D28D9">纯信息发布</span>
        <span class="tag" style="background:#F1F5F9;color:#64748B">发布即生效</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-1">就四件事：<b>发布标题 / 发布正文 / 附件 / 申请网址</b>　·　对应买家端 + 商户端「政策兑现」纯信息卡片（`policy-service.html` v1.5）</p>
    </div>
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost" onclick="toast('已导出政策台账（标题 / 附件数 / 更新时间 / 状态）')"><i class="fas fa-download text-[10px] mr-1"></i>导出</button>
      <button class="btn btn-ghost" onclick="openPreview()"><i class="fas fa-mobile-screen text-[10px] mr-1"></i>端上预览</button>
      <button class="btn btn-primary" onclick="openPolicy(null)"><i class="fas fa-plus mr-1"></i>新增政策</button>
    </div>
  </div>

  <!-- 口径提示：后台不代办申报 -->
  <div class="rounded-xl px-4 py-2.5 mb-4 text-[12px] leading-relaxed" style="background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412">
    <i class="fas fa-circle-info mr-1"></i>平台只发布<b>政策原文与官方申请入口</b>：<b>不代收材料、不代办申报、不跟踪审批结果</b>；申报条件、材料与时限以政策原文及政务平台为准。本期<b>已移除「申报受理」</b>（原受理 / 退回补正 / 兑现登记整块下线）。
  </div>

  <div class="grid grid-cols-3 gap-3 mb-4" id="stats"></div>

  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-kw" type="text" placeholder="搜索发布标题 / 正文关键词" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-56">
      <select id="f-state" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部状态</option><option>已发布</option><option>草稿</option><option>已下线</option>
      </select>
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
      <span class="text-[11px] text-[#94A3B8] ml-auto"><i class="fas fa-circle-info mr-1"></i>端上<b>无分类 Tab、无申报倒计时、无截止状态</b>；列表按更新时间倒序</span>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-[13px] font-bold text-[#1F2430]">政策台账</span>
        <span class="text-[12px] text-[#94A3B8]" id="cnt">共 0 条</span>
      </div>
      <span class="text-[11px] text-[#94A3B8]"><i class="fas fa-clock-rotate-left mr-1"></i>下线只影响端上展示；历史条目长期可查</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-[13px]" style="min-width:1040px">
        <thead>
          <tr class="bg-gray-50 text-gray-500 text-[12px]">
            <th class="px-4 py-3 text-left font-medium">发布标题</th>
            <th class="px-4 py-3 text-left font-medium">附件</th>
            <th class="px-4 py-3 text-left font-medium">更新时间</th>
            <th class="px-4 py-3 text-left font-medium">状态</th>
            <th class="px-4 py-3 text-center font-medium">操作</th>
          </tr>
        </thead>
        <tbody id="tb" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>
  </div>

</div>

<div id="mask" class="mask" onclick="closeAll()"></div>
<div id="drawer" class="drawer"></div>
<div id="modal" class="modal"></div>
<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[80]"></div>

<script>
/* ============ 数据（v1.6 收敛：发布标题 / 发布正文 / 附件 / 申请网址 四字段）
   与买家端 policy-service.html v1.5 同源；端上只展示「已发布」条目 */
var PSTC={'已发布':'background:#DCFCE7;color:#15803D','草稿':'background:#F1F5F9;color:#64748B','已下线':'background:#F1F5F9;color:#475569'};
var TODAY='2026-11-16';

var POL=[
  {id:'ZC-2026-031', state:'已发布', up:'2026-11-14 09:20', by:'产业服务 何静',
   title:'大唐袜业产业转型升级专项资金申报指南',
   content:'为推动大唐袜业产业转型升级，对实施智能化改造、品牌建设、研发创新的规上袜业企业给予专项资金支持，重点扶持数字化车间建设、自主品牌培育和绿色生产改造项目。\n\n支持标准、申报条件、申报材料及办理时限，以本政策原文及政务平台公布的申报指南为准。符合条件的袜业企业请在申报期内通过官方入口提交材料。',
   files:[{name:'产业转型升级专项资金管理办法.pdf',size:'1.2MB'},{name:'申报材料清单.docx',size:'86KB'}],
   applyUrl:'https://www.zjzwfw.gov.cn/'},
  {id:'ZC-2026-032', state:'已发布', up:'2026-11-12 15:40', by:'产业服务 何静',
   title:'袜业中小企业数字化改造奖补政策',
   content:'面向完成数字化改造备案的袜业中小企业，按改造投入给予奖补，重点支持生产设备联网、MES 系统上线与智能仓储改造。\n\n奖补比例、上限与验收要求以政策原文为准；同一项目不重复享受市级同类补助。',
   files:[{name:'数字化改造奖补实施细则.pdf',size:'940KB'},{name:'数字化改造项目备案表.xlsx',size:'38KB'}],
   applyUrl:'https://www.zjzwfw.gov.cn/'},
  {id:'ZC-2026-033', state:'已发布', up:'2026-11-10 10:05', by:'产业服务 何静',
   title:'袜业高层次人才引进安家补贴办法',
   content:'面向袜业企业引进的技术研发、设计、外贸等紧缺岗位人才，按人才层次给予一次性安家补贴，补贴由用人单位统一申报。\n\n人才层次认定标准、补贴额度与申报窗口期以政策原文为准。',
   files:[{name:'人才层次认定标准.pdf',size:'513KB'},{name:'安家补贴申报表.xlsx',size:'42KB'}],
   applyUrl:'https://www.zjzwfw.gov.cn/'},
  {id:'ZC-2026-034', state:'已发布', up:'2026-11-08 16:30', by:'产业服务 何静',
   title:'袜业企业出口信用保险保费补助通知',
   content:'对投保出口信用保险的袜业企业，按实际缴纳保费给予一定比例补助，补助资金按年度统一受理、审核与拨付。\n\n投保时间、保单范围与申报截止时间详见原文。',
   files:[{name:'出口信用保险保费补助通知.pdf',size:'612KB'}],
   applyUrl:'https://www.zjzwfw.gov.cn/'},
  {id:'ZC-2026-035', state:'已发布', up:'2026-11-06 09:15', by:'产业服务 何静',
   title:'袜业共享工厂设备购置补贴申报说明',
   content:'针对袜业共享工厂新增织袜机、定型机等生产设备，按设备购置金额给予补贴，申报主体须为已完成备案的共享工厂运营主体。\n\n设备清单、备案要求与补贴上限见政策原文。',
   files:[{name:'共享工厂设备补贴申报说明.pdf',size:'623KB'}],
   applyUrl:'https://www.zjzwfw.gov.cn/'},
  {id:'ZC-2026-036', state:'草稿', up:'2026-11-16 10:40', by:'产业服务 何静',
   title:'袜业智能质检设备租赁补助（试行）',
   content:'拟对租赁智能质检设备满 6 个月的袜业企业给予租金补助，具体比例与上限待财政局会签后确定。',
   files:[], applyUrl:''},
  {id:'ZC-2026-012', state:'已下线', up:'2026-09-30 11:10', by:'产业服务 何静',
   title:'2025 年度袜业设备更新补助（已结束）',
   content:'2025 年度设备更新补助申报已于 2025-12-31 截止，仅留档备查。新一年度申报以最新发布政策为准。',
   files:[{name:'2025年度设备更新补助办法.pdf',size:'1.1MB'}],
   applyUrl:'https://www.zjzwfw.gov.cn/'}
];

/* ============ 基础 ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function po(id){return POL.filter(function(x){return x.id===id;})[0];}
function fileSize(list){return list&&list.length?list.length+' 个':'—';}
function bdUrl(u){try{return /^https?:\/\//i.test(String(u||''));}catch(e){return false;}}

/* ============ 渲染 ============ */
function renderStats(){
  var pub=POL.filter(function(x){return x.state==='已发布';}).length;
  var off=POL.filter(function(x){return x.state==='已下线';}).length;
  var dr=POL.filter(function(x){return x.state==='草稿';}).length;
  document.getElementById('stats').innerHTML=
    '<div class="stat-card bg-white rounded-lg border border-gray-100 p-3.5"><p class="text-[11px] text-gray-400">已发布</p><p class="text-xl font-bold mt-1" style="color:#15803D">'+pub+'</p><p class="text-[10px] text-[#94A3B8] mt-0.5">端上政策兑现列表可见</p></div>'
   +'<div class="stat-card bg-white rounded-lg border border-gray-100 p-3.5"><p class="text-[11px] text-gray-400">已下线</p><p class="text-xl font-bold mt-1" style="color:#475569">'+off+'</p><p class="text-[10px] text-[#94A3B8] mt-0.5">端上撤下，留档可查</p></div>'
   +'<div class="stat-card bg-white rounded-lg border border-gray-100 p-3.5"><p class="text-[11px] text-gray-400">草稿</p><p class="text-xl font-bold mt-1" style="color:#64748B">'+dr+'</p><p class="text-[10px] text-[#94A3B8] mt-0.5">未发布，端上不可见</p></div>';
}
function renderFilters(){
  /* 状态筛选为静态选项，无需动态填充 */
}
function render(){
  var kw=(document.getElementById('f-kw').value||'').trim();
  var st=document.getElementById('f-state').value;
  var rows=POL.filter(function(x){
    if(st&&x.state!==st)return false;
    if(kw&&x.title.indexOf(kw)<0&&x.content.indexOf(kw)<0)return false;
    return true;
  }).sort(function(a,b){return a.up<b.up?1:-1;});
  var h='';
  rows.forEach(function(x){
    h+='<tr>'
      +'<td class="px-4 py-3"><div class="text-[#1F2430] font-medium">'+esc(x.title)+'</div>'
      +'<div class="text-[11px] text-[#94A3B8] mt-0.5">'+esc(x.id)+' · '+esc(x.content.slice(0,26))+'…</div></td>'
      +'<td class="px-4 py-3 text-[12px]">'+(x.files&&x.files.length?'<span class="tag" style="background:#F5F3FF;color:#6D28D9"><i class="fas fa-paperclip text-[9px] mr-1"></i>'+x.files.length+' 个</span>':'<span class="text-[#CBD5E1]">—</span>')+'</td>'
      +'<td class="px-4 py-3 text-[12px] text-[#64748B]">'+esc(x.up)+'</td>'
      +'<td class="px-4 py-3"><span class="tag" style="'+PSTC[x.state]+'">'+esc(x.state)+'</span></td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'
        +'<span class="lk" onclick="openPreview(\''+x.id+'\')">预览</span> · <span class="lk-gray" onclick="openPolicy(\''+x.id+'\')">编辑</span>'
        +' · <span class="lk-gray" onclick="toggleState(\''+x.id+'\')">'+(x.state==='已发布'?'下线':'发布')+'</span>'
        +(x.state==='草稿'?' · <span class="lk-gray" onclick="delPol(\''+x.id+'\')">删除</span>':'')
      +'</td></tr>';
  });
  if(!rows.length)h='<tr><td colspan="5" class="px-4 py-16 text-center text-gray-300"><i class="fas fa-inbox text-3xl block mb-2"></i><span class="text-[12px]">暂无匹配的政策</span></td></tr>';
  document.getElementById('tb').innerHTML=h;
  document.getElementById('cnt').textContent='共 '+rows.length+' 条';
  renderStats();
}
function doSearch(){render();toast('已按条件查询（标题 / 正文关键词 + 状态）');}
function resetSearch(){
  document.getElementById('f-kw').value='';document.getElementById('f-state').value='';
  render();toast('已重置筛选条件');
}

/* ============ 状态操作 ============ */
function toggleState(id){
  var x=po(id);
  if(x.state==='已发布'){
    x.state='已下线';x.up=TODAY+' 10:00';
    render();
    toast('已下线：'+x.title+'（端上政策兑现撤下；已下载原文的商户不受影响）');
    return;
  }
  var err=checkReady(x);
  if(err){toast(err);return;}
  x.state='已发布';x.up=TODAY+' 10:00';
  render();
  toast('已发布：'+x.title+'（发布即生效）→ 端上政策兑现列表可见，详情含正文 / 附件 / 申请网址');
}
function checkReady(x){
  if(!x.title)return '发布前请填写「发布标题」';
  if(x.title.length>60)return '发布标题不能超过 60 字（端上卡片单行展示）';
  if(!x.content)return '发布前请填写「发布正文」';
  if(x.applyUrl&&!bdUrl(x.applyUrl))return '申请网址需以 http:// 或 https:// 开头';
  return '';
}
function delPol(id){
  var x=po(id);
  if(x.state!=='草稿'){toast('仅「草稿」可删除；已发布政策请用「下线」（历史需可查）');return;}
  POL.splice(POL.indexOf(x),1);
  render();
  toast('已删除草稿政策 '+id);
}

/* ============ 政策编辑抽屉（四字段） ============ */
var curPol=null;
function openPolicy(id){
  curPol=id;
  var x=id?po(id):null;
  var files=(x&&x.files)?x.files.slice():[];
  tmpFiles=files;
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">'+(x?'编辑政策　'+esc(x.id):'新增政策')+'</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">只有四项：<b>发布标题 / 发布正文 / 附件 / 申请网址</b>；<b>发布即生效</b>（本期无审核、无申报受理、无 AI 解读）</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">';

  h+='<div class="blk"><div class="blk-t"><i class="fas fa-heading text-[#2563EB]"></i>发布标题</div>'
    +'<input class="fi" id="c-title" maxlength="60" value="'+(x?esc(x.title):'')+'" placeholder="例：大唐袜业产业转型升级专项资金申报指南" oninput="document.getElementById(\'t-cnt\').textContent=this.value.length+\' / 60\'">'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">端上卡片单行展示，<b>≤60 字</b>；<span id="t-cnt">'+(x?x.title.length:0)+' / 60</span></p></div>';

  h+='<div class="blk"><div class="blk-t"><i class="fas fa-align-left text-[#7C3AED]"></i>发布正文</div>'
    +'<textarea class="fi" id="c-content" rows="9" placeholder="粘贴政策原文要点；申报条件、材料、时限以原文及政务平台为准">'+(x?esc(x.content):'')+'</textarea>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">端上详情完整展示；<b>不在此处填写结构化申报条件 / 材料 / 流程</b>（v1.6 已取消结构化录入与 AI 图文解读）</p></div>';

  h+='<div class="blk"><div class="blk-t"><i class="fas fa-paperclip text-[#6D28D9]"></i>附件（可多个）</div>'
    +'<div id="fileList">'+fileRows()+'</div>'
    +'<label style="display:block;border:2px dashed #E2E8F0;border-radius:10px;padding:12px;text-align:center;color:#94A3B8;cursor:pointer;margin-top:8px" onclick="addFile()"><i class="fas fa-cloud-arrow-up mr-1"></i>点击上传附件（PDF / Word / Excel / 图片，单个 ≤20MB）</label>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">端上详情列出文件名与大小，可在线预览 / 下载；超过 5 个时端上折叠「查看全部」</p></div>';

  h+='<div class="blk"><div class="blk-t"><i class="fas fa-link text-[#E63E20]"></i>申请网址（选填）</div>'
    +'<input class="fi" id="c-url" value="'+(x?esc(x.applyUrl||''):'')+'" placeholder="https://www.zjzwfw.gov.cn/…">'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">端上点「前往申请网址」<b>新窗口打开政务平台</b>；不填则端上提示「该政策未配置申请网址」</p></div>';

  h+='<div class="blk"><div class="blk-t"><i class="fas fa-mobile-screen text-[#7C3AED]"></i>端上卡片示意</div>'
    +'<div style="width:280px;border:7px solid #1F2430;border-radius:18px;background:#fff;padding:10px">'
    +'<div class="text-[11px] font-bold text-[#1F2430]">'+(x?esc(x.title.slice(0,18)):'发布标题')+'</div>'
    +'<div class="text-[10px] text-[#64748B]" style="margin-top:5px">'+(x?esc(x.content.slice(0,44))+'…':'发布正文摘要…')+'</div>'
    +'<div class="flex items-center gap-2 text-[10px] mt-2" style="color:#7C3AED"><i class="fas fa-paperclip text-[9px]"></i>附件 '+(files.length||0)+' 个'
      +'<span class="text-[#94A3B8] ml-auto">'+(x?esc(x.up):'更新时间')+'</span></div></div>'
    +'<p class="text-[11px] text-[#94A3B8] mt-2">端上无申报按钮、无倒计时、无分类 Tab；详情底部为「前往申请网址」</p></div>';

  h+='</div><div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeAll()">取消</button>'
    +'<button class="btn btn-ghost" onclick="savePolicy(false)">保存草稿</button>'
    +'<button class="btn btn-primary" onclick="savePolicy(true)">保存并发布</button></div>';
  show('drawer',h);
}
var tmpFiles=[];
function fileRows(){
  if(!tmpFiles.length)return '<p class="text-[11px] text-[#94A3B8]">尚未上传附件</p>';
  return tmpFiles.map(function(f,i){
    return '<div class="fileitem"><i class="fas fa-file-lines" style="color:#6D28D9"></i>'+esc(f.name)+'<span class="text-[11px] text-[#94A3B8]">'+esc(f.size)+'</span>'
      +'<span class="lk-gray ml-auto" onclick="toast(\'预览/下载：'+esc(f.name)+'\')">预览</span>'
      +'<span class="lk-gray" onclick="rmFile('+i+')">移除</span></div>';
  }).join('');
}
function addFile(){
  var n=tmpFiles.length+1;
  if(tmpFiles.length>=8){toast('附件最多 8 个（超出请合并或压缩）');return;}
  tmpFiles.push({name:'政策附件-'+n+'.pdf',size:(0.6+n*0.2).toFixed(1)+'MB'});
  document.getElementById('fileList').innerHTML=fileRows();
  toast('已上传：政策附件-'+n+'.pdf（支持 PDF/Word/Excel/图片，单个 ≤20MB）');
}
function rmFile(i){
  var nm=tmpFiles[i].name;
  tmpFiles.splice(i,1);
  document.getElementById('fileList').innerHTML=fileRows();
  toast('已移除附件：'+nm);
}
function savePolicy(pub){
  var title=document.getElementById('c-title').value.trim();
  var content=document.getElementById('c-content').value.trim();
  var url=document.getElementById('c-url').value.trim();
  if(!title){toast('请填写发布标题');return;}
  if(title.length>60){toast('发布标题不能超过 60 字（端上卡片单行展示）');return;}
  if(!content){toast('请填写发布正文');return;}
  if(url&&!bdUrl(url)){toast('申请网址需以 http:// 或 https:// 开头');return;}
  var x=curPol?po(curPol):null;
  var data={title:title, content:content, files:tmpFiles.slice(), applyUrl:url,
    state:pub?'已发布':(x?x.state:'草稿'), up:TODAY+' 10:00'};
  if(x){for(var k in data){x[k]=data[k];}}
  else{data.id='ZC-2026-0'+(37+POL.length);data.by='产业服务 何静';POL.push(data);x=data;}
  render();closeAll();
  toast(pub?('已发布「'+title+'」：端上政策兑现列表可见，详情展示正文 / '+x.files.length+' 个附件 / 申请网址'):('已保存草稿「'+title+'」'));
}

/* ============ 端上预览（纯信息） ============ */
function openPreview(id){
  var pubs=POL.filter(function(y){return y.state==='已发布';}).sort(function(a,b){return a.up<b.up?1:-1;});
  var x=id?po(id):pubs[0];
  if(!x){toast('暂无已发布政策');return;}
  if(x.state!=='已发布'){toast('该政策当前状态为「'+x.state+'」，端上不可见；此处仅预览样式');}
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">端上预览（政策兑现）</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">买家端 / 商户端 `policy-service.html`：列表（标题 + 正文摘要 + 附件数 + 更新时间）→ 详情（正文 + 附件 + 申请网址）</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="px-5 py-4"><div style="width:320px;border:8px solid #1F2430;border-radius:22px;background:#fff;padding:12px;margin:0 auto">'
    +'<div class="text-[10px] text-[#94A3B8] mb-2">政策兑现</div>';
  pubs.slice(0,3).forEach(function(p){
    var on=p.id===x.id;
    h+='<div style="border:1px solid '+(on?'#FFD3C7':'#E2E8F0')+';background:'+(on?'#FFF7F4':'#fff')+';border-radius:10px;padding:8px;margin-bottom:8px">'
      +'<div class="text-[11px] font-semibold text-[#1F2430]">'+esc(p.title)+'</div>'
      +'<div class="text-[10px] text-[#64748B]" style="margin-top:3px">'+esc(p.content.slice(0,34))+'…</div>'
      +'<div class="flex items-center gap-2 text-[10px] mt-1" style="color:#7C3AED"><i class="fas fa-paperclip text-[9px]"></i>附件 '+(p.files?p.files.length:0)+' 个'
      +'<span class="text-[#94A3B8] ml-auto">'+esc(p.up.slice(0,10))+'</span></div></div>';
  });
  h+='<div style="border-top:1px dashed #E2E8F0;margin:10px 0 8px"></div>'
    +'<div class="text-[10px] font-bold text-gray-400 mb-1">发布正文</div>'
    +'<div class="text-[10px] text-[#64748B]" style="white-space:pre-line;max-height:96px;overflow:hidden">'+esc(x.content.slice(0,110))+'…</div>'
    +'<div class="text-[10px] font-bold text-gray-400 mb-1" style="margin-top:8px">附件</div>'
    +(x.files&&x.files.length?x.files.map(function(f){return '<div class="flex items-center gap-1 text-[10px] text-[#334155]" style="margin-bottom:2px"><i class="fas fa-file-lines" style="color:#6D28D9"></i>'+esc(f.name)+'<span class="text-[#94A3B8]">'+esc(f.size)+'</span></div>';}).join(''):'<div class="text-[10px] text-[#94A3B8]">无附件</div>')
    +'<div class="text-[10px] font-bold text-gray-400 mb-1" style="margin-top:8px">申请网址</div>'
    +'<div class="text-[10px]" style="color:#2563EB;word-break:break-all">'+esc(x.applyUrl||'未配置（端上提示「该政策未配置申请网址」）')+'</div>'
    +'<div class="text-[11px] text-center" style="margin-top:10px;background:#FF4D2D;color:#fff;border-radius:8px;padding:6px" onclick="toast(\''+(x.applyUrl?'将在政务平台新窗口打开：'+esc(x.applyUrl):'该政策未配置申请网址')+'\')">前往申请网址</div>'
    +'<div class="text-[9px] text-[#94A3B8] text-center" style="margin-top:5px">平台仅发布政策原文与官方入口，不代办申报</div>'
    +'</div></div>';
  h+='<div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2"><button class="btn btn-primary" onclick="closeAll()">关闭</button></div>';
  show('modal',h);
}

/* ============ 基础 ============ */
function show(which,h){
  document.getElementById(which).innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById(which).classList.add('on');
}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}
var _t;
function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.style.opacity='1';
  clearTimeout(_t);_t=setTimeout(function(){el.style.opacity='0';},2200);
}
renderFilters();render();
</script>
