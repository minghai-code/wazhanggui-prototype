<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}
.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}
.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}
.lk-gray:hover{color:#1F2430;text-decoration:underline}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:640px;max-width:96vw;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:70;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.blk{border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px}
.blk-t{font-size:12.5px;font-weight:700;color:#1F2430;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kv{display:flex;gap:8px;font-size:12px;line-height:1.9}
.kv .k{color:#94A3B8;width:84px;flex-shrink:0}
.kv .v{color:#1F2430;flex:1;word-break:break-all}
.fl{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.fi{width:100%;padding:6px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none;background:#fff}
.fi:focus{border-color:#FF4D2D}
.fi[readonly]{background:#F8FAFC;color:#94A3B8;cursor:not-allowed}
.sel{width:100%;padding:6px 8px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none}
button{cursor:pointer}
</style>

      </div>

  </div>

        <option value="">全部信用等级</option><option>AAA</option><option>AA</option><option>A</option><option>B</option><option>C</option><option>D</option>
      </select>
      <select id="f-src" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部建档来源</option><option>线上申请</option><option>线下自动</option><option>手工补档</option>
      </select>
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <span class="text-[12px] text-[#94A3B8]" id="cnt">共 0 条</span>

    </div>
    <div class="overflow-x-auto">

            <th class="px-4 py-3 text-left font-medium">主体名称</th>

            <th class="px-4 py-3 text-left font-medium">状态</th>
            <th class="px-4 py-3 text-center font-medium">操作</th>

      </div>
    </div>
  </div>

</div>

function doSearch(){
  var kw=document.getElementById('f-kw').value.trim(),t=document.getElementById('f-type').value,o=document.getElementById('f-open').value,
      s=document.getElementById('f-stall').value,stt=document.getElementById('f-status').value,c=document.getElementById('f-credit').value,src=document.getElementById('f-src').value;
  curRows=MS.filter(function(m){
    var okKw=!kw||m.name.indexOf(kw)>-1||m.id.indexOf(kw)>-1||m.person.indexOf(kw)>-1||(m.idno&&m.idno.slice(-4).indexOf(kw)>-1);
    return okKw&&(!t||m.type===t)&&(!o||m.open===o)&&(!s||(s==='yes'?hasStall(m):!hasStall(m)))&&(!stt||m.status===stt)&&(!c||m.credit===c)&&(!src||m.src===src);
  });
  render();toast('已按条件查询，共 '+curRows.length+' 条');
}
function resetSearch(){
  ['f-kw','f-type','f-open','f-stall','f-status','f-credit','f-src'].forEach(function(k){document.getElementById(k).value='';});
  curRows=MS.slice();render();toast('已重置筛选条件');
}
function showId(id){shownId[id]=true;openD(id,'view');toast('已展示完整身份证号，并记录查看留痕（人 / 时间 / IP）');}

/* ================= 详情 / 编辑抽屉 ================= */
function openD(id,mode){
  curId=id;curMode=mode;
  var m=MS.filter(function(x){return x.id===id;})[0];
  if(!m){return;}
  var edit=(mode==='edit');
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">'+esc(m.name)+'　<span class="text-[12px] font-normal text-[#94A3B8]">'+esc(m.id)+'</span></h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+st(m.type,typeColor(m.type))+' '+st(m.open,OPEN_C[m.open])+' '+st(m.status,MS_C[m.status])+'　建档来源：'+esc(m.src)+'</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeD()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">';

  /* ① 主体信息 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-id-card text-[#FF4D2D]"></i>① 主体信息</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">商户编号</span><span class="v">'+esc(m.id)+'<span class="text-[10px] text-[#94A3B8]">（系统生成，不可改）</span></span></div>'
    +'<div class="kv"><span class="k">主体类型</span><span class="v">'+esc(m.sub)+'</span></div>'
    +'<div class="kv"><span class="k">经营者 / 法人</span><span class="v">'+esc(m.person)+'</span></div>'
    +'<div class="kv"><span class="k">身份证号</span><span class="v">'
      +(m.idno?(shownId[id]?esc(m.idno)+' <span class="text-[10px] text-[#94A3B8]">已留痕</span>':esc(maskId(m.idno))+' <span class="lk" onclick="showId(\''+m.id+'\')">查看</span>'):'<span class="tag" style="background:#FEF3C7;color:#B45309">身份待补全（客户后期补录）</span>')
    +'</span></div>'
    +'<div class="kv"><span class="k">统一社会信用代码</span><span class="v">'+(m.code?esc(m.code):'—')+'</span></div>'
    +'<div class="kv"><span class="k">联系电话</span><span class="v">'+(edit?'<input class="fi" value="'+esc(m.phone)+'" id="e-phone">':esc(m.phone))+'</span></div>'
    +'<div class="kv"><span class="k">经营品类</span><span class="v">'+(edit?'<input class="fi" value="'+esc(m.cat)+'" id="e-cat">':esc(m.cat))+'</span></div>'
    +'<div class="kv"><span class="k">注册 / 经营地址</span><span class="v">'+esc(m.addr)+'</span></div>'
    +'</div></div>';

  /* ② 线上信息 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-store text-[#2563EB]"></i>② 线上信息</div>'
    +'<div class="kv"><span class="k">入驻申请单</span><span class="v">'+((m.src==='线上申请'||m.open!=='未申请')?'<span class="lk" onclick="location.href=\'merchant.html\'">查看申请单与审核轨迹</span>':'—（未申请线上入驻）')+'</span></div>'
    +'<div class="kv"><span class="k">线上开通状态</span><span class="v">'+st(m.open,OPEN_C[m.open])+(m.open==='未申请'?'　<span class="lk" onclick="toast(\'已记录：请商户管理专员线下推动其申请线上入驻（可加入待推动清单）\')">加入待推动清单</span>':'')+'</span></div>'
    +'<div class="kv"><span class="k">店铺数</span><span class="v">'+m.shops+' 个'+(m.shops>0?'　<span class="lk" onclick="toast(\'跳转 10 商城运营 · 店铺列表（该商户名下店铺）\')">查看店铺</span>':'')+'</span></div>'
    +'<div class="kv"><span class="k">权限状态</span><span class="v">电商权限：'+esc(m.ecom)+'　·　询价权限：'+esc(m.rfq)+'　'+(m.rfq==='未认证'?'<span class="lk" onclick="location.href=\'merchant-qual.html\'">去认证审核</span>':'')+'</span></div>'
    +'</div>';

  /* ③ 线下信息（只读） */
  if(hasStall(m)){
    h+='<div class="blk" style="border-color:#BBF7D0;background:#F6FEF9"><div class="blk-t" style="color:#15803D"><i class="fas fa-link"></i>③ 线下信息（只读 · 来自 02 市场资源管理）</div>'
      +m.stalls.map(function(s){
        return '<div class="rounded-lg bg-white border border-gray-100 p-3 mb-2"><div class="flex items-center gap-2 mb-1">'
          +'<span class="tag" style="background:#FFEDE7;color:#E63E20">档口 '+esc(s.code)+'</span>'
          +'<span class="text-[11px] text-[#94A3B8]">合同匹配结果</span></div>'
          +'<div class="grid grid-cols-2 gap-x-6">'
          +'<div class="kv"><span class="k">位置</span><span class="v">'+esc(s.b)+' · '+esc(s.floor)+'</span></div>'
          +'<div class="kv"><span class="k">面积</span><span class="v">'+esc(s.area)+' ㎡</span></div>'
          +'<div class="kv"><span class="k">租期</span><span class="v">'+esc(s.term)+'</span></div>'
          +'<div class="kv"><span class="k">合同号</span><span class="v"><span class="lk" onclick="toast(\'跳转 05 合同管理（对应合同）\')">'+esc(s.contract)+'</span></span></div>'
          +'</div></div>';
      }).join('')
      +'<p class="text-[11px] text-[#15803D]"><i class="fas fa-circle-info mr-1"></i>档口与租期以 02 数据为准，本页不可编辑；如需修正请去 02 摊位商铺管理。</p></div>';
  } else {
    h+='<div class="blk" style="border-color:#FDE68A;background:#FFFBEB"><div class="blk-t" style="color:#B45309"><i class="fas fa-link-slash"></i>③ 线下信息</div>'
      +'<p class="text-[12px] text-[#64748B]">该商户<b>无线下档口</b>（仅线上商户）。若其实际有档口，请先到「线下自动建档与同步」页处理建档异常，不要在此手工关联。</p></div>';
  }

  /* ④ 信用评级 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-star text-[#F59E0B]"></i>④ 信用评级</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">信用等级</span><span class="v font-semibold">'+esc(m.credit)+'（'+m.score+' 分）</span></div>'
    +'<div class="kv"><span class="k">评估周期</span><span class="v">2026-09</span></div>'
    +'</div><div class="mt-2 text-[12px] text-[#64748B]">分项：交易 38.5 / 评价 19.0 / 缴费 <span style="color:#B45309">数据缺失</span> / 违规 −2.0　'
    +'<span class="lk" onclick="location.href=\'merchant-rating.html\'">查看评级详情</span></div></div>';

  /* ⑤ 画像标签 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-tags text-[#7C3AED]"></i>⑤ 画像标签</div>'
    +'<div class="mb-2"><span class="text-[11px] text-[#94A3B8] mr-2">实力标签</span>'
    +(m.tags.filter(function(t){return TAG_POOL.strong.indexOf(t)>-1;}).map(function(t){return '<span class="tag" style="background:#F3E8FF;color:#7C3AED;margin-right:4px">'+esc(t)+'</span>';}).join('')||'<span class="text-[11px] text-[#94A3B8]">—</span>')+'</div>'
    +'<div><span class="text-[11px] text-[#94A3B8] mr-2">风险标签</span>'
    +(m.tags.filter(function(t){return TAG_POOL.risk.indexOf(t)>-1;}).map(function(t){return '<span class="tag" style="background:#FEE2E2;color:#B91C1C;margin-right:4px">'+esc(t)+'</span>';}).join('')||'<span class="text-[11px] text-[#94A3B8]">—</span>')+'</div>'
    +'<div class="flex items-center gap-2 mt-3"><select id="tagSel" class="sel" style="width:220px">'
    +TAG_POOL.strong.concat(TAG_POOL.risk).map(function(t){return '<option>'+t+'</option>';}).join('')
    +'</select><button class="btn btn-ghost" onclick="addTag()">＋ 添加标签</button>'
    +(m.tags.length?'<button class="btn btn-ghost" onclick="toast(\'已清除全部标签（原型）\')">清除标签</button>':'')+'</div></div>';

  /* ⑥ 变更与操作留痕 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-clock-rotate-left text-[#64748B]"></i>⑥ 变更与操作留痕</div>'
    +'<div class="text-[12px] text-[#64748B] leading-7">'
    +'· 建档（'+(m.src==='线上申请'?'线上入驻审核通过':(m.src==='线下自动'?'线下自动建档任务':'运营手工补档'))+'）　'+esc(m.time)+'<br>'
    +(m.type==='线上兼档口'?'· 类型判定「线上兼档口」（依据：命中线下档口）<br>':'')
    +(m.type==='仅线下档口（未上线）'?'· 自动建档，标记「身份待补全」'+(m.idno?'':'（缺身份证号）')+'<br>':'')
    +'· 信用评级更新为 '+esc(m.credit)+'　2026-09-01<br>'
    +'</div></div>';

  /* ⑦ 关联数据入口 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-diagram-project text-[#64748B]"></i>⑦ 关联数据入口</div>'
    +'<div class="flex flex-wrap gap-2">'
    +'<button class="btn btn-ghost" onclick="toast(\'跳转 05 合同管理（该商户名下合同）\')">合同管理</button>'
    +'<button class="btn btn-ghost" onclick="toast(\'跳转 06 缴费管理（该商户账单与欠费）\')">缴费管理</button>'
    +'<button class="btn btn-ghost" onclick="toast(\'跳转 10 商城运营 · 店铺列表\')">名下店铺</button>'
    +'<button class="btn btn-ghost" onclick="toast(\'跳转买家端评价（该商户评价明细）\')">买家评价</button>'
    +'</div></div>';

  if(edit){
    h+='<div class="blk" style="border-color:#FDB4A3;background:#FFF6F3"><div class="blk-t" style="color:#E63E20"><i class="fas fa-triangle-exclamation"></i>只读字段说明</div>'
      +'<p class="text-[12px] text-[#64748B] leading-6">证件号、商户编号、<b>商户类型</b>、<b>关联档口</b>均<b>不可在本页编辑</b>——类型与档口由系统按来源判定（线上审核结果 + 02 档口数据），如需修正请去对应来源处理。</p></div>';
  }

  h+='</div>';
  h+='<div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeD()">关闭</button>'
    +(edit
      ? '<button class="btn btn-primary" onclick="saveEdit()">保存修改</button>'
      : '<button class="btn btn-primary" onclick="openD(\''+m.id+'\',\'edit\')">编辑</button>'
        +'<button class="btn btn-ghost" style="color:#B91C1C;border-color:#FECACA" onclick="toast(\'已发起暂停/冻结申请，待运营主管审批（原型）\')">暂停 / 冻结</button>')
    +'</div>';
  document.getElementById('drawer').innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function closeD(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
function addTag(){
  var m=MS.filter(function(x){return x.id===curId;})[0];
  var t=document.getElementById('tagSel').value;
  if(!m||!t){return;}
  if(m.tags.indexOf(t)>-1){toast('该标签已存在');return;}
  m.tags.push(t);openD(curId,curMode);toast('已添加标签「'+t+'」（留痕）；风险标签会自动联动风控规则');
}
function saveEdit(){
  var m=MS.filter(function(x){return x.id===curId;})[0];
  if(!m){return;}
  m.phone=document.getElementById('e-phone').value.trim();
  m.cat=document.getElementById('e-cat').value.trim();
  openD(curId,'view');render();toast('已保存修改（联系方式 / 经营品类），变更已留痕');
}
/* ================= 手工补档 ================= */
function openNew(){
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">手工补档</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">仅用于自动建档未覆盖的线下租户补录；能自动建档的请走「线下自动建档与同步」</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeD()"><i class="fas fa-xmark"></i></button></div>'
    +'<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:12px">'
    +'<div><label class="fl">主体名称（商户 / 经营户）</label><input class="fi" id="n-name" placeholder="如：晓琳袜业经营部"></div>'
    +'<div class="grid grid-cols-2 gap-3">'
    +'<div><label class="fl">经营者姓名</label><input class="fi" id="n-person" placeholder="如：汤晓琳"></div>'
    +'<div><label class="fl">身份证号（可后补）</label><input class="fi" id="n-idno" placeholder="选填；缺失将标记「身份待补全」"></div>'
    +'</div>'
    +'<div class="grid grid-cols-2 gap-3">'
    +'<div><label class="fl">主体类型</label><select class="sel" id="n-sub"><option>个体工商户</option><option>企业</option><option>工厂制造商</option></select></div>'
    +'<div><label class="fl">主营品类</label><input class="fi" id="n-cat" placeholder="如：女袜"></div>'
    +'</div>'
    +'<div><label class="fl">补档原因（必填）</label><input class="fi" id="n-why" placeholder="如：该档口合同缺身份证号，自动建档未命中，人工核对后补档"></div>'
    +'<div class="rounded-xl border p-3" style="border-color:#FDE68A;background:#FFFBEB"><p class="text-[11px] text-[#64748B]">提示：补档后<b>档口关联仍需在 02 侧维护</b>；若同一身份证已存在档案，系统会提示合并而不是新建。</p></div>'
    +'</div>'
    +'<div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeD()">取消</button>'
    +'<button class="btn btn-primary" onclick="saveNew()">确认补档</button></div>';
  document.getElementById('drawer').innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function saveNew(){
  var name=document.getElementById('n-name').value.trim(),person=document.getElementById('n-person').value.trim(),
      idno=document.getElementById('n-idno').value.trim(),why=document.getElementById('n-why').value.trim(),
      sub=document.getElementById('n-sub').value,cat=document.getElementById('n-cat').value.trim();
  if(!name||!person){toast('主体名称与经营者姓名为必填');return;}
  if(!why){toast('补档原因必填（用于留痕与审核）');return;}
  var dup=MS.filter(function(x){return idno&&x.idno===idno;})[0];
  if(dup){toast('该身份证已存在档案「'+dup.name+'」，请走资料变更 / 合并流程，不新建');return;}
  MS.unshift({id:'MB2026'+String(Math.floor(Math.random()*900000)+100000),name:name,sub:sub,type:'仅线下档口（未上线）',open:'未申请',src:'手工补档',
    stalls:[],cat:cat||'—',time:'2026-09-28',credit:'待评级',score:'—',status:'正常',person:person,idno:idno,
    code:'',phone:'—',addr:'—',tags:[],shops:0,ecom:'未开通',rfq:'未开通'});
  curRows=MS.slice();closeD();render();renderStats();
  toast('已补档：'+name+'（来源=手工补档'+(idno?'':'，身份待补全')+'）');
}
/* ================= 初始化 ================= */
renderStats();
render();
</script>
