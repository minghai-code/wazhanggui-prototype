<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文商旅管理 - 研学往期风采</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.section-label{font-size:16px;font-weight:700;color:#1F2430;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.section-label::before{content:'';width:3px;height:16px;border-radius:2px;background:#FF4D2D}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}
.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}
.lk:hover{text-decoration:underline}
.ftitle{font-size:12px;font-weight:700;color:#1F2430;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.ftitle::before{content:'';width:3px;height:12px;border-radius:2px;background:#FF4D2D}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:620px;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
</style>
</head>
<body>
<div class="p-6">

  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">研学往期风采</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">投标 4.2.3.2.1</span>
      </div>
      <p class="text-[12px] text-[#94A3B8] mt-1">文商旅管理 / 研学管理 / 研学往期风采　·　研学结束后系统自动生成，展示研学活动内容、用户留言评价与照片，实时同步买家端</p>
    </div>
  </div>

  <!-- 操作栏 -->
  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden mb-4">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center gap-2 flex-wrap">
      <button class="btn btn-ghost" onclick="toast('已预览买家端研学往期风采页')"><i class="fas fa-eye mr-1"></i>预览买家端</button>
      <span class="ml-auto text-[11px] text-[#94A3B8]">内容随研学结束自动生成 · 实时同步买家端</span>
    </div>
    <div class="px-5 py-3 flex items-center gap-2">
      <i class="fas fa-circle-info text-[12px]" style="color:#F97316"></i>
      <span class="text-[12px] text-[#64748B]">研学结束后由系统自动生成往期风采，无需手动新增；可隐藏暂不展示的内容。包含研学活动内容、用户留言评价与照片。</span>
    </div>
  </div>

  <!-- 往期风采列表（研学结束后系统自动生成） -->
  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <div class="section-label mb-0">往期风采（<span id="gloryCnt">0</span>）</div>
      <span class="text-[12px] text-[#94A3B8]">研学结束自动生成 · 含活动内容 / 用户评价 / 照片</span>
    </div>
    <div class="p-5 grid grid-cols-1 gap-4" id="gloryList"></div>
  </div>
</div>

<div class="mask" id="mask" onclick="closeD()"></div>
<div class="drawer" id="drawer">
  <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
    <div>
      <h3 class="text-[15px] font-bold text-[#1F2430]" id="d-title">详情</h3>
      <p class="text-[11px] text-[#94A3B8] mt-0.5" id="d-sub"></p>
    </div>
    <button onclick="closeD()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-xmark text-lg"></i></button>
  </div>
  <div class="flex-1 overflow-y-auto px-6 py-5" id="d-body"></div>
  <div class="px-6 py-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3" id="d-foot"></div>
</div>

<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[60]"></div>
<script>
/* 往期风采：研学结束后系统自动生成，非手动维护 */
var GLORIES=[
 {
   id:1, title:'浙江大学研学团', route:'智能制造工厂参观', date:'2026-08-15', people:45, status:'shown',
   content:'本次研学由浙江大学附属小学 45 名学生参加，围绕「智能制造工厂参观」路线展开。上午参观全自动化织袜生产线，了解从纱线到成品的织造全过程；下午在技师指导下亲手操作织袜机，完成专属袜子创作，并举行研学证书颁发仪式。',
   photos:['生产线参观','亲手织袜','研学证书','集体合影'],
   reviews:[
     {name:'王老师',role:'带队老师',rating:5,date:'2026-08-16',text:'工厂参观环节学生兴趣极高，技师讲解通俗易懂，亲手织袜体验是最大亮点，回校后还组织了分享会。'},
     {name:'李同学家长',role:'家长',rating:5,date:'2026-08-17',text:'孩子回来一直念叨织袜机，说长大了想当工程师，这次研学很有意义，期待下次。'},
     {name:'张同学',role:'学生',rating:5,date:'2026-08-16',text:'我最喜欢自己织的那只袜子，还盖了研学纪念章，我要带回家给奶奶看！'}
   ]
 },
 {
   id:2, title:'杭州学军中学研学团', route:'袜业博物馆文化游', date:'2026-07-20', people:68, status:'shown',
   content:'杭州学军中学 68 名师生走进大唐袜业博物馆，跟随研究员了解袜业四十年发展脉络与非遗工艺；在文化课堂完成袜子文化手作，并参与「我的袜子设计」主题创作。',
   photos:['博物馆序厅','非遗工艺','文化课堂','设计作品'],
   reviews:[
     {name:'陈老师',role:'带队老师',rating:5,date:'2026-07-21',text:'博物馆的 VR 全景体验区很惊艳，学生通过互动把袜业历史记得更牢。'},
     {name:'周同学',role:'学生',rating:4,date:'2026-07-20',text:'文化课堂的手作环节有点难，但做完很有成就感。'},
     {name:'赵同学家长',role:'家长',rating:5,date:'2026-07-22',text:'孩子说学到了课本外的知识，这样的研学比旅游有意思。'}
   ]
 },
 {
   id:3, title:'织袜工艺体验营', route:'织袜工艺体验营', date:'2026-07-08', people:32, status:'hidden',
   content:'面向团体的织袜工艺体验营，32 名参与者在技师带领下完成从选纱、织造到定型的上手全流程，并带走自己织制的袜子作为纪念。',
   photos:['选纱环节','织造体验','成品展示','纪念合影'],
   reviews:[
     {name:'钱先生',role:'团体负责人',rating:5,date:'2026-07-09',text:'流程安排紧凑，技师很耐心，团建体验感很好。'},
     {name:'孙女士',role:'参与者',rating:4,date:'2026-07-09',text:'第一次织袜子，虽然慢但很治愈，成品质量也不错。'}
   ]
 }
];

function statusTag(s){return s==='shown'?'<span class="tag" style="background:#DCFCE7;color:#059669">已展示</span>':'<span class="tag" style="background:#F1F5F9;color:#94A3B8">已隐藏</span>';}
function stars(n){var s='';for(var i=0;i<5;i++){s+='<i class="fas fa-star" style="color:'+(i<n?'#FBBF24':'#E2E8F0')+';font-size:11px"></i>';}return s;}

function renderGlories(){
  var box=document.getElementById('gloryList');
  document.getElementById('gloryCnt').textContent=GLORIES.length;
  box.innerHTML=GLORIES.map(function(g){
    return '<div class="border border-gray-100 rounded-xl p-4 flex gap-4">'+
      '<div class="w-28 h-28 rounded-lg bg-gray-100 flex items-center justify-center flex-shrink-0"><i class="fas fa-image text-gray-300 text-2xl"></i></div>'+
      '<div class="flex-1 min-w-0">'+
        '<div class="flex items-center gap-2">'+'<p class="text-[14px] font-semibold text-[#1F2430]">'+g.title+'</p>'+statusTag(g.status)+'</div>'+
        '<p class="text-[11px] text-[#94A3B8] mt-0.5">'+g.route+' · '+g.date+' · '+g.people+' 人 · '+g.reviews.length+' 条评价</p>'+
        '<p class="text-[12px] text-[#64748B] mt-1.5 leading-relaxed">'+g.content+'</p>'+
        '<div class="mt-2 flex gap-2">'+
          '<button class="btn btn-ghost" style="padding:4px 12px" onclick="openGlory('+g.id+')">查看详情</button>'+
          '<button class="btn btn-ghost" style="padding:4px 12px" onclick="toggleGlory('+g.id+')">'+(g.status==='shown'?'隐藏':'展示')+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function openGlory(id){
  var g=null;GLORIES.forEach(function(x){if(x.id===id)g=x;});
  if(!g)return;
  var photos=g.photos.map(function(p){return '<div class="w-24 h-24 rounded-lg bg-gray-100 flex items-center justify-center flex-col"><i class="fas fa-image text-gray-300"></i><span class="text-[10px] text-[#94A3B8] mt-1">'+p+'</span></div>';}).join('');
  var reviews=g.reviews.map(function(r){
    return '<div class="border border-gray-100 rounded-lg p-3 mb-2">'+
      '<div class="flex items-center gap-2">'+
        '<div class="w-7 h-7 rounded-full flex items-center justify-center text-white text-[11px]" style="background:#FF4D2D">'+r.name.charAt(0)+'</div>'+
        '<div class="flex-1"><p class="text-[12px] font-medium text-[#1F2430]">'+r.name+'<span class="text-[11px] text-[#94A3B8] font-normal ml-1">'+r.role+'</span></p>'+
        '<div class="flex items-center gap-1 mt-0.5">'+stars(r.rating)+'<span class="text-[10px] text-[#94A3B8] ml-1">'+r.date+'</span></div></div>'+
      '</div>'+
      '<p class="text-[12px] text-[#64748B] mt-1.5">'+r.text+'</p>'+
    '</div>';
  }).join('');
  document.getElementById('d-title').textContent=g.title;
  document.getElementById('d-sub').textContent=g.route+' · '+g.date+' · '+g.people+' 人 · '+g.reviews.length+' 条评价';
  document.getElementById('d-body').innerHTML=
    '<div class="ftitle" style="margin-top:0">研学活动内容</div>'+
    '<p class="text-[13px] text-[#334155] leading-relaxed">'+g.content+'</p>'+
    '<div class="ftitle">照片（'+g.photos.length+'）</div>'+
    '<div class="flex gap-3 flex-wrap">'+photos+'</div>'+
    '<div class="ftitle">用户留言评价（'+g.reviews.length+'）</div>'+reviews;
  document.getElementById('d-foot').innerHTML=
    '<button class="btn btn-ghost py-2.5" onclick="closeD()">关闭</button>'+
    (g.status==='shown'
      ? '<button class="btn btn-primary py-2.5 px-6" onclick="toggleGlory('+g.id+');closeD()">隐藏该风采</button>'
      : '<button class="btn btn-primary py-2.5 px-6" onclick="toggleGlory('+g.id+');closeD()">展示该风采</button>');
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}

function toggleGlory(id){
  GLORIES.forEach(function(g){if(g.id===id)g.status=g.status==='shown'?'hidden':'shown';});
  renderGlories();
  toast('已更新展示状态并同步买家端');
}

function closeD(){document.getElementById('mask').classList.remove('on');document.getElementById('drawer').classList.remove('on');}
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},2200);}

renderGlories();
</script>
</body>
</html>
