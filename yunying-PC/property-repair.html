<title>物业服务 - 报修工单</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.stat-card{transition:box-shadow .2s ease,transform .2s ease;cursor:pointer}
.stat-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.08);transform:translateY(-1px)}
.tb th{font-size:12px;font-weight:600;color:#64748B;background:#F8FAFC;padding:10px 12px;text-align:left;white-space:nowrap}
.tb td{font-size:13px;color:#1F2430;padding:11px 12px;border-bottom:1px solid #F1F5F9;white-space:nowrap}
.tb tbody tr:hover{background:#FFF7F5}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}
.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}
.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}
.lk-gray:hover{color:#1F2430}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:600px;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.fl{display:block;font-size:12px;color:#64748B;margin-bottom:5px}
.fl i{color:#FF4D2D;font-style:normal;margin-right:2px}
.fi{width:100%;padding:8px 11px;font-size:13px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;outline:none;transition:.15s}
.fi:focus{border-color:#FF4D2D;background:#fff}
.thumb{width:56px;height:40px;border-radius:6px;background:linear-gradient(135deg,#64748B,#94A3B8);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.thumb::after{content:'';position:absolute;left:0;bottom:0;right:0;height:12px;background:rgba(0,0,0,.45)}
.ph-big{width:100%;height:150px;border-radius:10px;background:linear-gradient(135deg,#94A3B8,#CBD5E1);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;position:relative}
.ph-big .wm{position:absolute;left:8px;bottom:6px;font-size:10px;opacity:.9}
.blk{border:1px solid #F1F5F9;border-radius:12px;padding:13px 15px}
.blk-t{font-size:12px;font-weight:700;color:#1F2430;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.kv{display:flex;gap:10px;font-size:12px;padding:4px 0;line-height:1.6}
.kv .k{color:#94A3B8;width:78px;flex-shrink:0}
.kv .v{color:#1F2430;flex:1}
.tl{position:relative;padding-left:16px}
.tl::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:#E2E8F0}
.tl-i{position:relative;padding:0 0 12px;font-size:12px;color:#64748B;line-height:1.6}
.tl-i::before{content:'';position:absolute;left:-16px;top:5px;width:7px;height:7px;border-radius:50%;background:#FF4D2D}
.tl-i b{color:#1F2430;font-weight:600}
.tab-on{color:#FF4D2D;border-bottom:2px solid #FF4D2D;font-weight:600}
.empty{padding:56px 0;text-align:center;color:#CBD5E1}
.empty i{font-size:30px;display:block;margin-bottom:8px}

<body>
<div class="p-6">

  <!-- 头部 -->
  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">报修工单</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">07 物业服务</span>
        <span class="tag" style="background:#FFEDE7;color:#E63E20">照片必传</span>
        <span class="tag" style="background:#FEF3C7;color:#B45309">需物料转交办单</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-1">商户端提交 或 物业巡逻发现 → 受理派单 → 处理（<b>前后照片</b>）→ 需物料则进「待采购池」，攒批走交办单审批与核销。报修单号 <b>BX + 年月 + 序号</b>；同一照片不可复用（哈希去重）；超时自动提醒。</p>
    </div>
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost" onclick="toast('已导出报修清单（含位置 / 类型 / 处理人 / 停留时长）')"><i class="fas fa-download text-[10px] mr-1"></i>导出</button>
      <button class="btn btn-primary" onclick="openNew()"><i class="fas fa-plus mr-1"></i>新增报修（巡逻）</button>
    </div>
  </div>

  <!-- 统计卡 -->
  <div class="grid grid-cols-5 gap-3 mb-5" id="stats"></div>

  <!-- Tab -->
  <div class="flex items-center gap-5 mb-3 border-b border-gray-200" id="tabs">
    <span class="py-2.5 text-[13px] cursor-pointer tab-on" onclick="switchTab('',this)">全部 <span class="text-[11px] text-[#94A3B8]" id="c-all"></span></span>
    <span class="py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600" onclick="switchTab('待受理',this)">待受理 <span class="text-[11px]" id="c-wait"></span></span>
    <span class="py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600" onclick="switchTab('处理中',this)">处理中 <span class="text-[11px]" id="c-doing"></span></span>
    <span class="py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600" onclick="switchTab('待采购',this)">待采购 <span class="text-[11px]" id="c-mat"></span></span>
    <span class="py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600" onclick="switchTab('待确认',this)">待确认 <span class="text-[11px]" id="c-conf"></span></span>
    <span class="py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600" onclick="switchTab('已完成',this)">已完成 <span class="text-[11px]" id="c-done"></span></span>
    <span class="py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600" onclick="switchTab('已驳回',this)">已驳回 <span class="text-[11px]" id="c-rej"></span></span>
  </div>

  <!-- 筛选 -->
  <div class="bg-white rounded-xl border border-gray-100 p-3 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-kw" type="text" placeholder="报修编号 / 位置 / 报修人" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-56" onkeydown="if(event.key==='Enter')doSearch()">
      <select id="f-src" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部来源</option><option>商户端</option><option>物业巡逻</option><option>巡检转单</option>
      </select>
      <select id="f-type" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部故障类型</option><option>照明</option><option>水电</option><option>门窗</option><option>地砖</option><option>空调</option><option>其他</option>
      </select>
      <select id="f-urg" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部紧急度</option><option>紧急</option><option>一般</option>
      </select>
      <label class="flex items-center gap-1.5 text-[12px] text-gray-600"><input type="checkbox" id="f-slow" class="accent-[#FF4D2D]">仅看超时</label>
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
      <span class="text-[11px] text-[#94A3B8] ml-auto"><i class="fas fa-circle-info mr-1"></i>超时基线：待受理 <b>2 小时</b> · 待采购 <b>30 天</b> 未核销</span>
    </div>
  </div>

  <!-- 列表 -->
  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-[13px] font-bold text-[#1F2430]">报修列表</span>
        <span class="text-[12px] text-[#94A3B8]" id="cnt">共 0 条</span>
      </div>
      <span class="text-[11px] text-[#94A3B8]"><i class="fas fa-circle-info mr-1"></i>照片水印含「时间 · 位置 · 单号」，拍摄与提交间隔 &gt;24h 标「凭证存疑」</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-[13px] tb" style="min-width:1240px">
        <thead><tr>
          <th>报修编号</th><th>位置</th><th>报修人</th><th>故障类型</th><th>紧急度</th><th>照片</th><th>状态</th><th>停留时长</th><th class="text-center">操作</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="px-5 py-3 border-t border-gray-100 flex items-center justify-between text-[12px] text-[#94A3B8]">
      <span id="pageInfo">共 0 条记录</span>
      <span>第 1 页</span>
    </div>
  </div>
</div>

<div class="mask" id="mask" onclick="closeAll()"></div>
<div class="drawer" id="drawer"></div>
<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[80]"></div>

var curRows=BX.slice(), curTab='', curNo=null;
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},3000);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function bOf(no){return BX.filter(function(x){return x.no===no;})[0];}
function st(s){return '<span class="tag" style="'+(STC[s]||'background:#F1F5F9;color:#64748B')+'">'+esc(s)+'</span>';}
function isSlow(x){return (x.state==='待受理'&&x.hours>2)||(x.state==='待采购'&&x.hours>720);}
function tabOf(x){return (x.state==='已派单'||x.state==='处理中')?'处理中':x.state;}

function renderStats(){
  var wait=0,doing=0,mat=0,conf=0,done=0;
  BX.forEach(function(x){
    if(x.state==='待受理') wait++;
    else if(x.state==='已派单'||x.state==='处理中') doing++;
    else if(x.state==='待采购') mat++;
    else if(x.state==='待确认') conf++;
    else if(x.state==='已完成') done++;
  });
  var cards=[['待受理',wait,'#B45309'],['处理中',doing,'#2563EB'],['待采购',mat,'#E63E20'],['待确认',conf,'#6D28D9'],['本月已完成',done,'#15803D']];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    var tabName=(x[0]==='本月已完成')?'已完成':x[0];
    return '<div class="stat-card bg-white rounded-lg border border-gray-100 p-3.5" onclick="switchTab(\''+tabName+'\')">'
      +'<p class="text-[11px] text-gray-400">'+x[0]+'</p>'
      +'<p class="text-xl font-bold mt-1" style="color:'+x[2]+'">'+x[1]+'</p></div>';
  }).join('');
  document.getElementById('c-all').textContent='('+BX.length+')';
  document.getElementById('c-wait').textContent='('+wait+')';
  document.getElementById('c-doing').textContent='('+doing+')';
  document.getElementById('c-mat').textContent='('+mat+')';
  document.getElementById('c-conf').textContent='('+conf+')';
  document.getElementById('c-done').textContent='('+done+')';
  document.getElementById('c-rej').textContent='('+BX.filter(function(x){return x.state==='已驳回';}).length+')';
}

function render(){
  var h='';
  curRows.forEach(function(x){
    var ops='<span class="lk-gray" onclick="openDetail(\''+x.no+'\')">查看</span>';
    if(x.state==='待受理'){
      ops='<span class="lk" onclick="openAccept(\''+x.no+'\')">受理派单</span> · <span class="lk-gray" onclick="openReject(\''+x.no+'\')">驳回</span> · '+ops;
    }else if(x.state==='已派单'||x.state==='处理中'){

function switchTab(s,el){
  curTab=s;
  document.querySelectorAll('#tabs span').forEach(function(x){x.className='py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600';});
  if(el) el.className='py-2.5 text-[13px] cursor-pointer tab-on';
  curRows=BX.filter(function(x){return !s||tabOf(x)===s;});
  render();
}
function doSearch(){
  var kw=document.getElementById('f-kw').value.trim(),src=document.getElementById('f-src').value,
      type=document.getElementById('f-type').value,urg=document.getElementById('f-urg').value,
      slow=document.getElementById('f-slow').checked;
  curRows=BX.filter(function(x){
    return (!kw||x.no.indexOf(kw)>-1||x.unit.indexOf(kw)>-1||x.reporter.indexOf(kw)>-1||x.desc.indexOf(kw)>-1)
      &&(!src||x.src===src)&&(!type||x.type===type)&&(!urg||x.urg===urg)
      &&(!slow||isSlow(x))&&(!curTab||tabOf(x)===curTab);
  });
  render();
  toast('已按条件查询，共 '+curRows.length+' 条');
}
function resetSearch(){
  ['f-kw','f-src','f-type','f-urg'].forEach(function(k){document.getElementById(k).value='';});
  document.getElementById('f-slow').checked=false;
  curTab='';curRows=BX.slice();
  document.querySelectorAll('#tabs span').forEach(function(x,i){x.className=i===0?'py-2.5 text-[13px] cursor-pointer tab-on':'py-2.5 text-[13px] text-gray-400 cursor-pointer hover:text-gray-600';});
  render();toast('已重置筛选条件');
}

var newPhoto=0;
function pickPhoto(){
  newPhoto++;
  document.getElementById('n_photo_box').innerHTML='<i class="fas fa-image"></i>';
  document.getElementById('n_photo_box').style.background='linear-gradient(135deg,#34D399,#059669)';
  document.getElementById('n_photo_tip').textContent='已上传 '+newPhoto+' 张（水印：2026-10-27 '+new Date().toTimeString().slice(0,5)+' · 自动带位置与单号）';
  toast('已拍摄/选择照片 '+newPhoto+' 张（微信端将自动生成水印）');
}
function saveNew(){
  var pl=document.getElementById('n_pl').value;
  var bf=document.getElementById('n_bf').value.trim();
  var unit=document.getElementById('n_unit').value.trim();
  var type=document.getElementById('n_type').value;
  var desc=document.getElementById('n_desc').value.trim();
  var urg=document.getElementById('n_urg').value;
  if(!bf||!unit){toast('请填写楼栋楼层与档口位置');return;}
  if(desc.length<5){toast('请描述故障现象（至少 5 个字）');return;}
  if(!newPhoto){toast('请上传现场照片（至少 1 张）');return;}
  var no='BX202610-00'+(32+BX.length);
  var b=bf.split(' ')[0],f=bf.split(' ')[1]||'';
  BX.unshift({no:no, src:'物业巡逻', reporter:'物业 值班人员', pl:pl, b:b, f:f, unit:unit,
    type:type, desc:desc, urg:urg, state:'待受理', hours:0, photos:newPhoto, doubt:false,
    createdAt:'2026-10-27 '+new Date().toTimeString().slice(0,5), expect:'',
    logs:[['2026-10-27 '+new Date().toTimeString().slice(0,5),'物业巡逻上报（照片 '+newPhoto+' 张，水印合规）']]});
  newPhoto=0;
  curRows=BX.slice();curTab='';
  renderStats();render();closeAll();
  toast('已提交报修：'+no+'　已通知物业受理（超 2 小时未受理将提醒主管）');
}

  var x=bOf(no);

  if(!arr){toast('请填写预计到场时间');return;}
  x.state='已派单';x.acceptBy='物业 张××';x.worker=w;x.hours=0;
  x.arriveAt=arr.replace('T',' ');
  x.logs.push(['2026-10-27 '+new Date().toTimeString().slice(0,5),'物业受理并派单（'+w+'，预计 '+x.arriveAt+' 到场）']);

  renderStats();render();closeAll();

        .map(function(w){return '<option>'+w+'</option>';}).join('')+'</select></div>'
    +'<div><label class="fl">补充说明</label><input class="fi" id="r_note" placeholder="选填，如：请自行联系装修方处理"></div>';
  h+='</div><div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeAll()">取消</button>'
    +'<button class="btn btn-primary" style="background:#B91C1C" onclick="saveReject(\''+no+'\')">确认驳回</button></div>';
  document.getElementById('drawer').innerHTML=h;show();
}
function saveReject(no){
  var x=bOf(no);
  var why=document.getElementById('r_why').value;
  var note=document.getElementById('r_note').value.trim();
  if(!why){toast('驳回原因必填');return;}
  x.state='已驳回';x.rejectWhy=why+(note?'（'+note+'）':'');x.hours=0;
  x.logs.push(['2026-10-27 '+new Date().toTimeString().slice(0,5),'物业驳回：'+x.rejectWhy]);
  renderStats();render();closeAll();
  toast('已驳回：'+no+'　已通知报修人');
}

/* ================= 提交处理结果 ================= */
function openResult(no){
  curNo=no;var x=bOf(no);
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">提交处理结果</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+esc(x.no)+'　'+esc(x.unit)+'　'+esc(x.type)+'</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:12px">'
    +'<div class="blk"><div class="kv"><span class="k">问题描述</span><span class="v">'+esc(x.desc)+'</span></div></div>'
    +'<div><label class="fl"><i>*</i>处理说明</label><input class="fi" id="w_desc" placeholder="如：更换 LED 灯管 2 支，通电测试正常"></div>'
    +'<div><label class="fl"><i>*</i>处理后照片</label>'
    +'<div class="flex gap-2"><div class="thumb" style="width:88px;height:66px" onclick="afterPhoto()" id="w_photo_box"><i class="fas fa-camera"></i></div>'
    +'<div class="thumb" style="width:88px;height:66px;background:linear-gradient(135deg,#94A3B8,#CBD5E1)"><i class="fas fa-image"></i></div></div>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1" id="w_photo_tip">左侧为处理前参考；处理后照片至少 1 张</p></div>'
    +'<div><label class="fl"><i>*</i>是否消耗物料</label><select class="fi" id="w_mat" onchange="matTip()">'
      +'<option>否</option><option>是（需采购）</option></select>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1" id="w_mat_tip">选「是」后本单进入<b>待采购池</b>，等攒批建交办单审批</p></div>';
  h+='</div><div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeAll()">取消</button>'
    +'<button class="btn btn-primary" onclick="saveResult(\''+no+'\')">提交结果</button></div>';
  document.getElementById('drawer').innerHTML=h;
  wPhoto=0;show();
}
var wPhoto=0;
function afterPhoto(){
  wPhoto++;
  document.getElementById('w_photo_box').innerHTML='<i class="fas fa-image"></i>';
  document.getElementById('w_photo_box').style.background='linear-gradient(135deg,#34D399,#059669)';
  document.getElementById('w_photo_tip').textContent='已上传处理后照片 '+wPhoto+' 张';
  toast('已上传处理后照片 '+wPhoto+' 张');
}
function matTip(){
  var v=document.getElementById('w_mat').value;
  document.getElementById('w_mat_tip').innerHTML=(v==='否')
    ? '无需物料 → 提交后转<b>待确认</b>，商户确认或 3 天自动确认'
    : '选「是」后本单进入<b>待采购池</b>，等攒批建交办单审批；<b>物料核销完成前本单不关闭</b>';
}
function saveResult(no){
  var x=bOf(no);
  var desc=document.getElementById('w_desc').value.trim();
  var mat=document.getElementById('w_mat').value;
  if(desc.length<5){toast('请填写处理说明（至少 5 个字）');return;}
  if(!wPhoto){toast('请上传处理后照片（至少 1 张）');return;}
  x.resultDesc=desc;
  x.logs.push(['2026-10-27 '+new Date().toTimeString().slice(0,5),'提交处理结果（含处理后照片 '+wPhoto+' 张）']);
  if(mat==='否'){
    x.state='待确认';x.needMat=false;x.hours=0;x.confirmState='待确认（超 3 天自动确认）';
    x.logs.push(['2026-10-27 '+new Date().toTimeString().slice(0,5),'无需物料 → 转待确认，已通知商户确认']);
    toast('已提交：'+no+'　转「待确认」，已通知商户（3 天未确认自动完成）');
  }else{
    x.state='待采购';x.needMat=true;x.hours=0;
    x.logs.push(['2026-10-27 '+new Date().toTimeString().slice(0,5),'需采购物料 → 进入待采购池']);
    toast('已提交：'+no+'　已进入待采购池（当前 '+BX.filter(function(y){return y.state==='待采购'&&!y.jbNo;}).length+' 单待组批）');
  }
  wPhoto=0;
  curRows=BX.slice();
  renderStats();render();closeAll();
}

/* 商户端「未修好」回写：待确认 → 处理中（留痕，不算新单）
   对应商户端 shanghu-APP/repair-records.html 的「未修好」按钮 */
function backToDoing(no){
  var x=bOf(no);
  if(x.state!=='待确认'){toast('仅「待确认」状态可退回');return;}
  if(!confirm('将 '+no+' 退回「处理中」？\n\n适用于商户在端上点了「未修好」。退回后：\n· 本次处理结果保留留痕\n· 需重新处理并再次提交结果\n· 不计入完成量、不产生新单')) return;
  x.state='处理中';x.hours=0;
  x.logs.push(['2026-10-28 '+new Date().toTimeString().slice(0,5),
    '商户反馈「未修好」→ 退回处理中，已通知 '+x.worker+' 与物业主管（原处理结果保留留痕）']);
  curRows=BX.slice();
  renderStats();render();closeAll();
  toast('已退回处理中：'+no+'　已通知维修工与主管重新处理（原结果留痕，不重复计完成）');
}
</script>
