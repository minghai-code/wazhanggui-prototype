<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容管理 - 公告通知</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}.lk-gray:hover{color:#1F2430;text-decoration:underline}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:760px;max-width:96vw;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:70;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:780px;max-width:95vw;max-height:86vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:.22s;z-index:70}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.blk{border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px}
.blk-t{font-size:12.5px;font-weight:700;color:#1F2430;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kv{display:flex;gap:8px;font-size:12px;line-height:1.9}
.kv .k{width:118px;flex-shrink:0}
.fi{width:100%;padding:6px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none;background:#fff}
.fi:focus{border-color:#FF4D2D}
.fl{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.sel{width:100%;padding:6px 8px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none}
button{cursor:pointer}
textarea.fi{font-family:inherit;line-height:1.8;resize:vertical}
.ck{display:flex;align-items:flex-start;gap:7px;font-size:12px;color:#334155;line-height:1.7;padding:5px 0}
.ck input{margin-top:3px}
.opt{flex:1;border:1px solid #E2E8F0;border-radius:10px;padding:10px;text-align:center;cursor:pointer;font-size:12px;color:#64748B;background:#fff;transition:.15s}
.opt.on{border-color:#FF4D2D;background:#FFF6F3;color:#E63E20;font-weight:600}
.thumb{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
</style>
<!-- Tailwind 静态样式：本地引用（不再依赖 cdn.tailwindcss.com）；改动页面后重新构建见 wazhanggui-code/_tw-build/build.ps1 -->
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="p-6">

  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">公告通知</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">09 内容管理</span>
        <span class="tag" style="background:#FEF3C7;color:#B45309">定向发布</span>
        <span class="tag" style="background:#DCFCE7;color:#15803D">可联动消息推送</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-1">平台公告的定向发布：选<b>通知对象（全平台 / 仅买家 / 仅商户）</b>即自动决定投放到哪些端（<b>买家端消息中心 / 商户端通知公告 / 商户端工作台</b>）；支持<b>置顶显著提示</b>、有效期与定时、可选<b>同步推送消息</b>（站内 + 微信）；历史公告长期可查、可按类别筛选与关键词搜索（投标 4.1.5.4）</p>
    </div>
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost" onclick="openSlots()"><i class="fas fa-table-cells-large text-[10px] mr-1"></i>投放位字典</button>
      <button class="btn btn-ghost" onclick="toast('已导出公告台账（含通知对象、置顶、有效期、推送记录、已读率）')"><i class="fas fa-download text-[10px] mr-1"></i>导出</button>
      <button class="btn btn-primary" onclick="openEdit(null)"><i class="fas fa-plus mr-1"></i>新增公告</button>
    </div>
  </div>

  <div class="grid grid-cols-5 gap-3 mb-4" id="stats"></div>

  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-kw" type="text" placeholder="标题 / 正文关键词 / 创建人" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-56">
      <select id="f-to" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部通知对象</option><option>全平台</option><option>仅买家</option><option>仅商户</option>
      </select>
      <select id="f-cat" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600"><option value="">全部类别</option></select>
      <select id="f-state" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部状态</option><option>草稿</option><option>待审核</option><option>已驳回</option><option>待发布</option><option>生效中</option><option>已下线</option><option>已过期</option>
      </select>
      <label class="flex items-center gap-1.5 text-[12px] text-gray-600"><input type="checkbox" id="f-top" class="accent-[#FF4D2D]">仅看置顶</label>
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
      <span class="text-[11px] text-[#94A3B8] ml-auto"><i class="fas fa-circle-info mr-1"></i>置顶上限 <b>3 条</b>（超出保存即拦截）；置顶不改动有效期判定</span>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-[13px] font-bold text-[#1F2430]">公告列表</span>
        <span class="text-[12px] text-[#94A3B8]" id="cnt">共 0 条</span>
      </div>
      <span class="text-[11px] text-[#94A3B8]"><i class="fas fa-clock-rotate-left mr-1"></i>历史公告长期可查（默认倒序，可回溯全部历史版本内容）</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-[13px]" style="min-width:1380px">
        <thead>
          <tr class="bg-gray-50 text-gray-500 text-[12px]">
            <th class="px-4 py-3 text-left font-medium">标题 / 类别</th>
            <th class="px-4 py-3 text-left font-medium">通知对象</th>
            <th class="px-4 py-3 text-left font-medium">投放位（自动带出）</th>
            <th class="px-4 py-3 text-left font-medium">有效期（定时）</th>
            <th class="px-4 py-3 text-left font-medium">置顶</th>
            <th class="px-4 py-3 text-left font-medium">消息推送</th>
            <th class="px-4 py-3 text-left font-medium">状态</th>
            <th class="px-4 py-3 text-center font-medium">操作</th>
          </tr>
        </thead>
        <tbody id="tb" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <span class="text-[12px] text-gray-400" id="pageInfo">共 0 条记录</span>
      <div class="flex items-center gap-1">
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="toast('已是第一页（原型）')"><i class="fas fa-chevron-left text-[10px]"></i></button>
        <button class="w-7 h-7 flex items-center justify-center text-white text-[12px] rounded" style="background:#FF4D2D" onclick="toast('当前第 1 页（原型）')">1</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="toast('已切换到第 2 页（原型）')"><i class="fas fa-chevron-right text-[10px]"></i></button>
      </div>
    </div>
  </div>

</div>

<div id="mask" class="mask" onclick="closeAll()"></div>
<div id="drawer" class="drawer"></div>
<div id="modal" class="modal"></div>
<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[80]"></div>

<script>
/* ================= 投放位字典（公告类） ================= */
var SLOTS=[
  {id:'T-BUY-MSG', end:'买家端 App', page:'消息中心', pos:'公告类别', max:20, spec:'纯文本；标题 ≤30 字', on:true},
  {id:'T-SH-NOTICE', end:'商户端 App', page:'通知公告', pos:'列表（含详情页）', max:20, spec:'纯文本 / 富文本正文', on:true},
  {id:'T-SH-WORK', end:'商户端 App', page:'工作台', pos:'平台通知位（最新 3 条）', max:3, spec:'标题 ≤24 字', on:true}
];
/* 通知对象 → 投放位（自动带出，避免选错端） */
var TO_SLOTS={'全平台':['T-BUY-MSG','T-SH-NOTICE','T-SH-WORK'],'仅买家':['T-BUY-MSG'],'仅商户':['T-SH-NOTICE','T-SH-WORK']};
var CATS=['平台公告','物业通知','政策制度','活动通知','系统维护'];
var STC={'草稿':'background:#F1F5F9;color:#64748B','待审核':'background:#FEF3C7;color:#B45309','已驳回':'background:#FEE2E2;color:#B91C1C',
  '待发布':'background:#DBEAFE;color:#2563EB','生效中':'background:#DCFCE7;color:#15803D','已下线':'background:#F1F5F9;color:#475569','已过期':'background:#F1F5F9;color:#94A3B8'};
var CH=['站内推送','微信消息推送'];
var TOPMAX=3;

/* ================= 模拟数据（原型态） ================= */
var NT=[
  {id:'TG2026-0021', title:'关于 2026 年度租金缴纳的通知', cat:'物业通知', to:'全平台', top:true,
   start:'2026-09-20 09:00', end:'2026-11-15 23:59', state:'生效中', push:true, ch:['站内推送','微信消息推送'], msg:'MSG2026-0088',
   sent:1840, read:1226, by:'内容运营 何静', up:'2026-09-20 09:05'},
  {id:'TG2026-0022', title:'平台服务时间调整公告（国庆期间）', cat:'系统维护', to:'全平台', top:false,
   start:'2026-09-30 00:00', end:'2026-10-08 23:59', state:'已过期', push:true, ch:['站内推送'], msg:'MSG2026-0091',
   sent:1840, read:1610, by:'内容运营 何静', up:'2026-09-29 17:40'},
  {id:'TG2026-0023', title:'【仅商户】冬季用电安全提示', cat:'物业通知', to:'仅商户', top:true,
   start:'2026-10-01 00:00', end:'2026-12-31 23:59', state:'生效中', push:true, ch:['站内推送','微信消息推送'], msg:'MSG2026-0094',
   sent:326, read:298, by:'物业管理 周敏', up:'2026-10-01 10:20'},
  {id:'TG2026-0024', title:'袜博会观众预约通道开启', cat:'活动通知', to:'仅买家', top:false,
   start:'2026-10-15 00:00', end:'2026-11-30 23:59', state:'待发布', push:true, ch:['站内推送','微信消息推送'], msg:'MSG2026-0096',
   sent:0, read:0, by:'内容运营 何静', up:'2026-10-08 15:12'},
  {id:'TG2026-0025', title:'秋冬新品季招商公告（含展位政策）', cat:'平台公告', to:'仅商户', top:false,
   start:'2026-10-20 00:00', end:'2026-12-31 23:59', state:'待审核', push:true, ch:['站内推送'], msg:'',
   sent:0, read:0, by:'内容运营 何静', up:'2026-10-09 09:35'},
  {id:'TG2026-0026', title:'【已驳回】某品牌优惠活动公告', cat:'活动通知', to:'全平台', top:false,
   start:'2026-10-10 00:00', end:'2026-10-31 23:59', state:'已驳回', push:false, ch:[], msg:'',
   sent:0, read:0, by:'内容运营 何静', up:'2026-10-09 10:02', rj:'含未审批的促销折扣承诺，请与商城运营确认后重提'},
  {id:'TG2026-0027', title:'春节放假安排（历史归档）', cat:'平台公告', to:'全平台', top:false,
   start:'2026-02-10 00:00', end:'2026-02-28 23:59', state:'已过期', push:true, ch:['站内推送'], msg:'MSG2026-0012',
   sent:1620, read:1440, by:'内容运营 何静', up:'2026-02-05 11:00'},
  {id:'TG2026-0028', title:'原料市场价格指数解读会报名（草稿）', cat:'活动通知', to:'仅商户', top:false,
   start:'2026-10-20 00:00', end:'2026-11-10 23:59', state:'草稿', push:false, ch:[], msg:'',
   sent:0, read:0, by:'内容运营 何静', up:'2026-10-09 10:30'}
];
var curRows=NT.slice(),curId=null;
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},2900);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nOf(id){return NT.filter(function(x){return x.id===id;})[0];}
function slotOf(id){return SLOTS.filter(function(s){return s.id===id;})[0];}
function st(s,c){return '<span class="st" style="'+(c||STC[s]||'background:#F1F5F9;color:#64748B')+'">'+esc(s)+'</span>';}
function slotsOf(n){return TO_SLOTS[n.to]||[];}
function topCount(){return NT.filter(function(n){return n.top&&(n.state==='生效中'||n.state==='待发布'||n.state==='待审核');}).length;}

function renderStats(){
  var live=0,wait=0,audit=0,exp=0,push=0;
  NT.forEach(function(n){
    if(n.state==='生效中'){live++;}
    if(n.state==='待发布'){wait++;}
    if(n.state==='待审核'){audit++;}
    if(n.state==='已过期'){exp++;}
    if(n.push){push++;}
  });
  var cards=[['生效中',live,'#15803D'],['待发布（定时未到）',wait,'#2563EB'],['待审核',audit,'#B45309'],
    ['置顶使用（上限 '+TOPMAX+'）',topCount()+' / '+TOPMAX,'#E63E20'],['联动消息推送',push,'#7C3AED']];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    return '<div class="bg-white rounded-lg border border-gray-100 p-3.5"><p class="text-[11px] text-gray-400">'+x[0]+'</p><p class="text-xl font-bold mt-1" style="color:'+x[2]+'">'+x[1]+'</p></div>';
  }).join('');
}
function renderCatFilter(){
  document.getElementById('f-cat').innerHTML='<option value="">全部类别</option>'+CATS.map(function(c){return '<option>'+c+'</option>';}).join('');
}
function render(){
  var h='';
  curRows.forEach(function(n){
    var ops='<span class="lk-gray" onclick="openDetail(\''+n.id+'\')">详情</span>';
    if(n.state==='草稿'||n.state==='已驳回'){ops='<span class="lk" onclick="openEdit(\''+n.id+'\')">编辑</span> · <span class="lk" onclick="submitN(\''+n.id+'\')">提交审核</span> · <span class="lk-gray" onclick="delN(\''+n.id+'\')">删除</span> · '+ops;}
    if(n.state==='待审核'){ops='<span class="lk" onclick="openAudit(\''+n.id+'\')">审核</span> · '+ops;}
    if(n.state==='生效中'||n.state==='待发布'){ops='<span class="lk-gray" onclick="offline(\''+n.id+'\')">下线</span> · <span class="lk-gray" onclick="toggleTop(\''+n.id+'\')">'+(n.top?'取消置顶':'置顶')+'</span> · '+ops;}
    if(n.state==='已过期'||n.state==='已下线'){ops='<span class="lk-gray" onclick="rollback(\''+n.id+'\')">重新发布</span> · '+ops;}
    var toTag=(n.to==='全平台'?'background:#DBEAFE;color:#2563EB':(n.to==='仅商户'?'background:#EDE9FE;color:#6D28D9':'background:#DCFCE7;color:#15803D'));
    var slotTxt=slotsOf(n).map(function(s){var o=slotOf(s);return '<div class="text-[11px] text-[#64748B]">'+esc(o.end)+' · '+esc(o.page)+' · '+esc(o.pos)+'</div>';}).join('');
    h+='<tr class="hover:bg-gray-50 transition">'
      +'<td class="px-4 py-3" style="max-width:330px"><div class="font-medium text-[#1F2430]">'+(n.top?'<span class="tag mr-1" style="background:#FFEDE7;color:#E63E20"><i class="fas fa-thumbtack text-[9px]"></i>置顶</span>':'')+esc(n.title)+'</div>'
        +'<div class="text-[11px] text-[#94A3B8] mt-1">'+esc(n.id)+'　'+esc(n.cat)+'　'+esc(n.by)+'　'+esc(n.up)+'</div>'
        +(n.rj?'<div class="text-[11px] mt-1" style="color:#B91C1C">已驳回：'+esc(n.rj.slice(0,16))+'…</div>':'')+'</td>'
      +'<td class="px-4 py-3"><span class="tag" style="'+toTag+'">'+esc(n.to)+'</span></td>'
      +'<td class="px-4 py-3">'+slotTxt+'</td>'
      +'<td class="px-4 py-3 text-[12px] text-[#64748B]">'+esc(n.start)+'<br>~ '+esc(n.end)+'</td>'
      +'<td class="px-4 py-3">'+(n.top?'<span class="st" style="background:#FFEDE7;color:#E63E20">已置顶</span>':'<span class="text-[12px] text-[#94A3B8]">—</span>')+'</td>'
      +'<td class="px-4 py-3 text-[12px]">'+(n.push?('<span class="tag" style="background:#EDE9FE;color:#6D28D9">'+esc(n.ch.join(' + '))+'</span>'
          +(n.msg?'<div class="text-[11px] text-[#64748B] mt-1">任务 '+esc(n.msg)+'</div>':'<div class="text-[11px] text-[#94A3B8] mt-1">待发布后生成任务</div>')
          +(n.sent?'<div class="text-[11px] text-[#94A3B8] mt-1">送达 '+n.sent+' · 已读 '+n.read+'（'+Math.round(n.read/n.sent*100)+'%）</div>':''))
        :'<span class="text-[12px] text-[#94A3B8]">不推送</span>')+'</td>'
      +'<td class="px-4 py-3">'+st(n.state)+'</td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'+ops+'</td></tr>';
  });
  if(!curRows.length){h='<tr><td colspan="8" class="px-4 py-16 text-center text-gray-300"><i class="fas fa-inbox text-3xl block mb-2"></i><span class="text-[12px]">暂无匹配的公告</span></td></tr>';}
  document.getElementById('tb').innerHTML=h;
  document.getElementById('cnt').textContent='共 '+curRows.length+' 条';
  document.getElementById('pageInfo').textContent='共 '+curRows.length+' 条记录，第 1-'+curRows.length+' 条';
}
function doSearch(){
  var kw=document.getElementById('f-kw').value.trim(),to=document.getElementById('f-to').value,
      cat=document.getElementById('f-cat').value,stt=document.getElementById('f-state').value,onlyTop=document.getElementById('f-top').checked;
  curRows=NT.filter(function(n){
    var hitKw=!kw||n.title.indexOf(kw)>-1||n.by.indexOf(kw)>-1||n.id.indexOf(kw)>-1||n.body&&n.body.indexOf(kw)>-1;
    return hitKw&&(!to||n.to===to)&&(!cat||n.cat===cat)&&(!stt||n.state===stt)&&(!onlyTop||n.top);
  });
  render();toast('已按条件查询，共 '+curRows.length+' 条（支持关键词 / 通知对象 / 类别 / 状态 / 仅看置顶）');
}
function resetSearch(){

function pickTo(el,x){
  var box=document.getElementById('toBox');
  for(var i=0;i<box.children.length;i++){box.children[i].className='opt';}
  el.className='opt on';
  updToHint(x);
}
function curTo(){
  var box=document.getElementById('toBox');
  for(var i=0;i<box.children.length;i++){if(box.children[i].className.indexOf('on')>-1){return box.children[i].textContent;}}
  return '全平台';
}
function updToHint(to){
  var ids=TO_SLOTS[to]||[],txt=ids.map(function(s){var o=slotOf(s);return o.end+' · '+o.page+' · '+o.pos;}).join('　｜　');
  var el=document.getElementById('toHint');
  if(el){el.innerHTML='<i class="fas fa-arrow-right mr-1"></i>将投放到：'+txt+'（'+ids.length+' 个位置，端上按此展示）';}
}
function saveN(){
  var title=document.getElementById('e-title').value.trim();
  var to=curTo();
  var top=document.getElementById('e-top').checked;
  var push=document.getElementById('e-push').checked;
  var ch=[];
  if(push){
    if(document.getElementById('e-ch1').checked){ch.push('站内推送');}
    if(document.getElementById('e-ch2').checked){ch.push('微信消息推送');}
    if(!ch.length){toast('已勾选「同步推送消息」，请至少选择一个渠道（站内推送 / 微信消息推送）');return;}
  }
  if(!title){toast('请填写标题');return;}
  if(top&&topCount()>=TOPMAX){toast('置顶已达上限 '+TOPMAX+' 条：请先取消其他置顶后再提交');return;}
  var n=curId?nOf(curId):null;
  if(n){
    n.title=title;n.cat=document.getElementById('e-cat').value;n.to=to;n.top=top;n.push=push;n.ch=ch;n.state='待审核';n.rj='';
  }else{
    n={id:'TG2026-00'+(29+NT.length), title:title, cat:document.getElementById('e-cat').value, to:to, top:top,
       start:'2026-10-15 00:00', end:'2026-11-30 23:59', state:'待审核', push:push, ch:ch, msg:'',
       sent:0, read:0, by:'内容运营 何静', up:'2026-10-09 10:40'};
    NT.unshift(n);
  }
  curRows=NT.slice();
  renderStats();render();closeAll();
  toast('已提交审核：'+n.id+'　通知对象「'+to+'」→ '+(TO_SLOTS[to]||[]).length+' 个投放位'+(push?'；已配置消息推送（'+ch.join(' + ')+'）':'；未配置推送'));
}

    +'<p class="text-[11px] text-[#64748B] leading-6">· <b>全平台</b> → 买家端消息中心 + 商户端通知公告 + 商户端工作台（3 处）<br>'
    +'· <b>仅买家</b> → 买家端消息中心（1 处）<br>'
    +'· <b>仅商户</b> → 商户端通知公告 + 商户端工作台（2 处）<br>'
    +'· 买家端公告<b>只落消息中心</b>，不做首页展示；商户端工作台只取<b>最新 3 条</b>。</p></div>'
    +'</div><div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2"><button class="btn btn-primary" onclick="closeAll()">关闭</button></div>';
  show('modal',h);
}

/* ================= 基础 ================= */
function show(which,h){
  document.getElementById(which).innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById(which).classList.add('on');
}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}
renderCatFilter();renderStats();render();
</script>
</body>
</html>
