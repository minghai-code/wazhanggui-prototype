<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商户管理 - 资质认证审核</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}.lk-gray:hover{color:#1F2430;text-decoration:underline}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:600px;max-width:96vw;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:70;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.blk{border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px}
.blk-t{font-size:12.5px;font-weight:700;color:#1F2430;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kv{display:flex;gap:8px;font-size:12px;line-height:1.9}
.kv .k{color:#94A3B8;width:88px;flex-shrink:0}
.kv .v{color:#1F2430;flex:1}
.sel{width:100%;padding:6px 8px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none}
.fl{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
button{cursor:pointer}
.thumb{width:120px;height:84px;border-radius:8px;border:1px dashed #CBD5E1;background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 8px,#F1F5F9 8px,#F1F5F9 16px);display:flex;align-items:center;justify-content:center;font-size:11px;color:#94A3B8;cursor:pointer}
</style>
<!-- Tailwind 静态样式：本地引用（不再依赖 cdn.tailwindcss.com）；改动页面后重新构建见 wazhanggui-code/_tw-build/build.ps1 -->
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="p-6">

  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">资质认证审核</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">04 商户管理</span>
        <span class="tag" style="background:#F3E8FF;color:#7C3AED">招标 #88 / #10 前置门槛</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-1">企业资质在线审批。<b>通过 → 开启询价（报价）权限；过期 → 自动冻结询价权限</b>；与商户端「企业资质认证」页一一对应</p>
    </div>
    <button class="btn btn-ghost" onclick="toast('已导出资质台账（含到期提醒清单）')"><i class="fas fa-download text-[10px] mr-1"></i>导出</button>
  </div>

  <div class="grid grid-cols-4 gap-3 mb-4" id="stats"></div>

  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-kw" type="text" placeholder="商户名称 / 证书编号" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-64">
      <select id="f-type" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部资质类型</option><option>营业执照</option><option>生产许可</option><option>品牌授权</option><option>质检报告</option>
      </select>
      <select id="f-status" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部状态</option><option>待审核</option><option>已通过</option><option>已驳回</option><option>已过期</option>
      </select>
      <select id="f-exp" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">到期提醒</option><option value="30">30 天内到期</option><option value="0">已过期</option>
      </select>
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <span class="text-[12px] text-[#94A3B8]" id="cnt">共 0 条</span>
      <span class="text-[11px] text-[#94A3B8]"><i class="fas fa-circle-info mr-1"></i>询价权限状态：已通过=已开通 ｜ 已过期/已驳回=已冻结</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-[13px]" style="min-width:1120px">
        <thead>
          <tr class="bg-gray-50 text-gray-500 text-[12px]">
            <th class="px-4 py-3 text-left font-medium">商户名称</th>
            <th class="px-4 py-3 text-left font-medium">商户类型</th>
            <th class="px-4 py-3 text-left font-medium">资质类型</th>
            <th class="px-4 py-3 text-left font-medium">证书编号</th>
            <th class="px-4 py-3 text-left font-medium">有效期</th>
            <th class="px-4 py-3 text-left font-medium">附件</th>
            <th class="px-4 py-3 text-left font-medium">提交时间</th>
            <th class="px-4 py-3 text-left font-medium">状态</th>
            <th class="px-4 py-3 text-center font-medium">操作</th>
          </tr>
        </thead>
        <tbody id="tb" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <span class="text-[12px] text-gray-400" id="pageInfo">共 0 条记录</span>
      <div class="flex items-center gap-1">
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="toast('已是第一页（原型）')"><i class="fas fa-chevron-left text-[10px]"></i></button>
        <button class="w-7 h-7 flex items-center justify-center text-white text-[12px] rounded" style="background:#FF4D2D" onclick="toast('当前第 1 页（原型）')">1</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="toast('已切换到第 2 页（原型）')"><i class="fas fa-chevron-right text-[10px]"></i></button>
      </div>
    </div>
  </div>

</div>

<div id="mask" class="mask" onclick="closeD()"></div>
<div id="drawer" class="drawer"></div>
<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[80]"></div>

<script>
/* ================= 模拟数据（原型态） ================= */
var QL=[
  {id:'QL20260928001',m:'大唐旗舰精梳棉',mt:'线上兼档口',type:'营业执照',no:'91330681MA2D1XXXX1',exp:'2024-05-10 ~ 2029-05-09',days:952,file:'营业执照.jpg',time:'2026-09-28 09:30',status:'待审核'},
  {id:'QL20260928002',m:'棉田纱线直营店',mt:'线上兼档口',type:'质检报告',no:'QC-2026-0812',exp:'2026-08-12 ~ 2027-08-11',days:317,file:'纱线质检报告.pdf',time:'2026-09-28 10:05',status:'待审核'},
  {id:'QL20260927003',m:'晓琳袜业经营部',mt:'线上兼档口',type:'营业执照',no:'92330681MA2XXXXX31',exp:'2026-09-20 ~ 2031-09-19',days:1816,file:'营业执照.jpg',time:'2026-09-27 15:40',status:'待审核'},
  {id:'QL20260926004',m:'花间舞时尚女袜馆',mt:'仅线上',type:'品牌授权',no:'HJW-2026-001',exp:'2026-01-01 ~ 2026-12-31',days:94,file:'品牌授权书.pdf',time:'2026-09-26 11:12',status:'已通过'},
  {id:'QL20260925005',m:'极速运动袜业',mt:'仅线上',type:'生产许可',no:'SC-2024-0918',exp:'2024-09-18 ~ 2026-09-17',days:-11,file:'生产许可证.jpg',time:'2026-09-25 09:20',status:'已过期'},
  {id:'QL20260924006',m:'智造袜机设备有限公司',mt:'仅线上',type:'营业执照',no:'91330681MA2D5XXXX5',exp:'2021-03-01 ~ 2026-02-28',days:-212,file:'营业执照.jpg',time:'2026-09-24 16:33',status:'已过期'},
  {id:'QL20260923007',m:'绿源竹纤维科技',mt:'仅线上',type:'质检报告',no:'QC-2025-1102',exp:'2025-11-02 ~ 2026-11-01',days:34,file:'竹纤维质检报告.pdf',time:'2026-09-23 14:08',status:'已通过'},
  {id:'QL20260922008',m:'某贸易商行',mt:'仅线上',type:'营业执照',no:'—',exp:'—',days:0,file:'营业执照.jpg',time:'2026-09-22 10:50',status:'已驳回'}
];
var RFQ={'待审核':'保持原状态','已通过':'<span style="color:#15803D">询价权限：已开通</span>','已驳回':'<span style="color:#B91C1C">询价权限：已冻结</span>','已过期':'<span style="color:#B91C1C">询价权限：已冻结（到期自动）</span>'};
var curRows=QL.slice(),curId=null;
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},2800);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var STC={'待审核':'background:#FEF3C7;color:#B45309','已通过':'background:#DCFCE7;color:#15803D','已驳回':'background:#FEE2E2;color:#B91C1C','已过期':'background:#FFEDE7;color:#E63E20'};
var TYC={'营业执照':'background:#DBEAFE;color:#2563EB','生产许可':'background:#F3E8FF;color:#7C3AED','品牌授权':'background:#FFEDE7;color:#E63E20','质检报告':'background:#DCFCE7;color:#15803D'};
function st(s,c){return '<span class="st" style="'+(c||'background:#F1F5F9;color:#64748B')+'">'+esc(s)+'</span>';}
function expTag(d){return d<0?'<span class="text-[11px]" style="color:#B91C1C">已过期 '+Math.abs(d)+' 天</span>':(d<=30?'<span class="text-[11px]" style="color:#B45309">'+d+' 天内到期</span>':'<span class="text-[11px] text-[#94A3B8]">'+d+' 天后到期</span>');}

function renderStats(){
  var wait=QL.filter(function(x){return x.status==='待审核';}).length;
  var pass=QL.filter(function(x){return x.status==='已通过';}).length;
  var soon=QL.filter(function(x){return x.days>0&&x.days<=30;}).length;
  var over=QL.filter(function(x){return x.status==='已过期';}).length;
  var cards=[['待审核资质',wait,'#B45309'],['本月通过',pass,'#15803D'],['30 天内到期',soon,'#E63E20'],['已过期（权限已冻结）',over,'#B91C1C']];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    return '<div class="bg-white rounded-lg border border-gray-100 p-3.5"><p class="text-[11px] text-gray-400">'+x[0]+'</p><p class="text-xl font-bold mt-1" style="color:'+x[2]+'">'+x[1]+'</p></div>';
  }).join('');
}
function render(){
  var h='';
  curRows.forEach(function(x){
    h+='<tr class="hover:bg-gray-50 transition">'
      +'<td class="px-4 py-3 font-medium text-[#1F2430]">'+esc(x.m)+'</td>'
      +'<td class="px-4 py-3">'+st(x.mt,x.mt==='线上兼档口'?'background:#DCFCE7;color:#15803D':'background:#F1F5F9;color:#475569')+'</td>'
      +'<td class="px-4 py-3">'+st(x.type,TYC[x.type])+'</td>'
      +'<td class="px-4 py-3 text-[#64748B] text-[12px]">'+esc(x.no)+'</td>'
      +'<td class="px-4 py-3 text-[12px]"><span class="text-[#64748B]">'+esc(x.exp)+'</span><br>'+(x.status==='已驳回'?'':expTag(x.days))+'</td>'
      +'<td class="px-4 py-3"><span class="lk" onclick="toast(\'预览：'+esc(x.file)+'\')">'+esc(x.file)+'</span></td>'
      +'<td class="px-4 py-3 text-[#94A3B8] text-[12px]">'+esc(x.time)+'</td>'
      +'<td class="px-4 py-3">'+st(x.status,STC[x.status])+'</td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'
        +(x.status==='待审核'?'<span class="lk" onclick="openD(\''+x.id+'\')">审核</span> · ':'')
        +'<span class="lk-gray" onclick="openD(\''+x.id+'\')">详情</span></td></tr>';
  });
  if(!curRows.length){h='<tr><td colspan="9" class="px-4 py-16 text-center text-gray-300"><i class="fas fa-inbox text-3xl block mb-2"></i><span class="text-[12px]">暂无匹配的资质记录</span></td></tr>';}
  document.getElementById('tb').innerHTML=h;
  document.getElementById('cnt').textContent='共 '+curRows.length+' 条（原型演示数据 8 条）';
  document.getElementById('pageInfo').textContent='共 '+curRows.length+' 条记录，第 1-'+curRows.length+' 条';
}
function doSearch(){
  var kw=document.getElementById('f-kw').value.trim(),t=document.getElementById('f-type').value,s=document.getElementById('f-status').value,e=document.getElementById('f-exp').value;
  curRows=QL.filter(function(x){
    var okE=!e||(e==='30'?(x.days>0&&x.days<=30):x.days<0);
    return (!kw||x.m.indexOf(kw)>-1||x.no.indexOf(kw)>-1)&&(!t||x.type===t)&&(!s||x.status===s)&&okE;
  });
  render();toast('已按条件查询，共 '+curRows.length+' 条');
}
function resetSearch(){
  ['f-kw','f-type','f-status','f-exp'].forEach(function(k){document.getElementById(k).value='';});
  curRows=QL.slice();render();toast('已重置筛选条件');
}
/* ================= 审核抽屉 ================= */
function openD(id){
  curId=id;
  var x=QL.filter(function(y){return y.id===id;})[0];
  if(!x){return;}
  var can=x.status==='待审核';
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">'+(can?'资质审核':'资质详情')+'　'+esc(x.id)+'</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+st(x.status,STC[x.status])+'　提交时间 '+esc(x.time)+'</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeD()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">';
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-store text-[#FF4D2D]"></i>商户与资质</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">商户名称</span><span class="v font-semibold">'+esc(x.m)+'</span></div>'
    +'<div class="kv"><span class="k">商户类型</span><span class="v">'+esc(x.mt)+'</span></div>'
    +'<div class="kv"><span class="k">资质类型</span><span class="v">'+st(x.type,TYC[x.type])+'</span></div>'
    +'<div class="kv"><span class="k">证书编号</span><span class="v">'+esc(x.no)+'</span></div>'
    +'<div class="kv"><span class="k">有效期</span><span class="v">'+esc(x.exp)+'</span></div>'
    +'<div class="kv"><span class="k">到期状态</span><span class="v">'+(x.status==='已驳回'?'—':expTag(x.days))+'</span></div>'
    +'</div>'
    +'<div class="mt-3"><span class="text-[11px] text-[#94A3B8]">资质附件</span>'
    +'<div class="flex items-center gap-3 mt-1"><div class="thumb" onclick="toast(\'预览大图：'+esc(x.file)+'\')"><i class="fas fa-image text-lg mr-1"></i>'+esc(x.file)+'</div>'
    +'<div class="thumb" onclick="toast(\'预览大图：法人身份证\')"><i class="fas fa-id-card text-lg mr-1"></i>法人身份证</div></div></div></div>';
  h+='<div class="blk" style="border-color:#BBF7D0;background:#F6FEF9"><div class="blk-t" style="color:#15803D"><i class="fas fa-key"></i>询价权限联动（招标 #88 / #10）</div>'
    +'<p class="text-[12px] text-[#64748B] leading-6">资质认证是<b>采购询价报价权限</b>的前置门槛：<br>'
    +'· <b>审核通过</b> → 自动开启询价权限（商户端可参与报价）；<br>'
    +'· <b>到期 / 驳回</b> → 自动冻结询价权限（不可报价，历史报价与订单不受影响）；<br>'
    +'· 商户重传资质 → 回到「待审核」，通过后自动解冻。<br>'
    +'当前状态：'+RFQ[x.status]+'</p></div>';
  if(can){
    h+='<div class="blk" style="border-color:#FDB4A3;background:#FFF6F3"><div class="blk-t" style="color:#E63E20"><i class="fas fa-pen-to-square"></i>审核结论</div>'
      +'<div id="rejBlk" style="display:none"><label class="fl"><span style="color:#FF4D2D">*</span> 驳回原因（必填）</label>'
      +'<select id="rejReason" class="sel"><option value="">请选择驳回原因</option><option>证件不清晰 / 缺页</option><option>资质类型不符</option><option>证书已过期</option><option>商户主体与证件不一致</option><option>其他</option></select></div>'
      +'<label class="fl" style="margin-top:8px">审核备注（选填）</label>'
      +'<textarea id="memo" rows="2" class="w-full p-2 text-[12px] border border-[#E2E8F0] rounded-lg outline-none" placeholder="补充说明，会记入资质审核轨迹"></textarea>'
      +'<div class="flex items-center gap-2 mt-3">'
      +'<button class="btn btn-primary" onclick="audit(\'pass\')">通过并开启询价权限</button>'
      +'<button class="btn btn-ghost" onclick="showRej()" style="color:#B91C1C;border-color:#FECACA">驳回</button>'
      +'<button class="btn btn-primary" id="btnRej" style="display:none;background:linear-gradient(135deg,#EF4444,#B91C1C)" onclick="audit(\'reject\')">确认驳回</button>'
      +'</div></div>';
  } else {
    h+='<div class="blk"><div class="blk-t"><i class="fas fa-clock-rotate-left text-[#64748B]"></i>审核轨迹</div>'
      +'<div class="text-[12px] text-[#64748B] leading-7">'
      +'· 提交资质认证（商户端 企业资质认证）　'+esc(x.time)+'<br>'
      +(x.status==='已通过'?'· 审核通过 → 询价权限已开通<br>':'')
      +(x.status==='已驳回'?'· 驳回　原因：资质类型不符；已通知商户重传<br>':'')
      +(x.status==='已过期'?'· 证书到期 → 系统自动冻结询价权限并通知商户<br>':'')
      +(x.status==='已通过'&&x.days<=30?'· 到期提醒已发送（提前 30 天）<br>':'')
      +'</div></div>'
      +(x.status==='已过期'?'<div class="blk"><label class="fl">到期处理</label><button class="btn btn-ghost" onclick="toast(\'已向商户发送重传提醒（站内信 + 短信）\')">发送重传提醒</button> <button class="btn btn-primary" onclick="toast(\'已重开审核：状态回到「待审核」（原型）\')">商户已重传，重开审核</button></div>':'');
  }
  h+='</div><div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeD()">关闭</button>'
    +'<button class="btn btn-ghost" onclick="location.href=\'merchant-profile.html\'">查看商户档案</button></div>';
  document.getElementById('drawer').innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function closeD(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
function showRej(){document.getElementById('rejBlk').style.display='block';document.getElementById('btnRej').style.display='inline-block';}
function audit(action){
  var x=QL.filter(function(y){return y.id===curId;})[0];
  if(!x){return;}
  if(action==='pass'){
    x.status='已通过';
    toast('已通过：询价权限已开通，商户端可参与报价；资质有效期 30 天内会提前提醒');
  } else {
    var rs=document.getElementById('rejReason').value;
    if(!rs){toast('驳回原因必填，请先选择');return;}
    x.status='已驳回';
    toast('已驳回（'+rs+'）：询价权限保持冻结，已通知商户重传');
  }
  closeD();render();renderStats();
}
renderStats();render();
</script>
</body>
</html>
