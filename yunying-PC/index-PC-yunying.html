<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营管理端 - 袜掌柜</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{
  primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'
}}}}
</script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f1f5f9;overflow:hidden}
:-webkit-scrollbar{width:6px;height:6px}
:-webkit-scrollbar-track{background:transparent}
:-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
:-webkit-scrollbar-thumb:hover{background:#94a3b8}
.sidebar-scroll::-webkit-scrollbar{width:4px}
.sidebar-scroll::-webkit-scrollbar-track{background:transparent}
.sidebar-scroll::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:2px}
.menu-group{user-select:none}
.mi-head{cursor:pointer}
.menu-sub{max-height:0;overflow:hidden;transition:max-height .25s ease}
.menu-group .arrow{transition:transform .2s ease}
.menu-group.open .arrow{transform:rotate(90deg)}
.menu-item-active{background:linear-gradient(90deg,rgba(255,77,45,.08),transparent);color:#FF4D2D !important;border-right:3px solid #FF4D2D}
/* 三级分组小标题：不可点击、无 hover 态 */
.sub-group-title{font-size:11px;color:#94a3b8;font-weight:500;letter-spacing:.02em;padding:8px 20px 4px 44px;cursor:default}
.sub-group-title+hr{border:0;margin:0}
.menu-sub .sub-group-title:not(:first-child){margin-top:6px;border-top:1px solid #f1f5f9;padding-top:10px}
.dev-dot{width:5px;height:5px;border-radius:50%;background:#CBD5E1;flex-shrink:0}
.menu-item-active .dev-dot{background:#FF4D2D}
iframe{border:none;width:100%;height:100%}
</style>
</head>
<body>

<div class="flex h-screen overflow-hidden">

<!-- ===== 左侧侧边栏（浅色） ===== -->
<aside class="w-60 bg-white flex flex-col flex-shrink-0 border-r border-gray-200">
  <!-- Logo -->
  <div class="flex items-center gap-2.5 px-5 border-b border-gray-100" style="height:60px">
    <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)">
      <i class="fas fa-socks text-white text-sm"></i>
    </div>
    <div>
      <p class="text-gray-800 font-bold text-sm">袜掌柜</p>
      <p class="text-[10px] text-gray-400">运营管理端</p>
    </div>
  </div>

  <!-- 菜单：由 menu-data.js 唯一数据源渲染 -->
  <nav class="flex-1 overflow-y-auto sidebar-scroll py-2" id="sidebar-nav"></nav>

  <!-- 侧边栏底部：菜单版本与统计（用于确认加载的是同一份配置） -->
  <div class="px-5 py-3 border-t border-gray-100">
    <div class="flex items-center gap-2 text-[11px] text-gray-400">
      <i class="fas fa-circle text-[6px] text-green-400"></i>
      <span>系统运行正常</span>
    </div>
    <div class="mt-1 text-[10px] text-gray-400 leading-relaxed" id="menu-stat">菜单加载中…</div>
  </div>
</aside>

<!-- ===== 右侧主区域 ===== -->
<div class="flex-1 flex flex-col overflow-hidden">

  <!-- 顶部栏 -->
  <header class="bg-white border-b border-gray-200 flex items-center justify-between px-6 flex-shrink-0" style="height:60px">
    <div class="flex items-center gap-2 text-sm">
      <a href="../index.html" class="flex items-center gap-1 text-gray-400 hover:text-primary transition mr-3 pr-3 border-r border-gray-200"><i class="fas fa-arrow-left text-[10px]"></i>返回总门户</a>
      <span class="text-gray-400">运营管理端</span>
      <i class="fas fa-chevron-right text-[10px] text-gray-300"></i>
      <span id="breadcrumb" class="text-gray-800 font-medium">运营总览 / 四流指标总览</span>
    </div>
    <div class="flex items-center gap-4">
      <div class="relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input type="text" id="menu-search" placeholder="搜索功能/商户/订单..." class="w-56 pl-8 pr-3 py-1.5 text-[13px] bg-gray-100 rounded-lg border-none outline-none focus:bg-white focus:ring-2 focus:ring-primary/20 transition">
      </div>
      <div class="relative cursor-pointer">
        <i class="fas fa-bell text-gray-500 text-base"></i>
        <span class="absolute -top-1 -right-1 bg-primary text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">8</span>
      </div>
      <div class="flex items-center gap-2 cursor-pointer">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-white text-xs" style="background:linear-gradient(135deg,#FF6B35,#FF4D2D)">
          <i class="fas fa-user"></i>
        </div>
        <div class="text-[13px]">
          <p class="text-gray-800 font-medium leading-tight">张运营</p>
          <p class="text-gray-400 text-[10px] leading-tight">运营管理员</p>
        </div>
      </div>
    </div>
  </header>

  <!-- iframe 内容区 -->
  <iframe id="content-frame" src="dashboard.html"></iframe>

</div>

</div>

<!-- 菜单唯一数据源（改菜单请改此文件，并递增 MENU_VERSION 后运行 check-menu.ps1） -->
<script src="menu-data.js?v=2026092401"></script>
<script>
/* ============================================================
 * 侧边栏渲染与路由
 * 菜单结构完全来自 window.MENU_DATA（menu-data.js），本文件不含任何菜单定义
 * ========================================================== */
(function () {
  var VER  = window.MENU_VERSION || 'unknown';
  var DATA = window.MENU_DATA || [];
  var nav  = document.getElementById('sidebar-nav');
  var frame= document.getElementById('content-frame');
  var bc   = document.getElementById('breadcrumb');

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function enc(s) { return encodeURIComponent(String(s == null ? '' : s)); }

  // 统计
  var stat = { total: 0, done: 0, dev: 0 };

  function itemUrl(item, path) {
    if (item.page) return item.page;
    return 'developing.html?m=' + enc(item.name) +
           '&p=' + enc(path) +
           '&d=' + enc((item.points || []).join('|')) +
           '&v=' + enc(VER);
  }

  function itemHtml(item, path) {
    stat.total++;
    if (item.status === 'dev') { stat.dev++; } else { stat.done++; }
    var url = itemUrl(item, path);
    return '<a href="#" class="flex items-center gap-2 pl-11 pr-5 py-2 text-[13px] text-gray-500 hover:text-gray-800 hover:bg-gray-50 transition"' +
           ' data-page="' + esc(url) + '" data-path="' + esc(path) + '" title="' + esc(path) + '">' +
           '<span class="flex-1 truncate">' + esc(item.name) + '</span>' +
           (item.status === 'dev' ? '<span class="dev-dot" title="开发中"></span>' : '') +
           '</a>';
  }

  function build() {
    var html = '';
    DATA.forEach(function (g) {
      var sub = '';
      (g.children || []).forEach(function (c) {
        if (c.type === 'group') {
          sub += '<div class="sub-group-title">' + esc(c.name) + '</div>';
          (c.items || []).forEach(function (it) {
            sub += itemHtml(it, g.name + ' / ' + c.name + ' / ' + it.name);
          });
        } else {
          sub += itemHtml(c, g.name + ' / ' + c.name);
        }
      });
      html += '<div class="menu-group' + (g.open ? ' open' : '') + '" data-gid="' + esc(g.id) + '">' +
                '<div class="mi-head flex items-center gap-2.5 px-5 py-2.5 text-sm ' +
                  (g.open ? 'text-gray-800' : 'text-gray-600') +
                  ' hover:bg-gray-50 hover:text-gray-800 transition">' +
                  '<i class="fas ' + esc(g.icon) + ' text-[13px] w-4 text-center"></i>' +
                  '<span class="flex-1">' + esc(g.name) + '</span>' +
                  '<i class="fas fa-chevron-right text-[9px] arrow text-gray-300"></i>' +
                '</div>' +
                '<div class="menu-sub">' + sub + '</div>' +
              '</div>';
    });
    nav.innerHTML = html;
  }

  // 展开/收起：动态 max-height，避免写死高度
  function setOpen(group, open) {
    var sub = group.querySelector('.menu-sub');
    if (!sub) return;
    group.classList.toggle('open', open);
    sub.style.maxHeight = open ? sub.scrollHeight + 'px' : '0px';
  }
  function syncAll() {
    nav.querySelectorAll('.menu-group').forEach(function (g) {
      var sub = g.querySelector('.menu-sub');
      if (sub) sub.style.maxHeight = g.classList.contains('open') ? sub.scrollHeight + 'px' : '0px';
    });
  }

  function setCrumb(path) {
    var segs = String(path || '').split('/').map(function (s) { return s.trim(); }).filter(Boolean);
    bc.innerHTML = segs.map(function (s, i) {
      var last = i === segs.length - 1;
      return (i ? '<i class="fas fa-chevron-right text-[9px] text-gray-300 mx-0.5"></i>' : '') +
             '<span class="' + (last ? 'text-gray-800 font-medium' : 'text-gray-500') + '">' + esc(s) + '</span>';
    }).join('');
  }

  function activate(a) {
    nav.querySelectorAll('.menu-item-active').forEach(function (el) { el.classList.remove('menu-item-active'); });
    if (a) a.classList.add('menu-item-active');
  }

  function goto(a) {
    if (!a) return;
    frame.src = a.getAttribute('data-page');
    setCrumb(a.getAttribute('data-path'));
    activate(a);
    var p = a.closest('.menu-group');
    if (p && !p.classList.contains('open')) { setOpen(p, true); }
    a.scrollIntoView({ block: 'nearest' });
  }

  // 事件委托：整个侧边栏只有一个监听器
  nav.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-page]');
    if (a) { e.preventDefault(); goto(a); return; }
    var head = e.target.closest('.mi-head');
    if (head) {
      var g = head.closest('.menu-group');
      if (g) setOpen(g, !g.classList.contains('open'));
    }
  });

  // 顶部搜索：过滤菜单项（只做展示层过滤，不改数据源）
  document.getElementById('menu-search').addEventListener('input', function () {
    var kw = this.value.trim().toLowerCase();
    nav.querySelectorAll('.menu-group').forEach(function (g) {
      var hit = 0;
      g.querySelectorAll('a[data-page]').forEach(function (a) {
        var ok = !kw || (a.getAttribute('data-path') || '').toLowerCase().indexOf(kw) >= 0;
        a.style.display = ok ? '' : 'none';
        if (ok) hit++;
      });
      g.querySelectorAll('.sub-group-title').forEach(function (t) { t.style.display = kw ? 'none' : ''; });
      g.style.display = (kw && !hit) ? 'none' : '';
      if (kw && hit) setOpen(g, true);
    });
    syncAll();
  });

  // 子页面请求跳转（占位页「返回运营总览」）
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'wzg-goto' && e.data.page) {
      var a = nav.querySelector('a[data-page="' + e.data.page + '"]') ||
              nav.querySelector('a[data-page^="' + e.data.page + '?"]');
      if (a) goto(a); else { frame.src = e.data.page; }
    }
  });

  build();
  // 初始展开态高度同步（需等布局完成）
  requestAnimationFrame(syncAll);
  window.addEventListener('resize', function () { syncAll(); });

  // 默认选中首个已有页面
  var first = nav.querySelector('a[data-page="dashboard.html"]') || nav.querySelector('a[data-page]');
  if (first) { activate(first); setCrumb(first.getAttribute('data-path')); }

  document.getElementById('menu-stat').innerHTML =
    '菜单 v' + esc(VER) + ' · 共 ' + stat.total + ' 项 · 已有原型 ' + stat.done + ' · 开发中 ' + stat.dev +
    '<br>更新于 ' + esc(window.MENU_UPDATED || '-');
  console.log('[菜单] 版本 ' + VER + ' | 共 ' + stat.total + ' 项 | 已有原型 ' + stat.done + ' | 开发中 ' + stat.dev);
})();
</script>
</body>
</html>
