<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城运营 - 入驻申请</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}
.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}
.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}
.lk-gray:hover{color:#1F2430;text-decoration:underline}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:560px;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.stab{padding:4px 14px;border-radius:6px;font-size:12px;cursor:pointer;color:#64748B;border:1px solid transparent}
.stab:hover{color:#1F2430}
.stab.on{background:#FFEDE7;color:#E63E20;font-weight:600}
.th-sort{cursor:pointer;user-select:none}
.th-sort:hover{color:#1F2430}
</style>
</head>
<body>
<div class="p-6">

  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">入驻申请</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">10 商城运营 · 商户管理</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-1">商户入驻商城的申请审核；审核通过后商户可创建店铺并上架商品</p>
    </div>
  </div>

  <!-- 筛选 -->
  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-name" type="text" placeholder="输入企业名称" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-56">
      <button class="btn btn-primary" onclick="doSearch()"><i class="fas fa-search mr-1 text-[10px]"></i>搜索</button>
      <div class="flex items-center gap-1.5 ml-2" id="status-tabs">
        <span class="stab on" data-s="全部" onclick="pickStatus(this)">全部</span>
        <span class="stab" data-s="待审核" onclick="pickStatus(this)">待审核</span>
        <span class="stab" data-s="审核通过" onclick="pickStatus(this)">审核通过</span>
        <span class="stab" data-s="审核未通过" onclick="pickStatus(this)">审核未通过</span>
      </div>
    </div>
  </div>

  <!-- 表格 -->
  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <table class="w-full text-[13px]">
      <thead>
        <tr class="bg-gray-50 text-gray-500 text-[12px]">
          <th class="px-4 py-3 text-left font-medium">申请信息</th>
          <th class="px-4 py-3 text-left font-medium">申请会员名称(ID)</th>
          <th class="px-4 py-3 text-left font-medium">联系人姓名</th>
          <th class="px-4 py-3 text-left font-medium">联系人电话</th>
          <th class="px-4 py-3 text-left font-medium">申请状态</th>
          <th class="px-4 py-3 text-left font-medium th-sort" onclick="sortByDate()">申请日期 <i class="fas fa-sort text-[9px]" id="sort-icon"></i></th>
          <th class="px-4 py-3 text-left font-medium">审核时间</th>
          <th class="px-4 py-3 text-left font-medium">审核人</th>
          <th class="px-4 py-3 text-center font-medium">操作</th>
        </tr>
      </thead>
      <tbody id="tb" class="divide-y divide-gray-50"></tbody>
    </table>
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <span class="text-[12px] text-gray-400" id="page-info">共 6 条记录，第 1-6 条</span>
      <div class="flex items-center gap-1">
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100"><i class="fas fa-chevron-left text-[10px]"></i></button>
        <button class="w-7 h-7 flex items-center justify-center text-white text-[12px] rounded" style="background:#FF4D2D">1</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100"><i class="fas fa-chevron-right text-[10px]"></i></button>
      </div>
    </div>
  </div>

</div>

<!-- 遮罩 -->
<div id="mask" class="mask" onclick="closeAll()"></div>

<!-- 审核/详情 抽屉 -->
<div id="drawer" class="drawer">
  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
    <h3 class="text-[15px] font-bold text-[#1F2430]" id="drawer-title">入驻审核</h3>
    <button class="text-gray-400 hover:text-gray-600" onclick="closeAll()"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="flex-1 overflow-y-auto px-5 py-4" id="drawer-body"></div>
  <div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2" id="drawer-foot"></div>
</div>

<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[70]"></div>

<script>
var applies=[
  {id:1,info:'袜业小镇针织 · 企业入驻',member:'大唐新锐袜业（dz_10086）',contact:'楼建国',phone:'138****6621',state:'待审核',date:'2026-09-22 15:20',reviewTime:'—',reviewer:'—',lic:'91330681XXXXXX1234',scope:'袜品生产、销售'},
  {id:2,info:'锦帛服饰 · 企业入驻',member:'锦帛服饰（dz_10092）',contact:'宣婷',phone:'139****3308',state:'待审核',date:'2026-09-22 10:05',reviewTime:'—',reviewer:'—',lic:'91330681XXXXXX5678',scope:'丝袜、连裤袜批发'},
  {id:3,info:'大唐袜业集团 · 企业入驻',member:'大唐袜业集团（dz_10001）',contact:'王振宇',phone:'137****8890',state:'审核通过',date:'2026-09-20 09:32',reviewTime:'2026-09-20 14:10',reviewer:'admin',lic:'91330681XXXXXX0001',scope:'各类袜品、原料'},
  {id:4,info:'丹吉娅袜业 · 企业入驻',member:'丹吉娅袜业（dz_10015）',contact:'陈丽萍',phone:'136****2210',state:'审核通过',date:'2026-09-18 16:44',reviewTime:'2026-09-19 09:05',reviewer:'admin',lic:'91330681XXXXXX0015',scope:'针织袜品'},
  {id:5,info:'某个体商户 · 个人入驻',member:'个体-张伟（dz_10110）',contact:'张伟',phone:'135****7754',state:'审核未通过',date:'2026-09-17 11:26',reviewTime:'2026-09-17 15:48',reviewer:'admin',lic:'—',scope:'袜品零售'},
  {id:6,info:'沃特体育 · 企业入驻',member:'沃特体育用品（dz_10077）',contact:'李强',phone:'133****9021',state:'待审核',date:'2026-09-16 14:12',reviewTime:'—',reviewer:'—',lic:'91330681XXXXXX0077',scope:'运动袜、护具'}
];
var curStatus='全部',dateDesc=true,curId=null;
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},2200);}

function sBadge(s){
  if(s==='待审核')return '<span class="status-badge bg-amber-50 text-amber-600">待审核</span>';
  if(s==='审核通过')return '<span class="status-badge bg-green-50 text-green-600">审核通过</span>';
  return '<span class="status-badge bg-red-50 text-red-500">审核未通过</span>';
}
function filtered(){
  var kw=document.getElementById('f-name').value.trim();
  var r=applies.filter(function(a){return (curStatus==='全部'||a.state===curStatus)&&(!kw||a.member.indexOf(kw)>-1||a.info.indexOf(kw)>-1);});
  r=r.slice().sort(function(x,y){return dateDesc?(y.date>x.date?1:-1):(x.date>y.date?1:-1);});
  return r;
}
function render(){
  var rows=filtered(),h='';
  rows.forEach(function(a){
    h+='<tr class="hover:bg-gray-50 transition">'
      +'<td class="px-4 py-3 text-gray-700">'+a.info+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+a.member+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+a.contact+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+a.phone+'</td>'
      +'<td class="px-4 py-3">'+sBadge(a.state)+'</td>'
      +'<td class="px-4 py-3 text-gray-400">'+a.date+'</td>'
      +'<td class="px-4 py-3 text-gray-400">'+a.reviewTime+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+a.reviewer+'</td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'
      +(a.state==='待审核'?'<span class="lk" onclick="openReview('+a.id+')">审核</span> · <span class="lk-gray" onclick="openDetail('+a.id+')">详情</span>':'<span class="lk-gray" onclick="openDetail('+a.id+')">详情</span>')
      +'</td></tr>';
  });
  if(!rows.length){h='<tr><td colspan="9" class="px-4 py-16 text-center text-gray-300"><i class="fas fa-inbox text-3xl block mb-2"></i><span class="text-[12px]">暂无数据</span></td></tr>';}
  document.getElementById('tb').innerHTML=h;
  document.getElementById('page-info').textContent='共 '+rows.length+' 条记录';
}
function pickStatus(el){
  document.querySelectorAll('#status-tabs .stab').forEach(function(s){s.classList.remove('on')});
  el.classList.add('on');curStatus=el.getAttribute('data-s');render();
}
function doSearch(){render();}
function sortByDate(){dateDesc=!dateDesc;document.getElementById('sort-icon').className='fas '+(dateDesc?'fa-sort-down':'fa-sort-up')+' text-[9px]';render();}

function openReview(id){
  curId=id;var a=applies.find(function(x){return x.id===id;});
  document.getElementById('drawer-title').textContent='入驻审核';
  document.getElementById('drawer-body').innerHTML=
    '<div class="bg-gray-50 rounded-xl p-4 mb-4">'
    +'<p class="text-[13px] font-bold text-[#1F2430] mb-3">'+a.info+'</p>'
    +'<div class="grid grid-cols-2 gap-y-2.5 text-[12px]">'
    +'<span class="text-gray-400">申请会员</span><span class="text-gray-700">'+a.member+'</span>'
    +'<span class="text-gray-400">联系人</span><span class="text-gray-700">'+a.contact+' · '+a.phone+'</span>'
    +'<span class="text-gray-400">统一社会信用代码</span><span class="text-gray-700">'+a.lic+'</span>'
    +'<span class="text-gray-400">经营范围</span><span class="text-gray-700">'+a.scope+'</span>'
    +'<span class="text-gray-400">申请日期</span><span class="text-gray-700">'+a.date+'</span>'
    +'</div>'
    +'<div class="mt-3 flex gap-2">'
    +'<span class="tag bg-blue-50 text-blue-600 cursor-pointer" onclick="toast(\'预览营业执照图片\')"><i class="fas fa-image"></i>营业执照</span>'
    +'<span class="tag bg-blue-50 text-blue-600 cursor-pointer" onclick="toast(\'预览法人身份证图片\')"><i class="fas fa-id-card"></i>法人身份证</span>'
    +'<span class="tag bg-blue-50 text-blue-600 cursor-pointer" onclick="toast(\'预览开户许可证图片\')"><i class="fas fa-file-lines"></i>开户许可证</span>'
    +'</div></div>'
    +'<label class="fl" style="display:block;font-size:11px;color:#94A3B8;margin-bottom:4px">审核意见</label>'
    +'<textarea id="r-note" rows="4" class="w-full px-3 py-2 text-[12px] border border-gray-200 rounded-lg outline-none focus:border-primary" placeholder="通过或驳回原因，将通知申请人"></textarea>';
  document.getElementById('drawer-foot').innerHTML=
    '<button class="btn btn-ghost" onclick="review(0)">驳回</button>'
    +'<button class="btn btn-primary" onclick="review(1)">审核通过</button>';
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function openDetail(id){
  curId=id;var a=applies.find(function(x){return x.id===id;});
  document.getElementById('drawer-title').textContent='申请详情';
  document.getElementById('drawer-body').innerHTML=
    '<div class="grid grid-cols-2 gap-y-3 text-[12px] bg-gray-50 rounded-xl p-4">'
    +'<span class="text-gray-400">申请信息</span><span class="text-gray-700">'+a.info+'</span>'
    +'<span class="text-gray-400">申请会员</span><span class="text-gray-700">'+a.member+'</span>'
    +'<span class="text-gray-400">联系人</span><span class="text-gray-700">'+a.contact+' · '+a.phone+'</span>'
    +'<span class="text-gray-400">申请状态</span><span>'+sBadge(a.state)+'</span>'
    +'<span class="text-gray-400">申请日期</span><span class="text-gray-700">'+a.date+'</span>'
    +'<span class="text-gray-400">审核时间</span><span class="text-gray-700">'+a.reviewTime+'</span>'
    +'<span class="text-gray-400">审核人</span><span class="text-gray-700">'+a.reviewer+'</span>'
    +'</div>';
  document.getElementById('drawer-foot').innerHTML='<button class="btn btn-ghost" onclick="closeAll()">关闭</button>';
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function review(pass){
  var note=document.getElementById('r-note').value.trim();
  if(!pass&&!note){toast('驳回需填写审核意见');return;}
  var a=applies.find(function(x){return x.id===curId;});
  a.state=pass?'审核通过':'审核未通过';
  a.reviewTime='2026-09-23 10:24';a.reviewer='admin';
  closeAll();render();
  toast(pass?'已通过「'+a.info+'」入驻申请':'已驳回「'+a.info+'」入驻申请');
}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
render();
</script>
<!-- ===== 修改说明（商城运营 · 右下角） ===== -->
<style>
.mn-fab{position:fixed;right:22px;bottom:22px;z-index:30;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid #FDB4A3;background:#fff;color:#E63E20;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 8px 22px rgba(255,77,45,.20);font-family:inherit}
.mn-fab:hover{background:#FFF6F3}
.mn-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:80}
.mn-mask.on{opacity:1;pointer-events:auto}
.mn-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:580px;max-width:92vw;max-height:82vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:.22s;z-index:90}
.mn-modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mn-li{display:flex;gap:8px;font-size:12.5px;color:#334155;line-height:1.75}
.mn-li i{margin-top:5px;font-size:8px;flex-shrink:0}
</style>
<button class="mn-fab" onclick="openNote()"><i class="fas fa-circle-info"></i><span>修改说明</span></button>
<div id="mn-mask" class="mn-mask" onclick="closeNote()"></div>
<div id="mn-modal" class="mn-modal"></div>
<script>
/* 开发修改说明　ext：请以外采系统为准　mod：请以本次修改内容为准 */
var NOTE_TITLE='入驻申请';
var NOTE_PENDING=false;
var NOTE_EXT=[
  '本页全部内容以外采 igshop 系统为准：入驻申请列表、状态筛选（全部 / 待审核 / 审核通过 / 审核未通过）、审核通过 / 驳回及通知，以及页内所有按钮及其二级页面。',
  '原型页面仅作占位示意，开发请直接对照外采系统实现。'
];
var NOTE_MOD=[];
function noteItems(arr,color,empty){
  if(!arr||!arr.length){return '<div class="mn-li" style="color:#94A3B8">'+empty+'</div>';}
  return arr.map(function(t){return '<div class="mn-li"><i class="fas fa-circle" style="color:'+color+'"></i><span>'+t+'</span></div>';}).join('');
}
function openNote(){
  var h='<div class="flex items-start justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">开发修改说明</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+NOTE_TITLE+'　·　商城运营（外采 igshop 系统）'+(NOTE_PENDING?'　·　<span style="color:#E63E20">待补充</span>':'')+'</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeNote()"><i class="fas fa-xmark"></i></button></div>'
    +'<div class="px-5 py-4" style="display:flex;flex-direction:column;gap:14px">'
    +'<div class="rounded-xl border p-4" style="border-color:#FDE68A;background:#FFFBEB">'
    +'<div class="text-[12.5px] font-bold mb-2" style="color:#B45309"><i class="fas fa-triangle-exclamation mr-1"></i>请以外采系统为准</div>'
    +noteItems(NOTE_EXT,'#F59E0B','无')+'</div>'
    +'<div class="rounded-xl border p-4" style="border-color:#FDB4A3;background:#FFF6F3">'
    +'<div class="text-[12.5px] font-bold mb-2" style="color:#E63E20"><i class="fas fa-pen-to-square mr-1"></i>请以本次修改内容为准</div>'
    +noteItems(NOTE_MOD,'#FF4D2D','本页无本次修改内容，全部以外采系统为准')+'</div></div>'
    +'<div class="px-5 py-3.5 border-t border-gray-100 flex justify-end">'
    +'<button class="px-4 py-2 rounded-lg text-[12px] font-semibold text-white" style="background:#FF4D2D" onclick="closeNote()">知道了</button></div>';
  var m=document.getElementById('mn-modal');
  m.innerHTML=h;
  document.getElementById('mn-mask').classList.add('on');
  m.classList.add('on');
}
function closeNote(){
  document.getElementById('mn-mask').classList.remove('on');
  document.getElementById('mn-modal').classList.remove('on');
}
</script>
</body>
</html>
