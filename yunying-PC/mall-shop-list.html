<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商城运营 - 店铺列表</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#FF4D2D','primary-d':'#E63E20','primary-l':'#FF7849'}}}}
</script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}
.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}
.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}
.lk-gray:hover{color:#1F2430;text-decoration:underline}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:520px;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.fl{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.fl i{color:#FF4D2D;font-style:normal;margin-right:2px}
.fi{width:100%;padding:7px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none;background:#fff}
.fi:focus{border-color:#FF4D2D}
.type-radio{display:flex;align-items:flex-start;gap:8px;border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s}
.type-radio:hover{border-color:#FDB4A3}
.type-radio.on{border-color:#FF4D2D;background:#FFF6F3}
.status-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500}
.logo-box{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
</style>
</head>
<body>
<div class="p-6">

  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">店铺列表</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">10 商城运营 · 店铺管理</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-1">商城店铺的创建、编辑与状态管理；店铺类型支持 普通店铺 / 品牌店铺 / 自营店铺</p>
    </div>
    <button class="btn btn-primary" onclick="openEdit('new')"><i class="fas fa-plus mr-1"></i>新增店铺</button>
  </div>

  <!-- 筛选 -->
  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-name" type="text" placeholder="店铺名称" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-44">
      <input id="f-account" type="text" placeholder="主账号" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-36">
      <input id="f-merchant" type="text" placeholder="商户名称" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-40">
      <select id="f-type" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部类型</option><option>普通店铺</option><option>品牌店铺</option><option>自营店铺</option>
      </select>
      <button class="btn btn-primary" onclick="doSearch()">搜索</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
    </div>
  </div>

  <!-- 表格 -->
  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <table class="w-full text-[13px]">
      <thead>
        <tr class="bg-gray-50 text-gray-500 text-[12px]">
          <th class="px-4 py-3 text-left font-medium">店铺名称</th>
          <th class="px-4 py-3 text-left font-medium">店铺LOGO</th>
          <th class="px-4 py-3 text-left font-medium">店铺类型</th>
          <th class="px-4 py-3 text-left font-medium">商户名称</th>
          <th class="px-4 py-3 text-left font-medium">主账号</th>
          <th class="px-4 py-3 text-left font-medium">在售商品</th>
          <th class="px-4 py-3 text-left font-medium">状态</th>
          <th class="px-4 py-3 text-center font-medium">操作</th>
        </tr>
      </thead>
      <tbody id="tb" class="divide-y divide-gray-50"></tbody>
    </table>
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <span class="text-[12px] text-gray-400" id="page-info">共 6 条记录，第 1-6 条</span>
      <div class="flex items-center gap-1">
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100"><i class="fas fa-chevron-left text-[10px]"></i></button>
        <button class="w-7 h-7 flex items-center justify-center text-white text-[12px] rounded" style="background:#FF4D2D">1</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100"><i class="fas fa-chevron-right text-[10px]"></i></button>
      </div>
    </div>
  </div>

</div>

<!-- 遮罩 -->
<div id="mask" class="mask" onclick="closeAll()"></div>

<!-- 新增/编辑店铺 抽屉 -->
<div id="drawer" class="drawer">
  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
    <h3 class="text-[15px] font-bold text-[#1F2430]" id="drawer-title">新增店铺</h3>
    <button class="text-gray-400 hover:text-gray-600" onclick="closeAll()"><i class="fas fa-xmark"></i></button>
  </div>
  <div class="flex-1 overflow-y-auto px-5 py-4">
    <div class="mb-4">
      <label class="fl"><i>*</i>店铺名称</label>
      <input id="e-name" class="fi" placeholder="请输入店铺名称">
    </div>
    <div class="mb-4">
      <label class="fl"><i>*</i>店铺LOGO</label>
      <label class="flex items-center gap-3 cursor-pointer">
        <span class="w-16 h-16 rounded-lg border-2 border-dashed border-gray-200 flex flex-col items-center justify-center text-gray-300 hover:border-primary hover:text-primary transition" id="logo-preview">
          <i class="fas fa-image text-lg"></i><span class="text-[10px] mt-0.5">添加图片</span>
        </span>
        <input type="file" accept="image/*" class="hidden" onchange="pickLogo(this)">
      </label>
      <p class="text-[11px] text-gray-400 mt-1.5">建议上传 1:1 的图片，宽 200px，高 100px（左侧）</p>
    </div>
    <div class="mb-4">
      <label class="fl"><i>*</i>店铺类型</label>
      <div class="grid grid-cols-3 gap-2" id="type-box">
        <div class="type-radio on" data-t="普通店铺" onclick="pickType(this)">
          <i class="fas fa-store text-[13px] text-gray-500 mt-0.5"></i>
          <div><p class="text-[12px] font-semibold text-[#1F2430]">普通店铺</p><p class="text-[10px] text-gray-400 mt-0.5">标准入驻店铺</p></div>
        </div>
        <div class="type-radio" data-t="品牌店铺" onclick="pickType(this)">
          <i class="fas fa-crown text-[13px] text-amber-500 mt-0.5"></i>
          <div><p class="text-[12px] font-semibold text-[#1F2430]">品牌店铺</p><p class="text-[10px] text-gray-400 mt-0.5">品牌馆展示</p></div>
        </div>
        <div class="type-radio" data-t="自营店铺" onclick="pickType(this)">
          <i class="fas fa-building-shield text-[13px] text-primary mt-0.5"></i>
          <div><p class="text-[12px] font-semibold text-[#1F2430]">自营店铺</p><p class="text-[10px] text-gray-400 mt-0.5">平台自营</p></div>
        </div>
      </div>
    </div>
    <div class="mb-4">
      <label class="fl"><i>*</i>所属商户</label>
      <div class="flex items-center gap-2">
        <input id="e-merchant" class="fi flex-1" placeholder="请选择所属商户" readonly onclick="openMerchant()" style="cursor:pointer;background:#F8FAFC">
        <button class="btn btn-primary" onclick="openMerchant()">选择商户</button>
      </div>
    </div>
  </div>
  <div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">
    <button class="btn btn-ghost" onclick="closeAll()">取消</button>
    <button class="btn btn-primary" onclick="saveShop()">确认</button>
  </div>
</div>

<!-- 选择商户 弹窗 -->
<div id="m-modal" class="modal-mask" style="position:fixed;inset:0;background:rgba(15,23,42,.5);opacity:0;pointer-events:none;transition:.2s;z-index:60;display:flex;align-items:center;justify-content:center"></div>

<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[70]"></div>

<script>
var shops=[
  {id:1,name:'大唐袜业城官方旗舰店',logo:{bg:'linear-gradient(135deg,#FF8A4C,#FF4D2D)',ch:'大'},type:'自营店铺',merchant:'大唐袜业集团（已认证）',account:'datang',goods:268,state:'营业中'},
  {id:2,name:'丹吉娅品牌专营店',logo:{bg:'linear-gradient(135deg,#A78BFA,#7C3AED)',ch:'丹'},type:'品牌店铺',merchant:'丹吉娅袜业（已认证）',account:'danjya',goods:192,state:'营业中'},
  {id:3,name:'步人堂智能袜机店',logo:{bg:'linear-gradient(135deg,#38BDF8,#3B82F6)',ch:'步'},type:'普通店铺',merchant:'步人堂针织（已认证）',account:'burentang',goods:87,state:'营业中'},
  {id:4,name:'花间舞时尚女袜馆',logo:{bg:'linear-gradient(135deg,#FB7185,#EC4899)',ch:'花'},type:'品牌店铺',merchant:'花间舞袜业（已认证）',account:'huajianwu',goods:134,state:'营业中'},
  {id:5,name:'棉田有机纱线原料铺',logo:{bg:'linear-gradient(135deg,#34D399,#10B981)',ch:'棉'},type:'普通店铺',merchant:'棉田纱线厂（已认证）',account:'miantian',goods:56,state:'已关闭'},
  {id:6,name:'宝娜斯丝袜体验店',logo:{bg:'linear-gradient(135deg,#FBBF24,#F59E0B)',ch:'宝'},type:'普通店铺',merchant:'宝娜斯袜业（认证已过期）',account:'baonasi',goods:73,state:'营业中'}
];
var merchants=['大唐袜业集团（已认证）','丹吉娅袜业（已认证）','步人堂针织（已认证）','花间舞袜业（已认证）','棉田纱线厂（已认证）','宝娜斯袜业（认证已过期）'];
var editId=null,pickMerchant=merchants[0],logoName='';
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},2200);}

var typeBadge={
  '普通店铺':'<span class="status-badge bg-gray-100 text-gray-600">普通店铺</span>',
  '品牌店铺':'<span class="status-badge" style="background:#F3E8FF;color:#7C3AED"><i class="fas fa-crown text-[9px]"></i>品牌店铺</span>',
  '自营店铺':'<span class="status-badge" style="background:#FFEDE7;color:#E63E20"><i class="fas fa-building-shield text-[9px]"></i>自营店铺</span>'
};
function stateBadge(s){return s==='营业中'?'<span class="status-badge bg-green-50 text-green-600">营业中</span>':'<span class="status-badge bg-gray-100 text-gray-400">已关闭</span>';}

function render(list){
  var rows=list||shops;
  var h='';
  rows.forEach(function(s){
    h+='<tr class="hover:bg-gray-50 transition">'
      +'<td class="px-4 py-3"><div class="flex items-center gap-2"><div class="logo-box" style="background:'+s.logo.bg+'">'+s.logo.ch+'</div><span class="font-medium text-gray-800">'+s.name+'</span></div></td>'
      +'<td class="px-4 py-3"><div class="logo-box" style="background:'+s.logo.bg+'">'+s.logo.ch+'</div></td>'
      +'<td class="px-4 py-3">'+typeBadge[s.type]+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+s.merchant+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+s.account+'</td>'
      +'<td class="px-4 py-3 text-gray-600">'+s.goods+'</td>'
      +'<td class="px-4 py-3">'+stateBadge(s.state)+'</td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'
        +'<span class="lk" onclick="openEdit('+s.id+')">编辑</span> · '
        +'<span class="lk" onclick="detail('+s.id+')">详情</span> · '
        +(s.state==='营业中'?'<span class="lk-gray" onclick="toggleState('+s.id+')">关闭店铺</span>':'<span class="lk" onclick="toggleState('+s.id+')">重新开启</span>')
      +'</td></tr>';
  });
  if(!rows.length){h='<tr><td colspan="8" class="px-4 py-16 text-center text-gray-300"><i class="fas fa-inbox text-3xl block mb-2"></i><span class="text-[12px]">暂无数据</span></td></tr>';}
  document.getElementById('tb').innerHTML=h;
  document.getElementById('page-info').textContent='共 '+rows.length+' 条记录';
}
function doSearch(){
  var n=document.getElementById('f-name').value.trim(),a=document.getElementById('f-account').value.trim(),m=document.getElementById('f-merchant').value.trim(),t=document.getElementById('f-type').value;
  var r=shops.filter(function(s){return (!n||s.name.indexOf(n)>-1)&&(!a||s.account.indexOf(a)>-1)&&(!m||s.merchant.indexOf(m)>-1)&&(!t||s.type===t);});
  render(r);
}
function resetSearch(){document.getElementById('f-name').value='';document.getElementById('f-account').value='';document.getElementById('f-merchant').value='';document.getElementById('f-type').value='';render();}

function openEdit(id){
  editId=id;
  document.getElementById('drawer-title').textContent=id==='new'?'新增店铺':'编辑店铺';
  var s=id==='new'?{name:'',type:'普通店铺',merchant:''}:shops.find(function(x){return x.id===id;});
  document.getElementById('e-name').value=s.name;
  document.getElementById('e-merchant').value=s.merchant;
  pickMerchant=s.merchant;
  document.querySelectorAll('#type-box .type-radio').forEach(function(r){r.classList.toggle('on',r.getAttribute('data-t')===s.type);});
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function pickType(el){
  document.querySelectorAll('#type-box .type-radio').forEach(function(r){r.classList.remove('on')});
  el.classList.add('on');
}
function pickLogo(input){
  if(input.files[0]){logoName=input.files[0].name;document.getElementById('logo-preview').innerHTML='<i class="fas fa-check text-green-500 text-lg"></i><span class="text-[10px] mt-0.5 text-green-500" style="max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+logoName+'</span>';toast('LOGO 已选择：'+logoName);}
}
function stopBubble(e){if(e&&e.stopPropagation){e.stopPropagation();}}
function openMerchant(){
  var h='<div class="bg-white rounded-xl w-[420px] overflow-hidden" onclick="stopBubble(event)">';
  h+='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100"><h3 class="text-[14px] font-bold text-[#1F2430]">选择所属商户</h3><button class="text-gray-400 hover:text-gray-600" onclick="closeMerchant()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="max-h-80 overflow-y-auto py-2">';
  merchants.forEach(function(m){
    h+='<div class="px-5 py-2.5 hover:bg-gray-50 cursor-pointer flex items-center justify-between" onclick="chooseMerchant(\''+m+'\')"><span class="text-[13px] text-gray-700">'+m+'</span>'+(m===pickMerchant?'<i class="fas fa-check text-primary text-[12px]"></i>':'')+'</div>';
  });
  h+='</div></div>';
  var mm=document.getElementById('m-modal');
  mm.innerHTML=h;mm.style.opacity='1';mm.style.pointerEvents='auto';
}
function chooseMerchant(m){pickMerchant=m;document.getElementById('e-merchant').value=m;closeMerchant();}
function closeMerchant(){var mm=document.getElementById('m-modal');mm.style.opacity='0';mm.style.pointerEvents='none';}
function saveShop(){
  var name=document.getElementById('e-name').value.trim(),type=document.querySelector('#type-box .type-radio.on').getAttribute('data-t'),merchant=document.getElementById('e-merchant').value.trim();
  if(!name){toast('请输入店铺名称');return;}
  if(!merchant){toast('请选择所属商户');return;}
  if(editId==='new'){shops.unshift({id:Date.now(),name:name,logo:{bg:'linear-gradient(135deg,#FF8A4C,#FF4D2D)',ch:name.charAt(0)},type:type,merchant:merchant,account:'shop'+(shops.length+1),goods:0,state:'营业中'});toast('店铺「'+name+'」已创建（'+type+'）');}
  else{var s=shops.find(function(x){return x.id===editId;});if(s){s.name=name;s.type=type;s.merchant=merchant;toast('已保存修改');}}
  closeAll();render();
}
function detail(id){var s=shops.find(function(x){return x.id===id;});toast('店铺详情：'+s.name+' · '+s.type+' · '+s.state);}
function toggleState(id){var s=shops.find(function(x){return x.id===id;});s.state=s.state==='营业中'?'已关闭':'营业中';toast(s.state==='营业中'?'店铺已重新开启':'店铺已关闭，前端不再展示');render();}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  closeMerchant();
}
render();
</script>

<!-- ===== 修改说明（商城运营 · 右下角） ===== -->
<style>
.mn-fab{position:fixed;right:22px;bottom:22px;z-index:30;display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid #FDB4A3;background:#fff;color:#E63E20;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 8px 22px rgba(255,77,45,.20);font-family:inherit}
.mn-fab:hover{background:#FFF6F3}
.mn-mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:80}
.mn-mask.on{opacity:1;pointer-events:auto}
.mn-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:580px;max-width:92vw;max-height:82vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:.22s;z-index:90}
.mn-modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.mn-li{display:flex;gap:8px;font-size:12.5px;color:#334155;line-height:1.75}
.mn-li i{margin-top:5px;font-size:8px;flex-shrink:0}
</style>
<button class="mn-fab" onclick="openNote()"><i class="fas fa-circle-info"></i><span>修改说明</span></button>
<div id="mn-mask" class="mn-mask" onclick="closeNote()"></div>
<div id="mn-modal" class="mn-modal"></div>
<script>
/* 开发修改说明　ext：请以外采系统为准　mod：请以本次修改内容为准 */
var NOTE_TITLE='店铺列表';
var NOTE_PENDING=false;
var NOTE_EXT=[
  '本页除下方「本次修改内容」外，列表字段、筛选条件、行操作按钮及其点开的二级页面，一律以外采 igshop 系统为准。',
  '外采列表操作栏中的按钮与按钮的二级页面，开发请直接打开外采系统对照实现；本原型仅作占位示意，不代表最终页面。'
];
var NOTE_MOD=[
  '新增店铺时，需增加「店铺类型」三项单选：普通店铺 / 品牌店铺 / 自营店铺（原型新增 / 编辑店铺抽屉中已标注该字段）。'
];
function noteItems(arr,color,empty){
  if(!arr||!arr.length){return '<div class="mn-li" style="color:#94A3B8">'+empty+'</div>';}
  return arr.map(function(t){return '<div class="mn-li"><i class="fas fa-circle" style="color:'+color+'"></i><span>'+t+'</span></div>';}).join('');
}
function openNote(){
  var h='<div class="flex items-start justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">开发修改说明</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+NOTE_TITLE+'　·　商城运营（外采 igshop 系统）'+(NOTE_PENDING?'　·　<span style="color:#E63E20">待补充</span>':'')+'</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeNote()"><i class="fas fa-xmark"></i></button></div>'
    +'<div class="px-5 py-4" style="display:flex;flex-direction:column;gap:14px">'
    +'<div class="rounded-xl border p-4" style="border-color:#FDE68A;background:#FFFBEB">'
    +'<div class="text-[12.5px] font-bold mb-2" style="color:#B45309"><i class="fas fa-triangle-exclamation mr-1"></i>请以外采系统为准</div>'
    +noteItems(NOTE_EXT,'#F59E0B','无')+'</div>'
    +'<div class="rounded-xl border p-4" style="border-color:#FDB4A3;background:#FFF6F3">'
    +'<div class="text-[12.5px] font-bold mb-2" style="color:#E63E20"><i class="fas fa-pen-to-square mr-1"></i>请以本次修改内容为准</div>'
    +noteItems(NOTE_MOD,'#FF4D2D','本页无本次修改内容，全部以外采系统为准')+'</div></div>'
    +'<div class="px-5 py-3.5 border-t border-gray-100 flex justify-end">'
    +'<button class="px-4 py-2 rounded-lg text-[12px] font-semibold text-white" style="background:#FF4D2D" onclick="closeNote()">知道了</button></div>';
  var m=document.getElementById('mn-modal');
  m.innerHTML=h;
  document.getElementById('mn-mask').classList.add('on');
  m.classList.add('on');
}
function closeNote(){
  document.getElementById('mn-mask').classList.remove('on');
  document.getElementById('mn-modal').classList.remove('on');
}
</script>
</body>
</html>
