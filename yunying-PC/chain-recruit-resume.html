<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人才招聘 - 简历管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}.lk-gray:hover{color:#1F2430;text-decoration:underline}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:820px;max-width:97vw;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:70;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:760px;max-width:95vw;max-height:86vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:.22s;z-index:70}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.blk{border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px}
.blk-t{font-size:12.5px;font-weight:700;color:#1F2430;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.kv{display:flex;gap:8px;font-size:12px;line-height:1.9}
.kv .k{width:112px;flex-shrink:0;color:#94A3B8}
.fi{width:100%;padding:6px 10px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none;background:#fff}
.fi:focus{border-color:#FF4D2D}
.fl{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.sel{width:100%;padding:6px 8px;border:1px solid #E2E8F0;border-radius:8px;font-size:12px;outline:none}
button{cursor:pointer}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="p-6">

  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">人才招聘 · 简历管理</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">13 产业链服务</span>
        <span class="tag" style="background:#F1F5F9;color:#64748B">只读</span>
        <span class="tag" style="background:#FEE2E2;color:#B91C1C">默认脱敏</span>
      </div>

    </div>
    <div class="flex items-center gap-2">

    </div>
  </div>

  <div class="grid grid-cols-5 gap-3 mb-4" id="stats"></div>

  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-kw" type="text" placeholder="姓名（模糊）" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-40">
      <input id="f-phone" type="text" placeholder="电话（后 4 位）" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none w-40">
      <input id="f-idno" type="text" placeholder="身份证（后 4 位）" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none w-40">
      <select id="f-mar" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部婚姻状况</option><option>未婚</option><option>已婚</option><option>离异</option><option>丧偶</option>
      </select>
      <select id="f-years" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">全部工作年限</option><option>1 年以内</option><option>1-3 年</option><option>3-5 年</option><option>5 年以上</option>
      </select>
      <select id="f-del" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none text-gray-600">
        <option value="">投递状态（全部）</option><option>有投递</option><option>无投递</option><option>已回复</option>
      </select>
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
      <span class="text-[11px] text-[#94A3B8] ml-auto"><i class="fas fa-circle-info mr-1"></i>简历由求职者在端上维护，运营端<b>不可编辑</b>；导出默认脱敏</span>
    </div>
  </div>

  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-[13px] font-bold text-[#1F2430]">求职者简历</span>
        <span class="text-[12px] text-[#94A3B8]" id="cnt">共 0 人</span>
      </div>
      <span class="text-[11px] text-[#94A3B8]"><i class="fas fa-clock-rotate-left mr-1"></i>查看完整证件号 / 导出均留痕（人 / 时间 / 条数）</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-[13px]" style="min-width:1420px">
        <thead>
          <tr class="bg-gray-50 text-gray-500 text-[12px]">
            <th class="px-3 py-3 text-left font-medium">姓名</th>
            <th class="px-3 py-3 text-left font-medium">电话</th>
            <th class="px-3 py-3 text-left font-medium">身份证</th>
            <th class="px-3 py-3 text-center font-medium">婚姻状况</th>
            <th class="px-3 py-3 text-left font-medium">现住地址</th>
            <th class="px-3 py-3 text-left font-medium">邮箱</th>
            <th class="px-3 py-3 text-center font-medium">工作年限</th>
            <th class="px-3 py-3 text-left font-medium">专业</th>
            <th class="px-3 py-3 text-left font-medium">外语及等级</th>
            <th class="px-3 py-3 text-left font-medium">职业资格</th>
            <th class="px-3 py-3 text-center font-medium">投递 / 状态</th>
            <th class="px-3 py-3 text-center font-medium">操作</th>
          </tr>
        </thead>
        <tbody id="tb" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>
  </div>

</div>

<div id="mask" class="mask" onclick="closeAll()"></div>
<div id="drawer" class="drawer"></div>
<div id="modal" class="modal"></div>
<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[80]"></div>

var curRows=RS.slice(),tid;

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},3200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function st(s,c){return '<span class="st" style="'+(c||DSTC[s]||'background:#F1F5F9;color:#64748B')+'">'+esc(s)+'</span>';}
function tag(t,c){return '<span class="tag" style="'+(c||'background:#F1F5F9;color:#64748B')+'">'+esc(t)+'</span>';}
function maskPhone(p){return p?p.slice(0,3)+'****'+p.slice(7):'—';}
function maskId(i){return i?i.slice(0,6)+'********'+i.slice(-4):'—';}
function rOf(id){return RS.filter(function(x){return x.id===id;})[0];}
function yearBucket(y){
  if(y==='1 年以内')return '1 年以内';
  if(y==='1-3 年')return '1-3 年';
  return y;
}

function renderStats(){
  var total=RS.length, mon=RS.filter(function(x){return x.at.indexOf('2026-10')===0;}).length;
  var has=RS.filter(function(x){return x.delivers.length>0;}).length;
  var replied=RS.filter(function(x){return x.delivers.some(function(d){return d.state==='已回复';});}).length;
  var none=RS.filter(function(x){return x.delivers.length===0;}).length;
  var cards=[['简历总数',total,'#1F2430'],['本月新增',mon,'#2563EB'],['有投递记录',has,'#7C3AED'],['已获回复',replied,'#15803D'],['暂无投递',none,'#B45309']];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    return '<div class="bg-white rounded-xl border border-gray-100 p-4"><div class="text-[11px] text-[#94A3B8]">'+x[0]+'</div><div class="text-[22px] font-bold mt-1" style="color:'+x[2]+'">'+x[1]+'</div></div>';
  }).join('');
}

function render(){
  var tb=document.getElementById('tb');
  if(!curRows.length){
    tb.innerHTML='<tr><td colspan="12" class="px-4 py-16 text-center text-[13px] text-[#94A3B8]"><i class="fas fa-inbox text-[26px] block mb-2 text-[#CBD5E1]"></i>暂无符合条件的简历<br><span class="text-[11px]">简历由求职者在端上填写，运营端不代录</span></td></tr>';
    document.getElementById('cnt').textContent='共 0 人';
    return;
  }
  tb.innerHTML=curRows.map(function(r){
    var last=r.delivers[0];
    var ops='<span class="lk" onclick="openDetail(\''+r.id+'\')">详情</span>'
      +' · <span class="lk" onclick="toDelivery(\''+r.id+'\')">投递</span>'
      +' · <span class="lk-gray" onclick="viewId(\''+r.id+'\')">查看完整证件号</span>';
    return '<tr class="hover:bg-gray-50/60">'
      +'<td class="px-3 py-3"><span class="font-medium text-[#1F2430]">'+esc(r.name)+'</span><div class="text-[10px] text-[#94A3B8]">'+esc(r.id)+'</div></td>'
      +'<td class="px-3 py-3 text-[12px]">'+maskPhone(r.phone)+'</td>'
      +'<td class="px-3 py-3 text-[12px]">'+maskId(r.idno)+'</td>'
      +'<td class="px-3 py-3 text-center text-[12px]">'+esc(r.mar)+'</td>'
      +'<td class="px-3 py-3 text-[12px]" style="max-width:180px">'+esc(r.addr)+'</td>'
      +'<td class="px-3 py-3 text-[12px] text-[#64748B]">'+esc(r.email)+'</td>'
      +'<td class="px-3 py-3 text-center text-[12px]">'+esc(r.years)+'</td>'
      +'<td class="px-3 py-3 text-[12px]">'+esc(r.major)+'</td>'
      +'<td class="px-3 py-3 text-[12px]">'+esc(r.lang)+'</td>'
      +'<td class="px-3 py-3 text-[12px]">'+esc(r.cert)+'</td>'
      +'<td class="px-3 py-3 text-center">'+(r.delivers.length?('<span class="lk" onclick="toDelivery(\''+r.id+'\')">'+r.delivers.length+' 条</span><div class="mt-1">'+(last?st(last.state):'')+'</div>'):'<span class="tag" style="background:#F1F5F9;color:#94A3B8">无投递</span>')+'</td>'
      +'<td class="px-3 py-3 text-center whitespace-nowrap">'+ops+'</td>'
      +'</tr>';
  }).join('');
  document.getElementById('cnt').textContent='共 '+curRows.length+' 人';
}

function doSearch(){
  var kw=(document.getElementById('f-kw').value||'').trim();
  var ph=(document.getElementById('f-phone').value||'').trim();
  var idn=(document.getElementById('f-idno').value||'').trim();
  var mar=document.getElementById('f-mar').value;
  var yr=document.getElementById('f-years').value;
  var dl=document.getElementById('f-del').value;
  curRows=RS.filter(function(r){
    if(kw&&r.name.indexOf(kw)<0) return false;
    if(ph&&r.phone.slice(-4).indexOf(ph)<0) return false;
    if(idn&&r.idno.slice(-4).indexOf(idn)<0) return false;
    if(mar&&r.mar!==mar) return false;
    if(yr&&r.years!==yr) return false;
    if(dl==='有投递'&&!r.delivers.length) return false;
    if(dl==='无投递'&&r.delivers.length) return false;
    if(dl==='已回复'&&!r.delivers.some(function(d){return d.state==='已回复';})) return false;
    return true;
  });
  render();
}
function resetSearch(){
  ['f-kw','f-phone','f-idno','f-mar','f-years','f-del'].forEach(function(id){document.getElementById(id).value='';});
  curRows=RS.slice();render();
}

function viewId(id){
  var r=rOf(id);
  var h='<div class="p-5"><h3 class="text-[15px] font-bold text-[#1F2430] mb-3">查看完整证件信息</h3>'
    +'<div class="rounded-xl border p-3 mb-3" style="border-color:#FDE68A;background:#FFFBEB"><p class="text-[12px] text-[#64748B]">'+esc(r.name)+'　身份证：<b>'+esc(r.idno)+'</b><br>手机号：<b>'+esc(r.phone)+'</b></p></div>'
    +'<p class="text-[11px] text-[#94A3B8] mb-4"><i class="fas fa-shield-halved mr-1"></i>本次查看将留痕：操作人 王倩 / 时间 2026-10-19 10:42 / 原因需填写</p>'
    +'<label class="fl">查看原因 *</label><select class="sel mb-4" id="v-reason"><option>核实投递身份</option><option>企业要求核验</option><option>投诉处理</option><option>其他</option></select>'

}

}

    +'<p class="text-[12px] text-[#64748B] mb-3">将导出当前筛选结果 <b>'+curRows.length+'</b> 条；身份证与手机号<b>自动脱敏</b>。</p>'
    +'<div class="rounded-xl border p-3 mb-4" style="border-color:#FDE68A;background:#FFFBEB"><p class="text-[11px] text-[#64748B]">导出留痕：操作人 / 时间 / 条数 / 用途。<b>禁止将含个人信息的文件外发</b>。</p></div>'

  show('modal',h);
}

function openDetail(id){
  var r=rOf(id);
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">'+esc(r.name)+'</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+esc(r.id)+'　'+esc(r.years)+'　'+esc(r.mar)+'　简历更新 '+esc(r.at)+'</p></div>'
    +'<button class="btn btn-ghost" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-user text-[#2563EB]"></i>① 基本信息</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">姓名</span><span>'+esc(r.name)+'</span></div>'
    +'<div class="kv"><span class="k">电话</span><span>'+maskPhone(r.phone)+' <span class="lk-gray" onclick="viewId(\''+r.id+'\')">查看完整</span></span></div>'
    +'<div class="kv"><span class="k">身份证</span><span>'+maskId(r.idno)+' <span class="lk-gray" onclick="viewId(\''+r.id+'\')">查看完整</span></span></div>'
    +'<div class="kv"><span class="k">婚姻状况</span><span>'+esc(r.mar)+'</span></div>'
    +'<div class="kv"><span class="k">现住地址</span><span>'+esc(r.addr)+'</span></div>'
    +'<div class="kv"><span class="k">邮箱</span><span>'+esc(r.email)+'</span></div>'
    +'<div class="kv"><span class="k">工作年限</span><span>'+esc(r.years)+'</span></div>'
    +'<div class="kv"><span class="k">专业</span><span>'+esc(r.major)+'</span></div>'
    +'<div class="kv"><span class="k">外语及等级</span><span>'+esc(r.lang)+'</span></div>'
    +'<div class="kv"><span class="k">职业资格</span><span>'+esc(r.cert)+'</span></div>'
    +'</div></div>'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-file-lines text-[#64748B]"></i>② 简历详情</div>'
    +'<div class="text-[12px] text-[#334155] leading-relaxed"><b>技能：</b>'+esc(r.skill)+'</div>'
    +'<div class="text-[12px] text-[#334155] leading-relaxed mt-2"><b>经历：</b>'+esc(r.exp)+'</div></div>'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-paper-plane text-[#7C3AED]"></i>③ 投递记录（'+r.delivers.length+'）</div>'
    +(r.delivers.length?r.delivers.map(function(d){
      return '<div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0 text-[12px]">'
        +'<div><b>'+esc(d.job)+'</b><span class="text-[11px] text-[#94A3B8]">　'+esc(d.unit)+'</span></div>'
        +'<div class="flex items-center gap-3"><span class="text-[11px] text-[#94A3B8]">'+esc(d.time)+'</span>'+st(d.state)+'</div></div>';
    }).join(''):'<div class="text-[12px] text-[#94A3B8]">暂无投递记录</div>')
    +'</div></div>';
  h+='<div class="px-5 py-3 border-t border-gray-100 flex items-center justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeAll()">关闭</button>'
    +'<button class="btn btn-ghost" onclick="closeAll();toDelivery(\''+r.id+'\')">查看投递</button></div>';
  show('drawer',h);
}

function show(which,h){
  document.getElementById(which).innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById(which).classList.add('on');
}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}

renderStats();render();
</script>
