var curRows=JOBS.slice(),tid,sel={};

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},3200);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function st(s,c){return '<span class="st" style="'+(c||JSTC[s]||'background:#F1F5F9;color:#64748B')+'">'+esc(s)+'</span>';}
function tag(t,c){return '<span class="tag" style="'+(c||'background:#F1F5F9;color:#64748B')+'">'+esc(t)+'</span>';}
function jOf(id){return JOBS.filter(function(x){return x.id===id;})[0];}
function sal(j){return (j.salMin||j.salMax)?(j.salMin+'-'+j.salMax+' 元'):'面议';}
function shortCat(c){var a=c.split('-');return a[a.length-1];}
function daysSince(d){var a=new Date(d.replace(/-/g,'/')),b=new Date(TODAY.replace(/-/g,'/'));return Math.round((b-a)/86400000);}

function renderStats(){
  var all=JOBS.length;
  var live=JOBS.filter(function(x){return x.state==='招聘中';}).length;
  var wait=JOBS.filter(function(x){return x.state==='待审核';}).length;
  var rej=JOBS.filter(function(x){return x.state==='已驳回';}).length;
  var cls=JOBS.filter(function(x){return x.state==='已关闭';}).length;
  var mon=JOBS.filter(function(x){return x.pub.indexOf('2026-10')===0;}).length;
  var cards=[['岗位总数',all,'#1F2430'],['招聘中',live,'#15803D'],['待审核',wait,'#B45309'],['已驳回',rej,'#B91C1C'],['已关闭',cls,'#64748B'],['本月新增',mon,'#2563EB']];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    return '<div class="bg-white rounded-xl border border-gray-100 p-4"><div class="text-[11px] text-[#94A3B8]">'+x[0]+'</div><div class="text-[22px] font-bold mt-1" style="color:'+x[2]+'">'+x[1]+'</div></div>';
  }).join('');
}

      +' · <span class="lk" onclick="toDelivery(\''+j.id+'\')">报名信息</span>';

      +'<td class="px-3 py-3"><span class="font-medium text-[#1F2430]">'+esc(j.title)+'</span>'

function doSearch(){
  var d1=document.getElementById('f-d1').value, d2=document.getElementById('f-d2').value;
  var cat=document.getElementById('f-cat').value, title=(document.getElementById('f-title').value||'').trim();
  var unit=document.getElementById('f-unit').value, stt=document.getElementById('f-state').value;
  curRows=JOBS.filter(function(j){
    if(d1&&j.pub<d1) return false;
    if(d2&&j.pub>d2) return false;
    if(cat&&j.cat!==cat) return false;
    if(title&&j.title.indexOf(title)<0) return false;
    if(unit&&j.unit!==unit) return false;
    if(stt&&j.state!==stt) return false;
    return true;
  });
  render();
}

function pick(id,el){if(el.checked){sel[id]=1;}else{delete sel[id];}selTip();}
function toggleAll(el){
  curRows.forEach(function(j){if(el.checked){sel[j.id]=1;}else{delete sel[j.id];}});
  render();selTip();
}
function selTip(){
  var n=Object.keys(sel).length;

function batchDel(){
  var ids=Object.keys(sel);
  if(!ids.length){toast('请先勾选要删除的岗位（仅「已关闭且无投递」可删）');return;}
  var bad=ids.filter(function(id){var j=jOf(id);return !(j.state==='已关闭'&&j.submits===0);});
  if(bad.length){toast('有 '+bad.length+' 条不可删除：未关闭或已有投递记录，只能关闭');return;}
  var h='<div class="p-5"><h3 class="text-[15px] font-bold text-[#1F2430] mb-2">批量删除岗位</h3>'
    +'<p class="text-[13px] text-[#64748B]">已选 '+ids.length+' 条，此操作将删除该数据，是否继续？<br><span class="text-[11px] text-[#94A3B8]">软删保留 180 天，可在操作日志回溯</span></p>'
    +'<div class="flex justify-end gap-2 mt-5"><button class="btn btn-ghost" onclick="closeAll()">取消</button>'
    +'<button class="btn btn-primary" onclick="doBatchDel()">删除</button></div></div>';
  show('modal',h);
}
function doBatchDel(){
  var ids=Object.keys(sel);
  JOBS=JOBS.filter(function(j){return ids.indexOf(j.id)<0;});
  curRows=curRows.filter(function(j){return ids.indexOf(j.id)<0;});
  sel={};closeAll();renderStats();render();
  toast('已删除 '+ids.length+' 条岗位（软删留痕）');
}
function delJob(id){
  var j=jOf(id);
  var h='<div class="p-5"><h3 class="text-[15px] font-bold text-[#1F2430] mb-2">删除岗位</h3>'
    +'<p class="text-[13px] text-[#64748B]">确认删除「<b>'+esc(j.title)+'</b>」？此操作将删除该数据，是否继续？</p>'
    +'<div class="flex justify-end gap-2 mt-5"><button class="btn btn-ghost" onclick="closeAll()">取消</button>'
    +'<button class="btn btn-primary" onclick="doDelJob(\''+id+'\')">删除</button></div></div>';
  show('modal',h);
}
function doDelJob(id){
  JOBS=JOBS.filter(function(x){return x.id!==id;});
  curRows=curRows.filter(function(x){return x.id!==id;});
  closeAll();renderStats();render();toast('已删除岗位（软删留痕）');
}

function doClose(id){

  toast('已关闭：'+j.title+'（原因：'+r+'）→ 端上下架，投递记录保留');

function reopen(id){

  j.logs.unshift({t:TODAY+' 10:35',by:'运营 王倩',txt:'重新上架（第 '+j.ver+' 次），进入待审核'});

function unitMode(){
  var v=document.getElementById('j-src').value;
  var sel=document.getElementById('j-unit-sel'), raw=document.getElementById('j-unit-raw');
  if(v==='m'){sel.classList.remove('hidden');raw.classList.add('hidden');}
  else{sel.classList.add('hidden');raw.classList.remove('hidden');}
}
function saveJob(id){
  var cat=document.getElementById('j-cat').value;
  var title=document.getElementById('j-title').value.trim();
  var isM=document.getElementById('j-src').value==='m';
  var unit=isM?document.getElementById('j-unit-sel').value:document.getElementById('j-unit-raw').value.trim();
  var contact=document.getElementById('j-contact').value.trim();
  var phone=document.getElementById('j-phone').value.trim();
  var addr=document.getElementById('j-addr').value.trim();
  var count=parseInt(document.getElementById('j-count').value,10);
  var pub=document.getElementById('j-pub').value;
  var mn=document.getElementById('j-min').value, mx=document.getElementById('j-max').value;
  var welfare=document.getElementById('j-welfare').value.trim();
  var exp=document.getElementById('j-exp').value;
  var desc=document.getElementById('j-desc').value.trim();
  var state=document.getElementById('j-state').value.replace('（运营代发·免审）','');
  if(!title||!unit||!contact||!phone||!count){toast('工种 / 岗位名称 / 招聘单位 / 联系人 / 联系方式 / 人数 为必填');return;}
  if(mn&&mx&&Number(mn)>Number(mx)){toast('薪资下限不能大于上限（'+mn+' > '+mx+'）');return;}
  if(!/^1\d{10}$/.test(phone)){toast('联系方式需为 11 位手机号（原型可填脱敏值，实际保存前校验）');}
  if(id){
    var j=jOf(id);
    j.cat=cat;j.title=title;j.isM=isM;j.unit=unit;j.contact=contact;j.phone=phone;j.addr=addr;j.count=count;j.pub=pub;
    j.salMin=mn?Number(mn):0;j.salMax=mx?Number(mx):0;j.welfare=welfare;j.exp=exp;j.desc=desc;
    if(j.state!==state){j.state=state;}
    j.logs.unshift({t:TODAY+' 10:40',by:'运营 王倩',txt:'编辑岗位信息'+(j.src==='商家端'?'（商家岗位修改后需重新审核）':'')});
    toast('已保存：'+title+(j.src==='商家端'?'（商家岗位修改后状态回「待审核」）':''));
  }else{
    var nid='GW-2026-0'+(232+JOBS.length);
    JOBS.unshift({id:nid,cat:cat,title:title,isM:isM,unit:unit,contact:contact,phone:phone,addr:addr,count:count,pub:pub,
      salMin:mn?Number(mn):0,salMax:mx?Number(mx):0,welfare:welfare,exp:exp,desc:desc,state:'招聘中',src:'运营代发',
      submits:0,views:0,replies:0,ver:1,closeReason:'',
      logs:[{t:TODAY+' 10:40',by:'运营 王倩',txt:'运营代发（免审）→ 招聘中'}]});
    toast('已新建岗位：'+title+'（运营代发·免审，已直接上架「招聘中」）');
  }
  curRows=JOBS.slice();closeAll();renderStats();render();
}

    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+esc(j.id)+'　'+esc(j.cat)+'　'+st(j.state)+'</p></div>'
    +'<button class="btn btn-ghost" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-circle-info text-[#2563EB]"></i>① 基本信息</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">工种名称</span><span>'+esc(j.cat)+'</span></div>'
    +'<div class="kv"><span class="k">岗位名称</span><span>'+esc(j.title)+'</span></div>'
    +'<div class="kv"><span class="k">招聘单位</span><span>'+esc(j.unit)+(j.isM?' <span class="tag" style="background:#DCFCE7;color:#15803D">已关联商户</span>':' <span class="tag" style="background:#FEF3C7;color:#B45309">非库中</span>')+'</span></div>'
    +'<div class="kv"><span class="k">招聘人数</span><span>'+j.count+' 人</span></div>'
    +'<div class="kv"><span class="k">联系人</span><span>'+esc(j.contact)+'</span></div>'
    +'<div class="kv"><span class="k">联系方式</span><span>'+esc(j.phone)+' <span class="lk-gray" onclick="toast(\'查看完整号码需留痕（查看人 / 时间）\')">查看完整</span></span></div>'
    +'<div class="kv"><span class="k">薪资范围</span><span>'+(j.salMin?'<b style="color:#E63E20">'+j.salMin+' - '+j.salMax+'</b> 元/月':'面议')+'</span></div>'
    +'<div class="kv"><span class="k">工作经验</span><span>'+esc(j.exp||'不限')+'</span></div>'
    +'<div class="kv"><span class="k">工作地址</span><span>'+esc(j.addr||'—')+'</span></div>'
    +'<div class="kv"><span class="k">发布时间</span><span>'+esc(j.pub)+'</span></div>'
    +'<div class="kv"><span class="k">发布方</span><span>'+tag(j.src,SRC[j.src])+'</span></div>'
    +'<div class="kv"><span class="k">关闭原因</span><span>'+(j.closeReason?esc(j.closeReason):'—')+'</span></div>'
    +'</div></div>'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-align-left text-[#64748B]"></i>② 职位描述 / 福利</div>'
    +'<div class="text-[12px] text-[#334155] leading-relaxed whitespace-pre-line">'+esc(j.desc||'（未填写）')+'</div>'
    +'<div class="mt-3 text-[12px] text-[#64748B]"><b>公司福利：</b>'+esc(j.welfare||'—')+'</div></div>'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-shield-halved text-[#B45309]"></i>③ 审核记录（提交 '+j.submits+' 次 / 版本 v'+j.ver+'）</div>'
    +(j.logs.length?j.logs.map(function(l){return '<div class="text-[12px] text-[#334155] py-1.5 border-b border-gray-50 last:border-0"><span class="text-[11px] text-[#94A3B8] mr-2">'+esc(l.t)+'</span>'+esc(l.by)+'：'+esc(l.txt)+'</div>';}).join(''):'<div class="text-[12px] text-[#94A3B8]">暂无记录</div>')
    +'</div>'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-paper-plane text-[#7C3AED]"></i>④ 投递统计</div>'
    +'<div class="grid grid-cols-3 gap-3">'
    +'<div class="rounded-lg p-3" style="background:#F8FAFC"><div class="text-[11px] text-[#94A3B8]">投递</div><div class="text-[18px] font-bold" style="color:#1F2430">'+j.submits+'</div></div>'
    +'<div class="rounded-lg p-3" style="background:#F8FAFC"><div class="text-[11px] text-[#94A3B8]">已查看</div><div class="text-[18px] font-bold" style="color:#2563EB">'+j.views+'</div></div>'
    +'<div class="rounded-lg p-3" style="background:#F8FAFC"><div class="text-[11px] text-[#94A3B8]">已回复</div><div class="text-[18px] font-bold" style="color:#15803D">'+j.replies+'</div></div>'
    +'</div>'

    +'</div>';
  h+='<div class="px-5 py-3 border-t border-gray-100 flex items-center justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeAll()">关闭</button>'
    +'<button class="btn btn-primary" onclick="closeAll();openEdit(\''+j.id+'\')">编辑</button></div>';
  show('drawer',h);
}

function show(which,h){
  document.getElementById(which).innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById(which).classList.add('on');
}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}
