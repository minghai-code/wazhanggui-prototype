<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#2E6BE6,#1D4ED8);color:#fff}.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;background:#EEF2F7;border-radius:9px;padding:2px}
.seg button{border:none;background:transparent;padding:6px 14px;border-radius:7px;font-size:12px;color:#64748B;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:#1D4ED8;font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.12)}
.kpi{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px}
.kpi p:first-child{font-size:11.5px;color:#94A3B8;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
.kpi .s{font-size:11px;color:#94A3B8;margin-top:3px}
.dcard{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:15px 18px;cursor:pointer;transition:.18s;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:132px}
.dcard:hover{border-color:#BFD3F5;box-shadow:0 8px 24px rgba(29,78,216,.10);transform:translateY(-2px)}
.dcard .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
/* 趋势图：Y 轴 + 网格 + 柱 + X 轴 */
.chart{display:flex;gap:8px}
.chart .yaxis{width:52px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;height:118px;font-size:10px;color:#94A3B8;text-align:right;line-height:1}
.chart .plot{flex:1;position:relative;min-width:0}
.chart .plotbox{position:relative;height:118px}
.chart .gl{position:absolute;left:0;right:0;border-top:1px dashed #EEF2F7}
.chart .bars{display:flex;align-items:flex-end;gap:3px;height:100%;position:relative;z-index:2}
.chart .bars>div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.chart .bars i{display:block;width:100%;max-width:36px;border-radius:2px 2px 0 0;background:linear-gradient(180deg,#6B9BF0,#2E6BE6);min-height:2px}
.chart .bars i:hover{filter:brightness(1.12)}
.chart .xaxis{display:flex;gap:3px;padding-top:6px}
.chart .xaxis span{flex:1 1 0;min-width:0;font-size:10px;color:#94A3B8;text-align:center;white-space:nowrap;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:1.5px 6px;border-radius:4px;font-weight:500;white-space:nowrap}
.up{color:#15803D;font-size:11.5px;font-weight:600}
.down{color:#DC2626;font-size:11.5px;font-weight:600}
.flat{color:#94A3B8;font-size:11.5px}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:900px;max-width:96vw;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.14);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:70;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);width:720px;max-width:95vw;max-height:86vh;overflow-y:auto;background:#fff;border-radius:14px;box-shadow:0 24px 64px rgba(15,23,42,.28);opacity:0;pointer-events:none;transition:.22s;z-index:70}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.bar{display:flex;align-items:flex-end;gap:3px;height:84px;padding-top:6px;width:100%}
.bar>div{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.bar i{display:block;width:100%;max-width:34px;border-radius:3px 3px 0 0;background:linear-gradient(180deg,#6B9BF0,#2E6BE6)}
.searchBox{position:relative;width:260px}
.searchBox input{width:100%;padding:7px 10px 7px 30px;border:1px solid #E2E8F0;border-radius:8px;font-size:12.5px;outline:none}
.searchBox input:focus{border-color:#2E6BE6}
.searchBox i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:#94A3B8}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 12px 28px rgba(15,23,42,.14);max-height:260px;overflow-y:auto;z-index:40;display:none}
.sres.on{display:block}
.sres div{padding:8px 12px;font-size:12px;cursor:pointer;color:#334155}
.sres div:hover{background:#F0F5FF;color:#1D4ED8}
.sres .sub{color:#94A3B8;font-size:10.5px;margin-left:6px}
.row{border-bottom:1px solid #F1F5F9}
.row:hover{background:#FAFBFD}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(20,20,40,.9);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:20px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:80vw}
</style>

<div class="p-6" style="width:100%">

  <!-- ① 顶部 -->
  <div class="flex items-start justify-between mb-4">
    <div>
      <h1 class="text-[18px] font-bold text-gray-800">数据资产统计概览</h1>
      <p class="text-[12px] text-gray-400 mt-0.5">
        全系统落库数据资产的总量、新增与异常 ·
        <span class="text-gray-500">数据截至 <b id="asOf">2026-10-22 02:00</b></span>
        <span id="lagTip" class="tag ml-1" style="background:#FEF3C7;color:#B45309;display:none">数据滞后</span>
      </p>
    </div>
    <div class="flex items-center gap-2">
      <div class="searchBox">
        <i class="fas fa-search"></i>
        <input id="q" placeholder="搜索资产 / 业务模块" autocomplete="off" onfocus="showSearch()" oninput="showSearch()">
        <div class="sres" id="sres"></div>
      </div>
      <button class="btn btn-ghost" onclick="exportAll()"><i class="fas fa-download mr-1"></i>导出</button>
    </div>
  </div>

  <!-- 统计期 -->
  <div class="mb-4">
    <div class="flex items-center gap-3">
      <div class="seg" id="seg">
        <button class="on" onclick="setPeriod(0)">今日</button>
        <button onclick="setPeriod(1)">本周</button>
        <button onclick="setPeriod(2)">本月</button>
        <button onclick="setPeriod(3)">本年</button>
        <button onclick="openCustom()" id="segCustom">自定义</button>
      </div>
      <div id="customInline" class="flex items-center gap-2" style="display:none">
        <input type="date" id="cs" class="fi" style="width:144px;padding:6px 8px">
        <span class="text-[11px] text-gray-400">至</span>
        <input type="date" id="ce" class="fi" style="width:144px;padding:6px 8px">
        <button class="btn btn-primary" onclick="applyCustom()">应用</button>
        <button class="btn btn-ghost" onclick="cancelCustom()">取消</button>
        <span class="text-[10.5px] text-gray-400">最长 366 天</span>
      </div>
      <span class="lk text-[11.5px] ml-auto" style="color:#2E6BE6" onclick="showRule()">口径说明</span>
    </div>
    <div class="text-[11.5px] leading-[19px] mt-1.5">
      <p class="text-gray-600" id="periodCur">—</p>
      <p class="text-gray-400" id="periodPrev">—</p>
    </div>
  </div>

  <!-- ② KPI -->
  <div class="grid grid-cols-6 gap-3 mb-4" id="kpis"></div>

  <!-- ③ 趋势 -->
  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center justify-between mb-3">
      <div class="text-[12.5px] font-bold text-[#1F2430]"><i class="fas fa-chart-column mr-1.5" style="color:#2E6BE6"></i><span id="trendTitle">新增趋势</span></div>
      <div class="text-[11px] text-gray-400" id="trendTip"></div>
    </div>
    <div class="chart" id="chart"></div>
  </div>

  <!-- ④ 9 域卡片 -->
  <div class="grid grid-cols-3 gap-3 mb-4" id="cards"></div>

  <!-- ⑤ 榜单 + 异常 -->
  <div class="grid grid-cols-2 gap-3 mb-3">
    <div class="bg-white rounded-xl border border-gray-100 p-4">
      <div class="text-[12.5px] font-bold text-[#1F2430] mb-2.5"><i class="fas fa-arrow-trend-up mr-1.5" style="color:#15803D"></i>增长 Top5<span class="text-[10.5px] font-normal text-gray-400 ml-1.5" id="topIncTip">按新增</span></div>
      <div id="topInc"></div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 p-4">
      <div class="text-[12.5px] font-bold text-[#1F2430] mb-2.5"><i class="fas fa-database mr-1.5" style="color:#7C3AED"></i>体量 Top5<span class="text-[10.5px] font-normal text-gray-400 ml-1.5">按记录总量</span></div>
      <div id="topSize"></div>
    </div>
  </div>

  <!-- 异常 + 未接入 -->
  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-3">
    <div class="flex items-center justify-between mb-2">
      <div class="text-[12.5px] font-bold text-[#1F2430]"><i class="fas fa-triangle-exclamation mr-1.5" style="color:#B45309"></i>异常提示<span id="alertCnt" class="ml-1.5 text-[11px] font-normal text-[#B45309]"></span></div>
      <span class="text-[11px] text-gray-400">超 7 天未更新 / 环比跌幅 &gt; 30% / 采集失败</span>
    </div>
    <div id="alerts"></div>
  </div>

</div>

<div class="mask" id="mask" onclick="closeAll()"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"></div>
<div id="toast"></div>

var P=2; // 默认本月

function fmt(n){return (n||0).toLocaleString('zh-CN');}
function p2(n){return (n<10?'0':'')+n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var CUSTOM=null; // 自定义统计期 {start,end,days,label,cur,prev,prevName,prog}
function curP(){return P===-1?CUSTOM:PERIODS[P];}
function incOf(a){return P===-1?Math.max(0,Math.round(a.i[2]/22*CUSTOM.days)):a.i[P];}
function ratioOf(a){return P===-1?a.r[2]:a.r[P];}
function updOf(a){return P===-1?Math.max(0,Math.round(a.u[2]/22*CUSTOM.days)):a.u[P];}
function ratioHtml(v){
  if(!v){return '<span class="flat">—</span>';}
  return v>0?'<span class="up">↑'+v.toFixed(1)+'%</span>':'<span class="down">↓'+Math.abs(v).toFixed(1)+'%</span>';
}
function liveAssets(){return A.filter(function(a){return a.lv!=='C';});}
function domainAgg(d){
  var list=liveAssets().filter(function(a){return a.d===d;});
  var total=0,inc=0,wsum=0,wt=0;
  list.forEach(function(a){total+=a.t;inc+=incOf(a);var w=incOf(a)||1;wsum+=ratioOf(a)*w;wt+=w;});
  return {total:total,inc:inc,ratio:wt?wsum/wt:0,cnt:list.length};
}

/* ================= 趋势 ================= */
function niceMax(v){
  if(!v){return 1;}
  var p=Math.pow(10,Math.floor(Math.log10(v)));
  var n=v/p;
  var m=n<=1?1:(n<=2?2:(n<=2.5?2.5:(n<=5?5:10)));
  return m*p;
}
function trendSeries(){
  var total=0;liveAssets().forEach(function(a){total+=incOf(a);});
  var labels=[],show={},gran='';
  if(P===-1){
    var dd=CUSTOM.days;
    if(dd<=2){
      gran='按小时（每 2 小时）';
      for(var a=0;a<12;a++){labels.push(p2(a*2)+':00');show[a]=(a%3===0);}
    }else if(dd<=45){
      gran='按天';
      var d0=new Date(CUSTOM.start+'T00:00:00');
      for(var b=0;b<dd;b++){
        var dt=new Date(d0.getTime()+b*86400000);
        labels.push((dt.getMonth()+1)+'/'+dt.getDate());
        show[b]=(b===0||(b+1)%5===0||b===dd-1);
      }
    }else{
      gran='按月';
      var ns=new Date(CUSTOM.start+'T00:00:00'),ne=new Date(CUSTOM.end+'T00:00:00');
      var span=(ne.getFullYear()-ns.getFullYear())*12+(ne.getMonth()-ns.getMonth());
      for(var c=0;c<=span;c++){labels.push(((ns.getMonth()+c)%12+1)+'月');show[c]=true;}
    }
  }else if(P===0){
    gran='按小时（每 2 小时）';
    for(var i=0;i<12;i++){labels.push(p2(i*2)+':00');show[i]=(i%3===0);}
  }else if(P===1){
    gran='按天';
    labels=['周一','周二','周三','周四','周五','周六','周日'];
    labels.forEach(function(_,i){show[i]=true;});
  }else if(P===2){
    gran='按天';var last=22;
    for(var i=1;i<=last;i++){labels.push(i+'日');show[i-1]=(i===1||i%5===0||i===last);}
  }else{
    gran='按月';
    for(var i=1;i<=10;i++){labels.push(i+'月');show[i-1]=true;}
  }
  var n=labels.length,vals=[],sum=0;
  for(var i=0;i<n;i++){var s=0.55+Math.abs(Math.sin((i+1)*0.9))*0.9;vals.push(s);sum+=s;}
  vals=vals.map(function(v){return Math.round(total*v/sum);});
  return {labels:labels,vals:vals,show:show,total:total,gran:gran};
}
function renderTrend(){
  var d=trendSeries();
  var mx=Math.max.apply(null,d.vals)||1;
  var top=niceMax(mx);
  var ticks=[top,top*0.75,top*0.5,top*0.25,0];
  var fv=function(v){return v>=10000?(v/10000).toFixed(1)+'万':fmt(v);};

  var h='<div class="yaxis">'+ticks.map(function(t){return '<span>'+fv(t)+'</span>';}).join('')+'</div>';
  h+='<div class="plot"><div class="plotbox">';
  h+='<div class="gl" style="top:0"></div><div class="gl" style="top:25%"></div><div class="gl" style="top:50%"></div><div class="gl" style="top:75%"></div><div class="gl" style="top:100%"></div>';
  h+='<div class="bars">'+d.vals.map(function(v,i){
    var hp=top?Math.max(2,v/top*118):2;
    return '<div title="'+d.labels[i]+'：'+fmt(v)+' 条"><i style="height:'+hp+'px"></i></div>';
  }).join('')+'</div></div>';
  h+='<div class="xaxis">'+d.labels.map(function(l,i){return '<span>'+(d.show[i]?l:'')+'</span>';}).join('')+'</div>';
  h+='</div>';
  document.getElementById('chart').innerHTML=h;
  var PL=curP().label;
  document.getElementById('trendTitle').textContent=PL+'新增趋势';
  document.getElementById('trendTip').textContent=PL+' · '+d.gran+' · 合计 '+fmt(d.total)+' 条 · 峰值 '+fmt(mx)+' 条';
}
function ratioOfText(v){return v?(v>0?'+'+v.toFixed(1)+'%':'-'+Math.abs(v).toFixed(1)+'%'):'无对比';}

      +'<span class="tag" style="background:#F4F7FC;color:#64748B">'+g.cnt+' 个资产</span></div>'

      +'<div class="flex items-center gap-3 mt-1.5 text-[11px]">'
      +(isC?'<span class="flat">暂无接入</span>'

/* ================= 搜索 ================= */
function showSearch(){
  var kw=(document.getElementById('q').value||'').trim();
  var box=document.getElementById('sres');
  if(!kw){box.classList.remove('on');return;}

  }).join('');}

document.addEventListener('click',function(e){
  var b=document.getElementById('sres');

});

/* ================= 域抽屉 ================= */
function openDomain(di,hl){
  var d=DOMAINS[di];
  var list=liveAssets().filter(function(a){return a.d===di;});
  var g=domainAgg(di);
  var subs={};
  list.forEach(function(a){(subs[a.sub]=subs[a.sub]||[]).push(a);});
  var h='<div class="flex items-start justify-between px-5 py-4 border-b border-gray-100">'
    +'<div class="flex items-start gap-3"><div class="ic" style="width:38px;height:38px;border-radius:11px;background:'+d.color+';color:#fff;display:flex;align-items:center;justify-content:center"><i class="fas '+d.icon+'"></i></div>'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">'+d.n+'</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-0.5">'+g.cnt+' 个资产　记录总量 '+fmt(g.total)+'　'+curP().label+'新增 '+fmt(g.inc)+'　'+ratioHtml(g.ratio)+'</p></div></div>'
    +'<button class="btn btn-ghost" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';

    subs[s].forEach(function(a){
      var isHL=(hl&&a.n===hl);
      var canJump=(a.lv==='A'&&a.link);
      h+='<div class="row flex items-center gap-2 px-2 py-2.5 rounded-lg'+(isHL?'" style="background:#EFF6FF"':'')+'">'
        +'<div class="flex-1" style="min-width:0"><span class="text-[12.5px] font-medium text-[#1F2430]">'+esc(a.n)+'</span>'
        +(a.lv==='B'?'<span class="tag ml-1.5" style="background:#F1F5F9;color:#94A3B8">明细页开发中</span>':'')
        +'</div>'
        +'<div class="text-right" style="width:96px"><span class="text-[12.5px] font-semibold text-[#1F2430]">'+fmt(a.t)+'</span>'
        +'<div class="text-[10px] text-gray-400">总量</div></div>'
        +'<div class="text-right" style="width:92px"><span class="text-[12.5px] font-semibold" style="color:#15803D">+'+fmt(incOf(a))+'</span>'
        +'<div class="text-[10px]">'+ratioHtml(ratioOf(a))+'</div></div>'
        +'<div class="text-right text-[10.5px] text-gray-400" style="width:78px">'+esc(a.up||'—')+'</div>'
        +'<div style="width:74px;text-align:right">'+(canJump?'<span class="lk text-[11.5px]" onclick="gotoPage(\''+a.link+'\',\''+esc(a.n)+'\')" style="color:#2E6BE6">明细 ›</span>':'<span class="text-[11px] text-gray-300">—</span>')+'</div>'
        +'</div>';
    });
  });
  h+='</div>';
  h+='<div class="px-5 py-3 border-t border-gray-100 flex justify-between items-center">'
    +'<span class="text-[11px] text-gray-400">数据截至 2026-10-22 02:00　口径：不含已作废/已删除</span>'
    +'<div class="flex gap-2"><button class="btn btn-ghost" onclick="exportDomain('+di+')">导出本域</button>'
    +'<button class="btn btn-ghost" onclick="closeAll()">关闭</button></div></div>';
  show('drawer',h);
  if(hl){setTimeout(function(){var el=document.querySelector('#drawer .row[style*="EFF6FF"]');if(el){el.scrollIntoView({block:'center'});}},120);}

function gotoPage(link,name){
  toast('跳转业务明细：'+name+'（'+link+'，已带统计期参数）');
  window.open(link,'_blank');
}

/* ================= 操作 ================= */
function applyPeriodLabel(i){
  var pd=(i===-1?CUSTOM:PERIODS[i]);
  if(!pd){return;}
  document.getElementById('periodCur').textContent=pd.label+'：'+pd.cur+'　（'+pd.prog+'）';
  document.getElementById('periodPrev').textContent='对比：'+pd.prev+'　（'+pd.prevName+'）';
}

/* ============ 自定义统计期 ============ */
/* 自定义：行内展开，不弹窗 */
function openCustom(){
  var el=document.getElementById('customInline');
  var cs=document.getElementById('cs'),ce=document.getElementById('ce');
  if(!cs.value){cs.value=CUSTOM?CUSTOM.start:'2026-10-01';}
  if(!ce.value){ce.value=CUSTOM?CUSTOM.end:'2026-10-22';}
  var open=(el.style.display!=='flex');
  el.style.display=(open?'flex':'none');
  if(open){cs.focus();}
}
function cancelCustom(){
  document.getElementById('customInline').style.display='none';
}
function applyCustom(){
  var s=document.getElementById('cs').value,e=document.getElementById('ce').value;
  if(!s||!e){toast('请选择起止日期');return;}
  var d1=new Date(s+'T00:00:00'),d2=new Date(e+'T00:00:00');
  if(d2<d1){toast('结束日期不能早于开始日期');return;}
  var days=Math.round((d2-d1)/86400000)+1;
  if(days>366){toast('区间最长 366 天');return;}
  var ps=new Date(d1.getTime()-days*86400000),pe=new Date(d1.getTime()-86400000);
  var fd=function(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
  var fs=function(d){return (d.getMonth()+1)+'/'+d.getDate();};
  CUSTOM={
    start:s,end:e,days:days,
    label:fs(d1)+'-'+fs(d2),
    cur:s+' 00:00 ~ '+e+' 23:59',
    prev:fd(ps)+' ~ '+fd(pe),
    prevName:'上期（等长前一段）',
    prog:'已选 '+days+' 天'
  };
  P=-1;
  var bs=document.getElementById('seg').children;
  for(var k=0;k<bs.length;k++){bs[k].className=(k===4?'on':'');}
  applyPeriodLabel(-1);
  renderAll();
  toast('已切换为自定义区间：'+CUSTOM.cur);
}
function setPeriod(i){
  P=i;
  var bs=document.getElementById('seg').children;
  for(var k=0;k<bs.length;k++){bs[k].className=(k===i?'on':'');}
  applyPeriodLabel(i);
  renderAll();
}
function exportAll(){
  var n=liveAssets().length;
  if(!n){toast('当前无数据，无法导出');return;}
  toast('已导出 '+n+' 个资产的统计（'+curP().label+'，不含明细数据），已记录导出日志');
}
function exportDomain(di){
  var n=liveAssets().filter(function(a){return a.d===di;}).length;
  toast('已导出「'+DOMAINS[di].n+'」'+n+' 个资产统计');
}

/* ================= 基础 ================= */
function show(w,h){document.getElementById(w).innerHTML=h;document.getElementById('mask').classList.add('on');document.getElementById(w).classList.add('on');}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}

/* 口径说明 */

    return '<tr class="border-t border-gray-100"><td class="py-2 pr-3 font-semibold text-[12px] text-gray-700 whitespace-nowrap">'+p.label+'</td>'
      +'<td class="py-2 pr-3 text-[11.5px] text-gray-600 whitespace-nowrap">'+p.cur+'</td>'
      +'<td class="py-2 pr-3 text-[11.5px] text-gray-600 whitespace-nowrap">'+p.prev+'</td>'
      +'<td class="py-2 text-[11px] text-gray-400 whitespace-nowrap">'+p.prog+'</td></tr>';
  }).join('');
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<h3 class="text-[15px] font-bold text-[#1F2430]">统计口径说明</h3>'
    +'<button class="btn btn-ghost" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="px-5 py-4">'
    +'<p class="text-[12px] text-gray-600 mb-3">统计期是<b>未走完的周期</b>，截止到当前时刻；<b>环比一律与「上期同期」对比</b>，不与上期整期对比（否则未完成的周期永远是负增长）。</p>'
    +'<table class="w-full text-[12px] mb-4"><thead><tr class="text-[11px] text-gray-400"><th class="text-left font-normal pb-1.5">档位</th><th class="text-left font-normal pb-1.5">统计范围</th><th class="text-left font-normal pb-1.5">环比对比期</th><th class="text-left font-normal pb-1.5">进度</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="text-[11.5px] text-gray-600 leading-6">'
    +'<p class="font-semibold text-gray-700 mb-1">指标定义</p>'
    +'<p>· <b>新增</b>：期内新建的业务记录（排除导入 / 迁移 / 初始化批次），页面按档位命名（今日新增 / 本周新增 / 本月新增 / 本年新增）</p>'
    +'<p>· <b>更新</b>：期内有实质变更的记录数（updated_at），单列，不并入新增</p>'
    +'<p>· <b>记录总量</b>：当前有效记录数，不含已作废 / 已删除</p>'
    +'<p>· <b>环比</b>：当期新增 ÷ 上期同期新增 − 1；上期为 0 时显示「—」</p>'
    +'</div>'
    +'<div class="mt-4 rounded-xl border p-3" style="border-color:#FDE68A;background:#FFFBEB"><p class="text-[11px] text-[#64748B]"><b>边界规则</b>：① 上期无对应日（如 3-31 对比 2 月）取上期最后一天；② 闰年 2-29 对比去年取 2-28；③ 导入量单独统计，不上面、不参与环比；<b>④ 自定义区间</b>：环比与「等长前一段」对比（如 10-01~10-10 对比 09-21~09-30），最长 366 天。</p></div>'
    +'</div>';
  h+='<div class="px-5 py-3 border-t border-gray-100 flex justify-end"><button class="btn btn-primary" onclick="closeAll()">知道了</button></div>';
  show('modal',h);
}
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},3400);}
function renderAll(){renderKpis();renderTrend();renderCards();renderTops();renderAlerts();}

applyPeriodLabel(P);
renderAll();
</script>
