<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商户管理 - 入驻申请审核</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#F1F5F9}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:600;white-space:nowrap}
.btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;border:none;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,#FF7849,#FF4D2D);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:#fff;color:#64748B;border:1px solid #E2E8F0}
.btn-ghost:hover{border-color:#CBD5E1;color:#1F2430}
.lk{color:#FF4D2D;cursor:pointer;font-size:12px}
.lk:hover{text-decoration:underline}
.lk-gray{color:#64748B;cursor:pointer;font-size:12px}
.lk-gray:hover{color:#1F2430;text-decoration:underline}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;white-space:nowrap}
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);opacity:0;pointer-events:none;transition:.2s;z-index:60}
.mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:600px;max-width:96vw;background:#fff;box-shadow:-8px 0 32px rgba(15,23,42,.12);transform:translateX(100%);transition:transform .26s cubic-bezier(.22,1,.36,1);z-index:70;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.fl{display:block;font-size:11px;color:#94A3B8;margin-bottom:4px}
.kv{display:flex;gap:8px;font-size:12px;line-height:1.9}
.kv .k{color:#94A3B8;width:76px;flex-shrink:0}
.kv .v{color:#1F2430;flex:1;word-break:break-all}
.blk{border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px}
.blk-t{font-size:12.5px;font-weight:700;color:#1F2430;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sel{width:100%;padding:5px 8px;border:1px solid #E2E8F0;border-radius:6px;font-size:12px;outline:none}
input[type=checkbox].ck{width:14px;height:14px;accent-color:#FF4D2D;cursor:pointer}
button{cursor:pointer}
</style>
<!-- Tailwind 静态样式：本地引用（不再依赖 cdn.tailwindcss.com）；改动页面后重新构建见 wazhanggui-code/_tw-build/build.ps1 -->
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="p-6">

  <!-- 页面标题 -->
  <div class="flex items-start justify-between mb-5">
    <div>
      <div class="flex items-center gap-2">
        <h1 class="text-[20px] font-bold text-[#1F2430]">入驻申请审核</h1>
        <span class="tag" style="background:#DBEAFE;color:#2563EB">04 商户管理</span>
      </div>
      <p class="text-[12px] text-gray-400 mt-1">线上入驻申请的初审 / 复审；档口信息由系统按「姓名 + 身份证」自动识别（只读，来自 02 市场资源管理），审核通过后自动判定商户类型并开通权限</p>
    </div>
    <div class="flex items-center gap-2">
      <button class="btn btn-ghost" onclick="toast('已导出当前筛选结果（身份证已脱敏）')"><i class="fas fa-download text-[10px] mr-1"></i>导出</button>
      <button class="btn btn-primary" onclick="syncNow()"><i class="fas fa-rotate text-[10px] mr-1"></i>立即同步</button>
    </div>
  </div>

  <!-- 统计卡片 -->
  <div class="grid grid-cols-6 gap-3 mb-4" id="stats"></div>

  <!-- 筛选 -->
  <div class="bg-white rounded-xl border border-gray-100 p-4 mb-4">
    <div class="flex items-center gap-3 flex-wrap">
      <input id="f-kw" type="text" placeholder="申请编号 / 商户名称 / 联系人 / 手机号 / 身份证后4位" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary w-80">
      <select id="f-type" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部类型（预判）</option>
        <option>仅线上</option>
        <option>线上兼档口</option>
      </select>
      <select id="f-stall" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">是否命中线下档口</option>
        <option value="yes">命中（→ 线上兼档口）</option>
        <option value="no">未命中（→ 仅线上）</option>
      </select>
      <select id="f-status" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
        <option value="">全部状态</option>
        <option>待初审</option>
        <option>待复审</option>
        <option>需补充材料</option>
        <option>已通过</option>
        <option>已驳回</option>
        <option>已撤回</option>
      </select>
      <input id="f-d1" type="date" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
      <span class="text-gray-300 text-xs">至</span>
      <input id="f-d2" type="date" class="px-3 py-1.5 text-[13px] bg-gray-50 rounded-lg border border-gray-200 outline-none focus:border-primary text-gray-600">
      <button class="btn btn-primary" onclick="doSearch()">查询</button>
      <button class="btn btn-ghost" onclick="resetSearch()">重置</button>
    </div>
  </div>

  <!-- 列表 -->
  <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
    <div class="px-5 py-3 border-b border-gray-100 flex items-center justify-between">
      <span class="text-[12px] text-[#94A3B8]" id="cnt">共 0 条</span>
      <span class="text-[11px] text-[#94A3B8]"><i class="fas fa-circle-info mr-1"></i>「关联线下档口」来自 02 市场资源管理，本页只读、不可编辑</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-[13px]" style="min-width:1240px">
        <thead>
          <tr class="bg-gray-50 text-gray-500 text-[12px]">
            <th class="px-4 py-3 text-left font-medium">申请编号</th>
            <th class="px-4 py-3 text-left font-medium">商户名称</th>
            <th class="px-4 py-3 text-left font-medium">申请人</th>
            <th class="px-4 py-3 text-left font-medium">身份证号</th>
            <th class="px-4 py-3 text-left font-medium">主体类型</th>
            <th class="px-4 py-3 text-left font-medium">主营品类</th>
            <th class="px-4 py-3 text-left font-medium">关联线下档口</th>
            <th class="px-4 py-3 text-left font-medium">商户类型（预判）</th>
            <th class="px-4 py-3 text-left font-medium">提交时间</th>
            <th class="px-4 py-3 text-left font-medium">状态</th>
            <th class="px-4 py-3 text-center font-medium">操作</th>
          </tr>
        </thead>
        <tbody id="tb" class="divide-y divide-gray-50"></tbody>
      </table>
    </div>
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <span class="text-[12px] text-gray-400" id="pageInfo">共 0 条记录</span>
      <div class="flex items-center gap-1">
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="toast('已是第一页（原型）')"><i class="fas fa-chevron-left text-[10px]"></i></button>
        <button class="w-7 h-7 flex items-center justify-center text-white text-[12px] rounded" style="background:#FF4D2D" onclick="toast('当前第 1 页（原型）')">1</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-600 text-[12px] rounded hover:bg-gray-100" onclick="toast('已切换到第 2 页（原型）')">2</button>
        <button class="w-7 h-7 flex items-center justify-center text-gray-400 rounded hover:bg-gray-100" onclick="toast('已切换到第 2 页（原型）')"><i class="fas fa-chevron-right text-[10px]"></i></button>
      </div>
    </div>
  </div>

</div>

<div id="mask" class="mask" onclick="closeD()"></div>
<div id="drawer" class="drawer"></div>
<div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-[#1F2430] text-white text-[13px] px-5 py-2.5 rounded-lg opacity-0 pointer-events-none transition z-[80]"></div>

<script>
/* ================= 模拟数据（原型态） ================= */
/* 命中线下档口的档口数据来自 02 市场资源管理（样例取自客户《出租合同台账》：资产名称即摊位号） */
var ROWS=[
  {id:'MA20260928001',shop:'晓琳袜业经营部',name:'汤晓琳',idno:'330681198807150021',sub:'个体工商户',cat:'女袜 / 打底裤',
   stamps:[{code:'A9-10',b:'A 栋',floor:'9 层',area:'147.2',term:'2026.01.01 ~ 2028.12.31',contract:'LT-2026-0069'}],
   time:'2026-09-28 09:12',status:'待初审'},
  {id:'MA20260928002',shop:'诸暨市暖足坊袜业有限公司',name:'王建国',idno:'330681197912031234',sub:'企业',cat:'男袜 / 保暖袜',
   stamps:[],time:'2026-09-28 10:35',status:'待初审'},
  {id:'MA20260928003',shop:'棉田纱线直营店',name:'陈志强',idno:'330681198503127777',sub:'工厂制造商',cat:'原料 / 纱线',
   stamps:[{code:'B3-08',b:'B 栋',floor:'3 层',area:'86.5',term:'2025.06.01 ~ 2027.05.31',contract:'LT-2025-0231'},
           {code:'A9-12',b:'A 栋',floor:'9 层',area:'147.2',term:'2026.01.01 ~ 2028.12.31',contract:'LT-2026-0070'}],
   time:'2026-09-28 11:02',status:'待初审'},
  {id:'MA20260927004',shop:'花间舞时尚女袜馆',name:'周雅琴',idno:'330681199201054456',sub:'个体工商户',cat:'女袜 / 船袜',
   stamps:[],time:'2026-09-27 15:20',status:'待复审'},
  {id:'MA20260927005',shop:'极速运动袜业',name:'李海涛',idno:'330681198810236619',sub:'企业',cat:'运动袜',
   stamps:[],time:'2026-09-27 16:48',status:'待复审'},
  {id:'MA20260926006',shop:'绿源竹纤维科技',name:'吴晓峰',idno:'330681199005186633',sub:'企业',cat:'童袜 / 抗菌袜',
   stamps:[],time:'2026-09-26 09:30',status:'需补充材料',need:['营业执照照片不清晰','经营类目与实际不符'],reason:'资料不全'},
  {id:'MA20260925007',shop:'大唐旗舰精梳棉',name:'赵敏',idno:'330681198702148888',sub:'企业',cat:'男袜 / 商务袜',
   stamps:[{code:'A9-15',b:'A 栋',floor:'9 层',area:'160.0',term:'2024.01.01 ~ 2026.12.31',contract:'LT-2024-0102'}],
   time:'2026-09-25 14:10',status:'已通过'},
  {id:'MA20260924008',shop:'某贸易商行',name:'孙某某',idno:'330681199307155522',sub:'个体工商户',cat:'女袜',
   stamps:[],time:'2026-09-24 17:05',status:'已驳回',reason:'资质不符',memo:'营业执照经营范围不含针纺织品，需换主体后重新提交'}
];
function maskId(s){return String(s).slice(0,6)+'********'+String(s).slice(-4);}
var STATS_AUTO={job:'2026-09-28 02:00',next:'2026-09-29 02:00',pulled:42,created:6,merged:3,err:3};
var shownId={};          /* 身份证完整值已查看（审计留痕） */
var curRows=ROWS.slice();
var curId=null,curMode='view';
var tid;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity='1';clearTimeout(tid);tid=setTimeout(function(){t.style.opacity='0'},2600);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ================= 状态与类型 ================= */
var STC={'待初审':'background:#FEF3C7;color:#B45309','待复审':'background:#DBEAFE;color:#2563EB','需补充材料':'background:#FFEDE7;color:#E63E20',
  '已通过':'background:#DCFCE7;color:#15803D','已驳回':'background:#FEE2E2;color:#B91C1C','已撤回':'background:#F1F5F9;color:#64748B'};
function stTag(s){return '<span class="st" style="'+(STC[s]||'background:#F1F5F9;color:#64748B')+'">'+esc(s)+'</span>';}
function isStall(r){return r.stamps&&r.stamps.length>0;}
function typeGuess(r){return isStall(r)?'线上兼档口':'仅线上';}

/* ================= 列表 ================= */
function renderStats(){
  var c={'待初审':0,'待复审':0,'需补充材料':0,'已通过':0,'已驳回':0};
  ROWS.forEach(function(r){if(c[r.status]!=null){c[r.status]++;}});
  var cards=[
    ['待初审',c['待初审'],'#B45309'],
    ['待复审',c['待复审'],'#2563EB'],
    ['需补充材料',c['需补充材料'],'#E63E20'],
    ['本月通过',c['已通过'],'#15803D'],
    ['本月驳回',c['已驳回'],'#B91C1C']
  ];
  var h=cards.map(function(x){
    return '<div class="bg-white rounded-lg border border-gray-100 p-3.5"><p class="text-[11px] text-gray-400">'+x[0]+'</p>'
      +'<p class="text-xl font-bold mt-1" style="color:'+x[2]+'">'+x[1]+'</p></div>';
  }).join('');
  h+='<a href="merchant-auto.html" class="bg-white rounded-lg border p-3.5 block hover:shadow transition" style="border-color:#FDB4A3">'
    +'<p class="text-[11px]" style="color:#E63E20"><i class="fas fa-triangle-exclamation mr-1"></i>自动建档异常</p>'
    +'<p class="text-xl font-bold mt-1" style="color:#E63E20">'+STATS_AUTO.err+'</p>'
    +'<p class="text-[10px] text-[#94A3B8] mt-0.5">点击去处理 →</p></a>';
  document.getElementById('stats').innerHTML=h;
}
function render(){
  var h='';
  curRows.forEach(function(r){
    var stall=isStall(r)
      ? r.stamps.map(function(s){return '<span class="tag" style="background:#DCFCE7;color:#15803D;margin-right:3px">'+esc(s.code)+'</span>';}).join('')
      : '<span class="text-[#94A3B8]">—</span>';
    var idCell = shownId[r.id]
      ? '<span class="font-medium text-[#1F2430]">'+esc(r.idno)+'</span> <span class="text-[10px] text-[#94A3B8]">已留痕</span>'
      : '<span class="text-[#64748B]">'+esc(maskId(r.idno))+'</span> <span class="lk" onclick="showId(\''+r.id+'\')">查看</span>';
    var ops='';
    if(r.status==='待初审'){ops='<span class="lk" onclick="openD(\''+r.id+'\',\'first\')">初审</span> · <span class="lk-gray" onclick="openD(\''+r.id+'\',\'view\')">详情</span>';}
    else if(r.status==='待复审'){ops='<span class="lk" onclick="openD(\''+r.id+'\',\'second\')">复审</span> · <span class="lk-gray" onclick="openD(\''+r.id+'\',\'view\')">详情</span>';}
    else if(r.status==='需补充材料'){ops='<span class="lk" onclick="urge(\''+r.id+'\')">催办</span> · <span class="lk-gray" onclick="openD(\''+r.id+'\',\'view\')">详情</span>';}
    else{ops='<span class="lk-gray" onclick="openD(\''+r.id+'\',\'view\')">查看</span>';}
    h+='<tr class="hover:bg-gray-50 transition">'
      +'<td class="px-4 py-3 text-[#64748B]">'+esc(r.id)+'</td>'
      +'<td class="px-4 py-3 font-medium text-[#1F2430]">'+esc(r.shop)+'</td>'
      +'<td class="px-4 py-3">'+esc(r.name)+(isStall(r)?' <span class="tag" style="background:#DCFCE7;color:#15803D">已有档口</span>':'')+'</td>'
      +'<td class="px-4 py-3 whitespace-nowrap">'+idCell+'</td>'
      +'<td class="px-4 py-3 text-[#64748B]">'+esc(r.sub)+'</td>'
      +'<td class="px-4 py-3 text-[#64748B]">'+esc(r.cat)+'</td>'
      +'<td class="px-4 py-3 whitespace-nowrap">'+stall+'</td>'
      +'<td class="px-4 py-3"><span class="tag" style="background:'+(isStall(r)?'#DCFCE7;color:#15803D':'#F1F5F9;color:#475569')+'">'+typeGuess(r)+'</span></td>'
      +'<td class="px-4 py-3 text-[#94A3B8] text-[12px]">'+esc(r.time)+'</td>'
      +'<td class="px-4 py-3">'+stTag(r.status)+'</td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'+ops+'</td></tr>';
  });
  if(!curRows.length){h='<tr><td colspan="11" class="px-4 py-16 text-center text-gray-300"><i class="fas fa-inbox text-3xl block mb-2"></i><span class="text-[12px]">暂无匹配的入驻申请</span></td></tr>';}
  document.getElementById('tb').innerHTML=h;
  document.getElementById('cnt').textContent='共 '+curRows.length+' 条（原型演示数据 8 条）';
  document.getElementById('pageInfo').textContent='共 '+curRows.length+' 条记录，第 1-'+curRows.length+' 条';
}
function showId(id){shownId[id]=true;render();toast('已展示完整身份证号，并记录查看留痕（人 / 时间 / IP，审计可查）');}

/* ================= 筛选 ================= */
function doSearch(){
  var kw=document.getElementById('f-kw').value.trim(),t=document.getElementById('f-type').value,st=document.getElementById('f-stall').value,s=document.getElementById('f-status').value;
  curRows=ROWS.filter(function(r){
    var okKw=!kw||r.id.indexOf(kw)>-1||r.shop.indexOf(kw)>-1||r.name.indexOf(kw)>-1||r.idno.slice(-4).indexOf(kw)>-1;
    var okT=!t||typeGuess(r)===t;
    var okSt=!st||(st==='yes'?isStall(r):!isStall(r));
    var okS=!s||r.status===s;
    return okKw&&okT&&okSt&&okS;
  });
  render();toast('已按条件查询，共 '+curRows.length+' 条');
}
function resetSearch(){
  ['f-kw','f-type','f-stall','f-status','f-d1','f-d2'].forEach(function(k){document.getElementById(k).value='';});
  curRows=ROWS.slice();render();toast('已重置筛选条件');
}

/* ================= 审核抽屉 ================= */
function openD(id,mode){
  curId=id;curMode=mode;
  var r=ROWS.filter(function(x){return x.id===id;})[0];
  if(!r){return;}
  var editable=(mode==='first'&&r.status==='待初审')||(mode==='second'&&r.status==='待复审');
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">'+(mode==='first'?'初审':(mode==='second'?'复审':'申请详情'))+'　'+esc(r.id)+'</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+stTag(r.status)+'　提交时间 '+esc(r.time)+'</p></div>'
    +'<button class="text-gray-400 hover:text-gray-600" onclick="closeD()"><i class="fas fa-xmark"></i></button></div>';

  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">';

  /* 1 申请信息 */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-user text-[#FF4D2D]"></i>申请信息（买家端提交）</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">商户名称</span><span class="v font-semibold">'+esc(r.shop)+'</span></div>'
    +'<div class="kv"><span class="k">申请人</span><span class="v">'+esc(r.name)+'</span></div>'
    +'<div class="kv"><span class="k">身份证号</span><span class="v">'+(shownId[r.id]?esc(r.idno)+' <span class="text-[10px] text-[#94A3B8]">已留痕</span>':esc(maskId(r.idno))+' <span class="lk" onclick="showId(\''+r.id+'\')">查看</span>')+'</span></div>'
    +'<div class="kv"><span class="k">手机号</span><span class="v">138****6621</span></div>'
    +'<div class="kv"><span class="k">主体类型</span><span class="v">'+esc(r.sub)+'</span></div>'
    +'<div class="kv"><span class="k">主营品类</span><span class="v">'+esc(r.cat)+'</span></div>'
    +'</div>'
    +'<div class="mt-3 flex items-center gap-2 text-[12px] text-[#64748B]"><i class="fas fa-paperclip"></i>附件：'
    +'<span class="lk" onclick="toast(\'预览：营业执照\')">营业执照.jpg</span>'
    +'<span class="lk" onclick="toast(\'预览：法人身份证人像面\')">法人身份证-人像面.jpg</span>'
    +'<span class="lk" onclick="toast(\'预览：法人身份证国徽面\')">法人身份证-国徽面.jpg</span></div>'
    +'</div>';

  /* 2 系统识别（线下档口，只读） */
  if(isStall(r)){
    h+='<div class="blk" style="border-color:#BBF7D0;background:#F6FEF9"><div class="blk-t" style="color:#15803D"><i class="fas fa-link"></i>系统识别：名下已有线下档口（只读）</div>'
      +r.stamps.map(function(s){
        return '<div class="rounded-lg bg-white border border-gray-100 p-3 mb-2">'
          +'<div class="flex items-center gap-2 mb-1"><span class="tag" style="background:#FFEDE7;color:#E63E20">档口 '+esc(s.code)+'</span>'
          +'<span class="text-[11px] text-[#94A3B8]">数据来源：02 市场资源管理（合同匹配）</span></div>'
          +'<div class="grid grid-cols-2 gap-x-6">'
          +'<div class="kv"><span class="k">位置</span><span class="v">'+esc(s.b)+' · '+esc(s.floor)+'</span></div>'
          +'<div class="kv"><span class="k">面积</span><span class="v">'+esc(s.area)+' ㎡</span></div>'
          +'<div class="kv"><span class="k">租期</span><span class="v">'+esc(s.term)+'</span></div>'
          +'<div class="kv"><span class="k">合同号</span><span class="v">'+esc(s.contract)+'</span></div>'
          +'</div></div>';
      }).join('')
      +'<p class="text-[11px] text-[#15803D] mt-1"><i class="fas fa-circle-info mr-1"></i>审核通过后，该商户类型判定为「<b>线上兼档口商户</b>」；档口信息以 02 数据为准，本模块不可编辑。</p></div>';
  } else {
    h+='<div class="blk" style="border-color:#FDE68A;background:#FFFBEB"><div class="blk-t" style="color:#B45309"><i class="fas fa-link-slash"></i>系统识别：未命中线下档口</div>'
      +'<p class="text-[12px] text-[#64748B] leading-6">按「姓名 + 身份证号」在 02 市场资源管理的档口数据中未匹配到记录。说明：<br>'
      +'· 该申请人<b>无线下档口</b>，审核通过后类型判定为「<b>仅线上商户</b>」；<br>'
      +'· 若实际有档口但没匹配上（合同缺身份证号 / 档口号未映射），请到「线下自动建档与同步」页处理异常，不要在此页手工关联。</p></div>';
  }

  /* 3 建档与权限（通过后的连锁动作） */
  h+='<div class="blk"><div class="blk-t"><i class="fas fa-diagram-project text-[#2563EB]"></i>审核通过后的连锁动作（自动）</div>'
    +'<div class="text-[12px] text-[#64748B] leading-7">'
    +'① 建档 / 合并到已有商户档案（主键：身份证号；线下已建档的<b>不新建</b>）；<br>'
    +'② 判定商户类型：<b>'+(isStall(r)?'线上兼档口商户':'仅线上商户')+'</b>；<br>'
    +'③ 开通权限：电商权限（可建店铺）；询价权限需<b>企业资质认证通过</b>后单独开通；<br>'
    +'④ 通知申请人（买家端站内信 + 短信）。</div></div>';

  /* 4 审核动作 */
  if(r.status==='需补充材料'&&mode!=='view'){
    h+='<div class="blk" style="border-color:#FDB4A3"><div class="blk-t" style="color:#E63E20"><i class="fas fa-clock"></i>当前状态：需补充材料</div>'
      +'<p class="text-[12px] text-[#64748B]">已通知申请人补件，等待其在买家端重新提交；可点击「催办」再次提醒。</p></div>';
  }
  if(editable){
    h+='<div class="blk" style="border-color:#FDB4A3;background:#FFF6F3"><div class="blk-t" style="color:#E63E20"><i class="fas fa-pen-to-square"></i>'+(mode==='first'?'初审':'复审')+'结论</div>'
      +'<div id="needBlk" class="mb-3" style="display:none"><label class="fl">需补充的材料（至少选 1 项）</label>'
      +'<div class="grid grid-cols-2 gap-1.5 text-[12px] text-[#334155]">'
      +'<label class="inline-flex items-center gap-2"><input type="checkbox" class="ck" value="营业执照不清晰">营业执照不清晰</label>'
      +'<label class="inline-flex items-center gap-2"><input type="checkbox" class="ck" value="法人身份证缺失或过期">法人身份证缺失或过期</label>'
      +'<label class="inline-flex items-center gap-2"><input type="checkbox" class="ck" value="经营范围与主营品类不符">经营范围与主营品类不符</label>'
      +'<label class="inline-flex items-center gap-2"><input type="checkbox" class="ck" value="联系方式无法接通">联系方式无法接通</label>'
      +'<label class="inline-flex items-center gap-2"><input type="checkbox" class="ck" value="主体信息与身份证不一致">主体信息与身份证不一致</label>'
      +'<label class="inline-flex items-center gap-2"><input type="checkbox" class="ck" value="其他（见备注）">其他（见备注）</label>'
      +'</div></div>'
      +'<div id="rejBlk" class="mb-3" style="display:none"><label class="fl"><i style="color:#FF4D2D;font-style:normal;margin-right:2px">*</i>驳回原因（必填）</label>'
      +'<select id="rejReason" class="sel"><option value="">请选择驳回原因</option><option>资料不全</option><option>资质不符</option><option>身份不符</option><option>重复申请</option><option>其他</option></select>'
      +'<p class="text-[11px] text-[#94A3B8] mt-1">驳回原因会推送给申请人，可附备注；申请人可在 30 天内重新提交。</p></div>'
      +'<label class="fl">审核备注（选填）</label>'
      +'<textarea id="auditMemo" rows="2" class="w-full p-2 text-[12px] border border-[#E2E8F0] rounded-lg outline-none" placeholder="补充说明，会记录在申请单流转轨迹里"></textarea>'
      +'<div class="flex items-center gap-2 mt-3">'
      +(mode==='first'
        ? '<button class="btn btn-primary" onclick="submitAudit(\'first\')">初审通过 → 转复审</button>'
        : '<button class="btn btn-primary" onclick="submitAudit(\'second\')">复审通过 → 建档并开通权限</button>')
      +'<button class="btn btn-ghost" onclick="showNeed()">需补充材料</button>'
      +'<button class="btn btn-ghost" onclick="showRej()" style="color:#B91C1C;border-color:#FECACA">驳回</button>'
      +'</div>'
      +'<div id="confirmBlk" class="mt-3" style="display:none">'
      +'<button class="btn btn-primary" onclick="submitAudit(\'need\')" id="btnNeed">确认发出补件通知</button>'
      +'<button class="btn btn-primary" onclick="submitAudit(\'reject\')" id="btnRej" style="display:none;background:linear-gradient(135deg,#EF4444,#B91C1C)">确认驳回</button>'
      +'</div></div>';
  } else if(r.status==='已通过'||r.status==='已驳回'||r.status==='需补充材料'){
    h+='<div class="blk"><div class="blk-t"><i class="fas fa-clipboard-check text-[#64748B]"></i>审核轨迹</div>'
      +'<div class="text-[12px] text-[#64748B] leading-7">'
      +'· 提交申请（申请人）　'+esc(r.time)+'<br>'
      +(r.status==='需补充材料'?'· 初审要求补充材料（商户管理专员）　原因：'+(r.need||[]).join('、')+'<br>':'')
      +(r.status==='已通过'?'· 初审通过 → 复审通过 → 已建档「'+typeGuess(r)+'」并开通电商权限（运营主管）<br>':'')
      +(r.status==='已驳回'?'· 驳回（'+esc(r.reason||'')+'）'+(r.memo?'　备注：'+esc(r.memo):'')+'<br>':'')
      +'</div></div>';
  }

  h+='</div>';
  h+='<div class="px-5 py-3.5 border-t border-gray-100 flex justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeD()">关闭</button>'
    +(r.status==='已通过'?'<button class="btn btn-primary" onclick="location.href=\'merchant-profile.html\'">查看商户档案</button>':'')
    +'</div>';
  document.getElementById('drawer').innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById('drawer').classList.add('on');
}
function closeD(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
}
function showNeed(){
  document.getElementById('needBlk').style.display='block';
  document.getElementById('rejBlk').style.display='none';
  document.getElementById('confirmBlk').style.display='block';
  document.getElementById('btnNeed').style.display='inline-block';
  document.getElementById('btnRej').style.display='none';
}
function showRej(){
  document.getElementById('rejBlk').style.display='block';
  document.getElementById('needBlk').style.display='none';
  document.getElementById('confirmBlk').style.display='block';
  document.getElementById('btnRej').style.display='inline-block';
  document.getElementById('btnNeed').style.display='none';
}
function submitAudit(action){
  var r=ROWS.filter(function(x){return x.id===curId;})[0];
  if(!r){return;}
  var memo=(document.getElementById('auditMemo')||{}).value||'';
  if(action==='first'){
    r.status='待复审';toast('初审已通过，申请单已转运营主管复审');closeD();render();renderStats();return;
  }
  if(action==='second'){
    r.status='已通过';
    toast('复审通过：已建档「'+typeGuess(r)+'」并开通电商权限，已通知申请人');
    closeD();render();renderStats();return;
  }
  if(action==='need'){
    var picked=[].slice.call(document.querySelectorAll('#needBlk input.ck:checked')).map(function(c){return c.value;});
    if(!picked.length){toast('请至少勾选 1 项需补充的材料');return;}
    r.status='需补充材料';r.need=picked;
    toast('已发出补件通知（买家端 + 短信），申请单置「需补充材料」');
    closeD();render();renderStats();return;
  }
  if(action==='reject'){
    var rs=document.getElementById('rejReason').value;
    if(!rs){toast('驳回原因必填，请先选择');return;}
    r.status='已驳回';r.reason=rs;r.memo=memo;
    toast('已驳回（'+rs+'），原因已推送给申请人');
    closeD();render();renderStats();return;
  }
}
function urge(id){toast('已向申请人发送催办提醒（站内信 + 短信）　'+id);}
function syncNow(){toast('已触发一次线下建档同步：拉取 '+STATS_AUTO.pulled+' 条，新建 '+STATS_AUTO.created+' 条，合并 '+STATS_AUTO.merged+' 条，异常 '+STATS_AUTO.err+' 条 —— 详见「线下自动建档与同步」页');}

/* ================= 初始化 ================= */
renderStats();
render();
</script>
</body>
</html>
