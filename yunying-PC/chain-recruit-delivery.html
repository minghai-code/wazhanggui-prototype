function maskPhone(p){return p?p.slice(0,3)+'****'+p.slice(7):'—';}
function dOf(id){return DL.filter(function(x){return x.id===id;})[0];}
function hoursSince(t){
  var a=new Date(t.replace(/-/g,'/')), b=new Date(TODAY.replace(/-/g,'/')+' 12:00:00');
  return Math.round((b-a)/3600000);
}

function renderStats(){
  var total=DL.length;
  var wait=DL.filter(function(x){return x.state==='已投递';}).length;
  var viewed=DL.filter(function(x){return x.state==='已查看';}).length;
  var rep=DL.filter(function(x){return x.state==='已回复';}).length;
  var rej=DL.filter(function(x){return x.state==='已拒绝';}).length;
  var today=DL.filter(function(x){return x.time.indexOf('2026-10-19')===0;}).length;
  var cards=[['投递总数',total,'#1F2430'],['待查看',wait,'#2563EB'],['已查看待回复',viewed,'#B45309'],['已回复（约面试）',rep,'#15803D'],['已拒绝',rej,'#B91C1C'],['今日新增',today,'#7C3AED']];
  document.getElementById('stats').innerHTML=cards.map(function(x){
    return '<div class="bg-white rounded-xl border border-gray-100 p-4"><div class="text-[11px] text-[#94A3B8]">'+x[0]+'</div><div class="text-[22px] font-bold mt-1" style="color:'+x[2]+'">'+x[1]+'</div></div>';
  }).join('');
}

function render(){
  var tb=document.getElementById('tb');
  if(!curRows.length){
    tb.innerHTML='<tr><td colspan="9" class="px-4 py-16 text-center text-[13px] text-[#94A3B8]"><i class="fas fa-inbox text-[26px] block mb-2 text-[#CBD5E1]"></i>暂无符合条件的投递<br><span class="text-[11px]">投递由求职者在端上发起；运营端不代投</span></td></tr>';
    document.getElementById('cnt').textContent='共 0 条';
    return;
  }
  tb.innerHTML=curRows.map(function(d){
    var late=(d.state==='已投递'&&hoursSince(d.time)>48);
    var ops='<span class="lk" onclick="openDetail(\''+d.id+'\')">详情</span>';
    if(d.state!=='已回复'&&d.state!=='已拒绝'&&d.state!=='已撤回'){ops+=' · <span class="lk" onclick="openReply(\''+d.id+'\')">回复</span>';}
    else{ops+=' · <span class="lk-gray" onclick="openReply(\''+d.id+'\')">补充回复</span>';}
    return '<tr class="hover:bg-gray-50/60'+(late?' style="background:#FEF2F2"':'')+'">'
      +'<td class="px-4 py-3"><span class="font-medium text-[#1F2430]">'+esc(d.job)+'</span>'
        +(d.jobClosed?'<div class="text-[10px] mt-0.5" style="color:#94A3B8"><i class="fas fa-lock mr-1"></i>岗位已关闭（投递保留）</div>':'')
        +'</td>'
      +'<td class="px-4 py-3 text-[12px]">'+esc(d.unit)+'</td>'
      +'<td class="px-4 py-3 text-[12px]"><span class="lk" onclick="toResume(\''+esc(d.seeker)+'\')">'+esc(d.seeker)+'</span></td>'
      +'<td class="px-4 py-3 text-[12px]">'+maskPhone(d.phone)+'</td>'
      +'<td class="px-4 py-3 text-center text-[12px]">'+esc(d.years)+'</td>'
      +'<td class="px-4 py-3 text-[12px] text-[#64748B]">'+esc(d.time)+(late?'<div class="text-[10px]" style="color:#B91C1C">超 48h 未查看</div>':'')+'</td>'
      +'<td class="px-4 py-3 text-center">'+st(d.state)+'</td>'
      +'<td class="px-4 py-3 text-[11px] text-[#64748B]">'+esc(d.lastReply)+'</td>'
      +'<td class="px-4 py-3 text-center whitespace-nowrap">'+ops+'</td>'
      +'</tr>';
  }).join('');
  document.getElementById('cnt').textContent='共 '+curRows.length+' 条';
}

function doSearch(){
  var job=document.getElementById('f-job').value, unit=document.getElementById('f-unit').value;
  var kw=(document.getElementById('f-kw').value||'').trim(), stt=document.getElementById('f-state').value;
  var d1=document.getElementById('f-d1').value, d2=document.getElementById('f-d2').value;
  curRows=DL.filter(function(d){
    if(job&&d.job!==job) return false;
    if(unit&&d.unit!==unit) return false;
    if(kw&&d.seeker.indexOf(kw)<0) return false;
    if(stt&&d.state!==stt) return false;
    if(d1&&d.time<d1) return false;
    if(d2&&d.time>d2+' 23:59') return false;
    return true;
  });
  render();
}
function resetSearch(){
  document.getElementById('f-job').value='';
  document.getElementById('f-unit').value='';
  document.getElementById('f-kw').value='';
  document.getElementById('f-state').value='';
  document.getElementById('f-d1').value='2026-10-01';
  document.getElementById('f-d2').value='2026-10-19';
  curRows=DL.slice();render();
}

function toResume(name){
  toast('跳转「简历管理」，筛选求职者='+name);
}
function toJob(id){
  toast('跳转「岗位管理」→ 岗位详情（'+id+'）');
}

/* ===== 详情（首次打开自动置已查看） ===== */
function openDetail(id){
  var d=dOf(id);curId=id;
  if(d.state==='已投递'){
    d.state='已查看';
    d.tl.unshift({t:TODAY+' 10:45',by:'运营 王倩',txt:'打开详情，状态 → 已查看（自动留痕）'});
    renderStats();render();
    toast('首次查看：该投递已自动置「已查看」并留痕');
  }
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">'+esc(d.seeker)+'　投递「'+esc(d.job)+'」</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+esc(d.id)+'　'+esc(d.unit)+'　投递 '+esc(d.time)+'　'+st(d.state)+'</p></div>'
    +'<button class="btn btn-ghost" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-briefcase text-[#FF4D2D]"></i>① 岗位摘要</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">岗位名称</span><span>'+esc(d.job)+'</span></div>'
    +'<div class="kv"><span class="k">招聘单位</span><span>'+esc(d.unit)+'</span></div>'
    +'<div class="kv"><span class="k">岗位状态</span><span>'+(d.jobClosed?'<span class="tag" style="background:#F1F5F9;color:#64748B">已关闭</span>（投递记录保留）':'<span class="tag" style="background:#DCFCE7;color:#15803D">招聘中</span>')+'　<span class="lk" onclick="toJob(\''+d.jobId+'\')">查看岗位详情</span></span></div>'
    +'<div class="kv"><span class="k">投递时间</span><span>'+esc(d.time)+'</span></div>'
    +'</div></div>'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-id-card text-[#2563EB]"></i>② 简历快照（投递时点，不随简历更新）</div>'
    +'<div class="grid grid-cols-2 gap-x-6">'
    +'<div class="kv"><span class="k">姓名</span><span>'+esc(d.snap.name)+'</span></div>'
    +'<div class="kv"><span class="k">电话</span><span>'+maskPhone(d.phone)+' <span class="lk-gray" onclick="toast(\'查看完整号码需留痕\')">查看完整</span></span></div>'
    +'<div class="kv"><span class="k">婚姻状况</span><span>'+esc(d.snap.mar)+'</span></div>'
    +'<div class="kv"><span class="k">工作年限</span><span>'+esc(d.years)+'</span></div>'
    +'<div class="kv"><span class="k">现住地址</span><span>'+esc(d.snap.addr)+'</span></div>'
    +'<div class="kv"><span class="k">邮箱</span><span>'+esc(d.snap.email)+'</span></div>'
    +'<div class="kv"><span class="k">专业</span><span>'+esc(d.snap.major)+'</span></div>'
    +'<div class="kv"><span class="k">外语及等级</span><span>'+esc(d.snap.lang)+'</span></div>'
    +'<div class="kv"><span class="k">职业资格</span><span>'+esc(d.snap.cert)+'</span></div>'
    +'<div class="kv"><span class="k">技能</span><span>'+esc(d.snap.skill)+'</span></div>'
    +'</div></div>'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-clock-rotate-left text-[#7C3AED]"></i>③ 回复时间线</div>'
    +'<div class="tl">'+d.tl.map(function(x){return '<div class="tli"><span class="text-[11px] text-[#94A3B8] mr-2">'+esc(x.t)+'</span><b>'+esc(x.by)+'</b>：'+esc(x.txt)+'</div>';}).join('')+'</div></div>'
    +'</div>';
  h+='<div class="px-5 py-3 border-t border-gray-100 flex items-center justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeAll()">关闭</button>'
    +'<button class="btn btn-ghost" onclick="closeAll();toResume(\''+esc(d.seeker)+'\')">查看简历</button>'
    +'<button class="btn btn-primary" onclick="closeAll();openReply(\''+d.id+'\')"><i class="fas fa-reply text-[10px] mr-1"></i>回复</button></div>';
  show('drawer',h);
}

/* ===== 回复 ===== */
function openReply(id){
  var d=dOf(id);curId=id;
  var h='<div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">'
    +'<div><h3 class="text-[15px] font-bold text-[#1F2430]">回复求职者</h3>'
    +'<p class="text-[11px] text-[#94A3B8] mt-1">'+esc(d.seeker)+'　'+esc(d.job)+'　'+esc(d.phone)+'</p></div>'
    +'<button class="btn btn-ghost" onclick="closeAll()"><i class="fas fa-xmark"></i></button></div>';
  h+='<div class="flex-1 overflow-y-auto px-5 py-4" style="display:flex;flex-direction:column;gap:14px">'
    +'<div class="blk"><div class="blk-t"><i class="fas fa-comment-dots text-[#FF4D2D]"></i>回复内容</div>'
    +'<label class="fl">回复结论 *</label><select class="sel mb-3" id="r-res" onchange="replyMode()"><option value="ok">约面试</option><option value="no">不合适（拒绝）</option></select>'
    +'<div id="okBox">'
    +'<div class="grid grid-cols-2 gap-3"><div><label class="fl">面试时间 *</label><input class="fi" id="r-time" type="datetime-local" value="2026-10-21T09:30"></div>'
    +'<div><label class="fl">面试地点 *</label><input class="fi" id="r-place" value="大唐街道轻纺路 18 号 厂区办公室"></div></div>'
    +'<label class="fl mt-3">补充说明</label><textarea class="fi" id="r-note" rows="2" placeholder="携带身份证、健康证等">请携带身份证原件，提前 10 分钟到厂。</textarea>'
    +'</div>'
    +'<div id="noBox" style="display:none">'
    +'<label class="fl">不合适原因 *</label><select class="sel mb-3" id="r-reason"><option>岗位技能不匹配</option><option>经验不足</option><option>已招满</option><option>薪资预期不符</option><option>其他</option></select>'
    +'<label class="fl">补充说明</label><textarea class="fi" id="r-note2" rows="2" placeholder="可留一句建议，提升体验"></textarea>'
    +'</div>'
    +'<div class="mt-3"><label class="chk"><input type="checkbox" id="r-notify" checked> 同步通知求职者（端上消息 + 短信可选）</label></div>'
    +'</div></div>';
  h+='</div>';
  h+='<div class="px-5 py-3 border-t border-gray-100 flex items-center justify-end gap-2">'
    +'<button class="btn btn-ghost" onclick="closeAll()">取消</button>'
    +'<button class="btn btn-primary" onclick="doReply(\''+id+'\')">发送回复</button></div>';
  show('drawer',h);
}
function replyMode(){
  var v=document.getElementById('r-res').value;
  document.getElementById('okBox').style.display=(v==='ok'?'':'none');
  document.getElementById('noBox').style.display=(v==='no'?'':'none');
}
function doReply(id){
  var d=dOf(id);
  var res=document.getElementById('r-res').value;
  var notify=document.getElementById('r-notify').checked;
  if(res==='ok'){
    var t=document.getElementById('r-time').value, p=document.getElementById('r-place').value.trim();
    if(!t||!p){toast('约面试需填写面试时间与地点');return;}
    d.state='已回复';d.lastReply=TODAY+' 10:50 约面试';
    d.tl.unshift({t:TODAY+' 10:50',by:'运营 王倩',txt:'回复：约面试　时间 '+t.replace('T',' ')+'　地点 '+p});
    toast('已回复「约面试」→ 求职者收到通知'+(notify?'（端上消息 + 短信）':'（仅站内）'));
  }else{
    var r=document.getElementById('r-reason').value;
    d.state='已拒绝';d.lastReply=TODAY+' 10:50 不合适';
    d.tl.unshift({t:TODAY+' 10:50',by:'运营 王倩',txt:'回复：不合适　原因 '+r});
    toast('已回复「不合适（'+r+'）」→ 求职者收到通知');
  }
  closeAll();renderStats();render();
}

function show(which,h){
  document.getElementById(which).innerHTML=h;
  document.getElementById('mask').classList.add('on');
  document.getElementById(which).classList.add('on');
}
function closeAll(){
  document.getElementById('mask').classList.remove('on');
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('modal').classList.remove('on');
}

/* 初始化下拉 */
(function(){
  var jobs=[],units=[];
  DL.forEach(function(d){if(jobs.indexOf(d.job)<0)jobs.push(d.job);if(units.indexOf(d.unit)<0)units.push(d.unit);});
  var sj=document.getElementById('f-job');
  jobs.forEach(function(j){var o=document.createElement('option');o.textContent=j;o.value=j;sj.appendChild(o);});
  var su=document.getElementById('f-unit');
  units.forEach(function(u){var o=document.createElement('option');o.textContent=u;o.value=u;su.appendChild(o);});
})();

renderStats();render();
</script>
<script src="../shared/page-prd.js"></script>
</body>
</html>
