<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>智慧工厂驾驶舱 · 大唐袜业</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head><body>
<div class="dash">
  <div class="cockpit-head"></div>

  <div class="kpi-row6">
    <div class="kpi-tile"><div class="k-label">产能利用率</div><div class="k-val">86.5<i>%</i></div><div class="k-trend up">▲ 2.1%</div></div>
    <div class="kpi-tile"><div class="k-label">设备在线</div><div class="k-val">4.8<i>万</i></div><div class="k-trend up">▲ 0.6%</div></div>
    <div class="kpi-tile"><div class="k-label">今日产量</div><div class="k-val">1280<i>万双</i></div><div class="k-trend up">▲ 4.3%</div></div>
    <div class="kpi-tile"><div class="k-label">产品良品率</div><div class="k-val">98.7<i>%</i></div><div class="k-trend up">▲ 0.2%</div></div>
    <div class="kpi-tile"><div class="k-label">故障设备</div><div class="k-val">12<i>台</i></div><div class="k-trend dn">▼ 5</div></div>
    <div class="kpi-tile"><div class="k-label">标杆工厂</div><div class="k-val">6<i>家</i></div><div class="k-trend up">▲ 1</div></div>
  </div>

  <div class="theme-main">
    <!-- 左翼 -->
    <div class="col">
      <div class="card" style="flex:0 0 220px">
        <h3><i class="fa-solid fa-gauge-high"></i>产能总览</h3>
        <div style="display:flex;gap:8px;height:150px">
          <div id="fgG1" style="flex:1;min-height:0"></div>
          <div id="fgG2" style="flex:1;min-height:0"></div>
        </div>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-list-ul"></i>产能发布</h3>
        <div class="rk-list" id="fgRank"></div>
      </div>
      <div class="card grow">
        <h3><i class="fa-solid fa-server"></i>设备状态</h3>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;padding:4px 2px">
          <div class="kpi-tile" style="padding:10px 12px"><div class="k-label">运行</div><div class="k-val" style="font-size:20px;color:var(--c-green)">142</div></div>
          <div class="kpi-tile" style="padding:10px 12px"><div class="k-label">空闲</div><div class="k-val" style="font-size:20px;color:var(--c-blue)">3</div></div>
          <div class="kpi-tile" style="padding:10px 12px"><div class="k-label">故障</div><div class="k-val" style="font-size:20px;color:var(--c-red)">3</div></div>
          <div class="kpi-tile" style="padding:10px 12px"><div class="k-label">保养</div><div class="k-val" style="font-size:20px;color:var(--c-amber)">2</div></div>
        </div>
      </div>
    </div>

    <!-- 中央：车间产线布局 + 产量趋势 -->
    <div class="mid">
      <div class="card park grow">
        <h3 class="park-h"><i class="fa-solid fa-diagram-project"></i>车间 / 产线布局图<i class="fa-solid fa-layer-group park-ic"></i></h3>
        <div id="parkFac" style="position:absolute;inset:40px 12px 12px"></div>
        <div class="map-info" id="miFac">
          <div class="mi-h"><i class="fa-solid fa-industry"></i> 产线总览</div>
          <div class="mi-row"><span>运行机台</span><b>142</b></div>
          <div class="mi-row"><span>故障</span><b>3</b></div>
          <div class="mi-row"><span>离线 / 保养</span><b>3</b></div>
        </div>
        <div class="map-legend">
          <span class="lg"><i style="background:#34d399"></i>运行</span>
          <span class="lg"><i style="background:#fbbf24"></i>故障</span>
          <span class="lg"><i style="background:#f87171"></i>离线</span>
          <span class="lg"><i style="background:#60a5fa"></i>保养</span>
        </div>
      </div>
      <div class="card" style="flex:0 0 210px">
        <h3><i class="fa-solid fa-chart-column"></i>近七天产量趋势</h3>
        <div id="fgYield" style="flex:1;min-height:0"></div>
      </div>
    </div>

    <!-- 右翼 -->
    <div class="col">
      <div class="card grow">
        <h3><i class="fa-solid fa-triangle-exclamation"></i>设备故障告警</h3>
        <div class="warn-list" id="fgWarn"></div>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-magnifying-glass-chart"></i>质检分析</h3>
        <div class="ov-tile"><span>整体良品率</span><b>98.7%</b></div>
        <div class="mini-bar"><i style="width:98.7%;background:linear-gradient(90deg,#34d399,#22d3ee)"></i></div>
        <div class="ov-tile" style="margin-top:6px"><span>不良 · 尺寸偏差</span><b>0.6%</b></div>
        <div class="ov-tile"><span>不良 · 织疵</span><b>0.4%</b></div>
        <div class="ov-tile"><span>不良 · 色差</span><b>0.3%</b></div>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-star"></i>标杆工厂</h3>
        <div class="rk-list" id="fgModel"></div>
      </div>
    </div>
  </div>
</div>

<script src="cockpit.js"></script>
<script>
Cockpit.renderHead('智慧工厂驾驶舱','fa-gears','产能 · 设备 / 产量 / 质检 / 标杆','theme-factory.html');
document.getElementById('parkFac').innerHTML=Cockpit.workshopMap();
function gauge(id,val,color){var g=echarts.init(document.getElementById(id));
  g.setOption({series:[{type:'gauge',startAngle:210,endAngle:-30,radius:'94%',center:['50%','58%'],
    progress:{show:true,width:9,itemStyle:{color:color}},axisLine:{lineStyle:{width:9,color:[[1,'rgba(255,255,255,.1)']]}},
    axisTick:{show:false},splitLine:{show:false},axisLabel:{show:false},pointer:{show:false},anchor:{show:false},
    detail:{valueAnimation:true,fontSize:22,fontWeight:'bolder',color:'#eef3fb',offsetCenter:[0,'0%'],formatter:'{value}%'},
    data:[{value:val}]}]});return g;}
var gs=[gauge('fgG1',86.5,'#22d3ee'),gauge('fgG2',98.7,'#a78bfa')];
var rk=[['华海智能产线',94],['浪莎智造',90],['丹吉娅工厂',85],['健盛产线',80],['宝娜斯',74]];
document.getElementById('fgRank').innerHTML=rk.map(function(r,i){
  return '<div class="rk"><span class="rk-no'+(i===0?' top':'')+'">'+(i+1)+'</span><span class="rk-name">'+r[0]+'</span><span class="rk-bar"><i style="width:'+r[1]+'%"></i></span><span class="rk-val">'+r[1]+'</span></div>';}).join('');
var md=[['华海智能工厂','产能利用率 94%'],['浪莎智造','良品率 99.2%'],['丹吉娅','数字化 5 级'],['健盛','设备联网 100%'],['宝娜斯','能耗 -12%'],['情怡','交付 48h']];
document.getElementById('fgModel').innerHTML=md.map(function(m,i){
  return '<div class="rk"><span class="rk-no'+(i===0?' top':'')+'">'+(i+1)+'</span><span class="rk-name">'+m[0]+'</span><span class="rk-bar" style="width:auto;background:none"><span style="font-size:11px;color:var(--t3)">'+m[1]+'</span></span></div>';}).join('');
var wl=document.getElementById('fgWarn');
[['1号产线 M3 断针','华海工厂','高'],['3号产线 M7 温控异常','丹吉娅','中'],['2号产线 M5 通讯中断','浪莎','中'],
 ['4号产线 M2 保养到期','健盛','低'],['物流传送带卡顿','仓储中心','低']].forEach(function(w){
  var lv=w[2]==='高'?'lv-h':w[2]==='中'?'lv-m':'lv-l';
  wl.innerHTML+='<div class="wl-item"><span class="lv '+lv+'">'+w[2]+'</span><span class="wl-txt">'+w[0]+'<i>'+w[1]+'</i></span></div>';});
var y=echarts.init(document.getElementById('fgYield'));var x=['一','二','三','四','五','六','日'],v=[1180,1240,1210,1290,1260,1310,1280];
y.setOption({grid:{left:8,right:10,top:14,bottom:6},xAxis:{type:'category',data:x,axisLine:{lineStyle:{color:'rgba(255,255,255,.18)'}},axisLabel:{color:'#8a98b0',fontSize:10},axisTick:{show:false}},
 yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}},axisLabel:{color:'#8a98b0',fontSize:10}},
 series:[{type:'bar',data:v,barWidth:16,itemStyle:{borderRadius:[5,5,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#22d3ee'},{offset:1,color:'#a78bfa'}])}}]});
window.addEventListener('resize',function(){gs.forEach(function(g){g.resize();});y.resize();});
</script>
</body></html>
