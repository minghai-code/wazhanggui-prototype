<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线交易驾驶舱 · 大唐袜业</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head><body>
<div class="dash">
  <div class="cockpit-head"></div>

  <div class="kpi-row6">
    <div class="kpi-tile"><div class="k-label">累计 GMV</div><div class="k-val">3.87<i>亿</i></div><div class="k-trend up">▲ 12.6%</div></div>
    <div class="kpi-tile"><div class="k-label">今日订单</div><div class="k-val">52.4<i>万</i></div><div class="k-trend up">▲ 8.3%</div></div>
    <div class="kpi-tile"><div class="k-label">支付转化</div><div class="k-val">68.2<i>%</i></div><div class="k-trend up">▲ 1.4%</div></div>
    <div class="kpi-tile"><div class="k-label">客单价</div><div class="k-val">73.8<i>元</i></div><div class="k-trend dn">▼ 0.9%</div></div>
    <div class="kpi-tile"><div class="k-label">跨境交易</div><div class="k-val">4820<i>万</i></div><div class="k-trend up">▲ 21%</div></div>
    <div class="kpi-tile"><div class="k-label">退款率</div><div class="k-val">1.8<i>%</i></div><div class="k-trend dn">▼ 0.3%</div></div>
  </div>

  <div class="theme-main">
    <!-- 左翼 -->
    <div class="col">
      <div class="card grow">
        <h3><i class="fa-solid fa-bolt"></i>交易监控</h3>
        <div class="feed" id="trFeed"></div>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-filter"></i>询盘转化漏斗</h3>
        <div id="trFunnel" style="padding:6px 2px"></div>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-trophy"></i>平台采购榜</h3>
        <div class="rk-list" id="trRank"></div>
      </div>
    </div>

    <!-- 中央：园区交易热力 + 趋势 -->
    <div class="mid">
      <div class="card park grow">
        <h3 class="park-h"><i class="fa-solid fa-fire"></i>园区交易热力分布<i class="fa-solid fa-layer-group park-ic"></i></h3>
        <div id="parkTr" style="position:absolute;inset:40px 12px 12px"></div>
        <div class="map-info" id="miTr">
          <div class="mi-h"><i class="fa-solid fa-sack-dollar"></i> 今日成交</div>
          <div class="mi-row"><span>内贸</span><b>3.39 亿</b></div>
          <div class="mi-row"><span>跨境</span><b>4,820 万</b></div>
          <div class="mi-row"><span>实时</span><b>1,284 笔/时</b></div>
        </div>
        <div class="map-legend">
          <span class="lg"><i style="background:#22d3ee"></i>内贸成交</span>
          <span class="lg"><i style="background:#a78bfa"></i>跨境成交</span>
          <span class="lg"><i style="background:#34d399"></i>发货</span>
        </div>
      </div>
      <div class="card" style="flex:0 0 210px">
        <h3><i class="fa-solid fa-arrow-trend-up"></i>三十天交易趋势</h3>
        <div id="trTrend" style="flex:1;min-height:0"></div>
      </div>
    </div>

    <!-- 右翼 -->
    <div class="col">
      <div class="card">
        <h3><i class="fa-solid fa-diagram-project"></i>渠道来源</h3>
        <div id="trChannel" style="flex:1;min-height:0"></div>
      </div>
      <div class="card">
        <h3><i class="fa-solid fa-boxes-packing"></i>集采运营</h3>
        <div class="ov-tile"><span>集采 GMV</span><b>6,820 万</b></div>
        <div class="ov-tile"><span>参与商户</span><b>486 家</b></div>
        <div class="ov-tile"><span>综合节约</span><b>1,240 万</b></div>
      </div>
      <div class="card grow">
        <h3><i class="fa-solid fa-globe"></i>跨境专区</h3>
        <div class="ov-tile"><span>出口国家</span><b>38 个</b></div>
        <div class="ov-tile"><span>跨境订单</span><b>8.6 万</b></div>
        <div class="ov-tile"><span>跨境 GMV</span><b>4,820 万</b></div>
        <div class="ov-tile" style="margin-top:4px"><span>热门品类</span><b>运动袜 / 连裤袜</b></div>
      </div>
    </div>
  </div>
</div>

<script src="cockpit.js"></script>
<script>
Cockpit.renderHead('在线交易驾驶舱','fa-cart-shopping','交易监控 · 渠道 / 采购 / 集采 / 跨境','theme-trade.html');
var p=document.getElementById('parkTr');p.innerHTML=Cockpit.parkMap();
Cockpit.addMarkers(p,[['16%','21%','#22d3ee','交易市场A区','成交 4,820 万'],
 ['84%','21%','#a78bfa','交易市场B区','成交 3,160 万'],
 ['16%','66%','#22d3ee','原料集散','采购 2,140 万'],
 ['84%','66%','#34d399','物流仓储','发货 38 万单'],
 ['50%','46%','#a78bfa','指挥中心','GMV 3.87 亿'],
 ['40%','86%','#a78bfa','智造工厂','产能直销 1.2 亿'],
 ['60%','86%','#22d3ee','直播基地','直播成交 6,800 万']]);
/* 交易流 */
var shops=['诸暨袜业协会','浪莎针织','丹吉娅','华海集团','情怡袜业','健盛集团','宝娜斯'];
var cats=['运动袜','船袜','连裤袜','商务袜','童袜'];
function trFeed(){var el=document.getElementById('trFeed');var h='';
  for(var i=0;i<6;i++){var s=shops[Math.floor(Math.random()*shops.length)];
    var c=cats[Math.floor(Math.random()*cats.length)];var am=(Math.random()*9+1).toFixed(1);
    h+='<div class="feed-item"><span class="fi-dot"></span><span class="fi-txt">'+s+' 售出 <b>'+c+'</b> '+am+' 万元</span><span class="fi-time">'+(Math.floor(Math.random()*59)+1)+'分前</span></div>';}
  el.innerHTML=h;}
trFeed();setInterval(trFeed,3200);
/* 漏斗 */
var fn=[['曝光',100],['点击',58],['询盘',32],['下单',18],['支付',12]];
document.getElementById('trFunnel').innerHTML=fn.map(function(f){
  return '<div class="ov-tile"><span>'+f[0]+'</span><b>'+f[1]+'%</b></div><div class="mini-bar"><i style="width:'+f[1]+'%"></i></div>';}).join('');
/* 采购榜 */
var rk=[['浪莎针织',96],['丹吉娅',88],['华海集团',81],['健盛集团',74],['宝娜斯',66]];
document.getElementById('trRank').innerHTML=rk.map(function(r,i){
  return '<div class="rk"><span class="rk-no'+(i===0?' top':'')+'">'+(i+1)+'</span><span class="rk-name">'+r[0]+'</span><span class="rk-bar"><i style="width:'+r[1]+'%"></i></span><span class="rk-val">'+r[1]+'</span></div>';}).join('');
/* 趋势 */
var t=echarts.init(document.getElementById('trTrend'));var x=[],v=[];var b=300;
for(var i=0;i<30;i++){b+=Math.sin(i/3)*40+(Math.random()*60-30);v.push(Math.round(b));x.push(i+1);}
t.setOption({grid:{left:8,right:10,top:14,bottom:6},xAxis:{type:'category',data:x,axisLine:{lineStyle:{color:'rgba(255,255,255,.18)'}},axisLabel:{color:'#8a98b0',fontSize:10,interval:5},axisTick:{show:false}},
 yAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}},axisLabel:{color:'#8a98b0',fontSize:10}},
 series:[{type:'line',smooth:true,data:v,symbol:'none',lineStyle:{width:2,color:'#22d3ee'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(34,211,238,.35)'},{offset:1,color:'rgba(34,211,238,0)'}])}}]});
/* 渠道 */
var ch=echarts.init(document.getElementById('trChannel'));
ch.setOption({grid:{left:8,right:16,top:10,bottom:6},xAxis:{type:'value',splitLine:{lineStyle:{color:'rgba(255,255,255,.06)'}},axisLabel:{color:'#8a98b0',fontSize:10}},
 yAxis:{type:'category',data:['直播','跨境','集采','商家入驻','平台自营'],axisLine:{lineStyle:{color:'rgba(255,255,255,.18)'}},axisLabel:{color:'#aeb9cc',fontSize:11}},
 series:[{type:'bar',data:[38,22,16,14,10],barWidth:12,itemStyle:{borderRadius:6,color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#22d3ee'},{offset:1,color:'#a78bfa'}])}}]});
window.addEventListener('resize',function(){t.resize();ch.resize();});
</script>
</body></html>
