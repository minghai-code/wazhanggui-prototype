<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>报修工单 - 物业管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#2563EB;--bg:#F5F8FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cfe0f8;border-radius:1px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.num{font-variant-numeric:tabular-nums}
.card{transition:transform .16s ease}
.card:active{transform:scale(.985)}
.chip{font-size:11px;padding:5px 11px;border-radius:999px;background:#fff;color:#64748B;white-space:nowrap;box-shadow:0 1px 6px rgba(20,40,80,.06)}
.chip.on{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;font-weight:700}
.no-bar::-webkit-scrollbar{display:none}
.sheet{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet-body{position:relative;width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px 28px;max-height:90vh;overflow-y:auto}
.sheet-bar{width:38px;height:4px;border-radius:2px;background:#E2E8F0;margin:0 auto 12px}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);max-width:300px;background:rgba(31,36,48,.94);color:#fff;font-size:12px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;z-index:300;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.ph{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;color:#fff;position:relative;overflow:hidden;height:70px}
.ph.before{background:linear-gradient(135deg,#93C5FD,#3B82F6)}
.ph.after{background:linear-gradient(135deg,#6EE7B7,#10B981)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);padding:2px 5px;font-size:8px}
.geo{border-radius:12px;padding:10px 12px;border:1px solid #E2E8F0;background:#F8FAFC;font-size:11px;color:#475569;line-height:1.5}
.geo.ok{border-color:#A7F3D0;background:#F0FDF4;color:#047857}
.geo.fail{border-color:#FECACA;background:#FEF2F2;color:#B91C1C}
.tag-opt{font-size:11px;color:#64748B;background:#fff;border:1px solid #ECEEF0;border-radius:10px;padding:6px 12px;cursor:pointer}
.tag-opt.on{border-color:#2563EB;color:#2563EB;background:#EFF6FF;font-weight:600}
.inp{width:100%;background:#F8F9FA;border:1px solid #F0F0F0;border-radius:12px;padding:10px 12px;font-size:12px;color:#1F2430;outline:none}
.lbl{font-size:10px;color:#6B7080;font-weight:500;display:block;margin-bottom:5px}
.lbl b{color:#2563EB}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 状态栏 + 头部 -->
<div style="background:linear-gradient(135deg,#3B82F6 0%,#2563EB 48%,#1D4ED8 100%)" class="px-3.5 pt-2 pb-4">
  <div class="flex justify-between items-center text-white text-sm font-semibold" style="height:36px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="flex items-center gap-3 mt-1">
    <a href="wuye-home.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div class="flex-1">
      <span class="text-white font-extrabold text-[17px]">报修工单</span>
      <p class="text-white/80 text-[9px] mt-0.5" id="subTitle">我的单 · 到场需强制定位并拍照</p>
    </div>
    <a href="messages.html" class="text-white text-base"><i class="fas fa-bell"></i></a>
  </div>
</div>

<div class="px-3 pt-3 pb-28">
  <div class="flex gap-1.5 overflow-x-auto no-bar mb-3" id="chips"></div>
  <div class="space-y-2.5" id="list"></div>
</div>

<div id="wuyeTab"></div>
<div class="toast" id="toast"></div>

<!-- 详情 -->
<div class="sheet" id="dtSheet"><div class="sheet-bg" onclick="closeSheet('dtSheet')"></div><div class="sheet-body" id="dtBody"></div></div>
<!-- 到场 -->
<div class="sheet" id="arSheet"><div class="sheet-bg" onclick="closeSheet('arSheet')"></div><div class="sheet-body" id="arBody"></div></div>
<!-- 提交结果 -->
<div class="sheet" id="rsSheet"><div class="sheet-bg" onclick="closeSheet('rsSheet')"></div><div class="sheet-body" id="rsBody"></div></div>
<!-- 派单 / 改派 -->
<div class="sheet" id="asSheet"><div class="sheet-bg" onclick="closeSheet('asSheet')"></div><div class="sheet-body" id="asBody"></div></div>

<script src="wuye-tab.js"></script>
<script src="wuye-data.js"></script>
<script>
wuyeEnsureStaff();

var TABS = ['待受理', '处理中', '待确认', '已关闭'];
var filter = '待受理';
var curNo = '', arGeo = null, arPhoto = 0, rsPhoto = 0, rsMat = false, asPick = '张建国', asGeoTime = '';

function tabOf(o){
  if (o.state === '待受理') return '待受理';
  if (o.state === '已派单' || o.state === '处理中' || o.state === '待采购') return '处理中';
  if (o.state === '待确认') return '待确认';
  return '已关闭';
}
function mine(o){ return !o.worker || o.worker === wuyeMe().name; }

function waitTxt(o){
  if (o.state === '待受理') {
    var t0 = new Date(o.createdAt.replace(/-/g, '/'));
    var mins = Math.max(0, Math.round((Date.now() - t0.getTime()) / 60000));
    var h = Math.floor(mins / 60), m = mins % 60;
    var s = h > 0 ? h + ' 小时 ' + m + ' 分' : m + ' 分钟';
    return { txt: '已等待 ' + s, red: h >= 2 };
  }
  if (o.state === '已派单') return { txt: '待到场', red: false };
  if (o.state === '处理中') return { txt: '已到场 ' + (o.arriveAt || '').slice(11), red: false };
  if (o.state === '待采购') return { txt: '物料到货后继续', red: false };
  return { txt: '', red: false };
}

function paintChips(){
  var db = wuyeDB();
  document.getElementById('chips').innerHTML = TABS.map(function(c){
    var n = db.bx.filter(function(o){ return tabOf(o) === c && (wuyeIsManager() || mine(o)); }).length;
    return '<a onclick="setF(\'' + c + '\')" class="chip' + (c === filter ? ' on' : '') + '">' + c + (n ? ' ' + n : '') + '</a>';
  }).join('');
}

function setF(c){ filter = c; paintChips(); paintList(); }

function paintList(){
  var db = wuyeDB();
  var arr = db.bx.filter(function(o){ return tabOf(o) === filter && (wuyeIsManager() || mine(o)); });
  if (!arr.length) {
    document.getElementById('list').innerHTML = '<div class="text-center py-14"><i class="fas fa-screwdriver-wrench text-xl text-gray-300 block mb-2"></i><p class="text-[11px] text-gray-400">该状态下暂无工单</p></div>';
    return;
  }
  document.getElementById('list').innerHTML = arr.map(function(o){
    var w = waitTxt(o);
    var urg = o.urg === '紧急' ? '<span class="text-[9px] font-bold px-1.5 py-0.5 rounded text-white" style="background:#DC2626">紧急</span>' : '';
    var btn = '';
    if (o.state === '待受理' && wuyeIsManager()) btn = '<button onclick="event.stopPropagation();openAssign(\'' + o.no + '\')" class="mt-2 w-full py-2 rounded-lg text-white text-[11px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#2563EB)"><i class="fas fa-paper-plane text-[10px] mr-1"></i>派单</button>';
    else if (o.state === '待受理' && !wuyeIsManager()) btn = '<p class="text-[10px] text-gray-400 mt-2">等待主管派单</p>';
    else if (o.state === '已派单') btn = '<button onclick="event.stopPropagation();openArrive(\'' + o.no + '\')" class="mt-2 w-full py-2 rounded-lg text-white text-[11px] font-bold" style="background:linear-gradient(135deg,#10B981,#059669)"><i class="fas fa-location-dot text-[10px] mr-1"></i>到场打卡</button>';
    else if (o.state === '处理中') btn = '<button onclick="event.stopPropagation();openResult(\'' + o.no + '\')" class="mt-2 w-full py-2 rounded-lg text-white text-[11px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#2563EB)"><i class="fas fa-camera text-[10px] mr-1"></i>提交处理结果</button>';
    else if (o.state === '待采购') btn = '<p class="text-[10px] mt-2" style="color:#7C3AED"><i class="fas fa-boxes-stacked mr-1"></i>需采购物料，物料到货后继续维修</p>';
    else if (o.state === '待确认') btn = '<p class="text-[10px] mt-2" style="color:#EA580C"><i class="fas fa-hourglass-half mr-1"></i>已提交，等待商户确认（满 3 天自动确认）</p>';
    else if (o.state === '已完成') btn = '<p class="text-[10px] mt-2" style="color:#059669"><i class="fas fa-circle-check mr-1"></i>已完成' + (o.rating ? ' · 商户评价 ' + o.rating + ' 星' : '') + '</p>';
    return '<div class="card bg-white rounded-2xl shadow-soft px-3.5 py-3" onclick="openDetail(\'' + o.no + '\')">'
      + '<div class="flex items-center justify-between mb-1.5">'
      + '<span class="text-[10px] text-gray-400 num">' + o.no + '</span>'
      + '<div class="flex items-center gap-1.5">' + urg + '<span class="st text-[9px] font-bold px-1.5 py-0.5 rounded ' + stc(o.state) + '">' + o.state + '</span></div></div>'
      + '<p class="text-[13px] font-bold text-gray-800">' + o.type + ' · ' + o.desc.slice(0, 16) + (o.desc.length > 16 ? '…' : '') + '</p>'
      + '<div class="flex items-center gap-2 mt-1.5 text-[9px] text-gray-400">'
      + '<span><i class="fas fa-location-dot mr-0.5"></i>' + o.area + ' ' + o.unit + '</span>'
      + '<span>·</span><span>' + o.merchant + '</span>'
      + '<span>·</span><span class="' + (w.red ? 'font-bold' : '') + '" style="' + (w.red ? 'color:#DC2626' : '') + '">' + w.txt + '</span></div>'
      + btn + '</div>';
  }).join('');
}

/* ---------- 详情 ---------- */
function openDetail(no){
  curNo = no;
  var db = wuyeDB();
  var o = db.bx.filter(function(x){ return x.no === no; })[0];
  if (!o) return;
  var logs = o.logs.map(function(l){
    return '<div class="flex gap-2"><div class="w-1.5 h-1.5 rounded-full mt-1.5 flex-shrink-0" style="background:#93C5FD"></div>'
      + '<div class="flex-1"><p class="text-[10px] text-gray-500">' + l[0] + '</p><p class="text-[11px] text-gray-700 mt-0.5 leading-relaxed">' + l[1] + '</p></div></div>';
  }).join('');
  var before = o.photoBefore ? '<div class="ph before"><i class="fas fa-image text-base"></i><span>报修照片</span><span class="cap">商户上传 · 带水印</span></div>' : '';
  var after = o.photoAfter ? '<div class="ph after"><i class="fas fa-image text-base"></i><span>处理后照片</span><span class="cap">' + o.worker + ' · 移动端</span></div>' : '';
  var ops = '';
  if (o.state === '待受理' && wuyeIsManager()) {
    ops = '<button onclick="closeSheet(\'dtSheet\');openAssign(\'' + o.no + '\')" class="flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#2563EB)">派单</button>';
  } else if (o.state === '已派单') {
    ops = '<button onclick="closeSheet(\'dtSheet\');openArrive(\'' + o.no + '\')" class="flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#10B981,#059669)"><i class="fas fa-location-dot mr-1"></i>到场打卡</button>';
  } else if (o.state === '处理中') {
    ops = '<button onclick="closeSheet(\'dtSheet\');openResult(\'' + o.no + '\')" class="flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#2563EB)"><i class="fas fa-camera mr-1"></i>提交处理结果</button>';
  }
  if (wuyeIsManager() && (o.state === '已派单' || o.state === '处理中')) {
    ops += '<button onclick="closeSheet(\'dtSheet\');openAssign(\'' + o.no + '\',1)" class="px-4 py-2.5 rounded-xl text-[12px] font-bold" style="background:#F1F5F9;color:#475569">改派</button>';
  }

  document.getElementById('dtBody').innerHTML =
    '<div class="sheet-bar"></div>'
    + '<div class="flex items-start justify-between"><div>'
    + '<p class="text-[15px] font-extrabold text-gray-900">' + o.type + '报修</p>'
    + '<p class="text-[10px] text-gray-400 mt-1 num">' + o.no + '</p></div>'
    + '<span class="st text-[10px] font-bold px-2 py-1 rounded ' + stc(o.state) + '">' + o.state + '</span></div>'
    + '<div class="mt-3 rounded-xl p-3" style="background:#F8FAFC">'
    + '<div class="flex justify-between text-[11px]"><span class="text-gray-400">位置</span><span class="text-gray-800 font-medium">' + o.area + ' ' + o.unit + '</span></div>'
    + '<div class="flex justify-between text-[11px] mt-1.5"><span class="text-gray-400">报修人</span><span class="text-gray-800">' + o.merchant + '</span></div>'
    + '<div class="flex justify-between text-[11px] mt-1.5"><span class="text-gray-400">紧急程度</span><span class="' + (o.urg === '紧急' ? 'text-red-600 font-bold' : 'text-gray-800') + '">' + o.urg + '</span></div>'
    + '<div class="flex justify-between text-[11px] mt-1.5"><span class="text-gray-400">提交时间</span><span class="text-gray-800 num">' + o.createdAt + '</span></div>'
    + (o.arriveAt ? '<div class="flex justify-between text-[11px] mt-1.5"><span class="text-gray-400">到场时间</span><span class="text-gray-800 num">' + o.arriveAt + '</span></div>' : '')
    + '</div>'
    + '<p class="text-[11px] text-gray-700 leading-relaxed mt-3">' + o.desc + '</p>'
    + '<div class="grid grid-cols-2 gap-2 mt-2.5">' + before + after + '</div>'
    + (o.arriveGeo ? '<div class="geo ok mt-2.5"><i class="fas fa-location-dot mr-1"></i>到场定位：' + o.arriveGeo + '</div>' : '')
    + (o.resultDesc ? '<div class="mt-3 rounded-xl p-3" style="background:#F0FDF4"><p class="text-[10px] font-bold" style="color:#047857">处理说明</p><p class="text-[11px] text-gray-700 mt-1 leading-relaxed">' + o.resultDesc + '</p>' + (o.matNote ? '<p class="text-[10px] mt-1.5" style="color:#7C3AED">物料需求：' + o.matNote + '</p>' : '') + '</div>' : '')
    + '<p class="text-[11px] font-bold text-gray-800 mt-4 mb-2">流转记录</p>'
    + '<div class="space-y-2.5">' + logs + '</div>'
    + (ops ? '<div class="flex gap-2 mt-4">' + ops + '</div>' : '')
    + '<button class="w-full mt-2 py-2.5 rounded-xl text-[12px] font-bold text-gray-500 bg-gray-100" onclick="closeSheet(\'dtSheet\')">关闭</button>';
  openSheet('dtSheet');
}

/* ---------- 到场打卡 ---------- */
function openArrive(no){
  curNo = no; arGeo = null; arPhoto = 0;
  paintArrive(true);
}
function paintArrive(loading){
  var geoHtml = loading
    ? '<div class="geo"><i class="fas fa-spinner fa-spin mr-1"></i>正在获取定位…</div>'
    : (arGeo ? '<div class="geo ok"><i class="fas fa-location-dot mr-1"></i>' + arGeo + '</div>'
      : '<div class="geo fail"><i class="fas fa-triangle-exclamation mr-1"></i>定位失败：请重试；连续失败可标记「定位异常」提交，该单会在 PC 侧打标供主管核查</div>');
  document.getElementById('arBody').innerHTML =
    '<div class="sheet-bar"></div>'
    + '<p class="text-[15px] font-extrabold text-gray-900 text-center">到场打卡</p>'
    + '<p class="text-[10px] text-gray-400 text-center mt-1 num">' + curNo + ' · 强制定位 + 现场拍照</p>'
    + '<div class="mt-3"><p class="lbl">① 定位 <b>*</b></p>' + geoHtml + '</div>'
    + '<div class="flex gap-2 mt-2">'
    + '<button onclick="locate()" class="flex-1 py-2 rounded-xl text-[11px] font-bold" style="background:#EFF6FF;color:#2563EB"><i class="fas fa-crosshairs mr-1"></i>重新定位</button>'
    + '<button onclick="markGeoFail()" class="flex-1 py-2 rounded-xl text-[11px] font-bold" style="background:#FFF7ED;color:#EA580C">标记定位异常</button></div>'
    + '<div class="mt-3"><p class="lbl">② 现场照片 <b>*</b>（水印含时间/位置/单号）</p>'
    + '<div class="grid grid-cols-3 gap-2" id="arPh"></div></div>'
    + '<div class="rounded-xl p-3 mt-3" style="background:#FFFBEB"><p class="text-[10px] leading-relaxed" style="color:#92400E"><i class="fas fa-circle-info mr-1"></i>到场后状态转「处理中」，商户端可看到到场时间与定位；定位与照片缺一不可提交。</p></div>'
    + '<button onclick="doArrive()" class="w-full mt-3 py-3 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#10B981,#059669)">确认到场</button>'
    + '<button class="w-full mt-2 py-2.5 rounded-xl text-[12px] font-bold text-gray-500 bg-gray-100" onclick="closeSheet(\'arSheet\')">取消</button>';
  paintArPh();
  openSheet('arSheet');
}
function paintArPh(){
  var h = '';
  for (var i = 0; i < arPhoto; i++) h += '<div class="ph after" style="height:60px"><i class="fas fa-camera text-sm"></i><span class="cap">' + (i + 1) + ' · 水印已打</span></div>';
  if (arPhoto < 3) h += '<div onclick="addArPh()" class="rounded-xl flex flex-col items-center justify-center" style="height:60px;border:1.5px dashed #93C5FD;background:#F8FBFF;color:#2563EB;font-size:9px"><i class="fas fa-plus text-sm mb-1"></i>拍照</div>';
  document.getElementById('arPh').innerHTML = h;
}
function addArPh(){ arPhoto++; paintArPh(); }
function locate(){
  arGeo = null; paintArrive(true);
  setTimeout(function(){
    arGeo = wuyeGeo(false);
    paintArrive(false);
    toast('定位成功');
  }, 900);
}
function markGeoFail(){
  arGeo = '定位异常（已手动标记，位置：A 栋 3F 附近）';
  paintArrive(false);
  toast('已标记定位异常，提交后 PC 侧会显示「定位缺失」');
}
function doArrive(){
  if (!arGeo) { toast('请先获取定位（或标记定位异常）'); return; }
  if (!arPhoto) { toast('请拍摄现场照片（至少 1 张）'); return; }
  var db = wuyeDB();
  var o = db.bx.filter(function(x){ return x.no === curNo; })[0];
  o.state = '处理中';
  o.arriveAt = nowStr();
  o.arriveGeo = arGeo;
  o.worker = o.worker || wuyeMe().name;
  o.logs.push([o.arriveAt, (o.worker) + ' 到场打卡（移动端 · 拍照 ' + arPhoto + ' 张）']);
  wuyeSave(db); closeSheet('arSheet');
  toast('已到场，状态转为「处理中」');
  paintChips(); paintList();
}

/* ---------- 提交处理结果 ---------- */
function openResult(no){
  curNo = no; rsPhoto = 0; rsMat = false;
  paintResult();
}
function paintResult(){
  document.getElementById('rsBody').innerHTML =
    '<div class="sheet-bar"></div>'
    + '<p class="text-[15px] font-extrabold text-gray-900 text-center">提交处理结果</p>'
    + '<p class="text-[10px] text-gray-400 text-center mt-1 num">' + curNo + '</p>'
    + '<div class="mt-3"><label class="lbl">处理说明 <b>*</b>（≥5 字）</label>'
    + '<textarea id="rsDesc" class="inp" rows="3" placeholder="说明故障原因与处理方式，例：更换空调电容，清洗滤网"></textarea></div>'
    + '<div class="mt-3"><p class="lbl">处理后照片 <b>*</b>（≥1 张）</p><div class="grid grid-cols-3 gap-2" id="rsPh"></div></div>'
    + '<div class="mt-3 rounded-xl p-3" style="background:#F8FAFC">'
    + '<div class="flex items-center justify-between"><span class="text-[11px] font-semibold text-gray-700">是否需消耗物料</span>'
    + '<label class="flex items-center gap-1.5 text-[10px] text-gray-500"><input type="checkbox" id="rsMat" onchange="rsMat=this.checked;document.getElementById(\'matBox\').style.display=this.checked?\'block\':\'none\'"> 需采购</label></div>'
    + '<div id="matBox" style="display:none" class="mt-2"><label class="lbl">物料需求说明 <b>*</b>（只填需求，不填单价/供应商）</label>'
    + '<input id="rsMatNote" class="inp" placeholder="例：600×600 防滑地砖 5 块、水泥 1 包"></div>'
    + '<p class="text-[9px] text-gray-400 mt-2">勾选后单据转「待采购」，由主管在 PC 建交办单、比价、审批；移动端不展示金额与采购进度。</p>'
    + '</div>'
    + '<button onclick="doResult()" class="w-full mt-3 py-3 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#2563EB)">提交结果</button>'
    + '<button class="w-full mt-2 py-2.5 rounded-xl text-[12px] font-bold text-gray-500 bg-gray-100" onclick="closeSheet(\'rsSheet\')">取消</button>';
  paintRsPh();
  openSheet('rsSheet');
}
function paintRsPh(){
  var h = '';
  for (var i = 0; i < rsPhoto; i++) h += '<div class="ph after" style="height:60px"><i class="fas fa-camera text-sm"></i><span class="cap">' + (i + 1) + ' · 水印已打</span></div>';
  if (rsPhoto < 3) h += '<div onclick="addRsPh()" class="rounded-xl flex flex-col items-center justify-center" style="height:60px;border:1.5px dashed #93C5FD;background:#F8FBFF;color:#2563EB;font-size:9px"><i class="fas fa-plus text-sm mb-1"></i>拍照</div>';
  document.getElementById('rsPh').innerHTML = h;
}
function addRsPh(){ rsPhoto++; paintRsPh(); }
function doResult(){
  var d = (document.getElementById('rsDesc').value || '').trim();
  if (d.length < 5) { toast('处理说明至少 5 个字'); return; }
  if (!rsPhoto) { toast('请上传处理后照片（至少 1 张）'); return; }
  var mat = document.getElementById('rsMat').checked;
  var note = mat ? (document.getElementById('rsMatNote').value || '').trim() : '';
  if (mat && note.length < 2) { toast('请填写物料需求说明（不填单价/供应商）'); return; }
  var db = wuyeDB();
  var o = db.bx.filter(function(x){ return x.no === curNo; })[0];
  o.resultDesc = d; o.photoAfter = rsPhoto; o.needMat = mat; o.matNote = note;
  o.state = mat ? '待采购' : '待确认';
  o.logs.push([nowStr(), '提交处理结果（处理后照片 ' + rsPhoto + ' 张' + (mat ? '，需物料 → 待采购' : '，无需物料 → 待商户确认') + '）']);
  wuyeSave(db); closeSheet('rsSheet');
  toast(mat ? '已提交，转「待采购」（由主管在 PC 建交办单）' : '已提交，等待商户确认');
  filter = mat ? '处理中' : '待确认';
  paintChips(); paintList();
}

/* ---------- 派单 / 改派（仅主管） ---------- */
function openAssign(no, isReassign){
  if (!wuyeIsManager()) { toast('仅物业主管可派单 / 改派'); return; }
  curNo = no; asPick = '张建国';
  var db = wuyeDB();
  var o = db.bx.filter(function(x){ return x.no === no; })[0];
  var people = [['张建国', '维修工 · A 栋 1-3F'], ['李卫东', '维修工 · B 栋 1-2F'], ['赵师傅', '维修工 · C 栋（电工）']];
  document.getElementById('asBody').innerHTML =
    '<div class="sheet-bar"></div>'
    + '<p class="text-[15px] font-extrabold text-gray-900 text-center">' + (isReassign ? '改派维修工' : '受理并派单') + '</p>'
    + '<p class="text-[10px] text-gray-400 text-center mt-1 num">' + no + '</p>'
    + '<div class="mt-3"><p class="lbl">派给谁 <b>*</b>（在岗人员，按负责区域推荐）</p>'
    + '<div class="space-y-2" id="asList">' + people.map(function(p, i){
      return '<div onclick="pickAs(this,\'' + p[0] + '\')" class="rounded-xl p-2.5 flex items-center justify-between" style="border:1.5px solid ' + (i === 0 ? '#2563EB' : '#ECEEF0') + ';background:' + (i === 0 ? '#EFF6FF' : '#fff') + '">'
        + '<div><p class="text-[12px] font-semibold text-gray-800">' + p[0] + '</p><p class="text-[9px] text-gray-400 mt-0.5">' + p[1] + '</p></div>'
        + '<span class="text-[9px]" style="color:#10B981">在岗</span></div>';
    }).join('') + '</div></div>'
    + '<div class="mt-3"><label class="lbl">预计到场时间 <b>*</b></label><input id="asEta" class="inp" type="time" value="14:00"></div>'
    + (isReassign ? '<div class="mt-3"><label class="lbl">改派原因 <b>*</b></label><input id="asWhy" class="inp" placeholder="例：原维修工在处理其他紧急单"></div>' : '')
    + '<button onclick="doAssign(' + (isReassign ? 1 : 0) + ')" class="w-full mt-3 py-3 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#2563EB)">' + (isReassign ? '确认改派' : '确认派单') + '</button>'
    + '<button class="w-full mt-2 py-2.5 rounded-xl text-[12px] font-bold text-gray-500 bg-gray-100" onclick="closeSheet(\'asSheet\')">取消</button>';
  openSheet('asSheet');
}
function pickAs(el, name){
  asPick = name;
  var list = document.getElementById('asList').children;
  for (var i = 0; i < list.length; i++) {
    list[i].style.border = '1.5px solid #ECEEF0'; list[i].style.background = '#fff';
  }
  el.style.border = '1.5px solid #2563EB'; el.style.background = '#EFF6FF';
}
function doAssign(isRe){
  var eta = document.getElementById('asEta').value || '当日';
  var why = isRe ? (document.getElementById('asWhy').value || '').trim() : '';
  if (isRe && why.length < 3) { toast('请填写改派原因'); return; }
  var db = wuyeDB();
  var o = db.bx.filter(function(x){ return x.no === curNo; })[0];
  if (isRe) {
    o.logs.push([nowStr(), '改派：' + (o.worker || '原维修工') + ' → ' + asPick + '（原因：' + why + '）']);
  } else {
    o.state = '已派单'; o.acceptAt = nowStr();
    o.logs.push([nowStr(), '受理并派单 → ' + asPick + '，预计 ' + eta + ' 到场']);
  }
  o.worker = asPick;
  wuyeSave(db); closeSheet('asSheet');
  toast(isRe ? '已改派给 ' + asPick : '已派单给 ' + asPick);
  paintChips(); paintList();
}

/* ---------- init ---------- */
(function init(){
  var q = new URLSearchParams(location.search);
  if (q.get('tab') && TABS.indexOf(q.get('tab')) > -1) filter = q.get('tab');
  if (!wuyeIsManager() && filter === '待受理') filter = '待受理';
  document.getElementById('subTitle').textContent = wuyeIsManager()
    ? '主管视角 · 可派单 / 改派 · 全区域单据'
    : '我的单 · 到场需强制定位并拍照';
  paintChips(); paintList();
  renderWuyeTab('wuye');
  var no = q.get('no');
  if (no) setTimeout(function(){ openDetail(no); }, 120);
})();
</script>
</body>
</html>
