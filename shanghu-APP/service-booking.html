<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>服务预约 - 袜掌柜商户版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#2563EB','primary-d':'#1D4ED8','primary-l':'#3B82F6'}}}}
</script>
<style>
:root{--p:#2563EB;--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cfe0f8;border-radius:1px}
.grad-h{background:linear-gradient(135deg,#3B82F6 0%,#2563EB 50%,#1D4ED8 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.card{transition:transform .16s ease}
.card:active{transform:scale(.985)}
.num{font-variant-numeric:tabular-nums}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stype{cursor:pointer;border:1.5px solid transparent}
.stype.on{border-color:#2563EB;background:#EFF6FF}
</style>
</head>
<body>

<!-- iOS状态栏 -->
<div class="flex justify-between items-center px-6 text-white text-sm font-semibold grad-h" style="height:44px;padding-top:8px">
<span>9:41</span>
<div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
</div>

<!-- 页面头部 -->
<div class="grad-h px-3.5 pb-6">
<div class="flex items-center justify-between mb-1">
<a href="property.html" class="w-8 h-8 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
<span class="text-white font-bold text-[17px]">服务预约</span>
<span class="w-8"></span>
</div>
<p class="relative text-white/80 text-[11px]"><i class="fas fa-calendar-check"></i> 保洁 / 维修 / 搬运 · 物业上门服务</p>
</div>

<!-- 预约类型 -->
<div class="px-3 -mt-3 relative z-10">
  <div class="bg-white rounded-2xl shadow-soft p-3.5 fade-up">
    <p class="text-[11px] font-semibold text-gray-700 mb-2">预约类型 <span class="text-red-500">*</span></p>
    <div class="grid grid-cols-3 gap-2">
      <button onclick="pick(this)" class="stype on flex flex-col items-center gap-1 py-3 rounded-xl bg-gray-50">
        <i class="fas fa-broom text-primary"></i><span class="text-[11px] text-gray-700 font-medium">保洁</span>
      </button>
      <button onclick="pick(this)" class="stype flex flex-col items-center gap-1 py-3 rounded-xl bg-gray-50">
        <i class="fas fa-screwdriver-wrench text-amber-500"></i><span class="text-[11px] text-gray-700 font-medium">维修</span>
      </button>
      <button onclick="pick(this)" class="stype flex flex-col items-center gap-1 py-3 rounded-xl bg-gray-50">
        <i class="fas fa-truck-ramp-box text-emerald-500"></i><span class="text-[11px] text-gray-700 font-medium">搬运</span>
      </button>
    </div>

    <p class="text-[11px] font-semibold text-gray-700 mt-3.5 mb-2">预约日期</p>
    <div class="flex gap-2 overflow-x-auto no-bar">
      <button onclick="pickDay(this)" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-[11px] text-white font-bold" style="background:#2563EB">今天 7.20</button>
      <button onclick="pickDay(this)" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-[11px] text-gray-600 bg-gray-50">明天 7.21</button>
      <button onclick="pickDay(this)" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-[11px] text-gray-600 bg-gray-50">周三 7.22</button>
      <button onclick="pickDay(this)" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-[11px] text-gray-600 bg-gray-50">周四 7.23</button>
    </div>

    <p class="text-[11px] font-semibold text-gray-700 mt-3.5 mb-2">服务说明</p>
    <textarea rows="3" placeholder="请描述服务内容，如：商铺内灯具更换 2 处、地面深度保洁等" class="w-full text-[12px] bg-gray-50 rounded-xl px-3 py-2.5 outline-none resize-none"></textarea>

    <button onclick="toast('预约已提交，物业将电话确认上门时间')" class="w-full py-3 mt-3 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#3B82F6,#2563EB)"><i class="fas fa-paper-plane text-[11px]"></i> 提交预约</button>
  </div>
</div>

<!-- 我的预约 -->
<div class="px-3 mt-4 mb-8">
  <div class="flex items-center gap-1.5 mb-2.5"><i class="fas fa-clock-rotate-left text-primary text-sm"></i><span class="text-[16px] font-extrabold" style="color:#1F2430">我的预约</span></div>
  <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
    <a onclick="toast('预约详情（演示）')" class="card flex items-center gap-3 px-3.5 py-3 border-b border-gray-50 fade-up">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)"><i class="fas fa-broom text-sm"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-bold text-gray-800">深度保洁（含玻璃）</p>
        <p class="text-[10px] text-gray-400 mt-0.5">7月20日 14:00-16:00 · 1F-A08</p>
      </div>
      <span class="bg-amber-50 text-amber-500 text-[9px] font-bold px-1.5 py-0.5 rounded flex-shrink-0">待确认</span>
    </a>
    <a onclick="toast('预约详情（演示）')" class="card flex items-center gap-3 px-3.5 py-3 border-b border-gray-50 fade-up" style="animation-delay:.05s">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#34D399,#10B981)"><i class="fas fa-screwdriver-wrench text-sm"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-bold text-gray-800">照明线路维修</p>
        <p class="text-[10px] text-gray-400 mt-0.5">7月12日 已完成 · 师傅已上门</p>
      </div>
      <span class="bg-green-50 text-green-600 text-[9px] font-bold px-1.5 py-0.5 rounded flex-shrink-0">已完成</span>
    </a>
    <a onclick="toast('预约详情（演示）')" class="card flex items-center gap-3 px-3.5 py-3 fade-up" style="animation-delay:.1s">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#60A5FA,#3B82F6)"><i class="fas fa-truck-ramp-box text-sm"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-bold text-gray-800">样品搬运至物流点</p>
        <p class="text-[10px] text-gray-400 mt-0.5">6月28日 已完成</p>
      </div>
      <span class="bg-green-50 text-green-600 text-[9px] font-bold px-1.5 py-0.5 rounded flex-shrink-0">已完成</span>
    </a>
  </div>
</div>

<script>
function pick(btn){document.querySelectorAll('.stype').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');}
function pickDay(btn){document.querySelectorAll('button[onclick^="pickDay"]').forEach(function(b){b.style.background='';b.style.color='';b.classList.remove('text-white','font-bold');b.classList.add('text-gray-600','bg-gray-50')});btn.style.background='#2563EB';btn.classList.add('text-white','font-bold');btn.classList.remove('text-gray-600','bg-gray-50');}
function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,40,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;white-space:nowrap';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500);}
</script>
</body>
</html>
