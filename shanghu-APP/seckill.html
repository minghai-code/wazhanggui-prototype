<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>限时秒杀 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#FFF7F4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.chip{font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:999px;padding:5px 12px;white-space:nowrap;cursor:pointer}
.chip.on{color:#fff;font-weight:700;background:#EF4444;border-color:#EF4444}
.no-bar::-webkit-scrollbar{display:none}
.progress{height:6px;background:#F1F3F6;border-radius:3px;overflow:hidden}
.progress>i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#F87171,#EF4444)}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:900;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#F87171 0%,#EF4444 55%,#DC2626 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-40" style="background:#FCA5A5"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center justify-between mt-1">
    <a href="workbench.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div class="text-center"><p class="text-white font-extrabold text-[18px]">限时秒杀</p><p class="text-white/75 text-[9px]">营销工具</p></div>
    <a onclick="toast('新建秒杀活动（演示）')" class="text-white text-[12px] font-bold"><i class="fas fa-plus mr-0.5"></i>新建</a>
  </div>
</div>

<div class="px-3 -mt-3 relative z-10">
  <div class="bg-white rounded-2xl shadow-soft px-3 py-3 flex items-center justify-around">
    <div class="text-center"><p class="text-[17px] font-extrabold" style="color:#EF4444" id="s1">0</p><p class="text-[9px] text-gray-400 mt-0.5">进行中</p></div>
    <div class="w-px h-8 bg-gray-100"></div>
    <div class="text-center"><p class="text-[17px] font-extrabold" style="color:#D97706" id="s2">0</p><p class="text-[9px] text-gray-400 mt-0.5">即将开始</p></div>
    <div class="w-px h-8 bg-gray-100"></div>
    <div class="text-center"><p class="text-[17px] font-extrabold" style="color:#6B7280" id="s3">0</p><p class="text-[9px] text-gray-400 mt-0.5">已结束</p></div>
  </div>
</div>

<div class="px-3 mt-3 pb-16">
  <div class="flex gap-1.5 mb-2.5 overflow-x-auto no-bar" id="chips"></div>
  <div class="space-y-2.5" id="list"></div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer;function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
var SESSIONS=[
 {time:'10:00 场',state:'进行中',goods:[{name:'精梳棉商务男袜 10双装',price:29.9,origin:49.9,stock:120,total:200,img:'🧦'},{name:'秋冬加厚保暖袜 5双装',price:19.9,origin:39.9,stock:80,total:150,img:'🧦'}]},
 {time:'14:00 场',state:'即将开始',goods:[{name:'运动透气短袜 6双装',price:24.9,origin:45.9,stock:0,total:180,img:'🧦'}]},
 {time:'昨日 20:00 场',state:'已结束',goods:[{name:'纯棉船袜 10双装',price:22.9,origin:39.9,stock:200,total:200,img:'🧦'}]}
];
var filter='全部';
function chipsRender(){var arr=['全部','进行中','即将开始','已结束'];document.getElementById('chips').innerHTML=arr.map(function(c){return '<a onclick="setF(\''+c+'\')" class="chip'+(c===filter?' on':'')+'">'+c+'</a>';}).join('');}
function setF(c){filter=c;chipsRender();render();}
function stCls(s){return s==='进行中'?'bg-red-50 text-red-500':s==='即将开始'?'bg-amber-50 text-amber-600':'bg-gray-100 text-gray-500';}
function render(){
  document.getElementById('s1').textContent=SESSIONS.filter(function(s){return s.state==='进行中'}).length;
  document.getElementById('s2').textContent=SESSIONS.filter(function(s){return s.state==='即将开始'}).length;
  document.getElementById('s3').textContent=SESSIONS.filter(function(s){return s.state==='已结束'}).length;
  var arr=SESSIONS.filter(function(s){return filter==='全部'||s.state===filter;});
  document.getElementById('list').innerHTML=arr.length?arr.map(function(s){
    var items=s.goods.map(function(g){
      var pct=g.total?Math.round((g.total-g.stock)/g.total*100):0;
      return '<div class="flex items-center gap-2.5 py-2 border-t border-gray-50 first:border-t-0">'
        +'<div class="w-10 h-10 rounded-lg bg-gray-100 flex items-center justify-center text-[16px] flex-shrink-0">'+g.img+'</div>'
        +'<div class="flex-1 min-w-0"><p class="text-[11px] font-medium text-gray-800 line-clamp-1">'+g.name+'</p>'
        +'<div class="flex items-center gap-1.5 mt-0.5"><span class="text-[13px] font-extrabold num text-red-500">¥'+g.price+'</span><span class="text-[9px] text-gray-400 line-through num">¥'+g.origin+'</span></div>'
        +'<div class="progress mt-1"><i style="width:'+pct+'%"></i></div></div>'
        +'<div class="text-right flex-shrink-0"><p class="text-[10px] text-gray-500 num">余 '+g.stock+'</p><p class="text-[9px] text-gray-400 num">共 '+g.total+'</p></div>'
        +'</div>';
    }).join('');
    return '<div class="card bg-white rounded-2xl shadow-soft px-3.5 py-3">'
      +'<div class="flex items-center justify-between"><p class="text-[13px] font-bold text-gray-800"><i class="fas fa-stopwatch text-red-400 text-[11px] mr-1"></i>'+s.time+'</p><span class="'+stCls(s.state)+' text-[9px] font-bold px-1.5 py-0.5 rounded">'+s.state+'</span></div>'
      +'<div class="mt-1.5">'+items+'</div>'
      +'<div class="flex gap-2 mt-2.5"><a onclick="toast(\'查看秒杀数据（演示）\')" class="flex-1 py-2 rounded-lg border border-gray-200 text-[11px] text-gray-600 text-center">数据</a>'
      +'<a onclick="toast(\'编辑活动（演示）\')" class="flex-1 py-2 rounded-lg text-white text-[11px] font-bold text-center" style="background:linear-gradient(135deg,#F87171,#EF4444)">'+(s.state==='已结束'?'复制活动':'编辑活动')+'</a></div>'
      +'</div>';
  }).join(''):'<div class="text-center text-[12px] text-gray-400 py-10">暂无秒杀活动</div>';
}
chipsRender();render();
</script>
</body>
</html>
