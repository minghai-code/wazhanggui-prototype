<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>营销 - 袜掌柜商户版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#2563EB','primary-d':'#1D4ED8','primary-l':'#3B82F6'}}}}
</script>
<style>
:root{--p:#2563EB;--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:#F7F8FA;width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.card{transition:transform .16s ease}
.card:active{transform:scale(.98)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- ===== 顶部（外采营销页复刻） ===== -->
<div style="background:#fff">
  <!-- iOS状态栏 -->
  <div class="flex justify-between items-center px-5 text-gray-700 text-sm font-semibold" style="height:36px;padding-top:8px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <!-- 标题：营销（外采原样） -->
  <div class="flex items-center justify-between px-4 mt-1">
    <a href="workbench.html" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500"><i class="fas fa-chevron-left text-sm"></i></a>
    <span class="text-[16px] font-extrabold text-gray-900">营销</span>
    <span class="w-8"></span>
  </div>

  <p class="px-4 mt-4 mb-2 text-[14px] font-extrabold text-gray-900">营销工具</p>
</div>

<!-- ===== 营销工具宫格（外采原样 9 项：转化/推广/客单/拉新/复购） ===== -->
<div class="px-3 pb-8">
  <div class="grid grid-cols-2 gap-2.5">

    <a onclick="toast('优惠券 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)"><i class="fas fa-ticket"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">转化</p><p class="text-[13px] font-bold text-gray-800">优惠券</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">面向会员发放优惠…</p>
    </a>

    <a onclick="toast('限时秒杀 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.03s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#F87171,#EF4444)"><i class="fas fa-stopwatch"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">推广</p><p class="text-[13px] font-bold text-gray-800">限时秒杀</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">限时低价拉爆单品…</p>
    </a>

    <a onclick="toast('满减活动 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.06s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#F472B6,#EC4899)"><i class="fas fa-percent"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">客单</p><p class="text-[13px] font-bold text-gray-800">满减活动</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">满指定金额自动减免</p>
    </a>

    <a onclick="toast('满赠活动 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.09s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#F87171,#DC2626)"><i class="fas fa-gift"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">拉新</p><p class="text-[13px] font-bold text-gray-800">满赠活动</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">满额随单赠送指定…</p>
    </a>

    <a onclick="toast('限时折扣 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.12s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#FB923C,#F97316)"><i class="fas fa-tags"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">复购</p><p class="text-[13px] font-bold text-gray-800">限时折扣</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">时段内商品自动打折</p>
    </a>

    <a onclick="toast('拼团活动 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.15s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#F472B6,#DB2777)"><i class="fas fa-users"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">转化</p><p class="text-[13px] font-bold text-gray-800">拼团活动</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">拼团带动社群裂变</p>
    </a>

    <a onclick="toast('活动赠品 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.18s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#F87171,#EF4444)"><i class="fas fa-gifts"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">推广</p><p class="text-[13px] font-bold text-gray-800">活动赠品</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">给实物赠送活动赠品</p>
    </a>

    <a onclick="toast('电子卡券 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.21s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#FBBF24,#D97706)"><i class="fas fa-money-check-dollar"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">客单</p><p class="text-[13px] font-bold text-gray-800">电子卡券</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">线上线下通用核销…</p>
    </a>

    <a onclick="toast('礼品卡 · 外采营销工具（演示）')" class="card bg-white rounded-2xl p-3.5 shadow-soft fade-up" style="animation-delay:.24s">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#F472B6,#DB2777)"><i class="fas fa-address-card"></i></div>
        <div><p class="text-[9px] font-bold" style="color:#F59E0B">拉新</p><p class="text-[13px] font-bold text-gray-800">礼品卡</p></div>
      </div>
      <p class="text-[10px] text-gray-400 mt-2 line-clamp-1">面值卡片自由购卡…</p>
    </a>

  </div>

  <p class="text-center text-[10px] text-gray-300 mt-5"><i class="fas fa-circle-info"></i> 营销为外采能力整页沿用，入口由原导航 Tab 移入工作台</p>
</div>

<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none">
  <div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div>
</div>

<script>
function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,40,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;white-space:nowrap';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500);}
</script>
</body>
</html>
