<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>商品 - 袜掌柜商户版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#2563EB','primary-d':'#1D4ED8','primary-l':'#3B82F6'}}}}
</script>
<style>
:root{--p:#2563EB;--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:#F7F8FA;width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.num{font-variant-numeric:tabular-nums}
.card{transition:transform .16s ease}
.card:active{transform:scale(.985)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ttab{cursor:pointer}
</style>
</head>
<body>

<!-- ===== 顶部（外采商品页复刻） ===== -->
<div style="background:#fff">
  <!-- iOS状态栏 -->
  <div class="flex justify-between items-center px-5 text-gray-700 text-sm font-semibold" style="height:36px;padding-top:8px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <!-- 标题 + 搜索/返回 -->
  <div class="flex items-center justify-between px-4 mt-1">
    <a href="workbench.html" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500"><i class="fas fa-chevron-left text-sm"></i></a>
    <span class="text-[16px] font-extrabold text-gray-900">商品</span>
    <a href="#" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500"><i class="fas fa-magnifying-glass text-sm"></i></a>
  </div>

  <!-- 状态Tab：出售中/已下架/待审核/回收站（外采原样） -->
  <div class="flex items-center gap-6 px-4 mt-3 text-[14px] border-b border-gray-100" id="statusTabs">
    <a class="ttab font-bold relative pb-2" style="color:#2563EB;border-bottom:2px solid #2563EB">出售中</a>
    <a onclick="switchTab(this,'已下架')" class="ttab text-gray-500 pb-2">已下架</a>
    <a onclick="switchTab(this,'待审核')" class="ttab text-gray-500 pb-2">待审核(0)</a>
    <a onclick="switchTab(this,'回收站')" class="ttab text-gray-500 pb-2">回收站</a>
  </div>

  <!-- 筛选行（外采原样：商品类型 | 筛选 批量） -->
  <div class="flex items-center justify-between px-4 py-2.5 text-[12px] text-gray-600 border-b border-gray-100">
    <a class="flex items-center gap-1">商品类型 <i class="fas fa-chevron-down text-[9px] text-gray-400"></i></a>
    <div class="flex items-center gap-4">
      <a class="flex items-center gap-1">筛选 <i class="fas fa-arrow-down-wide-short text-[10px]"></i></a>
      <a class="flex items-center gap-1">批量 <i class="fas fa-list-check text-[10px]"></i></a>
    </div>
  </div>
</div>

<!-- ===== 商品列表 ===== -->
<div class="px-3 py-3 space-y-2.5" style="padding-bottom:96px">

  <!-- 商品1：出售中 -->
  <div class="card bg-white rounded-xl shadow-soft overflow-hidden fade-up">
    <div class="flex gap-3 p-3">
      <img src="../mai-APP/images/sock_03.jpg" class="w-[76px] h-[76px] rounded-lg object-cover flex-shrink-0">
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-medium text-gray-800 line-clamp-1">精梳棉商务男袜 透气防臭 10双装</p>
        <p class="text-[10px] text-gray-400 mt-1">库存：1200 &nbsp; 排序：100</p>
        <p class="text-[15px] font-bold mt-1.5 num" style="color:#F5222D">¥10.00</p>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 px-3 pb-3">
      <a onclick="toast('更多操作')" class="px-4 py-1.5 rounded-full border border-gray-200 text-[11px] text-gray-600">更多</a>
      <a onclick="toast('已提交下架申请（演示）')" class="px-4 py-1.5 rounded-full border border-gray-200 text-[11px] text-gray-600">下架</a>
      <a href="product-publish.html" class="px-5 py-1.5 rounded-full text-[11px] font-bold text-white" style="background:linear-gradient(135deg,#4F6BFF,#3B5BFF)">编辑</a>
    </div>
  </div>

  <!-- 商品2：出售中 -->
  <div class="card bg-white rounded-xl shadow-soft overflow-hidden fade-up" style="animation-delay:.05s">
    <div class="flex gap-3 p-3">
      <img src="../mai-APP/images/sock_05.jpg" class="w-[76px] h-[76px] rounded-lg object-cover flex-shrink-0">
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-medium text-gray-800 line-clamp-1">女士碎花短袜 纯棉透气 5双装</p>
        <p class="text-[10px] text-gray-400 mt-1">库存：800 &nbsp; 排序：90</p>
        <p class="text-[15px] font-bold mt-1.5 num" style="color:#F5222D">¥8.80</p>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 px-3 pb-3">
      <a onclick="toast('更多操作')" class="px-4 py-1.5 rounded-full border border-gray-200 text-[11px] text-gray-600">更多</a>
      <a onclick="toast('已提交下架申请（演示）')" class="px-4 py-1.5 rounded-full border border-gray-200 text-[11px] text-gray-600">下架</a>
      <a href="product-publish.html" class="px-5 py-1.5 rounded-full text-[11px] font-bold text-white" style="background:linear-gradient(135deg,#4F6BFF,#3B5BFF)">编辑</a>
    </div>
  </div>

  <!-- 商品3：出售中 -->
  <div class="card bg-white rounded-xl shadow-soft overflow-hidden fade-up" style="animation-delay:.1s">
    <div class="flex gap-3 p-3">
      <img src="../mai-APP/images/sock_02.jpg" class="w-[76px] h-[76px] rounded-lg object-cover flex-shrink-0">
      <div class="flex-1 min-w-0">
        <p class="text-[13px] font-medium text-gray-800 line-clamp-1">运动压缩跑步袜 减震防滑</p>
        <p class="text-[10px] text-gray-400 mt-1">库存：300 &nbsp; 排序：80</p>
        <p class="text-[15px] font-bold mt-1.5 num" style="color:#F5222D">¥12.50</p>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 px-3 pb-3">
      <a onclick="toast('更多操作')" class="px-4 py-1.5 rounded-full border border-gray-200 text-[11px] text-gray-600">更多</a>
      <a onclick="toast('已提交下架申请（演示）')" class="px-4 py-1.5 rounded-full border border-gray-200 text-[11px] text-gray-600">下架</a>
      <a href="product-publish.html" class="px-5 py-1.5 rounded-full text-[11px] font-bold text-white" style="background:linear-gradient(135deg,#4F6BFF,#3B5BFF)">编辑</a>
    </div>
  </div>

</div>

<!-- 底部固定：添加商品（外采原样） -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-3 py-2.5" style="z-index:100;width:393px;padding-bottom:18px">
  <a href="product-publish.html" class="block w-full py-3 rounded-full text-white text-[14px] font-bold text-center" style="background:linear-gradient(135deg,#4F6BFF,#3B5BFF)">添加商品</a>
</div>

<script>
function switchTab(el,name){
  document.querySelectorAll('#statusTabs .ttab').forEach(function(a){a.style.color='#6b7280';a.style.fontWeight='400';a.style.borderBottom='2px solid transparent';});
  el.style.color='#2563EB';el.style.fontWeight='700';el.style.borderBottom='2px solid #2563EB';
  if(name&&name!=='出售中'){toast(name+' Tab · 外采页签（演示切换）');}
}
function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(20,20,40,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;white-space:nowrap';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500);}
</script>
</body>
</html>
