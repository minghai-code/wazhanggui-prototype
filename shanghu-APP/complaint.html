<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>投诉建议 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#7C3AED;--bg:#F7F5FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.num{font-variant-numeric:tabular-nums}
.card{transition:transform .16s ease}
.card:active{transform:scale(.98)}
.no-bar::-webkit-scrollbar{display:none}
.chip{font-size:11px;padding:5px 11px;border-radius:999px;background:#fff;color:#64748B;white-space:nowrap;box-shadow:0 1px 6px rgba(20,40,80,.06)}
.chip.on{background:linear-gradient(135deg,#A78BFA,#7C3AED);color:#fff;font-weight:700}
.st{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet-body{position:relative;width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px 28px;max-height:90vh;overflow-y:auto}
.sheet-bar{width:38px;height:4px;border-radius:2px;background:#E2E8F0;margin:0 auto 12px}
.opt{font-size:11px;padding:6px 12px;border-radius:999px;background:#F8FAFC;color:#64748B;border:1px solid transparent}
.opt.on{background:#F5F3FF;color:#6D28D9;border-color:#DDD6FE;font-weight:600}
.star{font-size:22px;color:#E2E8F0;transition:.15s}
.star.on{color:#F59E0B}
.tagp{font-size:11px;padding:5px 10px;border-radius:999px;background:#F1F5F9;color:#64748B;border:1px solid transparent}
.tagp.on{background:#F5F3FF;color:#6D28D9;border-color:#DDD6FE;font-weight:600}
.phadd{width:74px;height:74px;border-radius:10px;border:2px dashed #C4B5FD;background:#F7F5FF;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7C3AED;flex-shrink:0}
.phitem{width:74px;height:74px;border-radius:10px;background:linear-gradient(135deg,#A78BFA,#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;flex-shrink:0}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);max-width:300px;background:rgba(31,36,48,.94);color:#fff;font-size:12px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;z-index:300;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#A78BFA 0%,#7C3AED 50%,#6D28D9 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#C4B5FD"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#A78BFA"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="property.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div class="flex-1"><span class="text-white font-extrabold text-[18px]">投诉建议</span>
    <p class="text-white/85 text-[10px] mt-0.5">受理进度 · 物业回复 · 服务评价</p></div>
    <button onclick="openNew()" class="px-3 py-1.5 rounded-full bg-white/20 backdrop-blur text-white text-[11px] font-semibold"><i class="fas fa-plus text-[9px] mr-1"></i>提交</button>
  </div>
</div>

<div class="px-3 pt-4 pb-16">
  <div class="flex gap-1.5 mb-3 overflow-x-auto no-bar" id="chips"></div>
  <div class="space-y-2.5" id="list"></div>
</div>

<!-- 详情 -->
<div class="sheet" id="dtSheet">
  <div class="sheet-bg" onclick="closeSheet('dtSheet')"></div>
  <div class="sheet-body" id="dtBody"></div>
</div>

<!-- 新建 -->
<div class="sheet" id="nwSheet">
  <div class="sheet-bg" onclick="closeSheet('nwSheet')"></div>
  <div class="sheet-body" id="nwBody"></div>
</div>

<!-- 评价 -->
<div class="sheet" id="rateSheet">
  <div class="sheet-bg" onclick="closeSheet('rateSheet')"></div>
  <div class="sheet-body">
    <div class="sheet-bar"></div>
    <p class="text-[15px] font-extrabold text-gray-900 text-center">投诉处理评价</p>
    <p class="text-[11px] text-gray-400 text-center mt-1" id="rateWho">—</p>
    <div class="flex justify-center gap-2 mt-3" id="stars"></div>
    <p class="text-[10px] text-gray-400 text-center mt-1" id="rateTip">1–5 星，≤3 星会有专员回访</p>
    <p class="text-[11px] font-semibold text-gray-700 mt-4 mb-2">标签（可多选）</p>
    <div class="flex flex-wrap gap-2" id="tagBox"></div>
    <textarea id="rateTxt" class="w-full text-[12px] bg-gray-50 rounded-xl p-3 mt-3 outline-none" rows="2" placeholder="补充说明（选填）"></textarea>
    <a onclick="submitRate()" class="block w-full mt-3 py-3 rounded-xl text-white text-[13px] font-bold text-center" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)">提交评价</a>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
var toastTimer;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},2600);}

var STC={'待受理':'text-amber-600 bg-amber-50','处理中':'text-blue-600 bg-blue-50',
  '已回复':'text-purple-600 bg-purple-50','已关闭':'text-green-600 bg-green-50','已升级':'text-red-600 bg-red-50'};
var TABS=['全部','待受理','处理中','已回复','已关闭'];
var OBJS=['商户','物业人员','公共区域','平台'];
var CATS=['维修质量','秩序问题','服务态度','收费争议','环境卫生','其他'];
var RATE_TAGS=['处理及时','态度好','解决到位','解释清楚','有点慢','没解决'];

var SEED=[
  {no:'TS202610-0062', obj:'物业人员', cat:'维修质量',
   desc:'报修 3 天了没人来处理，打物业电话也没人接',
   photos:0, state:'待受理', createdAt:'2026-10-27 08:30',
   reply:'', replyAt:'', handler:'', star:0, tags:[], cmt:'',
   logs:[['2026-10-27 08:30','提交投诉（商户端）']]},
  {no:'TS202610-0060', obj:'公共区域', cat:'环境卫生',
   desc:'B 栋 2F 卫生间长期异味，无人清理',
   photos:1, state:'处理中', createdAt:'2026-10-26 14:20',
   reply:'', replyAt:'', handler:'物业 张××', star:0, tags:[], cmt:'',
   logs:[['2026-10-26 14:20','提交投诉'],['2026-10-26 15:00','物业已受理，指派 物业 张×× 处理']]},
  {no:'TS202610-0059', obj:'商户', cat:'秩序问题',
   desc:'隔壁 1F-B07 长期把货物摆到通道，影响通行',
   photos:2, state:'已回复', createdAt:'2026-10-24 09:10',
   reply:'已现场核查，已向该商户下发整改单，限 3 日内清理通道并承诺不超线摆放。',
   replyAt:'2026-10-24 17:00', handler:'物业 张××', star:0, tags:[], cmt:'',
   logs:[['2026-10-24 09:10','提交投诉'],['2026-10-24 10:00','物业已受理'],
     ['2026-10-24 16:30','已转整改单 ZG202610-0028'],['2026-10-24 17:00','物业已回复']]},
  {no:'TS202610-0057', obj:'物业人员', cat:'收费争议',
   desc:'认为本月物业费多算了公摊电费，要求核对明细',
   photos:0, state:'已关闭', createdAt:'2026-10-20 09:00',
   reply:'已提供本月公摊电费分摊明细（按面积比），核算无误，商户确认。',
   replyAt:'2026-10-21 10:00', handler:'财务 吴××', star:5, tags:['处理及时','解释清楚'], cmt:'明细发了，确实没算错',
   logs:[['2026-10-20 09:00','提交投诉'],['2026-10-20 09:40','物业已受理'],
     ['2026-10-21 10:00','物业已回复（附分摊明细）'],['2026-10-21 15:20','你已评价 5 星 → 投诉关闭']]}
];
function getTS(){
  try{var s=localStorage.getItem('sh_ts');if(s)return JSON.parse(s);}catch(e){}
  localStorage.setItem('sh_ts',JSON.stringify(SEED));
  return SEED.slice();
}
function saveTS(l){localStorage.setItem('sh_ts',JSON.stringify(l));}

var filter='全部', curIdx=-1, score=0, picked=[];
var nwObj='物业人员', nwCat='维修质量', nwPhotos=0;

function chipsRender(){
  document.getElementById('chips').innerHTML=TABS.map(function(c){
    return '<a onclick="setF(\''+c+'\')" class="chip'+(c===filter?' on':'')+'">'+c+'</a>';
  }).join('');
}
function setF(c){filter=c;chipsRender();render();}
function closeSheet(id){document.getElementById(id).classList.remove('on');}

function render(){
  var all=getTS();
  var arr=all.filter(function(o){return filter==='全部'||o.state===filter;});
  if(!arr.length){
    document.getElementById('list').innerHTML='<div class="text-center text-[12px] text-gray-400 py-12">'
      +'<i class="fas fa-comment-dots text-xl text-gray-300 block mb-2"></i>暂无投诉记录<br><span class="text-[11px] mt-1 inline-block">点右上「提交」反馈问题</span></div>';
    return;
  }
  document.getElementById('list').innerHTML=arr.map(function(o){
    var idx=all.indexOf(o);
    var hint='';
    if(o.state==='待受理')hint='<span style="color:#B45309">已提交，物业将在 24 小时内受理</span>';
    else if(o.state==='处理中')hint='<span style="color:#2563EB">物业处理中 · '+o.handler+'</span>';
    else if(o.state==='已回复')hint='<span style="color:#7C3AED">物业已回复，请查看并评价</span>';
    else if(o.state==='已关闭')hint='<span style="color:#10B981">已关闭 · 你评价了 '+o.star+' 星</span>';

    var act='';
    if(o.state==='已回复'){
      act='<div class="mt-2.5"><button onclick="event.stopPropagation();openRate('+idx+')" class="w-full py-2 rounded-lg text-[11px] font-bold" style="background:#F5F3FF;color:#6D28D9;border:1px solid #DDD6FE">查看回复并评价</button></div>';
    }
    return '<div class="card bg-white rounded-2xl shadow-soft px-3.5 py-3" onclick="openDetail('+idx+')">'
      +'<div class="flex items-center justify-between mb-1.5">'
      +'<span class="text-[10px] text-gray-400 num">'+o.no+'</span>'
      +'<span class="st '+STC[o.state]+'">'+o.state+'</span></div>'
      +'<p class="text-[12px] font-bold text-gray-800">'+o.cat+' · 被投诉：'+o.obj+'</p>'
      +'<p class="text-[11px] text-gray-500 mt-1 leading-relaxed" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+o.desc+'</p>'
      +'<p class="text-[10px] mt-1.5">'+hint+'</p>'+act+'</div>';
  }).join('');
}

/* ================= 详情 ================= */
function openDetail(idx){
  var o=getTS()[idx];
  var h='<div class="sheet-bar"></div>'
    +'<div class="flex items-center justify-between mb-3">'
    +'<div><p class="text-[15px] font-extrabold text-gray-900">'+o.cat+'</p>'
    +'<p class="text-[10px] text-gray-400 num mt-0.5">'+o.no+'　'+o.createdAt+'</p></div>'
    +'<span class="st '+STC[o.state]+'">'+o.state+'</span></div>';

  h+='<div class="rounded-xl p-3 mb-3" style="background:#F8FAFC">'
    +'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">被投诉对象</span><span>'+o.obj+'</span></div>'
    +'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">分类</span><span>'+o.cat+'</span></div>'
    +'<p class="text-[11px] text-gray-500 leading-relaxed mt-1"><b>内容：</b>'+o.desc+'</p></div>';

  if(o.reply){
    h+='<p class="text-[11px] font-semibold text-gray-700 mb-2">物业回复</p>'
      +'<div class="rounded-xl p-3 mb-3" style="background:#F5F3FF;border:1px solid #DDD6FE">'
      +'<p class="text-[11px] text-purple-900 leading-relaxed">'+o.reply+'</p>'
      +'<p class="text-[9px] text-purple-400 mt-1.5">'+o.replyAt+' · '+o.handler+'</p></div>';
  }
  if(o.star){
    var ss='';for(var i=1;i<=5;i++)ss+='<i class="fas fa-star" style="font-size:13px;color:'+(i<=o.star?'#F59E0B':'#E2E8F0')+'"></i>';
    h+='<p class="text-[11px] font-semibold text-gray-700 mb-2">我的评价</p>'
      +'<div class="rounded-xl p-3 mb-3" style="background:#FFFBEB;border:1px solid #FDE68A">'
      +'<p class="text-[13px]">'+ss+'</p>'
      +(o.tags&&o.tags.length?'<p class="text-[10px] text-amber-700 mt-1">'+o.tags.join('、')+'</p>':'')
      +(o.cmt?'<p class="text-[11px] text-gray-600 mt-1">'+o.cmt+'</p>':'')+'</div>';
  }

  h+='<p class="text-[11px] font-semibold text-gray-700 mb-2">处理进度</p><div style="padding-left:14px">'
    +o.logs.map(function(l){
      return '<div style="position:relative;padding-bottom:9px;font-size:11px;color:#64748B;line-height:1.55">'
        +'<span style="position:absolute;left:-14px;top:5px;width:6px;height:6px;border-radius:50%;background:#7C3AED"></span>'
        +'<b style="color:#1F2430">'+l[0]+'</b>　'+l[1]+'</div>';
    }).join('')+'</div>';

  if(o.state==='已回复'&&!o.star){
    h+='<button onclick="closeSheet(\'dtSheet\');openRate('+idx+')" class="w-full mt-3 py-3 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)">评价本次处理</button>';
  }else{
    h+='<button onclick="closeSheet(\'dtSheet\')" class="w-full mt-3 py-3 rounded-xl text-[12px] font-semibold text-gray-500" style="background:#F1F5F9">关闭</button>';
  }
  document.getElementById('dtBody').innerHTML=h;
  document.getElementById('dtSheet').classList.add('on');
}

/* ================= 新建 ================= */
function openNew(){
  nwObj='物业人员';nwCat='维修质量';nwPhotos=0;
  var h='<div class="sheet-bar"></div>'
    +'<p class="text-[15px] font-extrabold text-gray-900 text-center">提交投诉建议</p>'
    +'<p class="text-[10px] text-gray-400 text-center mt-1">来源：商户端 App</p>'
    +'<p class="text-[11px] font-semibold text-gray-700 mt-4 mb-2">被投诉对象 <span class="text-red-500">*</span></p>'
    +'<div class="flex flex-wrap gap-2" id="objBox"></div>'
    +'<p class="text-[11px] font-semibold text-gray-700 mt-3 mb-2">问题分类 <span class="text-red-500">*</span></p>'
    +'<div class="flex flex-wrap gap-2" id="catBox"></div>'
    +'<p class="text-[11px] font-semibold text-gray-700 mt-3 mb-2">投诉内容 <span class="text-red-500">*</span> <span class="text-gray-400 font-normal text-[10px]">至少 5 个字</span></p>'
    +'<textarea id="nwDesc" rows="3" placeholder="请如实描述发生了什么、什么时候、影响是什么" class="w-full text-[12px] bg-gray-50 rounded-xl p-3 outline-none"></textarea>'
    +'<p class="text-[11px] font-semibold text-gray-700 mt-3 mb-2">照片 <span class="text-gray-400 font-normal text-[10px]">选填</span></p>'
    +'<div class="flex gap-2 flex-wrap" id="nwPh"></div>'
    +'<button onclick="submitNew()" class="w-full mt-4 py-3 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)">提交</button>';
  document.getElementById('nwBody').innerHTML=h;
  renderNwOpts();
  document.getElementById('nwSheet').classList.add('on');
}
function renderNwOpts(){
  document.getElementById('objBox').innerHTML=OBJS.map(function(o){
    return '<span class="opt '+(o===nwObj?'on':'')+'" onclick="pickObj(\''+o+'\')">'+o+'</span>';
  }).join('');
  document.getElementById('catBox').innerHTML=CATS.map(function(c){
    return '<span class="opt '+(c===nwCat?'on':'')+'" onclick="pickCat(\''+c+'\')">'+c+'</span>';
  }).join('');
  var ph='';
  for(var i=0;i<nwPhotos;i++){
    ph+='<div class="phitem"><i class="fas fa-image"></i>'
      +'<span style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#EF4444;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center" onclick="delNwPh()"><i class="fas fa-xmark"></i></span></div>';
  }
  if(nwPhotos<3)ph+='<div class="phadd" onclick="addNwPh()"><i class="fas fa-camera text-base"></i><span class="text-[9px] mt-1">拍照</span></div>';
  document.getElementById('nwPh').innerHTML=ph;
}
function pickObj(o){nwObj=o;renderNwOpts();}
function pickCat(c){nwCat=c;renderNwOpts();}
function addNwPh(){nwPhotos++;renderNwOpts();toast('已拍摄照片 '+nwPhotos+' 张');}
function delNwPh(){nwPhotos=Math.max(0,nwPhotos-1);renderNwOpts();}
function submitNew(){
  var desc=document.getElementById('nwDesc').value.trim();
  if(desc.length<5){toast('投诉内容至少 5 个字（当前 '+desc.length+' 字）');return;}
  var list=getTS();
  var no='TS202610-00'+(63+list.length);
  list.unshift({no:no, obj:nwObj, cat:nwCat, desc:desc, photos:nwPhotos, state:'待受理',
    createdAt:'2026-10-28 10:35', reply:'', replyAt:'', handler:'', star:0, tags:[], cmt:'',
    logs:[['2026-10-28 10:35','提交投诉（商户端）']]});
  saveTS(list);
  closeSheet('nwSheet');render();
  toast('已提交 '+no+'　物业将在 24 小时内受理，超时会升级运营主管');
}

/* ================= 评价 ================= */
function openRate(idx){
  curIdx=idx;score=0;picked=[];
  var o=getTS()[idx];
  document.getElementById('rateWho').textContent=o.cat+' · '+o.no;
  document.getElementById('stars').innerHTML=[1,2,3,4,5].map(function(n){
    return '<i class="fas fa-star star" onclick="setStar('+n+')"></i>';
  }).join('');
  document.getElementById('tagBox').innerHTML=RATE_TAGS.map(function(t){
    return '<span class="tagp" onclick="pickTag(this,\''+t+'\')">'+t+'</span>';
  }).join('');
  document.getElementById('rateTxt').value='';
  document.getElementById('rateSheet').classList.add('on');
}
function setStar(n){
  score=n;
  document.querySelectorAll('#stars .star').forEach(function(s,i){s.classList.toggle('on',i<n);});
  document.getElementById('rateTip').textContent=(n<=3)?'已选 '+n+' 星 · 会有专员回访跟进':'已选 '+n+' 星 · 感谢认可';
}
function pickTag(el,t){
  var i=picked.indexOf(t);
  if(i>-1){picked.splice(i,1);el.classList.remove('on');}
  else{picked.push(t);el.classList.add('on');}
}
function submitRate(){
  if(!score){toast('请先打分');return;}
  var list=getTS();var o=list[curIdx];
  o.star=score;o.tags=picked.slice();o.cmt=document.getElementById('rateTxt').value.trim();
  o.state='已关闭';
  o.logs.push(['2026-10-28 10:40','你已评价 '+score+' 星'+(picked.length?'（'+picked.join('、')+'）':'')+' → 投诉关闭']);
  saveTS(list);
  closeSheet('rateSheet');render();
  toast('评价已提交，投诉已关闭'+(score<=3?'；我们会有专员回访':''));
}

chipsRender();render();
</script>
</body>
</html>
