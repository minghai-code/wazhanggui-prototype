<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>工作台 - 袜掌柜商户版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#2563EB','primary-d':'#1D4ED8','primary-l':'#3B82F6'}}}}
</script>
<style>
:root{--p:#2563EB;--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cfe0f8;border-radius:1px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.num{font-variant-numeric:tabular-nums}
.card{transition:transform .16s ease}
.card:active{transform:scale(.97)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- ===== 顶部（外采工作台复刻：管理后台） ===== -->
<div class="relative px-4 pt-3 pb-4" style="background:linear-gradient(160deg,#EEF2FF 0%,#F5F7FF 60%,#F0F6FF 100%)">
  <!-- iOS状态栏 -->
  <div class="flex justify-between items-center text-gray-700 text-sm font-semibold" style="height:36px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <!-- 标题行：管理后台 + 搜索 + 添加 -->
  <div class="flex items-center justify-between mt-2">
    <div class="flex items-center gap-2">
      <div class="w-9 h-9 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#F59E0B,#D97706)"><i class="fas fa-briefcase text-sm"></i></div>
      <span class="text-[17px] font-extrabold text-gray-900">管理后台</span>
    </div>
    <div class="flex gap-2">
      <a href="#" class="w-8 h-8 rounded-full bg-white shadow-soft flex items-center justify-center text-gray-500"><i class="fas fa-magnifying-glass text-sm"></i></a>
      <a href="#" class="w-8 h-8 rounded-full bg-white shadow-soft flex items-center justify-center text-gray-500"><i class="fas fa-plus text-sm"></i></a>
    </div>
  </div>

  <!-- 经营指标（支付金额/买家数/订单数 + 昨日对比） -->
  <div class="grid grid-cols-3 mt-4 px-1">
    <div class="text-center">
      <p class="text-[11px] text-gray-500">支付金额</p>
      <p class="num text-[20px] font-extrabold text-gray-900 mt-1">¥8,600</p>
      <p class="text-[9px] text-gray-400 mt-0.5">昨日 ¥7,200</p>
    </div>
    <div class="text-center border-x border-gray-200/70">
      <p class="text-[11px] text-gray-500">支付买家数</p>
      <p class="num text-[20px] font-extrabold text-gray-900 mt-1">15</p>
      <p class="text-[9px] text-gray-400 mt-0.5">昨日 14</p>
    </div>
    <div class="text-center">
      <p class="text-[11px] text-gray-500">支付订单数</p>
      <p class="num text-[20px] font-extrabold text-gray-900 mt-1">28</p>
      <p class="text-[9px] text-gray-400 mt-0.5">昨日 25</p>
    </div>
  </div>
  <div class="flex justify-center mt-1 mb-0.5">
    <i class="fas fa-chevron-down text-gray-300 text-[10px]"></i>
  </div>
</div>

<!-- 待办蓝条（外采原样：待付款/待发货/待售后/待回复） -->
<div class="px-3 mt-1">
  <div class="card flex items-stretch rounded-2xl overflow-hidden shadow-soft fade-up" style="background:linear-gradient(135deg,#4F6BFF,#3B5BFF)">
    <a href="orders.html" class="flex-1 py-3 text-center text-white border-r border-white/20"><p class="num text-[17px] font-extrabold">2</p><p class="text-[10px] text-white/85 mt-0.5">待付款</p></a>
    <a href="orders.html" class="flex-1 py-3 text-center text-white border-r border-white/20"><p class="num text-[17px] font-extrabold">12</p><p class="text-[10px] text-white/85 mt-0.5">待发货</p></a>
    <a href="orders.html" class="flex-1 py-3 text-center text-white border-r border-white/20"><p class="num text-[17px] font-extrabold">2</p><p class="text-[10px] text-white/85 mt-0.5">待售后</p></a>
    <a href="messages.html" class="flex-1 py-3 text-center text-white relative"><p class="num text-[17px] font-extrabold">3</p><p class="text-[10px] text-white/85 mt-0.5">待回复</p></a>
  </div>
</div>

<!-- 消息条（外采原样） -->
<div class="px-3 mt-2.5">
  <a href="messages.html" class="card flex items-center gap-2.5 bg-white rounded-xl shadow-soft px-3.5 py-2.5 fade-up">
    <i class="fas fa-bell text-primary text-sm"></i>
    <span class="text-[12px] font-bold text-gray-800">消息</span>
    <span class="text-[11px] text-gray-400 flex-1 line-clamp-1">暂无新消息</span>
    <i class="fas fa-chevron-right text-gray-300 text-[10px]"></i>
  </a>
</div>

<!-- 基础功能宫格（外采原样：7 入口；移除「营销」，与底部导航架构对齐） -->
<div class="px-3 mt-3">
  <div class="flex items-center justify-between mb-2.5 px-1">
    <p class="text-[14px] font-extrabold text-gray-900">基础功能</p>
    <a href="mine.html" class="w-7 h-7 rounded-full overflow-hidden border border-gray-100 bg-gradient-to-br from-pink-200 to-purple-200 flex items-center justify-center"><i class="fas fa-user text-white text-[10px]"></i></a>
  </div>
  <div class="bg-white rounded-2xl shadow-soft px-2 py-4 grid grid-cols-4 gap-y-4 fade-up">
    <a href="product-publish.html" class="card flex flex-col items-center gap-1.5">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#F59E0B,#D97706)"><i class="fas fa-paper-plane"></i></div>
      <span class="text-[10px] text-gray-700">发布商品</span>
    </a>
    <a href="products.html" class="card flex flex-col items-center gap-1.5">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#3B82F6,#2563EB)"><i class="fas fa-bag-shopping"></i></div>
      <span class="text-[10px] text-gray-700">商品管理</span>
    </a>
    <a href="orders.html" class="card flex flex-col items-center gap-1.5">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#10B981,#047857)"><i class="fas fa-file-lines"></i></div>
      <span class="text-[10px] text-gray-700">订单管理</span>
    </a>
    <a onclick="toast('数据中心 · 外采能力，本端不改造')" class="card flex flex-col items-center gap-1.5">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#6366F1,#4F46E5)"><i class="fas fa-chart-simple"></i></div>
      <span class="text-[10px] text-gray-700">数据中心</span>
    </a>
    <a href="activity.html" class="card flex flex-col items-center gap-1.5">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)"><i class="fas fa-ticket"></i></div>
      <span class="text-[10px] text-gray-700">优惠券</span>
    </a>
    <a href="activity.html" class="card flex flex-col items-center gap-1.5">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white" style="background:linear-gradient(135deg,#F87171,#EF4444)"><i class="fas fa-stopwatch"></i></div>
      <span class="text-[10px] text-gray-700">限时秒杀</span>
    </a>
    <a href="activity.html" class="card flex flex-col items-center gap-1.5">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-gray-300" style="background:#F3F4F6"><i class="fas fa-grip"></i></div>
      <span class="text-[10px] text-gray-700">全部</span>
    </a>
  </div>
</div>

<div class="h-24"></div>

<!-- 底部Tab栏（5Tab，工作台高亮） -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:100;width:393px">
  <div class="flex justify-around items-center h-full" style="padding-bottom:10px">
    <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-house text-[18px]"></i><span class="text-[9px]">首页</span></a>
    <a href="orders.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">订单</span><span class="absolute top-0 right-2 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">12</span></a>
    <a href="workbench.html" class="flex flex-col items-center gap-0.5" style="color:#2563EB"><i class="fas fa-briefcase text-[18px]"></i><span class="text-[9px] font-semibold">工作台</span></a>
    <a href="property.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-building text-[18px]"></i><span class="text-[9px]">物业服务</span></a>
    <a href="mine.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-user text-[18px]"></i><span class="text-[9px]">我的</span></a>
  </div>
</div>
<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none">
  <div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div>
</div>

<script>
function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,40,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;white-space:nowrap';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500);}
</script>
</body>
</html>
