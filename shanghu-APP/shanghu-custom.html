<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>定制需求池 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#2563EB;--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cfe0f8;border-radius:1px}
.grad-h{background:linear-gradient(135deg,#3B82F6 0%,#2563EB 50%,#1D4ED8 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.card{transition:transform .16s ease}
.card:active{transform:scale(.985)}
.num{font-variant-numeric:tabular-nums}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ctab,.mtab{cursor:pointer}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- iOS状态栏 -->
<div class="flex justify-between items-center px-6 text-white text-sm font-semibold grad-h" style="height:44px;padding-top:8px">
<span>9:41</span>
<div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
</div>

<!-- 页面头部 -->
<div class="grad-h px-3.5 pb-6">
<div class="flex items-center justify-between mb-1">
<a href="home.html" class="w-8 h-8 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
<span class="text-white font-bold text-[17px]">定制需求池</span>
<span class="w-8"></span>
</div>
<p class="relative text-white/80 text-[11px]"><i class="fas fa-shirt"></i> 买家发布的定制需求 · 三种类型 · 指定我的置顶</p>
</div>

<!-- 一级 Tab：需求池 / 我的报价 -->
<div class="px-3 -mt-3 relative z-10">
  <div class="bg-white/85 backdrop-blur-xl rounded-2xl shadow-soft px-3 py-2.5 flex items-center gap-5 border border-white">
    <a onclick="switchTop('pool',this)" id="tab-pool" class="mtab text-[13px] font-bold text-gray-800 pb-1">需求池</a>
    <a onclick="switchTop('mine',this)" id="tab-mine" class="mtab text-[13px] text-gray-400 pb-1">我的报价 <span class="text-[10px] ml-0.5" id="quoteCount">0</span></a>
  </div>
</div>

<!-- ===== 需求池 ===== -->
<div id="poolBox">
  <!-- 二级 Tab：个性定制 / 企业定制 -->
  <div class="px-3 mt-3">
    <div class="flex items-center gap-4 border-b border-blue-100" id="mainTabs">
      <a onclick="switchMain('personal',this)" id="tab-personal" class="ctab text-[13px] font-bold text-gray-800 relative pb-2">个性定制<span class="text-[10px] text-gray-400 ml-0.5">6</span><span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-5 h-0.5 rounded-full" style="background:linear-gradient(90deg,#2563EB,#06B6D4)"></span></a>
      <a onclick="switchMain('enterprise',this)" id="tab-enterprise" class="ctab text-[13px] text-gray-400 pb-2">企业定制<span class="text-[10px] ml-0.5">5</span></a>
    </div>
  </div>
  <div class="px-3 mt-2.5 space-y-2.5 pb-8" id="list-personal"></div>
  <div class="px-3 mt-2.5 space-y-2.5 pb-8" id="list-enterprise" style="display:none"></div>
</div>

<!-- ===== 我的报价 ===== -->
<div id="mineBox" style="display:none">
  <div class="px-3 mt-3 flex items-center gap-1.5" id="quoteChips"></div>
  <div class="px-3 mt-2.5 space-y-2.5 pb-8" id="quoteList"></div>
  <div class="px-3 pb-8">
    <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-3">
      <p class="text-[10px] text-blue-700 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>截止前可改价，最多 2 次；未中标时不会显示其他卖家报价。</p>
    </div>
  </div>
</div>

<script>
function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,40,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;white-space:nowrap';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500);}
function readLS(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function writeLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* 后台下发的定制需求（个性 / 企业） */
var DEMANDS=[
 {id:'CP20261024001',kind:'personal',type:'先样品后大货',title:'校服配套定制袜（含校徽）',buyer:'周**',qty:1000,unit:'双',maxPrice:'5.0',quotes:3,left:'剩 2 天',urgent:false},
 {id:'CP20261024002',kind:'personal',type:'仅样品定制',title:'情侣款刺绣短袜 姓名定制',buyer:'吴**',qty:200,unit:'双',maxPrice:'8.0',quotes:1,left:'剩 3 天',urgent:false},
 {id:'CP20261024003',kind:'personal',type:'直接大货',title:'宠物主题潮袜 柯基图案',buyer:'郑**',qty:500,unit:'双',maxPrice:'4.2',quotes:4,left:'剩 1 天',urgent:true},
 {id:'CP20261024004',kind:'personal',type:'仅样品定制',title:'汉服配套提花袜',buyer:'冯**',qty:300,unit:'双',maxPrice:'7.5',quotes:2,left:'剩 4 天',urgent:false},
 {id:'CP20261024005',kind:'personal',type:'先样品后大货',title:'健身房定制毛巾底袜',buyer:'何**',qty:800,unit:'双',maxPrice:'6.0',quotes:2,left:'剩 8 小时',urgent:true},
 {id:'CP20261024006',kind:'personal',type:'直接大货',title:'动漫IP联名长筒袜',buyer:'许**',qty:1200,unit:'双',maxPrice:'5.8',quotes:0,left:'剩 5 天',urgent:false},
 {id:'CE20261024001',kind:'enterprise',type:'直接大货',title:'某科技企业年会礼盒袜 LOGO刺绣',buyer:'企业采购',qty:3000,unit:'双',maxPrice:'9.8',quotes:3,left:'剩 1 天',urgent:true},
 {id:'CE20261024002',kind:'enterprise',type:'先样品后大货',title:'银行开户伴手礼袜（含包装）',buyer:'企业采购',qty:5000,unit:'双',maxPrice:'6.8',quotes:2,left:'剩 4 天',urgent:false},
 {id:'CE20261024003',kind:'enterprise',type:'直接大货',title:'车企4S店交车伴手礼袜',buyer:'企业采购',qty:2000,unit:'双',maxPrice:'5.5',quotes:5,left:'剩 2 天',urgent:false},
 {id:'CE20261024004',kind:'enterprise',type:'直接大货',title:'连锁酒店客房一次性拖鞋袜',buyer:'企业采购',qty:10000,unit:'双',maxPrice:'2.8',quotes:1,left:'剩 6 天',urgent:false},
 {id:'CE20261024005',kind:'enterprise',type:'先样品后大货',title:'地产交付礼盒定制袜（精装）',buyer:'企业采购',qty:6000,unit:'双',maxPrice:'10.5',quotes:4,left:'剩 3 天',urgent:false}
];

/* 我的报价（种子 + 端上提交） */
var SEED_Q=[
 {demandId:'CP20261024001',title:'校服配套定制袜（含校徽）',type:'先样品后大货',detail:'样品 ¥28/件 · 大货 ¥4.6/双',status:'待确认',time:'2026-10-20 10:12',changes:0},
 {demandId:'CE20261024002',title:'银行开户伴手礼袜（含包装）',type:'先样品后大货',detail:'样品 ¥30/件 · 大货 ¥6.2/双',status:'已选中',time:'2026-10-19 15:40',changes:1},
 {demandId:'CP20261024003',title:'宠物主题潮袜 柯基图案',type:'直接大货',detail:'¥4.0/双 × 500双',status:'未选中',time:'2026-10-18 09:20',changes:0}
];
(function seed(){
  if(localStorage.getItem('sh_custom_seeded'))return;
  var list=readLS('sh_custom_quotes');
  SEED_Q.forEach(function(q){
    if(!list.some(function(x){return x.demandId===q.demandId}))list.push(q);
  });
  writeLS('sh_custom_quotes',list);localStorage.setItem('sh_custom_seeded','1');
})();

function tagCls(t){return t==='仅样品定制'?'bg-purple-100 text-purple-600':t==='先样品后大货'?'bg-indigo-100 text-indigo-600':'bg-pink-100 text-pink-600';}
function quoteState(s){return s==='待确认'?'bg-amber-50 text-amber-600':s==='已选中'?'bg-emerald-50 text-emerald-600':'bg-gray-100 text-gray-500';}
function myQuote(id){return readLS('sh_custom_quotes').filter(function(q){return q.demandId===id;})[0];}

function cardHtml(d){
  var q=myQuote(d.id);
  var btn=q?'<span class="text-[10px] font-bold text-emerald-600">已报价 · 查看</span>'
    :'<span class="text-[10px] font-bold text-white px-2.5 py-1.5 rounded-lg" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)">去报价</span>';
  return '<a href="shanghu-custom-detail.html?id='+d.id+'" class="card block bg-white rounded-2xl shadow-soft p-3.5 fade-up">'
    +'<div class="flex items-center gap-1.5 mb-1"><span class="'+tagCls(d.type)+' text-[8px] font-bold px-1 py-0.5 rounded">'+d.type+'</span><p class="text-[13px] font-bold text-gray-800 flex-1 line-clamp-1">'+d.title+'</p></div>'
    +'<div class="flex items-center gap-2 text-[10px] text-gray-500"><span>'+d.buyer+'</span><span>·</span><span class="num">'+d.qty+d.unit+'</span><span>·</span><span>最高 ¥'+d.maxPrice+'</span></div>'
    +'<div class="flex items-center justify-between mt-2"><div class="flex items-center gap-3 text-[10px] text-gray-400"><span>已报 <b class="num text-gray-700">'+d.quotes+'</b> 家</span></div>'
    +'<div class="flex items-center gap-2"><span class="text-[9px] '+(d.urgent?'text-red-500 font-bold':'text-gray-400')+'">'+d.left+'</span>'+btn+'</div></div></a>';
}
function renderPool(kind){
  var arr=DEMANDS.filter(function(d){return d.kind===kind;});
  document.getElementById('list-'+kind).innerHTML=arr.map(cardHtml).join('');
}
function switchMain(t,el){
  document.querySelectorAll('#mainTabs .ctab').forEach(function(a){a.style.color='#6b7280';a.style.fontWeight='400';var u=a.querySelector('span.absolute');if(u)u.remove();});
  el.style.color='#1F2430';el.style.fontWeight='700';
  el.insertAdjacentHTML('beforeend','<span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-5 h-0.5 rounded-full" style="background:linear-gradient(90deg,#2563EB,#06B6D4)"></span>');
  document.getElementById('list-personal').style.display=(t==='personal')?'block':'none';
  document.getElementById('list-enterprise').style.display=(t==='enterprise')?'block':'none';
}
function switchTop(t,el){
  document.querySelectorAll('.mtab').forEach(function(a){a.style.color='#6b7280';a.style.fontWeight='400';});
  el.style.color='#1F2430';el.style.fontWeight='700';
  document.getElementById('poolBox').style.display=(t==='pool')?'block':'none';
  document.getElementById('mineBox').style.display=(t==='mine')?'block':'none';
  if(t==='mine')renderQuotes();
}
var qFilter='全部';
function renderQuotes(){
  var all=readLS('sh_custom_quotes');
  document.getElementById('quoteCount').textContent=all.filter(function(q){return q.status==='待确认';}).length;
  var arr=all.filter(function(q){return qFilter==='全部'||q.status===qFilter;});
  document.getElementById('quoteChips').innerHTML=['全部','待确认','已选中','未选中'].map(function(f){return '<span onclick="setQF(\''+f+'\')" class="text-[11px] px-3 py-1 rounded-full cursor-pointer '+(f===qFilter?'text-white font-bold':'bg-white text-gray-500 border border-gray-200')+'" '+(f===qFilter?'style="background:#2563EB"':'')+'>'+f+'</span>';}).join('');
  document.getElementById('quoteList').innerHTML=arr.length?arr.map(function(q){
    return '<div class="bg-white rounded-2xl shadow-soft p-3.5"><div class="flex items-center justify-between gap-2">'
      +'<p class="text-[13px] font-bold text-gray-800 truncate">'+q.title+'</p>'
      +'<span class="'+quoteState(q.status)+' text-[9px] font-bold px-1.5 py-0.5 rounded flex-shrink-0">'+q.status+'</span></div>'
      +'<p class="text-[10px] text-gray-500 mt-1">我的报价：<b class="num text-gray-700">'+q.detail+'</b></p>'
      +'<div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-50"><span class="text-[9px] text-gray-400 num">'+q.time+' · 已改价 '+q.changes+'/2</span>'
      +(q.status==='已选中'?'<a href="orders.html" class="text-[10px] font-bold text-emerald-600">查看订单 ›</a>':q.status==='待确认'?'<a href="shanghu-custom-detail.html?id='+q.demandId+'" class="text-[10px] font-bold text-blue-600">'+(q.changes<2?'修改报价 ›':'已用完改价')+'</a>':'<span class="text-[10px] text-gray-400">未中标</span>')
      +'</div></div>';
  }).join(''):'<div class="text-center text-[12px] text-gray-400 py-12">暂无报价记录</div>';
}
function setQF(f){qFilter=f;renderQuotes();}

renderPool('personal');renderPool('enterprise');
// 支持 home.html ?type=personal/enterprise 直达；?tab=mine 直达我的报价
(function(){
  var sp=new URLSearchParams(location.search);
  var t=sp.get('type');
  if(t==='enterprise')switchMain('enterprise',document.getElementById('tab-enterprise'));
  if(sp.get('tab')==='mine')switchTop('mine',document.getElementById('tab-mine'));
})();
</script>
</body>
</html>
