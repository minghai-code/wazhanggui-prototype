<!DOCTYPE html>
<html lang="zh-CN">
<head>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}

</style>

</head>

    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>

<div class="px-3 pt-3 pb-24" id="bodyBox"></div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>

<script>
var ttm;function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(ttm);ttm=setTimeout(function(){t.classList.remove('on')},1800)}
function readLS(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function writeLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function q(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):''}
function nowStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}

/* 旧版数据只有 detail 文本：解析回结构化字段，供「修改报价」回填 */
function parseQuoteDetail(s){
  s=s||'';var o={},m;
  m=s.match(/样品 ¥([\d.]+)\/件/); if(m)o.samplePrice=m[1];
  m=s.match(/×\s*([\d.]+)\s*件/); if(m)o.sampleQty=m[1];
  m=s.match(/大货预估 ¥([\d.]+)\//); if(m)o.bulkPrice=m[1];
  if(!m){ m=s.match(/^¥([\d.]+)\//); if(m)o.bulkPrice=m[1]; }
  if(!o.samplePrice){ m=s.match(/×\s*([\d.]+)\s*双/); if(m)o.bulkQty=m[1]; }
  m=s.match(/交期\s*(\d+)\s*天/); if(m)o.period=m[1];
  o.freight=/不含运费/.test(s)?'不含运费':'含运费';
  return o;
}
/* 把一条老报价升级为「含报价记录」的新结构，并写回 localStorage */
function migrateQuote(q){
  var p=parseQuoteDetail(q.detail);
  q.samplePrice=q.samplePrice||p.samplePrice||'';
  q.sampleQty=q.sampleQty||p.sampleQty||'';
  q.bulkPrice=q.bulkPrice||p.bulkPrice||'';
  q.bulkQty=q.bulkQty||p.bulkQty||'';
  q.period=q.period||p.period||'';
  q.freight=q.freight||p.freight||'含运费';
  q.note=q.note||'';
  if(!q.history||!q.history.length){
    q.history=[{no:(q.changes||0)+1,time:q.time,detail:q.detail,samplePrice:q.samplePrice,sampleQty:q.sampleQty,bulkPrice:q.bulkPrice,bulkQty:q.bulkQty,period:q.period,freight:q.freight,note:q.note}];
  }
  var list=readLS('sh_custom_quotes');
  list.forEach(function(x,i){if(x.demandId===q.demandId)list[i]=q;});
  writeLS('sh_custom_quotes',list);
  return q;
}

var DEMANDS=[
 {id:'CP20261024001',kind:'personal',type:'先样品后大货',title:'校服配套定制袜（含校徽）',buyer:'周**',qty:1000,unit:'双',maxPrice:'5.0',left:'剩 2 天',period:'30 天',
  req:['花型：校徽刺绣（左袜口）','材质：精梳棉 80% + 氨纶 20%','版型：中筒，罗纹口','包装：独立 OPP 袋，100 双/箱'],
  refs:['校徽矢量','配色参考','样袜实拍']},
 {id:'CP20261024002',kind:'personal',type:'仅样品定制',title:'情侣款刺绣短袜 姓名定制',buyer:'吴**',qty:200,unit:'双',maxPrice:'8.0',left:'剩 3 天',period:'15 天',
  req:['花型：情侣字母刺绣','材质：新疆棉','版型：船袜','包装：礼盒装'],
  refs:['姓名样式','礼盒参考']},
 {id:'CP20261024003',kind:'personal',type:'直接大货',title:'宠物主题潮袜 柯基图案',buyer:'郑**',qty:500,unit:'双',maxPrice:'4.2',left:'剩 1 天',period:'20 天',
  req:['花型：柯基满印','材质：棉混纺','版型：中筒','包装：卡头袋'],
  refs:['柯基图案']},
 {id:'CP20261024004',kind:'personal',type:'仅样品定制',title:'汉服配套提花袜',buyer:'冯**',qty:300,unit:'双',maxPrice:'7.5',left:'剩 4 天',period:'25 天',
  req:['花型：缠枝提花','材质：真丝混纺','版型：及膝','包装：丝绸袋'],
  refs:['提花纹样','配色']},
 {id:'CP20261024005',kind:'personal',type:'先样品后大货',title:'健身房定制毛巾底袜',buyer:'何**',qty:800,unit:'双',maxPrice:'6.0',left:'剩 8 小时',period:'22 天',
  req:['花型：LOGO 提花','材质：棉 + 毛巾底','版型：中筒运动袜','包装：卡头袋'],
  refs:['LOGO']},
 {id:'CP20261024006',kind:'personal',type:'直接大货',title:'动漫IP联名长筒袜',buyer:'许**',qty:1200,unit:'双',maxPrice:'5.8',left:'剩 5 天',period:'30 天',
  req:['花型：IP 满印（需授权）','材质：棉混纺','版型：长筒','包装：卡头袋'],
  refs:['IP 图稿']},
 {id:'CE20261024001',kind:'enterprise',type:'直接大货',title:'某科技企业年会礼盒袜 LOGO刺绣',buyer:'企业采购',qty:3000,unit:'双',maxPrice:'9.8',left:'剩 1 天',period:'35 天',
  req:['花型：LOGO 刺绣','材质：精梳棉','版型：中筒','包装：年会礼盒 + 手提袋'],
  refs:['LOGO','礼盒设计']},
 {id:'CE20261024002',kind:'enterprise',type:'先样品后大货',title:'银行开户伴手礼袜（含包装）',buyer:'企业采购',qty:5000,unit:'双',maxPrice:'6.8',left:'剩 4 天',period:'40 天',
  req:['花型：行徽提花','材质：精梳棉','版型：中筒','包装：牛皮纸礼盒'],
  refs:['行徽','包装参考']},
 {id:'CE20261024003',kind:'enterprise',type:'直接大货',title:'车企4S店交车伴手礼袜',buyer:'企业采购',qty:2000,unit:'双',maxPrice:'5.5',left:'剩 2 天',period:'30 天',
  req:['花型：车标提花','材质：棉混纺','版型：中筒','包装：卡头袋'],
  refs:['车标']},
 {id:'CE20261024004',kind:'enterprise',type:'直接大货',title:'连锁酒店客房一次性拖鞋袜',buyer:'企业采购',qty:10000,unit:'双',maxPrice:'2.8',left:'剩 6 天',period:'45 天',
  req:['花型：素色 + 酒店 LOGO','材质：涤棉','版型：船袜','包装：独立 OPP 袋'],
  refs:['LOGO']},
 {id:'CE20261024005',kind:'enterprise',type:'先样品后大货',title:'地产交付礼盒定制袜（精装）',buyer:'企业采购',qty:6000,unit:'双',maxPrice:'10.5',left:'剩 3 天',period:'38 天',
  req:['花型：楼盘元素提花','材质：精梳棉','版型：中筒','包装：精装礼盒'],
  refs:['楼盘素材','礼盒']}
];

var id=q('id');
var d=DEMANDS.filter(function(x){return x.id===id;})[0];
if(!d){
  document.getElementById('bodyBox').innerHTML='<div class="text-center py-16"><i class="fas fa-shirt text-gray-200 text-4xl"></i><p class="text-[12px] text-gray-400 mt-3">需求不存在或已关闭</p><a href="shanghu-custom.html" class="inline-block mt-3 text-[12px] font-bold text-blue-600">返回定制需求池</a></div>';
  document.getElementById('footBar').style.display='none';
}else{
  var mine=readLS('sh_custom_quotes').filter(function(x){return x.demandId===d.id;})[0];
  if(mine&&(!mine.history||!mine.history.length)) mine=migrateQuote(mine);
  var changes=mine?mine.changes:0;
  var hist=mine&&mine.history?mine.history:[];
  var lastQ=hist.length?hist[hist.length-1]:null;
  var typeTip=d.type==='仅样品定制'?'本次仅提交样品报价，样品确认后线下沟通大货。'
    :d.type==='直接大货'?'本次直接提交大货报价，不产生打样单。'
    :'本次仅对样品报价；样品通过后由买家发起大货报价，后台生成两个订单。';

  /* 报价状态：待确认可继续改价；已选中看中标结果 + 订单；未中标只看结果、不披露中标价 */
  var st=mine?mine.status:'';
  var canEdit=!mine||st==='待确认';
  var stCard='';
  if(mine&&st==='已选中'){
    stCard='<div class="bg-white rounded-2xl shadow-soft p-3.5 mt-3" style="border:1px solid #A7F3D0">'
      +'<div class="flex items-center gap-1.5"><i class="fas fa-circle-check text-emerald-500"></i><p class="text-[12px] font-bold text-emerald-700">已中标</p>'
      +'<span class="ml-auto text-[9px] text-gray-400 num">'+(mine.awardTime||mine.time||'')+'</span></div>'
      +'<div class="mt-2 rounded-xl p-2.5" style="background:#F0FDF4"><p class="text-[9px] font-bold text-emerald-700">中标报价（买家已采纳）</p>'
      +'<p class="text-[10px] text-gray-700 mt-1 leading-relaxed num">'+(mine.detail||'')+'</p></div>'
      +'<div class="flex items-center justify-between mt-2"><span class="text-[9px] text-gray-400">'+(mine.orderNo?'订单号 '+mine.orderNo+' · 待买家支付订金后进入生产':'等待买家生成订单')+'</span>'
      +'<a href="orders.html" class="text-[10px] font-bold text-emerald-600">查看订单 ›</a></div>'
      +'</div>';
  }else if(mine&&st==='未选中'){
    stCard='<div class="bg-white rounded-2xl shadow-soft p-3.5 mt-3" style="border:1px solid #E2E8F0">'
      +'<div class="flex items-center gap-1.5"><i class="fas fa-circle-xmark text-gray-400"></i><p class="text-[12px] font-bold text-gray-600">未中标</p>'
      +'<span class="ml-auto text-[9px] text-gray-400 num">'+(mine.awardTime||'')+'</span></div>'
      +'<p class="text-[10px] text-gray-500 mt-2 leading-relaxed">买家已完成选标，本次未中标。按平台规则，<b>不披露买家最终中标价与其他卖家报价</b>。</p>'
      +'<p class="text-[9px] text-gray-400 mt-1.5">你本次报价：<span class="num">'+(mine.detail||'')+'</span></p>'
      +'</div>';
  }else if(mine){
    stCard='<div class="bg-white rounded-2xl shadow-soft p-3.5 mt-3" style="border:1px solid #FDE68A">'
      +'<div class="flex items-center gap-1.5"><i class="fas fa-clock text-amber-500"></i><p class="text-[12px] font-bold text-amber-700">待买家确认</p>'
      +'<span class="ml-auto text-[9px] text-gray-400">截止前还可改价 '+(2-changes)+' 次</span></div>'
      +'<p class="text-[10px] text-gray-500 mt-2 leading-relaxed">买家正在比价，选中后会在此显示中标结果与订单入口；未中标不显示其他卖家报价。</p>'
      +'</div>';
  }

  document.getElementById('bodyBox').innerHTML=
    '<div class="bg-white rounded-2xl shadow-soft p-3.5">'
    +'<div class="flex items-center gap-1.5"><span class="bg-indigo-50 text-indigo-600 text-[9px] font-bold px-1.5 py-0.5 rounded">'+d.type+'</span><span class="text-[9px] '+(d.left.indexOf('小时')>-1?'text-red-500 font-bold':'text-gray-400')+'">'+d.left+'</span></div>'
    +'<p class="text-[15px] font-extrabold text-gray-900 mt-1.5 leading-snug">'+d.title+'</p>'
    +'<div class="grid grid-cols-2 gap-y-2 text-[11px] mt-2.5">'
    +'<div><span class="text-gray-400">采购数量</span><p class="text-gray-700 num mt-0.5">'+d.qty+' '+d.unit+'</p></div>'
    +'<div><span class="text-gray-400">最高可接受</span><p class="text-red-500 font-bold num mt-0.5">¥'+d.maxPrice+'/'+d.unit+'</p></div>'
    +'<div><span class="text-gray-400">要求交期</span><p class="text-gray-700 num mt-0.5">'+d.period+'</p></div>'
    +'<div><span class="text-gray-400">发布方</span><p class="text-gray-700 mt-0.5">'+d.buyer+'</p></div>'
    +'</div>'
    +'<div class="mt-3 pt-2.5 border-t border-gray-50"><p class="text-[11px] font-bold text-gray-800 mb-1">定制要求</p>'
    +d.req.map(function(r){return '<p class="text-[10px] text-gray-500 leading-relaxed mt-0.5"><i class="fas fa-circle text-[4px] text-blue-300 mr-1 align-middle"></i>'+r+'</p>';}).join('')
    +'</div>'
    +'<div class="mt-2.5"><p class="text-[11px] font-bold text-gray-800 mb-1.5">参考图</p><div class="grid grid-cols-3 gap-2">'
    +d.refs.map(function(r){return '<div class="ph">'+r+'</div>';}).join('')+'</div></div>'
    +'</div>'

    +stCard

    +'<div id="quoteForm" class="bg-white rounded-2xl shadow-soft p-3.5 mt-3">'
    +'<div class="flex items-center justify-between mb-1"><p class="text-[12px] font-bold text-gray-800">'+(mine?'修改报价':'提交报价')+'</p>'
    +'<span class="text-[9px] '+(changes>=2?'text-red-500':'text-gray-400')+'">已改价 '+changes+'/2</span></div>'
    +'<p class="text-[10px] text-amber-600 leading-relaxed mb-2"><i class="fas fa-circle-info mr-1"></i>'+typeTip+'</p>'
    +'<div id="priceFields"></div>'
    +'<div class="grid grid-cols-2 gap-2 mt-2">'
    +'<div><label class="lbl">交期（天） <b>*</b></label><input id="fPeriod" type="number" class="inp" placeholder="如 25"></div>'
    +'<div><label class="lbl">是否含运费</label><select id="fFreight" class="inp"><option>含运费</option><option>不含运费</option></select></div>'
    +'</div>'
    +'<div class="mt-2"><label class="lbl">备注</label><textarea id="fNote" class="inp" rows="2" placeholder="工艺说明、起订量、打样周期等（选填）"></textarea></div>'
    +'</div>'

    /* 报价记录：每次提交/改价留痕，最新在上 */
    +(hist.length?('<div class="bg-white rounded-2xl shadow-soft p-3.5 mt-3">'
      +'<div class="flex items-center justify-between mb-1.5"><p class="text-[12px] font-bold text-gray-800">报价记录</p><span class="text-[9px] text-gray-400">共 '+hist.length+' 次</span></div>'
      +hist.slice().reverse().map(function(h,i){
          var isNew=i===0;
          return '<div class="py-2'+(i?' border-t border-gray-50':'')+'">'
            +'<div class="flex items-center justify-between"><span class="text-[10px] font-bold '+(isNew?'text-blue-600':'text-gray-500')+'">第 '+h.no+' 次'+(isNew?'（最新）':'')+'</span><span class="text-[9px] text-gray-400 num">'+(h.time||'')+'</span></div>'
            +'<p class="text-[10px] text-gray-600 mt-0.5 leading-relaxed">'+(h.detail||'')+'</p>'
            +'</div>';
        }).join('')
      +'<p class="text-[9px] text-gray-400 mt-1 pt-2 border-t border-gray-50"><i class="fas fa-circle-info mr-1"></i>每次提交与改价均留痕；截止前最多改价 2 次，即最多 3 次报价。</p>'
      +'</div>'):'')

    +'<div class="px-1 mt-2"><p class="text-[9px] text-gray-400 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>'
    +(canEdit?'截止前可改价，最多 2 次；未中标不会显示其他卖家报价。':'本需求报价已截止，选标结果以平台通知为准；不披露其他卖家报价与买家最终中标价。')
    +'</p></div>';

  // 按类型渲染价格字段（已选中 / 未中标时表单只读展示，不渲染可编辑表单）
  var pf=document.getElementById('priceFields');
  if(!canEdit){
    var qf=document.getElementById('quoteForm');
    if(qf) qf.remove();
  }else if(d.type==='仅样品定制'){
    pf.innerHTML='<div class="grid grid-cols-2 gap-2"><div><label class="lbl">样品单价（元/件） <b>*</b></label><input id="fSample" type="number" step="0.1" class="inp" placeholder="如 28"></div>'
      +'<div><label class="lbl">样品数量（件） <b>*</b></label><input id="fSampleQty" type="number" class="inp" placeholder="如 2"></div></div>';
  }else if(d.type==='直接大货'){
    pf.innerHTML='<div class="grid grid-cols-2 gap-2"><div><label class="lbl">大货单价（元/'+d.unit+'） <b>*</b></label><input id="fBulk" type="number" step="0.1" class="inp" placeholder="如 4.2"></div>'
      +'<div><label class="lbl">可供数量</label><input id="fBulkQty" type="number" class="inp" value="'+d.qty+'"></div></div>';
  }else{
    pf.innerHTML='<div class="grid grid-cols-2 gap-2"><div><label class="lbl">样品单价（元/件） <b>*</b></label><input id="fSample" type="number" step="0.1" class="inp" placeholder="如 28"></div>'
      +'<div><label class="lbl">样品数量（件） <b>*</b></label><input id="fSampleQty" type="number" class="inp" placeholder="如 2"></div></div>'
      +'<div class="mt-2"><label class="lbl">大货预估单价（元/'+d.unit+'）</label><input id="fBulk" type="number" step="0.1" class="inp" placeholder="样品通过后确认，可先填预估"></div>';
  }

  /* 改价回填：带出上一次报价的样品价/数量、大货价、交期、运费、备注 */
  if(mine){
    var src=lastQ||mine;
    [['fSample',src.samplePrice],['fSampleQty',src.sampleQty],['fBulk',src.bulkPrice],['fBulkQty',src.bulkQty]].forEach(function(p){
      var el=document.getElementById(p[0]);
      if(el&&p[1]!==''&&p[1]!==undefined&&p[1]!==null) el.value=p[1];
    });
    var pe=document.getElementById('fPeriod'); if(pe&&src.period) pe.value=src.period;
    var fe=document.getElementById('fFreight'); if(fe&&src.freight) fe.value=src.freight;
    var ne=document.getElementById('fNote'); if(ne&&src.note) ne.value=src.note;
  }

  var foot='';
  if(st==='已选中'){
    foot='<a href="orders.html" class="block w-full py-3 rounded-xl text-white text-[14px] font-bold text-center" style="background:linear-gradient(135deg,#10B981,#059669)">查看订单</a>';
  }else if(st==='未选中'){
    foot='<a href="shanghu-custom.html?tab=mine" class="block w-full py-3 rounded-xl text-gray-500 text-[14px] font-bold text-center bg-gray-100">返回我的报价</a>';
  }else if(changes>=2){
    foot='<div class="block w-full py-3 rounded-xl text-gray-400 text-[13px] font-bold text-center bg-gray-100">改价次数已用完（2/2）</div>';
  }else{
    foot='<a onclick="submitQuote()" class="block w-full py-3 rounded-xl text-white text-[14px] font-bold text-center" style="background:linear-gradient(135deg,#6366F1,#4F46E5)">'+(mine?'提交改价':'提交报价')+'</a>';
  }
  document.getElementById('footBar').innerHTML=foot;
  var bl=document.getElementById('backLink');
  bl.href='shanghu-custom.html?type='+d.kind;
  /* 从首页需求池进来时返回首页，从列表进来时返回列表；直接打开则走 href 兜底 */
  bl.onclick=function(e){ if(history.length>1){ e.preventDefault(); history.back(); } };

  /* 从「我的报价」进来：待确认显示「修改报价」，已结束显示「报价详情」 */
  if(q('from')==='mine'&&mine){
    var pageTitle=(mine.status==='待确认')?'修改报价':'报价详情';
    Array.prototype.forEach.call(document.querySelectorAll('span'),function(el){
      if(el.textContent.trim()==='需求详情'&&el.className.indexOf('text-[17px]')>-1) el.textContent=pageTitle;
    });
  }
}

function submitQuote(){
  if(!d)return;
  var period=document.getElementById('fPeriod').value.trim();
  var freight=document.getElementById('fFreight').value;
  var note=document.getElementById('fNote').value.trim();
  var sEl=document.getElementById('fSample'),sqEl=document.getElementById('fSampleQty'),bEl=document.getElementById('fBulk'),bqEl=document.getElementById('fBulkQty');
  if(!period){toast('请填写交期');return}
  var detail='';
  if(d.type==='仅样品定制'){
    if(!sEl.value){toast('请填写样品单价');return}
    if(!sqEl.value){toast('请填写样品数量');return}
    detail='样品 ¥'+sEl.value+'/件 × '+sqEl.value+'件';
  }else if(d.type==='直接大货'){
    if(!bEl.value){toast('请填写大货单价');return}
    detail='¥'+bEl.value+'/'+d.unit+' × '+(bqEl.value||d.qty)+d.unit;
  }else{
    if(!sEl.value){toast('请填写样品单价');return}
    if(!sqEl.value){toast('请填写样品数量');return}
    detail='样品 ¥'+sEl.value+'/件 × '+sqEl.value+'件'+(bEl.value?' · 大货预估 ¥'+bEl.value+'/'+d.unit:'');
  }
  detail+=' · 交期 '+period+' 天 · '+freight;
  /* 结构化留痕：本次报价的字段值 + 明细，写入 history 供「报价记录」与下次回填 */
  var rec={
    no:0,time:nowStr(),detail:detail,
    samplePrice:sEl?sEl.value:'',sampleQty:sqEl?sqEl.value:'',
    bulkPrice:bEl?bEl.value:'',bulkQty:bqEl?bqEl.value:'',
    period:period,freight:freight,note:note
  };
  var list=readLS('sh_custom_quotes');
  var idx=-1;
  list.forEach(function(x,i){if(x.demandId===d.id)idx=i;});
  if(idx>-1){
    if(list[idx].changes>=2){toast('改价次数已用完（2/2）');return}
    var it=list[idx];
    var h=it.history||[];
    if(!h.length&&it.detail) h.push({no:1,time:it.time,detail:it.detail});
    rec.no=h.length+1;
    h.push(rec);
    it.history=h;
    it.detail=detail;it.time=rec.time;it.changes=(it.changes||0)+1;it.status='待确认';
    it.samplePrice=rec.samplePrice;it.sampleQty=rec.sampleQty;it.bulkPrice=rec.bulkPrice;
    it.bulkQty=rec.bulkQty;it.period=period;it.freight=freight;it.note=note;
  }else{
    rec.no=1;
    list.unshift({demandId:d.id,title:d.title,type:d.type,detail:detail,status:'待确认',time:rec.time,changes:0,history:[rec],
      samplePrice:rec.samplePrice,sampleQty:rec.sampleQty,bulkPrice:rec.bulkPrice,bulkQty:rec.bulkQty,period:period,freight:freight,note:note});
  }
  writeLS('sh_custom_quotes',list.slice(0,50));
  toast(idx>-1?'改价已提交（第 '+rec.no+' 次报价）':'报价已提交');
  setTimeout(function(){location.href='shanghu-custom.html?tab=mine';},700);
}

/* 从「我的报价」点「修改报价」进入：自动定位到报价表单 */
if(q('from')==='mine'){
  setTimeout(function(){
    var el=document.getElementById('priceFields');
    if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'center'});
  },200);
}
</script>
