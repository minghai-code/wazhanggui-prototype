<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>现场核销 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F5F7FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.99)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,20,40,.06)}
.inp{width:100%;background:#F8F9FB;border:1px solid #EEF0F4;border-radius:12px;padding:11px 13px;font-size:13px;color:#1F2430;outline:none}
.inp:focus{border-color:#10B981;background:#fff}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:900;opacity:0;pointer-events:none;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.scan-mask{position:fixed;inset:0;background:rgba(6,18,14,.84);z-index:300;opacity:0;pointer-events:none;transition:.2s}
.scan-mask.on{opacity:1;pointer-events:auto}
.scan-box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:300px;background:#0B1512;border-radius:20px;padding:18px 16px;z-index:301;opacity:0;pointer-events:none;transition:.22s;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.scan-box.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.scan-frame{position:relative;width:216px;height:216px;margin:8px auto 0;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#1F2937,#0A1310)}
.scan-frame i.c{position:absolute;width:24px;height:24px;border:3px solid #34D399}
.scan-line{position:absolute;left:10px;right:10px;height:2px;background:linear-gradient(90deg,transparent,#34D399,transparent);box-shadow:0 0 10px #34D399;animation:scanMove 1.9s ease-in-out infinite}
@keyframes scanMove{0%{top:14px}50%{top:196px}100%{top:14px}}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#10B981 0%,#059669 55%,#047857 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-40" style="background:#6EE7B7"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="shanghu-activity-manage.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div class="min-w-0"><p class="text-white font-extrabold text-[18px]">现场核销</p><p class="text-white/80 text-[10px] mt-0.5 truncate" id="actName">—</p></div>
  </div>
  <div class="relative mt-3 grid grid-cols-3 gap-2 text-center text-white">
    <div class="rounded-xl py-2" style="background:rgba(255,255,255,.18)"><p class="text-[17px] font-black num" id="sOk">0</p><p class="text-[9px] text-white/75">已通过</p></div>
    <div class="rounded-xl py-2" style="background:rgba(255,255,255,.18)"><p class="text-[17px] font-black num" id="sIn">0</p><p class="text-[9px] text-white/75">已签到</p></div>
    <div class="rounded-xl py-2" style="background:rgba(255,255,255,.18)"><p class="text-[17px] font-black num" id="sLeft">0</p><p class="text-[9px] text-white/75">未到场</p></div>
  </div>
</div>

<div class="px-3 pt-3 pb-16">
  <div class="bg-white rounded-2xl shadow-soft p-3.5">
    <p class="text-[12px] font-bold text-gray-800 mb-2">输入 6 位签到码</p>
    <input id="codeInput" class="inp num text-center" maxlength="6" inputmode="numeric" placeholder="——————" style="letter-spacing:8px;font-size:20px;font-weight:800">
    <div class="flex gap-2 mt-2.5">
      <button onclick="doCheckin()" class="flex-1 py-3 rounded-xl text-white text-[14px] font-bold" style="background:linear-gradient(135deg,#10B981,#059669)">核 销</button>
      <button onclick="openScan()" class="flex-1 py-3 rounded-xl text-[14px] font-bold" style="color:#059669;background:#ECFDF5;border:1px solid #A7F3D0"><i class="fas fa-qrcode mr-1"></i>扫码核销</button>
    </div>
    <p class="text-[9px] text-gray-400 mt-2 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>支持扫报名二维码或口述 6 位码；同一报名单重复核销会提示首次签到时间（幂等）。签到码全局唯一，跨活动不通用。</p>
  </div>

  <div class="bg-white rounded-2xl shadow-soft p-3.5 mt-3">
    <div class="flex items-center justify-between mb-2"><p class="text-[12px] font-bold text-gray-800">未到场名单</p><span class="text-[10px] text-gray-400" id="pendingCnt">0 人</span></div>
    <div id="pendingList" class="space-y-1.5"></div>
  </div>

  <div class="bg-white rounded-2xl shadow-soft p-3.5 mt-3">
    <p class="text-[12px] font-bold text-gray-800 mb-2">最近核销</p>
    <div id="logList" class="space-y-1.5"></div>
  </div>
</div>

<!-- 扫码核销浮层 -->
<div class="scan-mask" id="scanMask" onclick="closeScan()"></div>
<div class="scan-box" id="scanBox">
  <p class="text-white text-[14px] font-bold">扫码核销</p>
  <p class="text-white/50 text-[10px] mt-1 truncate" id="scanAct">—</p>
  <div class="scan-frame">
    <i class="c" style="left:8px;top:8px;border-right:0;border-bottom:0;border-radius:8px 0 0 0"></i>
    <i class="c" style="right:8px;top:8px;border-left:0;border-bottom:0;border-radius:0 8px 0 0"></i>
    <i class="c" style="left:8px;bottom:8px;border-right:0;border-top:0;border-radius:0 0 0 8px"></i>
    <i class="c" style="right:8px;bottom:8px;border-left:0;border-top:0;border-radius:0 0 8px 0"></i>
    <div class="scan-line"></div>
  </div>
  <p class="text-white/60 text-[10px] mt-3">将报名二维码放入框内，自动识别并核销</p>
  <button onclick="simulateScan()" class="w-full mt-3 py-2.5 rounded-xl text-[12px] font-bold text-white" style="background:linear-gradient(135deg,#10B981,#059669)">（演示）模拟扫到报名码</button>
  <button onclick="closeScan()" class="w-full mt-2 py-2.5 rounded-xl text-[12px] font-bold text-white/70 bg-white/10">取消</button>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>

<script>
var ttm;function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(ttm);ttm=setTimeout(function(){t.classList.remove('on')},1800)}
function readLS(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
function writeLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function q(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):''}
function nowStr(){var d=new Date();function p(n){return n<10?'0'+n:''+n}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
function pass(s){return s.audit==='已通过';}

var actId=q('id');
var act=readLS('sh_act_mine').filter(function(x){return x.id===actId;})[0];
if(!act){
  document.getElementById('actName').textContent='活动不存在';
  document.getElementById('pendingList').innerHTML='<p class="text-[11px] text-gray-400">请从「我的活动」进入</p>';
}else{
  document.getElementById('actName').textContent=act.name+' · '+act.start+' '+act.place;
  renderAll();
}

function saveSignups(fn){
  var list=readLS('sh_act_mine');
  list.forEach(function(a){if(a.id===actId)fn(a);});
  writeLS('sh_act_mine',list);
  act=list.filter(function(x){return x.id===actId;})[0];
}
function renderAll(){
  if(!act)return;
  var ok=act.signups.filter(pass);
  var inn=ok.filter(function(s){return s.checkin==='已签到';});
  document.getElementById('sOk').textContent=ok.length;
  document.getElementById('sIn').textContent=inn.length;
  document.getElementById('sLeft').textContent=Math.max(0,ok.length-inn.length);
  document.getElementById('pendingCnt').textContent=Math.max(0,ok.length-inn.length)+' 人';
  var pend=ok.filter(function(s){return s.checkin!=='已签到';});
  document.getElementById('pendingList').innerHTML=pend.length?pend.map(function(s){
    return '<div class="flex items-center justify-between py-1.5 border-b border-gray-50"><div class="min-w-0"><p class="text-[11px] font-medium text-gray-700 truncate">'+s.name+' <span class="text-[10px] text-gray-400 num">'+s.phone+'</span></p><p class="text-[9px] text-gray-400">'+s.unit+' · 同行 '+s.companions+' 人</p></div>'
      +'<a onclick="manualCheckin(\''+s.phone+'\')" class="text-[10px] font-bold px-2 py-1 rounded-md bg-emerald-50 text-emerald-600 flex-shrink-0">补签到</a></div>';
  }).join(''):'<p class="text-[11px] text-gray-400 py-3 text-center">全部已到场</p>';
  var logs=ok.filter(function(s){return s.checkin==='已签到';}).slice(0,6);
  document.getElementById('logList').innerHTML=logs.length?logs.map(function(s){
    return '<div class="flex items-center justify-between py-1.5 border-b border-gray-50"><span class="text-[11px] text-gray-700 truncate">'+s.name+' · '+s.phone+'</span><span class="text-[10px] text-emerald-600 num flex-shrink-0">'+s.signTime+'</span></div>';
  }).join(''):'<p class="text-[11px] text-gray-400 py-3 text-center">暂无核销记录</p>';
}
function openScan(){
  if(!act){toast('活动不存在，无法核销');return;}
  document.getElementById('scanAct').textContent=act.name+' · '+act.start;
  document.getElementById('scanMask').classList.add('on');
  document.getElementById('scanBox').classList.add('on');
}
function closeScan(){
  document.getElementById('scanMask').classList.remove('on');
  document.getElementById('scanBox').classList.remove('on');
}
/* 演示：无真实摄像头，模拟识别到下一张待签到报名二维码 */
function simulateScan(){
  if(!act){closeScan();return;}
  var pend=act.signups.filter(function(s){return s.audit==='已通过'&&s.checkin!=='已签到';});
  if(!pend.length){closeScan();toast('没有待签到的报名单');return;}
  var s=pend[0];
  closeScan();
  if(!s.code){toast(s.name+' 未生成签到码，请用「补签到」');return;}
  document.getElementById('codeInput').value=s.code;
  doCheckin();
}
function doCheckin(){
  if(!act){toast('活动不存在，无法核销');return;}
  var code=(document.getElementById('codeInput').value||'').trim();
  if(!/^\d{6}$/.test(code)){toast('请输入 6 位签到码');return;}
  var hit=null;
  act.signups.forEach(function(s){if(s.code===code)hit=s;});
  if(!hit){toast('未找到该签到码，请确认活动与码值');return;}
  if(hit.audit!=='已通过'){toast('该报名未通过审核，不能签到');return;}
  if(hit.checkin==='已签到'){toast('已于 '+hit.signTime+' 签到（请勿重复核销）');return;}
  saveSignups(function(a){a.signups.forEach(function(s){if(s.code===code){s.checkin='已签到';s.signTime=nowStr();}});});
  document.getElementById('codeInput').value='';
  renderAll();toast(hit.name+' 签到成功');
}
function manualCheckin(phone){
  if(!confirm('确认将该报名单补签为「已签到」？用于未带码/现场补录。'))return;
  saveSignups(function(a){a.signups.forEach(function(s){if(s.phone===phone){s.checkin='已签到';s.signTime=nowStr();s.src='现场';}});});
  renderAll();toast('已补签到');
}
</script>
</body>
</html>
