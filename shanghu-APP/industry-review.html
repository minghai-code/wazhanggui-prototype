<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>服务评价 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F9FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.tag-opt{font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:10px;padding:6px 12px;cursor:pointer}.tag-opt.on{border-color:#F59E0B;color:#B45309;background:#FFFBEB;font-weight:600}
.star{font-size:26px;color:#E5E7EB;cursor:pointer}.star.on{color:#F59E0B}
.inp{width:100%;background:#F8F9FA;border:1px solid #eee;border-radius:12px;padding:11px 13px;font-size:13px;outline:none}
.inp:focus{border-color:#F59E0B;background:#fff}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#F59E0B 0%,#D97706 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FCD34D"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="industry-service.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">服务评价</span>
    <p class="text-white/85 text-[10px] mt-0.5">评价回传后台，计入服务商满意度评分</p></div>
  </div>
</div>

<!-- 评价表单 -->
<div class="px-3 pt-4 pb-16" id="formBox">
  <div class="bg-white rounded-2xl shadow-soft p-3.5">
    <div class="flex items-center gap-2.5 pb-3 border-b border-gray-50">
      <div class="w-10 h-10 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#0EA5E9,#0284C7)"><i class="fas fa-vial-circle-check"></i></div>
      <div class="min-w-0"><p class="text-[13px] font-bold text-gray-800">精梳棉男袜质量检测</p><p class="text-[10px] text-gray-400">服务商：大唐检测认证中心 · IS20260710-01</p></div>
    </div>

    <p class="text-[12px] font-bold text-gray-800 mt-3 mb-2 text-center">您对本次服务的满意度</p>
    <div class="flex justify-center gap-2" id="stars">
      <i class="fas fa-star star" onclick="setStar(1)"></i>
      <i class="fas fa-star star" onclick="setStar(2)"></i>
      <i class="fas fa-star star" onclick="setStar(3)"></i>
      <i class="fas fa-star star" onclick="setStar(4)"></i>
      <i class="fas fa-star star" onclick="setStar(5)"></i>
    </div>
    <p class="text-center text-[10px] text-gray-400 mt-2" id="starTxt">点击星星打分</p>

    <p class="text-[12px] font-bold text-gray-800 mt-3 mb-2">标签（可多选）</p>
    <div class="flex flex-wrap gap-1.5">
      <span class="tag-opt" onclick="this.classList.toggle('on')">专业</span>
      <span class="tag-opt" onclick="this.classList.toggle('on')">高效</span>
      <span class="tag-opt" onclick="this.classList.toggle('on')">响应快</span>
      <span class="tag-opt" onclick="this.classList.toggle('on')">服务好</span>
      <span class="tag-opt" onclick="this.classList.toggle('on')">价格合理</span>
      <span class="tag-opt" onclick="this.classList.toggle('on')">报告规范</span>
    </div>

    <p class="text-[12px] font-bold text-gray-800 mt-3 mb-2">文字评价</p>
    <textarea class="inp" rows="3" placeholder="分享您的服务体验（选填）"></textarea>
  </div>
  <button class="card w-full mt-4 py-3 rounded-2xl text-white text-[14px] font-bold" style="background:linear-gradient(135deg,#F59E0B,#D97706)" onclick="submitReview()">提交评价</button>
</div>

<!-- 提交成功 -->
<div class="px-3 pt-4 pb-16" id="doneBox" style="display:none">
  <div class="bg-white rounded-2xl shadow-soft p-4 text-center">
    <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#34D399,#10B981)"><i class="fas fa-check text-white text-xl"></i></div>
    <p class="text-[15px] font-bold text-gray-800 mt-3">评价已提交</p>
    <p class="text-[11px] text-gray-500 mt-1">感谢您的反馈，评价已回传平台，计入服务商满意度评分。</p>
    <a href="industry-service.html" class="card block w-full mt-3 py-2.5 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#0EA5E9,#0284C7)">返回产业服务</a>
  </div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer,score=0;
function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
function setStar(n){
  score=n;
  document.querySelectorAll('#stars .star').forEach(function(s,i){s.classList.toggle('on',i<n);});
  document.getElementById('starTxt').textContent=['','很不满意','不满意','一般','满意','非常满意'][n]+'（'+n+' 分）';
}
function submitReview(){
  if(!score){toast('请先打分');return}
  document.getElementById('formBox').style.display='none';
  document.getElementById('doneBox').style.display='block';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
