<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>申请线上开店 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.grad-h{background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#0EA5E9 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.inp{width:100%;background:rgba(248,249,250,.8);border:1px solid rgba(240,240,240,.8);border-radius:12px;padding:11px 13px;font-size:13px;color:#1F2430;outline:none}
.inp::placeholder{color:#C0C0C0}.inp:focus{border-color:#2563EB;background:#fff}
.inp[readonly]{background:#F3F4F6;color:#6B7280}
.lbl{font-size:11px;color:#6b7080;font-weight:500;display:block;margin-bottom:6px}.lbl b{color:#2563EB}
.tag-opt{font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:10px;padding:6px 12px;cursor:pointer}.tag-opt.on{border-color:#2563EB;color:#2563EB;background:#EFF6FF;font-weight:600}
.upload-box{border:1.5px dashed #D1D5DB;border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:#fff}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- ===== 头部 ===== -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#60A5FA"></div>
  <div class="relative flex items-center gap-3">
    <a href="mine.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">申请线上开店</span>
    <p class="text-white/85 text-[10px] mt-0.5">提交「10 商城运营 → 商户管理 → 入驻申请」审核</p></div>
  </div>
</div>

<!-- ===== 申请表单 ===== -->
<div class="px-3 pt-4 pb-16" id="formBox">
  <div class="bg-white rounded-2xl shadow-soft p-3.5">
    <div class="mb-3"><label class="lbl">入驻类型 <b>*</b></label>
      <div class="flex flex-wrap gap-1.5" id="joinType">
        <span class="tag-opt on" onclick="pickOne(this)">企业入驻</span>
        <span class="tag-opt" onclick="pickOne(this)">个人入驻</span>
      </div>
    </div>
    <div class="mb-3"><label class="lbl">商户名称 <b>*</b></label><input class="inp" id="merName" placeholder="如：大唐新锐袜业"></div>
    <div class="mb-3"><label class="lbl">会员名称（账号，自动带出）</label><input class="inp" value="大唐新锐袜业（dz_10086）" readonly></div>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div><label class="lbl">联系人姓名 <b>*</b></label><input class="inp" placeholder="请输入"></div>
      <div><label class="lbl">联系人电话 <b>*</b></label><input class="inp" placeholder="请输入"></div>
    </div>
    <div class="mb-3"><label class="lbl">统一社会信用代码 <b>*</b>（企业入驻必填）</label><input class="inp" placeholder="如：91330681XXXXXX1234"></div>
    <div class="mb-3"><label class="lbl">经营范围 <b>*</b></label><textarea class="inp" rows="2" placeholder="如：袜品生产、销售"></textarea></div>
    <div class="mb-1"><label class="lbl">资质附件</label>
      <div class="grid grid-cols-3 gap-2">
        <div class="upload-box" onclick="toast('上传营业执照')"><i class="fas fa-image text-xl text-gray-300"></i><span class="text-[9px] text-gray-400">营业执照</span></div>
        <div class="upload-box" onclick="toast('上传法人身份证')"><i class="fas fa-id-card text-xl text-gray-300"></i><span class="text-[9px] text-gray-400">法人身份证</span></div>
        <div class="upload-box" onclick="toast('上传开户许可证')"><i class="fas fa-file-lines text-xl text-gray-300"></i><span class="text-[9px] text-gray-400">开户许可证</span></div>
      </div>
    </div>
    <p class="text-[10px] text-gray-400 mt-2 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>字段与后台「入驻申请」一致；注册账号即会员，审核通过后开通店铺 + <b>电商模块权限</b>。</p>
  </div>
  <button class="card w-full mt-4 py-3 rounded-2xl text-white text-[14px] font-bold grad-h" onclick="submitApply()">提交申请</button>
</div>

<!-- ===== 状态回显 ===== -->
<div class="px-3 pt-4 pb-16" id="statusBox" style="display:none">
  <div class="bg-white rounded-2xl shadow-soft p-4 text-center">
    <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" id="stIcon"><i class="fas fa-clock text-white text-xl"></i></div>
    <p class="text-[15px] font-bold text-gray-800 mt-3" id="stTitle">开店申请审核中</p>
    <p class="text-[11px] text-gray-500 mt-1" id="stDesc">已提交「10 商城运营」，预计 1-3 个工作日。</p>
    <div class="mt-3 rounded-xl border border-gray-100 p-2.5 text-left text-[10px] text-gray-500">
      <div class="flex justify-between"><span>商户名称</span><span class="text-gray-700 font-medium" id="stName">大唐新锐袜业</span></div>
      <div class="flex justify-between mt-1"><span>入驻类型</span><span class="text-gray-700 font-medium" id="stType">企业入驻</span></div>
      <div class="flex justify-between mt-1"><span>状态</span><span class="font-bold" id="stState">待审核</span></div>
      <div id="stReasonRow" style="display:none" class="mt-1"><span>驳回原因</span><p class="text-rose-500 mt-0.5">附件不清晰，请重新上传营业执照与法人身份证</p></div>
    </div>

    <!-- 演示：模拟后台审核 -->
    <div class="flex gap-2 mt-3">
      <button class="card flex-1 py-2.5 rounded-xl border border-gray-200 text-[12px] text-gray-600 font-medium" onclick="mock('reject')">模拟驳回（演示）</button>
      <button class="card flex-1 py-2.5 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#10B981,#059669)" onclick="mock('pass')">模拟审核通过（演示）</button>
    </div>
    <button class="card w-full mt-2 py-2.5 rounded-xl text-[12px] text-gray-600 font-medium bg-white border border-gray-200" onclick="resetApply()">重新提交申请</button>
    <a href="mine.html" class="card block w-full mt-2 py-2.5 rounded-xl text-white text-[13px] font-bold grad-h">返回我的</a>
  </div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer;
function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
function pickOne(el){document.querySelectorAll('#joinType .tag-opt').forEach(function(a){a.classList.remove('on')});el.classList.add('on');}
function submitApply(){
  var n=document.getElementById('merName').value.trim()||'大唐新锐袜业';
  var t=document.querySelector('#joinType .tag-opt.on').textContent;
  localStorage.setItem('sh_store_apply',JSON.stringify({name:n,type:t,status:'pending'}));
  toast('已提交线上开店申请（10 商城运营）');showStatus();
}
function mock(s){localStorage.setItem('sh_store_apply',JSON.stringify({name:(getApply().name||'大唐新锐袜业'),type:(getApply().type||'企业入驻'),status:s}));showStatus();}
function getApply(){try{return JSON.parse(localStorage.getItem('sh_store_apply')||'{}')}catch(e){return{}}}
function resetApply(){localStorage.removeItem('sh_store_apply');document.getElementById('formBox').style.display='block';document.getElementById('statusBox').style.display='none';window.scrollTo(0,0);}
function showStatus(){
  var o=getApply();if(!o||!o.status)return;
  document.getElementById('formBox').style.display='none';
  document.getElementById('statusBox').style.display='block';
  document.getElementById('stName').textContent=o.name;document.getElementById('stType').textContent=o.type;
  var ic=document.getElementById('stIcon'),ti=document.getElementById('stTitle'),de=document.getElementById('stDesc'),ss=document.getElementById('stState'),rr=document.getElementById('stReasonRow');
  if(o.status==='pass'){
    ic.style.background='linear-gradient(135deg,#34D399,#10B981)';ic.innerHTML='<i class="fas fa-check text-white text-xl"></i>';
    ti.textContent='审核通过，已开店';
    de.innerHTML='已开通店铺 + <b>电商模块权限</b>，可发布商品、上架销售。';
    ss.textContent='审核通过';ss.style.color='#059669';rr.style.display='none';
  }else if(o.status==='reject'){
    ic.style.background='linear-gradient(135deg,#FB7185,#E11D48)';ic.innerHTML='<i class="fas fa-xmark text-white text-xl"></i>';
    ti.textContent='审核未通过';
    de.textContent='请根据驳回原因补充材料后重新提交。';
    ss.textContent='审核未通过';ss.style.color='#E11D48';rr.style.display='block';
  }else{
    ic.style.background='linear-gradient(135deg,#FBBF24,#F59E0B)';ic.innerHTML='<i class="fas fa-clock text-white text-xl"></i>';
    ti.textContent='开店申请审核中';
    de.textContent='已提交「10 商城运营」，预计 1-3 个工作日。';
    ss.textContent='待审核';ss.style.color='#D97706';rr.style.display='none';
  }
  window.scrollTo(0,0);
}
showStatus();
</script>
</body>
</html>
