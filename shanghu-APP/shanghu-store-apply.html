<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>申请线上开店 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.grad-h{background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#0EA5E9 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.inp{width:100%;background:rgba(248,249,250,.8);border:1px solid rgba(240,240,240,.8);border-radius:12px;padding:11px 13px;font-size:13px;color:#1F2430;outline:none}
.inp::placeholder{color:#C0C0C0}.inp:focus{border-color:#2563EB;background:#fff}
.lbl{font-size:11px;color:#6b7080;font-weight:500;display:block;margin-bottom:6px}.lbl b{color:#2563EB}
.tag-opt{font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:10px;padding:6px 12px;cursor:pointer}.tag-opt.on{border-color:#2563EB;color:#2563EB;background:#EFF6FF;font-weight:600}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:200;opacity:0;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- ===== 头部 ===== -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#60A5FA"></div>
  <div class="relative flex items-center gap-3">
    <a href="mine.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">申请线上开店</span>
    <p class="text-white/85 text-[10px] mt-0.5">提交「10 商城运营」审核，通过后开通电商卖货权限</p></div>
  </div>
</div>

<!-- ===== 申请表单 ===== -->
<div class="px-3 pt-4 pb-16" id="formBox">
  <div class="bg-white rounded-2xl shadow-soft p-3.5">
    <div class="mb-3"><label class="lbl">店铺名称 <b>*</b></label><input class="inp" id="shopName" placeholder="如：大唐袜业旗舰店"></div>
    <div class="mb-3"><label class="lbl">主营品类 <b>*</b></label><div class="flex flex-wrap gap-1.5">
      <span class="tag-opt on" onclick="tagSelect(this)">男袜</span><span class="tag-opt" onclick="tagSelect(this)">女袜</span><span class="tag-opt" onclick="tagSelect(this)">童袜</span><span class="tag-opt" onclick="tagSelect(this)">运动袜</span><span class="tag-opt" onclick="tagSelect(this)">保暖袜</span><span class="tag-opt" onclick="tagSelect(this)">功能袜</span></div></div>
    <div class="mb-3"><label class="lbl">客服电话 <b>*</b></label><input class="inp" placeholder="用于买家咨询与售后联系"></div>
    <div class="mb-1"><label class="lbl">店铺简介</label><textarea class="inp" rows="3" placeholder="一句话介绍您的店铺与主营优势"></textarea></div>
    <p class="text-[10px] text-gray-400 mt-2 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>实名信息已在注册时采集，资质校验随入驻默认开通；此处仅提交电商开店资料。</p>
  </div>
  <button class="card w-full mt-4 py-3 rounded-2xl text-white text-[14px] font-bold grad-h" onclick="submitApply()">提交申请</button>
</div>

<!-- ===== 状态回显 ===== -->
<div class="px-3 pt-4 pb-16" id="statusBox" style="display:none">
  <div class="bg-white rounded-2xl shadow-soft p-4 text-center">
    <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)"><i class="fas fa-clock text-white text-xl"></i></div>
    <p class="text-[15px] font-bold text-gray-800 mt-3">开店申请审核中</p>
    <p class="text-[11px] text-gray-500 mt-1">已提交「10 商城运营」，预计 1-3 个工作日；通过后将开通店铺管理与商品发布权限。</p>
    <div class="mt-3 rounded-xl border border-gray-100 p-2.5 text-left text-[10px] text-gray-500">
      <div class="flex justify-between"><span>店铺名称</span><span class="text-gray-700 font-medium" id="stName">大唐袜业旗舰店</span></div>
      <div class="flex justify-between mt-1"><span>状态</span><span class="text-amber-600 font-bold">待审核</span></div>
    </div>
    <a href="mine.html" class="card block w-full mt-3 py-2.5 rounded-xl text-white text-[13px] font-bold grad-h">返回我的</a>
  </div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer;
function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
function tagSelect(el){el.classList.toggle('on')}
function submitApply(){
  var n=document.getElementById('shopName').value.trim()||'大唐袜业旗舰店';
  localStorage.setItem('sh_store_apply',JSON.stringify({name:n,status:'pending'}));
  toast('已提交线上开店申请（10 商城运营）');showStatus();
}
function showStatus(){
  var s=localStorage.getItem('sh_store_apply');
  if(s){try{var o=JSON.parse(s);if(o&&o.name)document.getElementById('stName').textContent=o.name;}catch(e){}
    document.getElementById('formBox').style.display='none';document.getElementById('statusBox').style.display='block';}
}
showStatus();
</script>
</body>
</html>
