<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>资料更新 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.grad-h{background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#0EA5E9 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.inp{width:100%;background:rgba(248,249,250,.8);border:1px solid rgba(240,240,240,.8);border-radius:12px;padding:11px 13px;font-size:13px;color:#1F2430;outline:none}
.inp::placeholder{color:#C0C0C0}.inp:focus{border-color:#2563EB;background:#fff}
.lbl{font-size:11px;color:#6b7080;font-weight:500;display:block;margin-bottom:6px}.lbl b{color:#2563EB}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#60A5FA"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="profile.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">资料更新</span>
    <p class="text-white/85 text-[10px] mt-0.5">提交变更申请 · 后台运营审核</p></div>
  </div>
</div>

<div class="px-3 pt-4 pb-16" id="formBox">
  <div class="bg-amber-50/70 border border-amber-100 rounded-2xl p-3.5 mb-3">
    <p class="text-[11px] text-amber-700 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>变更类型限 <b>企业信息 / 联系方式 / 资质 / 经营类目</b>（<b>不含档口</b> —— 档口由市场台账与合同决定，不可申请变更）。提交后由平台运营审核，通过后回写并生效。</p>
  </div>

  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3">
    <p class="text-[12px] font-bold text-gray-800 mb-3">企业信息</p>
    <div class="mb-3"><label class="lbl">企业名称 <b>*</b></label><input class="inp" value="大唐袜业旗舰"></div>
    <div class="mb-1"><label class="lbl">统一社会信用代码 <b>*</b></label><input class="inp" value="91330681XXXXXX1234"></div>
  </div>

  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3">
    <p class="text-[12px] font-bold text-gray-800 mb-3">联系方式</p>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div><label class="lbl">联系人 <b>*</b></label><input class="inp" value="李老板"></div>
      <div><label class="lbl">联系电话 <b>*</b></label><input class="inp" value="138****8000"></div>
    </div>
    <div class="mb-1"><label class="lbl">客服电话（对外展示）</label><input class="inp" value="138****8000"></div>
  </div>

  <div class="bg-white rounded-2xl shadow-soft p-3.5">
    <p class="text-[12px] font-bold text-gray-800 mb-3">资质与经营类目</p>
    <div class="mb-3"><label class="lbl">营业执照</label>
      <div class="border-[1.5px] border-dashed border-gray-300 rounded-xl p-4 text-center" onclick="toast('重新上传营业执照')"><i class="fas fa-image text-gray-300 text-xl"></i><p class="text-[10px] text-gray-400 mt-1">点击重新上传</p></div>
    </div>
    <div><label class="lbl">经营类目 <b>*</b></label>
      <div class="flex flex-wrap gap-1.5">
        <span class="tag on" style="font-size:11px;color:#2563EB;background:#EFF6FF;border:1px solid #2563EB;border-radius:10px;padding:6px 12px">男袜</span>
        <span class="tag on" style="font-size:11px;color:#2563EB;background:#EFF6FF;border:1px solid #2563EB;border-radius:10px;padding:6px 12px">女袜</span>
        <span class="tag" style="font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:10px;padding:6px 12px">童袜</span>
        <span class="tag" style="font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:10px;padding:6px 12px">运动袜</span>
      </div>
    </div>
  </div>
</div>

<!-- 提交结果 -->
<div class="px-3 pt-4 pb-16" id="doneBox" style="display:none">
  <div class="bg-white rounded-2xl shadow-soft p-4 text-center">
    <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)"><i class="fas fa-clock text-white text-xl"></i></div>
    <p class="text-[15px] font-bold text-gray-800 mt-3">变更申请已提交</p>
    <p class="text-[11px] text-gray-500 mt-1">已提交平台运营审核，预计 1 个工作日；通过后自动回写并生效。</p>
    <a href="profile.html" class="card block w-full mt-3 py-2.5 rounded-xl text-white text-[13px] font-bold grad-h">返回资料查看</a>
  </div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-3 py-2.5 flex gap-2" style="z-index:100;width:393px;padding-bottom:18px" id="footBar">
  <a onclick="location.href='profile.html'" class="flex-1 py-3 rounded-xl border border-gray-200 text-[13px] text-gray-600 font-medium text-center">取消</a>
  <a onclick="submitForm()" class="flex-1 py-3 rounded-xl text-white text-[13px] font-bold text-center grad-h">提交变更申请</a>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer;function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
function submitForm(){document.getElementById('formBox').style.display='none';document.getElementById('footBar').style.display='none';document.getElementById('doneBox').style.display='block';window.scrollTo(0,0);}
</script>
</body>
</html>
