<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>通知公告 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#6366F1;--bg:#EEF2FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.no-bar::-webkit-scrollbar{display:none}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;transition:.2s}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<!-- Tailwind 静态样式：本地引用；改动页面后重新构建见 wazhanggui-code/_tw-build/build.ps1 -->
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#6366F1 0%,#4F46E5 50%,#4338CA 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#A5B4FC"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#818CF8"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center justify-between mt-1">
    <a href="property.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <h1 id="hdrTitle" class="text-white font-extrabold text-[20px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">通知公告</h1>
    <div class="w-9"></div>
  </div>
  <p id="hdrSub" class="relative text-white/80 text-[11px] mt-2"><i class="fas fa-bullhorn"></i> 平台公告 · 按通知对象过滤（仅商户 / 全平台）</p>
</div>

<!-- ===== 列表视图 ===== -->
<div id="listView">
  <div class="px-3 mt-2">
    <div class="bg-white rounded-2xl shadow-soft p-2.5">
      <div class="flex items-center gap-2 bg-gray-50 rounded-xl px-3 py-2">
        <i class="fas fa-magnifying-glass text-gray-300 text-xs"></i>
        <input id="kw" oninput="renderList()" class="flex-1 bg-transparent text-[12px] outline-none" placeholder="搜索公告标题 / 关键词">
      </div>
      <div class="flex gap-1.5 mt-2 overflow-x-auto no-bar" id="catBar" style="white-space:nowrap"></div>
    </div>
  </div>
  <div class="px-3 mt-2 space-y-2" id="noticeList" style="padding-bottom:80px"></div>
</div>

<!-- ===== 详情视图 ===== -->
<div id="detailView" style="display:none">
  <div class="px-3 mt-3 mb-3">
    <div class="bg-white rounded-2xl shadow-soft p-4">
      <div class="flex items-center gap-2 mb-2 flex-wrap" id="dTags"></div>
      <h2 id="dTitle" class="text-[16px] font-bold text-gray-800 leading-snug"></h2>
      <div class="flex items-center gap-2 mt-2 text-[10px] text-gray-400" id="dMeta"></div>
      <div class="h-px bg-gray-50 my-3"></div>
      <div id="dBody" class="text-[12px] text-gray-700 leading-relaxed space-y-2.5"></div>
    </div>
  </div>
  <div class="px-3 mb-3" id="dAttachBox" style="display:none">
    <div class="bg-white rounded-2xl shadow-soft p-3.5">
      <p class="text-[12px] font-bold text-gray-800 mb-2.5"><i class="fas fa-paperclip text-primary text-xs"></i> 附件</p>
      <div class="flex items-center gap-2 bg-gray-50 rounded-xl p-2.5">
        <div class="w-9 h-9 rounded-lg bg-red-100 flex items-center justify-center flex-shrink-0"><i class="fas fa-file-pdf text-red-500 text-sm"></i></div>
        <div class="flex-1 min-w-0"><p id="dAttachName" class="text-[11px] font-medium text-gray-700 truncate"></p><p class="text-[9px] text-gray-400">1.2MB</p></div>
        <a href="#" class="text-[11px] text-primary font-bold">下载</a>
      </div>
    </div>
  </div>
  <div style="height:80px"></div>
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-3 py-2.5 flex gap-2" style="z-index:100;width:393px;padding-bottom:18px">
    <button onclick="backList()" class="flex-1 py-3 rounded-xl border border-gray-200 text-[13px] text-gray-600 font-medium">返回列表</button>
    <button onclick="toast('已标记已知晓')" class="flex-1 py-3 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#818CF8,#6366F1)">我已知晓</button>
  </div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>

<script>
// 内容管理下发的公告（模拟；通知对象 scope：仅商户 / 全平台；商户端仅可见这两种）
var NOTICES=[
  {cat:'活动通知',scope:'全平台',top:true,title:'关于2026年秋季大唐袜博会参展报名通知',src:'大唐袜业协会',date:'2026-07-19 14:30',attach:'2026秋季袜博会参展报名表.pdf',
   body:['各入驻商户：','2026年秋季大唐国际袜业博览会将于 <b>10月15日-17日</b> 在诸暨大唐国际袜业城举行。本届袜博会以"数智袜业·链通全球"为主题，展览面积3万㎡，预计参展企业500+，专业采购商2万+。','<b>参展权益：</b>','1. 免费标准展位1个（3m×3m）<br>2. 平台流量扶持及买家撮合<br>3. 入选"大唐好袜"评选资格<br>4. 媒体专访机会','<b>报名方式：</b>登录商户版 App，进入「活动与培训」在线报名，或联系市场管理部。报名截止：2026年8月30日。']},
  {cat:'政策法规',scope:'全平台',top:false,title:'关于开展2026年度中小企业数字化转型补贴申报的通知',src:'诸暨市经信局',date:'2026-07-15 09:00',attach:'',
   body:['各企业：','符合条件的规上袜企可申报数字化转型补贴，最高 <b>50 万元</b>。','<b>申报材料：</b>营业执照、数字化改造合同、发票、验收报告。','<b>截止时间：</b>2026年8月31日，逾期不再受理。']},
  {cat:'物业通知',scope:'仅商户',top:false,title:'关于A区1层消防管道年检的通知',src:'市场管理部',date:'2026-07-12 16:20',attach:'',
   body:['A区1层各位商户：','定于 <b>7月20日 09:00-12:00</b> 进行消防管道年检，期间可能短时停水，请提前储水。','<b>联系人：</b>物业维修 0575-8888xxxx。']},
  {cat:'系统公告',scope:'仅商户',top:false,title:'平台结算账户信息更新提醒',src:'平台运营',date:'2026-07-08 10:00',attach:'',
   body:['各位商户：','为保障资金安全，请及时在「我的 → 结算账户」核对并更新收款账户信息。','<b>生效时间：</b>2026年7月15日起。']}
];
var CATS=['全部','活动通知','政策法规','物业通知','系统公告'];
var curCat='全部',toastTimer;
function renderCats(){document.getElementById('catBar').innerHTML=CATS.map(function(c){return '<a onclick="setCat(\''+c+'\')" class="text-[11px] px-3 py-1.5 rounded-full '+(c===curCat?'text-white font-bold':'text-gray-500 bg-gray-50')+'" style="'+(c===curCat?'background:linear-gradient(135deg,#6366F1,#4F46E5)':'')+'">'+c+'</a>';}).join('');}
function setCat(c){curCat=c;renderCats();renderList();}
function renderList(){
  var kw=(document.getElementById('kw').value||'').trim();
  var arr=NOTICES.filter(function(n){return (curCat==='全部'||n.cat===curCat)&&(!kw||n.title.indexOf(kw)>-1);});
  arr.sort(function(a,b){return (b.top?1:0)-(a.top?1:0);});
  document.getElementById('noticeList').innerHTML=arr.length?arr.map(function(n){
    var idx=NOTICES.indexOf(n);
    var scopeCls=n.scope==='仅商户'?'bg-amber-50 text-amber-600':'bg-blue-50 text-blue-600';
    return '<a onclick="openDetail('+idx+')" class="card block bg-white rounded-2xl shadow-soft p-3.5 fade-up">'
      +'<div class="flex items-center gap-1.5 mb-1.5">'
      +(n.top?'<span class="bg-yellow-100 text-yellow-600 text-[9px] font-bold px-1.5 py-0.5 rounded"><i class="fas fa-star text-[7px]"></i> 置顶</span>':'')
      +'<span class="bg-indigo-50 text-indigo-600 text-[9px] font-bold px-1.5 py-0.5 rounded">'+n.cat+'</span>'
      +'<span class="'+scopeCls+' text-[9px] font-bold px-1.5 py-0.5 rounded">'+n.scope+'</span>'
      +'<span class="ml-auto text-[9px] text-gray-400">'+n.date.slice(0,10)+'</span>'
      +'</div>'
      +'<p class="text-[13px] font-bold text-gray-800 leading-snug">'+n.title+'</p>'
      +'<p class="text-[10px] text-gray-400 mt-1"><i class="fas fa-building"></i> '+n.src+'</p>'
      +'</a>';
  }).join(''):'<div class="text-center text-[12px] text-gray-400 py-10">未找到匹配的公告</div>';
}
function openDetail(idx){
  var n=NOTICES[idx];
  document.getElementById('hdrTitle').textContent='通知详情';
  document.getElementById('hdrSub').innerHTML='<i class="fas fa-bullhorn"></i> 通知详情 · 及时查看';
  var tags='<span class="bg-indigo-100 text-indigo-600 text-[9px] font-bold px-1.5 py-0.5 rounded">'+n.cat+'</span>';
  if(n.top)tags+='<span class="bg-yellow-100 text-yellow-600 text-[9px] font-bold px-1.5 py-0.5 rounded"><i class="fas fa-star text-[7px]"></i> 重要</span>';
  tags+='<span class="bg-gray-100 text-gray-500 text-[9px] font-bold px-1.5 py-0.5 rounded">'+n.scope+'</span>';
  document.getElementById('dTags').innerHTML=tags;
  document.getElementById('dTitle').textContent=n.title;
  document.getElementById('dMeta').innerHTML='<span><i class="fas fa-building"></i> '+n.src+'</span><span>·</span><span>'+n.date+'</span>';
  document.getElementById('dBody').innerHTML=n.body.map(function(p){return '<p>'+p+'</p>';}).join('');
  document.getElementById('dAttachBox').style.display=n.attach?'block':'none';
  if(n.attach)document.getElementById('dAttachName').textContent=n.attach;
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').style.display='block';
  window.scrollTo(0,0);
}
function backList(){
  document.getElementById('hdrTitle').textContent='通知公告';
  document.getElementById('hdrSub').innerHTML='<i class="fas fa-bullhorn"></i> 平台公告 · 按通知对象过滤（仅商户 / 全平台）';
  document.getElementById('detailView').style.display='none';
  document.getElementById('listView').style.display='block';
  window.scrollTo(0,0);
}
function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800);}
renderCats();renderList();
</script>
</body>
</html>
