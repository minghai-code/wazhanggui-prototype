<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>缴费中心 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#F59E0B;--bg:#FFFBEB}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.grad-h{background:linear-gradient(135deg,#3B82F6 0%,#2563EB 50%,#1D4ED8 100%)}
.num{font-variant-numeric:tabular-nums}
.card{transition:transform .16s ease}
.card:active{transform:scale(.98)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#F59E0B 0%,#D97706 50%,#B45309 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FCD34D"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FBBF24"></div>
  <div class="absolute -bottom-10 left-12 w-44 h-44 rounded-full blur-3xl opacity-35" style="background:#F59E0B"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center justify-between mt-1">
    <a href="mine.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <h1 class="text-white font-extrabold text-[20px]" style="text-shadow:0 2px 10px rgba(0,0,0,.18)">缴费中心</h1>
    <a href="payment-records.html" class="text-white text-[12px]">记录</a>
  </div>
  <p class="relative text-white/80 text-[11px] mt-2"><i class="fas fa-wallet"></i> 在线缴费 · 微信支付</p>
  <div class="relative flex gap-5 mt-3 text-[13px]">
    <a class="text-white font-bold border-b-2 border-white pb-1.5">待缴 <span class="num">1</span></a>
    <a class="text-white/70 pb-1.5">已缴</a>
    <a class="text-white/70 pb-1.5">全部</a>
  </div>
</div>

<!-- 逾期提醒 -->
<div class="px-3 mt-2">
  <div class="bg-red-50 border border-red-100 rounded-2xl p-3.5 flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)"><i class="fas fa-circle-exclamation text-lg"></i></div>
    <div class="flex-1"><p class="text-[13px] font-bold text-red-600">您有1笔账单待缴</p><p class="text-[10px] text-red-500 mt-0.5" id="overdueTip">逾期可能影响正常经营，请尽快缴费</p></div>
  </div>
</div>

<!-- 申报档口 + 待缴账单（按所选档口联动） -->
<div class="px-3 mt-3">
  <div id="wuUnitBox"></div>
  <div class="flex items-center justify-between mb-2 px-1">
    <p class="text-[12px] font-bold text-gray-800">待缴账单 <span class="text-[10px] text-gray-400 font-normal">（按所选档口）</span></p>
    <span class="text-[10px] text-gray-400 num" id="billHint"></span>
  </div>
  <div id="billBox"></div>
</div>

<!-- 缴费记录（全部档口） -->
<div class="px-3 mt-4 mb-6">
  <div class="flex items-center justify-between mb-2 px-1">
    <p class="text-[12px] font-bold text-gray-800">近期缴费记录 <span class="text-[10px] text-gray-400 font-normal">（全部档口）</span></p>
    <a href="payment-records.html" class="text-[10px] text-primary">全部 ›</a>
  </div>
  <div class="bg-white rounded-2xl shadow-soft overflow-hidden" id="recentBox"></div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script src="wuye-units.js"></script>
<script>
var BILLS={
 '1F-A08':{name:'10月商铺租金',amount:'¥12,800.00',due:'2026-07-17',overdue:'逾期3天'},
 '2F-B12':{name:'10月商铺租金',amount:'¥9,600.00',due:'2026-07-17',overdue:'逾期1天'},
 'YLSC-S08':{name:'10月店面租金',amount:'¥18,000.00',due:'2026-07-20',overdue:'待缴'},
 'XZFW-3F-06':{name:'10月办公室物业费',amount:'¥2,400.00',due:'2026-07-25',overdue:'待缴'}
};
var PAY_RECORDS=[
 {type:'9月电费',icon:'fa-bolt',cls:'bg-emerald-50 text-emerald-500',date:'2026-07-05',amount:'¥860.00',unit:'1F-A08'},
 {type:'9月商铺租金',icon:'fa-house',cls:'bg-blue-50 text-blue-600',date:'2026-07-03',amount:'¥12,800.00',unit:'1F-A08'},
 {type:'3季度物业费',icon:'fa-broom',cls:'bg-amber-50 text-amber-500',date:'2026-07-01',amount:'¥1,500.00',unit:'2F-B12'},
 {type:'9月店面租金',icon:'fa-store',cls:'bg-blue-50 text-blue-600',date:'2026-06-28',amount:'¥18,000.00',unit:'YLSC-S08'},
 {type:'9月水电费',icon:'fa-faucet-drip',cls:'bg-emerald-50 text-emerald-500',date:'2026-06-25',amount:'¥1,240.00',unit:'YLSC-S08'},
 {type:'3季度办公室物业费',icon:'fa-building',cls:'bg-amber-50 text-amber-500',date:'2026-06-20',amount:'¥2,400.00',unit:'XZFW-3F-06'}
];
var toastTimer;
function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800);}

function paintBill(){
  var u=wuyeCur(),b=BILLS[u.code]||BILLS['1F-A08'];
  var over=b.overdue.indexOf('逾期')===0;
  document.getElementById('overdueTip').textContent=over
    ? '「'+u.code+'」有 1 笔账单已'+b.overdue+'，请尽快缴费'
    : '「'+u.code+'」有 1 笔账单待缴，应缴日期 '+b.due;
  document.getElementById('billHint').textContent=u.code+' · '+u.area;
  document.getElementById('billBox').innerHTML='<div class="bg-white rounded-2xl shadow-soft overflow-hidden" style="border-left:3px solid #EF4444">'
    +'<div class="px-3.5 py-3.5">'
    +'<div class="flex items-center justify-between mb-2.5">'
    +'<div class="flex items-center gap-2">'
    +'<div class="w-9 h-9 rounded-lg bg-red-50 flex items-center justify-center"><i class="fas fa-house text-red-500 text-sm"></i></div>'
    +'<div><p class="text-[13px] font-bold text-gray-800">'+b.name+'</p>'
    +'<p class="text-[10px] text-gray-400"><span class="num">'+u.code+'</span> · '+u.area+' · '+u.name+'</p></div></div>'
    +'<span class="bg-red-100 text-red-500 text-[9px] font-bold px-1.5 py-0.5 rounded">'+b.overdue+'</span></div>'
    +'<div class="mb-1">'+wuyeTag(u.code)+'</div>'
    +'<div class="grid grid-cols-2 gap-2 bg-gray-50 rounded-lg p-2.5 text-[11px] mt-2">'
    +'<div><span class="text-gray-400">账单金额</span><p class="text-[16px] font-extrabold text-red-500 num mt-0.5">'+b.amount+'</p></div>'
    +'<div><span class="text-gray-400">应缴日期</span><p class="text-[12px] font-semibold text-gray-700 num mt-0.5">'+b.due+'</p></div></div>'
    +'<div class="flex gap-2 mt-3">'
    +'<a href="payment-records.html" class="flex-1 py-2.5 rounded-lg border border-gray-200 text-[12px] text-gray-600 text-center">账单详情</a>'
    +'<a onclick="payNow()" class="flex-[1.5] py-2.5 rounded-lg text-white text-[12px] font-bold text-center" style="background:linear-gradient(135deg,#FBBF24,#F59E0B)"><i class="fab fa-weixin text-[11px]"></i> 立即缴费</a>'
    +'</div></div></div>';
}
function payNow(){
  var u=wuyeCur();
  toast('已发起支付：'+u.code+' · '+(BILLS[u.code]||BILLS['1F-A08']).name+'（演示）');
}
function paintRecent(){
  document.getElementById('recentBox').innerHTML=PAY_RECORDS.slice(0,4).map(function(r){
    return '<div class="flex items-center gap-3 px-3.5 py-3 border-b border-gray-50 last:border-0">'
      +'<div class="w-8 h-8 rounded-lg '+r.cls+' flex items-center justify-center flex-shrink-0"><i class="fas '+r.icon+' text-xs"></i></div>'
      +'<div class="flex-1 min-w-0"><p class="text-[12px] font-medium text-gray-700">'+r.type+'</p>'
      +'<div class="flex items-center gap-1.5 mt-1 flex-wrap"><span class="text-[9px] text-gray-400 num">'+r.date+' · 微信支付</span>'+wuyeTag(r.unit)+'</div></div>'
      +'<span class="text-[12px] font-bold text-gray-700 num">'+r.amount+'</span></div>';
  }).join('');
}
document.getElementById('wuUnitBox').innerHTML=wuyePickerHtml({title:'缴费档口'});
wuyeFill();
paintBill();paintRecent();
function wuyeOnUnitChange(u){paintBill();toast('已切换至 '+u.code+' · '+u.name);}
</script>
</body>
</html>
