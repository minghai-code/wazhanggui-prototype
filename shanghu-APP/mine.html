<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的 - 袜掌柜商户版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#2563EB','primary-d':'#1D4ED8','primary-l':'#3B82F6'}}}}
</script>
<style>
:root{--p:#2563EB;--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.card{transition:transform .16s ease}
.card:active{transform:scale(.985)}
</style>
</head>
<body>

<!-- 顶部商户信息 -->
<div class="relative px-4 pt-2 pb-6 overflow-hidden">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#60A5FA"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#06B6D4"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-2">
    <div class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center text-white border border-white/30">
      <i class="fas fa-shop text-2xl"></i>
    </div>
    <div class="flex-1 text-white">
      <div class="flex items-center gap-1.5">
        <p class="font-extrabold text-[17px]">大唐袜业旗舰</p>
        <span class="bg-yellow-400/90 text-yellow-900 text-[8px] font-bold px-1.5 py-0.5 rounded-full"><i class="fas fa-crown text-[7px]"></i> 信用5星</span>
      </div>
      <p class="text-white/80 text-[11px] mt-1">入驻商户 · 1F-A08 · 男袜专营</p>
      <p class="text-white/70 text-[10px] mt-0.5">李老板 · 138****8000</p>
    </div>
  </div>
</div>

<!-- 店铺管理 -->
<div class="px-3 -mt-3 relative z-10">
  <div class="flex items-center gap-1.5 mb-2"><div class="w-1 h-3.5 rounded-full" style="background:#2563EB"></div><span class="text-[12px] font-bold text-gray-800">店铺管理</span></div>
  <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
    <a onclick="toast('店铺信息 · 店铺状态正常（单店模式）')" class="card flex items-center gap-3 px-3.5 py-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#3B82F6,#2563EB)"><i class="fas fa-shop text-sm"></i></div>
      <div class="flex-1"><p class="text-[13px] text-gray-800 font-medium">店铺信息</p><p class="text-[10px] text-gray-400 mt-0.5">营业中 · 入驻审核已通过 · 参与报价权限已开通</p></div>
      <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
    </a>
    <div class="h-px bg-gray-50"></div>
    <a href="shanghu-verify.html" class="card flex items-center gap-3 px-3.5 py-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#F59E0B,#D97706)"><i class="fas fa-shield-halved text-sm"></i></div>
      <div class="flex-1"><p class="text-[13px] text-gray-800 font-medium">企业资质认证</p><p class="text-[10px] text-gray-400 mt-0.5">认证通过后方可参与询价（招标 #10）</p></div>
      <span id="verifyBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">未认证</span>
    </a>
  </div>
</div>

<!-- 个人资料 -->
<div class="px-3 mt-3">
  <div class="flex items-center gap-1.5 mb-2"><div class="w-1 h-3.5 rounded-full" style="background:#2563EB"></div><span class="text-[12px] font-bold text-gray-800">个人资料</span></div>
  <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
    <a onclick="toast('个人资料 · 资料查看（与后台商户档案打通）')" class="card flex items-center gap-3 px-3.5 py-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#38BDF8,#0EA5E9)"><i class="fas fa-id-card text-sm"></i></div>
      <div class="flex-1"><p class="text-[13px] text-gray-800 font-medium">资料查看</p><p class="text-[10px] text-gray-400 mt-0.5">营业执照、经营类目、联系方式</p></div>
      <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
    </a>
    <div class="h-px bg-gray-50"></div>
    <a onclick="toast('资料更新 · 提交后需后台审核')" class="card flex items-center gap-3 px-3.5 py-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#A78BFA,#7C3AED)"><i class="fas fa-pen text-sm"></i></div>
      <div class="flex-1"><p class="text-[13px] text-gray-800 font-medium">资料更新</p><p class="text-[10px] text-gray-400 mt-0.5">变更后由平台运营审核（资料变更审核）</p></div>
      <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
    </a>
  </div>
</div>

<!-- 注册登录 -->
<div class="px-3 mt-3">
  <div class="flex items-center gap-1.5 mb-2"><div class="w-1 h-3.5 rounded-full" style="background:#2563EB"></div><span class="text-[12px] font-bold text-gray-800">账号</span></div>
  <div class="bg-white rounded-2xl shadow-soft overflow-hidden">
    <a onclick="toast('手机号：138****8000（已登录）')" class="card flex items-center gap-3 px-3.5 py-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-white" style="background:linear-gradient(135deg,#34D399,#10B981)"><i class="fas fa-mobile-screen text-sm"></i></div>
      <div class="flex-1"><p class="text-[13px] text-gray-800 font-medium">注册登录</p><p class="text-[10px] text-gray-400 mt-0.5">手机注册登录 / 微信一键登录</p></div>
      <span class="bg-green-50 text-green-600 text-[10px] font-bold px-1.5 py-0.5 rounded">已登录</span>
    </a>
    <div class="h-px bg-gray-50"></div>
    <a onclick="toast('已退出登录（演示）')" class="card flex items-center gap-3 px-3.5 py-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-500" style="background:#F3F4F6"><i class="fas fa-right-from-bracket text-sm"></i></div>
      <span class="flex-1 text-[13px] text-gray-800 font-medium">退出登录</span>
      <i class="fas fa-chevron-right text-gray-300 text-xs"></i>
    </a>
  </div>
  <p class="text-center text-[10px] text-gray-400 mt-4">袜掌柜商户版 v1.1.0 · 大唐袜业产业互联网平台</p>
</div>

<div class="h-24"></div>

<!-- 底部Tab栏（5Tab，我的高亮） -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100" style="height:65px;z-index:100;width:393px">
  <div class="flex justify-around items-center h-full" style="padding-bottom:10px">
    <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-house text-[18px]"></i><span class="text-[9px]">首页</span></a>
    <a href="orders.html" class="flex flex-col items-center gap-0.5 text-gray-400 relative"><i class="fas fa-clipboard-list text-[18px]"></i><span class="text-[9px]">订单</span><span class="absolute top-0 right-2 bg-primary text-white text-[7px] font-bold w-3.5 h-3.5 rounded-full flex items-center justify-center" style="min-width:14px;height:14px">12</span></a>
    <a href="workbench.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-briefcase text-[18px]"></i><span class="text-[9px]">工作台</span></a>
    <a href="property.html" class="flex flex-col items-center gap-0.5 text-gray-400"><i class="fas fa-building text-[18px]"></i><span class="text-[9px]">物业服务</span></a>
    <a href="mine.html" class="flex flex-col items-center gap-0.5" style="color:#2563EB"><i class="fas fa-user text-[18px]"></i><span class="text-[9px] font-semibold">我的</span></a>
  </div>
</div>
<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none">
  <div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div>
</div>

<script>
function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,40,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;white-space:nowrap';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500);}
</script>
<script>
// 企业资质认证状态回写"我的"（招标#10）：未认证/审核中/已认证·商户类型
var vs=localStorage.getItem('sh_verify')||'none';
var b=document.getElementById('verifyBadge');
if(vs==='reviewing'){b.textContent='审核中';b.className='text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-50 text-amber-600';}
else if(vs==='pass'){b.textContent='已认证 · 实力商家';b.className='text-[10px] font-bold px-1.5 py-0.5 rounded bg-green-50 text-green-600';}
</script>
</body>
</html>
