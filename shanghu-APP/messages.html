<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>客服消息 - 袜掌柜商户版</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
tailwind.config={theme:{extend:{colors:{primary:'#2563EB','primary-d':'#1D4ED8','primary-l':'#3B82F6'}}}}
</script>
<style>
:root{--p:#2563EB;--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:#F7F8FA;width:393px;overflow-x:hidden}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#dfdfdf;border-radius:1px}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.card{transition:transform .16s ease}
.card:active{transform:scale(.985)}
.no-bar::-webkit-scrollbar{display:none}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<!-- ===== 顶部（外采客服消息页复刻） ===== -->
<div style="background:#fff">
  <!-- iOS状态栏 -->
  <div class="flex justify-between items-center px-5 text-gray-700 text-sm font-semibold" style="height:36px;padding-top:8px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>

  <!-- 标题：客服（外采原样）+ 返回 -->
  <div class="flex items-center justify-between px-4 mt-1">
    <a href="home.html" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500"><i class="fas fa-chevron-left text-sm"></i></a>
    <span class="text-[16px] font-extrabold text-gray-900">客服</span>
    <a onclick="toast('客服设置')" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500"><i class="fas fa-gear text-sm"></i></a>
  </div>

  <!-- 主Tab：会话中 / 已结束（外采原样） -->
  <div class="flex items-center gap-6 px-4 mt-3 text-[14px] border-b border-gray-100" id="mainTabs">
    <a class="font-bold relative pb-2" style="color:#2563EB;border-bottom:2px solid #2563EB">会话中 <span class="num">(3)</span></a>
    <a onclick="switchMain(this,'已结束')" class="text-gray-500 pb-2">已结束 <span class="num">(1)</span></a>
  </div>
</div>

<!-- 状态条：在线 / 待接入（外采原样） -->
<div class="px-3 mt-2.5 flex items-center gap-2">
  <a onclick="toast('在线状态：营业中 9:00-18:00')" class="flex items-center gap-1.5 bg-white rounded-full px-3 py-1.5 shadow-soft text-[11px] text-gray-700">
    <span class="w-2 h-2 rounded-full bg-green-500"></span> 在线 <i class="fas fa-chevron-right text-[8px] text-gray-300"></i>
  </a>
  <a onclick="toast('当前无待接入会话')" class="flex items-center gap-1.5 bg-white rounded-full px-3 py-1.5 shadow-soft text-[11px] text-gray-700">
    <span class="num font-bold" style="color:#2563EB">0</span> 待接入 <i class="fas fa-chevron-right text-[8px] text-gray-300"></i>
  </a>
</div>

<!-- ===== 会话列表 ===== -->
<div class="px-3 py-3 space-y-2" style="padding-bottom:40px">

  <!-- 会话1（未读） -->
  <a onclick="toast('会话详情 · 外采客服页（演示）')" class="card flex items-center gap-3 bg-white rounded-2xl shadow-soft px-3.5 py-3 fade-up">
    <div class="w-11 h-11 rounded-full flex items-center justify-center text-white flex-shrink-0 text-[13px] font-bold" style="background:linear-gradient(135deg,#4F6BFF,#3B5BFF)">杭</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between">
        <p class="text-[13px] font-bold text-gray-800">杭州XX贸易·张经理</p>
        <span class="text-[9px] text-gray-400 flex-shrink-0 ml-2">10:24</span>
      </div>
      <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-1">张经理：这批精梳棉男袜 500 双能便宜点吗</p>
    </div>
    <span class="w-4.5 h-4.5 min-w-[18px] h-[18px] bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center flex-shrink-0 num">2</span>
  </a>

  <!-- 会话2（未读） -->
  <a onclick="toast('会话详情 · 外采客服页（演示）')" class="card flex items-center gap-3 bg-white rounded-2xl shadow-soft px-3.5 py-3 fade-up" style="animation-delay:.05s">
    <div class="w-11 h-11 rounded-full flex items-center justify-center text-white flex-shrink-0 text-[13px] font-bold" style="background:linear-gradient(135deg,#34D399,#059669)">上</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between">
        <p class="text-[13px] font-bold text-gray-800">上海花样百货</p>
        <span class="text-[9px] text-gray-400 flex-shrink-0 ml-2">09:47</span>
      </div>
      <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-1">买家：碎花短袜有黑色吗？要 200 双</p>
    </div>
    <span class="min-w-[18px] h-[18px] bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center flex-shrink-0 num">1</span>
  </a>

  <!-- 会话3（已读） -->
  <a onclick="toast('会话详情 · 外采客服页（演示）')" class="card flex items-center gap-3 bg-white rounded-2xl shadow-soft px-3.5 py-3 fade-up" style="animation-delay:.1s">
    <div class="w-11 h-11 rounded-full flex items-center justify-center text-white flex-shrink-0 text-[13px] font-bold" style="background:linear-gradient(135deg,#FBBF24,#D97706)">义</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between">
        <p class="text-[13px] font-bold text-gray-800">义乌批发商王老板</p>
        <span class="text-[9px] text-gray-400 flex-shrink-0 ml-2">昨天</span>
      </div>
      <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-1">我：好的，已安排今天发货，注意查收～</p>
    </div>
  </a>

  <!-- 已结束（示意，默认收起） -->
  <div id="endedBox" style="display:none">
    <div class="flex items-center gap-3 bg-white rounded-2xl shadow-soft px-3.5 py-3 opacity-70">
      <div class="w-11 h-11 rounded-full flex items-center justify-center text-white flex-shrink-0 text-[13px] font-bold" style="background:linear-gradient(135deg,#9CA3AF,#6B7280)">成</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between">
          <p class="text-[13px] font-medium text-gray-600">成都连锁便利店</p>
          <span class="text-[9px] text-gray-400 flex-shrink-0 ml-2">3天前</span>
        </div>
        <p class="text-[11px] text-gray-400 mt-0.5 line-clamp-1">会话已结束 · 评价 ★★★★★</p>
      </div>
    </div>
  </div>

</div>

<!-- Home Indicator -->
<div class="fixed bottom-0 left-0 right-0 flex justify-center" style="z-index:101;width:393px;pointer-events:none">
  <div style="width:134px;height:5px;background:#1A1A2E;border-radius:3px;margin-bottom:3px"></div>
</div>

<script>
function switchMain(el,name){
  document.querySelectorAll('#mainTabs a').forEach(function(a){a.style.color='#6b7280';a.style.fontWeight='400';a.style.borderBottom='2px solid transparent';});
  el.style.color='#2563EB';el.style.fontWeight='700';el.style.borderBottom='2px solid #2563EB';
  document.getElementById('endedBox').style.display=(name==='已结束')?'block':'none';
}
function toast(msg){var d=document.createElement('div');d.style.cssText='position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,20,40,.85);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:999;white-space:nowrap';d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},1500);}
</script>
</body>
</html>
