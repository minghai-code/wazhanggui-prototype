<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>资料查看 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.grad-h{background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#0EA5E9 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#60A5FA"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="mine.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">资料查看</span>
    <p class="text-white/85 text-[10px] mt-0.5">与后台商户档案打通（只读）</p></div>
  </div>
</div>

<div class="px-3 pt-4 pb-16">
  <!-- 实名信息 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3 fade-up">
    <p class="text-[12px] font-bold text-gray-800 mb-2.5"><i class="fas fa-id-card text-primary text-xs"></i> 实名信息</p>
    <div class="grid grid-cols-2 gap-y-2.5 text-[11px]">
      <span class="text-gray-400">真实姓名</span><span class="text-gray-700">李老板</span>
      <span class="text-gray-400">身份证号</span><span class="text-gray-700 num">3306**********1234</span>
      <span class="text-gray-400">手机号</span><span class="text-gray-700 num">138****8000</span>
    </div>
  </div>

  <!-- 企业信息 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3 fade-up">
    <div class="flex items-center gap-2 mb-2.5">
      <i class="fas fa-building-columns text-primary text-xs"></i>
      <p class="text-[12px] font-bold text-gray-800">企业信息</p>
      <span class="ml-auto text-[9px] font-bold px-1.5 py-0.5 rounded bg-blue-50 text-blue-600">企业主体</span>
    </div>
    <div class="grid grid-cols-2 gap-y-2.5 text-[11px]">
      <span class="text-gray-400">企业名称</span><span class="text-gray-700">大唐袜业旗舰</span>
      <span class="text-gray-400">统一社会信用代码</span><span class="text-gray-700 num">91330681XXXXXX1234</span>
      <span class="text-gray-400">法定代表人</span><span class="text-gray-700">李老板</span>
      <span class="text-gray-400">联系人</span><span class="text-gray-700">李老板</span>
    </div>
  </div>

  <!-- 经营信息 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 fade-up">
    <p class="text-[12px] font-bold text-gray-800 mb-2.5"><i class="fas fa-store text-primary text-xs"></i> 经营信息</p>
    <div class="grid grid-cols-2 gap-y-2.5 text-[11px]">
      <span class="text-gray-400">经营主体类型</span><span class="text-gray-700">个体工商户</span>
      <span class="text-gray-400">主营类目</span><span class="text-gray-700">男袜 · 女袜</span>
      <span class="text-gray-400">联系方式</span><span class="text-gray-700 num">138****8000</span>
      <span class="text-gray-400">商户类型</span><span class="text-gray-700">线上兼档口商户</span>
    </div>
    <p class="text-[10px] text-gray-400 mt-2.5"><i class="fas fa-circle-info mr-1"></i>如需变更企业信息 / 联系方式 / 资质 / 经营类目，请前往「资料更新」提交变更申请（<b>不含档口</b>）。</p>
  </div>

  <a href="profile-edit.html" class="card block w-full mt-4 py-3 rounded-2xl text-white text-[14px] font-bold text-center grad-h">去更新资料</a>
</div>

</body>
</html>
