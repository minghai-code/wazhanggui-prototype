<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>发布视频 - 视频看货</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#FFF7FA;--pk:#DB2777;--pk-l:#EC4899}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden;color:#1F2430}
::-webkit-scrollbar{width:2px;height:2px}
::-webkit-scrollbar-thumb{background:#f7cfe4;border-radius:1px}
.grad-h{background:linear-gradient(135deg,#F472B6 0%,#EC4899 45%,#DB2777 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(80,20,50,.07)}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:600;color:#374151;display:block;margin-bottom:6px}
.lbl b{color:#DC2626}
.lbl .sub{font-weight:400;color:#9CA3AF;font-size:9px}
.inp{width:100%;background:#F8F9FA;border:1px solid #F0F0F0;border-radius:12px;padding:10px 12px;font-size:12px;color:#1F2430;outline:none}
.inp:focus{border-color:#F9A8D4;background:#fff}
.cnt{font-size:9px;color:#9CA3AF;text-align:right;margin-top:4px}
.sheet{position:fixed;inset:0;z-index:300;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet-body{position:relative;width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px 26px;max-height:82vh;overflow-y:auto}
.sheet-bar{width:38px;height:4px;border-radius:2px;background:#E2E8F0;margin:0 auto 12px}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);max-width:300px;background:rgba(31,36,48,.94);color:#fff;font-size:12px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;z-index:400;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.up-box{border:1.5px dashed #F9A8D4;background:#FFF7FA;border-radius:14px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#DB2777}
.frame{width:52px;height:88px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;overflow:hidden;border:2px solid transparent}
.frame.on{border-color:#DB2777;box-shadow:0 0 0 2px #FBCFE8}
.pick-item{border:1.5px solid #EEF0F3;border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;background:#fff}
.pick-item.on{border-color:#DB2777;background:#FFF7FA}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="grad-h px-3.5 pt-2 pb-5">
  <div class="flex justify-between items-center text-white text-sm font-semibold" style="height:36px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="flex items-center gap-3 mt-1">
    <a href="shop-video.html" class="w-9 h-9 rounded-full bg-white/25 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div class="flex-1">
      <span class="text-white font-extrabold text-[18px]" id="pageTitle">发布视频</span>
      <p class="text-white/85 text-[9px] mt-0.5" id="pageSub">挂 1 个本店在售线上商品 · 提交后平台审核</p>
    </div>
  </div>
</div>

<div class="px-3 -mt-2 relative z-10 pb-28">

  <!-- 视频 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3">
    <label class="lbl">看货视频 <b>*</b> <span class="sub">mp4/mov · ≤200MB · ≤3 分钟</span></label>
    <div id="videoBox"></div>
    <p class="text-[9px] text-gray-400 mt-2"><i class="fas fa-circle-info mr-1"></i>竖屏拍摄、光线充足；建议拍产线/打包/成品质感；<b class="text-gray-500">请勿拍摄人脸与儿童</b></p>
  </div>

  <!-- 封面 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3">
    <label class="lbl">封面 <span class="sub">默认取首帧，可左右选帧</span></label>
    <div class="flex gap-2 items-center" id="frameBox"></div>
  </div>

  <!-- 标题描述 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3">
    <label class="lbl">标题 <b>*</b></label>
    <input id="title" class="inp" maxlength="30" placeholder="例：秋季加厚羊毛袜实拍" oninput="cnt('title','titleCnt')">
    <p class="cnt"><span id="titleCnt">0</span>/30</p>
    <label class="lbl mt-3">描述 <span class="sub">买家端播放流显示 2 行</span></label>
    <textarea id="desc" class="inp" rows="2" maxlength="100" placeholder="例：加厚美羊毛，工厂直发，支持一件代发" oninput="cnt('desc','descCnt')"></textarea>
    <p class="cnt"><span id="descCnt">0</span>/100</p>
  </div>

  <!-- 归属 + 商品 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3">
    <label class="lbl">归属店铺 <span class="sub">线上店铺（与线下铺位无关）</span></label>
    <div class="rounded-xl px-3 py-2.5 flex items-center gap-2" style="background:#F8FAFC">
      <i class="fas fa-shop text-[11px]" style="color:#DB2777"></i>
      <span class="text-[12px] text-gray-800 font-medium" id="shopTxt">大唐袜业旗舰</span>
      <span class="ml-auto text-[9px] px-1.5 py-0.5 rounded" style="background:#ECFDF5;color:#059669">营业中</span>
    </div>

    <label class="lbl mt-3">关联商品 <b>*</b> <span class="sub">单选 · 只列本店在售</span></label>
    <div id="goodsBox"></div>

    <div class="rounded-xl px-3 py-2 mt-2" style="background:#F8FAFC">
      <div class="flex items-center justify-between">
        <span class="text-[10px] text-gray-500">品类 <span class="text-gray-400">（随商品自动带出）</span></span>
        <span class="text-[11px] font-bold text-gray-700" id="catTxt">—</span>
      </div>
    </div>
    <p class="text-[9px] text-gray-400 mt-2"><i class="fas fa-circle-info mr-1"></i>品类由商品分类派生，不可手改；商品分类变更后视频品类自动跟随</p>
  </div>

  <div class="rounded-2xl px-3.5 py-3" style="background:#EFF6FF">
    <p class="text-[10px] leading-relaxed" style="color:#1D4ED8"><i class="fas fa-shield-halved mr-1"></i>提交后由平台运营审核，通过才出现在买家端「视频看货」；已上架视频修改后会自动转「待审核」并从买家端撤下。审核与精选由运营操作，端上不可设置。</p>
  </div>
</div>

<!-- 底部操作 -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-3 py-2.5 flex gap-2" style="width:393px;z-index:150">
  <button onclick="saveDraft()" class="flex-1 py-3 rounded-xl text-[13px] font-bold" style="background:#F1F5F9;color:#475569">保存草稿</button>
  <button onclick="submitAudit()" class="flex-[1.6] py-3 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#F472B6,#DB2777)">提交审核</button>
</div>

<!-- 商品选择 -->
<div class="sheet" id="gSheet">
  <div class="sheet-bg" onclick="closeSheet('gSheet')"></div>
  <div class="sheet-body">
    <div class="sheet-bar"></div>
    <p class="text-[15px] font-extrabold text-gray-900 text-center">选择关联商品</p>
    <p class="text-[10px] text-gray-400 text-center mt-1">只列本店在售线上商品 · 单选</p>
    <div class="mt-3 space-y-2" id="gList"></div>
    <button class="w-full mt-3 py-2.5 rounded-xl text-[12px] font-bold text-gray-500 bg-gray-100" onclick="closeSheet('gSheet')">取消</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="shop-video-data.js"></script>
<script>
var Q = new URLSearchParams(location.search);
var editId = Q.get('id') || '';
var isSwap = Q.get('swap') === '1';
var cur = editId ? vidGet(editId) : null;

var videoReady = !!cur;              // 已有视频即视为已转码
var uploading = false, upPct = 0;
var coverKey = cur ? cur.cover : 'a';
var goodsId = cur ? cur.goods : '';

function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('on')},2200);}
function cnt(a,b){document.getElementById(b).textContent=(document.getElementById(a).value||'').length;}
function closeSheet(id){document.getElementById(id).classList.remove('on');}

/* ---------- 视频上传 / 转码 ---------- */
function paintVideo(){
  var box = document.getElementById('videoBox');
  if (uploading) {
    box.innerHTML = '<div class="up-box" style="border-style:solid;border-color:#FBCFE8">'
      + '<i class="fas fa-spinner fa-spin text-lg"></i>'
      + '<p class="text-[11px] font-bold">转码中 '+upPct+'%</p>'
      + '<div style="width:70%;height:5px;border-radius:3px;background:#FCE7F3;overflow:hidden"><i style="display:block;height:100%;width:'+upPct+'%;background:linear-gradient(90deg,#F472B6,#DB2777)"></i></div>'
      + '<p class="text-[9px] text-gray-400">可离开本页，转码在后台继续</p></div>';
    return;
  }
  if (videoReady) {
    var cv = vidCover(coverKey);
    box.innerHTML = '<div class="flex gap-2.5">'
      + '<div style="width:78px;height:136px;border-radius:12px;background:'+cv[0]+';display:flex;align-items:center;justify-content:center;color:#fff;position:relative;flex-shrink:0">'
      + '<i class="fas '+cv[1]+' text-xl"></i><span style="position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.55);font-size:8px;padding:1px 4px;border-radius:4px">'+(cur?cur.dur:'0:36')+'</span></div>'
      + '<div class="flex-1">'
      +   '<p class="text-[11px] font-bold" style="color:#059669"><i class="fas fa-circle-check mr-1"></i>转码完成，可提交审核</p>'
      +   '<p class="text-[9px] text-gray-400 mt-1">源文件：VID_2026110'+(cur?'4':'3')+'_143022.mp4</p>'
      +   '<p class="text-[9px] text-gray-400 mt-0.5">时长 '+(cur?cur.dur:'0:36')+' · 竖屏 1080×1920</p>'
      +   '<button onclick="pickVideo()" class="mt-2 px-3 py-1.5 rounded-lg text-[10px] font-bold" style="background:#FFF7FA;color:#DB2777;border:1px solid #FBCFE8">重新选择视频</button>'
      + '</div></div>';
    return;
  }
  box.innerHTML = '<div class="up-box" onclick="pickVideo()">'
    + '<i class="fas fa-video text-xl"></i><p class="text-[11px] font-bold">拍摄或从相册选择</p>'
    + '<p class="text-[9px] text-gray-400">支持 mp4 / mov，最长 3 分钟</p></div>';
}
function pickVideo(){
  if (uploading) return;
  uploading = true; upPct = 0; paintVideo();
  var t = setInterval(function(){
    upPct += Math.floor(Math.random()*18)+12;
    if (upPct >= 100) { upPct = 100; clearInterval(t); uploading = false; videoReady = true; }
    paintVideo();
    if (upPct === 100) toast('上传并转码完成');
  }, 260);
}

/* ---------- 封面截帧 ---------- */
function paintFrames(){
  var keys = ['a','b','c','d','e'];
  document.getElementById('frameBox').innerHTML = keys.map(function(k,i){
    var cv = vidCover(k);
    return '<div class="frame '+(k===coverKey?'on':'')+'" style="background:'+cv[0]+'" onclick="pickFrame(\''+k+'\')">'
      + '<i class="fas '+cv[1]+'" style="font-size:14px;opacity:.9"></i>'
      + '<span style="position:absolute;bottom:2px;right:3px;font-size:7px;opacity:.8">'+(i*8)+'s</span></div>';
  }).join('') + '<div class="frame" style="border:1.5px dashed #F9A8D4;background:#FFF7FA;color:#DB2777;width:52px" onclick="toast(\'从相册选择封面图（建议 9:16）\')"><i class="fas fa-image" style="font-size:13px"></i></div>';
}
function pickFrame(k){ coverKey = k; paintFrames(); }

/* ---------- 商品 ---------- */
function paintGoods(){
  var box = document.getElementById('goodsBox');
  var g = vidGoods(goodsId);
  if (!g) {
    box.innerHTML = '<div onclick="openGoods()" class="rounded-xl px-3 py-3 flex items-center gap-2" style="background:#F8FAFC;border:1px dashed #E5E7EB">'
      + '<i class="fas fa-plus text-[11px] text-gray-400"></i><span class="text-[11px] text-gray-400">选择本店在售商品（必选 1 个）</span>'
      + '<i class="fas fa-chevron-right text-gray-300 text-[10px] ml-auto"></i></div>';
    document.getElementById('catTxt').textContent = '—';
    return;
  }
  box.innerHTML = '<div onclick="openGoods()" class="rounded-xl px-3 py-2.5 flex items-center gap-2.5" style="background:#FFF7FA;border:1px solid #FBCFE8">'
    + '<div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#FBCFE8,#F472B6);display:flex;align-items:center;justify-content:center"><i class="fas fa-socks text-white text-[12px]"></i></div>'
    + '<div class="flex-1 min-w-0"><p class="text-[11.5px] font-semibold text-gray-800 truncate">'+g.name+'</p>'
    + '<p class="text-[10px] mt-0.5"><b style="color:#F5222D">¥'+g.price.toFixed(2)+'</b><span class="text-gray-400">/'+g.unit+' · 库存 '+g.stock+'</span></p></div>'
    + '<span class="text-[9px] font-bold" style="color:#DB2777">更换</span></div>';
  document.getElementById('catTxt').textContent = g.cat;
}
function openGoods(){
  document.getElementById('gList').innerHTML = VID_GOODS.filter(function(g){return g.state==='在售';}).map(function(g){
    return '<div class="pick-item '+(g.id===goodsId?'on':'')+'" onclick="pickGoods(\''+g.id+'\')">'
      + '<div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#FBCFE8,#F472B6);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="fas fa-socks text-white"></i></div>'
      + '<div class="flex-1 min-w-0"><p class="text-[11.5px] font-semibold text-gray-800 truncate">'+g.name+'</p>'
      + '<p class="text-[10px] mt-0.5"><b style="color:#F5222D">¥'+g.price.toFixed(2)+'</b><span class="text-gray-400">/'+g.unit+' · 库存 '+g.stock+' · '+g.cat+'</span></p></div>'
      + (g.id===goodsId ? '<i class="fas fa-circle-check" style="color:#DB2777"></i>' : '<i class="fas fa-chevron-right text-gray-300 text-[10px]"></i>')
      + '</div>';
  }).join('');
  document.getElementById('gSheet').classList.add('on');
}
function pickGoods(id){ goodsId = id; closeSheet('gSheet'); paintGoods(); }

/* ---------- 保存 / 提交 ---------- */
function collect(){
  return {
    id: cur ? cur.id : ('V' + Date.now()),
    title: (document.getElementById('title').value || '').trim(),
    desc: (document.getElementById('desc').value || '').trim(),
    cover: coverKey,
    dur: cur ? cur.dur : '0:36',
    goods: goodsId,
    goodInvalid: false,
    state: '草稿',
    at: vidToday(),
    plays: cur ? cur.plays : 0,
    likes: cur ? cur.likes : 0,
    favs: cur ? cur.favs : 0,
    clicks: cur ? cur.clicks : 0,
    rejectWhy: '',
    offWhy: '',
    submitAt: cur ? cur.submitAt : '',
    auditAt: ''
  };
}
function validate(needGoods){
  if (!videoReady) { toast('请先上传视频，转码完成后才能保存'); return false; }
  var t = (document.getElementById('title').value || '').trim();
  if (t.length < 2) { toast('请填写标题（2–30 字）'); return false; }
  if (needGoods && !goodsId) { toast('商户上传的视频必须关联 1 个本店在售商品'); return false; }
  return true;
}
function saveDraft(){
  if (!validate(false)) return;
  var v = collect();
  v.state = '草稿';
  vidUpsert(v);
  toast('已保存草稿');
  setTimeout(function(){ location.href = 'shop-video.html'; }, 700);
}
function submitAudit(){
  if (!validate(true)) return;
  var g = vidGoods(goodsId);
  if (!g || g.state !== '在售') { toast('关联商品不在售，请更换'); return; }
  var v = collect();
  v.state = '待审核';
  v.submitAt = vidNow();
  vidUpsert(v);
  toast(cur && cur.state === '已上架' ? '已提交，原视频已从买家端撤下，待运营重新审核' : '已提交审核，通过后出现在买家端');
  setTimeout(function(){ location.href = 'shop-video.html'; }, 1100);
}

/* ---------- 初始化 ---------- */
(function init(){
  document.getElementById('shopTxt').textContent = VID_SHOP.name;
  if (cur) {
    document.getElementById('pageTitle').textContent = '编辑视频';
    document.getElementById('pageSub').textContent = isSwap ? '关联商品已失效，请更换后重新提交审核' : ('当前状态：' + cur.state + ' · 修改后转「待审核」');
    document.getElementById('title').value = cur.title || '';
    document.getElementById('desc').value = cur.desc || '';
    cnt('title','titleCnt'); cnt('desc','descCnt');
    if (isSwap) setTimeout(function(){ openGoods(); }, 300);
  }
  paintVideo(); paintFrames(); paintGoods();
})();
</script>
</body>
</html>
