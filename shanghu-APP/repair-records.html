<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的工单 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.grad-h{background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#0EA5E9 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.chip{font-size:11px;color:#6b7080;background:#fff;border:1px solid #eceef0;border-radius:999px;padding:5px 12px;white-space:nowrap}
.chip.on{color:#fff;font-weight:700;background:#2563EB;border-color:#2563EB}
.no-bar::-webkit-scrollbar{display:none}
.star{font-size:24px;color:#E5E7EB;cursor:pointer}.star.on{color:#F59E0B}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#60A5FA"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="repair.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">我的工单</span>
    <p class="text-white/85 text-[10px] mt-0.5">报修工单与处理进度</p></div>
  </div>
</div>

<div class="px-3 pt-4 pb-16">
  <div class="flex gap-1.5 mb-3 overflow-x-auto no-bar" id="chips"></div>
  <div class="space-y-2.5" id="list"></div>
</div>

<!-- 评价弹层 -->
<div id="rateMask" style="display:none" class="fixed inset-0 z-[200] flex items-end">
  <div class="absolute inset-0" style="background:rgba(15,23,42,.45)" onclick="closeRate()"></div>
  <div class="relative w-full bg-white rounded-t-3xl p-4 pb-8" onclick="event.stopPropagation()">
    <div class="w-10 h-1 rounded-full bg-gray-200 mx-auto mb-3"></div>
    <p class="text-[15px] font-extrabold text-gray-900 text-center">服务评价</p>
    <p class="text-[11px] text-gray-400 text-center mt-1" id="rateWho">—</p>
    <div class="flex justify-center gap-1.5 mt-3" id="stars">
      <i class="fas fa-star star" onclick="setStar(1)"></i><i class="fas fa-star star" onclick="setStar(2)"></i><i class="fas fa-star star" onclick="setStar(3)"></i><i class="fas fa-star star" onclick="setStar(4)"></i><i class="fas fa-star star" onclick="setStar(5)"></i>
    </div>
    <textarea id="rateTxt" class="w-full text-[12px] bg-gray-50 rounded-xl p-3 mt-3 outline-none" rows="2" placeholder="评价维修服务（选填）"></textarea>
    <a onclick="submitRate()" class="block w-full mt-3 py-3 rounded-xl text-white text-[13px] font-bold text-center grad-h">提交评价</a>
  </div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer;function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
var ORDERS=[
 {type:'照明灯故障',icon:'fa-lightbulb',loc:'1F-A08 商铺内',no:'WX20260715-03',state:'待处理',time:'07-15 10:20'},
 {type:'水管漏水',icon:'fa-faucet-drip',loc:'1F-A08 商铺内',no:'WX20260708-01',state:'已处理',time:'07-08 09:05',rate:false},
 {type:'卷帘门异响',icon:'fa-door-closed',loc:'1F-A08 商铺内',no:'WX20260620-05',state:'已处理',time:'06-20 15:40',rate:true},
 {type:'插座跳闸',icon:'fa-plug',loc:'1F-A08 商铺内',no:'WX20260512-02',state:'已撤销',time:'05-12 11:00'}
];
var filter='全部',curRate=null,score=0;
function chipsRender(){var all=['全部','待处理','已处理','已撤销'];document.getElementById('chips').innerHTML=all.map(function(c){return '<a onclick="setF(\''+c+'\')" class="chip'+(c===filter?' on':'')+'">'+c+'</a>';}).join('');}
function setF(c){filter=c;chipsRender();render();}
function stBadge(s){if(s==='待处理')return 'text-amber-600 bg-amber-50';if(s==='已处理')return 'text-green-600 bg-green-50';return 'text-gray-500 bg-gray-100';}
function render(){
  var arr=ORDERS.filter(function(o){return filter==='全部'||o.state===filter;});
  document.getElementById('list').innerHTML=arr.length?arr.map(function(o,i){
    var act='';
    if(o.state==='待处理')act='<a onclick="toast(\'工单详情（演示）\')" class="text-[11px] text-primary font-medium">查看进度</a>';
    else if(o.state==='已处理')act=o.rate?'<a onclick="toast(\'已评价 ★★★★★\')" class="text-[11px] text-gray-400">已评价</a>':'<a onclick="openRate('+ORDERS.indexOf(o)+')" class="text-[11px] text-primary font-bold">去评价 ›</a>';
    return '<div class="card bg-white rounded-2xl shadow-soft px-3.5 py-3">'
      +'<div class="flex items-start gap-3">'
      +'<div class="w-9 h-9 rounded-lg bg-blue-50 flex items-center justify-center flex-shrink-0"><i class="fas '+o.icon+' text-primary text-sm"></i></div>'
      +'<div class="flex-1 min-w-0"><div class="flex items-center gap-1.5"><p class="text-[13px] font-bold text-gray-800">'+o.type+'</p><span class="'+stBadge(o.state)+' text-[9px] font-bold px-1.5 py-0.5 rounded">'+o.state+'</span></div>'
      +'<p class="text-[10px] text-gray-400 mt-0.5">'+o.loc+' · '+o.no+'</p>'
      +'<p class="text-[9px] text-gray-400 mt-0.5">提交 '+o.time+'</p></div>'
      +'<div class="flex-shrink-0 self-center">'+act+'</div>'
      +'</div></div>';
  }).join(''):'<div class="text-center text-[12px] text-gray-400 py-10">暂无工单</div>';
}
function openRate(idx){curRate=idx;score=0;document.querySelectorAll('#stars .star').forEach(function(s){s.classList.remove('on')});document.getElementById('rateTxt').value='';document.getElementById('rateWho').textContent=ORDERS[idx].type+' · '+ORDERS[idx].no;document.getElementById('rateMask').style.display='flex';}
function closeRate(){document.getElementById('rateMask').style.display='none';}
function setStar(n){score=n;document.querySelectorAll('#stars .star').forEach(function(s,i){s.classList.toggle('on',i<n);});}
function submitRate(){if(!score){toast('请先打分');return;}ORDERS[curRate].rate=true;closeRate();render();toast('评价已提交，感谢反馈');}
chipsRender();render();
</script>
</body>
</html>
