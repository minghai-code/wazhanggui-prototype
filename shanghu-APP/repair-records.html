<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的工单 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#F59E0B;--bg:#FFFBEB}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.num{font-variant-numeric:tabular-nums}
.card{transition:transform .16s ease}
.card:active{transform:scale(.98)}
.no-bar::-webkit-scrollbar{display:none}
.chip{font-size:11px;padding:5px 11px;border-radius:999px;background:#fff;color:#64748B;white-space:nowrap;box-shadow:0 1px 6px rgba(20,40,80,.06)}
.chip.on{background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;font-weight:700}
.st{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-bg{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet-body{position:relative;width:100%;background:#fff;border-radius:24px 24px 0 0;padding:12px 16px 28px;max-height:88vh;overflow-y:auto}
.sheet-bar{width:38px;height:4px;border-radius:2px;background:#E2E8F0;margin:0 auto 12px}
.ph{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:#fff;position:relative;overflow:hidden}
.ph.before{background:linear-gradient(135deg,#F87171,#DC2626)}
.ph.after{background:linear-gradient(135deg,#34D399,#059669)}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);padding:2px 5px;font-size:9px}
.tl{position:relative;padding-left:14px}
.tl:before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:#E2E8F0}
.tl-i{position:relative;padding-bottom:10px;font-size:11px;color:#64748B;line-height:1.55}
.tl-i:before{content:'';position:absolute;left:-14px;top:5px;width:6px;height:6px;border-radius:50%;background:#F59E0B}
.tl-i b{color:#1F2430}
.star{font-size:22px;color:#E2E8F0;transition:.15s}
.star.on{color:#F59E0B}
.tagp{font-size:11px;padding:5px 10px;border-radius:999px;background:#F1F5F9;color:#64748B;border:1px solid transparent}
.tagp.on{background:#FFFBEB;color:#B45309;border-color:#FCD34D;font-weight:600}
.toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);max-width:300px;background:rgba(31,36,48,.94);color:#fff;font-size:12px;line-height:1.5;padding:10px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.22s;z-index:300;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#F59E0B 0%,#D97706 50%,#B45309 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#FCD34D"></div>
  <div class="absolute -top-6 right-[-30px] w-48 h-48 rounded-full blur-3xl opacity-40" style="background:#FBBF24"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="repair.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">我的工单</span>
    <p class="text-white/85 text-[10px] mt-0.5">报修进度 · 完成确认 · 服务评价</p></div>
  </div>
</div>

<div class="px-3 pt-4 pb-16">
  <div class="flex gap-1.5 mb-3 overflow-x-auto no-bar" id="chips"></div>
  <div class="space-y-2.5" id="list"></div>
</div>

<!-- 详情弹层 -->
<div class="sheet" id="dtSheet">
  <div class="sheet-bg" onclick="closeSheet('dtSheet')"></div>
  <div class="sheet-body" id="dtBody"></div>
</div>

<!-- 评价弹层 -->
<div class="sheet" id="rateSheet">
  <div class="sheet-bg" onclick="closeSheet('rateSheet')"></div>
  <div class="sheet-body">
    <div class="sheet-bar"></div>
    <p class="text-[15px] font-extrabold text-gray-900 text-center">服务评价</p>
    <p class="text-[11px] text-gray-400 text-center mt-1" id="rateWho">—</p>
    <div class="flex justify-center gap-2 mt-3" id="stars"></div>
    <p class="text-[11px] font-semibold text-gray-700 mt-4 mb-2">标签（可多选）</p>
    <div class="flex flex-wrap gap-2" id="tagBox"></div>
    <textarea id="rateTxt" class="w-full text-[12px] bg-gray-50 rounded-xl p-3 mt-3 outline-none" rows="2" placeholder="补充评价（选填）"></textarea>
    <a onclick="submitRate()" class="block w-full mt-3 py-3 rounded-xl text-white text-[13px] font-bold text-center" style="background:linear-gradient(135deg,#F59E0B,#D97706)">提交评价</a>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
var toastTimer;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},2400);}

var STC={'待受理':'text-amber-600 bg-amber-50','已派单':'text-blue-600 bg-blue-50','处理中':'text-blue-600 bg-blue-50',
  '待采购':'text-orange-600 bg-orange-50','待确认':'text-purple-600 bg-purple-50','已完成':'text-green-600 bg-green-50',
  '已驳回':'text-gray-500 bg-gray-100'};
var TABS=['全部','待受理','已派单','处理中','待采购','待确认','已完成','已驳回'];
var RATE_TAGS=['响应快','态度好','修得好','解释清楚','有点慢','没修好'];

/* 与 repair.html 同源 */
var SEED=[
  {no:'BX202610-0031', type:'照明', icon:'fa-lightbulb', unit:'1F-A08', addr:'商铺内东侧',
   desc:'商铺内主照明灯不亮，影响营业', urg:'紧急', photos:1, state:'待确认',
   createdAt:'2026-10-27 08:40', acceptBy:'物业 张××', worker:'维修工 李××', arriveAt:'2026-10-27 11:30',
   resultDesc:'已更换 LED 灯管 2 支并测试正常', before:1, after:1, staffConfirmed:false, star:0,
   logs:[['2026-10-27 08:40','提交报修（照片 1 张）'],['2026-10-27 08:52','物业受理，指派 维修工 李××'],
     ['2026-10-27 11:30','维修工到场'],['2026-10-27 12:10','提交处理结果（含处理后照片 1 张）→ 待你确认']]},
  {no:'BX202610-0030', type:'水电', icon:'fa-faucet-drip', unit:'1F-A08', addr:'后场洗手池',
   desc:'后场洗手池下水缓慢，疑似管道堵塞', urg:'一般', photos:1, state:'已派单',
   createdAt:'2026-10-27 09:15', acceptBy:'物业 张××', worker:'维修工 王××', arriveAt:'2026-10-27 14:00',
   resultDesc:'', before:1, after:0, staffConfirmed:false, star:0,
   logs:[['2026-10-27 09:15','提交报修'],['2026-10-27 09:40','物业受理，指派 维修工 王××（预计 14:00 到场）']]},
  {no:'BX202610-0028', type:'空调', icon:'fa-wind', unit:'1F-A08', addr:'商铺内',
   desc:'出风口风量明显变小', urg:'一般', photos:1, state:'处理中',
   createdAt:'2026-10-26 16:30', acceptBy:'物业 张××', worker:'维修工 赵××', arriveAt:'2026-10-27 09:00',
   resultDesc:'', before:1, after:0, staffConfirmed:false, star:0,
   logs:[['2026-10-26 16:30','提交报修'],['2026-10-27 08:10','物业受理，指派 维修工 赵××'],['2026-10-27 09:00','维修工到场排查中']]},
  {no:'BX202610-0027', type:'地砖', icon:'fa-border-all', unit:'1F-A08', addr:'商铺门口',
   desc:'门口地砖破损 2 块，需更换', urg:'一般', photos:1, state:'待采购',
   createdAt:'2026-10-19 08:10', acceptBy:'物业 张××', worker:'维修工 李××', arriveAt:'2026-10-19 10:00',
   resultDesc:'已清理破损地砖并临时围挡，需采购同规格地砖 12 块', before:1, after:1, staffConfirmed:false, star:0,
   logs:[['2026-10-19 08:10','提交报修'],['2026-10-19 09:30','物业受理'],['2026-10-19 11:20','提交结果：需采购物料 → 待采购']]},
  {no:'BX202610-0024', type:'门窗', icon:'fa-door-closed', unit:'1F-A08', addr:'卷帘门内侧',
   desc:'卷帘门把手断裂', urg:'一般', photos:1, state:'已完成',
   createdAt:'2026-10-25 09:10', acceptBy:'物业 张××', worker:'维修工 赵××', arriveAt:'2026-10-25 10:00',
   resultDesc:'更换把手 1 套，开关正常', before:1, after:1, staffConfirmed:true, star:5, tags:['修得好','态度好'],
   logs:[['2026-10-25 09:10','提交报修'],['2026-10-25 09:40','物业受理'],['2026-10-25 11:20','提交处理结果'],
     ['2026-10-25 14:00','你已确认完成并评价 5 星']]},
  {no:'BX202610-0023', type:'其他', icon:'fa-ellipsis', unit:'1F-A08', addr:'商铺内',
   desc:'店内自有货架损坏', urg:'一般', photos:1, state:'已驳回',
   createdAt:'2026-10-24 15:20', rejectWhy:'属商户自有设施，非平台物业维修范围，请自行处理',
   before:1, after:0, staffConfirmed:false, star:0,
   logs:[['2026-10-24 15:20','提交报修'],['2026-10-24 16:40','物业驳回：属商户自有设施']]}
];
function getBX(){
  try{var s=localStorage.getItem('sh_bx_v2');if(s)return JSON.parse(s);}catch(e){}
  localStorage.setItem('sh_bx_v2',JSON.stringify(SEED));
  return SEED.slice();
}
function saveBX(list){localStorage.setItem('sh_bx_v2',JSON.stringify(list));}

var filter='全部', curIdx=-1, score=0, picked=[];

function tabOf(o){return o.state;}
function chipsRender(){
  document.getElementById('chips').innerHTML=TABS.map(function(c){
    return '<a onclick="setF(\''+c+'\')" class="chip'+(c===filter?' on':'')+'">'+c+'</a>';
  }).join('');
}
function setF(c){filter=c;chipsRender();render();}

function render(){
  var all=getBX();
  var arr=all.filter(function(o){return filter==='全部'||tabOf(o)===filter;});
  if(!arr.length){
    document.getElementById('list').innerHTML='<div class="text-center text-[12px] text-gray-400 py-12">'
      +'<i class="fas fa-inbox text-xl text-gray-300 block mb-2"></i>该分类下暂无工单</div>';
    return;
  }
  document.getElementById('list').innerHTML=arr.map(function(o){
    var idx=all.indexOf(o);
    var hint='';
    if(o.state==='待受理')hint='<span style="color:#B45309">已提交，等待物业受理</span>';
    else if(o.state==='已派单')hint='<span style="color:#2563EB">'+o.worker+' 已接单，预计 '+o.arriveAt+' 到场</span>';
    else if(o.state==='处理中')hint='<span style="color:#2563EB">'+o.worker+' 处理中</span>';
    else if(o.state==='待采购')hint='<span style="color:#EA580C">需采购物料，物料到货后继续维修</span>';
    else if(o.state==='待确认')hint='<span style="color:#7C3AED;font-weight:600">维修已完成，请确认 ›</span>';
    else if(o.state==='已完成')hint=o.star?'<span style="color:#10B981">已修复 · 已评价 '+o.star+' 星</span>':'<span style="color:#10B981">已修复 · 待评价</span>';
    else if(o.state==='已驳回')hint='<span style="color:#DC2626">已驳回</span>';

    var act='';
    if(o.state==='待确认'){
      act='<div class="flex gap-2 mt-2.5">'
        +'<button onclick="event.stopPropagation();rejectFix('+idx+')" class="flex-1 py-2 rounded-lg text-[11px] font-bold" style="background:#FEF2F2;color:#DC2626">未修好</button>'
        +'<button onclick="event.stopPropagation();confirmFix('+idx+')" class="flex-1 py-2 rounded-lg text-white text-[11px] font-bold" style="background:linear-gradient(135deg,#F59E0B,#D97706)">确认完成</button>'
        +'</div>';
    }else if(o.state==='已完成'&&!o.star){
      act='<div class="mt-2.5"><button onclick="event.stopPropagation();openRate('+idx+')" class="w-full py-2 rounded-lg text-[11px] font-bold" style="background:#FFFBEB;color:#B45309;border:1px solid #FCD34D">去评价</button></div>';
    }

    return '<div class="card bg-white rounded-2xl shadow-soft px-3.5 py-3" onclick="openDetail('+idx+')">'
      +'<div class="flex items-start gap-3">'
      +'<div class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center flex-shrink-0"><i class="fas '+o.icon+' text-primary text-sm"></i></div>'
      +'<div class="flex-1 min-w-0">'
      +'<div class="flex items-center gap-1.5"><p class="text-[13px] font-bold text-gray-800">'+o.type+' · '+o.addr+'</p><span class="st '+STC[o.state]+'">'+o.state+'</span></div>'
      +'<p class="text-[10px] text-gray-400 mt-0.5 num">'+o.no+' · '+o.createdAt+'</p>'
      +'<p class="text-[10px] mt-1">'+hint+'</p></div>'
      +'<i class="fas fa-chevron-right text-[10px] text-gray-300 self-center"></i>'
      +'</div>'+act+'</div>';
  }).join('');
}

/* ================= 详情 ================= */
function closeSheet(id){document.getElementById(id).classList.remove('on');}
function openDetail(idx){
  var o=getBX()[idx];
  var h='<div class="sheet-bar"></div>';
  h+='<div class="flex items-center justify-between mb-3">'
    +'<div><p class="text-[15px] font-extrabold text-gray-900">'+o.type+' · '+o.addr+'</p>'
    +'<p class="text-[10px] text-gray-400 num mt-0.5">'+o.no+'</p></div>'
    +'<span class="st '+STC[o.state]+'">'+o.state+'</span></div>';

  h+='<div class="rounded-xl p-3 mb-3" style="background:#F8FAFC">'
    +'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">报修位置</span><span>'+o.unit+' · '+o.addr+'</span></div>'
    +'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">紧急程度</span><span>'+(o.urg==='紧急'?'<span style="color:#DC2626">紧急</span>':'一般')+'</span></div>'
    +'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">问题描述</span><span class="text-right max-w-[210px]">'+o.desc+'</span></div>'
    +(o.worker?'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">维修工</span><span>'+o.worker+'</span></div>':'')
    +(o.arriveAt?'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">到场时间</span><span>'+o.arriveAt+'</span></div>':'')
    +(o.rejectWhy?'<div class="flex justify-between text-[11px] py-0.5"><span class="text-gray-400">驳回原因</span><span class="text-right max-w-[210px]" style="color:#DC2626">'+o.rejectWhy+'</span></div>':'')
    +'</div>';

  if(o.state==='待确认'||o.state==='已完成'||o.state==='待采购'){
    h+='<p class="text-[11px] font-semibold text-gray-700 mb-2">处理前后对比</p>'
      +'<div class="grid grid-cols-2 gap-2 mb-3">'
      +'<div class="ph before" style="height:104px"><i class="fas fa-image text-base"></i>报修照片<span class="cap">你提交 · '+o.createdAt.slice(5)+'</span></div>'
      +'<div class="ph after" style="height:104px"><i class="fas fa-image text-base"></i>处理后照片<span class="cap">物业提交</span></div>'
      +'</div>'
      +'<div class="rounded-xl p-2.5 mb-3" style="background:#F0FDF4;border:1px solid #BBF7D0">'
      +'<p class="text-[11px] text-green-800 leading-relaxed"><b>维修说明：</b>'+o.resultDesc+'</p></div>';
  }

  h+='<p class="text-[11px] font-semibold text-gray-700 mb-2">处理进度</p><div class="tl mb-3">'
    +(o.logs||[]).map(function(l){return '<div class="tl-i"><b>'+l[0]+'</b>　'+l[1]+'</div>';}).join('')
    +'</div>';

  if(o.state==='待确认'){
    h+='<div class="rounded-xl p-2.5 mb-3" style="background:#F5F3FF;border:1px solid #DDD6FE">'
      +'<p class="text-[10px] text-purple-700 leading-relaxed"><i class="fas fa-circle-info mr-1"></i>请先核对上方前后照片。确认完成或 3 天后系统自动完成；<b>未修好</b>将退回物业重新处理。</p></div>'
      +'<div class="flex gap-2">'
      +'<button onclick="closeSheet(\'dtSheet\');rejectFix('+idx+')" class="flex-1 py-3 rounded-xl text-[12px] font-bold" style="background:#FEF2F2;color:#DC2626">未修好</button>'
      +'<button onclick="closeSheet(\'dtSheet\');confirmFix('+idx+')" class="flex-1 py-3 rounded-xl text-white text-[12px] font-bold" style="background:linear-gradient(135deg,#F59E0B,#D97706)">确认完成</button>'
      +'</div>';
  }else if(o.state==='已完成'&&!o.star){
    h+='<button onclick="closeSheet(\'dtSheet\');openRate('+idx+')" class="w-full py-3 rounded-xl text-[12px] font-bold" style="background:#FFFBEB;color:#B45309;border:1px solid #FCD34D">去评价</button>';
  }else{
    h+='<button onclick="closeSheet(\'dtSheet\')" class="w-full py-3 rounded-xl text-[12px] font-semibold text-gray-500" style="background:#F1F5F9">关闭</button>';
  }
  document.getElementById('dtBody').innerHTML=h;
  document.getElementById('dtSheet').classList.add('on');
}

/* ================= 确认 / 未修好 ================= */
function confirmFix(idx){
  var list=getBX();var o=list[idx];
  o.state='已完成';o.staffConfirmed=true;
  o.logs=o.logs||[];
  o.logs.push(['2026-10-28 10:20','你已确认完成']);
  saveBX(list);render();
  toast('已确认完成，工单闭环'+(o.star?'':'，可给本次维修评价'));
  setTimeout(function(){openRate(idx);},600);
}
function rejectFix(idx){
  var list=getBX();var o=list[idx];
  o.state='处理中';o.staffConfirmed=false;
  o.logs=o.logs||[];
  o.logs.push(['2026-10-28 10:20','你反馈「未修好」→ 已退回物业重新处理']);
  saveBX(list);render();
  toast('已反馈未修好，工单退回物业重新处理（已通知维修工与主管）');
}

/* ================= 评价 ================= */
function openRate(idx){
  curIdx=idx;score=0;picked=[];
  var o=getBX()[idx];
  document.getElementById('rateWho').textContent=o.type+' · '+o.no;
  document.getElementById('stars').innerHTML=[1,2,3,4,5].map(function(n){
    return '<i class="fas fa-star star" onclick="setStar('+n+')"></i>';
  }).join('');
  document.getElementById('tagBox').innerHTML=RATE_TAGS.map(function(t){
    return '<span class="tagp" onclick="pickTag(this,\''+t+'\')">'+t+'</span>';
  }).join('');
  document.getElementById('rateTxt').value='';
  document.getElementById('rateSheet').classList.add('on');
}
function setStar(n){
  score=n;
  document.querySelectorAll('#stars .star').forEach(function(s,i){s.classList.toggle('on',i<n);});
}
function pickTag(el,t){
  var i=picked.indexOf(t);
  if(i>-1){picked.splice(i,1);el.classList.remove('on');}
  else{picked.push(t);el.classList.add('on');}
}
function submitRate(){
  if(!score){toast('请先打分');return;}
  var list=getBX();var o=list[curIdx];
  o.star=score;
  o.tags=picked.slice();
  o.cmt=document.getElementById('rateTxt').value.trim();
  o.logs=o.logs||[];
  o.logs.push(['2026-10-28 10:25','你已评价 '+score+' 星'+(picked.length?'（'+picked.join('、')+'）':'')]);
  saveBX(list);
  closeSheet('rateSheet');render();
  toast('评价已提交，感谢反馈'+(score<=3?'（我们会安排回访）':''));
}

chipsRender();render();
</script>
</body>
</html>
