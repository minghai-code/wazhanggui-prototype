<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>资讯详情 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.grad-h{background:linear-gradient(135deg,#0EA5E9 0%,#0284C7 55%,#0369A1 100%)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<!-- 顶部 -->
<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#7DD3FC"></div>
  <div class="relative flex items-center justify-between mt-1">
    <a href="home.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <h1 class="text-white font-extrabold text-[18px]">资讯详情</h1>
    <div class="w-9"></div>
  </div>
  <p class="relative text-white/80 text-[11px] mt-2"><i class="fas fa-newspaper"></i> 行业资讯 · 内容管理下发</p>
</div>

<!-- 正文 -->
<div class="px-3 mt-3 mb-6">
  <div class="bg-white rounded-2xl shadow-soft p-4 fade-up">
    <div class="flex items-center gap-2 mb-2">
      <span id="nTag" class="bg-sky-50 text-sky-600 text-[9px] font-bold px-1.5 py-0.5 rounded">市场动态</span>
    </div>
    <h2 id="nTitle" class="text-[17px] font-bold text-gray-800 leading-snug"></h2>
    <div class="flex items-center gap-2 mt-2 text-[10px] text-gray-400">
      <span id="nSrc"><i class="fas fa-newspaper"></i> 行业观察</span>
      <span>·</span>
      <span id="nDate">2026-07-12</span>
    </div>
    <div class="h-px bg-gray-50 my-3"></div>
    <div id="nBody" class="text-[13px] text-gray-700 leading-relaxed space-y-2.5"></div>
  </div>
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mt-3">
    <p class="text-[12px] font-bold text-gray-800 mb-2.5"><i class="fas fa-fire text-orange-400 text-xs"></i> 相关资讯</p>
    <div id="relList" class="space-y-2"></div>
  </div>
</div>

<script>
// 与首页行业资讯对应的正文（内容管理资讯下发，模拟）
var NEWS=[
 {tag:'市场动态',cls:'bg-sky-50 text-sky-600',title:'2026上半年针织袜出口数据：同比增长12.4%',src:'中国针织工业协会',date:'2026-07-18',
  body:['据中国针织工业协会统计，2026年上半年我国针织袜出口额同比增长 12.4%，其中对东盟、中东市场增长最为明显。','<b>结构亮点：</b>功能性运动袜、抗菌防臭袜等中高端品类占比提升至 38%，出口单价同比上涨 6.2%。','业内预计，随着秋冬订单提前放量，下半年出口有望延续增长态势。']},
 {tag:'产业资讯',cls:'bg-emerald-50 text-emerald-600',title:'诸暨袜业数字化车间改造提速，产能提升约30%',src:'诸暨日报',date:'2026-07-16',
  body:['今年以来，诸暨大唐袜业加快数字化车间改造，已有 40 余家规上企业完成智能袜机与 MES 系统上线。','<b>成效：</b>平均产能提升约 30%，用工减少 20%，产品一次合格率提升至 98.5%。','当地经信部门表示，将继续以数字化转型补贴政策支持企业技改。']},
 {tag:'政策解读',cls:'bg-amber-50 text-amber-600',title:'中小企业数字化转型补贴申报要点解读',src:'平台运营',date:'2026-07-14',
  body:['2026年度中小企业数字化转型补贴申报已启动，符合条件的企业最高可获 50 万元补贴。','<b>申报要点：</b>① 规上袜企优先；② 需提供数字化改造合同、发票与验收报告；③ 补贴按实际投入的 20%-30% 核定。','<b>截止时间：</b>2026年8月31日，逾期不再受理。']},
 {tag:'市场动态',cls:'bg-sky-50 text-sky-600',title:'秋冬保暖袜订单提前放量，工厂排产至10月',src:'行业观察',date:'2026-07-12',
  body:['受气温与电商大促备货影响，秋冬保暖袜订单较往年提前约一个月放量。','多个工厂反馈当前排产已至 10 月，原料以羊毛、加绒混纺为主。','建议商户提前锁定原料与产能，避免旺季交期紧张。']}
];
function getParam(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):null;}
var id=parseInt(getParam('id')||'0',10);if(isNaN(id)||id<0||id>=NEWS.length)id=0;
var n=NEWS[id];
document.getElementById('nTag').textContent=n.tag;
document.getElementById('nTag').className=n.cls+' text-[9px] font-bold px-1.5 py-0.5 rounded';
document.getElementById('nTitle').textContent=n.title;
document.getElementById('nSrc').innerHTML='<i class="fas fa-newspaper"></i> '+n.src;
document.getElementById('nDate').textContent=n.date;
document.getElementById('nBody').innerHTML=n.body.map(function(p){return '<p>'+p+'</p>';}).join('');
document.getElementById('relList').innerHTML=NEWS.map(function(x,i){
  if(i===id)return '';
  return '<a href="shanghu-news-detail.html?id='+i+'" class="flex items-center gap-2 py-2 border-b border-gray-50 last:border-0">'
    +'<span class="'+x.cls+' text-[8px] font-bold px-1 py-0.5 rounded flex-shrink-0">'+x.tag+'</span>'
    +'<p class="flex-1 min-w-0 text-[12px] text-gray-700 line-clamp-1">'+x.title+'</p>'
    +'<i class="fas fa-chevron-right text-gray-300 text-[10px]"></i>'
    +'</a>';
}).join('');
</script>
</body>
</html>
