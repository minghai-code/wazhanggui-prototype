<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>店铺信息 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F6FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.grad-h{background:linear-gradient(135deg,#2563EB 0%,#1D4ED8 55%,#0EA5E9 100%)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.fade-up{animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="relative px-4 pt-2 pb-5 overflow-hidden grad-h">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#60A5FA"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="mine.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]">店铺信息</span>
    <p class="text-white/85 text-[10px] mt-0.5">线上店铺资料（电商模块）</p></div>
  </div>
</div>

<div class="px-3 pt-4 pb-16">
  <!-- 状态卡 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3 fade-up">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center text-white flex-shrink-0" style="background:linear-gradient(135deg,#3B82F6,#2563EB)"><i class="fas fa-shop text-lg"></i></div>
      <div class="flex-1"><p class="text-[14px] font-bold text-gray-800">大唐袜业旗舰</p><p class="text-[10px] text-gray-400 mt-0.5">店铺状态：<b class="text-green-600">营业中</b> · 单店模式</p></div>
      <a onclick="toast('查看线上店铺（外采商城 · 演示）')" class="text-[11px] font-bold text-primary">查看店铺 ›</a>
    </div>
  </div>

  <!-- 数据 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3 fade-up">
    <div class="grid grid-cols-4 text-center">
      <div><p class="text-[16px] font-extrabold text-gray-800 num">4.9</p><p class="text-[10px] text-gray-400 mt-0.5">店铺评分</p></div>
      <div><p class="text-[16px] font-extrabold text-gray-800 num">1280</p><p class="text-[10px] text-gray-400 mt-0.5">累计订单</p></div>
      <div><p class="text-[16px] font-extrabold text-gray-800 num">36</p><p class="text-[10px] text-gray-400 mt-0.5">在售商品</p></div>
      <div><p class="text-[16px] font-extrabold text-gray-800 num">512</p><p class="text-[10px] text-gray-400 mt-0.5">店铺粉丝</p></div>
    </div>
  </div>

  <!-- 店铺资料 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 fade-up">
    <div class="flex items-center justify-between mb-2.5">
      <p class="text-[12px] font-bold text-gray-800">店铺资料</p>
      <a onclick="toast('编辑店铺资料（演示）')" class="text-[11px] font-bold text-primary"><i class="fas fa-pen text-[9px]"></i> 编辑</a>
    </div>
    <div class="grid grid-cols-2 gap-y-2.5 text-[11px]">
      <span class="text-gray-400">店铺名称</span><span class="text-gray-700">大唐袜业旗舰</span>
      <span class="text-gray-400">主营类目</span><span class="text-gray-700">男袜 · 女袜</span>
      <span class="text-gray-400">客服电话</span><span class="text-gray-700 num">138****8000</span>
      <span class="text-gray-400">营业时间</span><span class="text-gray-700 num">9:00–18:00</span>
      <span class="text-gray-400">发货地址</span><span class="text-gray-700">诸暨市大唐袜业城 1F-A08</span>
    </div>
    <div class="mt-2.5 bg-gray-50 rounded-lg p-2.5 text-[10px] text-gray-500">店铺简介：主营男女袜品批发，支持小批量起批，量大从优，欢迎到店看货或线上询价。</div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer;function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
</script>
</body>
</html>
