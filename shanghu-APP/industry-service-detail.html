<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>产业服务详情 - 袜掌柜商户版</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#F0F9FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);width:393px;overflow-x:hidden}
.card{transition:transform .16s ease}.card:active{transform:scale(.985)}
.shadow-soft{box-shadow:0 2px 12px rgba(20,40,80,.06)}
.inp{width:100%;background:rgba(248,249,250,.8);border:1px solid rgba(240,240,240,.8);border-radius:12px;padding:11px 13px;font-size:13px;color:#1F2430;outline:none}
.inp::placeholder{color:#C0C0C0}.inp:focus{border-color:#0EA5E9;background:#fff}
.lbl{font-size:11px;color:#6b7080;font-weight:500;display:block;margin-bottom:6px}.lbl b{color:#0EA5E9}
.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%) scale(.9);background:rgba(15,18,26,.92);color:#fff;padding:13px 20px;border-radius:14px;font-size:13px;z-index:300;opacity:0;transition:.2s;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
<link rel="stylesheet" href="tailwind.css">
</head>
<body>

<div class="relative px-4 pt-2 pb-5 overflow-hidden" style="background:linear-gradient(135deg,#0EA5E9 0%,#0284C7 50%,#0369A1 100%)">
  <div class="absolute -top-12 -left-10 w-44 h-44 rounded-full blur-3xl opacity-50" style="background:#7DD3FC"></div>
  <div class="relative flex justify-between items-center text-white text-sm font-semibold" style="height:40px">
    <span>9:41</span>
    <div class="flex items-center gap-1.5"><i class="fas fa-signal text-xs"></i><i class="fas fa-wifi text-xs"></i><span class="text-xs">75%</span><i class="fas fa-battery-three-quarters text-sm"></i></div>
  </div>
  <div class="relative flex items-center gap-3 mt-1">
    <a href="industry-service.html" class="w-9 h-9 rounded-full bg-white/20 backdrop-blur flex items-center justify-center text-white"><i class="fas fa-chevron-left text-sm"></i></a>
    <div><span class="text-white font-extrabold text-[18px]" id="hTitle">服务详情</span>
    <p class="text-white/85 text-[10px] mt-0.5">服务商与服务项目由平台后台配置</p></div>
  </div>
</div>

<div class="px-3 pt-4 pb-16" id="formBox">
  <!-- 服务信息 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5 mb-3">
    <div class="flex items-start gap-2.5 mb-3">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white flex-shrink-0" id="sIcon" style="background:linear-gradient(135deg,#0EA5E9,#0284C7)"><i class="fas fa-vial-circle-check"></i></div>
      <div class="flex-1 min-w-0">
        <p class="text-[14px] font-bold text-gray-800" id="sName">袜子质量检测认证</p>
        <p class="text-[10px] text-gray-400 mt-0.5">服务商：<span id="sAgency">大唐检测认证中心</span>（平台配置）</p>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-y-2.5 text-[11px]">
      <span class="text-gray-400">服务内容</span><span class="text-gray-700" id="sScope">抗菌/防臭/色牢度/纤维含量全项检测，出具权威报告</span>
      <span class="text-gray-400">计费方式</span><span class="text-gray-700" id="sCharge">按样品计费</span>
      <span class="text-gray-400">价格</span><span class="text-gray-700 num font-bold" id="sPrice">¥500 起</span>
      <span class="text-gray-400">服务周期</span><span class="text-gray-700 num" id="sPeriod">5-7 个工作日</span>
    </div>
  </div>

  <!-- 申请信息 -->
  <div class="bg-white rounded-2xl shadow-soft p-3.5">
    <p class="text-[12px] font-bold text-gray-800 mb-3">提交服务申请</p>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <div><label class="lbl">联系人 <b>*</b></label><input class="inp" value="李老板"></div>
      <div><label class="lbl">联系电话 <b>*</b></label><input class="inp" value="138****8000"></div>
    </div>
    <div class="mb-3"><label class="lbl">样品 / 需求数量 <b>*</b></label><input class="inp" placeholder="如：3 个样品 / 5000 双"></div>
    <div class="mb-3"><label class="lbl">需求说明</label><textarea class="inp" rows="3" placeholder="补充检测项目 / 打样要求 / 申报条件等"></textarea></div>
    <div class="mb-1"><label class="lbl">附件（选填）</label>
      <div class="border-[1.5px] border-dashed border-gray-300 rounded-xl p-4 text-center" onclick="toast('选择附件')"><i class="fas fa-paperclip text-gray-300 text-xl"></i><p class="text-[10px] text-gray-400 mt-1">上传样品照片 / 图纸 / 材料</p></div>
    </div>
  </div>
</div>

<!-- 提交结果 -->
<div class="px-3 pt-4 pb-16" id="doneBox" style="display:none">
  <div class="bg-white rounded-2xl shadow-soft p-4 text-center">
    <div class="w-14 h-14 mx-auto rounded-full flex items-center justify-center" style="background:linear-gradient(135deg,#34D399,#10B981)"><i class="fas fa-check text-white text-xl"></i></div>
    <p class="text-[15px] font-bold text-gray-800 mt-3">申请已提交</p>
    <p class="text-[11px] text-gray-500 mt-1">服务商将尽快联系您；可在「产业服务申请 → 我的申请」查看进度。</p>
    <a href="industry-service.html" class="card block w-full mt-3 py-2.5 rounded-xl text-white text-[13px] font-bold" style="background:linear-gradient(135deg,#0EA5E9,#0284C7)">返回产业服务</a>
  </div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-3 py-2.5 flex gap-2" style="z-index:100;width:393px;padding-bottom:18px" id="footBar">
  <a onclick="location.href='industry-service.html'" class="flex-1 py-3 rounded-xl border border-gray-200 text-[13px] text-gray-600 font-medium text-center">取消</a>
  <a onclick="submitForm()" class="flex-1 py-3 rounded-xl text-white text-[13px] font-bold text-center" style="background:linear-gradient(135deg,#0EA5E9,#0284C7)">提交申请</a>
</div>

<div class="toast" id="toast"><span id="toastTxt">操作成功</span></div>
<script>
var toastTimer;function toast(m){var t=document.getElementById('toast');document.getElementById('toastTxt').textContent=m;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('on')},1800)}
var SVC={
 jianyan:{name:'袜子质量检测认证',agency:'大唐检测认证中心',scope:'抗菌/防臭/色牢度/纤维含量全项检测，出具权威报告',charge:'按样品计费',price:'¥500 起',period:'5-7 个工作日',icon:'fa-vial-circle-check',bg:'linear-gradient(135deg,#0EA5E9,#0284C7)'},
 dayang:{name:'袜子定制打样服务',agency:'大唐打样中心',scope:'花型/材质/版型定制打样，3天出样，满意再批量',charge:'按款计费',price:'¥200 起',period:'3-5 天',icon:'fa-scissors',bg:'linear-gradient(135deg,#8B5CF6,#6366F1)'},
 zhengce:{name:'袜业产业扶持资金申报',agency:'诸暨市经信局',scope:'设备升级/品牌建设/技术创新补贴，符合条件即可申请',charge:'免费申报',price:'免费',period:'按申报期',icon:'fa-file-signature',bg:'linear-gradient(135deg,#10B981,#059669)'},
 zhichan:{name:'花型版权登记与保护',agency:'知产服务平台',scope:'原创花型/款式版权登记，侵权监测与维权',charge:'按件计费',price:'¥300 起',period:'10 个工作日',icon:'fa-shield-halved',bg:'linear-gradient(135deg,#EC4899,#DB2777)'}
};
function getParam(k){var m=location.search.match(new RegExp('[?&]'+k+'=([^&]+)'));return m?decodeURIComponent(m[1]):null;}
var s=SVC[getParam('svc')]||SVC.jianyan;
document.getElementById('hTitle').textContent=s.name;
document.getElementById('sName').textContent=s.name;
document.getElementById('sAgency').textContent=s.agency;
document.getElementById('sScope').textContent=s.scope;
document.getElementById('sCharge').textContent=s.charge;
document.getElementById('sPrice').textContent=s.price;
document.getElementById('sPeriod').textContent=s.period;
var ic=document.getElementById('sIcon');ic.style.background=s.bg;ic.innerHTML='<i class="fas '+s.icon+'"></i>';
function submitForm(){document.getElementById('formBox').style.display='none';document.getElementById('footBar').style.display='none';document.getElementById('doneBox').style.display='block';window.scrollTo(0,0);}
</script>
</body>
</html>
